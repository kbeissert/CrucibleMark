# Model Generation Overrides
# Use this file for manual corrections of edge cases where automatic classification fails.
# 
# Auto-classification handles 80-90% of models correctly. Only add entries here when:
# 1. Metrics are ambiguous (e.g., high Reasoning Score but no RL training)
# 2. Model is API-only or too large for local benchmarking (Gen 3)
# 3. Benchmark detects false positive (e.g., slow due to quantization, not reasoning)
#
# Format:
# model_name:
#   generation: "Gen X (...)"
#   reason: "Detailed explanation why override is needed"
#   last_reviewed: "YYYY-MM-DD"
#   next_review: "YYYY-MM-DD"  # Quarterly reviews
#   confidence: "HIGH" | "MEDIUM" | "LOW"
#   sources: ["url1", "url2"]  # Optional: Papers, announcements
#   manual_only: true  # Optional: Never auto-override this entry

overrides:

