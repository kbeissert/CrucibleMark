runner_environment:
  active_profile: apple_silicon_m4
  profiles:
    apple_silicon_m4:
      type: local_unified
      description: Apple Silicon M4, 24GB Unified Memory (Shared RAM/VRAM)
      compute_unit: CPU/Metal
      ram_gb: 24
    nvidia_rtx4090:
      type: local_dedicated
      description: NVIDIA RTX 4090, 24GB VRAM, 64GB System RAM
      compute_unit: CUDA
      ram_gb: 64
llm_judge:
  enabled: true
  mode: complement
  provider:
    name: anthropic
    model: claude-haiku-4-5-20251001
    max_tokens: 8192
  scoring:
    scale: 5
    require_reasoning: true
    fail_on_parse_error: false
  sub_scores:
    task_compliance:
      label: Task Compliance
      description: "Wurde die Aufgabe vollst\xE4ndig und korrekt erf\xFCllt?"
      scale: 5
    output_quality:
      label: Output Quality
      description: "Ist der Output klar, pr\xE4zise und professionell?"
      scale: 5
    standard_adherence:
      label: Standard Adherence
      description: Werden Fach-Standards und Best Practices korrekt angewendet?
      scale: 5
  applicable_modules:
  - code_quality
  - ux_writing
  - documentation_quality
  - content_transformation
  - cultural_intelligence
  - cli_benchmark
  - reasoning
llm_review:
  enabled: true
  provider:
    name: google
    model: gemini-2.5-pro
    # name: anthropic
    # model: claude-haiku-4-5-20251001
    max_tokens: 8192
defaults:
  generation:
    temperature: 0.1
    repeat_penalty: 1.1
    top_k: 40
    top_p: 0.9
    num_predict: 8192
  token_limits:
    default_max: 8192
    fallback_cascade:
    - 4096
    - 2048
    - 1024
providers:
  commercial:
    mistral:
      name: Mistral AI
      api_type: mistral
      model_type: proprietary_api
      enabled: true
      env_var: MISTRAL_API_KEY
      models:
      - id: mistral-large-latest
        name: Mistral Large (123B)
        description: Beste Reasoning-Performance
      - id: mistral-medium-latest
        name: Mistral Medium
        description: Ausgeglichenes Preis/Leistung
    anthropic:
      name: Anthropic
      api_type: anthropic
      model_type: proprietary_api
      enabled: true
      max_tokens: 8192
      fallback_max_tokens: 4096
      env_var: ANTHROPIC_API_KEY
      models:
      - id: claude-sonnet-4-6
        name: Claude 4.6 Sonnet
        description: Ausgewogene Performance & Kosten (Golden Standard)
      - id: claude-opus-4-6
        name: Claude 4.6 Opus
        description: "H\xF6chste Intelligenz, erweitertes Reasoning"
      - id: claude-sonnet-4-5-20250929
        name: Claude 4.5 Sonnet
        description: 'Legacy: State of the Art (2025)'
      - id: claude-opus-4-5-20251101
        name: Claude 4.5 Opus
        description: "Legacy: H\xF6chste Qualit\xE4t (2025)"
      - id: claude-haiku-4-5-20251001
        name: Claude 4.5 Haiku
        description: 'Legacy: High-Speed Intelligence (2025)'
    openai:
      name: OpenAI
      api_type: openai
      model_type: proprietary_api
      enabled: true
      env_var: OPENAI_API_KEY
      models:
      - id: o1
        name: o1
        description: Reasoning Flagship
      - id: gpt-4o
        name: GPT-4o
        description: Robust Omni Model
      - id: gpt-4o-mini
        name: GPT-4o Mini
        description: Fast Omni Model
      - id: gpt-5.4
        name: GPT-5.4
        description: "Neuestes Modell (M\xE4rz 2026)"
      - id: gpt-5.4-mini
        name: GPT-5.4 Mini
        description: "Schnell & effizient (M\xE4rz 2026)"
      - id: gpt-5
        name: GPT-5
        description: Optimierte Leistung (2026)
      - id: gpt-5-mini
        name: GPT-5 Mini
        description: Schnell & kosteneffizient
    google:
      name: Google Gemini
      api_type: google
      model_type: proprietary_api
      enabled: true
      env_var: GOOGLE_API_KEY
      models:
      - id: gemini-3.1-pro-preview
        name: Gemini 3.1 Pro
        description: "Leistungsst\xE4rkstes Modell, multimodales Reasoning (2026,\
          \ Preview)"
      - id: gemini-3-flash-preview
        name: Gemini 3 Flash
        description: Frontier-Performance zu einem Bruchteil der Kosten (Preview)
      - id: gemini-2.5-pro
        name: Gemini 2.5 Pro
        description: Fortschrittlichstes stabiles Modell, Reasoning & Coding
    xai:
      name: xAI (Grok)
      api_type: xai
      model_type: proprietary_api
      enabled: true
      env_var: XAI_API_KEY
      models:
      - id: grok-3
        name: Grok 3
        description: Starkes Reasoning & Wissen
      - id: grok-3-mini
        name: Grok 3 Mini
        description: Effizient & schnell
    groq:
      name: Groq Cloud
      api_type: groq
      model_type: open_weights_cloud
      enabled: true
      env_var: GROQ_API_KEY
      models:
      - id: meta-llama/llama-4-scout-17b-16e-instruct
        name: Llama 4 Scout (17B) Instruct
      - id: llama-3.3-70b-versatile
        name: Llama 3.3 (70B) Versatile
      - id: qwen/qwen3-32b
        name: Qwen 3 (32B) via Groq
      - id: moonshotai/kimi-k2-instruct
        name: Kimi K2 Instruct via Groq
    ollama_cloud:
      name: Ollama (Cloud Proxies)
      api_type: ollama
      model_type: open_weights_cloud
      enabled: true
      auto_discover: true
      models_filter: cloud
  local:
    config:
      context_window: 32768
      default_temperature: 0.1
      # Models that cannot use the global context_window due to native architecture limits.
      # Ollama silently falls back to the model's native context if VRAM is insufficient —
      # setting the real limit here makes the constraint explicit and surfaces it as
      # token_limit_fallback=True in CSV/audit logs instead of a silent truncation.
      model_context_overrides:
        # Mistral-Nemo architecture: native 4096-token context window
        "mistral-nemo": 4096
        "dolphin-mistral-nemo": 4096
    ollama_local:
      name: Ollama (Local)
      api_type: ollama
      auto_discover: true
      models_filter: local
output:
  directory: benchmark_scores
  commercial_csv: benchmark_scores/commercial_models_benchmark.csv
  cloud_models_csv: benchmark_scores/cloud_models_benchmark.csv
  local_models_csv: benchmark_scores/local_models_benchmark.csv
  leaderboard_csv: benchmark_scores/benchmark_leaderboard.csv
  web_export_dir: ../cruciblemark-web/src/_data/raw/
  streaming_output_commercial_providers: false
logging:
  file_path: logs/crucible.log
  console_level: INFO
  file_level: DEBUG
modules:
  code_quality:
    path: benchmark_modules/code_quality
    enabled: true
  cli_benchmark:
    path: benchmark_modules/cli_benchmark
    enabled: true
  reasoning:
    path: benchmark_modules/reasoning_logic
    enabled: true
  ux_writing:
    path: benchmark_modules/ux_writing
    enabled: true
  documentation_quality:
    path: benchmark_modules/documentation_quality
    enabled: true
  content_transformation:
    path: benchmark_modules/content_transformation
    enabled: true
  cultural_intelligence:
    path: benchmark_modules/cultural_intelligence
    enabled: true
  political_compass:
    path: benchmark_modules/political_compass
    enabled: false
scoring_tiers:
  platinum:
    threshold: 95.0
    badge: "\U0001F48E Platinum"
    prompt_description: '- **Ab {threshold}% (Platin-Standard, SOTA Elite):** Absolute
      Spitzenliga.'
  gold:
    threshold: 80.0
    badge: "\U0001F3C6 Gold"
    prompt_description: "- **Ab {threshold}% bis unter {next_threshold}% (Gold-Standard,\
      \ Excellent/Good):** Hervorragende, verl\xE4ssliche Modelle."
  silver:
    threshold: 65.0
    badge: "\U0001F948 Silver"
    prompt_description: '- **Ab {threshold}% bis unter {next_threshold}% (Silber-Standard,
      Adequate):** Sehr solide Basis. The model performs adequately.'
  bronze:
    threshold: 50.0
    badge: "\U0001F949 Bronze"
    prompt_description: "- **Ab {threshold}% bis unter {next_threshold}% (Bronze-Standard):**\
      \ Akzeptable Leistung mit Einschr\xE4nkungen."
  standard:
    threshold: 0.0
    badge: "\u2696\uFE0F Standard"
    prompt_description: "- **Unter {next_threshold}% (Standard/Fail):** Suboptimale\
      \ Leistung, oft ungeeignet f\xFCr komplexe Agenten-Aufgaben."

# Token-Budget-Schwellwerte pro Modul (Anzahl Output-Tokens, ab der 1.5× Overhead als Verbosity-Flag gilt)
# Module ohne Eintrag werden NICHT geflaggt (z.B. reasoning, reasoning_metacog).
# Werte basieren auf empirischen Medianen aus den ersten Benchmark-Runs (April 2026).
token_budgets:
  cultural_intelligence: 500
  ux_writing: 3500
  content_transformation: 3500
  documentation_quality: 6000
  code_quality: 6000

# Separates Budget für Reasoning-Modelle (o1, o3, gpt-5).
# Bei Reasoning-Modellen fressen interne CoT-Tokens das max_completion_tokens-Budget mit—
# 'token_budgets' kontrolliert Output-Compliance, diese Werte kontrollieren das
# Gesamtkontingent (Thinking + sichtbarer Output). Fallback: 5× das Standard-Budget.
# 'reasoning' und 'reasoning_metacog' bleiben weiterhin ohne jedes Limit.
token_budgets_reasoning_models:
  cultural_intelligence: 2500
  ux_writing: 8000
  content_transformation: 8000
  documentation_quality: 12000
  code_quality: 12000
