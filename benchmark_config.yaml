# ============================================================
# CrucibleMark - Benchmark Configuration
# ============================================================
# Struktur der Datei:
# 1. Golden Standard (Referenz-Modell)
# 2. Provider & Modelle (Commercial & Local)
# 3. Output-Konfiguration
# 4. Test-Module Registry (ganz unten)

# Golden Standard Configuration
# -----------------------------
# Definiert DEN einen Golden Standard für alle Benchmarks.
# Alle lokalen Modelle werden mit diesem Referenz-Modell verglichen.
# Der Provider muss in 'providers.commercial' existieren und enabled sein.

golden_standard:
  provider: "anthropic"  # Referenz zu providers.commercial.anthropic
  model: "claude-sonnet-4-5-20250929"  # Welches Modell für Referenz-Benchmark
  description: "Claude 4.5 Sonnet als Referenz für Benchmark Tests"

# Provider Configuration
# ----------------------
# Definiert verfügbare LLM-Provider und deren Modelle.
# Alle aktivierten Provider können für Tests verwendet werden.
# Der Golden Standard (oben definiert) wird als Referenz für Vergleiche genutzt.

providers:
  commercial:
    mistral:
      name: "Mistral AI"
      api_type: "mistral"
      enabled: true
      env_var: "MISTRAL_API_KEY"
      models:
        - id: "mistral-large-latest"
          name: "Mistral Large (123B)"
          description: "Beste Reasoning-Performance"
        - id: "mistral-medium-latest"
          name: "Mistral Medium"
          description: "Ausgeglichenes Preis/Leistung"
    
    anthropic:
      name: "Anthropic"
      api_type: "anthropic"
      enabled: true
      # Der API-Key gehört NICHT hierher, sondern in die .env Datei oder .zshrc!
      # Tragen Sie hier nur den Namen der Variable ein.
      # Beispiel .env: ANTHROPIC_API_KEY=sk-ant-...
      env_var: "ANTHROPIC_API_KEY"
      models:
        - id: "claude-sonnet-4-5-20250929"
          name: "Claude 4.5 Sonnet"
          description: "State of the Art (2025)"
        - id: "claude-opus-4-5-20251101"
          name: "Claude 4.5 Opus"
          description: "Höchste Qualität, großes Kontextfenster"
        - id: "claude-haiku-4-5-20251001"
          name: "Claude 4.5 Haiku"
          description: "High-Speed Intelligence (Active)"
        - id: "claude-3-haiku-20240307"
          name: "Claude 3 Haiku"
          description: "Legacy Efficiency Model"
    
    openai:
      name: "OpenAI"
      api_type: "openai"
      enabled: false
      env_var: "OPENAI_API_KEY"
      models:
        - id: "gpt-5"
          name: "GPT-5"
          description: "Optimierte Leistung (2026)"
        - id: "gpt-5-mini"
          name: "GPT-5 Mini"
          description: "Schnell & kosteneffizient"
        # Hinweis: o3-Modelle erfordern OpenAI Tier 1+
        - id: "o3-mini"
          name: "o3 Mini"
          description: "Reasoning (Deep Thinking)"
  
  local:
    ollama:
      name: "Ollama (Local)"
      api_type: "ollama"
      # Modelle werden dynamisch von Ollama abgefragt
      auto_discover: true

# Output Configuration
# --------------------
output:
  directory: "benchmark_scores"
  commercial_csv: "benchmark_scores/commercial_models_benchmark.csv"
  local_models_csv: "benchmark_scores/local_models_benchmark.csv"
  golden_standard_csv: "benchmark_scores/golden_standard_benchmark.csv"
  leaderboard_csv: "benchmark_scores/benchmark_leaderboard.csv"
  streaming_output_commercial_providers: true  # true | false | "Force" (Force disables streaming)

# ====================
# Test-Module Registry
# ====================
# Jedes Modul muss folgende Struktur haben:
#   - test.py mit TestClass (erbt von BaseTest)
#   - assets/ Verzeichnis mit Test-Assets
#   - config.yaml mit Modul-Metadaten
#   - README.md mit Dokumentation
#
# HINWEIS: Details wie version, description, scoring, etc. werden
# ab v0.9 direkt aus der moduleigenen 'config.yaml' geladen (SSOT).

modules:
  code_quality:
    path: "benchmark_modules/code_quality"
    enabled: true

  ux_writing:
    path: "benchmark_modules/ux_writing"
    enabled: true

  documentation_quality:
    path: "benchmark_modules/documentation_quality"
    enabled: true

  content_transformation:
    path: "benchmark_modules/content_transformation"
    enabled: true

  cultural_intelligence:
    path: "benchmark_modules/cultural_intelligence"
    enabled: true

  reasoning:
    path: "benchmark_modules/reasoning_logic"
    enabled: true

  political_compass:
    path: "benchmark_modules/political_compass"
    enabled: true

