llm_judge:
  enabled: true
  mode: complement
  provider:
    # ANTROPHIC
    # name: anthropic          # PRIMARY: Claude Haiku (schnell, konsistent)
    # model: claude-haiku-4-5-20251001
    # max_tokens: 4096

    # GOOGLE
    name: google
    model: gemini-2.5-pro
    max_tokens: 8192

    unload_delay_ms: 1500
    fallback:
      name: ollama             # FALLBACK: nur wenn kein API-Key
      model: ministral-3:14b
      max_tokens: 4096
  scoring:
    scale: 5
    require_reasoning: true
    fail_on_parse_error: false
  sub_scores:
    task_compliance:
      label: "Task Compliance"
      description: "Wurde die Aufgabe vollständig und korrekt erfüllt?"
      scale: 5
    output_quality:
      label: "Output Quality"
      description: "Ist der Output klar, präzise und professionell?"
      scale: 5
    standard_adherence:
      label: "Standard Adherence"
      description: "Werden Fach-Standards und Best Practices korrekt angewendet?"
      scale: 5
  # Nur Module die hier gelistet sind werden vom LLM-Judge bewertet. Alle anderen Module werden vom Regex/Rule Scorer bewertet.
  applicable_modules:
    - code_quality
    - ux_writing
    - documentation_quality
    - content_transformation
    - cultural_intelligence
    - reasoning

llm_review:
  enabled: true
  provider:
    name: google
    model: gemini-2.5-pro
    max_tokens: 8192

# ============================================================
# CrucibleMark - Benchmark Configuration
# ============================================================
# Struktur der Datei:
# 1. Golden Standard (Referenz-Modell)
# 2. Provider & Modelle (Commercial & Local)
# 3. Output-Konfiguration
# 4. Test-Module Registry (ganz unten)

# Golden Standard Configuration
# -----------------------------
# Definiert DEN einen Golden Standard für alle Benchmarks.
# Alle lokalen Modelle werden mit diesem Referenz-Modell verglichen.
# Der Provider muss in 'providers.commercial' existieren und enabled sein.

golden_standard:
  provider: "anthropic"  # Referenz zu providers.commercial.anthropic
  model: "claude-sonnet-4-6"  # Welches Modell für Referenz-Benchmark
  description: "Claude 4.6 Sonnet als Referenz für Benchmark Tests (Feb 2026)"

# Global Generation Defaults
# --------------------------
# Fallback-Werte für alle Benchmarks.
# Werden verwendet, wenn ein Modul (config.yaml) keine eigenen Werte definiert.
defaults:
  generation:
    temperature: 0.1
    repeat_penalty: 1.1
    top_k: 40
    top_p: 0.9
    num_predict: 8192

# Provider Configuration
# ----------------------
# Definiert verfügbare LLM-Provider und deren Modelle.
# Alle aktivierten Provider können für Tests verwendet werden.
# Der Golden Standard (oben definiert) wird als Referenz für Vergleiche genutzt.

providers:

  commercial:
    mistral:
      name: "Mistral AI"
      api_type: "mistral"
      enabled: true
      env_var: "MISTRAL_API_KEY"
      models:
        - id: "mistral-large-latest"
          name: "Mistral Large (123B)"
          description: "Beste Reasoning-Performance"
        - id: "mistral-medium-latest"
          name: "Mistral Medium"
          description: "Ausgeglichenes Preis/Leistung"

    anthropic:
      name: "Anthropic"
      api_type: "anthropic"
      enabled: true
      # Der API-Key gehört NICHT hierher, sondern in die .env Datei oder .zshrc!
      # Tragen Sie hier nur den Namen der Variable ein.
      # Beispiel .env: ANTHROPIC_API_KEY=sk-ant-...
      env_var: "ANTHROPIC_API_KEY"
      models:
        # Claude 4.6 Series (Feb 2026 - Current Generation, API-verified)
        - id: "claude-sonnet-4-6"
          name: "Claude 4.6 Sonnet"
          description: "Ausgewogene Performance & Kosten (Golden Standard)"
        - id: "claude-opus-4-6"
          name: "Claude 4.6 Opus"
          description: "Höchste Intelligenz, erweitertes Reasoning"
        # Claude 4.5 Series (2025 - Legacy)
        - id: "claude-sonnet-4-5-20250929"
          name: "Claude 4.5 Sonnet"
          description: "Legacy: State of the Art (2025)"
        - id: "claude-opus-4-5-20251101"
          name: "Claude 4.5 Opus"
          description: "Legacy: Höchste Qualität (2025)"
        - id: "claude-haiku-4-5-20251001"
          name: "Claude 4.5 Haiku"
          description: "Legacy: High-Speed Intelligence (2025)"
        # Claude 3 Series (Legacy - 2024)
        - id: "claude-3-haiku-20240307"
          name: "Claude 3 Haiku"
          description: "Legacy: Efficiency Model (2024)"

    openai:
      name: "OpenAI"
      api_type: "openai"
      enabled: false
      env_var: "OPENAI_API_KEY"
      models:
        - id: "gpt-5"
          name: "GPT-5"
          description: "Optimierte Leistung (2026)"
        - id: "gpt-5-mini"
          name: "GPT-5 Mini"
          description: "Schnell & kosteneffizient"
        # Hinweis: o3-Modelle erfordern OpenAI Tier 1+
        - id: "o3-mini"
          name: "o3 Mini"
          description: "Reasoning (Deep Thinking)"

    google:
      name: "Google Gemini"
      api_type: "google"
      enabled: true
      # Der API-Key gehört NICHT hierher, sondern in die .env Datei oder .zshrc!
      # Beispiel .env: GOOGLE_API_KEY=AIzaSy...
      env_var: "GOOGLE_API_KEY"
      models:
        # Gemini 3 Series (Feb 2026 - Neuste Generation, Preview)
        - id: "gemini-3.1-pro-preview"
          name: "Gemini 3.1 Pro"
          description: "Leistungsstärkstes Modell, multimodales Reasoning (2026, Preview)"
        - id: "gemini-3-flash-preview"
          name: "Gemini 3 Flash"
          description: "Frontier-Performance zu einem Bruchteil der Kosten (Preview)"
        # Gemini 2.5 Series (Stabil)
        - id: "gemini-2.5-pro"
          name: "Gemini 2.5 Pro"
          description: "Fortschrittlichstes stabiles Modell, Reasoning & Coding"
        - id: "gemini-2.5-flash"
          name: "Gemini 2.5 Flash"
          description: "Bestes Preis-Leistungs-Modell, latenzarm"
        - id: "gemini-2.5-flash-lite"
          name: "Gemini 2.5 Flash-Lite"
          description: "Schnellstes & kostengünstigstes Modell der 2.5-Familie"
        # Hinweis: Gemini 2.0 Flash & Flash-Lite sind eingestellt (deprecated Feb 2026)

    xai:
      name: "xAI (Grok)"
      api_type: "xai"
      enabled: false  # Standardmäßig deaktiviert, Aktivierung via Config
      # Der API-Key gehört in die .env Datei!
      # Beispiel .env: XAI_API_KEY=xai-...
      env_var: "XAI_API_KEY"
      models:
        # Grok 3 Series (Current Gen - Feb 2026)
        - id: "grok-3-latest"
          name: "Grok 3"
          description: "Starkes Reasoning & Wissen (Feb 2026)"
        - id: "grok-3-mini-latest"
          name: "Grok 3 Mini"
          description: "Effizient & schnell"
        # Grok 4 Preview (Next Gen)
        - id: "grok-4-latest"
          name: "Grok 4 (Preview)"
          description: "Vorschau auf die nächste Generation"
        # Legacy
        - id: "grok-2-latest"
          name: "Grok 2 (Legacy)"
          description: "Vorherige Generation (2025)"

  local:
    # Globale Konfiguration für alle lokalen Ollama-Modelle
    # Hier definierst du Hardware-Limits deines Systems
    config:
      # Context Window (RAM-abhängig):
      # - 8192  (8k)  : Standard für 8GB RAM
      # - 16384 (16k) : Empfohlen für 16GB RAM
      # - 32768 (32k) : Empfohlen für 24GB+ RAM (und Reasoning Models)
      context_window: 32768

      # Default Generation Profile
      default_temperature: 0.1

    ollama:
      name: "Ollama (Local)"
      api_type: "ollama"
      # Modelle werden dynamisch von Ollama abgefragt
      auto_discover: true

# Output Configuration
# --------------------
output:
  directory: "benchmark_scores"
  commercial_csv: "benchmark_scores/commercial_models_benchmark.csv"
  local_models_csv: "benchmark_scores/local_models_benchmark.csv"
  golden_standard_csv: "benchmark_scores/golden_standard_benchmark.csv"
  leaderboard_csv: "benchmark_scores/benchmark_leaderboard.csv"
  streaming_output_commercial_providers: true  # true | false | "Force" (Force disables streaming)

# Logging Configuration
# ---------------------
logging:
  file_path: "logs/crucible.log"
  console_level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file_level: "DEBUG"    # DEBUG captures everything for troubleshooting


# ====================
# Test-Module Registry
# ====================
# Jedes Modul muss folgende Struktur haben:
#   - test.py mit TestClass (erbt von BaseTest)
#   - assets/ Verzeichnis mit Test-Assets
#   - config.yaml mit Modul-Metadaten
#   - README.md mit Dokumentation
#
# HINWEIS: Details wie version, description, scoring, etc. werden
# ab v0.9 direkt aus der moduleigenen 'config.yaml' geladen (SSOT).

modules:
  code_quality:
    path: "benchmark_modules/code_quality"
    enabled: true
    llm_judge_model: "ministral-3:14b"

  ux_writing:
    path: "benchmark_modules/ux_writing"
    enabled: true
    llm_judge_model: "ministral-3:14b"

  documentation_quality:
    path: "benchmark_modules/documentation_quality"
    enabled: true
    llm_judge_model: "ministral-3:14b"

  content_transformation:
    path: "benchmark_modules/content_transformation"
    enabled: true
    llm_judge_model: "ministral-3:14b"

  cultural_intelligence:
    path: "benchmark_modules/cultural_intelligence"
    enabled: true
    llm_judge_model: "ministral-3:14b"

  reasoning:
    path: "benchmark_modules/reasoning_logic"
    enabled: true
    llm_judge_model: "deepseek-r1:8b"

  cli_benchmark:
    path: "benchmark_modules/cli_benchmark"
    enabled: true
    llm_judge_model: "ministral-3:14b"

  political_compass:
    path: "benchmark_modules/political_compass"
    enabled: false
    llm_judge_model: "ministral-3:14b"
