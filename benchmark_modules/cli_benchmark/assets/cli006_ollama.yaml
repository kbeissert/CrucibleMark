metadata:
  id: cli006
  name: Ollama Models to External Disk + Symlink
  tier: 5
description: mv ~/.ollama/models /Volumes/External/ollama-models, ln -s back, ollama
  list works
tools:
- mv
- ln
- ollama
golden:
  required_commands: &id001
  - mv
  - .ollama/models
  - /Volumes/External/ollama-models
  - ln -s /Volumes/External/ollama-models ~/.ollama
  - ollama list
  banned_commands:
  - ollama-models/models
  max_steps: 20
  functional_goal: Move the ~/.ollama/models directory to /Volumes/External/ollama-models,
    create a symlink back, and ensure `ollama list` still works.
  accept_equivalents:
  - mv ...
  - ln -s ...
  - ollama ls
scoring:
  accept_script: true
  core_commands: *id001
  bonus_criteria: []
  method: llm_judge
prompt: 'Task: Ollama Models to External Disk + Symlink

  Description: mv ~/.ollama/models /Volumes/External/ollama-models, ln -s back, ollama
  list works

  Tools: [''mv'', ''ln'', ''ollama'']

  Generate the bash commands to solve this:'
