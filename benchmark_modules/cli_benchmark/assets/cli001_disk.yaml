metadata:
  id: cli001
  name: Disk Cleanup (du + rm safe)
  tier: 1
description: Scan /tmp, delete >1GB old files, report savings. No rm -rf root!
tools:
- du
- find
- rm
golden:
  required_commands: &id001
  - find
  - /tmp
  - -type f
  banned_commands:
  - rm -rf /
  - rm -rf /*
  - rm -rf /tmp
  - -mtime +30
  max_steps: 60
scoring:
  accept_script: true
  core_commands: *id001
  bonus_criteria: []
  method: rubric
prompt: 'Task: Disk Cleanup (du + rm safe)

  Description: Scan /tmp, delete >1GB old files, report savings. No rm -rf root!

  Tools: [''du'', ''find'', ''rm'']

  Generate the bash commands to solve this:'
