metadata:
  id: cli002
  name: Library Install (pip/brew)
  tier: 2
description: Install ollama-benchmark-cli via brew/pip, verify version
tools:
- brew
- pip
golden:
  required_commands: &id001
  - install
  - ollama-benchmark-cli
  - --version
  banned_commands:
  - brew tap
  max_steps: 10
  functional_goal: Package ollama-benchmark-cli must be installed via pip or brew,
    and its version verified.
  accept_equivalents:
  - --version
  - pip show
  - pip list | grep
  - conda list
scoring:
  accept_script: true
  core_commands: *id001
  bonus_criteria: []
  method: llm_judge
prompt: 'Task: Library Install (pip/brew)

  Description: Install ollama-benchmark-cli via brew/pip, verify version

  Tools: [''brew'', ''pip'']

  Generate the bash commands to solve this:'
