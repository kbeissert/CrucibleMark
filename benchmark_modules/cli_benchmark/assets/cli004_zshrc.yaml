metadata:
  id: "cli004"
  name: "Zshrc Alias & Source"
  tier: 2
description: "Set an alias 'bm=ollama-benchmark-cli', source ~/.zshrc_temp, and test it with 'bm --help'."
tools: ["alias", "source"]
golden:
  required_commands: ["alias bm=ollama-benchmark-cli", "source", ".zshrc_temp", "bm --help"]
  banned_commands: ["rm ", "echo '' >"]
  max_steps: 3