# Documentation Quality Test Module Configuration
# ================================================

metadata:
  id: "documentation_quality"
  name: "Documentation Quality"
  version: "2.0.0"
  description: "Bewertet die Qualität von Code-Dokumentation, README-Dateien und API-Dokumentation"
  author: "CrucibleMark"
  created: "2025-12-28"
  updated: "2026-02-02"
  updated: "2026-01-31" 
  tags:
    - documentation
    - readme
    - markdown
    - api-docs
    - best-practices

integration:
  leaderboard:
    enable_scoring: true
    default_contribution:
      routine: 1.0
      reasoning: 0.0
    columns:
      - id: "documentation_quality_score"
        label: "Documentation Quality"
        weight: 1.0

execution:
  test_class: "DocumentationTest"
  assets_dir: "assets"
  assets_count: 5
  asset_types:
    - readme_quality
    - api_docs
    - component_documentation
    - setup_guide
    - changelog

benchmarks:
  - id: "documentation_quality_001"
    name: "README Quality"
    tier: 1
    score_contribution:
      routine: 1.0
      reasoning: 0.0

  - id: "documentation_quality_002"
    name: "REST API Documentation"
    tier: 1
    score_contribution:
      routine: 1.0
      reasoning: 0.0

  - id: "documentation_quality_003"
    name: "Component Props"
    tier: 1
    score_contribution:
      routine: 0.85
      reasoning: 0.15

  - id: "documentation_quality_004"
    name: "Setup & Troubleshooting"
    tier: 2
    score_contribution:
      routine: 0.7
      reasoning: 0.3

  - id: "documentation_quality_005"
    name: "Changelog & Release Notes"
    tier: 1
    score_contribution:
      routine: 0.9
      reasoning: 0.1

# Internal Module Configuration
config:
  categories:
    structure_clarity:
      name: "Struktur & Klarheit"
      weight: 1.0
      max_score: 25
      description: "Navigation, Gliederung, logischer Aufbau"
    
    completeness:
      name: "Vollständigkeit"
      weight: 1.0
      max_score: 25
      description: "Alle relevanten Informationen vorhanden"
    
    technical_accuracy:
      name: "Technische Korrektheit"
      weight: 1.0
      max_score: 25
      description: "Code-Beispiele funktionieren, Links sind valide"
    
    usability:
      name: "Nutzbarkeit & Wartbarkeit"
      weight: 1.0
      max_score: 25
      description: "Verständlichkeit für Zielgruppe"
