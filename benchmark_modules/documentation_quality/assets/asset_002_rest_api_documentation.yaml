context: |
  Du bist ein Technical Writer für ein E-Commerce-Startup. Das Backend-Team
  hat einen neuen REST API Endpoint für das Bestellsystem entwickelt, aber
  die Dokumentation ist unvollständig und teilweise fehlerhaft.

  **API Endpoint:** `POST /api/v1/orders`
  **Funktion:** Neue Bestellung erstellen

  **Zielgruppe:** Frontend-Developer, externe Partner-APIs
  **Kontext:** Production-API mit 10.000+ Requests/Tag

  Das Team hat eine erste Dokumentation geschrieben, aber:
  - Wichtige Parameter fehlen (z.B. Authentication)
  - Status Codes sind unvollständig
  - Error Responses nicht dokumentiert
  - Keine Beispiele für Edge Cases

prompt: |
  Analysiere die folgende API-Dokumentation und bewerte sie nach **API Documentation Best Practices**.

  **Wichtig:** Identifiziere ALLE Probleme und priorisiere nach Schweregrad.

  ## Kategorien:
  1. **Struktur & Vollständigkeit** - Request-Parameter, Status Codes, Beispiele
  2. **Technische Korrektheit** - HTTP-Methoden, JSON-Schemas, Content-Types
  3. **Error Handling** - Error Responses, Retry-Strategien, Rate Limiting
  4. **Beispiele & Usability** - cURL-Beispiele, Edge Cases, Authentication

  ---

  ## API-Dokumentation (aktueller Stand):

  ```
  # POST /api/v1/orders

  Creates a new order.

  ## Request Body

  ```json
  {
    "items": [
      {
        "product_id": "string",
        "quantity": 1
      }
    ],
    "customer_email": "string"
  }

  ```

  ## Response

  ```json
  {
    "order_id": "string",
    "status": "pending"
  }

  ```

  ## Status Codes

  - `200 OK` - Order created successfully
  - `400 Bad Request` - Invalid input

  ## Example

  ```bash
  curl -X POST https://api.example.com/api/v1/orders     -d '{"items": [{"product_id": "ABC123", "quantity": 2}]}'

  ```

  ```

  ---

  ## Deine Aufgabe

  1. **Identifiziere alle Probleme** in den 4 Kategorien
  2. **Priorisiere** nach Schweregrad:
     - **Critical**: Fehlende Security (Auth), falsche Status Codes
     - **High**: Fehlende Parameter, keine Error Responses
     - **Medium**: Fehlende Beispiele, unvollständige Descriptions
     - **Low**: Fehlende Language-Bindings, keine OpenAPI-Spec
  3. **Erstelle eine verbesserte API-Dokumentation** mit allen fehlenden Elementen
  4. **Begründe** deine Änderungen mit API-Design-Prinzipien

  WICHTIG: Bitte liste zuerst explizit alle gefundenen Probleme auf (Schritt 1), bevor du die verbesserte Version erstellst. Halte deine Problemauflistung (Schritt 1) und die Begründungen (Schritt 4) extrem kompakt und auf den Punkt gebracht, um Token-Limits für die finale verbesserte API-Dokumentation nicht zu gefährden.

