  ## Schritt 3: Begruendung der Aenderungen

  ### 1. Sicherheit: Authentication dokumentiert (C1)

  **Problem:** Production-API ohne Auth-Dokumentation ist ein Sicherheitsrisiko.
  **Loesung:** Explizites Authentication-Kapitel mit Bearer Token, Scope-Erklaerung und Dashboard-Link.
  **Prinzip:** Security by Design – Auth darf nie optional oder implizit sein.

  ### 2. Korrekte HTTP-Semantik: `201` statt `200` (C2)

  **Problem:** `200 OK` fuer Ressourcenerstellung verletzt RFC 7231 §6.3.2.
  **Loesung:** `201 Created` mit `Location`-Header.
  **Prinzip:** RESTful Semantik – Clients koennen `201` und den `Location`-Header nutzen, um die neue Ressource direkt zu referenzieren.

  ### 3. Funktionierendes cURL-Beispiel (C3)

  **Problem:** Fehlendes `-H "Content-Type: application/json"` macht das Beispiel copy-paste-unbrauchbar.
  **Loesung:** Vollstaendiges cURL-Beispiel mit allen erforderlichen Headers und realistischen Daten.
  **Prinzip:** Dokumentationsbeispiele muessen ausfuehrbar und korrekt sein – sie sind der erste Beruehrungspunkt fuer Developer.

  ### 4. Standardisiertes Error-Schema (H1)

  **Problem:** `400 Bad Request` ohne Struktur ist nutzlos fuer programmatisches Fehler-Handling.
  **Loesung:** Einheitliches Error-Schema mit `code`, `message`, `details`, `request_id` und `documentation_url`.
  **Prinzip:** Maschinenlesbare Fehlercodes statt Prosa – ermoeglicht robustes programmatisches Error-Handling.

  ### 5. Vollstaendige Status Codes mit Retry-Empfehlung (H2)

  **Problem:** Nur 2 von 10 relevanten Status Codes dokumentiert.
  **Loesung:** Vollstaendige Tabelle mit 10 Status Codes, inkl. Retry?-Spalte.
  **Prinzip:** Unvollstaendige Status-Code-Dokumentation zwingt Developer zu Trial-and-Error-Integration.

  ### 6. Vollstaendige Pflichtfelder (H3)

  **Problem:** `shipping_address` und `payment_method` fehlten komplett.
  **Loesung:** Vollstaendige Parameter-Referenz-Tabellen fuer alle Ebenen mit Typ, Pflicht-Kennzeichnung und Validierungsregeln.
  **Prinzip:** Eine API-Dokumentation muss alle fuer eine erfolgreiche Anfrage notwendigen Felder enthalten.

  ### 7. Validierungsregeln (H4)

  **Problem:** Keine Constraints fuer Felder – min/max, Formate, Enums fehlten.
  **Loesung:** Validierungsspalte in allen Parameter-Tabellen.
  **Prinzip:** Explizite Constraints reduzieren unnoetige API-Calls und defensive Programmierung auf Client-Seite.

  ### 8. Location-Header + HATEOAS (H5)

  **Problem:** REST-Standard `Location`-Header bei `201 Created` fehlte.
  **Loesung:** Response-Headers-Tabelle mit `Location`, `X-Request-ID` und `X-RateLimit-Remaining`; `_links` im Response-Body.
  **Prinzip:** HATEOAS-Prinzip ermoeglicht self-descriptive API-Navigation ohne hartcodierte URLs.

  ### 9. Idempotency + Rate Limiting (M3/M4)

  **Problem:** Produktionskritische Resilience-Aspekte waren undokumentiert.
  **Loesung:** Dedizierte Best-Practices-Sektion mit Idempotency-Erklaerung, Retry-Strategie und Rate-Limiting-Headers.
  **Prinzip:** Bei Bestellsystemen sind Duplicate Orders ein kritisches Business-Problem – Idempotenz ist Pflicht fuer jede externe Partner-Integration.
