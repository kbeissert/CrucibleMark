prompt: "Analysiere die folgende API-Dokumentation und bewerte sie nach **API Documentation\
  \ Best Practices**.\n\n**Wichtig:** Identifiziere ALLE Probleme und priorisiere\
  \ nach Schweregrad.\n\n## Kategorien:\n1. **Struktur & Vollständigkeit** - Request-Parameter,\
  \ Status Codes, Beispiele\n2. **Technische Korrektheit** - HTTP-Methoden, JSON-Schemas,\
  \ Content-Types\n3. **Error Handling** - Error Responses, Retry-Strategien, Rate\
  \ Limiting\n4. **Beispiele & Usability** - cURL-Beispiele, Edge Cases, Authentication\n\
  \n---\n\n## API-Dokumentation (aktueller Stand):\n\n```\n# POST /api/v1/orders\n\
  \nCreates a new order.\n\n## Request Body\n\n```json\n{\n  \"items\": [\n    {\n\
  \      \"product_id\": \"string\",\n      \"quantity\": 1\n    }\n  ],\n  \"customer_email\"\
  : \"string\"\n}\n\n```\n\n## Response\n\n```json\n{\n  \"order_id\": \"string\"\
  ,\n  \"status\": \"pending\"\n}\n\n```\n\n## Status Codes\n\n- `200 OK` - Order\
  \ created successfully\n- `400 Bad Request` - Invalid input\n\n## Example\n\n```bash\n\
  curl -X POST https://api.example.com/api/v1/orders     -d '{\"items\": [{\"product_id\"\
  : \"ABC123\", \"quantity\": 2}]}'\n\n```\n\n```\n\n---\n\n## Deine Aufgabe\n\n1.\
  \ **Identifiziere alle Probleme** in den 4 Kategorien\n2. **Priorisiere** nach Schweregrad:\n\
  \   - **Critical**: Fehlende Security (Auth), falsche Status Codes\n   - **High**:\
  \ Fehlende Parameter, keine Error Responses\n   - **Medium**: Fehlende Beispiele,\
  \ unvollständige Descriptions\n   - **Low**: Fehlende Language-Bindings, keine OpenAPI-Spec\n\
  3. **Erstelle eine verbesserte API-Dokumentation** mit allen fehlenden Elementen\n\
  4. **Begründe** deine Änderungen mit API-Design-Prinzipien\n\nWICHTIG: Liste zuerst explizit alle gefundenen Probleme auf (Schritt 1), bevor du die verbesserte\
  \ Version erstellst. Problemauflistung (Schritt 1) und Begründungen (Schritt 4): extrem kompakt.\n"
