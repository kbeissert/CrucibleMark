golden_standard: |

  # API Documentation Review: POST /api/v1/orders

  ---

  ## Schritt 1: Problem-Analyse

  ### 🔴 CRITICAL – Sofortiger Handlungsbedarf

  | # | Problem | Kategorie | Begründung |
  |---|---------|-----------|------------|
  | C1 | **Keine Authentication dokumentiert** | Security | Production-API mit 10.000+ Requests/Tag ohne Auth-Dokumentation ist ein kritisches Sicherheitsrisiko. Developer wissen nicht, wie sie sich authentifizieren sollen (Bearer Token? API Key? OAuth?) |
  | C2 | **Falscher Status Code: `200 OK` statt `201 Created`** | Technische Korrektheit | RFC 7231 §6.3.2: Ressourcenerstellung MUSS `201 Created` zurückgeben. `200 OK` ist semantisch falsch und führt bei API-Clients zu Implementierungsfehlern |
  | C3 | **Kein `Content-Type: application/json` Header im cURL-Beispiel** | Technische Korrektheit | Ohne diesen Header interpretiert der Server den Request-Body als `application/x-www-form-urlencoded` – das Beispiel ist copy-paste-unbrauchbar |

  ---

  ### 🟠 HIGH – Innerhalb dieser Woche beheben

  | # | Problem | Kategorie | Begründung |
  |---|---------|-----------|------------|
  | H1 | **Keine Error Response Bodies dokumentiert** | Error Handling | `400 Bad Request` ohne Response-Schema ist nutzlos. Developer können Fehler nicht programmatisch auswerten |
  | H2 | **Fehlende Status Codes**: `401`, `403`, `404`, `409`, `422`, `429`, `500`, `503` | Struktur & Vollständigkeit | Nur 2 von 10 relevanten Codes dokumentiert. `401` (Auth) und `429` (Rate Limiting) sind für eine Production-API kritisch |
  | H3 | **Fehlende Pflichtfelder**: `shipping_address`, `payment_method` nicht dokumentiert | Struktur & Vollständigkeit | Eine Bestellung ohne Lieferadresse und Zahlungsmethode ist in keinem realen E-Commerce-System valide |
  | H4 | **Keine Validierungsregeln** für Parameter | Struktur & Vollständigkeit | Was ist das Format von `product_id`? Min/Max von `quantity`? Ist `customer_email` RFC 5322-validiert? |
  | H5 | **Kein `Location`-Header in der 201-Response dokumentiert** | Technische Korrektheit | Bei `201 Created` ist der `Location`-Header (`/api/v1/orders/{id}`) REST-Standard (RFC 7231 §6.3.2) |

  ---

  ### 🟡 MEDIUM – Im nächsten Sprint beheben

  | # | Problem | Kategorie | Begründung |
  |---|---------|-----------|------------|
  | M1 | **Keine Feldbeschreibungen** | Usability | Was ist `product_id`? UUID? SKU? Interner Code? Kein Developer weiß es ohne Rückfragen |
  | M2 | **Keine Edge Cases** dokumentiert | Beispiele | Was passiert bei `quantity: 0`? Nicht vorrätigen Produkten? Ungültiger `product_id`? |
  | M3 | **Kein Rate Limiting dokumentiert** | Error Handling | 10.000+ Requests/Tag impliziert Rate Limits – vollständig fehlend |
  | M4 | **Keine Idempotency-Key-Dokumentation** | Error Handling | Ohne Idempotency-Keys entstehen bei Netzwerkfehlern Duplicate Orders |
  | M5 | **Response-Body unvollständig** | Struktur & Vollständigkeit | Nur `order_id` und `status` – fehlen: `created_at`, `total`, `estimated_delivery`, `items` |
  | M6 | **Kein API-Versioning-Hinweis** | Struktur & Vollständigkeit | Was passiert bei Breaking Changes? Keine Deprecation-Policy erwähnt |

  ---

  ### 🔵 LOW – Backlog

  | # | Problem | Kategorie | Begründung |
  |---|---------|-----------|------------|
  | L1 | **Keine OpenAPI/Swagger-Spec** | Usability | Verhindert automatische Client-Generierung und interaktive Dokumentation |
  | L2 | **Keine SDK-Beispiele** (Python, JavaScript etc.) | Beispiele | Für externe Partner-APIs besonders relevant |
  | L3 | **Kein Changelog/Version-History** | Struktur | Für eine Production-API mit externen Partnern essenziell |
  | L4 | **Keine Sandbox/Test-Environment** erwähnt | Usability | Developer müssen gegen Production testen – riskant |

  ---

  **Gesamtbefund: 16 Probleme** (3 Critical, 5 High, 6 Medium, 4 Low)

  ---

  ## Schritt 2: Verbesserte API-Dokumentation

  ---

  # POST /api/v1/orders

  Erstellt eine neue Bestellung im System. Die Bestellung wird zunächst im Status
  `pending` angelegt und durchläuft anschließend asynchron die Zahlungs- und
  Lagerprüfung. Der Endpoint unterstützt Idempotency zur sicheren Wiederholung bei
  Netzwerkfehlern.

  > **Base URL (Production):** `https://api.example.com`
  > **Base URL (Sandbox):**    `https://sandbox.api.example.com`
  > **Version:** v1
  > **Rate Limit:** 100 Requests/Minute pro API-Key

  ---

  ## Authentication

  Alle Requests erfordern einen gültigen API-Key im `Authorization`-Header.

  ```
  Authorization: Bearer <your_api_key>
  ```

  Unterstützte Scopes:
  - `orders:write` – Pflicht für diesen Endpoint
  - `orders:read`  – Für GET-Endpoints

  API-Keys können im [Developer Dashboard](https://dashboard.example.com) generiert werden.

  ---

  ## Request

  ### Headers

  | Header            | Typ    | Pflicht       | Beschreibung                                              |
  |-------------------|--------|---------------|-----------------------------------------------------------|
  | `Authorization`   | string | ✅ Ja         | `Bearer <api_key>` mit Scope `orders:write`               |
  | `Content-Type`    | string | ✅ Ja         | Muss `application/json` sein                              |
  | `Idempotency-Key` | string | ⚠️ Empfohlen  | UUID v4 zur Duplikat-Vermeidung bei Retries (24h gültig)  |
  | `Accept`          | string | Nein          | Standard: `application/json`                              |
  | `X-Request-ID`    | string | Nein          | Client-generierte UUID für Tracing und Debugging          |

  > **Empfehlung:** Immer einen `Idempotency-Key` senden. Bei Netzwerkfehlern kann der
  > Request sicher wiederholt werden, ohne Duplicate Orders zu erzeugen.

  ---

  ### Request Body

  ```json
  {
    "items": [
      {
        "product_id": "ABC123",
        "quantity": 2,
        "unit_price": 29.99
      }
    ],
    "customer_email": "kunde@example.com",
    "shipping_address": {
      "name": "Max Mustermann",
      "street": "Musterstrasse 42",
      "city": "Berlin",
      "postal_code": "10115",
      "country": "DE"
    },
    "payment_method": "credit_card",
    "notes": "Bitte klingeln"
  }
  ```

  ### Parameter-Referenz

  #### Top-Level

  | Feld               | Typ      | Pflicht | Validierung                                          | Beschreibung                           |
  |--------------------|----------|---------|------------------------------------------------------|----------------------------------------|
  | `items`            | array    | ✅ Ja   | Min. 1 Element, max. 50 Elemente                     | Liste der bestellten Produkte          |
  | `customer_email`   | string   | ✅ Ja   | Valides E-Mail-Format (RFC 5322), max. 254 Zeichen   | E-Mail für Auftragsbestätigung         |
  | `shipping_address` | object   | ✅ Ja   | Alle Unterfelder außer `notes` sind Pflicht          | Lieferadresse                          |
  | `payment_method`   | string   | ✅ Ja   | Enum: `credit_card`, `paypal`, `bank_transfer`       | Zahlungsmethode                        |
  | `notes`            | string   | ❌ Nein | Max. 500 Zeichen                                     | Optionale Anmerkungen zur Bestellung   |

  #### `items[]` Objekt

  | Feld         | Typ     | Pflicht | Validierung                        | Beschreibung                                    |
  |--------------|---------|---------|------------------------------------|-------------------------------------------------|
  | `product_id` | string  | ✅ Ja   | Format: `[A-Z0-9]{3,20}`           | Produkt-SKU aus dem Produktkatalog              |
  | `quantity`   | integer | ✅ Ja   | Min: `1`, Max: `999`               | Bestellmenge. Muss eine positive ganze Zahl sein |
  | `unit_price` | number  | ✅ Ja   | Min: `0.01`, max. 2 Dezimalstellen | Preis pro Einheit in EUR zum Bestellzeitpunkt   |

  #### `shipping_address` Objekt

  | Feld          | Typ    | Pflicht | Validierung                    | Beschreibung                        |
  |---------------|--------|---------|--------------------------------|-------------------------------------|
  | `name`        | string | ✅ Ja   | Max. 100 Zeichen               | Vollständiger Name des Empfängers   |
  | `street`      | string | ✅ Ja   | Max. 200 Zeichen               | Straße und Hausnummer               |
  | `city`        | string | ✅ Ja   | Max. 100 Zeichen               | Stadt                               |
  | `postal_code` | string | ✅ Ja   | Format abhängig von `country`  | Postleitzahl                        |
  | `country`     | string | ✅ Ja   | ISO 3166-1 alpha-2 (z.B. `DE`) | Ländercode                          |

  ---

  ## Response

  ### Erfolg: `201 Created`

  **Response Headers:**

  | Header                   | Beschreibung                                          |
  |--------------------------|-------------------------------------------------------|
  | `Location`               | URL der erstellten Ressource: `/api/v1/orders/{id}`  |
  | `X-Request-ID`           | Server-generierte oder weitergeleitete Request-ID    |
  | `X-RateLimit-Remaining`  | Verbleibende Requests im aktuellen Zeitfenster       |

  **Response Body:**

  ```json
  {
    "order_id": "ord_7f3a2b1c9d",
    "status": "pending",
    "created_at": "2024-01-15T14:30:00Z",
    "estimated_delivery": "2024-01-20",
    "currency": "EUR",
    "items": [
      {
        "product_id": "ABC123",
        "quantity": 2,
        "unit_price": 29.99,
        "line_total": 59.98
      }
    ],
    "subtotal": 59.98,
    "shipping_cost": 4.99,
    "tax": 12.35,
    "total": 77.32,
    "_links": {
      "self":   { "href": "/api/v1/orders/ord_7f3a2b1c9d" },
      "cancel": { "href": "/api/v1/orders/ord_7f3a2b1c9d/cancel" },
      "track":  { "href": "/api/v1/orders/ord_7f3a2b1c9d/tracking" }
    }
  }
  ```

  ---

  ## Status Codes

  | Code                        | Bedeutung                                                                    | Retry? |
  |-----------------------------|------------------------------------------------------------------------------|--------|
  | `201 Created`               | Bestellung erfolgreich erstellt                                              | ❌     |
  | `400 Bad Request`           | Ungültige Eingabe (Validierungsfehler, fehlende Pflichtfelder)               | ❌     |
  | `401 Unauthorized`          | Fehlender oder ungültiger API-Key                                            | ❌     |
  | `403 Forbidden`             | API-Key hat nicht den Scope `orders:write`                                   | ❌     |
  | `404 Not Found`             | `product_id` oder `payment_method` existiert nicht                           | ❌     |
  | `409 Conflict`              | Bestellung mit diesem `Idempotency-Key` existiert bereits                    | ❌     |
  | `422 Unprocessable Entity`  | Semantisch ungültig (z.B. Produkt nicht auf Lager, Preis geändert)          | ❌     |
  | `429 Too Many Requests`     | Rate Limit überschritten (100 Req/Min) – `Retry-After` Header prüfen        | ✅     |
  | `500 Internal Server Error` | Unerwarteter Serverfehler – Support kontaktieren mit `request_id`            | ✅     |
  | `503 Service Unavailable`   | System temporär nicht verfügbar (Maintenance/Überlast)                       | ✅     |

  ---

  ## Error Responses

  Alle Fehler folgen einem einheitlichen Schema:

  ```json
  {
    "error": {
      "code": "VALIDATION_ERROR",
      "message": "Das Feld 'quantity' muss eine positive ganze Zahl sein.",
      "details": [
        {
          "field": "items[0].quantity",
          "code": "INVALID_VALUE",
          "message": "Wert muss zwischen 1 und 999 liegen"
        }
      ],
      "documentation_url": "https://docs.example.com/errors/VALIDATION_ERROR"
    },
    "request_id": "req_9x2k1m3n"
  }
  ```

  > **`request_id`**: Immer im Support-Ticket angeben – ermöglicht schnelles Debugging.

  ### Error Code Referenz

  | HTTP Code | `error.code`          | Beschreibung                                    | Lösung                                           |
  |-----------|-----------------------|-------------------------------------------------|--------------------------------------------------|
  | `400`     | `VALIDATION_ERROR`    | Pflichtfeld fehlt oder Format ungültig          | Siehe `details` Array für betroffene Felder      |
  | `400`     | `INVALID_QUANTITY`    | `quantity` außerhalb des erlaubten Bereichs     | Wert zwischen 1 und 999 verwenden                |
  | `401`     | `MISSING_AUTH`        | Kein Authorization-Header                       | `Bearer <api_key>` Header hinzufügen             |
  | `401`     | `INVALID_TOKEN`       | API-Key ungültig oder abgelaufen                | Neuen Key im Dashboard generieren                |
  | `403`     | `INSUFFICIENT_SCOPE`  | Scope `orders:write` fehlt                      | Key-Berechtigungen im Dashboard prüfen           |
  | `404`     | `PRODUCT_NOT_FOUND`   | `product_id` nicht im Katalog                   | Produktkatalog-API für valide IDs nutzen         |
  | `409`     | `DUPLICATE_ORDER`     | Idempotency-Key bereits verwendet               | Bestehende Order-ID aus ursprünglicher Response  |
  | `422`     | `OUT_OF_STOCK`        | Produkt nicht auf Lager                         | Verfügbarkeit über Inventory-API prüfen          |
  | `422`     | `PRICE_CHANGED`       | `unit_price` weicht >5% vom Katalogpreis ab     | Aktuellen Preis über Product-API abrufen         |
  | `429`     | `RATE_LIMIT_EXCEEDED` | Zu viele Requests                               | Exponential Backoff, `Retry-After` Header prüfen |
  | `500`     | `INTERNAL_ERROR`      | Unerwarteter Serverfehler                       | Retry nach 30s, dann Support kontaktieren        |

  ### Beispiel: Validierungsfehler (400)

  ```json
  {
    "error": {
      "code": "VALIDATION_ERROR",
      "message": "Validierungsfehler in 2 Feldern",
      "details": [
        {
          "field": "items[0].quantity",
          "code": "INVALID_VALUE",
          "message": "Wert muss zwischen 1 und 999 liegen, ist aber 0"
        },
        {
          "field": "shipping_address.country",
          "code": "INVALID_FORMAT",
          "message": "Muss ein gueltiger ISO 3166-1 alpha-2 Code sein (z.B. 'DE', 'AT')"
        }
      ],
      "documentation_url": "https://docs.example.com/errors/VALIDATION_ERROR"
    },
    "request_id": "req_abc123"
  }
  ```

  ### Beispiel: Rate Limit (429)

  ```json
  {
    "error": {
      "code": "RATE_LIMIT_EXCEEDED",
      "message": "Rate Limit ueberschritten. Maximal 100 Requests/Minute.",
      "retry_after": 42
    },
    "request_id": "req_xyz789"
  }
  ```

