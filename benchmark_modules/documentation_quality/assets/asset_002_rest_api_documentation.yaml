  ## Best Practices

  ### Idempotency

  - Immer `Idempotency-Key` (UUID v4) senden – besonders wichtig bei Retries
  - Bei gleichem Key innerhalb von 24 Stunden wird die ursprüngliche Response zurückgegeben
  - Key pro logischer Operation generieren (z.B. pro Warenkorb-Checkout-Versuch)

  ### Retry-Strategie

  Nur bei `429`, `500` und `503` Retries empfohlen:

  1. `Retry-After` Header auswerten (bei `429`)
  2. Exponential Backoff: 1s → 2s → 4s → 8s
  3. Maximal 3 Retry-Versuche
  4. Immer denselben `Idempotency-Key` bei Retries verwenden

  ### Rate Limiting

  Jede Response enthält folgende Headers:

  | Header                  | Beschreibung                                   |
  |-------------------------|------------------------------------------------|
  | `X-RateLimit-Limit`     | Maximale Requests pro Minute (100)             |
  | `X-RateLimit-Remaining` | Verbleibende Requests im aktuellen Fenster     |
  | `X-RateLimit-Reset`     | Unix-Timestamp fuer Reset des Limits           |

