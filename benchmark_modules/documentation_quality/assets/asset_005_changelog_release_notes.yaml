# ============================================================

metadata:
  id: documentation_quality_005
  name: "Changelog - Git Commits to User-Facing Release Notes"
  category: documentation_quality
  subcategory: changelog
  difficulty: tiered
  estimated_time_seconds: 220
  tags: [changelog, release-notes, git, semantic-versioning, keep-a-changelog]
  author: "CrucibleMark"
  created: "2025-12-28"
  updated: "2025-12-28"
  language: de
  version: "1.0.0"

# ============================================================
# Test-Kontext und Aufgabenstellung
# ============================================================

context: |
  Du bist ein Technical Writer für ein SaaS-Produkt (Projektmanagement-Tool).
  Das Team released alle 2 Wochen eine neue Version, aber die Release Notes
  sind nur eine Copy-Paste der Git-Commit-Messages - unverständlich für Endnutzer.
  
  **Produkt:** TaskFlow (Projektmanagement SaaS)
  **Zielgruppe Release Notes:** 
    - End-User (Projektmanager, keine Tech-Kenntnisse)
    - Admins (Setup, Security-Awareness)
    - Developers (API-Changes, Breaking Changes)
  
  **Problem:** Git-Commits sind:
    - Zu technisch ("refactor: extract auth middleware")
    - Keine User-Benefits erklärt ("fix: update regex pattern")
    - Nicht kategorisiert (Features, Bugfixes, Breaking Changes)
    - Nicht priorisiert (Wichtige Fixes vs. Minor Tweaks)
  
  **Release:** v2.3.0 (15 Commits aus letzten 2 Wochen)

prompt: |
  Analysiere die folgende Git-Commit-History und transformiere sie in
  **user-facing Release Notes nach Keep a Changelog Standard**.
  
  **Wichtig:** Identifiziere ALLE Probleme und transformiere in nutzerfreundliche Sprache.
  
  ## Kategorien:
  1. **Struktur & Kategorisierung** - Added/Changed/Fixed/Security, Semantic Versioning, Summary
  2. **User-Centricity** - User-Benefits statt Tech-Details, verständliche Sprache
  3. **Vollständigkeit & Priorisierung** - Breaking Changes, Security, Migration Guides
  4. **Format & Wartbarkeit** - Keep a Changelog Standard, Links, Contributors
  
  ---
  
  ## Git-Commit-History (v2.3.0):
  
  
  
  ---
  
  ## Deine Aufgabe
  
  1. **Identifiziere alle Probleme** in den 4 Kategorien
  2. **Bestimme Semantic Version:**
     - MAJOR (Breaking Changes) → v3.0.0
     - MINOR (New Features) → v2.3.0
     - PATCH (Bugfixes only) → v2.2.1
  3. **Kategorisiere Commits nach Keep a Changelog:**
     - 🚨 Breaking Changes
     - ✨ Added (New Features)
     - 🔄 Changed (Improvements)
     - 🐛 Fixed (Bugfixes)
     - 🔒 Security
     - ⚠️ Deprecated
  4. **Transformiere in User-Facing Language:**
     - "feat(api): add webhook support" → "You can now receive real-time notifications via webhooks"
     - "fix: resolve XSS vulnerability" → "Fixed a security issue in comments"
  5. **Erstelle vollständige Release Notes** mit Migration Guides, Links, Segmentierung

# ============================================================
# Scoring Configuration
# ============================================================

scoring:
  total_points: 130
  
  # ------------------------------------------------------------
  # 1. Error Detection (100 Points)
  # ------------------------------------------------------------
  error_detection:
    weight: 100
    description: "Erkennung fehlender/falscher Setup-Anleitung (Tiered)"
    
    # LEVEL 1: Labeled Issues (Easy - 25.0 Points)
    labeled_issues:
      - issue: "Keine Kategorisierung der Commits"
        category: "structure"
        severity: "critical"
        points: 12.5
        explanation: "Commits sind einfach chronologisch gelistet - nicht nach Added/Changed/Fixed gruppiert"
        check_method: "keyword_presence"
        min_keywords: 2
        keywords: ["kategorien", "categories", "## added", "## changed", "## fixed", "## security", "gruppiert"]
        changelog_principle: "Keep a Changelog Structure"
      
      - issue: "Technische Sprache statt User-Benefits"
        category: "user_centricity"
        severity: "high"
        points: 12.5
        explanation: "'extract auth middleware' bedeutet nichts für Endnutzer - User-Benefits fehlen"
        check_method: "keyword_presence"
        min_keywords: 2
        keywords: ["user-facing", "user benefits", "verständlich", "endnutzer", "nicht-technisch", "you can now"]
        changelog_principle: "User-Centric Language"

    # LEVEL 2: Standard Issues (Medium - 30.0 Points)
    standard_issues:
      - issue: "Breaking Change nicht hervorgehoben"
        category: "prioritization"
        severity: "critical"
        points: 6.0
        explanation: "BREAKING im Commit, aber nicht prominent in Release Notes platziert"
        check_method: "keyword_presence"
        min_keywords: 2
        keywords: ["breaking change", "🚨", "breaking", "major version", "nicht kompatibel", "migration"]
        changelog_principle: "Breaking Changes First"
      
      - issue: "Security Fix nicht priorisiert"
        category: "prioritization"
        severity: "critical"
        points: 6.0
        explanation: "XSS-Vulnerability (CVE) versteckt zwischen Features - muss oben stehen"
        check_method: "keyword_presence"
        min_keywords: 2
        keywords: ["security", "cve", "vulnerability", "sicherheit", "xss", "🔒"]
        changelog_principle: "Security Transparency"
      
      - issue: "Refactoring-Commits für Endnutzer irrelevant"
        category: "user_centricity"
        severity: "medium"
        points: 6.0
        explanation: "'extract auth middleware' und 'setup CI/CD' interessieren Nutzer nicht - filtern"
        check_method: "keyword_presence"
        min_keywords: 2
        keywords: ["refactor", "internal", "chore", "test", "nicht relevant", "ausblenden"]
        changelog_principle: "Signal vs Noise"
      
      - issue: "Keine Semantic Versioning Begründung"
        category: "structure"
        severity: "high"
        points: 6.0
        explanation: "Warum v2.3.0? Breaking Change vorhanden → sollte v3.0.0 sein"
        check_method: "keyword_presence"
        min_keywords: 2
        keywords: ["semantic versioning", "v3.0.0", "major", "minor", "patch", "semver"]
        changelog_principle: "Version Semantics"
      
      - issue: "Fehlende Release-Zusammenfassung"
        category: "structure"
        severity: "medium"
        points: 6.0
        explanation: "Keine Summary am Anfang - was ist das Highlight dieser Release?"
        check_method: "keyword_presence"
        min_keywords: 2
        keywords: ["summary", "zusammenfassung", "highlights", "overview", "tldr"]
        changelog_principle: "Executive Summary"

    # LEVEL 3: Advanced Issues (Hard - 25.0 Points)
    advanced_issues:
      - issue: "Keine Migration Guides für Breaking Changes"
        category: "completeness"
        severity: "high"
        points: 6.0
        explanation: "v1 API entfernt - aber nicht erklärt, wie man zu v2 migriert"
        check_method: "keyword_presence"
        min_keywords: 2
        keywords: ["migration", "upgrade guide", "how to migrate", "umstellung", "anleitung"]
        changelog_principle: "User Enablement"
      
      - issue: "Performance-Verbesserungen ohne Kontext"
        category: "user_centricity"
        severity: "medium"
        points: 5.0
        explanation: "'40% faster' - aber für wen? Alle User oder nur große Projekte?"
        check_method: "keyword_presence"
        min_keywords: 2
        keywords: ["performance", "context", "impact", "wer profitiert", "use case"]
        changelog_principle: "Context Matters"
      
      - issue: "Keine Links zu Issues/PRs"
        category: "traceability"
        severity: "medium"
        points: 5.0
        explanation: "'Closes #234' im Commit, aber nicht in Release Notes verlinkt"
        check_method: "keyword_presence"
        min_keywords: 2
        keywords: ["links", "#234", "#189", "#312", "github", "issue"]
        changelog_principle: "Traceability"
      
      - issue: "Enterprise-Feature nicht als solches gekennzeichnet"
        category: "segmentation"
        severity: "medium"
        points: 5.0
        explanation: "SAML SSO ist Enterprise-only - sollte erwähnt werden (💼)"
        check_method: "keyword_presence"
        min_keywords: 2
        keywords: ["enterprise", "plan", "tier", "pricing", "premium", "💼"]
        changelog_principle: "Feature Availability"
      
      - issue: "Deprecation ohne Timeline"
        category: "completeness"
        severity: "low"
        points: 4.0
        explanation: "v1 API removed - aber wann wurde es deprecated? Keine Warning vorher?"
        check_method: "keyword_presence"
        min_keywords: 2
        keywords: ["deprecated", "deprecation", "warning", "timeline", "sunset"]
        changelog_principle: "Predictable Deprecation"

    # LEVEL 4: Expert Issues (Very Hard - 20.0 Points)
    expert_issues:
      - issue: "Keine Zielgruppen-Segmentierung"
        category: "segmentation"
        severity: "medium"
        points: 5.0
        explanation: "API-Changes interessieren nur Developers - sollte separate Section haben"
        check_method: "keyword_presence"
        min_keywords: 2
        keywords: ["for developers", "for admins", "api changes", "zielgruppe", "segmentierung"]
        changelog_principle: "Audience Segmentation"
      
      - issue: "Keine Contributors-Credits"
        category: "community"
        severity: "low"
        points: 4.0
        explanation: "Open Source Convention: Contributors erwähnen (Community-Building)"
        check_method: "keyword_presence"
        min_keywords: 2
        keywords: ["contributors", "credits", "thanks", "community", "@username"]
        changelog_principle: "Community Recognition"
      
      - issue: "Keine Rollback-Informationen"
        category: "completeness"
        severity: "medium"
        points: 5.0
        explanation: "Wie mache ich Rollback, falls Breaking Change Probleme macht?"
        check_method: "keyword_presence"
        min_keywords: 2
        keywords: ["rollback", "downgrade", "revert", "zurück", "rückgängig"]
        changelog_principle: "Risk Mitigation"
      
      - issue: "Fehlende Known Issues Section"
        category: "transparency"
        severity: "low"
        points: 3.0
        explanation: "Gibt es bekannte Probleme in dieser Version? (Edge Cases)"
        check_method: "keyword_presence"
        min_keywords: 2
        keywords: ["known issues", "limitations", "bekannte probleme", "einschränkungen"]
        changelog_principle: "Transparency"
      
      - issue: "Nicht maschinenlesbar (kein strukturiertes Format)"
        category: "maintainability"
        severity: "low"
        points: 3.0
        explanation: "Kein JSON/YAML für automatische Changelog-Aggregation-Tools"
        check_method: "keyword_presence"
        min_keywords: 2
        keywords: ["json", "yaml", "structured", "parseable", "machine-readable"]
        changelog_principle: "Automation-Friendly"

  # ------------------------------------------------------------
  # 2. Solution Quality (30 Points)
  # ------------------------------------------------------------
  solution_quality:
    weight: 30
    description: "Qualität der verbesserten Release Notes"
    
    criteria:
      - name: "Keep a Changelog Structure"
        points: 10
        check_method: "keyword_presence"
        keywords: ["added", "changed", "fixed", "security", "breaking"]
        min_keywords: 2
        description: "Are commits grouped by Added, Changed, Fixed, Security?"
      
      - name: "User-Centric Language"
        points: 10
        check_method: "keyword_presence"
        keywords: ["user", "benefit", "you can now", "easier"]
        min_keywords: 2
        description: "Are technical details translated into user benefits?"
      
      - name: "Semantic Versioning"
        points: 10
        check_method: "keyword_presence"
        keywords: ["v3.0.0", "major", "breaking"]
        min_keywords: 1
        description: "Is the version correctly identified as v3.0.0 due to breaking changes?"
