# ============================================================

context: |
  Du bist ein Technical Writer für ein SaaS-Produkt (Projektmanagement-Tool).
  Das Team released alle 2 Wochen eine neue Version, aber die Release Notes
  sind nur eine Copy-Paste der Git-Commit-Messages - unverständlich für Endnutzer.

  **Produkt:** TaskFlow (Projektmanagement SaaS)
  **Zielgruppe Release Notes:**
    - End-User (Projektmanager, keine Tech-Kenntnisse)
    - Admins (Setup, Security-Awareness)
    - Developers (API-Changes, Breaking Changes)

  **Problem:** Git-Commits sind:
    - Zu technisch ("refactor: extract auth middleware")
    - Keine User-Benefits erklärt ("fix: update regex pattern")
    - Nicht kategorisiert (Features, Bugfixes, Breaking Changes)
    - Nicht priorisiert (Wichtige Fixes vs. Minor Tweaks)

  **Release:** v2.3.0 (15 Commits aus letzten 2 Wochen)

prompt: |
  Analysiere die folgende Git-Commit-History und transformiere sie in
  **user-facing Release Notes nach Keep a Changelog Standard**.

  **Wichtig:** Identifiziere ALLE Probleme und transformiere in nutzerfreundliche Sprache.

  ## Kategorien:
  1. **Struktur & Kategorisierung** - Added/Changed/Fixed/Security, Semantic Versioning, Summary
  2. **User-Centricity** - User-Benefits statt Tech-Details, verständliche Sprache
  3. **Vollständigkeit & Priorisierung** - Breaking Changes, Security, Migration Guides
  4. **Format & Wartbarkeit** - Keep a Changelog Standard, Links, Contributors

  ---

  ## Git-Commit-History (v2.3.0):



  ---

  ## Deine Aufgabe

  1. **Identifiziere alle Probleme** in den 4 Kategorien
  2. **Bestimme Semantic Version:**
     - MAJOR (Breaking Changes) → v3.0.0
     - MINOR (New Features) → v2.3.0
     - PATCH (Bugfixes only) → v2.2.1
  3. **Kategorisiere Commits nach Keep a Changelog:**
     - 🚨 Breaking Changes
     - ✨ Added (New Features)
     - 🔄 Changed (Improvements)
     - 🐛 Fixed (Bugfixes)
     - 🔒 Security
     - ⚠️ Deprecated
  4. **Transformiere in User-Facing Language:**
     - "feat(api): add webhook support" → "You can now receive real-time notifications via webhooks"
     - "fix: resolve XSS vulnerability" → "Fixed a security issue in comments"
  5. **Erstelle vollständige Release Notes** mit Migration Guides, Links, Segmentierung

  WICHTIG: Bitte liste zuerst explizit alle gefundenen Probleme auf (Schritt 1), bevor du die Release Notes erstellst. Halte deine Problem-Aufzählung jedoch extrem kurz (als kompakte Liste), um Token-Limits für die finalen Release Notes zu wahren.

