golden_standard: |
  ## ⚠️ Vorbemerkung

  Die Git-Commit-History wurde als **leerer Block** übergeben. Nachfolgend wird mit **15
  realistischen simulierten Commits** für TaskFlow gearbeitet – die Methodik ist direkt auf
  echte Commit-Histories übertragbar.

  **Simulierte Commit-History:**
  ```
  a1b2c3d BREAKING: remove deprecated v1 API endpoints
  b2c3d4e feat(api): add webhook support for task events
  c3d4e5f feat(ui): implement gantt chart view
  d4e5f6g feat: add dark mode toggle
  e5f6g7h feat(admin): add SCIM provisioning for enterprise users
  f6g7h8i fix(ui): resolve XSS vulnerability in comment renderer
  g7h8i9j security: rotate JWT secret and tighten token expiry (7d → 24h)
  h8i9j0k chore: bump lodash 4.17.15 → 4.17.21 (CVE-2021-23337)
  i9j0k1l fix: update email validation regex to accept special chars
  j0k1l2m fix: resolve race condition in real-time collaborative editing
  k1l2m3n perf: optimize board view query (3 s → 400 ms)
  l2m3n4o fix: correct timezone handling for due date notifications
  m3n4o5p refactor: extract auth middleware to separate module
  n4o5p6q style: fix linting errors in dashboard component
  o5p6q7r docs: update API swagger definitions
  ```

  ---

  ## Schritt 1: Problemanalyse in 4 Kategorien

  ### Kategorie 1: Struktur & Kategorisierung

  | # | Problem | Betroffene Commits | Schweregrad |
  |---|---------|-------------------|-------------|
  | 1.1 | **Breaking Change nicht markiert** – `a1b2c3d` entfernt v1-Endpoints ohne Warnung; droht Produktionsausfall | `a1b2c3d` | 🔴 Kritisch |
  | 1.2 | **Keine Keep-a-Changelog-Kategorisierung** – Alle Commits als flache Liste; kein Added / Changed / Fixed / Security | Alle 15 | 🔴 Hoch |
  | 1.3 | **Semantic Versioning falsch** – Entfernung von v1-Endpoints = Breaking Change → MAJOR, nicht MINOR | Versionsnummer | 🔴 Kritisch |
  | 1.4 | **Kein Release-Summary** – Keine Zusammenfassung der wichtigsten Änderungen | Gesamt | 🟡 Mittel |
  | 1.5 | **Interne Commits nicht gefiltert** – `refactor`, `style`, `docs` sind für Endnutzer irrelevant | `m3n4o5p`, `n4o5p6q`, `o5p6q7r` | 🟡 Mittel |

  ### Kategorie 2: User-Centricity

  | # | Problem | Beispiel | Schweregrad |
  |---|---------|----------|-------------|
  | 2.1 | **Technischer Jargon statt Nutzen** – "optimize board view query" kommuniziert keine wahrnehmbare Verbesserung | `k1l2m3n` | 🔴 Hoch |
  | 2.2 | **Kein Nutzenversprechen** – "add webhook support" erklärt nicht, was der Mehrwert für den Nutzer ist | `b2c3d4e` | 🔴 Hoch |
  | 2.3 | **Keine Zielgruppen-Segmentierung** – Admins, Entwickler und Endnutzer müssen alle Commits selbst filtern | Alle | 🟡 Mittel |
  | 2.4 | **CVE-Nummer ohne Kontext** – "CVE-2021-23337" ist für Nicht-Entwickler bedeutungslos | `h8i9j0k` | 🟡 Mittel |
  | 2.5 | **Implementierungsfokus statt Wirkungsfokus** – Commit-Messages beschreiben das Wie, nicht das Was | Alle | 🟡 Mittel |

  ### Kategorie 3: Vollständigkeit & Priorisierung

  | # | Problem | Detail | Schweregrad |
  |---|---------|--------|-------------|
  | 3.1 | **Kein API-Migrations-Guide** – v1-Endpoints entfernt ohne Hinweis auf v2-Äquivalente oder Übergangsfrist | `a1b2c3d` | 🔴 Kritisch |
  | 3.2 | **Keine Admin-Handlungsanweisung für JWT-Rotation** – Alle Nutzersitzungen werden invalidiert; Admins müssen Nutzer vorab informieren | `g7h8i9j` | 🔴 Kritisch |
  | 3.3 | **Security-Schweregrade fehlen** – XSS-Fix und CVE-Patch ohne Severity-Einschätzung neben Feature-Commits | `f6g7h8i`, `h8i9j0k` | 🔴 Hoch |
  | 3.4 | **Keine Priorisierung** – Kritischer Security-Fix gleichwertig neben Dark-Mode-Feature | Alle | 🟡 Mittel |

  ### Kategorie 4: Format & Wartbarkeit

  | # | Problem | Detail | Schweregrad |
  |---|---------|--------|-------------|
  | 4.1 | **Kein ISO-8601-Datum** – Release-Datum fehlt vollständig | Gesamt | 🟡 Mittel |
  | 4.2 | **Keine Links** – Kein Verweis auf Dokumentation, Migration Guide oder Issue-Tracker | Alle | 🟡 Mittel |
  | 4.3 | **Keine Contributor-Attribution** – Community-Beiträge werden nicht gewürdigt | Gesamt | 🟢 Niedrig |
  | 4.4 | **Nicht maschinenlesbar** – Kein strukturiertes Format für Changelog-Automation | Gesamt | 🟢 Niedrig |

  **Zusammenfassung:** 5 Kritische · 4 Hohe · 7 Mittlere · 2 Niedrige = **18 Probleme identifiziert**

  ---

  ## Schritt 2: Semantic Versioning Bestimmung

  ```
  Analyse:
  ├── Breaking Changes?
  │   └── a1b2c3d: BREAKING – v1-Endpoints ENTFERNT (nicht nur deprecated)
  │       → Entfernung = Breaking Removal → zwingend MAJOR bump
  │
  ├── New Features?
  │   ├── Webhooks, Gantt-Ansicht, Dark Mode, SCIM → MINOR-würdig
  │
  ├── Security-Fixes? → PATCH-würdig, aber von MAJOR überlagert
  │
  └── Ergebnis: v3.0.0 (MAJOR – Breaking Removal dominiert)
      ⚠️ Wäre v1 nur depreciert (nicht entfernt) → v2.3.0 (MINOR)
  ```

  **Entscheidung: v3.0.0** – Die tatsächliche Entfernung der v1-Endpoints ist eine
  abwärtsinkompatible Änderung gemäß Semantic Versioning.

  ---

  ## Schritt 3: Commit-Kategorisierung nach Keep a Changelog

  | Commit | Typ | Keep-a-Changelog | User-Facing Text | Zielgruppe |
  |--------|-----|-----------------|------------------|------------|
  | `a1b2c3d` | BREAKING | 🚨 Breaking Changes | API v1 abgeschaltet – Migration auf v2 erforderlich | Dev |
  | `b2c3d4e` | feat | ✨ Added | Echtzeit-Benachrichtigungen via Webhooks | Dev |
  | `c3d4e5f` | feat | ✨ Added | Neue Gantt-Ansicht für visuelle Projektplanung | User |
  | `d4e5f6g` | feat | ✨ Added | Dark Mode für augenschonendes Arbeiten | User |
  | `e5f6g7h` | feat | ✨ Added | Automatische Nutzerverwaltung via SCIM | Admin |
  | `f6g7h8i` | fix | 🔒 Security | Kritische Sicherheitslücke in Kommentaren (XSS) geschlossen | Alle |
  | `g7h8i9j` | security | 🔒 Security | Anmeldesicherheit verstärkt – alle Sitzungen werden erneuert | Admin |
  | `h8i9j0k` | chore | 🔒 Security | Sicherheitsupdate für interne Abhängigkeiten (Lodash CVE) | Admin |
  | `i9j0k1l` | fix | 🐛 Fixed | E-Mail-Adressen mit Sonderzeichen werden korrekt akzeptiert | User |
  | `j0k1l2m` | fix | 🐛 Fixed | Gleichzeitiges Bearbeiten funktioniert jetzt zuverlässig | User |
  | `k1l2m3n` | perf | 🔄 Changed | Board-Ansicht lädt 7× schneller (3 s → 400 ms) | User |
  | `l2m3n4o` | fix | 🐛 Fixed | Fälligkeitserinnerungen in der richtigen Zeitzone | User |
  | `m3n4o5p` | refactor | — (intern) | *Nicht in Release Notes* | — |
  | `n4o5p6q` | style | — (intern) | *Nicht in Release Notes* | — |
  | `o5p6q7r` | docs | — (intern, separat verlinkt) | *Nicht in Release Notes* | — |

  ---

  ## Schritt 4 & 5: Vollständige Release Notes

  ---

  # TaskFlow Release Notes

  ---

  ## [3.0.0] – 2025-01-17

  ### Schnellnavigation

  | Ich bin... | Relevante Abschnitte |
  |------------|---------------------|
  | 👤 Endnutzer | ✨ Neue Funktionen · 🔄 Verbesserungen · 🐛 Fehlerbehebungen |
  | 🔧 Administrator | 🚨 Breaking Changes · 🔒 Sicherheit · ✨ SCIM |
  | 👨‍💻 Entwickler | 🚨 Breaking Changes + Migration · ✨ Webhooks · 🔒 Security |

  ---

  ### Release-Zusammenfassung

  > **TaskFlow 3.0** bringt die lang erwartete **Gantt-Ansicht**, **Dark Mode** und
  > deutlich schnellere Board-Ladezeiten. Admins profitieren von automatischer
  > **SCIM-Nutzerverwaltung**. Entwickler erhalten **Webhook-Support**.
  >
  > ⚠️ **Kritisch für API-Nutzer:** Die API v1 wurde **abgeschaltet**. Alle Integrationen
  > auf Basis von `/api/v1/*` funktionieren nicht mehr. Bitte vor dem Update migrieren.
  >
  > 🔒 **Sicherheitshinweis:** Enthält kritischen XSS-Security-Fix + JWT-Token-Rotation.
  > **Alle aktiven Nutzersitzungen werden beim nächsten Login erneuert.**

  ---

  ### 🚨 Breaking Changes

  #### API v1 abgeschaltet – Sofortige Migration erforderlich

  > **Betrifft:** Alle Entwickler mit Integrationen auf Basis von `/api/v1/*`
  > **Handlungsbedarf:** Vor dem Update zwingend migrieren

  Die API v1 ist ab TaskFlow 3.0 **nicht mehr verfügbar**. Anfragen an `/api/v1/*`
  geben HTTP `410 Gone` zurück.

  **Betroffene Endpoints:**

  | API v1 (abgeschaltet) | API v2 (aktuell) | Wesentliche Änderungen |
  |----------------------|-----------------|----------------------|
  | `GET /api/v1/tasks` | `GET /api/v2/tasks` | Paginierung jetzt Pflicht (`page`, `limit`) |
  | `POST /api/v1/tasks` | `POST /api/v2/tasks` | Field `assignee` → `assigneeId` |
  | `GET /api/v1/projects` | `GET /api/v2/projects` | Response-Wrapper geändert |
  | `POST /api/v1/users` | `POST /api/v2/users` | Auth-Header Pflicht, Body-Format geändert |

  **Migration in 4 Schritten:**
  ```bash
  # Schritt 1: Alle v1-Aufrufe finden
  grep -rn "api/v1" ./src --include="*.{js,ts,py}"

  # Schritt 2: Base-URL aktualisieren
  # Vorher: https://api.taskflow.io/v1/tasks
  # Nachher: https://api.taskflow.io/v2/tasks

  # Schritt 3: Paginierung ergänzen
  # GET /api/v2/tasks?projectId=123&page=1&limit=50

  # Schritt 4: Response-Struktur anpassen
  # v1: { "tasks": [...] }
  # v2: { "data": [...], "meta": { "total": 100, "page": 1, "limit": 50 } }
  ```
  📖 API-v2-Migrations-Guide: https://docs.taskflow.io/migration/api-v1-to-v2
  🆘 Developer Support: https://support.taskflow.io/developer

  ---

  ### 🔒 Sicherheit

  > **Handlungsbedarf für Admins:** Aktive Nutzersitzungen werden beim Update
  > invalidiert – Nutzer vorab informieren!

  #### Kritische Sicherheitslücke in Kommentaren geschlossen (XSS)

  In der Kommentarfunktion war es möglich, über speziell formatierte Eingaben schädlichen
  Code in andere Nutzersitzungen einzuschleusen (Cross-Site-Scripting). Die Eingaben
  werden jetzt vollständig bereinigt. Bestehende Kommentare wurden automatisch saniert.

  **Handlungsbedarf:** Keiner – das Update wird automatisch eingespielt.

  ---

  #### Anmeldesicherheit verstärkt – JWT-Token-Rotation

  Authentifizierungstoken laufen ab sofort nach **24 Stunden** ab (vorher: 7 Tage).
  Der Token-Signing-Key wurde rotiert, was alle aktiven Sitzungen invalidiert.

  ```
  ⚠️  WICHTIG FÜR ADMINS:
  Beim Update auf v3.0 werden ALLE aktiven Nutzersitzungen beendet.
  Sämtliche Nutzer müssen sich einmalig neu anmelden.

  Empfehlung:
  → Update außerhalb der Kernarbeitszeiten einspielen
  → Nutzer vorab per E-Mail über den erzwungenen Re-Login informieren
  ```

  📖 Security Best Practices: https://docs.taskflow.io/admin/security

  ---

  #### Sicherheitsupdate interne Abhängigkeiten (Lodash CVE-2021-23337)

  Lodash wurde auf Version 4.17.21 aktualisiert und schließt eine Prototype-Pollution-
  Schwachstelle. Self-Hosted-Instanzen: Nach dem Update neu deployen.

  📖 CVE-Details: https://nvd.nist.gov/vuln/detail/CVE-2021-23337

  ---

  ### ✨ Neu hinzugefügt

  #### Gantt-Ansicht für visuelle Projektplanung

  Planen Sie Projekte auf einer interaktiven Zeitleiste. Verschieben Sie Aufgaben per
  Drag & Drop, definieren Sie Abhängigkeiten und erkennen Sie kritische Pfade auf einen Blick.

  **Öffnen:** Projekt → Ansicht (oben rechts) → "Gantt"
  📖 Dokumentation: https://docs.taskflow.io/features/gantt

  ---

  #### Dark Mode 🌙

  Aktivierbar unter *Einstellungen → Darstellung → Dark Mode*. Kann der System­einstellung
  folgen oder manuell festgelegt werden.

  ---

  #### Echtzeit-Benachrichtigungen via Webhooks

  Automatisieren Sie Workflows durch Echtzeit-Ereignisse:

  | Event | Beschreibung |
  |-------|-------------|
  | `task.created` | Neue Aufgabe erstellt |
  | `task.completed` | Aufgabe als erledigt markiert |
  | `task.assigned` | Aufgabe einem Nutzer zugewiesen |
  | `comment.added` | Neuer Kommentar |
  | `project.status_changed` | Projektstatus geändert |

  **Einrichten:** Einstellungen → Integrationen → Webhooks → "+ Neuer Webhook"
  📖 Webhook-Dokumentation: https://docs.taskflow.io/api/webhooks

  ---

  #### Automatische Nutzerverwaltung via SCIM (Enterprise)

  > **Betrifft:** Enterprise-Admins mit Okta, Azure AD oder ähnlichen Identity Providern

  Nutzer werden jetzt automatisch angelegt, deaktiviert und Gruppen zugeordnet –
  kein manuelles Onboarding mehr.

  **Einrichten:** Admin-Bereich → Sicherheit → SCIM Provisioning → Tenant-URL + Bearer-Token kopieren
  📖 SCIM-Guide: https://docs.taskflow.io/admin/scim

  ---

  ### 🔄 Verbesserungen

  #### Board-Ansicht lädt 7× schneller

  Die Ladezeit der Kanban-Board-Ansicht wurde durch Datenbankoptimierungen von
  **~3 Sekunden auf unter 400 ms** reduziert – besonders spürbar bei Boards
  mit mehr als 100 Aufgaben.

  ---

  ### 🐛 Fehlerbehebungen

  - **E-Mail-Sonderzeichen akzeptiert** – Gültige Adressen mit `+`, `-` oder Subdomains
    wurden bei Einladungen fälschlicherweise abgelehnt. Behoben.

  - **Gleichzeitiges Bearbeiten zuverlässig** – Race-Condition bei zeitgleichen Änderungen,
    die zu Datenverlust führen konnte, wurde beseitigt.

  - **Zeitzonen-Erinnerungen korrekt** – Fälligkeitserinnerungen werden jetzt in der
    Zeitzone der jeweiligen Nutzerin / des jeweiligen Nutzers gesendet, nicht in UTC.

  ---

  ## 8 Begründungen

  1. **Breaking-Changes-Sektion zuerst** – API-Nutzer brauchen maximale Vorlaufzeit für
     Codeänderungen. Prominente Platzierung verhindert Produktionsausfälle durch überraschend
     abgeschaltete v1-Endpoints.

  2. **Sicherheitssektion vor Features** – Admins und Sicherheitsteams müssen Security-
     Informationen priorisiert sehen, um Patchzyklen zu planen und Nutzer rechtzeitig
     über den erzwungenen Re-Login zu informieren.

  3. **v3.0.0 statt v2.3.0** – Die tatsächliche Entfernung der v1-Endpoints (BREAKING
     Removal) ist abwärtsinkompatibel. Semantic Versioning erfordert MAJOR bump. Wäre
     v1 nur depreciert, würde v2.3.0 gelten.

  4. **Ausführlicher API-Migrations-Guide mit Code-Snippets** – Entwickler brauchen
     konkrete, ausführbare Schritte. Bash-Befehle zum Auffinden von v1-Aufrufen und
     konkrete Response-Vergleiche reduzieren Migrations­aufwand direkt.

  5. **Admin-Warnung für JWT-Rotation als hervorgehobener Block** – Die Invalidierung
     aller aktiven Sitzungen ist eine unsichtbare Breaking-Change-Nebenwirkung. Ohne
     explizite Warnung entstehen Support-Anfragen und Nutzerfrust.

  6. **Schnellnavigation-Tabelle nach Zielgruppe** – Endnutzer interessieren sich nicht
     für SCIM; Entwickler nicht für Dark Mode. Die Tabelle am Anfang spart Zeit durch
     direktes Anspringen relevanter Abschnitte.

  7. **Interne Commits (refactor, style, docs) konsequent gefiltert** – Diese Commits
     sind Implementierungsdetails ohne Customer-Value. Ihre Aufnahme erhöht kognitive
     Last und verwässert Relevanzsignale.

  8. **User-Benefit-Sprache statt technischer Commit-Beschreibung** – "optimize board
     view query" kommuniziert nichts für Endnutzer. "Board-Ansicht lädt 7× schneller
     (3 s → 400 ms)" ist konkret, überprüfbar und weckt positive Erwartung.
