  ---

  ## 💡 Wichtigste Einzelempfehlung

  Das **größte ROI-Problem** ist die fehlende `Configuration`-Section. Sie ist die häufigste Ursache für Support-Anfragen bei CLI-Tools. Eine vollständige, kommentierte `config.yaml` mit allen Optionen, Typen und Defaults würde allein ~40% der potenziellen GitHub Issues verhindern.

  **Vollständiges config.yaml-Beispiel:**
  ```yaml
  # config.yaml
  loganalyzer:
    # Default log format (auto-detected if omitted)
    format_type: nginx  # apache | nginx | syslog | custom

    # Severity levels to include
    severity_filter:
      - WARNING
      - ERROR
      - CRITICAL

    # Output settings
    output:
      format: html        # html | json | csv
      path: ./reports/
      timestamp_suffix: true  # report_2024-01-15.html

    # Email notifications
    notifications:
      enabled: false
      smtp_host: smtp.company.com
      smtp_port: 587
      from: loganalyzer@company.com
      to:
        - devops@company.com
      triggers:
        - severity: CRITICAL
          threshold: 5
          window_minutes: 10

    # Custom log format (regex)
    custom_formats:
      myapp:
        pattern: '^\[(?P<timestamp>[\d\-\: ]+)\] (?P<severity>\w+) (?P<message>.*)'
        timestamp_format: '%Y-%m-%d %H:%M:%S'
  ```
