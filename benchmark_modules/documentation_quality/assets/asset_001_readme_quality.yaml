context: "Du bist ein Technical Writer für ein Open-Source Python-Projekt. \nEin Junior\
  \ Developer hat die erste Version einer README.md Datei erstellt, \naber es fehlen\
  \ wichtige Elemente und die Struktur ist verbesserungswürdig.\n\nDas Projekt ist\
  \ eine CLI-Anwendung zum Analysieren von Log-Dateien.\nZielgruppe: DevOps Engineers\
  \ und Backend Developers.\n"
difficulty_breakdown:
  advanced_issues: 25
  expert_issues: 20
  labeled_issues: 25
  standard_issues: 30
evaluation_notes: 'Dieses Asset testet README-Qualitätsbewertung mit Tiered Difficulty:


  **Tiered Difficulty Breakdown:**

  - LEVEL 1 (Easy - 25P): Offensichtliche Probleme (fehlende Syntax Highlighting,
  kurze Installation)

  - LEVEL 2 (Medium - 30P): Standard-Probleme (fehlendes TOC, keine Links, keine Versions-Info)

  - LEVEL 3 (Hard - 25P): Subtile Issues (fehlender Quick Start, Zielgruppe, Contributing)

  - LEVEL 4 (Expert - 20P): Best Practices (API-Docs, Keywords, Production Status)


  **Scoring:**

  - 100 Punkte: Issue Detection (alle 4 Levels)

  - 30 Punkte: Solution Quality (Code-Beispiele, Best Practices, Priorisierung)

  '
expected_output: 'Eine strukturierte Analyse, die maximal 8 Kernprobleme identifiziert.


  **BEWERTUNGSRUBRIK (4x25 Punkte):**

  Bewerte die Antwort nach diesen 4 Dimensionen (je 25 Punkte, max. 100):

  1. Struktur-Compliance (Inkludierung aller geforderten Sektionen & sauberes Format)

     - 25: Alle Pflicht-Sektionen vorhanden (Executive Summary, kategorisierte Issue-Liste,
       Prioritäten), sauberes Markdown mit Tabellen oder Listen

     - 15: 3 von 4 Pflicht-Sektionen vorhanden, leichte Format-Mängel

     - 5: ≤2 Sektionen oder unstrukturierte Freitext-Antwort

     - 0: Keine erkennbare Struktur

  2. Inhaltliche Vollständigkeit (präzise pro identifiziertem Problem)

     - 25: 8+ Issues korrekt identifiziert aus den 4 Difficulty-Levels

     - 15: 5-7 Issues identifiziert, alle Level-1+2-Issues abgedeckt

     - 5: 3-4 Issues, nur offensichtliche Level-1-Probleme

     - 0: Weniger als 3 Issues oder keine README-spezifischen Probleme

  3. Beispiel-Qualität (konkrete Beispiele vs. generisches Blabla)

     - 25: Code-Snippets oder konkrete Vorlagen für mind. 3 Fixes enthalten

     - 15: Konkrete Lösungsvorschläge ohne Code-Beispiele

     - 5: Nur generische Keywords ("TOC hinzufügen") ohne Umsetzungsdetails

     - 0: Keine Beispiele oder Lösungsvorschläge

  4. Ton/Sprache (entspricht Golden Standard eines Technical Writers)

     - 25: Professioneller Technical-Writer-Ton auf Deutsch, klar priorisiert

     - 15: Sachlich korrekt aber generisch, keine Priorisierung

     - 5: Englisch oder sehr informal, oder stark abschweifend

     - 0: Unpassend für die Zielgruppe (DevOps/Backend Engineers)


  **Identifizierbare Probleme (Referenz für Vollständigkeit):**

  - Fehlende Code Syntax Highlighting

  - Installation zu kurz

  - Kein Troubleshooting/FAQ

  - Code-Beispiele ohne Kontext

  - Fehlendes Inhaltsverzeichnis (TOC)

  - Keine Links zu Dokumentation/Repository

  - Konfiguration nicht dokumentiert

  - Keine Versions-Info

  - Fehlender Quick Start

  - Zielgruppe nicht genannt

  - Kein Contributing Guide

  - Schwache visuelle Hierarchie

  - API-Dokumentation zu kurz

  - Keine Keywords/Tags

  - Kein Production Readiness Status

  - Fehlende Migration Guidelines

  '
golden_standard: "# README.md Analyse: LogAnalyzer\n\n## Executive Summary\n\nDie\
  \ aktuelle README.md erfüllt nur **Minimalanforderungen** und würde erfahrene DevOps\
  \ Engineers und Backend Developers nicht überzeugen. Von 20 Best-Practice-Kriterien\
  \ werden nur **4 ansatzweise erfüllt**. Es wurden **23 Probleme** in 4 Kategorien\
  \ identifiziert, davon **4 kritisch** (blockieren Adoption direkt).\n\n---\n\n##\
  \ \U0001F4CA Probleme nach Kategorien & Schweregrad\n\n### Legende\n| Symbol | Schweregrad\
  \ | Bedeutung |\n|--------|-------------|-----------|\n| \U0001F534 | **Critical**\
  \ | Blockiert Nutzung / verhindert Adoption |\n| \U0001F7E0 | **High** | Signifikante\
  \ Beeinträchtigung der UX |\n| \U0001F7E1 | **Medium** | Qualitätsmangel, aber umgehbar\
  \ |\n| \U0001F7E2 | **Low** | Nice-to-have / Polish |\n\n---\n\n### Kategorie 1:\
  \ Struktur & Klarheit\n\n| # | Problem | Schweregrad | Konkrete Lösung |\n|---|---------|-------------|-----------------|\n\
  | 1.1 | **Kein Table of Contents** – Bei wachsender Doku sofort unnavigierbar |\
  \ \U0001F7E0 High | TOC mit Anchor-Links nach dem Intro-Absatz einfügen |\n| 1.2\
  \ | **Kein Badges/Status-Bereich** – Keine Info zu Build-Status, Version, Python-Kompatibilität\
  \ | \U0001F7E0 High | Shields.io Badges für PyPI, CI/CD, Coverage, License direkt\
  \ unter dem Titel |\n| 1.3 | **Schwache Projekt-Beschreibung** – „A Python tool\
  \ for analyzing log files\" ist zu generisch | \U0001F7E0 High | USP herausstellen:\
  \ Geschwindigkeit, Formate, konkrete Zielgruppe |\n| 1.4 | **Sections in falscher\
  \ Reihenfolge** – „Features\" steht nach „Usage\" | \U0001F7E1 Medium | Reihenfolge:\
  \ Intro → Badges → Features → Installation → Quick Start → Usage → Config |\n| 1.5\
  \ | **„Config\" zu informell** – Inkonsistente Terminologie | \U0001F7E2 Low | Umbenennen\
  \ zu `## Configuration` |\n| 1.6 | **Kein visueller Trenner zwischen Major-Sections**\
  \ | \U0001F7E2 Low | Horizontale Linien (`---`) zwischen Haupt-Sektionen |\n\n**Beispiel\
  \ TOC:**\n```markdown\n## Table of Contents\n- [Quick Start](#quick-start)\n- [Features](#features)\n\
  - [Installation](#installation)\n- [Usage](#usage)\n- [Configuration](#configuration)\n\
  - [Examples](#examples)\n- [Troubleshooting](#troubleshooting)\n- [Contributing](#contributing)\n\
  - [License](#license)\n```\n\n---\n\n### Kategorie 2: Vollständigkeit\n\n| # | Problem\
  \ | Schweregrad | Konkrete Lösung |\n|---|---------|-------------|-----------------|\n\
  | 2.1 | **Keine Prerequisites/Requirements** – Python-Version? OS-Support? Dependencies?\
  \ | \U0001F534 Critical | Eigene Section `## Prerequisites` mit Python-Version,\
  \ OS-Matrix |\n| 2.2 | **Configuration Section ist leer** – „Create a config.yaml\"\
  \ ohne Inhalt | \U0001F534 Critical | Vollständige `config.yaml` mit allen Keys,\
  \ Typen, Defaults und Kommentaren |\n| 2.3 | **Keine CLI-Referenz** – Welche Flags/Options\
  \ existieren? | \U0001F534 Critical | `## CLI Reference` mit vollständiger Options-Tabelle\
  \ |\n| 2.4 | **Installation unvollständig** – Kein venv-Hinweis, kein Extras-Install,\
  \ kein Source-Install | \U0001F534 Critical | Mehrere Installations-Pfade (PyPI,\
  \ Source, Dev-Setup) |\n| 2.5 | **Keine Real-World Examples** – Nur ein einziger\
  \ Basis-Befehl, kein Output gezeigt | \U0001F7E0 High | Mindestens 3–5 Use-Cases\
  \ mit echten Befehlen und erwarteten Outputs |\n| 2.6 | **Kein Troubleshooting-Bereich**\
  \ | \U0001F7E0 High | `## Troubleshooting` mit häufigen Fehlern und Lösungen |\n\
  | 2.7 | **Email-Notification-Feature undokumentiert** – In Features erwähnt, nicht\
  \ erklärt | \U0001F7E0 High | SMTP-Config-Beispiel in Configuration-Section |\n\
  | 2.8 | **Keine API-Dokumentation für Library-Usage** – `LogParser` ist nicht dokumentiert\
  \ | \U0001F7E0 High | Methoden, Parameter, Return-Types dokumentieren |\n| 2.9 |\
  \ **Kein Contributing Guide** | \U0001F7E1 Medium | `## Contributing` mit Link zu\
  \ `CONTRIBUTING.md` |\n| 2.10 | **Kein Changelog / Versionshistorie** | \U0001F7E1\
  \ Medium | Link zu `CHANGELOG.md` |\n\n**Beispiel Prerequisites:**\n```markdown\n\
  ## Prerequisites\n\n- **Python**: 3.9 or higher\n- **OS**: Linux, macOS, Windows\
  \ (WSL recommended)\n- **Memory**: Minimum 512 MB RAM for large log files (>1 GB)\n\
  \n### System Dependencies\n```bash\n# Ubuntu/Debian\nsudo apt-get install python3-dev\n\
  \n# macOS\nbrew install python@3.11\n```\n```\n\n**Beispiel vollständige Installation:**\n\
  ```markdown\n## Installation\n\n### Option 1: PyPI (Recommended)\n```bash\npip install\
  \ loganalyzer\n\n# With optional email support\npip install loganalyzer[email]\n\
  \n# With all extras\npip install loganalyzer[all]\n```\n\n### Option 2: From Source\n\
  ```bash\ngit clone https://github.com/yourorg/loganalyzer.git\ncd loganalyzer\n\
  python -m venv .venv\nsource .venv/bin/activate  # Windows: .venv\\Scripts\\activate\n\
  pip install -e \".[dev]\"\n```\n\n### Verify Installation\n```bash\nloganalyzer\
  \ --version\n# Expected output: loganalyzer 1.4.2\n```\n```\n\n---\n\n### Kategorie\
  \ 3: Technische Korrektheit\n\n| # | Problem | Schweregrad | Konkrete Lösung |\n\
  |---|---------|-------------|-----------------|\n| 3.1 | **Kein Syntax Highlighting**\
  \ – Alle Code-Blöcke ohne Sprach-Tag | \U0001F534 Critical | ` ```bash ` für Shell,\
  \ ` ```python ` für Python, ` ```yaml ` für Config |\n| 3.2 | **Python-Code nicht\
  \ als Code-Block formatiert** – Wird als Fließtext gerendert | \U0001F534 Critical\
  \ | Fenced Code Blocks mit Sprach-Tag für alle Beispiele |\n| 3.3 | **Keine Versionsinformation**\
  \ – Welche Version wird dokumentiert? | \U0001F7E0 High | Version in Badges + explizit\
  \ in Installation |\n| 3.4 | **Keine Links** – Keine Verweise auf PyPI, GitHub,\
  \ Docs, Issue Tracker | \U0001F7E1 Medium | Links zu PyPI, Repository, ReadTheDocs\
  \ etc. |\n| 3.5 | **Custom-Log-Format undokumentiert** – Feature erwähnt, Syntax\
  \ fehlt | \U0001F7E1 Medium | Format-Spezifikation mit Regex-Beispiel |\n| 3.6 |\
  \ **Python-API-Beispiel unvollständig** – Kein Error Handling, kein vollständiger\
  \ Import | \U0001F7E1 Medium | Lauffähiges Code-Snippet mit try/except |\n\n**Beispiel\
  \ korrektes Syntax Highlighting:**\n````markdown\n```bash\nloganalyzer analyze /var/log/nginx/access.log\
  \ \\\n  --format nginx \\\n  --output-format json \\\n  --severity ERROR,CRITICAL\
  \ \\\n  --output ./reports/\n```\n\n```python\nfrom loganalyzer import LogParser,\
  \ ReportGenerator\n\nparser = LogParser(format=\"nginx\")\n\ntry:\n    results =\
  \ parser.analyze(\"access.log\")\n    print(f\"Found {results.error_count} errors\"\
  )\nexcept FileNotFoundError as e:\n    print(f\"Log file not found: {e}\")\n```\n\
  \n```yaml\n# config.yaml\nloganalyzer:\n  format_type: nginx\n  severity_filter:\n\
  \    - WARNING\n    - ERROR\n    - CRITICAL\n  output:\n    format: html\n    path:\
  \ ./reports/\n```\n````\n\n---\n\n### Kategorie 4: Usability\n\n| # | Problem |\
  \ Schweregrad | Konkrete Lösung |\n|---|---------|-------------|-----------------|\n\
  | 4.1 | **Kein Quick Start** – DevOps Engineers wollen sofort loslegen | \U0001F7E0\
  \ High | `## Quick Start` als zweite Section mit Copy-Paste-Ready Commands |\n|\
  \ 4.2 | **Keine Keywords/SEO** – „log analysis python\", „nginx log parser\" etc.\
  \ fehlen | \U0001F7E0 High | Keywords natürlich in Beschreibung integrieren |\n\
  | 4.3 | **Kein Screenshot/Demo** – Keine visuelle Vorschau des Outputs | \U0001F7E0\
  \ High | GIF/Screenshot des CLI-Outputs oder generierten Reports |\n| 4.4 | **Value\
  \ Proposition zu schwach** | \U0001F7E0 High | Konkrete Vorteile: Geschwindigkeit,\
  \ Formate, Unique Features |\n| 4.5 | **Kein Support-Kanal** – Wo stellt man Fragen?\
  \ | \U0001F7E1 Medium | Links zu GitHub Issues, Discussions |\n| 4.6 | **Keine Security-Information**\
  \ | \U0001F7E1 Medium | Verweis auf `SECURITY.md` |\n\n**Beispiel starker Quick\
  \ Start:**\n```markdown\n## ⚡ Quick Start\n\n```bash\n# Install\npip install loganalyzer\n\
  \n# Analyze your first log file\nloganalyzer analyze /var/log/nginx/access.log --format\
  \ nginx\n\n# Output: reports/report.html\n```\n\n**That's it.** For advanced usage,\
  \ see [Configuration](#configuration).\n```\n\n**Beispiel starke Value Proposition:**\n\
  ```markdown\n# LogAnalyzer \U0001F50D\n\n> Parse, analyze, and report on log files\
  \ from **Apache, Nginx, and custom formats**\n> in seconds — not hours.\n\n**LogAnalyzer**\
  \ is a fast, extensible CLI tool for DevOps Engineers and Backend Developers\nwho\
  \ need actionable insights from log data without writing custom parsing scripts.\n\
  \n- \U0001F680 **Fast**: Processes 1M log lines in under 10 seconds\n- \U0001F4CA\
  \ **Rich Reports**: HTML dashboards and machine-readable JSON output\n- \U0001F514\
  \ **Alerting**: Email notifications for critical error thresholds\n- \U0001F527\
  \ **Flexible**: Custom log format support via regex patterns\n```\n\n---\n\n## \U0001F4C8\
  \ Gesamtbewertung\n\n```\nKategorie                  Aktuell    Nach Fixes    Gewichtung\n\
  ─────────────────────────────────────────────────────────────\nStruktur & Klarheit\
  \          2/10        9/10          20%\nVollständigkeit              1/10    \
  \    9/10          35%\nTechnische Korrektheit       2/10        9/10          30%\n\
  Usability                    1/10        8/10          15%\n─────────────────────────────────────────────────────────────\n\
  GESAMT                      1.5/10      8.9/10        100%\n```\n\n---\n\n## \U0001F5FA\
  ️ Empfohlene Prioritäten-Roadmap\n\n```\nSPRINT 1 – Critical (sofort, blockiert\
  \ Adoption)\n├── Syntax Highlighting für alle Code-Blöcke\n├── Prerequisites Section\n\
  ├── Quick Start Section\n├── CLI Reference mit vollständiger Options-Tabelle\n└──\
  \ Configuration Section mit vollständigem YAML-Beispiel\n\nSPRINT 2 – High (diese\
  \ Woche)\n├── Badges (Version, CI, License)\n├── Real-World Examples (3–5 Szenarien\
  \ mit Output)\n├── Troubleshooting Section\n├── Screenshot/Demo GIF\n├── API-Dokumentation\
  \ für Library-Nutzung\n└── Stärkere Value Proposition\n\nSPRINT 3 – Medium (nächste\
  \ Woche)\n├── Table of Contents\n├── Contributing Guide\n├── Email-Feature dokumentieren\n\
  ├── Support & Security Sections\n└── Changelog Link\n\nSPRINT 4 – Low (Backlog)\n\
  ├── Code of Conduct\n├── Acknowledgements\n├── Visual Polish\n└── SEO-Optimierung\n\
  ```\n\n---\n\n## \U0001F4A1 Wichtigste Einzelempfehlung\n\nDas **größte ROI-Problem**\
  \ ist die fehlende `Configuration`-Section. Sie ist die häufigste Ursache für Support-Anfragen\
  \ bei CLI-Tools. Eine vollständige, kommentierte `config.yaml` mit allen Optionen,\
  \ Typen und Defaults würde allein ~40% der potenziellen GitHub Issues verhindern.\n\
  \n**Vollständiges config.yaml-Beispiel:**\n```yaml\n# config.yaml\nloganalyzer:\n\
  \  # Default log format (auto-detected if omitted)\n  format_type: nginx  # apache\
  \ | nginx | syslog | custom\n\n  # Severity levels to include\n  severity_filter:\n\
  \    - WARNING\n    - ERROR\n    - CRITICAL\n\n  # Output settings\n  output:\n\
  \    format: html        # html | json | csv\n    path: ./reports/\n    timestamp_suffix:\
  \ true  # report_2024-01-15.html\n\n  # Email notifications\n  notifications:\n\
  \    enabled: false\n    smtp_host: smtp.company.com\n    smtp_port: 587\n    from:\
  \ loganalyzer@company.com\n    to:\n      - devops@company.com\n    triggers:\n\
  \      - severity: CRITICAL\n        threshold: 5\n        window_minutes: 10\n\n\
  \  # Custom log format (regex)\n  custom_formats:\n    myapp:\n      pattern: '^\\\
  [(?P<timestamp>[\\d\\-\\: ]+)\\] (?P<severity>\\w+) (?P<message>.*)'\n      timestamp_format:\
  \ '%Y-%m-%d %H:%M:%S'\n```\n"
