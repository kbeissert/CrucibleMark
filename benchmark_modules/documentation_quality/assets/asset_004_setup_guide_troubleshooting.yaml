prompt: "Analysiere die folgende Setup-Anleitung und bewerte sie nach **Developer\
  \ Onboarding Best Practices**.\n\n**Wichtig:** Identifiziere ALLE Probleme und priorisiere\
  \ nach Schweregrad.\n\n## Kategorien:\n1. **Struktur & Vollständigkeit** - Prerequisites,\
  \ nummerierte Schritte, Erfolgs-Checks\n2. **Technische Korrektheit** - Copy-pastable\
  \ Commands, ENV-Vars, Ports, Versionen\n3. **Troubleshooting** - Häufige Fehler,\
  \ Lösungen, Error Messages\n4. **Developer Experience** - Quick Start, OS-Hinweise,\
  \ nächste Schritte\n\n---\n\n## Aktuelle Setup-Anleitung (SETUP.md):\n\n```\n# Setup\n\
  \n## Installation\n\nClone the repo:\n\n```\ngit clone https://github.com/company/ecommerce-platform.git\n\
  cd ecommerce-platform\n\n```\n\nInstall dependencies:\n\n```\nnpm install\n\n```\n\
  \nStart the app:\n\n```\ndocker-compose up\n\n```\n\nOpen http://localhost:3000\n\
  \n## Configuration\n\nCreate a .env file with:\n\n```\nDATABASE_URL=postgresql://user:password@localhost:5432/ecommerce\n\
  \n```\n\nRun migrations:\n\n```\nnpm run migrate\n\n```\n\nDone!\n\n```\n\n---\n\
  \n## Deine Aufgabe\n\n1. **Identifiziere alle Probleme** in den 4 Kategorien\n2.\
  \ **Priorisiere** nach Schweregrad:\n   - **Critical**: Fehlende Prerequisites,\
  \ Commands funktionieren nicht\n   - **High**: Keine Troubleshooting-Infos, .env-Beispiel\
  \ fehlt\n   - **Medium**: Keine Erfolgs-Checks, unklare Reihenfolge\n   - **Low**:\
  \ Fehlende OS-Hinweise, kein Quick Start\n3. **Erstelle eine vollständige Setup-Anleitung**\
  \ mit:\n   - Prerequisites-Check mit Versionen\n   - Nummerierte Schritte mit Erfolgs-Validierung\n\
  \   - Troubleshooting-Section mit 5+ häufigen Fehlern\n   - OS-spezifische Hinweise\
  \ (Mac M1/M2, Linux, Windows WSL)\n4. **Begründe** deine Änderungen mit Onboarding-Prinzipien\n\
  \nWICHTIG: Bitte liste zuerst explizit alle gefundenen Probleme auf (Schritt 1),\
  \ bevor du die verbesserte Version erstellst.\nHINWEIS: Halte die einleitende Fehleranalyse\
  \ kompakt und fasse dich bei der abstrakten Begründung am Ende extrem kurz, um keine\
  \ Token zu verschwenden.\n"
