  ## Schritt 3: Begründung der Änderungen

  ### 1. Prerequisites-Section mit Version-Matrix (C1/H5)

  **Problem:** Häufigstes Onboarding-Blocker: fehlende Voraussetzungen.
  **Lösung:** Vollständige Tabelle mit Mindestversionen, Prüfbefehlen und
  einem Copy-&-Paste-Prerequisites-Check-Block.
  **Prinzip:** Setup-Anleitungen müssen "zero-assumption" sein – kein implizites
  Vorwissen über benötigte Tools.

  ### 2. Reihenfolge korrigiert: .env VOR docker compose up (C3/M1)

  **Problem:** Die .env-Datei wurde NACH dem Start der Services erwähnt –
  Docker Compose liest sie beim Start.
  **Lösung:** .env-Konfiguration (Schritt 5) kommt explizit vor "Services starten"
  (Schritt 6), mit einem abgesetzten WARNUNG-Hinweis.
  **Prinzip:** Reihenfolge in Setup-Guides ist nicht optional – ein falscher
  Schritt invalidiert alle folgenden.

  ### 3. DATABASE_URL: "db" statt "localhost" (C4)

  **Problem:** `localhost:5432` funktioniert innerhalb des Docker-Netzwerks nicht –
  der richtige Hostname ist der Service-Name `db`.
  **Lösung:** Kommentar direkt über der Variable: "NICHT localhost!", plus
  Erfolgs-Check mit `grep DATABASE_URL .env` der den Hostname prüft.
  **Prinzip:** Kritische "Gotchas" müssen am Ort des Fehlers dokumentiert sein.

  ### 4. npm install entfernt, exec-Kontext erklärt (C2/C5)

  **Problem:** Lokales `npm install` ist im Docker-Kontext falsch und ist direkte
  Ursache für Binary-Namespace-Konflikte auf M1/M2.
  **Lösung:** Kein `npm install` in der Anleitung – Commands werden klar als
  "im Container auszuführen" markiert: `docker compose exec backend ...`
  **Prinzip:** Jeder Command braucht seinen Ausführungskontext (lokal vs. Container).

  ### 5. Troubleshooting-Section mit den 6 häufigsten Fehlern (H1/H3/M5)

  **Problem:** Alle 5 repeatedly genannten Support-Tickets waren undokumentiert.
  **Lösung:** Dedizierte Troubleshooting-Section mit Ursache + Lösung(en) für:
  Port-Konflikte, Vite Hot Reload, Migrations-Fehler, CORS, M1/M2 Binaries,
  `docker-compose` vs. `docker compose`.
  **Prinzip:** Häufige Fehler in der Doku → drastisch reduziertes Support-Volume.

  ### 6. Vollständige .env-Vorlage (H2)

  **Problem:** Nur `DATABASE_URL` erwähnt; `CORS_ORIGIN` fehlte → CORS-Fehler.
  **Lösung:** Vollständige .env-Vorlage mit allen 7 Variablen, kommentiert nach
  Kategorie (DATABASE, BACKEND, CORS, FRONTEND).
  **Prinzip:** Environments-Variablen unkommentiert im .env zu lassen ist ein
  Security- und Onboarding-Risiko gleichzeitig.

  ### 7. Erfolgs-Check nach jedem Schritt (H4)

  **Problem:** Kein einziger Step hatte einen Hinweis, ob er erfolgreich war.
  **Lösung:** Jeder Schritt endet mit einem "Erfolgs-Check"-Codeblock mit
  erwarteter Ausgabe. Abweichungen verweisen auf den Troubleshooting-Abschnitt.
  **Prinzip:** Fehler früh erkennen ist billiger als Debugging drei Schritte später.

  ### 8. Service-Übersicht mit Ports (M2)

  **Problem:** Kein Service-Überblick – Developer öffnen die falsche URL.
  **Lösung:** Tabelle: Frontend→5173, Backend→4000, DB→5432.
  **Prinzip:** Port-Mapping ist nach Prerequisites die wichtigste Info in einer
  Docker-based-Dev-Anleitung.
