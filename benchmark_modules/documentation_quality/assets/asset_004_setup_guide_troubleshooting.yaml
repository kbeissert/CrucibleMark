  \n## Schritt 2: Vollständige überarbeitete SETUP.md\n\n```markdown\n# E-Commerce\
  \ Platform – Developer Setup Guide\n\n> **Zielgruppe:** Junior bis Mid-Level Developers\n\
  > **Geschätzter Zeitaufwand:** 15-30 Minuten\n> **Letzte Aktualisierung:** 2024-01\
  \ | **Maintainer:** #team-platform (Slack)\n> **Probleme?** Slack: `#dev-setup`\
  \ oder [Issue erstellen](https://github.com/company/ecommerce-platform/issues)\n\
  \n---\n\n## Inhaltsverzeichnis\n\n1. [Quick Start](#1-quick-start)\n2. [Prerequisites](#2-prerequisites)\n\
  3. [Repository klonen](#3-repository-klonen)\n4. [Projektstruktur & Services](#4-projektstruktur--services)\n\
  5. [Umgebungsvariablen konfigurieren](#5-umgebungsvariablen-konfigurieren)\n6. [Services\
  \ starten](#6-services-starten)\n7. [Datenbank initialisieren](#7-datenbank-initialisieren)\n\
  8. [Setup validieren](#8-setup-validieren)\n9. [Services stoppen & zurücksetzen](#9-services-stoppen--zurücksetzen)\n\
  10. [Troubleshooting](#10-troubleshooting)\n11. [Nächste Schritte](#11-nächste-schritte)\n\
  \n---\n\n## 1. Quick Start\n\n> Nur für Developer, die Docker, Node.js 20+ und Git\
  \ bereits installiert haben.\n\n```bash\ngit clone https://github.com/company/ecommerce-platform.git\n\
  cd ecommerce-platform\ncp .env.example .env          # .env anpassen (siehe Schritt\
  \ 5)\ndocker compose up -d --build\ndocker compose exec backend npx prisma migrate\
  \ deploy\ndocker compose exec backend npx prisma db seed\n```\n\nFrontend:     http://localhost:5173\n\
  Backend API:  http://localhost:4000\nAPI Health:   http://localhost:4000/api/health\n\
  \n---\n\n## 2. Prerequisites\n\nStelle sicher, dass folgende Tools installiert und\
  \ in den angegebenen\nVersionen verfügbar sind, BEVOR du weitermachst.\n\n### Erforderliche\
  \ Tools\n\n| Tool             | Mindestversion | Empfohlen | Prüfen mit        \
  \            |\n|------------------|----------------|-----------|-------------------------------|\n\
  | Git              | 2.x            | aktuell   | `git --version`              \
  \ |\n| Docker Desktop   | 24.x           | aktuell   | `docker --version`      \
  \      |\n| Docker Compose   | 2.x (V2)       | 2.24+     | `docker compose version`\
  \      |\n| Node.js          | 20.x LTS       | 20.x LTS  | `node --version`   \
  \           |\n| npm              | 10.x           | 10.x      | `npm --version`\
  \               |\n\n> WICHTIG: Dieses Projekt verwendet `docker compose` (ohne\
  \ Bindestrich – V2).\n> Das ältere `docker-compose` (V1) wird nicht unterstützt.\n\
  \n### Prerequisites-Check (Copy & Paste)\n\n```bash\necho \"=== Prerequisites Check\
  \ ===\" && \\\ngit --version && \\\ndocker --version && \\\ndocker compose version\
  \ && \\\nnode --version && \\\nnpm --version && \\\necho \"=== Alle Prerequisites\
  \ erfüllt ===\"\n```\n\nErwartete Ausgabe:\n```\n=== Prerequisites Check ===\ngit\
  \ version 2.43.0\nDocker version 25.0.2\nDocker Compose version v2.24.3\nv20.11.0\n\
  10.4.0\n=== Alle Prerequisites erfüllt ===\n```\n\n### OS-spezifische Installation\n\
  \nmacOS (Homebrew):\n```bash\nbrew install --cask docker\nbrew install nvm\nnvm\
  \ install 20 && nvm use 20 && nvm alias default 20\n```\n\nLinux (Ubuntu/Debian):\n\
  ```bash\ncurl -fsSL https://get.docker.com | sh\nsudo usermod -aG docker $USER &&\
  \ newgrp docker\nsudo apt-get install docker-compose-plugin\ncurl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh\
  \ | bash\nsource ~/.bashrc && nvm install 20\n```\n\nWindows: Ausschliesslich unter\
  \ WSL2 unterstützt.\n  1. `wsl --install -d Ubuntu-22.04` (PowerShell als Admin)\n\
  \  2. Docker Desktop for Windows installieren, WSL2-Integration aktivieren\n  3.\
  \ Alle weiteren Befehle im WSL2-Terminal (Ubuntu-Schritte oben befolgen)\n  WICHTIG:\
  \ Repository innerhalb des WSL2-Dateisystems klonen (~/projects/),\n  NICHT auf\
  \ dem Windows-Laufwerk (/mnt/c/) – sonst kein Hot Reload!\n\nM1/M2/M3 Mac (Apple\
  \ Silicon):\n  Installation identisch zu macOS. Zusätzlich:\n  - Docker Desktop:\
  \ Settings > General > \"Use Rosetta for x86/amd64 emulation\" aktivieren\n  - Bei\
  \ npm-Binaries-Fehlern: Siehe Troubleshooting Abschnitt 10.5\n\n---\n\n## 3. Repository\
  \ klonen\n\n```bash\ngit clone https://github.com/company/ecommerce-platform.git\n\
  cd ecommerce-platform\n```\n\nErfolgs-Check:\n```bash\nls -la\n```\nErwartete Ausgabe\
  \ (Auszug):\n```\ndrwxr-xr-x  frontend/\ndrwxr-xr-x  backend/\n-rw-r--r--  docker-compose.yml\n\
  -rw-r--r--  .env.example\n```\n\nFalls `docker-compose.yml` fehlt: Stelle sicher,\
  \ dass du im richtigen\nVerzeichnis bist (`pwd` sollte `.../ecommerce-platform`\
  \ zeigen).\n\n---\n\n## 4. Projektstruktur & Services\n\n```\necommerce-platform/\n\
  ├── frontend/           # Vite 5 + React 18 + TypeScript\n├── backend/         \
  \   # Node.js 20 + Express + Prisma ORM\n│   └── prisma/         # Schema & Migrations\n\
  ├── docker-compose.yml  # Alle Services\n└── .env.example        # Vorlage für .env\n\
  ```\n\n### Service-Übersicht\n\n| Service    | Technologie                 | Lokaler\
  \ Port |\n|------------|-----------------------------|--------------|\n| `frontend`\
  \ | Vite Dev Server (React)     | **5173**     |\n| `backend`  | Express API + Prisma\
  \        | **4000**     |\n| `db`       | PostgreSQL 16               | **5432**\
  \     |\n\n---\n\n## 5. Umgebungsvariablen konfigurieren\n\n> DIESER SCHRITT MUSS\
  \ VOR `docker compose up` ERFOLGEN.\n> Docker Compose liest die .env-Datei beim\
  \ Start.\n\n### 5.1 .env-Datei erstellen\n\n```bash\ncp .env.example .env\n```\n\
  \n### 5.2 .env-Datei befüllen\n\nÖffne `.env` in deinem Editor:\n\n```dotenv\n#\
  \ ============================================================\n# DATENBANK\n# ============================================================\n\
  # WICHTIG: Hostname ist \"db\" (Docker-Compose-Service-Name),\n# NICHT \"localhost\"\
  ! localhost funktioniert nur ausserhalb von Docker.\nDATABASE_URL=\"postgresql://ecommerce_user:ecommerce_pass@db:5432/ecommerce_db\"\
  \nPOSTGRES_USER=ecommerce_user\nPOSTGRES_PASSWORD=ecommerce_pass\nPOSTGRES_DB=ecommerce_db\n\
  \n# ============================================================\n# BACKEND\n# ============================================================\n\
  NODE_ENV=development\nPORT=4000\n# JWT Secret – für lokale Entwicklung kann dieser\
  \ Wert bleiben\nJWT_SECRET=local-dev-secret-change-in-production-min-32-chars\n\n\
  # ============================================================\n# CORS – Frontend-URL,\
  \ die API-Requests senden darf\n# ============================================================\n\
  CORS_ORIGIN=http://localhost:5173\n\n# ============================================================\n\
  # FRONTEND (Vite – Prefix VITE_ ist Pflicht für Client-Zugriff)\n# ============================================================\n\
  VITE_API_URL=http://localhost:4000/api\n```\n\nErfolgs-Check:\n```bash\ngrep DATABASE_URL\
  \ .env\n# Erwartet: DATABASE_URL=\"postgresql://...@db:5432/...\"\n#           \
  \                                 ^^\n#                              Muss \"db\"\
  \ sein, NICHT \"localhost\"\n```\n\n---\n\n## 6. Services starten\n\n```bash\ndocker\
  \ compose up -d --build\n```\n\nDas `--build` Flag ist beim ersten Start und nach\
  \ Dependency-Änderungen nötig.\n\nWarte ca. 30-60 Sekunden. Danach Status prüfen:\n\
  \n```bash\ndocker compose ps\n```\n\nErwartete Ausgabe:\n```\nNAME             \
  \        STATUS\necommerce-frontend       Up (healthy)\necommerce-backend      \
  \  Up (healthy)\necommerce-db             Up (healthy)\n```\n\nALLE drei Services\
  \ müssen \"(healthy)\" anzeigen, bevor du weitermachst.\n\nLogs anschauen (optional,\
  \ aber empfohlen):\n```bash\ndocker compose logs -f              # Alle Services\n\
  docker compose logs -f backend      # Nur Backend\ndocker compose logs -f frontend\
  \     # Nur Frontend\n```\n\n---\n\n## 7. Datenbank initialisieren\n\n> Die folgenden\
  \ Befehle werden IM Backend-Container ausgeführt, nicht lokal.\n> Die Datenbank\
  \ muss \"healthy\" sein (Schritt 6).\n\n```bash\n# Migrationen ausführen\ndocker\
  \ compose exec backend npx prisma migrate deploy\n\n# Seed-Daten laden (empfohlen\
  \ für lokale Entwicklung)\ndocker compose exec backend npx prisma db seed\n```\n\
  \nErwarteter Output (migrate deploy):\n```\nPrisma schema loaded from prisma/schema.prisma\n\
  Datasource \"db\": PostgreSQL at postgresql://...@db:5432/ecommerce_db\n\n3 migrations\
  \ found in prisma/migrations\n\nApplying migration `20240101_init`...\nApplying\
  \ migration `20240115_add_orders`...\nApplying migration `20240120_add_reviews`...\n\
  \nAll migrations have been successfully applied.\n```\n\n> FEHLER \"Can't reach\
  \ database server at localhost:5432\"?\n> Deine DATABASE_URL zeigt auf \"localhost\"\
  \ statt \"db\".\n> Lösung: Schritt 5.2 wiederholen.\n\n---\n\n## 8. Setup validieren\n\
  \nFühre alle Checks durch – alle müssen grün sein:\n\n```bash\n# 1. Services laufen?\n\
  docker compose ps\n\n# 2. Backend erreichbar?\ncurl http://localhost:4000/api/health\n\
  # Erwartet: {\"status\":\"ok\",\"database\":\"connected\"}\n\n# 3. Frontend erreichbar?\n\
  curl -I http://localhost:5173\n# Erwartet: HTTP/1.1 200 OK\n\n# 4. Frontend kann\
  \ Backend erreichen?\n# Browser öffnen: http://localhost:5173\n# Browser-Konsole\
  \ (F12): Keine CORS-Fehler\n```\n\nAlle Checks grün? Glückwunsch – dein Setup ist\
  \ vollständig!\n\n---\n\n## 9. Services stoppen & zurücksetzen\n\n```bash\n# Services\
  \ stoppen (Daten bleiben erhalten)\ndocker compose down\n\n# Services stoppen +\
  \ alle Volumes löschen (kompletter Reset)\ndocker compose down -v\n\n# Einzelnen\
  \ Service neustarten\ndocker compose restart backend\n\n# Alle Images neu bauen\
  \ (nach Dependency-Änderungen)\ndocker compose up -d --build\n```\n\n---\n\n## 10.\
  \ Troubleshooting\n\n### Problem 1: \"Port 5432 already in use\"\n\nUrsache: Lokale\
  \ PostgreSQL-Installation läuft parallel.\n\nLösung A – Lokales PostgreSQL stoppen:\n\
  ```bash\n# macOS\nbrew services stop postgresql@16\n\n# Linux\nsudo systemctl stop\
  \ postgresql\n\n# Check ob Port frei ist\nlsof -i :5432    # Keine Ausgabe = Port\
  \ frei\n```\n\nLösung B – Anderen Port in docker-compose.override.yml verwenden:\n\
  ```yaml\n# docker-compose.override.yml (nicht committen!)\nservices:\n  db:\n  \
  \  ports:\n      - \"5433:5432\"\n```\nDann DATABASE_URL in .env auf Port 5433 anpassen.\n\
  \n---\n\n### Problem 2: \"Vite Hot Reload funktioniert nicht\"\n\nUrsache: Docker\
  \ kann Dateiänderungen im gemounteten Volume nicht erkennen.\n\nLösung: In `vite.config.ts`\
  \ polling aktivieren:\n```typescript\nexport default defineConfig({\n  server: {\n\
  \    watch: {\n      usePolling: true,\n      interval: 100,\n    },\n    host:\
  \ true,       // Pflicht in Docker\n    port: 5173,\n  },\n});\n```\n\n---\n\n###\
  \ Problem 3: \"Database migrations failed\" / \"Connection refused\"\n\nUrsachen\
  \ und Lösungen:\n\nA) DATABASE_URL zeigt auf \"localhost\":\n   Prüfen: `grep DATABASE_URL\
  \ .env`\n   Fix: Hostname auf \"db\" korrigieren (Service-Name in docker-compose.yml)\n\
  \nB) Datenbank noch nicht ready:\n   Fix: `docker compose ps | grep db` – muss \"\
  (healthy)\" zeigen\n   Warten und dann erneut versuchen: `docker compose exec backend\
  \ npx prisma migrate deploy`\n\nC) Migration im falschen Kontext ausgeführt (lokal\
  \ statt im Container):\n   FALSCH: `npm run migrate`\n   RICHTIG: `docker compose\
  \ exec backend npx prisma migrate deploy`\n\n---\n\n### Problem 4: CORS-Fehler im\
  \ Browser\n\nSymptom: \"Access to XMLHttpRequest... blocked by CORS policy\" in\
  \ der Konsole.\n\nUrsache: `CORS_ORIGIN` in .env stimmt nicht mit der Frontend-URL\
  \ überein.\n\nFix:\n```dotenv\n# .env – Exakt die URL, auf der das Frontend läuft\n\
  CORS_ORIGIN=http://localhost:5173\n```\n\nDanach Backend neustarten: `docker compose\
  \ restart backend`\n\n---\n\n### Problem 5: npm install schlägt fehl (Apple Silicon\
  \ M1/M2/M3)\n\nSymptom: Fehler mit \"Unsupported platform\" oder \"invalid ELF header\"\
  .\n\nUrsache: Native Binaries werden für die falsche Architektur gebaut.\n\nFix\
  \ in docker-compose.yml für den betroffenen Service:\n```yaml\nservices:\n  backend:\n\
  \    platform: linux/amd64    # Rosetta-Emulation aktivieren\n```\n\nDanach:\n```bash\n\
  docker compose down -v\ndocker compose up -d --build\n```\n\n---\n\n### Problem\
  \ 6: `docker-compose` command not found\n\nUrsache: Docker Compose V1 ist nicht\
  \ installiert – V2 ist als Plugin in Docker integriert.\n\nFix: `docker compose`\
  \ (ohne Bindestrich) verwenden.\n\n```bash\n# V1 (veraltet, nicht installiert)\n\
  docker-compose up\n\n# V2 (korrekt)\ndocker compose up\n```\n\n---\n\n## 11. Nächste\
  \ Schritte\n\n### Frontend-Development\n```bash\n# Frontend-Logs in Echtzeit\ndocker\
  \ compose logs -f frontend\n\n# Hot Reload testen: Datei in frontend/src/ ändern\n\
  # Browser aktualisiert sich automatisch\n```\n\n### Backend-Development\n```bash\n\
  # Backend-Logs\ndocker compose logs -f backend\n\n# API testen\ncurl http://localhost:4000/api/products\
  \ | jq\n\n# Prisma Studio (Datenbank-GUI)\ndocker compose exec backend npx prisma\
  \ studio\n# Öffnet: http://localhost:5555\n```\n\n### Weiterführende Dokumentation\n\
  - [API-Dokumentation](./docs/API.md)\n- [Architektur-Übersicht](./docs/ARCHITECTURE.md)\n\
  - [Contributing Guide](./CONTRIBUTING.md)\n- [Swagger UI](http://localhost:4000/api/docs)\n\
  ```\n\n---\n\n## Schritt 3: Begründung der Änderungen\n\n### 1. Prerequisites-Section\
  \ mit Version-Matrix (C1/H5)\n\n**Problem:** Häufigstes Onboarding-Blocker: fehlende\
  \ Voraussetzungen.\n**Lösung:** Vollständige Tabelle mit Mindestversionen, Prüfbefehlen\
  \ und\neinem Copy-&-Paste-Prerequisites-Check-Block.\n**Prinzip:** Setup-Anleitungen\
  \ müssen \"zero-assumption\" sein – kein implizites\nVorwissen über benötigte Tools.\n\
  \n### 2. Reihenfolge korrigiert: .env VOR docker compose up (C3/M1)\n\n**Problem:**\
  \ Die .env-Datei wurde NACH dem Start der Services erwähnt –\nDocker Compose liest\
  \ sie beim Start.\n**Lösung:** .env-Konfiguration (Schritt 5) kommt explizit vor\
  \ \"Services starten\"\n(Schritt 6), mit einem abgesetzten WARNUNG-Hinweis.\n**Prinzip:**\
  \ Reihenfolge in Setup-Guides ist nicht optional – ein falscher\nSchritt invalidiert\
  \ alle folgenden.\n\n### 3. DATABASE_URL: \"db\" statt \"localhost\" (C4)\n\n**Problem:**\
  \ `localhost:5432` funktioniert innerhalb des Docker-Netzwerks nicht –\nder richtige\
  \ Hostname ist der Service-Name `db`.\n**Lösung:** Kommentar direkt über der Variable:\
  \ \"NICHT localhost!\", plus\nErfolgs-Check mit `grep DATABASE_URL .env` der den\
  \ Hostname prüft.\n**Prinzip:** Kritische \"Gotchas\" müssen am Ort des Fehlers\
  \ dokumentiert sein.\n\n### 4. npm install entfernt, exec-Kontext erklärt (C2/C5)\n\
  \n**Problem:** Lokales `npm install` ist im Docker-Kontext falsch und ist direkte\n\
  Ursache für Binary-Namespace-Konflikte auf M1/M2.\n**Lösung:** Kein `npm install`\
  \ in der Anleitung – Commands werden klar als\n\"im Container auszuführen\" markiert:\
  \ `docker compose exec backend ...`\n**Prinzip:** Jeder Command braucht seinen Ausführungskontext\
  \ (lokal vs. Container).\n\n### 5. Troubleshooting-Section mit den 6 häufigsten\
  \ Fehlern (H1/H3/M5)\n\n**Problem:** Alle 5 repeatedly genannten Support-Tickets\
  \ waren undokumentiert.\n**Lösung:** Dedizierte Troubleshooting-Section mit Ursache\
  \ + Lösung(en) für:\nPort-Konflikte, Vite Hot Reload, Migrations-Fehler, CORS, M1/M2\
  \ Binaries,\n`docker-compose` vs. `docker compose`.\n**Prinzip:** Häufige Fehler\
  \ in der Doku → drastisch reduziertes Support-Volume.\n\n### 6. Vollständige .env-Vorlage\
  \ (H2)\n\n**Problem:** Nur `DATABASE_URL` erwähnt; `CORS_ORIGIN` fehlte → CORS-Fehler.\n\
  **Lösung:** Vollständige .env-Vorlage mit allen 7 Variablen, kommentiert nach\n\
  Kategorie (DATABASE, BACKEND, CORS, FRONTEND).\n**Prinzip:** Environments-Variablen\
  \ unkommentiert im .env zu lassen ist ein\nSecurity- und Onboarding-Risiko gleichzeitig.\n\
  \n### 7. Erfolgs-Check nach jedem Schritt (H4)\n\n**Problem:** Kein einziger Step\
  \ hatte einen Hinweis, ob er erfolgreich war.\n**Lösung:** Jeder Schritt endet mit\
  \ einem \"Erfolgs-Check\"-Codeblock mit\nerwarteter Ausgabe. Abweichungen verweisen\
  \ auf den Troubleshooting-Abschnitt.\n**Prinzip:** Fehler früh erkennen ist billiger\
  \ als Debugging drei Schritte später.\n\n### 8. Service-Übersicht mit Ports (M2)\n\
  \n**Problem:** Kein Service-Überblick – Developer öffnen die falsche URL.\n**Lösung:**\
  \ Tabelle: Frontend→5173, Backend→4000, DB→5432.\n**Prinzip:** Port-Mapping ist\
  \ nach Prerequisites die wichtigste Info in einer\nDocker-based-Dev-Anleitung.\n"
