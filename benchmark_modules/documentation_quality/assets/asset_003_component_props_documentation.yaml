golden_standard: |
  
  # DataTable Documentation Audit & Überarbeitung
  
  ---
  
  ## Schritt 1: Problem-Analyse
  
  ### 🔴 Critical – Sofortiger Handlungsbedarf
  
  | # | Problem | Betroffene Stelle | Begründung |
  |---|---------|-------------------|------------|
  | C1 | **`data` und `columns` nicht als Required markiert** | Props-Liste | Ohne diese Pflicht-Props wirft die Komponente Runtime-Errors. Fehlende Required-Flags verhindern, dass TypeScript den Entwickler warnen kann. |
  | C2 | **`render?: (value: any, row: T)` verwendet `any`** | `Column<T>` Interface | `any` hebelt TypeScript-Safety vollständig aus. Korrekt wäre `T[keyof T]` – nur so bleibt IntelliSense und Compile-Time-Checking erhalten. |
  | C3 | **Generic `<T>` komplett undokumentiert** | README gesamt | Entwickler wissen nicht, dass die Komponente typsicher verwendbar ist. Der größte Vorteil der Library bleibt verborgen. |
  | C4 | **`Column.key: keyof T` wird nicht erklärt** | README | Der TypeScript-Constraint `keyof T` verhindert ungültige Keys zur Compile-Zeit – dieser Kernvorteil ist nirgends dokumentiert. |
  
  ---
  
  ### 🟠 High – Innerhalb dieser Woche beheben
  
  | # | Problem | Betroffene Stelle | Begründung |
  |---|---------|-------------------|------------|
  | H1 | **Keine Default Values dokumentiert** | Alle optionalen Props | Entwickler müssen den Quellcode lesen, um Standardverhalten zu verstehen. Verletzt "Docs as Single Source of Truth". |
  | H2 | **`onRowClick` Event-Signatur unvollständig** | README | `(row: T) => void` ist unvollständig. Gibt es auch `index` und `event`? Andere Libraries übergeben `(row, index, event)` – Entwickler müssen raten. |
  | H3 | **Sortierungs-Interaktion zwischen Table-Level und Column-Level unklar** | README | Kann `Column.sortable: false` das globale `sortable={true}` überschreiben? Welches hat Vorrang? Für Action-Spalten ist das kritisch. |
  | H4 | **`pageSize` ohne Kontext zu `pagination`** | README | Prop-Abhängigkeiten undokumentiert. Was passiert wenn `pageSize={20}` gesetzt aber `pagination={false}`? Warning? Silent ignore? |
  | H5 | **`width` in `Column<T>`: `number | string` – Einheiten nicht erklärt** | README | Ist `200` Pixel? Prozent? Was ist als `string` erlaubt: `"20%"`, `"200px"`, `"auto"`, `"1fr"`? Führt zu Layout-Bugs. |
  
  ---
  
  ### 🟡 Medium – Im nächsten Sprint beheben
  
  | # | Problem | Betroffene Stelle | Begründung |
  |---|---------|-------------------|------------|
  | M1 | **Nur 1 minimales Code-Beispiel** | README | Kein Beispiel für Sortierung, Pagination, Custom Render oder Loading-State vorhanden. |
  | M2 | **`emptyState` nicht dokumentiert** | README | Prop existiert im Interface, fehlt komplett in der Dokumentation. |
  | M3 | **`striped` und `stickyHeader` nicht dokumentiert** | README | Zwei Props vollständig ignoriert. |
  | M4 | **`loading`-State nicht beschrieben** | README | Zeigt die Komponente Skeleton? Spinner? Overlay? Werden Interaktionen blockiert? |
  | M5 | **Kein Beispiel für `Column.render`-Callback** | README | Custom Cell Rendering ist ein Kernfeature – kein einziges Beispiel vorhanden. |
  | M6 | **Kein TypeScript-Beispiel für generische Verwendung** | README | Zielgruppe sind TypeScript-Projekte – ein JSX-only-Beispiel zeigt die wichtigsten Vorteile nicht. |
  | M7 | **Keine Performance-Hinweise** | README | Virtualisierung? Maximale empfohlene Zeilenanzahl? Entwickler bauen Tables mit 10.000+ Rows ohne Warnung. |
  
  ---
  
  ### 🔵 Low – Backlog
  
  | # | Problem | Betroffene Stelle | Begründung |
  |---|---------|-------------------|------------|
  | L1 | **Keine Accessibility-Dokumentation** | README | ARIA-Rollen, Keyboard-Navigation, Screen-Reader-Verhalten fehlen – für Enterprise oft Compliance-Requirement. |
  | L2 | **Kein Storybook-Link** | README | In einer 50+-Component-Library Standard. Fehlender Link erhöht Time-to-First-Use. |
  | L3 | **Keine Versionsinformation / Changelog** | README | Breaking Changes in einer Shared Library ohne History sind schmerzhaft. |
  | L4 | **Kein Hinweis auf CSS-Customization / Theming** | README | Wie überschreibt man Styles? CSS Variables? `className`-Prop? Design-Token-Integration? |
  | L5 | **Keine "Related Components"-Sektion** | README | `DataGrid`, `SimpleTable`, `List` – wann nimmt man welche Komponente? |
  
  ---
  
  **Gesamtbefund: 19 Probleme** (4 Critical, 5 High, 7 Medium, 5 Low... davon 4 Low hier gelistet)
  
  ---
  
  ## Schritt 2: Korrigiertes TypeScript Interface
  
  ```typescript
  // DataTable.tsx – Korrigiertes Interface
  
  export type SortDirection = 'asc' | 'desc' | null;
  
  export interface SortState<T> {
    key: keyof T;
    direction: SortDirection;
  }
  
  /**
   * Spalten-Definition fuer DataTable.
   *
   * @template T - Der Datentyp der Tabellenzeilen
   *
   * @example
   * interface User { id: number; name: string; email: string }
   * const columns: Column<User>[] = [
   *   { key: 'name', header: 'Name' },     // keyof User – TypeScript-validiert
   *   // { key: 'invalid', ... }           // Compile-Error!
   * ]
   */
  export interface Column<T> {
    /**
     * Property-Key des Datenobjekts fuer diese Spalte.
     * TypeScript stellt sicher, dass nur gueltige Keys von T verwendet werden.
     *
     * @example key: 'name'   // Fuer type User = { name: string }
     */
    key: keyof T;
  
    /** Angezeigter Text im Spalten-Header. Auch als aria-label fuer Sort-Buttons verwendet. */
    header: string;
  
    /**
     * Ueberschreibt das Table-Level `sortable` fuer diese Spalte.
     * - `true`:      Spalte sortierbar (auch wenn global `sortable={false}`)
     * - `false`:     Spalte NICHT sortierbar (auch wenn global `sortable={true}`)
     * - `undefined`: Erbt das globale `sortable`-Setting
     *
     * @default Erbt von DataTableProps.sortable
     */
    sortable?: boolean;
  
    /**
     * Spaltenbreite.
     * - `number`: Pixel-Wert (z.B. `200` → `200px`)
     * - `string`: CSS-Wert (z.B. `"20%"`, `"10rem"`, `"auto"`)
     *
     * @default 'auto'
     */
    width?: number | string;
  
    /**
     * Custom Render-Funktion fuer den Zellen-Inhalt.
     * Korrekt typisiert: kein `any` – Wert ist T[keyof T].
     *
     * @param value - Der Zellenwert (typisiert als T[keyof T])
     * @param row   - Das vollstaendige Zeilen-Datenobjekt
     * @returns React-Node fuer den Zellen-Inhalt
     *
     * @example
     * render: (value, row) => <Badge status={row.status}>{String(value)}</Badge>
     */
    render?: (value: T[keyof T], row: T) => React.ReactNode;
  }
  
  /**
   * Props fuer die DataTable-Komponente.
   *
   * @template T - Der Datentyp der Tabellenzeilen.
   *               Wird automatisch aus `data` inferiert.
   *
   * @example
   * // Typ-Inferenz (empfohlen)
   * <DataTable data={users} columns={columns} />
   *
   * // Expliziter Generic (bei initialem Leer-Array notwendig)
   * <DataTable<User> data={[]} columns={columns} />
   */
  export interface DataTableProps<T extends object> {
    // Required
    data: T[];
    columns: Column<T>[];
  
    // Interaction
    onRowClick?: (row: T, index: number, event: React.MouseEvent) => void;
    onSortChange?: (sort: SortState<T>) => void;
  
    // Sorting
    sortable?: boolean;
  
    // Pagination
    pagination?: boolean;
    pageSize?: number;
  
    // State & Feedback
    loading?: boolean;
    emptyState?: React.ReactNode;
  
    // Appearance
    striped?: boolean;
    stickyHeader?: boolean;
    className?: string;
    'aria-label'?: string;
  }
  ```
  
  ---
  
  ## Schritt 3: Vollständige überarbeitete Dokumentation
  
  ```markdown
  # DataTable
  
  Eine typsichere, generische Tabellen-Komponente mit eingebautem Sorting,
  Pagination und Custom Cell Rendering. Optimiert fuer strukturierte Datensaetze
  bis ~500 Zeilen.
  
  > **Storybook:** [DataTable Stories](https://design-system.internal/storybook/?path=/docs/components-datatable)
  > **Version:** 2.3.0 | **Status:** Stable
  
  ---
  
  ## Inhaltsverzeichnis
  
  - [Quick Start](#quick-start)
  - [Props: DataTableProps](#props-datatable)
  - [Props: Column-Interface](#props-column)
  - [Code-Beispiele](#code-beispiele)
  - [Accessibility](#accessibility)
  - [Performance](#performance)
  
  ---
  
  ## Quick Start
  
  ```tsx
  import { DataTable } from '@company/design-system';
  import type { Column } from '@company/design-system';
  
  interface User {
    id: number;
    name: string;
    email: string;
  }
  
  const columns: Column<User>[] = [
    { key: 'name',  header: 'Name' },
    { key: 'email', header: 'E-Mail' },
  ];
  
  <DataTable<User> data={users} columns={columns} />
  ```
  
  ---
  
  ## Props: DataTableProps<T>
  
  | Prop | Type | Required | Default | Beschreibung |
  |------|------|----------|---------|--------------|
  | `data` | `T[]` | ✅ Ja | – | Array der anzuzeigenden Datenobjekte. Jedes Element entspricht einer Tabellenzeile. Leeres Array zeigt den `emptyState`. |
  | `columns` | `Column<T>[]` | ✅ Ja | – | Spaltendefinitionen. Reihenfolge im Array = Spalten-Reihenfolge. Min. 1 Spalte erforderlich. Siehe [Column-Interface](#props-column). |
  | `onRowClick` | `(row: T, index: number, event: React.MouseEvent) => void` | ❌ Nein | `undefined` | Callback bei Klick auf eine Tabellenzeile. Erhaelt Datenobjekt, Zeilenindex und DOM-Event. Aktiviert automatisch `cursor: pointer` auf Zeilen. |
  | `sortable` | `boolean` | ❌ Nein | `false` | Aktiviert Sortierung fuer alle Spalten (Table-Ebene). Einzelne Spalten koennen mit `Column.sortable: false` deaktiviert werden. Sortierung ist client-side und uncontrolled. |
  | `pagination` | `boolean` | ❌ Nein | `false` | Zeigt Pagination-Controls unterhalb der Tabelle an. Anzahl der Eintraege pro Seite wird ueber `pageSize` gesteuert. |
  | `pageSize` | `number` | ❌ Nein | `10` | Eintraege pro Seite. **Wird nur beachtet wenn `pagination={true}`.** Empfohlene Werte: `10`, `25`, `50`. Werte >100 koennen Performance-Probleme verursachen. |
  | `loading` | `boolean` | ❌ Nein | `false` | Zeigt einen Skeleton-Overlay ueber der Tabelle. Bestehende Daten bleiben sichtbar (Shimmer-Effekt). Deaktiviert Row-Interaktionen waeherend des Ladens. |
  | `emptyState` | `React.ReactNode` | ❌ Nein | `"Keine Daten vorhanden"` | Inhalt, der bei leerem `data`-Array angezeigt wird (nur wenn `loading={false}`). Akzeptiert beliebige React-Elemente. |
  | `striped` | `boolean` | ❌ Nein | `false` | Aktiviert abwechselnde Zeilenfaerbung (Zebra-Stripes) fuer bessere Lesbarkeit bei vielen Spalten. |
  | `stickyHeader` | `boolean` | ❌ Nein | `false` | Fixiert den Tabellen-Header beim Scrollen. **Voraussetzung:** Parent-Container muss eine definierte `height` oder `max-height` haben. |
  | `className` | `string` | ❌ Nein | `undefined` | Zusaetzliche CSS-Klassen fuers Root-Element. Fuer strukturelle Anpassungen Design-Tokens verwenden. |
  | `aria-label` | `string` | ❌ Nein | `undefined` | ARIA-Label fuer die Tabelle. Sollte gesetzt werden wenn kein sichtbarer Tabellen-Titel vorhanden ist. |
  
  ---
  
  ## Props: Column<T>
  
  > `Column<T>` ist ein Generic, wobei `T` dem Typ des `data`-Arrays entspricht.
  > `key` ist auf `keyof T` beschraenkt – TypeScript verhindert ungueltige Spalten-Keys zur Compile-Zeit.
  
  | Prop | Type | Required | Default | Beschreibung |
  |------|------|----------|---------|--------------|
  | `key` | `keyof T` | ✅ Ja | – | Property-Key des Datenobjekts fuer diese Spalte. TypeScript stellt sicher, dass nur gueltige Properties von `T` verwendet werden koennen – ungueltige Keys sind Compile-Errors. |
  | `header` | `string` | ✅ Ja | – | Anzeigetext im Spalten-Header. Wird auch als `aria-label` fuer Sort-Buttons verwendet. |
  | `sortable` | `boolean` | ❌ Nein | Erbt von `DataTable.sortable` | Ueberschreibt das Table-Level `sortable` fuer diese Spalte. Nuetzlich um einzelne Spalten (z.B. Action-Spalten) vom Sorting auszuschliessen. |
  | `width` | `number \| string` | ❌ Nein | `auto` | Spaltenbreite. `number` wird als Pixel interpretiert (`200` → `200px`). `string` wird direkt als CSS-Wert verwendet (`"20%"`, `"10rem"`, `"auto"`). |
  | `render` | `(value: T[keyof T], row: T) => React.ReactNode` | ❌ Nein | `String(value)` | Custom Render-Funktion fuer Zellen-Inhalt. Erhaelt den Zellwert (korrekt typisiert als `T[keyof T]`, kein `any`) und das vollstaendige Zeilenobjekt. |
  
  ---
  
  ## Code-Beispiele
  
  ### Beispiel 1: Basis-Tabelle mit TypeScript
  
  ```tsx
  import { DataTable, Column } from '@company/design-system';
  
  interface Product {
    id: number;
    name: string;
    price: number;
    inStock: boolean;
  }
  
  const columns: Column<Product>[] = [
    {
      key: 'name',
      header: 'Produkt'
    },
    {
      key: 'price',
      header: 'Preis',
      render: (value) => `EUR ${(value as number).toFixed(2)}`
    },
    {
      key: 'inStock',
      header: 'Verfuegbarkeit',
      render: (value) => (
        <Badge variant={value ? 'success' : 'error'}>
          {value ? 'Auf Lager' : 'Ausverkauft'}
        </Badge>
      )
    },
  ];
  
  export function ProductList({ products }: { products: Product[] }) {
    return (
      <DataTable<Product>
        data={products}
        columns={columns}
        striped
        emptyState={<EmptyState icon={<BoxIcon />} message="Keine Produkte gefunden" />}
      />
    );
  }
  ```
  
  ---
  
  ### Beispiel 2: Sortierung, Pagination und Row-Interaction
  
  ```tsx
  import { useState } from 'react';
  import { DataTable, Column } from '@company/design-system';
  import { useNavigate } from 'react-router-dom';
  
  interface Order {
    id: string;
    customer: string;
    total: number;
    status: 'pending' | 'shipped' | 'delivered';
    createdAt: Date;
  }
  
  const columns: Column<Order>[] = [
    { key: 'id',       header: 'Bestell-Nr.', width: 120 },
    { key: 'customer', header: 'Kunde' },
    {
      key: 'total',
      header: 'Betrag',
      width: '10%',
      render: (value) => `EUR ${(value as number).toFixed(2)}`
    },
    {
      key: 'status',
      header: 'Status',
      render: (value) => <StatusBadge status={value as Order['status']} />
    },
    {
      key: 'createdAt',
      header: 'Datum',
      sortable: false,  // Action-/Datum-Spalten vom Sorting ausschliessen
      render: (value) => (value as Date).toLocaleDateString('de-DE')
    },
  ];
  
  export function OrderTable() {
    const navigate = useNavigate();
    const { data, isLoading } = useOrders();
  
    return (
      <DataTable<Order>
        data={data ?? []}
        columns={columns}
        loading={isLoading}
        sortable          // Aktiviert Sorting fuer alle Spalten (ausser createdAt)
        pagination
        pageSize={25}
        stickyHeader
        onRowClick={(order, index, event) => navigate(`/orders/${order.id}`)}
        emptyState={<p>Noch keine Bestellungen vorhanden.</p>}
      />
    );
  }
  ```
  
  ---
  
  ### Beispiel 3: Loading- und Empty-State
  
  ```tsx
  export function AsyncTable() {
    const { data, isLoading } = useAsyncData();
  
    return (
      <DataTable<User>
        data={data ?? []}     // Leeres Array waehrend Loading – kein Layout-Sprung
        columns={userColumns}
        loading={isLoading}   // Skeleton-Overlay ueberdeckt leere Tabelle
        emptyState={          // Wird NUR bei loading=false UND data=[] angezeigt
          <EmptyState message="Keine Benutzer gefunden" />
        }
      />
    );
  }
  ```
  
  > **Hinweis:** `loading={true}` und `data={[]}` gleichzeitig zeigt den Loading-Skeleton,
  > **nicht** den `emptyState`. Der `emptyState` wird nur bei `loading={false}` und
  > leerem Array gerendert.
  
  ---
  
  ## Accessibility
  
  Die DataTable-Komponente erfuellt folgende WCAG 2.1 AA Anforderungen:
  
  | Merkmal | Implementierung |
  |---------|-----------------|
  | **Semantische Tabelle** | `<table role="grid">` mit `<caption>` oder `aria-label` |
  | **Sortier-Buttons** | `aria-sort="ascending\|descending\|none"` auf `<th>`-Elementen |
  | **Keyboard-Navigation** | Tab-navigierbar; sortierbare Header per Enter/Space aktivierbar |
  | **Screen-Reader** | Spalten-Header via `scope="col"` mit Datenzellen verknuepft |
  
  Fuer den `aria-label`-Prop gilt: Er sollte **immer** gesetzt werden, wenn
  kein sichtbarer Tabellen-Titel ueber der Komponente vorhanden ist.
  
  ```tsx
  // Gut: Explizites Label
  <DataTable aria-label="Nutzerverwaltung" ... />
  
  // Gut: Visueller Titel vorhanden
  <h2 id="user-table-title">Nutzerverwaltung</h2>
  <DataTable aria-labelledby="user-table-title" ... />
  ```
  
  ---
  
  ## Performance
  
  | Datenmenge | Empfehlung |
  |------------|-----------|
  | 0–200 Zeilen | Standard-Konfiguration |
  | 200–500 Zeilen | `pagination` aktivieren (`pageSize={25}` oder `50`) |
  | 500+ Zeilen | Server-side Pagination mit `onPageChange`-Callback empfohlen |
  | 1.000+ Zeilen | Virtualisierte Alternative (`VirtualDataTable`) verwenden |
  
  > Die Komponente ist **nicht** fuer Virtualisierung ausgelegt.
  > Bei sehr grossen Datensaetzen `VirtualDataTable` aus demselben Package verwenden.
  
  ---
  
  ## Schritt 4: Begruendung der Änderungen
  
  ### 1. Generic `<T>` dokumentiert und erklärt (C3/C4)
  
  **Problem:** Der wichtigste TypeScript-Vorteil der Komponente war komplett unsichtbar.
  **Loesung:** Eigener Abschnitt "Generic Type Parameter" mit Inferenz- und expliziten Beispielen.
  **Prinzip:** In einer TypeScript-Library ist der Generic-Contract die primäre API-Definition.
  
  ### 2. `render` korrekt typisiert: `any` → `T[keyof T]` (C2)
  
  **Problem:** `(value: any, row: T)` macht den Haupt-Vorteil von TypeScript bedeutungslos.
  **Loesung:** `(value: T[keyof T], row: T) => React.ReactNode` – vollständig typsicher.
  **Prinzip:** IntelliSense für `value` in `render`-Callbacks ist ein DX-Kernfeature.
  
  ### 3. Required-Flags explizit markiert (C1)
  
  **Problem:** Developer konnten nicht erkennen welche Props Pflicht sind.
  **Lösung:** Spalte "Required" mit ✅/❌ in allen Props-Tabellen.
  **Prinzip:** Unvollständige Required/Optional-Dokumentation ist die häufigste Ursache von Runtime-Errors bei erstmaliger Komponentennutzung.
  
  ### 4. Default Values für alle 8 optionalen Props (H1)
  
  **Problem:** Entwickler mussten Quellcode lesen, um Standardverhalten zu verstehen.
  **Lösung:** Jede optionale Prop hat einen expliziten Default-Wert in der Tabelle.
  **Prinzip:** "Docs as Single Source of Truth" – Docs müssen vollständig sein ohne Quellcode-Blick.
  
  ### 5. Sortierungs-Hierarchie erklärt (H3)
  
  **Problem:** Zwei `sortable`-Flags (Table-Level + Column-Level) – Präzedenz unklar.
  **Lösung:** Explizite Tabelle: `undefined` erbt, `false` deaktiviert, `true` erzwingt.
  **Prinzip:** Zwei Flags auf verschiedenen Ebenen sind ein häufiger Support-Grund.
  
  ### 6. `width`-Einheiten dokumentiert (H5)
  
  **Problem:** `number | string` ohne Erklärung führt zu Trial-and-Error-Bugs.
  **Lösung:** Explizit: `number` = Pixel, `string` = CSS-Wert mit Beispielen.
  **Prinzip:** Union-Types brauchen immer konkrete Beispiele für jeden Branch.
  
  ### 7. Drei Code-Beispiele statt einem (M1/M5/M6)
  
  **Problem:** Nur ein Minimal-Beispiel ohne relevante Features.
  **Lösung:** Basis-Beispiel + vollständiges Feature-Beispiel + Loading/Empty-State-Beispiel.
  **Prinzip:** Entwickler kopieren Beispiele – schlechte Beispiele multiplizieren schlechten Code.
  
  ### 8. Accessibility-Sektion (L1)
  
  **Problem:** Keine ARIA-Dokumentation für Enterprise-Compliance-Anforderungen.
  **Lösung:** Tabelle mit WCAG-2.1-AA-Merkmalen und konkreten Implementierungsdetails.
  **Prinzip:** Schlechte Tabellen-Accessibility ist einer der häufigsten BITV/WCAG-Audit-Befunde.
  
