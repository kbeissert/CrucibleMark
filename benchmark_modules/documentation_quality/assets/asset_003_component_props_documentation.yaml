context: |
  Du bist ein Technical Writer für ein Design System Team. Das Team hat eine
  wiederverwendbare React-Komponente "DataTable" entwickelt, aber die
  Props-Dokumentation ist unvollständig und inkonsistent.

  **Komponente:** `<DataTable />` - Daten-Tabelle mit Sortierung, Filterung, Pagination
  **Tech Stack:** React 18 + TypeScript
  **Zielgruppe:** Frontend-Developer im Unternehmen
  **Kontext:** Shared Component Library mit 50+ Components

  Das Team hat TypeScript-Interfaces definiert, aber:
  - Props-Beschreibungen fehlen oder sind zu kurz
  - Default Values nicht dokumentiert
  - Required/Optional-Flags inkonsistent
  - Keine Beispiele für komplexe Props
  - Type Unions nicht erklärt

prompt: |
  Analysiere die folgende React Component Dokumentation und bewerte sie nach
  **Component Library Best Practices**.

  **Wichtig:** Identifiziere ALLE Probleme und priorisiere nach Schweregrad.

  ## Kategorien:
  1. **Struktur & Vollständigkeit** - Props-Tabelle, Required/Optional, Default Values
  2. **Technische Korrektheit** - TypeScript-Types, Event-Signaturen, Generics
  3. **Beispiele & Use Cases** - Code-Beispiele, Edge Cases, Storybook
  4. **Developer Experience** - Accessibility, Performance, Migration-Guides

  ---

  ## Aktuelle Component-Dokumentation:

  ```typescript
  // DataTable.tsx
  interface DataTableProps<T> {
    data: T[];
    columns: Column<T>[];
    onRowClick?: (row: T) => void;
    sortable?: boolean;
    pagination?: boolean;
    pageSize?: number;
    loading?: boolean;
    emptyState?: React.ReactNode;
    striped?: boolean;
    stickyHeader?: boolean;
  }

  interface Column<T> {
    key: keyof T;
    header: string;
    sortable?: boolean;
    width?: number | string;
    render?: (value: any, row: T) => React.ReactNode;
  }
  ```

  **Aktuelle Docs (README.md):**

  ```
  # DataTable Component

  A flexible data table component.

  ## Props

  - `data` - Array of data
  - `columns` - Column definitions
  - `onRowClick` - Click handler
  - `sortable` - Enable sorting
  - `pagination` - Enable pagination

  ## Example

  ```jsx
  <DataTable
    data={users}
    columns={columns}
  />
  ```
  ```

  ---

  ## Deine Aufgabe

  1. **Identifiziere alle Probleme** in den 4 Kategorien
  2. **Priorisiere** nach Schweregrad:
     - **Critical**: Fehlende Required-Flags, falsche Types
     - **High**: Fehlende Default Values, keine Event-Signaturen
     - **Medium**: Fehlende Beispiele, unvollständige Beschreibungen
     - **Low**: Fehlende A11y-Docs, keine Storybook-Links
  3. **Erstelle eine vollständige Props-Tabelle** mit Name, Type, Required, Default, Description
  4. **Füge 2-3 realistische Code-Beispiele hinzu**
  5. **Begründe** deine Änderungen mit Component Library Prinzipien

  WICHTIG: Bitte liste zuerst explizit alle gefundenen Probleme auf (Schritt 1), bevor du die verbesserte Version erstellst.

