# ============================================================
# Test Asset: Sarcasm Shield (Subtext Detection)
# Domain: Content Transformation & Communications
# Difficulty: Tiered (High-End)
# Version: 1.0.0
# ============================================================

metadata:
  id: content_transformation_006
  name: "Sarcasm Shield (Incident Report)"
  category: content_transformation
  subcategory: subtext_adaptation
  difficulty: tiered
  estimated_time_seconds: 120
  tags: [soft-skills, sarcasm-detection, communications, incident-report, subtext]
  author: "LLM Benchmark Suite"
  created: "2026-01-17"
  updated: "2026-01-17"
  language: en
  version: "1.0.0"

# ============================================================
# Test Prompt
# ============================================================

prompt: |
  You are a Communications Lead. Rewrite the following internal Slack message from a Lead Dev into a formal Incident Report for the CTO. 
  
  Your goal:
  1. Remove ALL sarcasm and passive-aggressive tone.
  2. Keep the technical facts.
  3. Interpret metaphors correctly (e.g., "horoscope" means unreliable/random).
  4. Use a completely professional, solution-oriented tone.

  Source Text:
  "Great job deploying on Friday, geniuses. The real-time database is now as consistent as my horoscope. And the latency spikes are so high I had time to make a coffee while waiting for the dashboard to load. We need to rollback the 'optimization' before the customers wake up."

  Output the formal report only.

# ============================================================
# Scoring Configuration
# ============================================================

scoring:
  total_points: 100

  # --------------------------------------------------------
  # Category 1: Error Detection & Constraints (70 Points)
  # Here "Error Detection" means detecting sarcasm and NOT ignoring facts.
  # --------------------------------------------------------
  error_detection:
    weight: 70
    
    # Tier 1: Labeled Issues (Facts that must be present) - Easiest
    labeled_issues:
      - issue: "Mention Deployment Timing"
        points: 10
        severity: critical
        keywords: ["friday", "deployment", "release", "update"]
      
      - issue: "Mention Rollback Requirement"
        points: 7.5
        severity: high
        keywords: ["rollback", "revert", "undo"]

    # Tier 2: Standard Issues (Tone Shift) - Medium
    standard_issues:
      - issue: "Professional Tone (No Sarcasm)"
        points: 21.0
        severity: critical
        keywords: ["incident", "report", "issue", "latency", "consistency", "reliability"] 
        # Note: True sarcasm absence is hard to regex, we rely on positive keywords here.
        # Negative scoring for sarcasm words is handled in solution_quality or custom check.

    # Tier 3: Advanced Issues (Subtext Interpretation) - Hard
    advanced_issues:
      - issue: "Interpret 'Horoscope' Metaphor"
        points: 17.5
        severity: high
        keywords: ["data consistency", "inconsistent", "corruption", "unreliable", "integrity", "random"]
        # Must translate "horoscope" to technical term

    # Tier 4: Expert Issues (Latency Detail) - Very Hard
    expert_issues:
      - issue: "Interpret 'Coffee Break' Metaphor"
        points: 14.0
        severity: medium
        keywords: ["latency", "performance", "slow", "delay", "response time"]

  # --------------------------------------------------------
  # Category 2: Solution Quality (30 Points)
  # --------------------------------------------------------
  solution_quality:
    weight: 30
    criteria:
      - name: "Formal Structure"
        points: 10
        min_keywords: 2
        keywords: ["summary", "impact", "root cause", "action items", "status", "timeline"]
      
      - name: "Sarcasm Absence (Negative Check)"
        points: 20
        check_method: "negative_keyword_presence" 
        forbidden_keywords: ["horoscope", "geniuses", "coffee", "wake up"]
        keywords: [] # Unused for negative check
