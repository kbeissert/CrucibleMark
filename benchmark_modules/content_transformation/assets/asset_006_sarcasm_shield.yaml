# ============================================================
# Test Asset: Sarcasm Shield (Subtext Detection)
# Domain: Content Transformation & Communications
# Difficulty: Tiered (High-End)
# Version: 1.0.0
# ============================================================

metadata:
  id: content_transformation_006
  name: "Sarcasm Shield (Incident Report)"
  category: content_transformation
  subcategory: subtext_adaptation
  difficulty: tiered
  estimated_time_seconds: 120
  tags: [soft-skills, sarcasm-detection, communications, incident-report, subtext]
  author: "LLM Benchmark Suite"
  created: "2026-01-17"
  updated: "2026-01-17"
  language: en
  version: "1.0.0"

# ============================================================
# Test Prompt
# ============================================================

prompt: |
  You are a Communications Lead. Rewrite the following internal Slack message from a Lead Dev into a formal Incident Report for the CTO.

  Your goal:
  1. Remove ALL sarcasm and passive-aggressive tone.
  2. Keep the technical facts.
  3. Interpret metaphors correctly (e.g., "horoscope" means unreliable/random).
  4. Use a completely professional, solution-oriented tone.

  Source Text:
  "Great job deploying on Friday, geniuses. The real-time database is now as consistent as my horoscope. And the latency spikes are so high I had time to make a coffee while waiting for the dashboard to load. We need to rollback the 'optimization' before the customers wake up."

  Output the formal report only.

# ============================================================
# Scoring Configuration
# ============================================================

scoring:
  total_points: 100
  semantic_threshold: 0.45

  # --------------------------------------------------------
  # Category 1: Error Detection & Constraints (70 Points)
  # Here "Error Detection" means detecting sarcasm and NOT ignoring facts.
  # --------------------------------------------------------
  error_detection:
    weight: 70

    # Tier 1: Labeled Issues (Facts that must be present) - Easiest
    labeled_issues:
      - issue: "Mention Deployment Timing"
        points: 10
        severity: critical
        keywords: ["friday", "deployment", "release", "update"]

      - issue: "Mention Rollback Requirement"
        points: 7.5
        severity: high
        keywords: ["rollback", "revert", "undo"]

    # Tier 2: Standard Issues (Tone Shift) - Medium
    standard_issues:
      - issue: "Professional Tone (No Sarcasm)"
        points: 21.0
        severity: critical
        keywords: ["incident", "report", "objective", "technical", "formal", "professional", "status"]

    # Tier 3: Advanced Issues (Subtext Interpretation) - Hard
    advanced_issues:
      - issue: "Interpret 'Horoscope' Metaphor"
        points: 17.5
        severity: high
        keywords: ["data inconsistency", "non-deterministic", "integrity violation", "corrupted state", "unpredictable"]
        # Must translate "horoscope" into precise technical fault

    # Tier 4: Expert Issues (Latency Detail) - Very Hard
    expert_issues:
      - issue: "Interpret 'Coffee Break' Metaphor"
        points: 14.0
        severity: medium
        keywords:
          - "latency"           # Basic
          - "response time"     # Basic
          - "timeout"           # Medium
          - "degradation"       # Medium
          - "high latency"      # Medium
          - "SLA breach"        # Hard
        # Mix of basic/hard to allow Qwen to match ~33% output, requiring lowered threshold

  # --------------------------------------------------------
  # Category 2: Solution Quality (30 Points)
  # --------------------------------------------------------
  solution_quality:
    weight: 30
    criteria:
      - name: "Formal Structure"
        points: 10
        min_keywords: 2
        keywords: ["summary", "impact", "root cause", "action items", "status", "timeline"]

      - name: "Sarcasm Absence (Negative Check)"
        points: 20
        check_method: "negative_keyword_presence"
        forbidden_keywords: ["horoscope", "geniuses", "coffee", "wake up"]
        keywords: [] # Unused for negative check

golden_standard: |
  # Incident Report

  **Date:** [Date]
  **Reported By:** Lead Developer
  **Submitted By:** Communications Lead
  **Recipient:** Chief Technology Officer
  **Severity Level:** High
  **Status:** Action Required

  ---

  ## Incident Summary

  A deployment executed on Friday has resulted in degraded system performance
  affecting the real-time database and customer-facing dashboard. Immediate
  remediation is recommended prior to peak customer usage hours.

  ---

  ## Identified Issues

  **1. Real-Time Database Inconsistency**
  The Friday deployment has introduced instability in the real-time database,
  resulting in unpredictable and unreliable data consistency. The root cause
  appears to be linked to changes included in the most recent optimization update.

  **2. Elevated Latency**
  Significant latency spikes have been observed across the system, most notably
  impacting dashboard load times. Response times have degraded to a level that
  is likely to produce a materially negative customer experience if left unresolved.

  ---

  ## Recommended Action

  It is strongly recommended that we **initiate an immediate rollback** of the
  Friday optimization deployment to restore system stability and data consistency
  before customers encounter widespread impact during regular usage hours.

  ---

  ## Next Steps

  - Authorize and execute rollback of the Friday deployment
  - Monitor system performance post-rollback to confirm stabilization
  - Conduct a root cause analysis of the optimization changes
  - Schedule a post-incident review to prevent recurrence

  ---

  *Please advise on rollback authorization at your earliest convenience.*

  ---

  ## 5 Begründungen

  1. **Sarcasm und Jargon vollständig entfernt** – Ausdrücke wie „absolute genius
     move" oder Bezüge auf Horoskope bzw. Coffee sind in einer formellen
     Kommunikation an das CTO-Level inakzeptabel und untergraben die Glaubwürdigkeit
     des Berichts. Alle emotionalen Färbungen wurden in sachliche Faktenaussagen
     übersetzt.

  2. **Klare Heading-Struktur für Executive-Leseverhalten** – CTOs lesen Incident
     Reports nicht linear. Sie scannen: Zusammenfassung → Problem → Empfehlung →
     Nächste Schritte. Die Struktur folgt diesem Lesepfad, damit die Kernaussage
     (Rollback jetzt) in Sekunden erfassbar ist.

  3. **Passive, professionelle Formulierungen statt Vorwürfe** – „The deployment
     has introduced instability" statt „jemand hat Mist gebaut". Das schützt das
     Team, fokussiert auf das Problem und ermöglicht konstruktive Lösungsfindung
     ohne defensive Reaktion beim Empfänger.

  4. **Explizite CTA am Ende** – „Please advise on rollback authorization" macht
     klar, was vom CTO konkret erwartet wird. Ohne explizite Handlungsaufforderung
     bleibt der Ball im Unklaren – bei kritischen Vorfällen ist Entscheidungsklarheit
     geschäftskritisch.

  5. **Metadata-Block am Anfang** – Datum, Schweregrad, Status und Empfänger als
     strukturierte Header-Informationen ermöglichen schnelle Einordnung und
     Archivierung. Bei Post-Incident-Reviews und Audits sind diese Felder
     entscheidend für Traceability.
