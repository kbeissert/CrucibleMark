metadata:
  id: content_transformation_005
  name: "Email-Newsletter Adaptation"
  category: content_transformation
  subcategory: email_marketing
  difficulty: tiered
  estimated_time_seconds: 150
  tags:
    - email-marketing
    - newsletter
    - b2b
    - case-study
    - storytelling
  author: "CrucibleMark"
  created: "2025-12-29"
  updated: "2025-12-29"
  language: de
  version: "1.0.0"

context: |
  Du bist ein Email-Marketing-Spezialist für B2B SaaS-Unternehmen.

  Dein Kunde hat eine detaillierte Case Study (2000 Wörter) über einen erfolgreichen
  Kunden geschrieben: "How Company X Increased Conversion Rate by 47% with A/B Testing"

  Das Problem: Die Case Study ist zu lang und formal für einen Newsletter. Niemand liest
  2000 Wörter in einer Email. Sie brauchen eine kurze, engaging Version (200-300 Wörter),
  die Subscriber zum Klicken auf die volle Case Study motiviert.

  Deine Aufgabe: Transformiere die formale Case Study in einen storytelling-orientierten
  Newsletter mit Subject-Line, Preview-Text, Hook, Body und CTA.

  **Zielgruppe:** Newsletter-Subscriber (Marketing-Professionals, Product-Manager)
  **Ziel:** Click-Through zur vollen Case Study (nicht alles in Email verraten)
  **Ton:** Professionell aber conversational, nicht zu verkäuferisch
  **Format:** Plain-Text Email (kein HTML, außer CTA-Button)

prompt: |
  Du bist ein Email-Marketing-Experte. Deine Aufgabe besteht aus zwei Teilen:

  1. ANALYSE: Analysiere kurz, warum die Case Study nicht als Email funktioniert. Benenne fehlende Elemente (nutze Begriffe wie "Subject Line", "Hook", "Storytelling", "CTA").
  2. TRANSFORMATION: Erstelle basierend auf deiner Analyse den Newsletter.
  3. EXPERT-LEVEL: Füge eine "Micro-Interaction" Idee hinzu (z.B. eine einfache Frage, auf die man mit "Reply" antworten soll), um die Deliverability durch Engagement zu steigern.

  ## INPUT: CASE STUDY (Auszug, 400 Wörter)

  WICHTIG: Führe zuerst die ANALYSE durch (Schritt 1) und nenne explizit die fehlenden Elemente, bevor du die TRANSFORMATION erstellst. Analyse: maximal 2–3 Sätze.

  **Title:** How Company X Increased Conversion Rate by 47% with A/B Testing

  **Executive Summary:**
  Company X, ein E-Commerce-Startup im Fashion-Bereich, kämpfte mit niedrigen
  Conversion Rates auf ihrer Product-Page (nur 1.2%). Nach Implementierung eines
  systematischen A/B-Testing-Frameworks konnten sie die Conversion Rate innerhalb
  von 6 Monaten auf 1.76% steigern (+47%).

  **Challenge:**
  Das Problem war komplex: Hoher Traffic (50.000 Besucher/Monat), aber wenig Sales.
  Nutzer verließen die Product-Page nach durchschnittlich 12 Sekunden. Heatmaps
  zeigten, dass User nicht scrollten. Der "Add to Cart"-Button war below the fold.

  **Solution:**
  Das Marketing-Team implementierte ein 3-Phasen-Testprogramm:

  1. **Phase 1: Layout-Tests (Monat 1-2)**
     - 5 verschiedene Product-Page-Layouts getestet
     - Gewinner: Hero-Image links, Product-Info rechts (+12% CR)

  2. **Phase 2: CTA-Optimization (Monat 3-4)**
     - 8 verschiedene Button-Texte getestet
     - Gewinner: "Jetzt kaufen - Kostenloser Versand" (+18% CR vs. "Add to Cart")

  3. **Phase 3: Social Proof (Monat 5-6)**
     - Reviews above the fold platziert
     - Trust-Badges neben Preis
     - Result: +17% CR

  **Results:**
  - Conversion Rate: 1.2% → 1.76% (+47%)
  - Revenue: +€340.000 in 6 Monaten
  - Customer Acquisition Cost: -23%
  - Team-Learning: Systematisches Testing statt "Bauchgefühl"

  **Testimonial:**
  "A/B Testing hat unsere Entscheidungsfindung komplett verändert. Wir testen jetzt
  alles – von Headlines bis zu Checkout-Flows. Das Investment hat sich nach
  2 Monaten amortisiert." – Sarah M., Head of Marketing, Company X

  **Key Takeaways:**
  1. Start with high-impact areas (Product-Page > Footer)
  2. Test one variable at a time
  3. Run tests for minimum 2 weeks (statistical significance)
  4. Document everything (build institutional knowledge)

  ---

  ## ANFORDERUNGEN AN DEN NEWSLETTER:

  1. **Subject-Line:**
     - Max 50 Zeichen
     - Neugier wecken (keine Spoiler wie "+47%")
     - Personalisierung möglich ({{FirstName}})
     - A/B-Test-Variante vorschlagen

  2. **Preview-Text:**
     - Erste 50 Zeichen nach Subject-Line (wird in Inbox angezeigt)
     - Ergänzt Subject-Line (nicht wiederholen)
     - Hook fortsetzend

  3. **Email-Struktur:**
     - Hook/Intro: 2-3 Sätze (Problem etablieren)
     - Body: 3-4 Paragraphs (Story erzählen, nicht alle Details verraten)
     - CTA: Klarer Button-Text + Reason-to-Click
     - PS: Bonus-Info oder Secondary-CTA

  4. **Story-Arc:**
     - Problem → Solution → Outcome (nicht Features → Benefits)
     - Emotional Hook (Frustration → Relief)
     - Konkrete Zahlen (+47%, €340k) – aber nicht alle Takeaways verraten

  5. **Format:**
     - 200-300 Wörter (schnell scanbar)
     - Kurze Paragraphs (max 3 Zeilen)
     - Bullets optional (für Key-Points)
     - Personalisierung: {{FirstName}}, direkte Ansprache

  6. **Tone:**
     - Conversational (nicht zu formal)
     - Hilfreich (nicht verkäuferisch)
     - Dringlichkeit subtil ("Jetzt lesen" nicht "LETZTE CHANCE")

  Erstelle den vollständigen Newsletter (Subject-Line + Preview-Text + Email-Body + PS).

