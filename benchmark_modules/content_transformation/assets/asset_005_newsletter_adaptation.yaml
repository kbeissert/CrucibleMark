metadata:
  id: content_transformation_005
  name: "Email-Newsletter Adaptation"
  category: content_transformation
  subcategory: email_marketing
  difficulty: tiered
  estimated_time_seconds: 150
  tags:
    - email-marketing
    - newsletter
    - b2b
    - case-study
    - storytelling
  author: "CrucibleMark"
  created: "2025-12-29"
  updated: "2025-12-29"
  language: de
  version: "1.0.0"

context: |
  Du bist ein Email-Marketing-Spezialist für B2B SaaS-Unternehmen.
  
  Dein Kunde hat eine detaillierte Case Study (2000 Wörter) über einen erfolgreichen
  Kunden geschrieben: "How Company X Increased Conversion Rate by 47% with A/B Testing"
  
  Das Problem: Die Case Study ist zu lang und formal für einen Newsletter. Niemand liest
  2000 Wörter in einer Email. Sie brauchen eine kurze, engaging Version (200-300 Wörter),
  die Subscriber zum Klicken auf die volle Case Study motiviert.
  
  Deine Aufgabe: Transformiere die formale Case Study in einen storytelling-orientierten
  Newsletter mit Subject-Line, Preview-Text, Hook, Body und CTA.
  
  **Zielgruppe:** Newsletter-Subscriber (Marketing-Professionals, Product-Manager)
  **Ziel:** Click-Through zur vollen Case Study (nicht alles in Email verraten)
  **Ton:** Professionell aber conversational, nicht zu verkäuferisch
  **Format:** Plain-Text Email (kein HTML, außer CTA-Button)

prompt: |
  Du bist ein Email-Marketing-Experte. Deine Aufgabe besteht aus zwei Teilen:
  
  1. ANALYSE: Analysiere kurz, warum die Case Study nicht als Email funktioniert. Benenne fehlende Elemente (nutze Begriffe wie "Subject Line", "Hook", "Storytelling", "CTA").
  2. TRANSFORMATION: Erstelle basierend auf deiner Analyse den Newsletter.
  3. EXPERT-LEVEL: Füge eine "Micro-Interaction" Idee hinzu (z.B. eine einfache Frage, auf die man mit "Reply" antworten soll), um die Deliverability durch Engagement zu steigern.
  
  ## INPUT: CASE STUDY (Auszug, 400 Wörter)
  
  **Title:** How Company X Increased Conversion Rate by 47% with A/B Testing
  
  **Executive Summary:**
  Company X, ein E-Commerce-Startup im Fashion-Bereich, kämpfte mit niedrigen
  Conversion Rates auf ihrer Product-Page (nur 1.2%). Nach Implementierung eines
  systematischen A/B-Testing-Frameworks konnten sie die Conversion Rate innerhalb
  von 6 Monaten auf 1.76% steigern (+47%).
  
  **Challenge:**
  Das Problem war komplex: Hoher Traffic (50.000 Besucher/Monat), aber wenig Sales.
  Nutzer verließen die Product-Page nach durchschnittlich 12 Sekunden. Heatmaps
  zeigten, dass User nicht scrollten. Der "Add to Cart"-Button war below the fold.
  
  **Solution:**
  Das Marketing-Team implementierte ein 3-Phasen-Testprogramm:
  
  1. **Phase 1: Layout-Tests (Monat 1-2)**
     - 5 verschiedene Product-Page-Layouts getestet
     - Gewinner: Hero-Image links, Product-Info rechts (+12% CR)
  
  2. **Phase 2: CTA-Optimization (Monat 3-4)**
     - 8 verschiedene Button-Texte getestet
     - Gewinner: "Jetzt kaufen - Kostenloser Versand" (+18% CR vs. "Add to Cart")
  
  3. **Phase 3: Social Proof (Monat 5-6)**
     - Reviews above the fold platziert
     - Trust-Badges neben Preis
     - Result: +17% CR
  
  **Results:**
  - Conversion Rate: 1.2% → 1.76% (+47%)
  - Revenue: +€340.000 in 6 Monaten
  - Customer Acquisition Cost: -23%
  - Team-Learning: Systematisches Testing statt "Bauchgefühl"
  
  **Testimonial:**
  "A/B Testing hat unsere Entscheidungsfindung komplett verändert. Wir testen jetzt
  alles – von Headlines bis zu Checkout-Flows. Das Investment hat sich nach
  2 Monaten amortisiert." – Sarah M., Head of Marketing, Company X
  
  **Key Takeaways:**
  1. Start with high-impact areas (Product-Page > Footer)
  2. Test one variable at a time
  3. Run tests for minimum 2 weeks (statistical significance)
  4. Document everything (build institutional knowledge)
  
  ---
  
  ## ANFORDERUNGEN AN DEN NEWSLETTER:
  
  1. **Subject-Line:**
     - Max 50 Zeichen
     - Neugier wecken (keine Spoiler wie "+47%")
     - Personalisierung möglich ({{FirstName}})
     - A/B-Test-Variante vorschlagen
  
  2. **Preview-Text:**
     - Erste 50 Zeichen nach Subject-Line (wird in Inbox angezeigt)
     - Ergänzt Subject-Line (nicht wiederholen)
     - Hook fortsetzend
  
  3. **Email-Struktur:**
     - Hook/Intro: 2-3 Sätze (Problem etablieren)
     - Body: 3-4 Paragraphs (Story erzählen, nicht alle Details verraten)
     - CTA: Klarer Button-Text + Reason-to-Click
     - PS: Bonus-Info oder Secondary-CTA
  
  4. **Story-Arc:**
     - Problem → Solution → Outcome (nicht Features → Benefits)
     - Emotional Hook (Frustration → Relief)
     - Konkrete Zahlen (+47%, €340k) – aber nicht alle Takeaways verraten
  
  5. **Format:**
     - 200-300 Wörter (schnell scanbar)
     - Kurze Paragraphs (max 3 Zeilen)
     - Bullets optional (für Key-Points)
     - Personalisierung: {{FirstName}}, direkte Ansprache
  
  6. **Tone:**
     - Conversational (nicht zu formal)
     - Hilfreich (nicht verkäuferisch)
     - Dringlichkeit subtil ("Jetzt lesen" nicht "LETZTE CHANCE")
  
  Erstelle den vollständigen Newsletter (Subject-Line + Preview-Text + Email-Body + PS).

scoring:
  total_points: 100
  
  error_detection:
    weight: 40
    description: "Erkennung fehlender/falscher Newsletter-Transformation (Tiered)"
    
    labeled_issues:
      - issue: "Keine Subject-Line"
        category: "Subject-Line"
        severity: critical
        points: 5.0
        explanation: "Email hat keine Betreffzeile (essentiell für Open-Rate)"
        check_method: keyword_presence
        min_keywords: 2
        keywords:
          - "subject"
          - "betreff"
          - "subject line"
          - "betreffzeile"
          - "headline"
          - "titel"
          - "öffnungsrate"
        transformation_principle: "Case Study → Subject-Line"
      
      - issue: "Kein Preview-Text"
        category: "Email-Struktur"
        severity: critical
        points: 5.0
        explanation: "Keine Optimierung der ersten 50 Zeichen (Inbox-Preview)"
        check_method: keyword_presence
        min_keywords: 2
        keywords:
          - "preview"
          - "vorschau"
          - "preview text"
          - "erste zeichen"
          - "inbox"
          - "preheader"
          - "snippet"
        transformation_principle: "Full-Text → Preview-Optimized"
    
    standard_issues:
      - issue: "Zu lang"
        category: "Format"
        severity: high
        points: 2.4
        explanation: "Email über 300 Wörter (zu lang für Newsletter)"
        check_method: keyword_presence
        min_keywords: 2
        keywords:
          - "kurz"
          - "prägnant"
          - "300"
          - "wörter"
          - "kompakt"
          - "snackable"
          - "scanbar"
        transformation_principle: "Long-Form → Email-Digest"
      
      - issue: "Kein CTA-Button"
        category: "CTA & Urgency"
        severity: critical
        points: 2.4
        explanation: "Nur Text-Link statt klarem CTA-Button-Text"
        check_method: keyword_presence
        min_keywords: 2
        keywords:
          - "cta"
          - "button"
          - "call to action"
          - "jetzt lesen"
          - "mehr erfahren"
          - "case study lesen"
          - "klicken"
        transformation_principle: "Passive → Actionable"
      
      - issue: "Keine Personalisierung"
        category: "Email-Struktur"
        severity: medium
        points: 2.4
        explanation: "Kein {{FirstName}} oder direkte Ansprache ('Hi Sarah,')"
        check_method: keyword_presence
        min_keywords: 2
        keywords:
          - "{{FirstName}}"
          - "{{Name}}"
          - "personalisierung"
          - "hi"
          - "hallo"
          - "liebe"
          - "ansprache"
        transformation_principle: "Generic → Personalized"
      
      - issue: "Paragraphs zu lang"
        category: "Format"
        severity: medium
        points: 2.4
        explanation: "Absätze über 3 Zeilen (schlecht scanbar auf Mobile)"
        check_method: keyword_presence
        min_keywords: 2
        keywords:
          - "absatz"
          - "paragraph"
          - "kurz"
          - "mobile"
          - "lesbar"
          - "zeilen"
          - "struktur"
        transformation_principle: "Dense → Scannable"
      
      - issue: "Kein PS"
        category: "Email-Struktur"
        severity: medium
        points: 2.4
        explanation: "PS fehlt (wichtig für Extra-CTA oder Bonus-Info)"
        check_method: keyword_presence
        min_keywords: 2
        keywords:
          - "ps"
          - "p.s."
          - "postscript"
          - "nachsatz"
          - "übrigens"
          - "noch was"
          - "bonus"
        transformation_principle: "Single-CTA → Layered"
    
    advanced_issues:
      - issue: "Subject-Line nicht A/B-tested"
        category: "Subject-Line"
        severity: medium
        points: 2.0
        explanation: "Nur 1 Subject-Line, keine Alternative zum Testen"
        check_method: keyword_presence
        min_keywords: 2
        keywords:
          - "variante"
          - "a/b"
          - "test"
          - "alternative"
          - "option"
          - "version"
          - "vorschlag"
        transformation_principle: "Single → A/B-Testable"
      
      - issue: "Statistiken nicht hervorgehoben"
        category: "Content-Quality"
        severity: high
        points: 2.0
        explanation: "Zahlen (+47%, €340k) versteckt statt prominent platziert"
        check_method: keyword_presence
        min_keywords: 2
        keywords:
          - "47%"
          - "340"
          - "statistik"
          - "zahlen"
          - "hervorgehoben"
          - "prozent"
          - "ergebnis"
        transformation_principle: "Buried → Highlighted"
      
      - issue: "Keine Social-Proof-Elemente"
        category: "Trust & Credibility"
        severity: medium
        points: 2.0
        explanation: "Testimonial oder Company-Name nicht erwähnt"
        check_method: keyword_presence
        min_keywords: 2
        keywords:
          - "testimonial"
          - "zitat"
          - "company x"
          - "kunde"
          - "social proof"
          - "beweis"
          - "kunde sagt"
        transformation_principle: "Claim → Proof"
      
      - issue: "CTA nicht klar"
        category: "CTA & Urgency"
        severity: high
        points: 2.0
        explanation: "'Learn More' statt spezifisch 'Read the Full Case Study'"
        check_method: keyword_presence
        min_keywords: 2
        keywords:
          - "case study lesen"
          - "vollständige"
          - "jetzt lesen"
          - "details"
          - "mehr erfahren"
          - "spezifisch"
          - "klar"
        transformation_principle: "Generic → Specific CTA"
      
      - issue: "Story-Arc fehlt"
        category: "Storytelling"
        severity: high
        points: 2.0
        explanation: "Nur Fakten, keine emotionale Story (Problem → Solution → Outcome)"
        check_method: keyword_presence
        min_keywords: 2
        keywords:
          - "problem"
          - "lösung"
          - "ergebnis"
          - "story"
          - "geschichte"
          - "reise"
          - "transformation"
        transformation_principle: "Facts → Story"
    
    expert_issues:
      - issue: "Keine Micro-Interaction"
        category: "Engagement"
        severity: medium
        points: 2.0
        explanation: "Keine Frage/Aufforderung zum Antworten ('Reply with...')."
        check_method: keyword_presence
        min_keywords: 2
        keywords:
          - "antworten"
          - "reply"
          - "frage"
          - "micro"
          - "interaction"
          - "engagement"
          - "schreib mir"
        transformation_principle: "Broadcast → Conversation"
      
      - issue: "Deliverability-Erklärung fehlt"
        category: "Deliverability"
        severity: low
        points: 2.0
        explanation: "Keine Erklärung, warum Replies gut für Deliverability sind."
        check_method: keyword_presence
        min_keywords: 2
        keywords:
          - "deliverability"
          - "zustellbarkeit"
          - "spam"
          - "inbox"
          - "whitelist"
          - "signal"
          - "provider"
        transformation_principle: "Tactical → Strategic"
      
      - issue: "Keine Follow-Up-Email erwähnt"
        category: "Advanced-Strategy"
        severity: low
        points: 2.0
        explanation: "Kein Hinweis auf Nurture-Sequence (Was kommt nach Non-Opener?)"
        check_method: keyword_presence
        min_keywords: 2
        keywords:
          - "follow up"
          - "nächste"
          - "serie"
          - "sequence"
          - "nurture"
          - "nachfassen"
          - "reminder"
        transformation_principle: "Single-Touch → Multi-Touch"
      
      - issue: "Spam-Score-Risiken"
        category: "Deliverability"
        severity: low
        points: 2.0
        explanation: "Zu viele Links, ALL CAPS, oder Spam-Wörter ('FREE', 'ACT NOW')"
        check_method: keyword_presence
        min_keywords: 2
        keywords:
          - "spam"
          - "spam score"
          - "deliverability"
          - "zustellbarkeit"
          - "filter"
          - "risiko"
          - "vermeiden"
        transformation_principle: "Risky → Deliverable"
  
  solution_quality:
    weight: 60
    description: "Qualität der Newsletter-Adaptation"
    
    criteria:
      - name: "Subject-Line-Quality"
        points: 20
        check_method: keyword_presence
        min_keywords: 2
        keywords:
          - "subject"
          - "betreff"
          - "neugierig"
          - "kurz"
          - "50 zeichen"
          - "hook"
          - "öffnen"
          - "personalisiert"
        description: "Ist die Subject-Line neugierig machend, relevant und nicht spammy?"
      
      - name: "Email-Structure"
        points: 20
        check_method: keyword_presence
        min_keywords: 2
        keywords:
          - "hook"
          - "body"
          - "cta"
          - "ps"
          - "struktur"
          - "aufbau"
          - "gliederung"
          - "absatz"
        description: "Hat die Email eine klare Struktur (Hook, Body, CTA, PS)?"
      
      - name: "Story-Telling"
        points: 20
        check_method: keyword_presence
        min_keywords: 2
        keywords:
          - "problem"
          - "lösung"
          - "ergebnis"
          - "story"
          - "emotional"
          - "transformation"
          - "reise"
          - "outcome"
        description: "Ist Content als Story erzählt (Problem-Solution-Outcome) statt nur Features?"
