# Content Transformation & Adaption Module Configuration
# ======================================================

metadata:
  id: "content_transformation"
  name: "Content Transformation & Adaption"
  version: "1.0.0"
  description: "Bewertet die Fähigkeit von LLMs, Content in verschiedene Formate und Stile zu transformieren"
  author: "CrucibleMark"
  created: "2025-12-29"
  updated: "2026-01-31" 
  tags:
    - content-creation
    - copywriting
    - transformation
    - marketing
    - social-media

integration:
  leaderboard:
    enable_scoring: true
    default_contribution:
      routine: 1.0
      reasoning: 0.0
    columns:
      - id: "content_transformation_score"
        label: "Content Transformation & Adaption"
        weight: 1.0

execution:
  test_class: "ContentTransformationTest"
  assets_dir: "assets"
  asset_types:
    - landing_page_copy
    - social_media_thread
    - glossary_simplification
    - video_script
    - newsletter_adaptation
    - subtext_adaptation

# Internal Module Configuration
config:
  categories:
    structure_format:
      name: "Structure & Format"
      weight: 0.25
      description: "Einhaltung des Zielformats"
    
    content_quality:
      name: "Content Quality & Clarity"
      weight: 0.25
      description: "Informationsdichte, Verständlichkeit"
      
    engagement_emotion:
      name: "Engagement & Emotion"
      weight: 0.25
      description: "Emotionaler Hook, Storytelling"
      
    conversion_action:
      name: "Conversion & Actionability"
      weight: 0.25
      description: "Call-to-Action, Umsetzbarkeit"

# 🟢 BENCHMARK ASSETS CONFIGURATION (v3.0 Granular Scoring)
