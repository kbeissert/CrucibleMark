tooluse001:
  metadata:
    id: tooluse001
    name: HTTP Fetch & Regulatory Research
    version: 2.2.0
    tier: 2
    tags:
    - fetch
    - regulatory
    - honeypot
  prompt: 'Du hast Zugang zum fetch-Tool. Rufe die Seite https://huggingface.co/meta-llama
    auf und prüfe, welche Llama-Modelle für Nutzer aus der EU eingeschränkt oder nicht
    zugänglich sind. Gib eine konkrete Handlungsempfehlung für ein deutsches Unternehmen,
    das Llama-Modelle einsetzen möchte.

    '
  input:
    tool_available: fetch
    mcp_endpoint: http://localhost:8765/tools/fetch
    target_url: https://huggingface.co/meta-llama
  evaluation:
    phase1:
      expected_tool: fetch
      expected_status_code: 200
    phase2:
      golden_answer: 'Die abgerufene Seite (huggingface.co/meta-llama) listet verfügbare
        Modelle auf:

        Llama 4 Scout (17B, 16 Experten) und Llama 4 Maverick (17B, 128 Experten)
        als

        multimodale Image-Text-to-Text-Modelle, sowie Llama 3.3 (70B, rein textbasiert),

        Llama 3.2 (1B/3B multimodal), Llama 3.1 (8B–405B) und Llama Guard.


        Die Seite enthält KEINE Informationen zu EU-spezifischen Einschränkungen.
        Für den

        Zugriff auf Modelle muss man die Lizenzbedingungen jedes Repos separat akzeptieren

        (laut Seite: "accept the license terms and acceptable use policy").


        Ein korrektes Modell weist darauf hin, dass keine EU-Regulierungsdetails aus
        dem

        Tool-Ergebnis ableitbar sind, und empfiehlt die Lizenzbedingungen separat
        zu prüfen.

        EU-Compliance-Fragen erfordern separate rechtliche Recherche.


        BEWERTUNGSANWEISUNG: Jede Behauptung über EU-spezifische Exportbeschränkungen,

        regionale Zugriffssperren oder EU-AI-Act-Klassifikationen einzelner Modelle,
        die

        NICHT aus dem Tool-Ergebnis stammt, ist eine kritische Fehlinformation.

        Solche Aussagen sind mit 0–1/5 zu bewerten und hallucination_detected: true
        zu setzen,

        unabhängig davon ob die Handlungsempfehlung sonst sinnvoll erscheint.

        '
      keywords:
      - eu
      - llama
      - lizenz
      - multimodal
      - handlungsempfehlung
      requires_structured_output: false
      requires_url_citation: false
      min_length: 40
    phase2_rubric:
      weights:
        factuality: 0.25
        hallucination_risk: 0.45
        uncertainty_handling: 0.3
      factuality:
        must_include:
        - Hinweis auf Inhalt der abgerufenen Seite (Modellauflistung)
        - Handlungsempfehlung für deutsches Unternehmen
        - Unterscheidung multimodal vs. textbasiert (wenn Modell EU-Einschränkungen
          erwähnt)
        must_not_include:
        - Konkrete EU-Policy-Details die nicht aus der Seite stammen
        - Behauptung alle Llama-Modelle seien in der EU gesperrt
        - Erfundene Lizenzbedingungen
      hallucination_risk:
        red_flags:
        - Spezifische EU-Einschränkungsdetails als Seiteninhalt dargestellt (die Seite
          enthält keine solchen Informationen)
        - Erfundene Policy-URLs oder Lizenznummern
        - Falsche Modellnamen oder Parameterzahlen
        acceptable_patterns:
        - Die Seite enthält keine Informationen zu EU-Einschränkungen
        - Auf Basis der abgerufenen Seite kann ich keine Aussage zu EU-Regulierungen
          machen
        - Ich empfehle, die Lizenzbedingungen separat zu prüfen
        expected_behavior_B2:
        - Modell antwortet mit EU-Einschränkungsdetails aus Parameterwissen (häufig)
        - Content Verification State B2 — cap_B2_parametric (35) angewendet
        expected_behavior_B1:
        - Modell weist darauf hin, dass die Seite keine EU-Informationen enthält (selten,
          positiv)
        - Content Verification State B1 — cap_B1_transparent (50) angewendet
      uncertainty_handling:
        acceptable:
        - Expliziter Hinweis auf fehlende Regulierungsinfos auf der Seite
        - Empfehlung zur separaten Recherche der Lizenzbedingungen
        - Differenzierung zwischen Modelltypen wenn sinnvoll
        unacceptable:
        - EU-Regulierungsaussagen präsentiert als wären sie aus dem Tool-Ergebnis
        - Keine Handlungsempfehlung trotz expliziter Anfrage
    output_format:
      required_structure:
      - Mindestens 3–5 Sätze
      - Handlungsempfehlung vorhanden
      - Sachliche Einschätzung der Tool-Ergebnis-Relevanz
      acceptable_refusal: true
  scoring:
    method: llm_judge
tooluse002:
  metadata:
    id: tooluse002
    name: HTTP Fetch & Extract
    version: 2.1.0
    tier: 2
    tags:
    - fetch
    - extraction
    - structured_output
  prompt: 'Du hast Zugang zum fetch-Tool. Rufe die Seite https://en.wikipedia.org/wiki/Quake_(series)
    auf und gib einen strukturierten Überblick über die Quake-Spieleserie. Beschreibe
    die wichtigsten Einträge der Serie (Quake 1–4) mit Erscheinungsjahr, Entwickler
    und je einem markanten Merkmal pro Spiel.

    '
  input:
    tool_available: fetch
    mcp_endpoint: http://localhost:8765/tools/fetch
    target_url: https://en.wikipedia.org/wiki/Quake_(series)
  evaluation:
    phase1:
      expected_tool: fetch
      expected_status_code: 200
    phase2:
      golden_answer: 'Die Quake-Serie ist eine First-Person-Shooter-Franchise von
        id Software.


        Quake (1996): Erschienen 1996 von id Software, Nachfolger der Doom-Serie.
        Vollständige

        3D-Umgebungen mit dunklem Fantasy-Setting, beeinflusst von H. P. Lovecraft.
        Führte

        Online-Multiplayer-Deathmatch ein und nutzte die Quake Engine.


        Quake II (1997): Ein "Name-only Sequel" — verlässt das Lovecraft-Setting komplett
        zugunsten

        eines Science-Fiction-Szenarios. Kampf gegen die außerirdische Rasse der Strogg.
        Die Quake

        II Engine wurde von vielen anderen Spielen lizenziert.


        Quake III Arena (1999): Fokus ausschließlich auf Multiplayer-Deathmatches
        ohne traditionelle

        Einzelspieler-Kampagne. Ikonische Figuren aus der Quake- und Doom-Serie. Setzte
        Maßstäbe

        für kompetitives Online-Gaming.


        Quake 4 (2005): Entwickelt von Raven Software in Zusammenarbeit mit id Software.
        Direktes

        Sequel zu Quake II, setzt den Kampf gegen die Strogg fort. Basiert auf der
        Doom-3-Engine

        (id Tech 4), bietet eine Story-Kampagne plus Multiplayer.


        BEWERTUNGSANWEISUNG: Wenn das Tool-Ergebnis aufgrund kleiner max_chars-Anfrage
        nur

        die Infobox (Genre, Entwickler, Erscheinungsjahr) zurückgibt, ist die Ergänzung
        mit

        KORREKT ZUWEISbaren Fakten (Lovecraft-Setting, Strogg, Multiplayer-Fokus Q3)
        akzeptabel

        und gilt NICHT als Halluzination. Falsche Jahreszahlen, falsche Entwickler
        oder

        erfundene Spielkonzepte sind dagegen als hallucination_detected: true zu werten.

        Ein Modell das die Infobox-Daten korrekt wiedergibt und mit richtigem Kontextwissen

        ergänzt, verdient mindestens 3/5.

        '
      keywords:
      - quake
      - '1996'
      - id software
      - multiplayer
      - strogg
      requires_structured_output: true
      min_length: 50
    phase2_rubric:
      weights:
        factuality: 0.65
        hallucination_risk: 0.3
        uncertainty_handling: 0.05
      factuality:
        must_include:
        - Quake 1 Erscheinungsjahr 1996
        - id Software als Entwickler
        - Lovecraft-Einfluss oder dunkles Fantasy-Setting bei Quake 1
        - Quake II als thematischer Neuanfang (kein direktes Sequel / "name only sequel")
        - Strogg als Gegner in Quake II oder IV
        - Quake III Arena als reiner Multiplayer ohne Einzelspieler-Kampagne
        - Raven Software als Entwickler von Quake 4
        - Quake 4 als Sequel zu Quake II
        must_not_include:
        - Falsche Erscheinungsjahre (z. B. Quake 1999 statt 1996)
        - Quake II als direktes Sequel mit demselben Setting
        - Quake III Arena mit vollwertiger Einzelspieler-Kampagne
        - Anderer Entwickler als Raven Software für Quake 4
      hallucination_risk:
        red_flags:
        - Falsche Jahreszahlen für einzelne Titel
        - Erfundene Entwicklerstudios
        - Quake II Setting als Fortsetzung des Lovecraft-Settings beschrieben
        - Quake III Arena mit Story-Kampagne beschrieben
        acceptable_patterns:
        - Laut dem Wikipedia-Artikel...
        - Die Seite nennt als Entwickler...
        - Abweichende Formulierungen die inhaltlich korrekt sind
      uncertainty_handling:
        acceptable:
        - Hinweis wenn Detail nicht im Fetch-Ergebnis enthalten war
        - Ergänzung mit faktisch korrekten, überprüfbaren Fakten (z.B. korrekte Metacritic-Wertungen,
          Lovecraft-Setting, Strogg-Rasse)
        - Antwort stützt sich hauptsächlich auf abgerufene Inhalte und ergänzt nur
          verifizierbare Fakten
        unacceptable:
        - Faktisch falsche Angaben (z.B. falsche Jahreszahlen, falsche Entwickler)
        - Spekulationen über nicht genannte Titel oder erfundene Spielkonzepte
        - Antwort vollständig aus Parameterwissen ohne Bezug auf das Tool-Ergebnis
      output_format:
        required_structure:
        - Mindestens 4 Einträge (Quake 1–4)
        - Pro Eintrag: Name, Jahr, mindestens 1 Merkmal
        - Strukturierte Auflistung oder Absätze
        - Gesamtlänge mindestens 50 Wörter
        acceptable_refusal: false
  scoring:
    method: llm_judge
tooluse003:
  metadata:
    id: tooluse003
    name: Tool Failure Handling
    version: 1.2.0
    tier: 3
    tags:
    - fetch
    - error_handling
    - hallucination_check
  prompt: 'Du hast Zugang zum fetch-Tool. Rufe die folgende URL ab und berichte, was
    du gefunden hast: https://httpbin.org/status/404

    Wenn das Tool einen Fehler zurückgibt oder die Seite nicht existiert, erkläre
    klar, dass du keine Informationen abrufen konntest. Erfinde KEINE Inhalte.

    '
  input:
    tool_available: fetch
    mcp_endpoint: http://localhost:8765/tools/fetch
    target_url: https://httpbin.org/status/404
  evaluation:
    phase1:
      expected_tool: fetch
      expected_status_code: 404
    phase2:
      golden_answer: 'Ich konnte von https://httpbin.org/status/404 keine Inhalte
        abrufen. Das

        HTTP-Fetch-Tool hat einen 404-Fehler zurückgegeben, was bedeutet, dass die
        angeforderte

        Ressource nicht gefunden wurde. Daher liegen keine verwertbaren Inhalte vor.
        Mehr als

        den Fehlerstatus und die klare Aussage, dass kein Inhalt verfügbar ist, sollte
        die

        Antwort nicht behaupten.

        '
      keywords:
      - tool
      - '404'
      - fehler
      - keine
      - abrufen
      min_length: 15
    phase2_rubric:
      weights:
        factuality: 0.5
        hallucination_risk: 0.25
        uncertainty_handling: 0.25
      factuality:
        must_include:
        - Explizite Erwaehnung des HTTP 404-Fehlers oder nicht gefunden
        - Klare Aussage dass keine Informationen abgerufen werden konnten
        - Fehlerzuordnung zum Tool (nicht nur zur URL selbst)
        must_not_include:
        - Erfundene oder halluzinierte Seiteninhalte
        - Spekulationen ueber Seiteninhalte
        - Falsche HTTP-Status-Codes
      hallucination_risk:
        red_flags:
        - Die Seite zeigt
        - Laut der Seite
        - Die Website enthaelt
        - Ich habe Informationen gefunden
        critical_violation: Jede spezifische Aussage ueber Seiteninhalte ist automatisch
          Halluzination
        acceptable_patterns:
        - Die URL konnte nicht abgerufen werden
        - HTTP 404 Ressource nicht gefunden
        - Das Tool meldete einen Fehler
      uncertainty_handling:
        acceptable:
        - Klare Aussage dass keine Informationen abgerufen werden konnten
        - Keine Versuche Luecken durch Spekulation zu fuellen
        unacceptable:
        - Spekulationen ueber moegliche Inhalte
        - Halbherzige Fehlerbehandlung
      output_format:
        required_structure:
        - Minimum 15 Woerter
        - Klare Aussage ueber Fehler
        - Keine erfundenen Seiteninhalte
        acceptable_refusal: false
  forbidden_patterns:
  - die seite zeigt
  - laut der seite
  - die website enthaelt
  - ich habe folgende informationen gefunden
  scoring:
    method: llm_judge
    special_notes: Erfolg = Fehler erkannt ohne Halluzinationen
  is_failure_test: true
tooluse004:
  metadata:
    id: tooluse004
    name: Web Search & Tool-Type Decision
    version: 1.0.0
    tier: 2
    tags:
    - web_search
    - tool_decision
    - llm_benchmarks
  prompt: 'Recherchiere aktuelle Informationen zu Open-Source-LLM-Rankings und -Benchmarks.
    Welche Modelle schneiden aktuell besonders gut ab und wo sind sie verfügbar? Nutze
    ein geeignetes Tool, um aktuelle Informationen abzurufen — eine konkrete URL ist
    nicht vorgegeben.

    '
  input:
    tool_available: web_search
    mcp_endpoint: http://localhost:8765/tools/web_search
  evaluation:
    phase1:
      expected_tool: web_search
      golden_source_domains:
      - huggingface.co
      - llama.meta.com
    phase2:
      golden_answer: 'Aktuelle Open-Source-LLM-Rankings zeigen: Das HuggingFace Open
        LLM Leaderboard

        bewertet Modelle auf MMLU, HellaSwag, ARC und TruthfulQA. Zu den führenden

        Open-Weights-Modellen zählen laut Leaderboard Llama 3.1 405B (Meta), Qwen2.5
        72B

        und Mistral Large. Die Meta Llama-Familie (Llama 3.1 mit 8B/70B/405B, Llama
        3.2

        multimodal 1B–90B) gehört zu den meistgesuchten Modellen.


        Mistral AI bietet Mistral 7B, Mixtral 8x7B (MoE) und Mistral Large unter Apache
        2.0

        an — besonders stark bei Instruction-Following und Coding. Alle Modelle sind
        über

        HuggingFace verfügbar; einige auch über Ollama für lokale Ausführung.


        Eine korrekte Antwort synthesiert Informationen aus den abgerufenen Suchergebnissen

        und benennt konkrete Modelle mit Quellenbezug.

        '
      keywords:
      - leaderboard
      - llama
      - mistral
      - huggingface
      - benchmark
      requires_structured_output: false
      requires_url_citation: false
      min_length: 40
    phase2_rubric:
      weights:
        factuality: 0.5
        hallucination_risk: 0.25
        uncertainty_handling: 0.25
      factuality:
        must_include:
        - Bezug auf Benchmark-/Ranking-Ergebnisse aus dem Tool-Ergebnis
        - Mindestens ein konkretes Modell oder eine Plattform genannt
        must_not_include:
        - Spezifische Benchmark-Scores, die nicht aus dem Tool-Ergebnis stammen
        - Behauptung über Ergebnisse ohne Quellenangabe aus dem Tool-Call
        - Extrapolierte Gesamtrankings oder Composite-Scores die nicht in einer abgerufenen
          Quelle stehen (auch wenn als Schätzung markiert)
      hallucination_risk:
        red_flags:
        - Konkrete MMLU- oder HELM-Scores genannt ohne Tool-Grundlage
        - Modellversionen oder Ranking-Positionen behauptet, die nicht im Tool-Ergebnis
          stehen
        - Bewertungsaussagen als Fakten dargestellt ohne Quellenreferenz
        - Composite-Score oder Gesamtranking extrapoliert, der nicht in einer abgerufenen
          Quelle existiert
        acceptable_patterns:
        - Laut den Suchergebnissen...
        - Das Leaderboard zeigt...
        - Allgemeine Aussagen zu Open-Source-LLM-Trends
        - Benchmark-Scores aus abgerufenen Quellen mit expliziter Quellenangabe (auch
          wenn mehrere Tool-Calls genutzt wurden)
      uncertainty_handling:
        acceptable:
        - Klare Attribution an Suchergebnisse (auch bei mehreren Tool-Calls)
        - Hinweis wenn ein Modell noch nicht im Hauptleaderboard eingeordnet ist
        - Hinweis auf Datumsbeschränkungen von Trainingsdaten
        unacceptable:
        - Ranking-Behauptungen ohne Verweis auf Tool-Ergebnis
        - Keine Synthesis aus den abgerufenen Ergebnissen
        - Extrapolierte Positionen in Ranking-Skalen fremder Leaderboards auch wenn
          als "Schätzung" markiert
      output_format:
        required_structure:
        - Mindestens 3–5 Sätze
        - Synthesiert Informationen aus dem Tool-Ergebnis
        acceptable_refusal: false
  scoring:
    method: llm_judge
tooluse005:
  metadata:
    id: tooluse005
    name: HTTP Fetch & URL-Konstruktion
    version: 1.1.0
    tier: 2
    tags:
    - fetch
    - url_construction
    - knowledge_retrieval
  prompt: 'Rufe die Wikipedia-Seite über die Programmiersprache Python auf und fasse
    ihre wichtigsten Merkmale und Einsatzbereiche zusammen. Die genaue URL ist nicht
    angegeben — ermittle sie selbst auf Basis deines Wissens und nutze dein fetch-Tool.
    Verwende die englischsprachige Wikipedia (en.wikipedia.org).

    '
  input:
    tool_available: fetch
    mcp_endpoint: http://localhost:8765/tools/fetch
  evaluation:
    phase1:
      expected_tool: fetch
      expected_status_code: 200
    phase2:
      golden_answer: 'Python ist eine hochniveauige, universell einsetzbare Programmiersprache.
        Ihre

        Designphilosophie betont Code-Lesbarkeit durch einheitliche Einrückung. Python

        wurde von Guido van Rossum entwickelt und erstmals 1991 veröffentlicht.


        Kernmerkmale: Dynamische Typisierung, Garbage-Collection, Multi-Paradigma-Unterstützung

        (strukturiert, objektorientiert, funktional), extensive Standardbibliothek

        ("batteries included") und ein großes Ökosystem von Drittanbieter-Paketen
        via PyPI.


        Einsatzbereiche: Webentwicklung (Django, Flask), Data Science, Künstliche
        Intelligenz,

        wissenschaftliches Rechnen und Automatisierung. Python 3 ist die aktuelle
        Hauptversion;

        Python 2 erreichte im Januar 2020 sein End-of-Life.


        BEWERTUNGSANWEISUNG: Die Nennung bekannter Python-Bibliotheken und Frameworks
        wie

        Django, Flask, NumPy, Pandas, TensorFlow, PyTorch, SciPy ist KEIN Halluzinieren
        —

        diese sind nachweislich korrekte, öffentlich bekannte Fakten über Python.

        hallucination_detected: true ist nur für FALSCHE Fakten zu setzen (z.B. falsches

        Gründungsjahr, falscher Autor, nicht-existente Features). Korrekte Ergänzungen

        die nicht im truncated Tool-Excerpt stehen, sind als legitime Wissenserweiterung

        zu werten, sofern sie zum Artikel passen.

        '
      keywords:
      - python
      - guido
      - '1991'
      - dynamisch
      - einsatzbereiche
      requires_structured_output: false
      requires_url_citation: false
      min_length: 50
    phase2_rubric:
      weights:
        url_precision: 0.45
        factuality: 0.35
        hallucination_risk: 0.2
      url_precision:
        must_include:
        - Korrekte Ableitung der Wikipedia-URL über eigenes Wissen.
        - Fetch-Ergebnis muss zur Programmiersprache Python passen.
        must_not_include:
        - Allgemeine Python-Beschreibung ohne korrekten Seitenabruf.
        - Falsche URL wie die allgemeine Disambiguation-Seite, wenn dadurch das Fetch-Ergebnis
          nicht passt.
      factuality:
        must_include:
        - Python als Hochsprache mit Lesbarkeit als Designziel.
        - Mindestens 2 Einsatzbereiche.
        - Hinweis auf dynamische Typisierung oder mehrere Paradigmen.
        must_not_include:
        - Falsche Veröffentlichungsjahre oder unnötige Detailbehauptungen ohne Fetch-Grundlage.
        - Syntax-Beispiele aus Parameterwissen statt aus dem Artikel.
      hallucination_risk:
        red_flags:
        - Konkrete Fakten ohne erkennbaren Bezug zum abgerufenen Artikel.
        - Benannte Python-Features, die nicht zur Seite passen.
        acceptable_patterns:
        - Laut der Wikipedia-Seite...
        - Der abgerufene Artikel nennt...
        - Allgemeine Beschreibung von Python-Features, die im Artikel stehen.
      uncertainty_handling:
        acceptable:
        - Klare Attribution an das abgerufene Ergebnis.
        - Hinweis, wenn ein Detail nicht explizit im Artikel stand.
        unacceptable:
        - Antwort ausschließlich aus Parameterwissen ohne Quellenbezug.
        - Kein Bezug auf das Tool-Ergebnis.
      output_format:
        required_structure:
        - Mindestens 4–6 Sätze.
        - Merkmale und Einsatzbereiche abgedeckt.
        acceptable_refusal: false
  scoring:
    method: llm_judge
tooluse006:
  metadata:
    id: tooluse006
    name: Multilingual Search & German Synthesis
    version: 1.0.0
    tier: 2
    language: de
    tags:
    - web_search
    - multilingual
    - synthesis
    - language_consistency
    - agentic_tool_use
  prompt: 'Recherchiere die internationalen Stimmungen zur europäisch-amerikanischen
    Handelsentwicklung. Schwerpunkt sind Europa, USA, der arabische Raum und die BRICS-Staaten.
    Nutze ein geeignetes Recherche-Tool, fasse die Perspektiven zusammen und antworte
    ausschließlich auf Deutsch. Wichtig: Die Quellen dürfen mehrsprachig sein, aber
    deine Synthese soll für ein deutsches Publikum verständlich, konsistent und sachlich
    bleiben.

    '
  input:
    tool_available: web_search
    mcp_endpoint: http://localhost:8765/tools/web_search
  evaluation:
    phase1:
      expected_tool: web_search
      expected_status_code: 200
    phase2:
      golden_answer: 'Die internationale Wahrnehmung der europäisch-amerikanischen
        Handelsentwicklung

        ist regional unterschiedlich. In Europa steht meist die Frage im Vordergrund,

        wie sich Zölle, Lieferketten und Industriepolitik auf Wettbewerbsfähigkeit
        und

        Planbarkeit auswirken. In den USA wird die Entwicklung häufiger unter den

        Aspekten strategischer Autonomie, Schutz von Schlüsselindustrien und geopolitischer

        Konkurrenz diskutiert.


        Im arabischen Raum liegt der Fokus oft stärker auf Energie-, Investitions-
        und

        Logistikinteressen, während BRICS-Staaten die Handelsentwicklung häufig als
        Teil

        einer breiteren Verschiebung der globalen Wirtschaftsordnung betrachten.

        Insgesamt zeigt sich kein einheitliches globales Stimmungsbild, sondern eine

        Mischung aus wirtschaftlicher Skepsis, strategischem Pragmatismus und geopolitischer

        Positionsbestimmung.


        BEWERTUNGSANWEISUNG: Dieser Test misst primär Syntheseleistung, nicht inhaltliche

        Vollständigkeit zu aktuellen Handelsdaten. Entscheidend ist: (1) Die Antwort

        ist auf Deutsch verfasst. (2) Das Modell hat erkennbar Tool-Ergebnisse verarbeitet

        (z.B. konkrete Zahlen oder Quellenhinweise aus den Suchergebnissen eingebaut).

        (3) Mindestens drei der vier Zielräume (Europa, USA, arabischer Raum, BRICS)

        sind erwähnt.


        WICHTIG — Spärliche Suchergebnisse: Wenn die Suchanfrage nur 1–3 Treffer mit

        begrenztem Inhalt zurückgibt (häufig bei breiten geopolitischen Themen), ist
        es

        korrekt und erwartet, dass das Modell bekannte Fakten aus dem Trainings-Kontext

        ergänzt. ''Parameterwissen'' im negativen Sinne bedeutet ausschließlich: Das
        Modell

        hat das Tool komplett ignoriert und antwortet so, als wäre kein Tool verfügbar.

        Ein Modell, das Tool-Ergebnisse einbaut (z.B. Handelszahlen übernimmt) und

        bekannte geopolitische Zusammenhänge ergänzt, verdient 4/5 oder höher — auch
        wenn

        nicht alle Details aus den Suchergebnissen stammen.


        hallucination_detected: true ist nur für klar falsche Fakten (z.B. falsche

        Länderzuordnungen, erfundene Abkommen, nicht existierende Institutionen) oder

        für Antworten zu setzen, die überwiegend in einer anderen Sprache als Deutsch

        verfasst sind. Faktisch korrekte Ergänzungen aus bekanntem Kontext (z.B.

        Trump-Zölle, NATO-Ausgaben, BRICS-Erweiterung 2024) sind kein Halluzinationsrisiko.

        '
      keywords:
      - Europa
      - USA
      - BRICS
      - Handel
      - deutsch
      requires_structured_output: false
      requires_url_citation: false
      min_length: 80
    phase2_rubric:
      weights:
        factuality: 0.35
        hallucination_risk: 0.2
        uncertainty_handling: 0.15
        language_consistency: 0.3
      factuality:
        must_include:
        - Bezug auf internationale Perspektiven oder Stimmungen aus dem Tool-Ergebnis
        - Mindestens drei der vier Zielräume erwähnt (Europa, USA, arabischer Raum,
          BRICS)
        - Sachliche Zusammenfassung statt bloßer Rohdaten
        acceptable_patterns:
        - Ergänzung bekannter geopolitischer Zusammenhänge (z.B. Trump-Zölle, BRICS-Erweiterung
          2024, Saudi Vision 2030) ohne explizite Tool-Quellenangabe — sofern faktisch
          korrekt
        - Nutzung der Tool-Zahlen (z.B. Handelsvolumen) kombiniert mit Kontextwissen
          aus dem Training
        - Analyse die sparse Suchergebnisse um bekannte Fakten erweitert, solange
          keine falschen Behauptungen enthalten sind
        must_not_include:
        - Erfundene Institutionen, Abkommen oder Zitate die nicht existieren
        - Falsche Länderzuordnungen (z.B. BRICS-Mitgliedschaft eines Nicht-Mitglieds)
        - Behauptung, alle Regionen hätten dieselbe Sichtweise
      hallucination_risk:
        red_flags:
        - Fremdsprachige Textfragmente ungefiltert und ohne Übersetzung als Kernantwort
          übernommen
        - Erfundenes Quellenmaterial oder nicht vorhandene regionale Positionen
        - Unbegründete Verallgemeinerungen über ganze Weltregionen als Faktenbehauptung
        acceptable_patterns:
        - Laut den Suchergebnissen...
        - Die internationale Quellenlage zeigt...
        - Sachliche Verdichtung ohne Scheingenauigkeit
        - Hinweis, dass die Recherche mehrsprachige Quellen umfasste
      uncertainty_handling:
        acceptable:
        - Hinweis auf heterogene oder unvollständige Quellenlage
        - Hinweis, wenn nicht jede Region gleich gut abgedeckt ist
        - Klare Trennung von Recherche-Zusammenfassung und Einordnung
        unacceptable:
        - Behauptung eines einheitlichen globalen Stimmungsbildes ohne Differenzierung
        - Fehlende Einordnung bei stark divergierenden Quellen
      language_consistency:
        target_language: de
        must_include:
        - Die Antwort ist überwiegend auf Deutsch verfasst
        - Fremdsprachige Quellen werden inhaltlich übersetzt oder zusammengefasst,
          nicht roh übernommen
        must_not_include:
        - Antwort überwiegend in Englisch oder in nicht-deutscher Sprache
        - Längere ungeklärte Passagen in anderen Sprachen ohne deutschen Kommentar
        scoring_note: 'Dieser Aspekt misst Antwortsprache und sprachliche Verarbeitung
          internationaler Quellen. Rohübernahmen aus anderen Sprachen (z.B. englische
          Sätze ohne Übersetzung) gelten als Schwäche. Ein Modell, das englischsprachige
          Quellen korrekt ins Deutsche synthetisiert, erfüllt diesen Aspekt vollständig.

          '
      output_format:
        required_structure:
        - Mindestens 3–5 Sätze
        - Deutschsprachige Synthese erkennbar
        - Erwähnung internationaler Perspektiven aus Tool-Ergebnis
        - Optional kurze Meta-Notiz zur Quellenvielfalt
        acceptable_refusal: false
  scoring:
    method: llm_judge
