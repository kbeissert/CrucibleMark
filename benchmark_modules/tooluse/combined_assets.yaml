# ============================================================
# tooluse001 — Websearch Research
# ============================================================
# Testet: Web-Such-Tool aufrufen, Ergebnis synthetisieren,
# Quellenangabe im Output (EU Lizenzbedingungen Meta Llama).
# ============================================================

metadata:
  id: tooluse001
  name: "EU Lizenzrecherche Meta Llama"
  version: "1.2.0"
  tier: 2
  tags:
    - web_search
    - synthesis
    - provenance

prompt: >
  Du hast Zugang zu einem Web-Such-Tool. Nutze es, um aktuelle Informationen
  über die Nutzungsbeschränkungen der Meta Llama-Modelle in der EU zu finden.
  Fasse die wichtigsten Punkte in 3–5 Sätzen zusammen und gib mindestens
  eine konkrete Quelle (URL) an.

input:
  tool_available: web_search
  mcp_endpoint: "http://localhost:8765/tools/web_search"
  suggested_query: "Meta Llama EU usage restrictions license 2024"

evaluation:
  phase1:
    expected_tool: web_search
    golden_source_domains:
      - llama.meta.com
      - huggingface.co
      - ai.meta.com
      - llama.com

  phase2:
    golden_answer: |
      Meta beschränkt die Freigabe seiner multimodalen Llama-Modelle für Personen und
      Unternehmen mit Sitz in der EU. Die Einschränkung wird in den Lizenz- bzw.
      Nutzungsbedingungen begründet und steht im Zusammenhang mit regulatorischen
      Unsicherheiten, insbesondere beim Datenschutz und bei der rechtssicheren Verwendung
      von Trainingsdaten. Außerhalb der EU kann der Einsatz solcher Modelle unter Beachtung
      der jeweiligen Lizenzbedingungen möglich sein. Für eine korrekte Bewertung muss zwischen
      textbasierten Modellen wie Llama 3.1/3.2 und multimodalen Varianten wie Llama 4 bzw.
      Llama 3.2 Vision unterschieden werden.
    keywords:
      - "llama"
      - "eu"
      - "multimodal"
      - "lizenz"
      - "quelle"
    requires_url_citation: true
    min_length: 30

  phase2_rubric:
    weights:
      factuality: 0.5
      hallucination_risk: 0.25
      uncertainty_handling: 0.25

    factuality:
      must_include:
        - EU-spezifische Einschränkung für multimodale Modelle (nicht alle Llama-Modelle pauschal)
        - Regulatorische Begründung (Datenschutz, Trainingsdaten, EU-Rahmen)
        - Hinweis auf Nicht-EU-Nutzung unter Lizenzbedingungen
        - Quellenangabe (URL oder Domain)
        - Unterscheidung zwischen textbasierten (Llama 3.1/3.2) und multimodalen Varianten (Llama 4, Vision)
      must_not_include:
        - Pauschale Behauptung alle Llama-Modelle seien in der EU gesperrt
        - Erfundene Policy-Details
        - Veraltete Llama-Versionen als aktuell dargestellt

    hallucination_risk:
      red_flags:
        - Vage Quellenangaben ("ich habe gelesen, dass...")
        - Policy-Details nicht auf genannten Quellen zu finden
        - Erfundene Domänen oder Modellnamen
      acceptable_patterns:
        - "Laut den offiziellen Llama-FAQ..."
        - "Meta begründet die Einschränkung mit..."

    uncertainty_handling:
      acceptable:
        - Distanzierung von spekulativen Aussagen
        - Hinweis auf mögliche Änderungen oder neuere Policy-Versionen
        - Klarstellung welche Modelle betroffen sind (multimodal vs. textbasiert)
      unacceptable:
        - Spekulation als Fakt präsentiert
        - Gleichmacherei von sicheren und unsicheren Details
        - Pauschalaussage ohne Differenzierung zwischen Modelltypen

    output_format:
      required_structure:
        - Mindestens 3–5 Sätze
        - Mindestens eine Quelle genannt
        - EU vs. Nicht-EU-Nutzung unterschieden
        - Textbasiert vs. multimodal unterschieden
      acceptable_refusal: true

scoring:
  method: llm_judge

---
# ============================================================
# tooluse002 — HTTP Fetch & Extract
# ============================================================
# Testet: HTTP-Fetch-Tool aufrufen, Seite lesen, relevante
# Informationen extrahieren und strukturiert ausgeben.
# ============================================================

metadata:
  id: tooluse002
  name: "HTTP Fetch & Extract"
  version: "1.3.0"
  tier: 2
  tags:
    - http_fetch
    - extraction
    - structured_output

prompt: >
  Du hast Zugang zu einem HTTP-Fetch-Tool. Rufe die Seite
  https://huggingface.co/meta-llama auf und extrahiere die
  wichtigsten verfügbaren Modelle. Liste mindestens 3 Modellnamen
  auf und erkläre kurz, wozu sie eingesetzt werden.

input:
  tool_available: http_fetch
  mcp_endpoint: "http://localhost:8765/tools/http_fetch"
  target_url: "https://huggingface.co/meta-llama"

evaluation:
  phase1:
    expected_tool: http_fetch
    expected_status_code: 200

  phase2:
    golden_answer: |
      Auf der Hugging-Face-Organisation von Meta Llama sind mehrere Modellfamilien sichtbar.
      Am prominentesten gelistet sind aktuell Llama 4 Scout und Llama 4 Maverick als
      multimodale Bild-Text-Modelle mit Mixture-of-Experts-Architektur. Daneben sind
      ältere Serien wie Llama 3.3 (70B), Llama 3.2 und Llama 3.1 gelistet. Llama Guard
      dient als Sicherheitsmodell für Inhaltsfilterung. Die Modelle erfordern eine
      Registrierung und Lizenzzustimmung bei Meta. Die Antwort sollte sich klar an der
      abgerufenen Seite orientieren und nicht nur allgemeines Vorwissen reproduzieren.
    keywords:
      - "llama 4"
      - "scout"
      - "llama guard"
      - "hugging"
    requires_structured_output: true
    min_length: 40

  phase2_rubric:
    weights:
      factuality: 0.5
      hallucination_risk: 0.25
      uncertainty_handling: 0.25

    factuality:
      must_include:
        - Mindestens 3 verschiedene reale Modellfamilien von der Seite
        - Fuer jede Familie korrekte Zweckbeschreibung
        - Seitengebundene Nennung (nicht nur allgemeines Llama-Vorwissen)
      must_not_include:
        - Nicht existierende Modellvarianten
        - Erfundene Modellnamen
        - Falsche Use-Case-Zuordnungen
        - Modelle die nicht zu Meta Llama gehören (GPT, BERT, T5 etc.)

    hallucination_risk:
      red_flags:
        - Modellnamen nicht auf huggingface.co/meta-llama vorhanden
        - Spezifika die nicht auf der Seite stehen (z.B. falsche Parameterzahlen)
        - Nicht-Llama-Modelle als Ergebnis genannt
      acceptable_patterns:
        - "Laut der HuggingFace-Seite..."
        - "Die Seite listet..."

    uncertainty_handling:
      acceptable:
        - Basierend auf meinem Zugriff klare Attribution
        - Distanzierung von vermuteten Modellen
      unacceptable:
        - Erfundene Modelle als auf der Seite existent
        - Spekulationen ohne Kennzeichnung
        - Allgemeines Vorwissen als Seiteninhalt ausgeben

    output_format:
      required_structure:
        - Mindestens 3 konkrete Modellfamilien
        - Fuer jeden Namen und Use-Case mindestens 1 Satz
        - Gesamtlaenge mindestens 40 Woerter
      acceptable_refusal: false

scoring:
  method: llm_judge

---
# ============================================================
# tooluse003 — Tool Failure Handling (404 Simulation)
# ============================================================
# Testet: Korrekte Fehlerbehandlung bei HTTP 404.
# Modell soll Fehler erkennen, NICHT halluzinieren.
# is_failure_test: true — Erfolg = keine Halluzination.
# ============================================================

metadata:
  id: tooluse003
  name: "Tool Failure Handling"
  version: "1.2.0"
  tier: 3
  tags:
    - http_fetch
    - error_handling
    - hallucination_check

prompt: >
  Du hast Zugang zu einem HTTP-Fetch-Tool. Rufe die folgende URL ab und
  berichte, was du gefunden hast:
  https://httpbin.org/status/404

  Wenn das Tool einen Fehler zurückgibt oder die Seite nicht existiert,
  erkläre klar, dass du keine Informationen abrufen konntest.
  Erfinde KEINE Inhalte.

input:
  tool_available: http_fetch
  mcp_endpoint: "http://localhost:8765/tools/http_fetch"
  target_url: "https://httpbin.org/status/404"

evaluation:
  phase1:
    expected_tool: http_fetch
    expected_status_code: 404

  phase2:
    golden_answer: |
      Ich konnte von https://httpbin.org/status/404 keine Inhalte abrufen. Das
      HTTP-Fetch-Tool hat einen 404-Fehler zurückgegeben, was bedeutet, dass die angeforderte
      Ressource nicht gefunden wurde. Daher liegen keine verwertbaren Inhalte vor. Mehr als
      den Fehlerstatus und die klare Aussage, dass kein Inhalt verfügbar ist, sollte die
      Antwort nicht behaupten.
    keywords:
      - "tool"
      - "404"
      - "fehler"
      - "keine"
      - "abrufen"
    min_length: 15

  phase2_rubric:
    weights:
      factuality: 0.5
      hallucination_risk: 0.25
      uncertainty_handling: 0.25

    factuality:
      must_include:
        - Explizite Erwaehnung des HTTP 404-Fehlers oder nicht gefunden
        - Klare Aussage dass keine Informationen abgerufen werden konnten
        - Fehlerzuordnung zum Tool (nicht nur zur URL selbst)
      must_not_include:
        - Erfundene oder halluzinierte Seiteninhalte
        - Spekulationen ueber Seiteninhalte
        - Falsche HTTP-Status-Codes

    hallucination_risk:
      red_flags:
        - Die Seite zeigt
        - Laut der Seite
        - Die Website enthaelt
        - Ich habe Informationen gefunden
      critical_violation: Jede spezifische Aussage ueber Seiteninhalte ist automatisch Halluzination
      acceptable_patterns:
        - Die URL konnte nicht abgerufen werden
        - HTTP 404 Ressource nicht gefunden
        - Das Tool meldete einen Fehler

    uncertainty_handling:
      acceptable:
        - Klare Aussage dass keine Informationen abgerufen werden konnten
        - Keine Versuche Luecken durch Spekulation zu fuellen
      unacceptable:
        - Spekulationen ueber moegliche Inhalte
        - Halbherzige Fehlerbehandlung
        - Uebererklarungen die ueber Fehlerstatus hinausgehen

    output_format:
      required_structure:
        - Minimum 15 Woerter
        - Klare Aussage ueber Fehler
        - Keine erfundenen Seiteninhalte
        - Keine Ueberspezifikation jenseits des Fehlerstatus
      acceptable_refusal: false

forbidden_patterns:
  - "die seite zeigt"
  - "laut der seite"
  - "die website enthaelt"
  - "ich habe folgende informationen gefunden"

scoring:
  method: llm_judge
  special_notes: Erfolg = Fehler erkannt ohne Halluzinationen

is_failure_test: true
