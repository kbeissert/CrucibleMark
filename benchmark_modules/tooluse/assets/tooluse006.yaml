# ============================================================
# tooluse006 — Multilingual Search & German Synthesis
# ============================================================
# Ziel: Prüft, ob das Modell internationale Quellen
# sprachübergreifend recherchiert und die Ergebnisse konsistent
# auf Deutsch synthetisiert.
#
# Spread-Achsen:
# - Antwortsprache (Deutsch vs. Sprachmix / Rohübernahmen)
# - Cross-lingual synthesis (werden mehrere Sprachräume verarbeitet?)
# - Quelle-zu-Output-Kohärenz (wird das Tool-Ergebnis genutzt oder ignoriert?)
# ============================================================

metadata:
  id: tooluse006
  name: "Multilingual Search & German Synthesis"
  version: "1.0.0"
  tier: 2
  language: de
  tags:
    - web_search
    - multilingual
    - synthesis
    - language_consistency
    - agentic_tool_use

prompt: >
  Recherchiere die internationalen Stimmungen zur europäisch-amerikanischen
  Handelsentwicklung. Schwerpunkt sind Europa, USA, der arabische Raum und die
  BRICS-Staaten.
  Nutze ein geeignetes Recherche-Tool, fasse die Perspektiven zusammen und antworte
  ausschließlich auf Deutsch.
  Wichtig: Die Quellen dürfen mehrsprachig sein, aber deine Synthese soll für ein
  deutsches Publikum verständlich, konsistent und sachlich bleiben.

input:
  tool_available: web_search
  mcp_endpoint: "http://localhost:8765/tools/web_search"

evaluation:
  phase1:
    expected_tool: web_search
    expected_status_code: 200

  phase2:
    golden_answer: |
      Die internationale Wahrnehmung der europäisch-amerikanischen Handelsentwicklung
      ist regional unterschiedlich. In Europa steht meist die Frage im Vordergrund,
      wie sich Zölle, Lieferketten und Industriepolitik auf Wettbewerbsfähigkeit und
      Planbarkeit auswirken. In den USA wird die Entwicklung häufiger unter den
      Aspekten strategischer Autonomie, Schutz von Schlüsselindustrien und geopolitischer
      Konkurrenz diskutiert.

      Im arabischen Raum liegt der Fokus oft stärker auf Energie-, Investitions- und
      Logistikinteressen, während BRICS-Staaten die Handelsentwicklung häufig als Teil
      einer breiteren Verschiebung der globalen Wirtschaftsordnung betrachten.
      Insgesamt zeigt sich kein einheitliches globales Stimmungsbild, sondern eine
      Mischung aus wirtschaftlicher Skepsis, strategischem Pragmatismus und geopolitischer
      Positionsbestimmung.

      BEWERTUNGSANWEISUNG: Dieser Test misst primär Syntheseleistung, nicht inhaltliche
      Vollständigkeit zu aktuellen Handelsdaten. Entscheidend ist: (1) Die Antwort
      ist auf Deutsch verfasst. (2) Das Modell hat erkennbar Tool-Ergebnisse verarbeitet
      (z.B. konkrete Zahlen oder Quellenhinweise aus den Suchergebnissen eingebaut).
      (3) Mindestens drei der vier Zielräume (Europa, USA, arabischer Raum, BRICS)
      sind erwähnt.

      WICHTIG — Spärliche Suchergebnisse: Wenn die Suchanfrage nur 1–3 Treffer mit
      begrenztem Inhalt zurückgibt (häufig bei breiten geopolitischen Themen), ist es
      korrekt und erwartet, dass das Modell bekannte Fakten aus dem Trainings-Kontext
      ergänzt. 'Parameterwissen' im negativen Sinne bedeutet ausschließlich: Das Modell
      hat das Tool komplett ignoriert und antwortet so, als wäre kein Tool verfügbar.
      Ein Modell, das Tool-Ergebnisse einbaut (z.B. Handelszahlen übernimmt) und
      bekannte geopolitische Zusammenhänge ergänzt, verdient 4/5 oder höher — auch wenn
      nicht alle Details aus den Suchergebnissen stammen.

      hallucination_detected: true ist nur für klar falsche Fakten (z.B. falsche
      Länderzuordnungen, erfundene Abkommen, nicht existierende Institutionen) oder
      für Antworten zu setzen, die überwiegend in einer anderen Sprache als Deutsch
      verfasst sind. Faktisch korrekte Ergänzungen aus bekanntem Kontext (z.B.
      Trump-Zölle, NATO-Ausgaben, BRICS-Erweiterung 2024) sind kein Halluzinationsrisiko.

    keywords:
      - "Europa"
      - "USA"
      - "BRICS"
      - "Handel"
      - "deutsch"
    requires_structured_output: false
    requires_url_citation: false
    min_length: 80

  phase2_rubric:
    weights:
      factuality: 0.35
      hallucination_risk: 0.20
      uncertainty_handling: 0.15
      language_consistency: 0.30

    factuality:
      must_include:
        - Bezug auf internationale Perspektiven oder Stimmungen aus dem Tool-Ergebnis
        - Mindestens drei der vier Zielräume erwähnt (Europa, USA, arabischer Raum, BRICS)
        - Sachliche Zusammenfassung statt bloßer Rohdaten
      acceptable_patterns:
        - Ergänzung bekannter geopolitischer Zusammenhänge (z.B. Trump-Zölle, BRICS-Erweiterung 2024, Saudi Vision 2030) ohne explizite Tool-Quellenangabe — sofern faktisch korrekt
        - Nutzung der Tool-Zahlen (z.B. Handelsvolumen) kombiniert mit Kontextwissen aus dem Training
        - Analyse die sparse Suchergebnisse um bekannte Fakten erweitert, solange keine falschen Behauptungen enthalten sind
      must_not_include:
        - Erfundene Institutionen, Abkommen oder Zitate die nicht existieren
        - Falsche Länderzuordnungen (z.B. BRICS-Mitgliedschaft eines Nicht-Mitglieds)
        - Behauptung, alle Regionen hätten dieselbe Sichtweise

    hallucination_risk:
      red_flags:
        - Fremdsprachige Textfragmente ungefiltert und ohne Übersetzung als Kernantwort übernommen
        - Erfundenes Quellenmaterial oder nicht vorhandene regionale Positionen
        - Unbegründete Verallgemeinerungen über ganze Weltregionen als Faktenbehauptung
      acceptable_patterns:
        - "Laut den Suchergebnissen..."
        - "Die internationale Quellenlage zeigt..."
        - Sachliche Verdichtung ohne Scheingenauigkeit
        - Hinweis, dass die Recherche mehrsprachige Quellen umfasste

    uncertainty_handling:
      acceptable:
        - Hinweis auf heterogene oder unvollständige Quellenlage
        - Hinweis, wenn nicht jede Region gleich gut abgedeckt ist
        - Klare Trennung von Recherche-Zusammenfassung und Einordnung
      unacceptable:
        - Behauptung eines einheitlichen globalen Stimmungsbildes ohne Differenzierung
        - Fehlende Einordnung bei stark divergierenden Quellen

    language_consistency:
      target_language: "de"
      must_include:
        - Die Antwort ist überwiegend auf Deutsch verfasst
        - Fremdsprachige Quellen werden inhaltlich übersetzt oder zusammengefasst, nicht roh übernommen
      must_not_include:
        - Antwort überwiegend in Englisch oder in nicht-deutscher Sprache
        - Längere ungeklärte Passagen in anderen Sprachen ohne deutschen Kommentar
      scoring_note: >
        Dieser Aspekt misst Antwortsprache und sprachliche Verarbeitung internationaler
        Quellen. Rohübernahmen aus anderen Sprachen (z.B. englische Sätze ohne Übersetzung)
        gelten als Schwäche. Ein Modell, das englischsprachige Quellen korrekt ins Deutsche
        synthetisiert, erfüllt diesen Aspekt vollständig.

    output_format:
      required_structure:
        - Mindestens 3–5 Sätze
        - Deutschsprachige Synthese erkennbar
        - Erwähnung internationaler Perspektiven aus Tool-Ergebnis
        - Optional kurze Meta-Notiz zur Quellenvielfalt
      acceptable_refusal: false

scoring:
  method: llm_judge
