# ============================================================
# tooluse — Modul-Konfiguration (SSOT)
# ============================================================
# Vollwertiges Scoring-Modul (v5.0) — combined_score fließt als percentage in Total Score ein.

# ================================
# GLOBAL METADATA
# ================================
metadata:
  id: tooluse
  name: "Tool Use & Assistenz"
  version: "1.3.0"
  description: >
    Testet, wie zuverlässig ein Modell externe Tools (Web-Suche, HTTP-Fetch)
    via MCP nutzt. Bewertet Tool-Kompetenz (Phase 1) und Synthesequalität
    (Phase 2) getrennt. Vollwertiges Scoring-Modul (v5.0) — combined_score
    fließt als percentage in den Total Score ein.
  author: "CrucibleMark"
  tags:
    - tool-use
    - mcp
    - web-search
    - http-fetch
    - hallucination-check

# ================================
# INTEGRATION: Leaderboard Behavior
# ================================
integration:
  leaderboard:
    enable_scoring: true              # Vollwertiges Scoring-Modul (v5.0)
    module_weight: 1.0
    default_contribution:            # Neutraler Split: combined_score enthält p1/p2-Gewichtung bereits intern
      routine: 0.5
      reasoning: 0.5
    capability_field: supports_tool_use  # Model-Card-Feld für incapable-Erkennung (v5.0 Coverage-Logik)
    custom_csv: tooluse_leaderboard.csv
    columns:
      - id: p1_score
        label: "Tool Execution"
        source:
          file: "tooluse_leaderboard.csv"
          value_template: "{p1_score}"
          missing_value: "–"
          not_capable_value: "n/a"
          not_capable_card_key: "supports_tool_use"
      - id: p2_score
        label: "Synthesis Quality"
        source:
          file: "tooluse_leaderboard.csv"
          value_template: "{p2_score}"
          missing_value: "–"
          not_capable_value: "n/a"
          not_capable_card_key: "supports_tool_use"
      - id: combined_score
        label: "ToolUse Score"
        source:
          file: "tooluse_leaderboard.csv"
          value_template: "{combined_score}"
          missing_value: "–"
          not_capable_value: "n/a"
          not_capable_card_key: "supports_tool_use"

# ================================
# EXECUTION: Test Runner Settings
# ================================
execution:
  test_class: ToolUseTest
  execution_mode: standard
  assets_dir: assets
  requires_mcp: true              # Informational: MCP-Server wird vom Delegate-Script verwaltet
  mcp_health_url: "http://localhost:8765/health"
  skip_if_card_false: "supports_tool_use"  # benchmark-auto überspringt Modelle mit supports_tool_use: false
  delegate_script: "scripts/run_tooluse_benchmark.py"  # benchmark-auto delegiert an dieses Script

# ================================
# SCORING-GEWICHTE (gelesen von evaluators.py via constants.py)
# ================================
config:
  phase1_weight: 0.5
  phase2_weight: 0.5
  hallucination_penalty: 100      # Hard fail bei erfundenem Inhalt nach 404
  tool_call_bonus: 10             # Bonus für korrekte Quellenangabe im Output
  semantic_threshold: 0.72        # Min. semantische Ähnlichkeit für Phase 2
  keyword_threshold: 0.4
  parse_retry_penalty: 5          # P1 Abzug wenn parse_attempts >= 2
  # P2 component weight defaults (overridden per-asset by phase2_rubric.weights in asset YAML)
  p2_weight_factuality: 0.50      # → semantic similarity component
  p2_weight_hallucination_risk: 0.30  # → keyword coverage component
  p2_weight_uncertainty_handling: 0.20  # → structural requirements component

# ================================
# BENCHMARKS: Asset-Registry
# ================================
benchmarks:
  - id: tooluse001
    name: "Llama 4 EU License Research (Honeypot)"
    tier: 2
    tool_type: web_search
    phase1_weight: 0.40   # EU-Regulierung: Synthesequalität wichtiger als Tool-Execution
    phase2_weight: 0.60
    future_expansion: null

  - id: tooluse002
    name: "HTTP Fetch & Extract"
    tier: 2
    tool_type: fetch
    phase1_weight: 0.50
    phase2_weight: 0.50
    future_expansion: null

  - id: tooluse003
    name: "Tool Failure Handling"
    tier: 3
    tool_type: fetch
    is_failure_test: true         # 404-Simulation — kein Scoring-Abzug
    phase1_weight: 0.65   # 404-Failure: Tool-Execution-Robustheit ist Kerntest
    phase2_weight: 0.35
    future_expansion: null

  - id: tooluse004
    name: "Tool Selection (web_search)"
    tier: 2
    tool_type: web_search
    phase1_weight: 0.55   # Tool-Entscheidung (web_search vs fetch) im Fokus
    phase2_weight: 0.45
    future_expansion: null

  - id: tooluse005
    name: "URL Construction (fetch)"
    tier: 2
    tool_type: fetch
    phase1_weight: 0.50
    phase2_weight: 0.50
    future_expansion: null

  - id: tooluse006
    name: "Multilingual Search & German Synthesis"
    tier: 2
    tool_type: web_search
    language: de
    phase1_weight: 0.50
    phase2_weight: 0.50
    future_expansion: null
