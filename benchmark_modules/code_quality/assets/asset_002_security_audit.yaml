# ============================================================
# Test-Kontext und Aufgabenstellung
# ============================================================

context: |
  Du bist ein Senior Security Engineer. Du führst ein Code-Audit für eine Legacy-PHP-Anwendung durch.
  Der Code enthält offensichtliche Fehler (teilweise von Junior-Devs kommentiert), aber auch subtile
  Sicherheitslücken, die nicht markiert sind.

prompt: |
  Analysiere den folgenden PHP-Code auf **Security-Vulnerabilities**.
  
  Der Code enthält drei Kategorien von Fehlern:
  1. **Markierte Issues**: Bereits identifizierte Probleme (bestätige diese).
  2. **Offensichtliche Issues**: Standard OWASP-Fehler ohne Markierung.
  3. **Subtile Issues**: Logikfehler oder sprachspezifische Schwachstellen (PHP).

  ## Deine Aufgabe
  Finde und erkläre **ALLE** Sicherheitslücken. Priorisiere sie nach Schweregrad (Critical/High/Medium).

  **PHP-Code:**
  ```php
  <?php
  // Legacy User System v1.0
  // Debugging enabled for dev (TODO: disable in prod)
  error_reporting(E_ALL);
  ini_set('display_errors', 1);
  
  $db = mysqli_connect("localhost", "root", "", "users_db");

  // === LOGIN HANDLER ===
  if ($_SERVER['REQUEST_METHOD'] === 'POST' && isset($_POST['login'])) {
      $username = $_POST['username'];
      $password = $_POST['password'];
      
      // ISSUE 1: SQL Injection Vulnerability
      $query = "SELECT * FROM users WHERE username='$username' AND password='$password'";
      $result = mysqli_query($db, $query);
      
      // ISSUE 2: Password stored in plain text
      if ($row = mysqli_fetch_assoc($result)) {
          // Login successful
          session_start();
          $_SESSION['user_id'] = $row['id'];
          $_SESSION['role'] = $row['role'];
          
          // Set "Remember Me" cookie
          setcookie('auth_user', $username, time() + 86400 * 30);
          
          echo "<h1>Welcome back, " . $username . "!</h1>";
          
          // Redirect to dashboard
          header("Location: /dashboard.php?uid=" . $row['id']);
      } else {
          echo "Invalid username or password";
      }
  }
  
  // === PASSWORD RESET ===
  if (isset($_POST['reset_request'])) {
      $email = $_POST['email'];
      // Generate reset token
      $token = md5(time() . rand());
      
      $sql = "UPDATE users SET reset_token='$token' WHERE email='$email'";
      mysqli_query($db, $sql);
      
      mail($email, "Password Reset", "Your token: $token");
  }
  
  // === API AUTHENTICATION ===
  function checkApiAccess($request_data) {
      $secret_key = "s8sk_api_2024";
      
      // Validate API Key
      if (isset($request_data['api_key'])) {
          // Loose comparison to allow flexible input types
          if ($request_data['api_key'] == $secret_key) {
              return true;
          }
      }
      return false;
  }

  // === FILE MANAGER ===
  if (isset($_GET['view_file'])) {
      $file = $_GET['view_file'];
      // Prevent accessing system files
      if (strpos($file, 'config.php') === false) {
          $path = 'user_files/' . $file;
          if (file_exists($path)) {
              readfile($path);
          }
      }
  }
  
  // === ADMIN ACTION ===
  if (isset($_POST['delete_user'])) {
      // Only admin can delete
      if ($_COOKIE['admin_flag'] == 1) {
          $uid = $_POST['uid'];
          mysqli_query($db, "DELETE FROM users WHERE id=$uid");
          echo "User deleted.";
      }
  }
  
  // === PROFILE UPDATE ===
  // Allow users to update their email
  if (isset($_POST['update_profile'])) {
      $new_email = $_POST['email'];
      $user_id = $_POST['user_id']; // Hidden field from form
      
      // Update email
      $stmt = mysqli_prepare($db, "UPDATE users SET email=? WHERE id=?");
      mysqli_stmt_bind_param($stmt, "si", $new_email, $user_id);
      mysqli_stmt_execute($stmt);
      
      echo "Profile updated!";
  }
  ?>
  ```

  ### Anforderungen an die Antwort:
  1. Liste alle gefundenen Vulnerabilities auf.
  2. Gib für jede Vulnerability an:
     - **Typ** (z.B. SQL Injection)
     - **Schweregrad**
     - **Warum** es unsicher ist
     - **Fix** (Code-Beispiel)

# ============================================================
# Test-Daten (Issues zum Erkennen)
# ============================================================

test_data:
  issues:
    # --- LEVEL 1: Labeled (Easy) ---
    - issue: "SQL Injection (Login)"
      severity: "critical"
      type: "labeled"
      explanation: "Explizit markierte SQL Injection im Login."
    
    - issue: "Plaintext Passwords"
      severity: "critical"
      type: "labeled"
      explanation: "Explizit markierte fehlende Passwort-Hashes."

    # --- LEVEL 2: Unlabeled Standard (Medium) ---
    - issue: "XSS (Welcome Message)"
      severity: "high"
      type: "standard"
      explanation: "Unescaped echo output ($username)."
    
    - issue: "Session Fixation"
      severity: "high"
      type: "standard"
      explanation: "Kein session_regenerate_id() nach Login."
      
    - issue: "Insecure Cookie"
      severity: "medium"
      type: "standard"
      explanation: "Cookie ohne HttpOnly/Secure Flags."

    - issue: "Path Traversal"
      severity: "critical"
      type: "standard"
      explanation: "strpos check ist unzureichend, erlaubt ../../etc/passwd."

    # --- LEVEL 3: Hidden / Advanced (Hard) ---
    - issue: "Information Disclosure"
      severity: "medium"
      type: "advanced"
      explanation: "display_errors = 1 in Production Code."
      
    - issue: "Weak Randomness (Reset Token)"
      severity: "high"
      type: "advanced"
      explanation: "md5(time() . rand()) ist vorhersagbar."
      
    - issue: "Type Juggling (API Key)"
      severity: "high"
      type: "advanced"
      explanation: "Loose comparison (==) erlaubt Bypass wenn Input true/0 ist."
      
    - issue: "Insecure Admin Check (Cookie Manipulation)"
      severity: "critical"
      type: "advanced"
      explanation: "Verlässt sich auf Client-Side Cookie 'admin_flag'."

    # --- LEVEL 4: Expert (Very Hard) ---
    - issue: "IDOR (Profile Update)"
      severity: "critical"
      type: "expert"
      explanation: "Nutzer kann user_id im POST-Request manipulieren und fremde Profile ändern."

    - issue: "CSRF (Profile Update/Delete)"
      severity: "high"
      type: "expert"
      explanation: "Keine CSRF-Tokens in POST-Forms (Delete User, Profile Update)."

# ============================================================
# Scoring-Konfiguration
# ============================================================

scoring:
  total_points: 100
  
  error_detection:
    weight: 60
    description: "Erkennung der Vulnerabilities (Gestaffelt)"
    
    # 1. Labeled Issues (10 Punkte)
    labeled_issues:
      - issue: "SQL Injection (Login)"
        points: 5
        keywords: ["sql injection", "login query", "prepared statement"]
      
      - issue: "Plaintext Passwords"
        points: 5
        keywords: ["password", "hash", "plaintext", "klartext", "bcrypt"]

    # 2. Standard Issues (15 Punkte)
    standard_issues:
      - issue: "XSS (Welcome Message)"
        points: 4
        keywords: ["xss", "cross-site", "htmlspecialchars", "escape"]
        
      - issue: "Session Fixation"
        points: 4
        keywords: ["session_regenerate_id", "fixation", "hijacking"]
        
      - issue: "Path Traversal"
        points: 4
        keywords: ["traversal", "directory", "basename", "realpath", "lfi"]
        
      - issue: "Insecure Cookie"
        points: 3
        keywords: ["httponly", "secure", "cookie"]

    # 3. Advanced Issues (15 Punkte)
    advanced_issues:
      - issue: "Weak Randomness (Token)"
        points: 4
        keywords: ["random_bytes", "random_int", "predictable", "vorhersagbar", "entropy", "rand()"]
        
      - issue: "Type Juggling (API Key)"
        points: 4
        keywords: ["type juggling", "loose comparison", "===", "strict comparison", "identisch", "strcmp"]
        
      - issue: "Insecure Admin Check"
        points: 4
        keywords: ["client-side", "manipulation", "cookie trust", "authorization", "privilege escalation"]
        
      - issue: "Information Disclosure"
        points: 3
        keywords: ["display_errors", "error_reporting", "information disclosure", "debug"]

    # 4. Expert Issues (20 Punkte)
    expert_issues:
      - issue: "IDOR (Profile Update)"
        points: 10
        keywords: ["idor", "insecure direct object reference", "authorization", "session id", "fremde daten", "berechtigung"]
        
      - issue: "CSRF (Missing Tokens)"
        points: 10
        keywords: ["csrf", "cross-site request forgery", "token", "anti-csrf", "nonce"]

  solution_quality:
    weight: 30
    description: "Qualität der Fixes"
    
    criteria:
      - id: "SQ-001"
        name: "Prepared Statements (Code)"
        points: 10
        check_method: "code_validation"
        required_elements: ["prepare", "bind_param", "execute"]
        min_code_blocks: 1
        
      - id: "SQ-002"
        name: "CSRF Token Implementation"
        points: 10
        check_method: "keyword_presence"
        keywords: ["csrf_token", "session", "token", "input type=\"hidden\""]
        min_keywords: 2
        
      - id: "SQ-003"
        name: "Authorization Check (IDOR Fix)"
        points: 10
        check_method: "code_validation"
        required_elements: ["$_SESSION['user_id']"]
        min_code_blocks: 1

  formatting:
    weight: 10
    description: "Struktur"
    criteria:
      - id: "FM-001"
        name: "Strukturierte Liste"
        points: 10
        check_method: "markdown_table_validation"
        min_rows: 5
