# ============================================================

context: |
  Du bist ein Senior Frontend Developer mit WCAG 2.2 Zertifizierung.
  Ein Junior Developer hat eine Produkt-Karten-Komponente für ein E-Commerce-Portal
  entwickelt. Der Code enthält Kommentare des Developers, der sich bei einigen
  Stellen unsicher war.

  Die Komponente ist derzeit in Production und verursacht Support-Anfragen von:
  - Screen-Reader-Nutzern (NVDA, JAWS)
  - Keyboard-only-Nutzern
  - Nutzern mit Farbsehschwäche

prompt: |
  Analysiere die folgende HTML-Komponente auf **WCAG 2.2 Level A und AA Konformität**.

  Der Code enthält vier Kategorien von Problemen:
  1. **Markierte Issues**: TODOs oder Notizen im Code (bestätige diese).
  2. **Offensichtliche Issues**: Standard WCAG-Verstöße.
  3. **Subtile Issues**: Semantische Probleme, die Screen-Reader betreffen.
  4. **Experten Issues**: Komplexe WCAG 2.2 Anforderungen (Status Messages, Target Size, Focus Not Obscured).

  ## Deine Aufgabe
  Identifiziere **ALLE** Accessibility-Probleme. Priorisiere sie nach Schweregrad. Achte dabei explizit auf die neuen Kriterien aus WCAG 2.2.

  **HTML-Komponente:**

  ```html
  <header style="position: sticky; top: 0; background: white; z-index: 100;">
    <h1>Shop</h1>
  </header>

  <div class="product-card" onclick="window.location='/product/123'">
    <div class="badge">NEU</div>

    <!-- TODO: Add alt text later -->
    <img src="/images/shoe-red-nike-air.jpg" width="300">

    <div class="product-info">
      <h3>Nike Air Max</h3>

      <!-- Note: Design wants this grey (#888), check if readable against white -->
      <div class="price" style="color: #888; font-size: 14px;">
        49.99€
        <span style="color: #e74c3c; text-decoration: line-through;">
          89.99€
        </span>
      </div>

      <div style="color: #999; background: #ddd; padding: 4px; margin: 8px 0;">
        ⚠️ Nur noch 3 verfügbar!
      </div>

      <div class="rating">
        <img src="/stars-4.png" alt="4 stars">
      </div>
    </div>

    <button style="background: lightblue; color: white; border: none; padding: 10px;">
      In den Warenkorb
    </button>

    <a href="#details" style="color: blue;">Mehr</a>
  </div>

  ```

  **CSS-Kontext:**

  ```css
  .product-card { cursor: pointer; }
  /* Note: Focus styles removed because client didn't like the outline */
  /* :focus { outline: none; } */

  ```

  ### Anforderungen an die Antwort:
  1. Erstelle eine **Markdown-Tabelle** mit allen gefundenen Issues.
  2. Gib für jedes Issue folgende Spalten an:
     - **WCAG-Kriterium** (z.B. 1.1.1)
     - **Beschreibung**
     - **Schweregrad**
     - **Lösung/Code-Snippet**

  **HINWEIS:** Halte Beschreibungen prägnant (2-3 Sätze inkl. Code-Snippet), und liste alle gefundenen Probleme vollständig auf.

# ============================================================
# Test-Daten (Issues zum Erkennen)
# ============================================================

