# ============================================================
# Test-Kontext und Aufgabenstellung
# ============================================================

context: |
  Du bist ein Senior Frontend Developer mit WCAG 2.2 Zertifizierung.
  Ein Junior Developer hat eine Produkt-Karten-Komponente für ein E-Commerce-Portal 
  entwickelt. Der Code enthält Kommentare des Developers, der sich bei einigen 
  Stellen unsicher war.

  Die Komponente ist derzeit in Production und verursacht Support-Anfragen von:
  - Screen-Reader-Nutzern (NVDA, JAWS)
  - Keyboard-only-Nutzern
  - Nutzern mit Farbsehschwäche

prompt: |
  Analysiere die folgende HTML-Komponente auf **WCAG 2.2 Level A und AA Konformität**.

  Der Code enthält vier Kategorien von Problemen:
  1. **Markierte Issues**: TODOs oder Notizen im Code (bestätige diese).
  2. **Offensichtliche Issues**: Standard WCAG-Verstöße.
  3. **Subtile Issues**: Semantische Probleme, die Screen-Reader betreffen.
  4. **Experten Issues**: Komplexe Anforderungen (Status Messages, Target Size).

  ## Deine Aufgabe
  Identifiziere **ALLE** Accessibility-Probleme. Priorisiere sie nach Schweregrad.

  **HTML-Komponente:**
  ```html
  <div class="product-card" onclick="window.location='/product/123'">
    <div class="badge">NEU</div>
    
    <!-- TODO: Add alt text later -->
    <img src="/images/shoe-red-nike-air.jpg" width="300">
    
    <div class="product-info">
      <h3>Nike Air Max</h3>
      
      <!-- Note: Design wants this grey (#888), check if readable against white -->
      <div class="price" style="color: #888; font-size: 14px;">
        49.99€
        <span style="color: #e74c3c; text-decoration: line-through;">
          89.99€
        </span>
      </div>
      
      <div style="color: #999; background: #ddd; padding: 4px; margin: 8px 0;">
        ⚠️ Nur noch 3 verfügbar!
      </div>
      
      <div class="rating">
        <img src="/stars-4.png" alt="4 stars">
      </div>
    </div>
    
    <button style="background: lightblue; color: white; border: none; padding: 10px;">
      In den Warenkorb
    </button>
    
    <a href="#details" style="color: blue;">Mehr</a>
  </div>
  ```

  **CSS-Kontext:**
  ```css
  .product-card { cursor: pointer; }
  /* Note: Focus styles removed because client didn't like the outline */
  /* :focus { outline: none; } */
  ```

  ### Anforderungen an die Antwort:
  1. Erstelle eine **Markdown-Tabelle** mit allen gefundenen Issues.
  2. Gib für jedes Issue folgende Spalten an: 
     - **WCAG-Kriterium** (z.B. 1.1.1)
     - **Beschreibung**
     - **Schweregrad**
     - **Lösung/Code-Snippet**

# ============================================================
# Test-Daten (Issues zum Erkennen)
# ============================================================

test_data:
  issues:
    # --- LEVEL 1: Labeled (Easy) ---
    - issue: "Fehlender alt-Text"
      severity: "critical"
      type: "labeled"
      explanation: "Durch TODO markiert."
    
    - issue: "Farbkontrast (Text)"
      severity: "high"
      type: "labeled"
      explanation: "Durch Note markiert (#888 auf Weiß ist < 4.5:1)."

    - issue: "Fehlender Fokus-Indikator"
      severity: "critical"
      type: "labeled"
      explanation: "Durch CSS-Kommentar markiert."

    # --- LEVEL 2: Standard (Medium) ---
    - issue: "Keyboard Trap (div onclick)"
      severity: "critical"
      type: "standard"
      explanation: "div mit onclick ist nicht per Tastatur bedienbar."

    - issue: "Link-Text 'Mehr'"
      severity: "high"
      type: "standard"
      explanation: "Kontextloser Link-Text."

    - issue: "Farbkontrast (Button)"
      severity: "high"
      type: "standard"
      explanation: "Lightblue auf Weiß ist schwer lesbar."

    # --- LEVEL 3: Advanced (Hard) ---
    - issue: "Strikethrough Semantics"
      severity: "medium"
      type: "advanced"
      explanation: "Screen Reader lesen '89.99€' ohne Kontext, dass es der alte Preis ist."

    - issue: "Emoji Accessibility"
      severity: "medium"
      type: "advanced"
      explanation: "⚠️ Emoji wird von Screen Readern unterschiedlich/gar nicht vorgelesen."

    - issue: "Semantik (Article/List)"
      severity: "medium"
      type: "advanced"
      explanation: "Produkt-Karte sollte <article> sein oder in einer Liste stehen."

    # --- LEVEL 4: Expert (Very Hard) ---
    - issue: "Status Message (Live Region)"
      severity: "medium"
      type: "expert"
      explanation: "'Nur noch 3 verfügbar' ist eine Status-Meldung und sollte role='status' haben."

    - issue: "Touch Target Size"
      severity: "medium"
      type: "expert"
      explanation: "Der 'Mehr' Link ist wahrscheinlich zu klein (< 24x24px) für Touch-Targets (WCAG 2.5.8)."

# ============================================================
# Scoring-Konfiguration
# ============================================================

scoring:
  total_points: 100
  
  error_detection:
    weight: 60
    description: "Erkennung der WCAG-Issues (Gestaffelt)"
    
    # 1. Labeled Issues (10 Punkte)
    labeled_issues:
      - issue: "Fehlender alt-Text"
        points: 4
        keywords: ["alt", "alt-attribut", "bildbeschreibung", "alternative text", "bild", "image", "beschriftung"]
      
      - issue: "Farbkontrast (Text)"
        points: 3
        keywords: ["kontrast", "contrast", "farbe", "grau", "lesbarkeit", "1.4.3", "hintergrund", "schrift"]

      - issue: "Fehlender Fokus-Indikator"
        points: 3
        keywords: ["focus", "fokus", "outline", "tastatur", "visible", "rahmen", "selektion", "aktiv"]

    # 2. Standard Issues (20 Punkte)
    standard_issues:
      - issue: "Keyboard Trap (div onclick)"
        points: 7
        keywords: ["onclick", "div", "button", "tastatur", "keyboard", "interaktiv", "maus", "klickbar", "element", "semantisch"]
        
      - issue: "Link-Text 'Mehr'"
        points: 7
        keywords: ["link", "text", "aussagekräftig", "kontext", "mehr", "screen reader", "beschriftung", "ziel"]
        
      - issue: "Farbkontrast (Button)"
        points: 6
        keywords: ["button", "lightblue", "hellblau", "weiß", "kontrast", "lesbarkeit", "hintergrund"]

    # 3. Advanced Issues (15 Punkte)
    advanced_issues:
      - issue: "Strikethrough Semantics"
        points: 5
        keywords: ["durchgestrichen", "visuell", "screen reader", "versteckt", "sr-only", "alt-preis"]
        
      - issue: "Emoji Accessibility"
        points: 5
        keywords: ["emoji", "role", "img", "aria-label", "warnung"]
        
      - issue: "Semantik (Article/List)"
        points: 5
        keywords: ["article", "liste", "li", "ul", "semantik", "struktur"]

    # 4. Expert Issues (15 Punkte)
    expert_issues:
      - issue: "Status Message (Live Region)"
        points: 8
        keywords: ["status", "role", "live region", "aria-live", "dynamisch", "verfügbarkeit"]
        
      - issue: "Touch Target Size"
        points: 7
        keywords: ["touch", "target", "größe", "klickfläche", "24px", "44px", "mobil"]

  solution_quality:
    weight: 30
    description: "Qualität der Fixes"
    
    criteria:
      - id: "SQ-001"
        name: "Semantisches HTML (Button)"
        points: 10
        check_method: "code_validation"
        required_elements: ["<button"]
        min_code_blocks: 1
        
      - id: "SQ-002"
        name: "Visually Hidden Text (Preis)"
        points: 10
        check_method: "keyword_presence"
        keywords: ["sr-only", "visually-hidden", "clip", "absolute"]
        min_keywords: 1
        
      - id: "SQ-003"
        name: "ARIA-Label für Emoji/Link"
        points: 10
        check_method: "code_validation"
        required_elements: ["aria-label"]
        min_code_blocks: 1

  formatting:
    weight: 10
    description: "Struktur"
    criteria:
      - id: "FM-001"
        name: "Strukturierte Liste/Tabelle"
        points: 10
        check_method: "markdown_table_validation"
        min_rows: 10
