golden_standard: |
  # WCAG 2.2 Accessibility-Audit: Produkt-Karten-Komponente

  ## Executive Summary

  > **Kritischer Befund:** Die Komponente verletzt **13 einzigartige WCAG-Kriterien** in
  > **20 konkreten Verstößen** auf Level A/AA und ist in keinem der drei gemeldeten
  > Nutzungsszenarien vollständig bedienbar. Eine sofortige Überarbeitung vor dem
  > nächsten Release wird dringend empfohlen.

  ---

  ## Issue-Tabelle

  | # | Kategorie | WCAG-Kriterium | Beschreibung | Schweregrad | Lösung/Code-Snippet |
  |---|-----------|---------------|--------------|-------------|---------------------|
  | 1 | ⚠️ Markiert | **1.1.1** Non-text Content (Level A) | `<img>` hat kein `alt`-Attribut. Screen-Reader lesen den Dateinamen vor: *"shoe-red-nike-air.jpg"* | 🔴 **Kritisch** | `<img src="..." alt="Nike Air Max Sneaker in Rot, Seitenansicht" width="300" height="300">` |
  | 2 | ⚠️ Markiert | **1.4.3** Contrast (Minimum) (Level AA) | Preis `#888` auf `#fff`: Kontrastverhältnis **~3.5:1** — Minimum ist **4.5:1** bei 14px Normaltext | 🔴 **Kritisch** | `color: #767676` (exakt 4.5:1) oder besser `color: #595959` (7:1) |
  | 3 | 🔍 Offensichtlich | **1.3.1** Info and Relationships (Level A) | Durchgestrichener Originalpreis `89.99€` hat keine semantische Kennzeichnung. Screen-Reader lesen nur die Zahl ohne Kontext. `<del>` ist gegenüber `<s>` semantisch vorzuziehen, da es eine inhaltliche Änderung markiert | 🔴 **Kritisch** | `<del aria-label="Ursprünglicher Preis: 89,99 Euro"><span aria-hidden="true">89.99€</span></del>` — oder Container-Lösung: `<div class="price" aria-label="Preis: 49,99 Euro, reduziert von 89,99 Euro">` |
  | 4 | 🔍 Offensichtlich | **2.1.1** Keyboard (Level A) | `onclick` auf `<div>` ist nicht per Tastatur erreichbar. `<div>` ist kein fokussierbares Element und feuert kein `keydown`-Event | 🔴 **Kritisch** | Siehe Refactoring-Lösung unten |
  | 5 | 🔍 Offensichtlich | **4.1.2** Name, Role, Value (Level A) | `<div onclick>` hat keine ARIA-Rolle und keinen zugänglichen Namen. Screen-Reader erkennen keine Interaktivität | 🔴 **Kritisch** | Siehe Refactoring-Lösung unten |
  | 6 | 🔍 Offensichtlich | **2.4.7** Focus Visible (Level AA) | CSS-Kommentar zeigt, dass `outline: none` aktiv war/ist. Auch im aktuellen Zustand: `<button>` und `<a>` haben durch Browser-Reset möglicherweise keinen sichtbaren Fokus | 🔴 **Kritisch** | Siehe Focus-Styles unten |
  | 7 | 🔍 Offensichtlich | **1.4.3** Contrast (Minimum) (Level AA) | Verfügbarkeits-Badge: `#999` auf `#ddd` ergibt Kontrastverhältnis von **~1.7:1** — weit unter dem Minimum | 🔴 **Kritisch** | `color: #595959; background: #e8e8e8` (Kontrast: 7:1) |
  | 8 | 🔍 Offensichtlich | **1.4.3** Contrast (Minimum) (Level AA) | `lightblue` (`#add8e6`) als Button-Hintergrund mit `white` Text: Kontrastverhältnis **~1.7:1** | 🔴 **Kritisch** | `background: #0066cc; color: #ffffff` (Kontrast: 7.1:1) |
  | 9 | 🔍 Offensichtlich | **2.4.3** Focus Order (Level A) | Der `<div onclick>` enthält verschachtelte fokussierbare Elemente (`<button>`, `<a>`). Der Wrapper selbst ist nicht per Tab erreichbar, seine Kinder aber schon — das erzeugt eine inkonsistente, für Screen-Reader verwirrende Tab-Reihenfolge | 🔴 **Kritisch** | Semantisches HTML ohne `onclick`-Wrapper (siehe Refactoring); primäre Navigation über `<a>` im Produkttitel |
  | 10 | 🔍 Offensichtlich | **2.4.4** Link Purpose (In Context) (Level A) | `<a href="#details">Mehr</a>` — Linktext "Mehr" ist ohne Kontext bedeutungslos. Screen-Reader-Nutzer navigieren oft über Linklisten und hören bei mehreren Karten nur "Mehr, Mehr, Mehr" | 🟠 **Hoch** | `<a href="#details" aria-label="Mehr Details zu Nike Air Max">Mehr</a>` |
  | 11 | 🔬 Subtil | **1.3.1** Info and Relationships (Level A) | `<div class="badge">NEU</div>` ist rein visuell. Screen-Reader erhalten keinen Hinweis auf den Produktstatus. Bevorzugte Alternative: Badge in den `<h3>`-Titel integrieren für automatische Produkt-Verknüpfung | 🟠 **Hoch** | `<div class="badge" role="note" aria-label="Produktstatus: Neu">NEU</div>` — oder besser: `<h3>Nike Air Max <span class="badge" aria-label="Neu im Sortiment">NEU</span></h3>` |
  | 12 | 🔬 Subtil | **1.3.3** Sensory Characteristics (Level A) | Warnung `⚠️ Nur noch 3 verfügbar!` nutzt ausschließlich ein Emoji als visuelles Signal. Emoji-Aussprache variiert stark zwischen Screen-Readern | 🟠 **Hoch** | `<span aria-hidden="true">⚠️</span><span class="sr-only">Warnung:</span> Nur noch 3 verfügbar!` |
  | 13 | 🔬 Subtil | **1.3.1** Info and Relationships (Level A) | Bewertungs-`<img>` mit `alt="4 stars"` — englischer Text in deutschsprachiger UI, fehlende Maßeinheit und fehlender Kontext (Gesamtzahl unklar) | 🟡 **Mittel** | `<img src="..." alt="Produktbewertung: 4 von 5 Sternen">` — optional mit Anzahl: `"4 von 5 Sternen (128 Bewertungen)"` wenn verfügbar |
  | 14 | 🔬 Subtil | **1.4.1** Use of Color (Level A) | Roter Durchstreichpreis kommuniziert "reduziert" ausschließlich über Farbe. Nutzer mit Rot-Grün-Schwäche erkennen den Rabatt ggf. nicht | 🟡 **Mittel** | Kombination aus `<del>`, Label und visueller Kennzeichnung (z.B. "Rabatt"-Badge) |
  | 15 | 🔬 Subtil | **3.1.2** Language of Parts (Level AA) | `alt="4 stars"` ist Englisch — die restliche UI ist Deutsch. Screen-Reader verwenden für diesen Alternativtext die falsche Sprachaussprache | 🟡 **Mittel** | `alt="Produktbewertung: 4 von 5 Sternen"` (deutsche Formulierung eliminiert das Problem vollständig) |
  | 16 | 🔬 Subtil | **3.3.2** Labels or Instructions (Level A) | `<button>` hat keinen expliziten `type`-Wert. In einem `<form>` würde `type="submit"` angenommen und unerwünschte Aktionen auslösen | 🟡 **Mittel** | `<button type="button" ...>In den Warenkorb</button>` |
  | 17 | 🧠 Experten | **4.1.3** Status Messages (Level AA) | Nach "In den Warenkorb" gibt es keine ARIA-Live-Region. Screen-Reader-Nutzer erhalten keine Rückmeldung über den Erfolg der Aktion | 🟠 **Hoch** | Siehe Live-Region-Lösung unten |
  | 18 | 🧠 Experten | **2.5.2** Pointer Cancellation (Level A) | Das `onclick` auf dem Container-`<div>` feuert gleichzeitig mit Klicks auf `<button>` und `<a>` — ein Klick auf "In den Warenkorb" löst sowohl die Cart-Aktion als auch die Produktseiten-Navigation aus | 🟠 **Hoch** | `onclick` vom `<div>` entfernen (Lösung im Refactoring) — temporärer Workaround: `e.stopPropagation()` auf inneren Elementen |
  | 19 | 🧠 Experten | **2.5.8** Target Size (Minimum) (Level AA) *(neu in 2.2)* | `<a href="#details">Mehr</a>` hat vermutlich eine Klickfläche unter **24×24px** (kurzer Text, 14px Font) | 🟡 **Mittel** | `min-height: 24px; min-width: 24px; display: inline-block; padding: 4px 8px` |
  | 20 | 🧠 Experten | **2.4.11** Focus Not Obscured (Level AA) *(neu in 2.2)* | Bei Sticky-Headern/Footern im E-Commerce-Layout kann der fokussierte Button durch UI-Elemente verdeckt werden | 🟡 **Mittel** | `scroll-margin-top: 80px` für fokussierbare Elemente im Layout |

  ---

  ## Detaillierte Lösungen

  ### 🔴 Fix 1: Strukturelles Refactoring — Klickbarer Container

  Das Kernproblem ist der `<div onclick>`. Die semantisch korrekte Lösung vermeidet
  verschachtelte interaktive Elemente:

  ```html
  <!-- ❌ VORHER: Nicht tastaturzugänglich, keine Semantik -->
  <div class="product-card" onclick="window.location='/product/123'">
    <button>In den Warenkorb</button>
    <a href="#details">Mehr</a>
  </div>

  <!-- ✅ NACHHER: Semantisch korrekt, vollständig tastaturzugänglich -->
  <article class="product-card" aria-labelledby="product-title-123">
    <!--
      Strategie: Der Produktlink "umhüllt" den Karteninhalt als primäre Aktion.
      Button und weiterer Link bleiben eigenständig und überschreiben den Kartenlink
      via z-index / position (Overlay-Link-Pattern).
      aria-labelledby verknüpft die Karte programmatisch mit dem Produkttitel.
    -->

    <!-- Overlay-Link als primäre Kartennavigation -->
    <a href="/product/123" class="card-link" aria-label="Nike Air Max – Produktdetails anzeigen">
      <span aria-hidden="true"><!-- visuell leer --></span>
    </a>

    <div class="badge" role="note">
      <span class="sr-only">Produktstatus:</span> NEU
    </div>

    <img
      src="/images/shoe-red-nike-air.jpg"
      alt="Nike Air Max Sneaker in Rot, Seitenansicht"
      width="300"
      height="300"
      loading="lazy"
    >

    <div class="product-info">
      <h3 id="product-title-123">Nike Air Max</h3>

      <div class="price" aria-label="Preis: 49,99 Euro, reduziert von 89,99 Euro">
        <!-- aria-label auf dem Container ersetzt die Einzelaussprache -->
        <span aria-hidden="true" class="current-price">49.99€</span>
        <!-- <del> statt <s>: semantisch korrekte Markierung einer inhaltlichen Änderung -->
        <del aria-hidden="true" class="original-price">89.99€</del>
      </div>

      <div class="availability" role="status">
        <span aria-hidden="true">⚠️</span>
        <span class="sr-only">Warnung:</span>
        Nur noch 3 verfügbar!
      </div>

      <div class="rating">
        <img src="/stars-4.png" alt="Produktbewertung: 4 von 5 Sternen">
      </div>
    </div>

    <!-- position: relative + z-index überschreibt den Overlay-Link -->
    <button
      type="button"
      class="add-to-cart"
      aria-label="Nike Air Max in den Warenkorb legen"
    >
      In den Warenkorb
    </button>

    <a
      href="/product/123#details"
      class="details-link"
      aria-label="Mehr Details zu Nike Air Max"
    >
      Mehr
    </a>
  </article>
  ```

  ---

  ### 🔴 Fix 2: Kontrast-konforme Farbpalette

  ```css
  /* ❌ VORHER */
  .price        { color: #888; }                         /* 3.5:1 — FAIL */
  .availability { color: #999; background: #ddd; }       /* 1.7:1 — FAIL */
  .add-to-cart  { background: lightblue; color: white; } /* 1.7:1 — FAIL */

  /* ✅ NACHHER — alle Werte geprüft mit APCA/WCAG-Algorithmus */
  .price          { color: #595959; }      /* 7.0:1 auf #fff — PASS AAA */
  .original-price {
    color: #c0392b;                        /* 5.1:1 auf #fff — PASS AA  */
    text-decoration: line-through;
  }
  .availability   {
    color: #4a4a4a;                        /* 9.7:1 auf #e8e8e8 — PASS AAA */
    background: #e8e8e8;
  }
  .add-to-cart    {
    background: #0066cc;                   /* 7.1:1 auf #fff — PASS AAA */
    color: #ffffff;
  }
  ```

  ---

  ### 🔴 Fix 3: Focus-Styles wiederherstellen

  ```css
  /* ❌ VORHER: Outline entfernt — Keyboard-Nutzer sehen keinen Fokus */
  /* :focus { outline: none; } */

  /* ✅ NACHHER: Sichtbarer, markenkonformer Fokusindikator */
  /* Erfüllt WCAG 2.2 SC 2.4.11 (Focus Not Obscured) und 2.4.7 (Focus Visible) */
  :focus-visible {
    outline: 3px solid #0066cc;
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* Overlay-Link-Fokus auf die gesamte Karte ausdehnen */
  .card-link:focus-visible {
    outline: 3px solid #0066cc;
    outline-offset: 0;
  }

  .product-card:has(.card-link:focus-visible) {
    outline: 3px solid #0066cc;
    outline-offset: 2px;
  }

  /* Nur :focus (nicht :focus-visible) für Maus-Nutzer unterdrücken — korrekte Methode */
  :focus:not(:focus-visible) {
    outline: none;
  }

  /* Windows High Contrast Mode / Contrast Themes */
  @media (forced-colors: active) {
    :focus-visible {
      outline: 3px solid ButtonText;
    }
  }
  ```

  ---

  ### 🟠 Fix 4: ARIA Live-Region für Warenkorb-Feedback

  ```html
  <!-- Im übergeordneten Layout, einmalig platzieren -->
  <div
    role="status"
    aria-live="polite"
    aria-atomic="true"
    class="sr-only"
    id="cart-status"
  >
    <!-- Wird per JS befüllt -->
  </div>
  ```

  ```javascript
  // ✅ Screen-Reader-Feedback nach Warenkorb-Aktion
  document.querySelector('.add-to-cart').addEventListener('click', async () => {
    const statusEl = document.getElementById('cart-status');

    try {
      await addToCart(productId); // API-Call

      // Reset erzwingen, damit Wiederholung derselben Nachricht erneut vorgelesen wird
      statusEl.textContent = '';

      // requestAnimationFrame statt setTimeout(0): zuverlässigeres Timing für Screen-Reader,
      // da die Änderung nach dem Browser-Rendering-Zyklus erfolgt
      requestAnimationFrame(() => {
        statusEl.textContent = 'Nike Air Max wurde dem Warenkorb hinzugefügt.';
      });
    } catch {
      // role="alert" für Fehler (unterbricht sofort, ohne auf Pause zu warten)
      statusEl.setAttribute('role', 'alert');
      statusEl.textContent = 'Fehler: Nike Air Max konnte nicht hinzugefügt werden.';
    }

    // Nachricht nach Vorlesen zurücksetzen
    setTimeout(() => {
      statusEl.textContent = '';
      statusEl.setAttribute('role', 'status');
    }, 5000);
  });
  ```

  ---

  ### Utility-Klasse: Screen-Reader-Only

  ```css
  /* Visuell versteckt, aber für assistive Technologien vollständig zugänglich */
  /* NIEMALS display:none oder visibility:hidden verwenden — das versteckt auch für AT */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  ```

