context: |
  Du bist ein Senior Backend Engineer. Du reviewst einen Entwurf für eine REST-API (Flask-basiert),
  die von einem Junior-Entwickler geschrieben wurde. Der Code funktioniert technisch, verletzt aber
  viele REST-Prinzipien und Best Practices.

prompt: |
  Analysiere den folgenden Python/Flask-Code auf **API-Design-Fehler** und **REST-Verstöße**.

  Der Code enthält drei Kategorien von Fehlern:
  1. **Markierte Issues**: Bereits identifizierte Probleme (bestätige diese).
  2. **Offensichtliche Issues**: Standard REST-Fehler (Verben, Status Codes).
  3. **Subtile Issues**: Architektur-Probleme (Idempotenz, Versionierung, Security).

  ## Deine Aufgabe
  Finde und erkläre **ALLE** Design-Fehler. Priorisiere sie nach Schweregrad.

  **API Code (Flask):**
  ```python
  from flask import Flask, request, jsonify

  app = Flask(__name__)

  # In-memory database
  users = []

  # ISSUE 1: Wrong HTTP Verb for fetching data
  @app.route('/get_users', methods=['POST'])
  def get_all_users():
      return jsonify(users), 200

  # ISSUE 2: Non-standard URL structure
  @app.route('/create_new_user_entry', methods=['POST'])
  def add_user():
      data = request.json

      # Validation
      if 'username' not in data:
          # Returning 200 OK even for errors
          return jsonify({"error": "Missing username", "status": "fail"}), 200

      user = {
          "id": len(users) + 1,
          "username": data['username'],
          "email": data.get('email', '')
      }
      users.append(user)

      return jsonify({"message": "User created", "id": user['id']}), 200

  @app.route('/user/delete', methods=['GET'])
  def delete_user():
      user_id = request.args.get('id')
      # Logic to delete user...
      return jsonify({"status": "deleted"}), 200

  @app.route('/api/update_email', methods=['POST'])
  def update_email():
      # Updates email, but what if network fails and client retries?
      # Not idempotent!
      user_id = request.json.get('id')
      new_email = request.json.get('email')

      for user in users:
          if user['id'] == user_id:
              user['email'] = new_email
              # Side effect: Sends email notification every time
              send_notification(user['email'], "Email changed")
              return jsonify(user), 200

      return jsonify({"error": "User not found"}), 404

  # Helper
  def send_notification(email, msg):
      print(f"Sending email to {email}: {msg}")
  ```

  ### Anforderungen an die Antwort:
  1. Erstelle eine **Markdown-Tabelle** mit allen gefundenen Design-Fehlern.
  2. Gib für jeden Fehler folgende Spalten an:
     - **Kategorie** (z.B. REST Violation, Error Handling)
     - **Fehlerbeschreibung**
     - **Warum** es problematisch ist
     - **Verbesserungsvorschlag** (Code-Snippet oder Konzept)

  **HINWEIS:** Halte die Spaltentexte extrem kurz und präzise (max. 1-2 Sätze), um Token-Limits sicher einzuhalten. Fasse dich auf das Wesentliche zusammen.

