  version: "2.1.0"

context: |
  Du bist ein Performance-Engineer. Du analysierst eine E-Commerce-Produktseite,
  die schlechte Core Web Vitals Werte aufweist (LCP: 4.2s, CLS: 0.28).
  Der Code stammt von einem Team, das unter Zeitdruck stand. Einige Probleme sind
  mit TODOs markiert, andere sind versteckt.

prompt: |
  Analysiere den folgenden HTML/JS-Code auf **Performance-Probleme**.

  Der Code enthält drei Kategorien von Problemen:
  1. **Markierte Issues**: TODOs oder Notes (bestätige diese).
  2. **Offensichtliche Issues**: Standard Performance-Killer (Lighthouse).
  3. **Subtile Issues**: JavaScript-Logikfehler oder Rendering-Blocker.

  ## Deine Aufgabe
  Identifiziere **ALLE** Performance-Probleme. Priorisiere sie nach Impact auf Core Web Vitals.

  **Code:**

  ```html
  <!DOCTYPE html>
  <html lang="de">
  <head>
    <meta charset="UTF-8">
    <title>Premium Laptop</title>

    <!-- TODO: Check if we really need all bootstrap styles immediately -->
    <link rel="stylesheet" href="https://cdn.example.com/bootstrap.min.css">
    <link rel="stylesheet" href="/styles/main.css">

    <!-- Note: Analytics needs to track pageview ASAP -->
    <script src="https://cdn.analytics.com/tracker.js"></script>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>

  <body>
    <header>
      <!-- TODO: This image is 5MB, maybe compress? -->
      <img src="/images/hero-laptop-raw.png" class="hero">
    </header>

    <main>
      <div class="gallery">
        <img src="/img/1.jpg">
        <img src="/img/2.jpg">
        <img src="/img/3.jpg">
      </div>

      <div id="reviews"></div>
      <div id="recommendations"></div>

      <script>
        // Load Reviews
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/api/reviews', false);
        xhr.send();
        document.getElementById('reviews').innerHTML = xhr.responseText;

        // Load Recommendations
        const productIds = [101, 102, 103, 104, 105];

        productIds.forEach(id => {
          fetch('/api/product/' + id)
            .then(r => r.json())
            .then(data => {
              const div = document.createElement('div');
              div.innerHTML = `<h3>${data.name}</h3><img src="${data.img}">`;
              document.getElementById('recommendations').appendChild(div);
            });
        });
      </script>

      <div class="ad-banner">
        <!-- Dynamic Ad loaded later -->
        <img src="/ads/banner.jpg">
      </div>
    </main>

    <footer>
      <style>
        @font-face {
            font-family: 'MyFont';
            src: url('/fonts/myfont.woff2');
            /* Missing font-display: swap */
        }
        body { font-family: 'MyFont', sans-serif; }
      </style>
    </footer>
  </body>
  </html>

  ```

  ### Anforderungen an die Antwort:
  1. Erstelle eine **Markdown-Tabelle** mit allen gefundenen Issues (Spalten: Kategorie, Issue, Schweregrad, Lösung/Code-Snippet).
  2. Gib für jedes Issue folgende Details in der Tabelle an:
     - **Kategorie** (z.B. LCP, CLS, Blocking)
     - **Schweregrad**
     - **Lösung** (Code-Snippet direkt in der Zelle oder als Referenz)

  **HINWEIS:** Halte Tabellenzellen kurz und präzise (max. 1–2 Sätze pro Zelle). Code-Snippets für die 3 wichtigsten Fixes kannst du im Anschluss an die Tabelle ergänzen.

# ============================================================
# Test-Daten (Issues zum Erkennen)
# ============================================================

test_data:
  issues:
    # --- LEVEL 1: Labeled (Easy) ---
    - issue: "Blocking CSS"
      severity: "high"
      type: "labeled"
      explanation: "Durch TODO markiert (Bootstrap)."

    - issue: "Unoptimiertes Hero-Image"
      severity: "critical"
      type: "labeled"
      explanation: "Durch TODO markiert (5MB PNG)."

    - issue: "Blocking JS (Analytics)"
      severity: "high"
      type: "labeled"
      explanation: "Durch Note markiert (Tracker im Head)."

    # --- LEVEL 2: Standard (Medium) ---
    - issue: "Missing Lazy Loading"
      severity: "medium"
      type: "standard"
      explanation: "Bilder 'below the fold' laden sofort (ohne Kommentar)."

    - issue: "Synchronous XHR"
      severity: "critical"
      type: "standard"
      explanation: "xhr.open(..., false) blockiert den Main Thread (ohne Kommentar)."

    # --- LEVEL 3: Advanced (Hard) ---
    - issue: "Layout Thrashing"
      severity: "high"
      type: "advanced"
      explanation: "Wiederholtes appendChild im Loop verursacht Reflows."

    - issue: "CLS (Ad Banner)"
      severity: "high"
      type: "advanced"
      explanation: "Ad-Banner ohne explizite width/height reserviert keinen Platz."

    - issue: "N+1 Fetch Problem"
      severity: "high"
      type: "advanced"
      explanation: "5 einzelne Requests statt einem Batch-Request."

    # --- LEVEL 4: Expert (Very Hard) ---
    - issue: "Unused Library (jQuery)"
      severity: "medium"
      type: "expert"
      explanation: "jQuery wird geladen (Blocking), aber im Code wird nur Vanilla JS genutzt."

    - issue: "Preload Scanner Bypass (Font)"
      severity: "high"
      type: "expert"
      explanation: "Font-Definition im Footer versteckt die URL vor dem Preload-Scanner."

# ============================================================
# Scoring-Konfiguration
# ============================================================

scoring:
  total_points: 100

  error_detection:
    weight: 60
    description: "Erkennung der Performance-Issues (Gestaffelt)"

    # 1. Labeled Issues (10 Punkte)
    labeled_issues:
      - issue: "Blocking CSS"
        points: 4
        keywords: ["css", "render blocking", "bootstrap", "media query", "preload", "blockiert", "rendering", "stylesheet"]

      - issue: "Unoptimiertes Hero-Image"
        points: 3
        keywords: ["5mb", "komprimieren", "webp", "avif", "image size", "lcp", "bild", "größe", "optimierung"]

      - issue: "Blocking JS (Analytics)"
        points: 3
        keywords: ["defer", "async", "head", "script", "blocking", "blockiert", "js"]

    # 2. Standard Issues (15 Punkte)
    standard_issues:
      - issue: "Missing Lazy Loading"
        points: 5
        keywords: ["lazy", "loading", "below the fold", "eager", "bilder", "laden", "später"]

      - issue: "Synchronous XHR"
        points: 10
        keywords: ["synchron", "xhr", "xmlhttprequest", "blockiert", "main thread", "deprecated", "veraltet"]

    # 3. Advanced Issues (15 Punkte)
    advanced_issues:
      - issue: "N+1 Fetch / Waterfall"
        points: 5
        keywords: ["n+1", "waterfall", "batch", "einzelne requests", "promise.all", "schleife", "fetch"]

      - issue: "Layout Thrashing"
        points: 5
        keywords: ["reflow", "repaint", "layout thrashing", "dom manipulation", "fragment", "documentfragment", "dom", "manipulation", "render"]

      - issue: "CLS (Ad Banner)"
        points: 5
        keywords: ["cls", "layout shift", "width", "height", "dimensionen", "aspect ratio", "verschiebung", "layout"]

    # 4. Expert Issues (20 Punkte)
    expert_issues:
      - issue: "Unused Library (jQuery)"
        points: 10
        keywords: ["jquery", "unused", "bloat", "remove", "vanilla js", "unnötig", "nicht genutzt", "bibliothek"]

      - issue: "Preload Scanner Bypass"
        points: 10
        keywords: ["preload scanner", "footer style", "late discovery", "head", "critical request chain", "footer", "spät"]

  solution_quality:
    weight: 30
    description: "Qualität der Fixes"

    criteria:
      - id: "SQ-001"
        name: "Modernes Image-Tag (picture/srcset)"
        points: 10
        check_method: "code_validation"
        required_elements: ["<picture", "source", "srcset"]
        min_code_blocks: 1

      - id: "SQ-002"
        name: "Async/Defer Script"
        points: 10
        check_method: "code_validation"
        required_elements: ["defer", "async"]
        min_code_blocks: 1

      - id: "SQ-003"
        name: "Promise.all für Requests"
        points: 10
        check_method: "code_validation"
        required_elements: ["Promise.all"]
        min_code_blocks: 1

  formatting:
    weight: 10
    description: "Struktur"
    criteria:
      - id: "FM-001"
        name: "Strukturierte Liste/Tabelle"
        points: 10
        check_method: "markdown_table_validation"
        min_rows: 8

golden_standard: |
  # Performance-Analyse: E-Commerce Produktseite

  ## Issue-Tabelle

  | # | Kategorie | Issue | Schweregrad | Lösung |
  |---|-----------|-------|-------------|--------|
  | 1 | Blocking / LCP | **Synchrones XHR** blockiert Main Thread bis API antwortet (`xhr.open(..., false)`). | 🔴 Kritisch | `xhr.open('GET', '/api/reviews', true)` → besser: `fetch('/api/reviews').then(...)` |
  | 2 | LCP | **Hero-Image 5 MB unkomprimiert** (raw PNG) – Hauptverursacher LCP 4.2 s. | 🔴 Kritisch | WebP/AVIF konvertieren + `fetchpriority="high"` + `<link rel="preload" as="image">` im Head |
  | 3 | Blocking / LCP | **Analytics-Script render-blocking** im `<head>` ohne `async`. | 🔴 Kritisch | `<script src="…tracker.js" async></script>` |
  | 4 | Blocking / LCP | **jQuery render-blocking** im `<head>` ohne `defer` – wird im Code nicht genutzt. | 🔴 Kritisch | jQuery entfernen oder `defer` ergänzen |
  | 5 | CLS | **Alle `<img>`-Tags ohne `width`/`height`** – kein Platz reserviert → Layout-Shift. | 🔴 Kritisch | `width` und `height` ergänzen (Hero, Gallery, Ad-Banner) |
  | 6 | CLS | **Ad-Banner ohne reservierten Platz** – dynamisch geladener Inhalt verschiebt Layout. | 🟠 Hoch | `.ad-banner { min-height: 90px; aspect-ratio: 728/90; }` |
  | 7 | CLS / LCP | **N+1 Fetch**: 5 Einzel-Requests statt Batch + wiederholtes `appendChild` verursacht Reflows. | 🟠 Hoch | `fetch('/api/products?ids=101,102,103,104,105')` + `DocumentFragment` für einmaliges DOM-Update |
  | 8 | Font / CLS | **Fehlendes `font-display: swap`** im `@font-face` → FOIT (Text unsichtbar beim Laden). | 🟠 Hoch | `font-display: swap;` ergänzen + `<style>`-Block in den `<head>` verschieben |
  | 9 | LCP | **Kein Lazy-Loading** auf Gallery-Images (`below the fold`). | 🟡 Mittel | `loading="lazy" decoding="async"` auf Bilder unterhalb des Viewports |
  | 10 | Subtil | **jQuery geladen aber nicht genutzt** – 87 KB unnötig im Waterfall. | 🟡 Mittel | jQuery-Script entfernen |

  ---

  ## Code-Fixes (Top 3)

  ### Fix 1 – Synchrones XHR + N+1 Fetch

  ```javascript
  // ✅ Async-Reviews + Batch-Recommendations mit DocumentFragment
  fetch('/api/reviews')
    .then(r => r.text())
    .then(html => { document.getElementById('reviews').innerHTML = html; });

  fetch('/api/products?ids=101,102,103,104,105')
    .then(r => r.json())
    .then(results => {
      const fragment = document.createDocumentFragment();
      results.forEach(data => {
        const div = document.createElement('div');
        const h3 = document.createElement('h3');
        h3.textContent = data.name;           // kein XSS durch textContent
        const img = document.createElement('img');
        img.src = data.img; img.width = 200; img.height = 200;
        img.loading = 'lazy'; img.alt = data.name;
        div.appendChild(h3); div.appendChild(img);
        fragment.appendChild(div);
      });
      document.getElementById('recommendations').appendChild(fragment);
    });
  ```

  ### Fix 2 – Hero Image (LCP-Haupthebel)

  ```html
  <!-- Im <head> preloaden -->
  <link rel="preload" as="image" href="/images/hero-laptop.avif" fetchpriority="high">

  <!-- Im <body> mit Dimensionen und Priorität -->
  <img src="/images/hero-laptop.avif"
       width="1200" height="600"
       fetchpriority="high"
       class="hero"
       alt="Premium Laptop Frontansicht">
  ```

  ### Fix 3 – Font + Container-Platz

  ```html
  <!-- <style> in <head> verschieben -->
  <style>
    @font-face {
      font-family: 'MyFont';
      src: url('/fonts/myfont.woff2') format('woff2');
      font-display: swap;
    }
    /* CLS-Prävention: Platz für dynamisch geladenen Inhalt reservieren */
    #reviews, #recommendations { min-height: 250px; contain: layout; }
  </style>
  ```
