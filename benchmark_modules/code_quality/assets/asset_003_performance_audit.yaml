metadata:
  id: code_quality_003
  name: "Web Performance Audit (Tiered Difficulty)"
  category: code_quality
  subcategory: performance
  difficulty: hard
  estimated_time_seconds: 300
  tags: [performance, core-web-vitals, lighthouse, optimization, lcp, cls, fid]
  author: "LLM Benchmark Suite"
  created: "2025-12-27"
  updated: "2025-12-28"
