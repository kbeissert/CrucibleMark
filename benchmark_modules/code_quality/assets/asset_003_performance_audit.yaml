context: |
  Du bist ein Performance-Engineer. Du analysierst eine E-Commerce-Produktseite,
  die schlechte Core Web Vitals Werte aufweist (LCP: 4.2s, CLS: 0.28).
  Der Code stammt von einem Team, das unter Zeitdruck stand. Einige Probleme sind
  mit TODOs markiert, andere sind versteckt.

prompt: |
  Analysiere den folgenden HTML/JS-Code auf **Performance-Probleme**.

  Der Code enthält drei Kategorien von Problemen:
  1. **Markierte Issues**: TODOs oder Notes (bestätige diese).
  2. **Offensichtliche Issues**: Standard Performance-Killer (Lighthouse).
  3. **Subtile Issues**: JavaScript-Logikfehler oder Rendering-Blocker.

  ## Deine Aufgabe
  Identifiziere **ALLE** Performance-Probleme. Priorisiere sie nach Impact auf Core Web Vitals.

  **Code:**
  ```html
  <!DOCTYPE html>
  <html lang="de">
  <head>
    <meta charset="UTF-8">
    <title>Premium Laptop</title>

    <!-- TODO: Check if we really need all bootstrap styles immediately -->
    <link rel="stylesheet" href="https://cdn.example.com/bootstrap.min.css">
    <link rel="stylesheet" href="/styles/main.css">

    <!-- Note: Analytics needs to track pageview ASAP -->
    <script src="https://cdn.analytics.com/tracker.js"></script>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>

  <body>
    <header>
      <!-- TODO: This image is 5MB, maybe compress? -->
      <img src="/images/hero-laptop-raw.png" class="hero">
    </header>

    <main>
      <div class="gallery">
        <img src="/img/1.jpg">
        <img src="/img/2.jpg">
        <img src="/img/3.jpg">
      </div>

      <div id="reviews"></div>
      <div id="recommendations"></div>

      <script>
        // Load Reviews
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/api/reviews', false);
        xhr.send();
        document.getElementById('reviews').innerHTML = xhr.responseText;

        // Load Recommendations
        const productIds = [101, 102, 103, 104, 105];

        productIds.forEach(id => {
          fetch('/api/product/' + id)
            .then(r => r.json())
            .then(data => {
              const div = document.createElement('div');
              div.innerHTML = `<h3>${data.name}</h3><img src="${data.img}">`;
              document.getElementById('recommendations').appendChild(div);
            });
        });
      </script>

      <div class="ad-banner">
        <!-- Dynamic Ad loaded later -->
        <img src="/ads/banner.jpg">
      </div>
    </main>

    <footer>
      <style>
        @font-face {
            font-family: 'MyFont';
            src: url('/fonts/myfont.woff2');
            /* Missing font-display: swap */
        }
        body { font-family: 'MyFont', sans-serif; }
      </style>
    </footer>
  </body>
  </html>
  ```

  ### Anforderungen an die Antwort:
  1. Erstelle eine **Markdown-Tabelle** mit allen gefundenen Issues (Spalten: Kategorie, Issue, Schweregrad, Lösung/Code-Snippet).
  2. Gib für jedes Issue folgende Details in der Tabelle an:
     - **Kategorie** (z.B. LCP, CLS, Blocking)
     - **Schweregrad**
     - **Lösung** (Code-Snippet direkt in der Zelle oder als Referenz)

  **HINWEIS:** Halte die Fehlerbeschreibungen und Lösungen in der Tabelle extrem kurz und präzise (max. 1-2 Sätze), um Output-Längenbegrenzungen einzuhalten.

