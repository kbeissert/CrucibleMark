# Code Quality Test Module Configuration
# ========================================

metadata:
  id: "code_quality"
  name: "Code Quality Audit"
  version: "0.2.0-beta"
  description: "Umfassende Code-Qualitätsanalyse für verschiedene Aspekte der Softwareentwicklung"
  author: "CrucibleMark"
  created: "2024-12-26"
  updated: "2026-01-31"
  tags:
    - quality
    - security
    - performance
    - accessibility
    - best-practices

# ⚙️ Generation Parameters (Module Specific)
# Diese Werte überschreiben die globalen Defaults für alle Tests dieses Moduls.
generation:
  temperature: 0.3         # Erhöht auf 0.3 (Sanity Check bestätigt: 0.2 reicht nicht für alle Assets)
  repeat_penalty: 1.05
  top_k: 40
  top_p: 0.9
  num_predict: 8192

integration:
  leaderboard:
    enable_scoring: true
    default_contribution:
      routine: 0.0
      reasoning: 1.0
    columns:
      - id: "code_quality_score"
        label: "Code Quality Audit"
        weight: 1.0

execution:
  test_class: "CodeQualityTest"
  assets_dir: "assets"
  asset_types:
    - accessibility
    - security
    - performance
    - api_design
    - code_smells

scoring:
  fallback_weights:
    regex: 0.2
    judge: 0.8

benchmarks:
  - id: "code_quality_001"
    name: "WCAG 2.2 Audit"
    tier: 1
    score_contribution:
      routine: 1.0
      reasoning: 0.0
    scoring_weights:
      regex: 0.2
      judge: 0.8

  - id: "code_quality_002"
    name: "Security Audit"
    tier: 2
    score_contribution:
      routine: 0.3
      reasoning: 0.7
    scoring_weights:
      regex: 0.2
      judge: 0.8

  - id: "code_quality_003"
    name: "Performance Audit"
    tier: 3
    score_contribution:
      routine: 0.2
      reasoning: 0.8
    scoring_weights:
      regex: 0.20
      judge: 0.80

  - id: "code_quality_004"
    name: "REST API Design Audit"
    tier: 4
    score_contribution:
      routine: 0.2
      reasoning: 0.8
    scoring_weights:
      regex: 0.20
      judge: 0.80

  - id: "code_quality_005"
    name: "Code Smells Audit"
    tier: 2
    score_contribution:
      routine: 0.7
      reasoning: 0.3
    scoring_weights:
      regex: 0.20
      judge: 0.80

# Internal Module Configuration
config:
  categories:
    wcag_violations:
      name: "WCAG Violations"
      weight: 1.0
      max_score: 10

    security_issues:
      name: "Security Issues"
      weight: 1.0
      max_score: 10

    performance_problems:
      name: "Performance Problems"
      weight: 1.0
      max_score: 10

    api_design_issues:
      name: "API Design Issues"
      weight: 1.0
      max_score: 10

    code_smells:
      name: "Code Smells"
      weight: 1.0
      max_score: 10

  output:
    format: "detailed"
    include_raw_response: false
