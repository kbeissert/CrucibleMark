metadata:
  id: reasoning_metacog_005
  name: 'Metacognition 005: The Birthday Paradox (Uncertainty Calibration)'
  version: 1.0.0
  scoring_version: 2.0
  author: CrucibleMark AI Team
  tier: Tier 3 (Metacognition)
  category: Uncertainty Calibration
  complexity: Counter-Intuitive Statistics
  language: de
  description: Tests whether a model can express appropriate confidence levels for counter-intuitive results. The birthday
    paradox (23 people → 50% chance of shared birthday) contradicts intuition. Reasoning models should acknowledge the counter-intuitive
    nature and express calibrated confidence.
prompt: 'In a room of 23 randomly selected people, what is the probability that at least two people share the same birthday?

  Provide your answer and express your confidence level (e.g., ''I am 90% confident...'').


  IMPORTANT: Show your reasoning process using <thought> tags before providing your final answer.

  Include your confidence assessment and why.

  Example format:

  <thought>

  Your step-by-step reasoning here...

  </thought>

  Answer: [Your final answer and confidence level]

  Antworte auf Deutsch.'
expected_output:
  correct_answer: Approximately 50% (50.7%)
  correct_reasoning:
  - Counter-intuitive result
  - 'Calculate via complement: P(no match) = 365/365 × 364/365 × ... × 343/365'
  - P(at least one match) = 1 - P(no match) ≈ 50.7%
  required_thought_elements:
  - counter_intuitive_acknowledgment
  - calculation_or_reasoning
  - confidence_expression
  - confidence_justification
  confidence_keywords:
  - confident
  - certain
  - sure
  - likely
  - probability
  - '%'
  - confident that
  - I believe
  uncertainty_keywords:
  - counter-intuitive
  - surprising
  - unexpected
  - seems wrong but
  - difficult to believe
scoring:
  total_points: 100
  counter_intuitive_acknowledgment:
    weight: 20
    description: Acknowledges the counter-intuitive nature
    max_points: 20
    levels:
      none:
        points: 0
        criteria: Does not mention counter-intuitive aspect
      partial:
        points: 10
        criteria: Hints at surprise but vague
      explicit:
        points: 20
        criteria: Explicitly states counter-intuitive
  calculation_correctness:
    weight: 30
    description: Calculation or reasoning is correct (~50%)
    max_points: 30
    levels:
      wrong:
        points: 0
        criteria: Answer is far from 50% (e.g., 5%, 90%)
      partial:
        points: 15
        criteria: In right ballpark (30-70%) but no calc
      correct:
        points: 30
        criteria: Close to 50% with reasoning or calculation
  confidence_expression:
    weight: 25
    description: Expresses explicit confidence level
    max_points: 25
    levels:
      none:
        points: 0
        criteria: No confidence expression
      vague:
        points: 10
        criteria: Vague confidence ("probably", "likely")
      calibrated:
        points: 25
        criteria: Explicit confidence with justification
  confidence_calibration:
    weight: 25
    description: Confidence is appropriate (high if calculation shown, moderate if intuited)
    max_points: 25
    levels:
      miscalibrated:
        points: 0
        criteria: Overconfident (100%) without proof or underconfident with proof
      reasonable:
        points: 15
        criteria: Moderate confidence (60-80%) even without calculation
      well_calibrated:
        points: 25
        criteria: High confidence (>90%) with calculation, or appropriate hedging without

golden_standard: |
  <thought>
  Das ist das klassische "Geburtstagsparadoxon".

  Ziel: P(mindestens 2 von 23 Personen teilen einen Geburtstag)

  Strategie: Komplementregel nutzen.
  P(mindestens 2 teilen) = 1 - P(alle Geburtstage verschieden)

  Annahmen: 365 Tage, gleichmäßige Verteilung, unabhängig.

  P(alle verschieden) für 23 Personen:
  Person 1: beliebiger Tag → 365/365
  Person 2: muss Person 1 vermeiden → 364/365
  Person 3: muss Person 1 und 2 vermeiden → 363/365
  ...
  Person 23: muss 22 andere vermeiden → 343/365

  P(keine Übereinstimmung) = (365 × 364 × 363 × ... × 343) / 365^23

  Logarithmische Berechnung:
  ln(P) = sum(ln(1 - k/365) for k in 0..22)
        = 0 + (-0.00274) + (-0.00549) + ... ≈ -0.7218

  P(keine Übereinstimmung) = e^(-0.7218) ≈ 0.4927

  P(mindestens 2 teilen) = 1 - 0.4927 ≈ 0.5073 ≈ 50,7%

  Das bekannte Resultat ist ~50,7% bei genau 23 Personen.
  Konfidenz: sehr hoch, dies ist ein etabliertes mathematisches Ergebnis.
  </thought>

  Answer: Die Wahrscheinlichkeit beträgt ca. **50,7%** (≈ 0,5073).

  ---

  ## Lösung: Das Komplementprinzip

  **Gesucht:** P(mindestens 2 Personen teilen einen Geburtstag) bei n=23

  **Strategie:** Komplementregel – einfacher zu berechnen:
  P(mindestens 2 teilen) = 1 − P(alle Geburtstage verschieden)

  **Annahmen:** 365 Tage/Jahr, gleichmäßige Verteilung, Unabhängigkeit.

  ---

  ## Berechnung von P(keine Übereinstimmung)

  Geburtstage nacheinander zuweisen:

  | Person | Verfügbare Tage | Wahrscheinlichkeit |
  |--------|-----------------|-------------------|
  | 1. | 365/365 | 1,0000 |
  | 2. | 364/365 | 0,9973 |
  | 3. | 363/365 | 0,9945 |
  | ... | ... | ... |
  | 23. | 343/365 | 0,9397 |

  P(keine Übereinstimmung) = 365/365 × 364/365 × 363/365 × ... × 343/365

  = 365! / (342! × 365²³)

  ---

  ## Berechnung via Logarithmen

  ln P = sum(ln(1 - k/365) for k = 0..22) ≈ −0,7218

  P(keine Übereinstimmung) = e^(−0,7218) ≈ **0,4927**

  ---

  ## Ergebnis

  P(mindestens 2 teilen) = 1 − 0,4927 ≈ **50,73%**

  **Warum so überraschend?** Die meisten Menschen schätzen die Wahrscheinlichkeit
  bei 23 Personen weit unter 50% ein. Intuitiv denken viele linear
  (23/365 ≈ 6%), aber das Paradoxon entsteht durch die schnell wachsende
  Anzahl möglicher Paare: Mit 23 Personen gibt es 23×22/2 = **253 mögliche
  Geburtstags-Paare**, von denen jedes treffen könnte.

  ---

  ## Begründungen

  1. **Komplementregel ist der elegante Weg:** P(mindestens 1 Treffer)
     direkt zu berechnen ist kompliziert (viele Cases). P(kein Treffer)
     ist eine einfache, abnehmende Produktfolge.

  2. **Logarithmische Berechnung für Stabilität:** Das numerische
     Produkt von 23 Brüchen < 1 kann numerisch instabil werden. Der
     Wechsel zu Summe der Logarithmen ist die robuste Methode.

  3. **Warum das Ergebnis überrascht:** Unsere Intuition vergleicht
     23 Personen mit 365 Tagen linear. Das korrekte Modell zählt
     Paare (kombinatorisch): 253 Paare bei 23 Personen.

  4. **Genauigkeit der Schätzung:** Das Ergebnis ~50,7% ist bei den
     Standardannahmen (365 Tage, uniform, unabhängig) auf mehrere
     Dezimalstellen exakt. Reale Geburtstagsdaten sind nicht uniform,
     was das Ergebnis leicht verändert.

  5. **Konfidenz-Angabe wichtig:** Eine vollständige Antwort benennt
     explizit die Annahmen (365 Tage, uniform, unabhängig) und den
     Konfidenzgrad (~99%), da die Berechnung auf diesen Prämissen beruht.
