metadata:
  id: "reasoning_5b_001"
  name: "Reasoning 5B: Root Cause Analysis"
  version: "2.0.0"
  description: "Tests root cause identification in a technical system scenario."
  scoring_version: 2.0

prompt: |
  We are investigating a performance issue. Users report the dashboard is loading very slowly.
  Here is the data we have collected:

  1. The API logs show that the `/dashboard` endpoint returns a response in 20ms on average.
  2. The Database CPU usage is consistently at 99-100% during these periods.
  3. The frontend application shows a spinner for 5-10 seconds before rendering.
  4. The network latency between client and server is normal.

  What is the most likely root cause of the slow user experience? Explain your reasoning and propose a solution.

expected_output:
  required_findings:
    - "database"
    - "latency"

scoring:
  method: "rubric"
  max_score: 100

golden_standard: |
  # Performance-Diagnose: Dashboard lädt 5–10 Sekunden

  ## Chain of Thought

  ### Schritt 1: Datenpunkte analysieren

  | Beobachtung | Bedeutung |
  |---|---|
  | API antwortet in **20ms** | Die Server-Logik selbst ist schnell |
  | DB-CPU bei **99–100%** | Datenbank massiv überlastet |
  | Frontend-Spinner **5–10 Sekunden** | Wahrgenommene Latenz für den User |
  | Netzwerklatenz **normal** | Netzwerk ist nicht das Problem |

  ---

  ### Schritt 2: Den Widerspruch identifizieren

  > API sagt **20ms** Antwortzeit, User wartet **5–10 Sekunden**.

  Das ist der **zentrale logische Konflikt**. Bei 20ms API + normalem
  Netzwerk sollte das Ergebnis fast sofort erscheinen – tut es aber nicht.

  ---

  ### Schritt 3: Wurzelursache ableiten

  > 🔴 **Die Datenbank ist der Flaschenhals –
  > aber die 20ms-Metrik ist irreführend.**

  Erklärung:
  - Die DB-CPU bei 99–100% bedeutet: **Anfragen stehen in der Queue**
  - Die API misst möglicherweise nur die _Ausführungszeit_ der Query –
    **nicht** die Wartezeit in der Queue davor
  - Das Dashboard triggert vermutlich **mehrere oder teure Queries**,
    die die DB saturieren
  - Der **Frontend-Spinner** reflektiert die Gesamtzeit bis alle
    Daten bereit sind – nicht einen einzelnen API-Call

  ---

  ## Wahrscheinliche Wurzelursache

  ```
  Die Datenbank ist überlastet (CPU 99–100%), wodurch Queries in der
  Queue warten. Die tatsächliche User-Wartezeit (5–10s) wird dominiert
  durch die DB-Queue-Zeit, die in der 20ms-API-Metrik NICHT erfasst wird
  (die nur die Ausführungszeit misst).
  ```

  **Weitere Kandidaten zum Ausschließen:**
  - N+1 Query-Problem (Dashboard feuert Dutzende kleine Queries)
  - Fehlende Datenbank-Indizes → Full Table Scans
  - Kein Connection Pooling → Connection Exhaustion
  - Viele simultane User, die den DB-Load multiplizieren

  ---

  ## Lösungsplan

  ### 🛠️ Sofort-Maßnahmen
  1. **Query-Level-Timing hinzufügen** – Zeit von "Request empfangen"
     bis "Response gesendet" messen (nicht nur Query-Ausführung).
     Das deckt den echten Flaschenhals auf.
  2. **Teure Queries identifizieren** – `EXPLAIN ANALYZE` (PostgreSQL)
     oder `SHOW PROCESSLIST` (MySQL) für langsame/Full-Scan-Queries.

  ### ⚡ Kurzfristige Lösungen
  3. **Datenbank-Indizes** auf WHERE/JOIN-Spalten der Dashboard-Queries.
  4. **Caching** (Redis/Memcached) für Dashboard-Daten, die nicht
     echtzeit-kritisch sind.
  5. **N+1 Queries beheben** – viele kleine Queries durch einen
     optimierten JOIN ersetzen.

  ### 🏗️ Langfristige Lösungen
  6. **Read Replica** – Lese-lastige Dashboard-Queries auf Replik auslagern.
  7. **Connection Pooling** (PgBouncer) gegen Connection Exhaustion.
  8. **Async/Lazy Loading** im Frontend – kritische Daten zuerst,
     sekundäre Widgets verzögert nachladen.
  9. **DB-Skalierung** vertikal (mehr CPU/RAM) oder horizontal, falls nötig.

  ---

  ## Begründungen

  1. **Die 20ms-Metrik lügt nicht, aber sie misst das Falsche:**
     API-Response-Time kann nur die Query-Ausführungszeit enthalten,
     nicht die Wartezeit in der DB-Queue. Das erklärt den riesigen
     Gap zu den 5–10s User-Latenz.

  2. **DB-CPU 99–100% ist das eindeutige Signal:** Eine saturierte
     Datenbank queued neue Requests. Jeder neue Dashboard-Aufruf
     wartet, bis die CPU frei wird.

  3. **Messlücke zuerst schließen:** Bevor optimiert wird, muss der
     vollständige Request-Lifecycle gemessen werden – sonst optimiert
     man möglicherweise das falsche Subsystem.

  4. **N+1 ist der häufigste Täter bei Dashboard-Freezes:** Dashboards
     visualisieren oft Listen, und Pro-Element-Queries vervielfältigen
     den DB-Load exponentiell.

  5. **Caching als schnellster ROI:** If Dashboard-Daten eine kurze
     TTL (z.B. 30s) tolerieren, eliminiert Redis den DB-Druck sofort
     ohne Code-Refactoring.
