metadata:
  id: "reasoning_5b_001"
  name: "Reasoning 5B: Root Cause Analysis"
  version: "2.0.0"
  description: "Tests root cause identification in a technical system scenario."
  scoring_version: 2.0

prompt: |
  We are investigating a performance issue. Users report the dashboard is loading very slowly.
  Here is the data we have collected:

  1. The API logs show that the `/dashboard` endpoint returns a response in 20ms on average.
  2. The Database CPU usage is consistently at 99-100% during these periods.
  3. The frontend application shows a spinner for 5-10 seconds before rendering.
  4. The network latency between client and server is normal.

  What is the most likely root cause of the slow user experience? Explain your reasoning and propose a solution.

expected_output:
  required_findings:
    - "database"
    - "latency"

scoring:
  method: "rubric"
  max_score: 100
