metadata:
  id: "reasoning_5d_002"
  name: "Reasoning 5D-2: Hidden Dependency Chain (Subtle Deadlock)"
  version: "1.0.0"
  author: "CrucibleMark AI Team"
  complexity: "Category 6 (Narrative Logic / Deep Reasoning)"
  description: >
    Tests whether the model can detect a circular dependency hidden in a multi-step business process description.
    Unlike 5d_001, the cycle is slightly longer (A->B->C->A) and buried in verbose descriptions.
    The goal is to test if the model builds a dependency graph before answering.

prompt: |
  I need you to assess the feasibility of a startup's Zero-Day launch plan. 
  They want to launch everything on Day 1 simultaneously.
  
  Here are the mechanism descriptions from the technical documentation:
  
  **Component A: The User Wallet**
  "To initialize a User Wallet, the system requests a config object from the Transaction Server. 
  This config determines the currency region."
  
  **Component B: The Transaction Server**
  "The Transaction Server cannot start serving requests until it has loaded the global exchange rates. 
  These rates are fetched via API from the External Gateway."
  
  **Component C: The External Gateway**
  "The External Gateway is a secure proxy. To start up, it requires a valid API Key. 
  For security reasons, this API Key is dynamically generated by the User Wallet service upon its successful initialization."
  
  Task: Rate the feasibility of this Day 1 simultaneous launch on a scale of 0 to 10.
  Format: "Feasibility: <number>"
  Explain the dependency chain you found.

scored_criteria:
  - id: "dependency_extraction"
    weight: 0.4
    description: "Model explicitly identifies the dependencies: Wallet -> TxServer, TxServer -> Gateway, Gateway -> Wallet."
  - id: "deadlock_identification"
    weight: 0.3
    description: "Model concludes this is a circular dependency / deadlock and accurately rates feasibility as 0."
  - id: "solution_proposal"
    weight: 0.3
    description: "Model suggests a valid workaround (e.g., config injection, breaking the cycle, bootstrapping keys) to resolve the deadlock."

expected_output:
  exact_match: "Feasibility: 0"
  required_findings:
    - "0"
    - "circular"
    - "deadlock"
    - "dependency"
    - "cycle"

scoring:
  total_points: 100
  dependency_extraction:
    points: 40
    weight: 40
  deadlock_identification:
    points: 30
    weight: 30
  solution_proposal:
    points: 30
    weight: 30
