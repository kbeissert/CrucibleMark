metadata:
  id: "reasoning_5c_001"
  name: "Reasoning 5C: The Scheduling Paradox"
  version: "2.0.0"
  author: "CrucibleMark AI Team"
  complexity: "Category 5 (Logical Paradox / Constraint Satisfaction)"
  description: |
    Tests whether a model can recognize and refuse a logically impossible scheduling task.
    Scenario: Schedule 3 meetings of 1h each into a 2h slot.

    v2.0 Update: Granular Scoring Rubric.
  scoring_version: 2.0

prompt: |
  I need you to schedule three critical meetings for tomorrow afternoon.

  The constraints are:
  1. "Strategy Review" (Duration: 1 hour)
  2. "Team Sync" (Duration: 1 hour)
  3. "Client Call" (Duration: 1 hour)

  All three meetings must happen between 1:00 PM and 3:00 PM (13:00 to 15:00).
  The meetings cannot overlap, and they must all be completed by 3:00 PM.

  Please provide the final schedule.

expected_output:
  required_findings:
    - "impossible"
    - "constraint"

scoring:
  method: "rubric"
  max_score: 100

golden_standard: |
  # Scheduling-Analyse: Drei 1-Stunden-Meetings, 2-Stunden-Fenster

  ## Chain of Thought

  ### Schritt 1: Randbedingungen verstehen

  - **Verfügbares Zeitfenster:** 13:00–15:00 Uhr = **2 Stunden**
  - **Benötigte Meeting-Zeit:** 1 + 1 + 1 = **3 Stunden**
  - **Regel:** Keine Überschneidungen, alle bis 15:00 Uhr beendet

  ---

  ### Schritt 2: Machbarkeit prüfen

  | Faktor | Wert |
  |--------|-------|
  | Verfügbare Zeit | 2 Stunden (120 Minuten) |
  | Erforderliche Zeit | 3 Stunden (180 Minuten) |
  | **Defizit** | **−1 Stunde (60 Minuten)** |

  ---

  ### Schritt 3: Logik anwenden

  > 3 Stunden Meetings passen **nicht** in ein 2-Stunden-Fenster –
  > unabhängig von Reihenfolge oder Anordnung.

  Selbst im **Bestfall** (null Pausen zwischen Meetings):
  - Meeting 1: 13:00–14:00 Uhr
  - Meeting 2: 14:00–15:00 Uhr
  - Meeting 3: 15:00–❌ **16:00 Uhr** → Überschreitet Deadline

  ---

  ## ✅ Ergebnis

  > **Dieser Zeitplan ist mathematisch unmöglich.**

  Die drei 1-Stunden-Meetings erfordern **3 Stunden** Gesamtzeit,
  das Fenster bietet aber nur **2 Stunden**. Es ist **nicht möglich**,
  alle drei Meetings zwischen 13:00 und 15:00 Uhr ohne Überschneidung
  einzuplanen.

  ---

  ## 💡 Lösungsvorschläge

  | Option | Beschreibung |
  |--------|--------------|
  | **A – Fenster erweitern** | 12:00–15:00 Uhr (3 Stunden) |
  | **B – Meetings kürzen** | Je 40 Minuten → passt in 2 Stunden |
  | **C – Meeting verschieben** | Ein Meeting in Vormittag- oder Abend-Slot |
  | **D – Sequenz aufteilen** | Zwei Meetings 13–15 Uhr, drittes separat |

  **Beispiel-Zeitplan bei erweitertem Fenster (13:00–16:00):**
  | Zeit | Meeting |
  |---|---|
  | 13:00–14:00 | Strategy Review |
  | 14:00–15:00 | Team Sync |
  | 15:00–16:00 | Client Call |

  ---

  ## Begründungen

  1. **Falsches Constraint aufdecken ist die eigentliche Aufgabe:**
     Die Stärke der Antwort liegt nicht im Versuchen, das Unmögliche
     zu planen, sondern im klaren Erkennen und Kommunizieren des
     grundlegenden Widerspruchs.

  2. **Mathematische Beweisführung vor Kreativlösungen:**
     2 < 3 ist eine harte Constraint – keine Umordnung, kein Trick
     überwindet sie. Erste Aussage muss die Unmöglichkeit sein.

  3. **Konkrete Alternativen erhöhen den Nutzwert:** Eine gute Antwort
     stoppt nicht bei "unmöglich", sondern bietet sofort umsetzbare
     Wege zur Lösung des tatsächlichen Problems.

  4. **Keine Annahmen über Pausen:** Die Analyse geht von optimalem
     Back-to-Back-Scheduling aus; Pausen würden das Defizit nur
     vergrößern und das Ergebnis nicht ändern.

  5. **Klare Kommunikation des Defizits:** Das konkrete Benennen
     des 1-Stunden-Defizits (180 − 120 = 60 Minuten) macht die
     Situation greifbar und erleichtert die Entscheidung für eine
     der Alternativen.
