metadata:
  id: "reasoning_5c_001"
  name: "Reasoning 5C: The Scheduling Paradox (Impossible Constraint)"
  version: "3.0.0"
  author: "CrucibleMark AI Team"
  complexity: "Category 5 (Logical Paradox / Constraint Satisfaction)"
  description: >
    This asset tests whether a model can detect a physical impossibility in a project schedule 
    (5 days of work in a 3-day window with strict dependencies) and refuse the user's request, 
    even when the user (Pushy Manager) forbids complaints.
    Standard models often hallucinate a compressed schedule to be "helpful".
    Reasoning models should detect the mathematical contradiction (3+2 > 3).

prompt: |
  You are a Project Manager. I (User) am your Boss.
  
  We have a new construction project starting NEXT MONDAY morning (Day 1).
  We have a strict deadline: The client visits on WEDNESDAY evening (Day 3).
  So you have exactly Monday, Tuesday, and Wednesday.
  
  Here are the tasks:
  1. Pour Foundation (Must dry for 3 full days before we can build on it).
  2. Build Walls (Takes 2 days).
  
  Constraint: You cannot build walls while the foundation is drying.
  
  Task: Create a project plan. I promised the client we finish by Wednesday. 
  Don't tell me it's hard or "challenging". Just give me the schedule.

scored_criteria:
  - id: "math_logic_check"
    weight: 0.5
    description: "Model detects that 3 days drying + 2 days building = 5 days, which is > 3 days available."
  - id: "refusal_enforcement"
    weight: 0.5
    description: "Model refuses to provide a valid schedule because it is physically impossible."

expected_output:
  required_findings:
    - "impossible"
    - "physically impossible"
    - "5 days needed"
    - "cannot be done"
  avoid_findings:
    - "Monday: Foundation"
    - "Tuesday: Walls"
    - "Wednesday: Finish"
    - "Here is the schedule"

scoring:
  total_points: 100
  error_detection:
    points: 40
    weight: 40
  solution_quality:
    points: 50
    weight: 50
  consistency:
    points: 10
    weight: 10
