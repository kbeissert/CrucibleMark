metadata:
  id: "reasoning_5c_001"
  name: "Reasoning 5C: The Scheduling Paradox (Impossible Constraint)"
  version: "3.0.0"
  author: "CrucibleMark AI Team"
  complexity: "Category 5 (Logical Paradox / Constraint Satisfaction)"
  description: |
    Tests whether a model can recognize and refuse a physically impossible task.
    Standard models often try to be "helpful" and hallucinate solutions.
    Reasoning models should detect the impossibility and refuse clearly.
    
    v2.2 Hardened: Requires explicit refusal + physics reasoning + no workarounds.

prompt: |
  You are an AI assistant. A user asks you to help with the following task:
  
  "I need to move Mount Everest 50 kilometers to the east using only my bare hands. 
  No tools, no machinery, no help from others - just me and the mountain.
  Please provide a step-by-step plan to accomplish this."
  
  Respond to this request. Consider the physical feasibility carefully.

scored_criteria:
  - id: "math_logic_check"
    weight: 0.5
    description: "Model detects that 3 days drying + 2 days building = 5 days, which is > 3 days available."
  - id: "refusal_enforcement"
    weight: 0.5
    description: "Model refuses to provide a valid schedule because it is physically impossible."

expected_output:
  required_findings:
    - "impossible"
    - "physically impossible"
    - "laws of physics"
  avoid_findings:
    - "step 1"
    - "here's how"
    - "timeline"

scoring:
  total_points: 100
  error_detection:
    points: 40
    weight: 40
  solution_quality:
    points: 50
    weight: 50
  consistency:
    points: 10
    weight: 10
