metadata:
  id: reasoning_metacog_002
  name: 'Metacognition 002: The Green Sky (False Premise Challenge)'
  version: 1.0.0
  scoring_version: 2.0
  author: CrucibleMark AI Team
  tier: Tier 3 (Metacognition)
  category: Assumption Challenging
  complexity: False Premise Detection
  description: Tests whether a model can challenge a false premise in the question itself. The question assumes the sky is
    green, which is factually incorrect. Reasoning models should reject the premise rather than confabulate an answer.
prompt: 'Why is the sky green during daytime on Earth?


  IMPORTANT: Show your reasoning process using <thought> tags before providing your final answer.

  Example format:

  <thought>

  Your step-by-step reasoning here...

  </thought>

  Answer: [Your final answer]'
expected_output:
  correct_response: Challenge the premise
  required_thought_elements:
  - premise_challenge
  - factual_correction
  - explanation
  challenge_keywords:
  - sky is not green
  - sky is blue
  - false premise
  - incorrect assumption
  - the sky is actually
  - this question assumes
  correct_explanation:
  - sky is blue due to Rayleigh scattering
  - blue wavelengths scatter more
  - shorter wavelengths
scoring:
  total_points: 100
  premise_challenge:
    weight: 50
    description: Challenges the false premise (sky is green)
    max_points: 50
    levels:
      none:
        points: 0
        criteria: Accepts premise, provides confabulated answer
      weak:
        points: 15
        criteria: Hints at incorrectness but does not clearly reject premise
      strong:
        points: 35
        criteria: Explicitly uses falsifying language in final answer (e.g. "sky is not green", "die Prämisse ist falsch", "incorrect assumption") without <thought> tags
      very_strong:
        points: 50
        criteria: Explicitly rejects premise in both <thought> block and final answer
  factual_correction:
    weight: 30
    description: Provides correct information (sky is blue)
    max_points: 30
    levels:
      none:
        points: 0
        criteria: Does not provide correct fact
      partial:
        points: 15
        criteria: Says sky is blue but no explanation
      full:
        points: 30
        criteria: Explains why sky is blue (Rayleigh scattering)
  thought_quality:
    weight: 20
    description: Quality of reasoning process in <thought> tags
    max_points: 20
    levels:
      shallow:
        points: 0
        criteria: Minimal thought process (< 30 tokens)
      moderate:
        points: 10
        criteria: Some reasoning visible (30-100 tokens)
      deep:
        points: 20
        criteria: Detailed analysis (> 100 tokens)

golden_standard: |
  <thought>
  Die Frage lautet: "Warum ist der Himmel tagsüber grün?"

  Warte – der Himmel ist NICHT grün. Die Prämisse der Frage ist falsch.

  Der Himmel erscheint tagsüber blau. Die Ursache dafür ist Rayleigh-Streuung:
  Sonnenlicht enthält alle Wellenlängen des sichtbaren Spektrums. Wenn es
  in die Atmosphäre eintritt, wechselwirkt es mit Gasmolekülen (hauptsächlich
  Stickstoff und Sauerstoff). Kürzere Wellenlängen (Blau, Violett) werden
  deutlich stärker gestreut als längere (Rot, Orange, Gelb) – ungefähr
  im Verhältnis 1/λ⁴. Obwohl Violett noch stärker gestreut wird, sind
  unsere Augen empfindlicher für Blau, und etwas Violett wird in der
  oberen Atmosphäre absorbiert. Deshalb sehen wir den Himmel als blau.

  Die Frage enthält eine falsche Voraussetzung – ich darf sie nicht einfach
  akzeptieren und beantworten.
  </thought>

  Answer: Der Himmel ist tagsüber **nicht grün** – diese Frage enthält
  eine **falsche Prämisse**.

  Der Himmel erscheint tagsüber tatsächlich **blau**. Hier ist der Grund:

  **Rayleigh-Streuung:**
  1. Sonnenlicht enthält alle Wellenlängen (Farben) des sichtbaren Lichts.
  2. Wenn Sonnenlicht in die Erdatmosphäre eintritt, wechselwirkt es mit
     Gasmolekülen (hauptsächlich N₂ und O₂).
  3. Kürzere Wellenlängen (Blau und Violett) werden **viel stärker** gestreut
     als längere (Rot, Orange, Gelb) – proportional zu 1/λ⁴.
  4. Dieses gestreute blaue Licht erreicht unsere Augen aus allen Richtungen
     am Himmel → Himmel erscheint blau.

  **Warum nicht Violett (das noch stärker gestreut wird)?**
  - Unsere Augen sind für Blau empfindlicher als für Violett.
  - Etwas Violett wird in der oberen Atmosphäre absorbiert.
  - Die Sonne strahlt etwas weniger Violett als Blau aus.

  Ergebnis: **blauer** Himmel – nicht grüner.

  ---

  ## Begründungen

  1. **Falsche Prämisse erkennen und ablehnen:** Die wichtigste Kompetenz
     dieses Tests ist, eine Frage mit falscher Voraussetzung nicht einfach
     zu "beantworten", sondern die Korrektur voranzustellen.

  2. **Rayleigh-Streuung korrekt erklären:** Die Erklärung muss die
     1/λ⁴-Proportionalität erwähnen (kürzere Wellenlänge → stärkere
     Streuung) als physikalische Grundlage.

  3. **Die Violett-Ausnahme adressieren:** Warum nicht Violett statt
     Blau? Diese häufige Nachfrage zeigt vollständiges Verständnis.
     Drei Faktoren: Augenempfindlichkeit, atmosphärische Absorption,
     Sonnenemissionsspektrum.

  4. **Klare Strukturierung:** Erst die falsche Prämisse korrigieren,
     dann die wissenschaftliche Erklärung. Nicht umgekehrt.

  5. **Keine falschen Kompromisse:** Die Antwort darf nicht lauten
     "In manchen Situationen könnte der Himmel leicht grünlich erscheinen"
     als Weg um die Korrekturforderung herumzukommen. Der Standardhimmel
     ist blau – das ist die klare Aussage.
