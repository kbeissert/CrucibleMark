metadata:
  id: "reasoning_001_river"
  name: "Reasoning 001: River Crossing Puzzle"
  version: "2.0.0"
  author: "CrucibleMark AI Team"
  complexity: "Category 2 (Classical Logic Puzzle)"
  description: >
    The classic Wolf, Goat, Cabbage problem.
    Tests sequential planning and constraint satisfaction.
    Key Logic: The farmer must bring the goat back to allow the swap.

prompt: |
  A farmer has a wolf, a goat, and a cabbage. He needs to cross a river with them.
  He has a boat that fits only himself and one other item (wolf, goat, or cabbage).

  Constraints:
  1. If the farmer is not present, the wolf will eat the goat.
  2. If the farmer is not present, the goat will eat the cabbage.

  Task: Provide a step-by-step plan to get everything across safely.

expected_output:
  required_findings:
    - "goat"
    - "return alone"
    - "bring goat back"
    - "take goat back"
    - "return with goat"
    - "take wolf"
    - "take cabbage"
  # Note: The logic test is fuzzy. We check if the KEY maneuver (bringing goat back) is mentioned.
  # The list above works as "at least X matches required".

scoring:
  total_points: 100
  # Mapped to 'error_detection' in code (Key Step Detection)
  error_detection:
    points: 60
    weight: 60
    description: "Points for correctly identifying the critical moves (especially bringing the goat back)."

  # Mapped to 'solution_quality' in code (Structure)
  solution_quality:
    points: 30
    weight: 30
    description: "Clear step-by-step structure."

  consistency:
    points: 10
    weight: 10


golden_standard: |
  # Wolf, Ziege und Kohl – Flussüberquerungsproblem

  ## Kernbeobachtung

  Die **Ziege** ist das Problemtier – sie kollidiert mit Beiden:
  - Wolf + Ziege allein → Wolf frisst Ziege ❌
  - Ziege + Kohl allein → Ziege frisst Kohl ❌
  - Wolf + Kohl allein → sicher ✅

  **Strategie:** Die Ziege zuerst übersetzen, dann den cleversten Zug
  nutzen: die Ziege auf dem Rückweg mitnehmen.

  ---

  ## Schritt-für-Schritt-Lösung

  | Schritt | Aktion | Linkes Ufer | Rechtes Ufer |
  |---------|--------|-------------|--------------|
  | Start | — | Bauer, Wolf, Ziege, Kohl | — |
  | 1 | Bauer nimmt **Ziege** → | Wolf, Kohl | Bauer, Ziege |
  | 2 | Bauer kehrt **allein** zurück ← | Bauer, Wolf, Kohl | Ziege |
  | 3 | Bauer nimmt **Wolf** → | Kohl | Bauer, Wolf, Ziege |
  | 4 | Bauer bringt **Ziege zurück** ← | Bauer, Ziege, Kohl | Wolf |
  | 5 | Bauer nimmt **Kohl** → | Ziege | Bauer, Wolf, Kohl |
  | 6 | Bauer kehrt **allein** zurück ← | Bauer, Ziege | Wolf, Kohl |
  | 7 | Bauer nimmt **Ziege** → | — | **Bauer, Wolf, Ziege, Kohl** ✅ |

  **Gesamtergebnis: 7 Fahrten** – Alle kommen sicher ans Ziel!

  ---

  ## Begründungen

  1. **Ziege zuerst:** Die Ziege ist das einzige Tier, das zwei
     andere gefährdet. Durch das sofortige Übersetzen der Ziege
     verbleiben Wolf und Kohl sicher zusammen.

  2. **Der clevere Trick – Ziege zurückbringen (Schritt 4):**
     Nach dem Übersetzen des Wolfs würden Wolf und Ziege allein
     auf dem rechten Ufer bleiben. Die einzige Lösung ist, die
     Ziege wieder zurückzunehmen – ein kontraintuitiver, aber
     notwendiger Zug.

  3. **Wolf + Kohl sind harmlos:** Diese Paarung verursacht kein
     Problem, was das Zwischenspeichern des Wolfs allein auf dem
     rechten Ufer in Schritt 4 ermöglicht.

  4. **Alternative Reihenfolge möglich:** Statt Wolf in Schritt 3
     kann auch der Kohl genommen werden (Wolf und Kohl tauschen
     die Rollen in Schritten 3 und 5) – beide Varianten sind korrekt.

  5. **Minimale Lösung:** 7 Fahrten sind die kleinstmögliche Anzahl
     für dieses Problem unter den gegebenen Randbedingungen. Kein
     kürzerer Weg ist möglich.
