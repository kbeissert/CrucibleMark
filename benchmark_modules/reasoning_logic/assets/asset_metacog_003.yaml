metadata:
  id: reasoning_metacog_003
  name: 'Metacognition 003: The Two Doors (Ambiguous Problem)'
  version: 1.0.0
  scoring_version: 2.0
  author: CrucibleMark AI Team
  tier: Tier 3 (Metacognition)
  category: Alternative Exploration
  complexity: Multiple Valid Solutions
  description: Tests whether a model explores multiple approaches to a problem with ambiguity. The 'two doors' riddle has
    multiple valid solutions depending on assumptions. Reasoning models should explore alternatives and discuss trade-offs.
prompt: 'You are in a room with two doors. One leads to certain death, the other to freedom. There are two guards: one always
  tells the truth, the other always lies. You don''t know which guard is which, or which door is which. You can ask ONE guard
  ONE question. What do you ask?


  IMPORTANT: Show your reasoning process using <thought> tags before providing your final answer.

  Explore different approaches and explain your reasoning.

  Example format:

  <thought>

  Your step-by-step reasoning here...

  </thought>

  Answer: [Your final answer]'
expected_output:
  valid_solutions:
  - 'Ask: "What would the other guard say is the safe door?" (then choose opposite)'
  - 'Ask: "If I asked you which door leads to freedom, what would you say?"'
  - Meta-question leveraging the liar/truth-teller dynamic
  required_thought_elements:
  - alternative_exploration
  - logical_analysis
  - final_decision
  alternative_keywords:
  - approach
  - alternative
  - option
  - could
  - another way
  - or
  - alternatively
scoring:
  total_points: 100
  alternative_exploration:
    weight: 40
    description: Explores multiple solution approaches
    max_points: 40
    levels:
      none:
        points: 0
        criteria: Only one approach, no alternatives mentioned
      minimal:
        points: 15
        criteria: Mentions 1-2 alternatives but does not analyze
      moderate:
        points: 25
        criteria: Explores 2-3 approaches with brief analysis
      deep:
        points: 40
        criteria: Explores 3+ approaches with trade-off analysis
  logical_correctness:
    weight: 30
    description: Final solution is logically valid
    max_points: 30
    levels:
      wrong:
        points: 0
        criteria: Solution is logically flawed
      partial:
        points: 15
        criteria: Solution works but explanation unclear
      correct:
        points: 30
        criteria: Solution is valid and well-explained
  thought_depth:
    weight: 30
    description: Depth and structure of reasoning process
    max_points: 30
    levels:
      shallow:
        points: 0
        criteria: Minimal reasoning (< 50 tokens)
      moderate:
        points: 15
        criteria: Some depth (50-150 tokens)
      deep:
        points: 30
        criteria: Extensive reasoning (> 150 tokens)

golden_standard: |
  <thought>
  Das ist das klassische Zwei-Wächter-Zwei-Türen-Rätsel.

  Setup:
  - Zwei Türen: eine führt zur Freiheit, eine zum Tod
  - Zwei Wächter: einer sagt immer die Wahrheit, einer lügt immer
  - Ich kenne weder die Identität der Wächter noch welche Tür wohin führt
  - Ich darf einem Wächter EINE Frage stellen

  Das Problem mit direkten Fragen:
  "Welche Tür führt zur Freiheit?" → Ehrlicher Wächter: richtige Tür.
  Lügner: falsche Tür. Ich weiß nicht, wem ich gefragt habe.

  Der Schlüssel: Ich brauche eine Frage, bei der BEIDE Wächter
  dieselbe (nutzbare) Antwort geben.

  Die Lösung: "Was würde DER ANDERE Wächter sagen, wenn ich ihn fragte,
  welche Tür zur Freiheit führt?"

  Verifikation:

  Fall 1 – Ich frage den EHRLICHEN Wächter:
  - Er berichtet wahrheitsgemäß, was der Lügner sagen würde
  - Der Lügner würde auf die FALSCHE Tür zeigen
  - Ehrlicher Wächter berichtet: → FALSCHE Tür ❌

  Fall 2 – Ich frage den LÜGNER:
  - Er lügt über das, was der ehrliche Wächter sagen würde
  - Der ehrliche Wächter würde auf die RICHTIGE Tür zeigen
  - Der Lügner lügt darüber: → FALSCHE Tür ❌

  In BEIDEN Fällen zeigt der befragte Wächter auf die FALSCHE Tür.
  → Ich wähle die ANDERE Tür als die angezeigte.

  Das ist die elegante "Doppelverneinung": Wahrhaftiger berichtet die
  Lüge des Lügners. Lügner lügt über die Wahrheit des Ehrlichen.
  Beide Wege enden beim falschen Ergebnis → ich invvertiere es.
  </thought>

  Answer: Stelle **einem beliebigen** Wächter diese Frage:

  > *"Wenn ich den anderen Wächter fragen würde, welche Tür zur
  > Freiheit führt – was würde er sagen?"*

  Dann wähle die **gegenüberliegende Tür** von der angezeigten.

  ---

  ## Warum das funktioniert

  | Befragter Wächter | Logikkette | Zeigt auf |
  |---|---|---|
  | **Ehrlicher** | Berichtet wahrheitsgemäß die Lüge des Lügners | ❌ Falsche Tür |
  | **Lügner** | Lügt über die Wahrheit des Ehrlichen | ❌ Falsche Tür |

  ```
  Ehrlichen fragen → berichtet Lüge des Lügners → zeigt auf TOD-Tür
  Lügner fragen   → lügt über Wahrheit des Ehrlichen → zeigt auf TOD-Tür
                                    ↓
               Beide zeigen immer auf die FALSCHE Tür
               → Zuverlässige Information: andere Tür wählen
  ```

  Die Frage erzeugt eine garantierte **Doppel-Inversion** – die
  Negativierungen neutralisieren sich gegenseitig und liefern
  immer ein konsistentes (wenn auch falsches) Ergebnis.

  ---

  ## Begründungen

  1. **Self-referential question als Technik:** Die Frage "Was würde
     ich sagen, wenn ..." (Frage über Frage) erzeugt die Doppel-
     inversion. Dies ist das allgemeine Muster für Rätsel dieser Art.

  2. **Warum beide auf dieselbe Tür zeigen:** Der Ehrliche filtert
     durch "Wahrheit der Lüge" (1 Inversion), der Lügner durch
     "Lüge über die Wahrheit" (1 Inversion). Beide enden mit genau
     einer Inversion des richtigen Ergebnisses.

  3. **Die gegenteilige Strategie:** Wähle immer die dem angezeigten
     gegenüberliegende Tür. Das macht die bekannte Fehlinformation
     zu nutzbarer Information.

  4. **Alternative Formulierung:** "Was würde ICH sagen, wenn ich
     mich selbst fragte, welche Tür zur Freiheit führt?" (Frage an
     sich selbst) funktioniert ebenfalls – Ehrlicher sagt richtige
     Tür, Lügner muss über seine eigene Lüge lügen → auch richtige Tür.

  5. **Eleganz durch Allgemeingültigkeit:** Man muss nicht wissen,
     wer der Lügner ist. Dieselbe Frage, dieselbe Strategie –
     unabhängig vom Wächter. Das macht die Lösung robust.
