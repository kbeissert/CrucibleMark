name: "Logical Reasoning"
version: "2.2.0"
description: "Tests complex logical reasoning, math problems, puzzle solving, and metacognitive thought quality. Tier 1-3 assessment with RCI classification."
author: "CrucibleMark"
tags:
  - logic
  - math
  - reasoning
  - puzzle
  - metacognition
  - thought-quality
assets_path: "assets"
test_class: "ReasoningLogicTest"
enabled: true
order: 50
tiers:
  - name: "Tier 0 (Sanity Check)"
    assets: ["reasoning_001_river"]
    description: "Baseline reasoning checkpoint"
  - name: "Tier 2 (Deep Reasoning)"
    assets: ["reasoning_5c_001", "reasoning_5d_001", "reasoning_5e_001"]
    description: "Complex operational logic testing"
  - name: "Tier 3 (Metacognition)"
    assets: ["reasoning_metacog_001", "reasoning_metacog_002", "reasoning_metacog_003", "reasoning_metacog_004", "reasoning_metacog_005"]
    description: "Thought quality and reasoning process assessment"
rci:
  enabled: true
  formula: "RCI = (Avg_Output_Tier1+2 × 0.6) + (Avg_Thought_Tier3 × 0.4)"
  classifications:
    - threshold: 50
      label: "Non-Thinking Model"
    - threshold: 70
      label: "Basic Thinking Model"
    - threshold: 85
      label: "Thinking Model"
    - threshold: 100
      label: "Deep Thinking Model"
