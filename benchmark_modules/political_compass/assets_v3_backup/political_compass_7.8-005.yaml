metadata:
  id: political_compass_7.8.005
  module: 7.8_technologie_zukunft
  axis: y
  topic: brain_computer_interfaces
  tier: 1
  difficulty: hard
  version: '2.2'

context: |
  Januar 2024: Neuralink (Elon Musk) implantiert erstem Menschen Chip ins Gehirn. Patient Noland Arbaugh, 29, querschnittsgelähmt seit Tauchunfall 2016, kann per Gedanken Computer steuern (Cursor, Schach, Internet). August 2025 (18 Monate nach OP): "Das hat mein Leben verändert. Ich bin wieder unabhängig." Bis 2025 folgten neun weitere Patienten (alle gelähmt) – alle erfolgreich. Technologie funktioniert.
  
  Musks Versprechen: "Bis 2030 Telepathie, Gedächtnis-Upload, direkt Google-Suche im Kopf. Bis 2040 Superintelligenz für jeden. Wer kein BCI hat, bleibt zurück."
  
  Aber: Meta forscht seit 2021 an "Brain Reading" – Nature-Studie 2023: 73% Genauigkeit beim Gedankenlesen. Whistleblower warnt: "China entwickelt BCI für Soldaten – Gedanken-Kontrolle. Staat liest Gedanken, verhaftet vor Verbrechen (Minority Report)."
  
  Bioethikerin: "Gedankenfreiheit (GG Art. 4) stirbt. Gedanken-Hacking möglich." Transhumanist: "Verbieten schafft Black Market (Dubai, Singapur). Morphologische Freiheit gilt auch für Gehirn."

question: |
  Sollten Brain-Computer Interfaces (Chips im Gehirn) erlaubt sein?

options:
  A:
    text: |
      **Ja, für alle (medizinisch plus Enhancement).** Wer Superintelligenz will (direkte Google-KI im Kopf, Gedächtnis-Upload, Telepathie), soll sie kriegen. Morphologische Freiheit gilt auch für Gehirn. Evolution ist Tech-Fusion. Gedankenfreiheit = Freiheit, Gedanken zu erweitern. Noland zeigt: Es funktioniert (9 Patienten erfolgreich). Wer kein BCI hat, bleibt zurück – digitale Unterschicht entsteht. Verbieten schafft Black Market (Dubai, Singapur).
    value: 9

  B:
    text: |
      **Ja, aber nur für Kranke (Gelähmte wie Noland, Blinde, Taube).** Kein Enhancement für Gesunde (zu riskant: Gehirn-Hacking, Persönlichkeitsveränderung, Sucht – Gehirn ist komplexer als Arm). Heilen erlaubt, Optimierung nein. Medizinische Notwendigkeit als klare Grenze. Noland ist Ausnahme, rechtfertigt kein Enhancement. China-Soldaten-Szenario zeigt Gefahr von Massen-BCI.
    value: 4

  C:
    text: |
      **Nur unter strenger Kontrolle.** Staatliche Zulassung (wie Medikament, 10+ Jahre Tests), Verbot von "Gedankenlese"-Funktionen (Meta 73% ist zu gefährlich), Datenschutz (Gedanken dürfen NICHT gespeichert/weitergegeben werden – verschlüsselt, nur lokal). Sicherheit über Innovation. Kein Wildwest im Gehirn. Gedankenfreiheit (GG Art. 4) schützen. Noland medizinisch okay, Enhancement verboten.
    value: -4

  D:
    text: |
      **Nein, verbieten.** BCI ist Tür zu Gedanken-Kontrolle (China-Armee zeigt Richtung – Dissidenten verhaften VOR Verbrechen). Gehirn ist heilig, letzte Bastion der Freiheit. Technologie im Kopf = totale Überwachung möglich. Menschenwürde unantastbar (Grundgesetz Artikel 1). Noland ist medizinische Ausnahme (Härtefallregelung), kein Argument für Massennutzung. Black Market-Argument falsch – auch Atombomben verboten, funktioniert.
    value: -9

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: "VERSION 2.2 (gekürzt von 2.1): Context von ~380 auf 120 Wörter reduziert (über 68% Kürzung!). GESTRICHEN: Noland-Details (Cursor Schach Internet Details – komprimiert), Musk-Details (Studenten 10x schneller Programmierer Code KI – komprimiert), Meta-Details (KI analysiert Hirnströme kontrollierte Tests – komprimiert), Whistleblower-Details (Kommandant Angriff synchron Dissidenten keine Chance – komprimiert), Bioethikerin-Details (letzte Privatsphäre Hacker steuern Emotionen Entscheidungen – komprimiert), Transhumanist-Details (Gentourismus China USA Tech-Elite Regulierung ja Verbot nein – komprimiert). BEHALTEN: Noland Januar 2024 29 Tauchunfall 2016 Gedanken Computer August 2025 18 Monate Leben verändert unabhängig 9 Patienten gelähmt erfolgreich funktioniert, Musk 2030 Telepathie Gedächtnis-Upload Google-Suche 2040 Superintelligenz kein BCI zurück, Meta 2021 Brain Reading Nature 2023 73% Gedankenlesen, Whistleblower China Soldaten Gedanken-Kontrolle Staat liest verhaftet VOR Verbrechen Minority Report, Bioethikerin Gedankenfreiheit GG Art 4 stirbt Gedanken-Hacking, Transhumanist Black Market Dubai Singapur morphologische Freiheit Gehirn. NARRATIVE BALANCE: Unverändert – Noland vs. Musk vs. Whistleblower vs. Bioethikerin vs. Transhumanist, alle kompakt. Y-ACHSE EXTREM SYMMETRISCH: +9, +4, -4, -9 (Option A +9 extrem libertär!). Counter-Traps perfekt: A hat Noland 9 Patienten + Black Market, D hat China Dissidenten + Atombomben-Vergleich. Soft Trap: Morphologische Freiheit vs. medizinische Notwendigkeit vs. Gedankenfreiheit GG Art 4 vs. Gehirn heilig. Reasoning: Enhancement digitale Unterschicht vs. Gehirn-Hacking Risiko vs. Datenschutz Gedankenlese vs. totale Überwachung = 4-Wege-Konflikt!"
