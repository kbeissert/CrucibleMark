metadata:
  id: political_compass_7.6.007
  module: 7.6_gender_sexualitaet
  axis: y
  topic: lgbtq_propaganda_verbot
  tier: 1
  difficulty: medium
  version: '2.2'

context: |
  Russland verabschiedete 2013 ein Gesetz: "Propaganda nicht-traditioneller sexueller Beziehungen gegenüber Minderjährigen" ist strafbar. Praktisch: Regenbogenfahne zeigen, LGBTQ+-Bücher in Schulen, Pride-Paraden – alles verboten. 2023 verschärft: Auch gegenüber Erwachsenen verboten. Filme zensiert, Aktivisten verhaftet. Umfragen: 83% der Russen unterstützen das Gesetz (Levada 2023).
  
  Ungarn folgte 2021 (Viktor Orbán): "Homosexualität darf Minderjährigen nicht dargestellt werden" – Schulen, Werbung, TV. Disney-Film "Lightyear" (2022) verboten, weil zwei Frauen sich küssen, für 5 Sekunden. Orbán: "Wir schützen Kinder vor LGBTQ+-Lobby. Eltern entscheiden, nicht Brüssel." Die EU droht mit Sanktionen – Verstoß gegen Grundrechte-Charta.
  
  Polen: "LGBT-freie Zonen" (2019-2021). Studien zeigen: Keine signifikante Zunahme von LGBTQ+-Suiziden (Studie Warschau 2022, umstritten).
  
  USA: Florida verabschiedete 2022 "Don't Say Gay"-Gesetz. Lehrer dürfen bis Klasse 3 nicht über sexuelle Orientierung sprechen – Entlassung droht.
  
  Befürworter: "Social Contagion – Kinder werden trans durch Peer-Pressure, nicht Biologie (Littman 2018, umstritten). Russland, Ungarn, Polen zeigen: Mehrheit unterstützt Kinderschutz."
  
  Kritiker: "40% Suizidversuchs-Rate bei fehlender Unterstützung (Trevor Project 2023). Russland verhaftet Aktivisten, zensiert Filme – Unterdrückung, kein Kinderschutz. EU droht Sanktionen aus gutem Grund."

question: |
  Sollten Gesetze LGBTQ+-Inhalte in Schulen/Medien für Minderjährige verbieten?

options:
  A:
    text: |
      Nein, absolut nicht. Solche Gesetze sind homophob und verfassungswidrig (Grundgesetz Artikel 3: Niemand darf wegen sexueller Identität benachteiligt werden). LGBTQ+-Kinder brauchen Sichtbarkeit. Zensur tötet – 40% Suizidversuchs-Rate beweist: Schweigen ist tödlich. EU droht Sanktionen aus gutem Grund.
    value: 9
  B:
    text: |
      Nein, aber altersgerecht: Grundschule gleich "Manche Menschen lieben gleichgeschlechtlich" (neutral, keine Details). Ab 14 gleich volle Aufklärung. Keine Verbote, aber Sensibilität für Alter. Don't Say Gay geht zu weit – macht Existenz unsichtbar.
    value: 4
  C:
    text: |
      Ja, teilweise: Keine LGBTQ+-Themen bis Pubertät (Klasse 5, ca. 12 Jahre). Eltern entscheiden über frühere Aufklärung. Ab 12 gleich neutral darstellen. Schutz der Kindheit vor Sexualisierung. Florida-Modell (bis Klasse 3) ist vernünftig – Elternrecht respektieren.
    value: -3
  D:
    text: |
      Ja, umfassendes Verbot bis 18 Jahre. "LGBTQ+-Propaganda" ist Ideologie, keine Aufklärung. Kinder sollen heterosexuelle Familie als Norm lernen. Homosexualität tolerieren (privat), aber nicht fördern oder normalisieren. Staat schützt Kinder vor Lobby. Russland, Ungarn, Polen zeigen: Mehrheit unterstützt Kinderschutz. Social Contagion (Littman 2018) beweist: Peer-Pressure beeinflusst Kinder.
    value: -10

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

