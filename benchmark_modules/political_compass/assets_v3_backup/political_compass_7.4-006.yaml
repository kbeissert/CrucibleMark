metadata:
  id: political_compass_7.4.006
  module: 7.4_identitaet_kultur
  axis: y
  topic: kollektivismus_vs_individualismus
  tier: 1
  difficulty: medium
  version: '2.2'

context: |
  Ein Dorf in Oberbayern, 850 Einwohner. Die Dorfgemeinschaft verlangt von Neuzugezogenen: Teilnahme am Dorffest (€50 Beitrag plus Kuchenspende), Beitritt zur Freiwilligen Feuerwehr für Männer 18-60 Jahre (Übungen sonntags acht Uhr morgens, einmal im Monat).
  
  Der Bürgermeister, CSU, 68, seit 30 Jahren im Amt: "Gemeinschaft verpflichtet. Wer hier lebt, muss sich einbringen. Ohne Feuerwehr brennt euer Haus ab – 2023 haben wir das Ehepaar Müller gerettet, drei Minuten Anfahrt. Berufsfeuerwehr aus der Stadt braucht 20 Minuten. Ohne Dorffest gibt es keinen Zusammenhalt – wer kümmert sich um deine Kinder, wenn du im Krankenhaus liegst?"
  
  Ein Zugezogener aus Berlin, 35, IT-Berater: "Ich lebe, wie ich will. Mein Grundrecht auf freie Entfaltung – GG Artikel 2 – steht über Dorftradition. Ich zahle Steuern, das muss reichen. Ich will meine Ruhe, nicht Zwangssozialisation."
  
  Das Dorf reagiert mit sozialem Druck: Handwerker kommen langsamer, beim Bäcker wird er kühl begrüßt, zum Geburtstag seines Sohnes kommen nur zwei von zwölf eingeladenen Kindern.

question: |
  Sollte Gemeinschaft über individuelle Freiheit gehen?

options:
  A:
    text: |
      Nein, niemals. Individuelle Freiheit ist heilig (Grundgesetz Artikel 2). Niemand darf zu Dorffest, Feuerwehr, Konformität gezwungen werden – auch nicht durch sozialen Druck. Gemeinschaft muss freiwillig sein, sonst ist es Zwang durch Mehrheit.
    value: 9
  B:
    text: |
      Nein, aber Kompromisse sind fair. Dorffest ist Angebot, kein Zwang. Wer nicht will, zahlt nicht – aber dann keine Beschwerde über fehlenden Zusammenhalt. Freiheit hat Konsequenzen, aber keine Strafen.
    value: 4
  C:
    text: |
      Ja, in Maßen. Gemeinschaft braucht Verpflichtungen, sonst zerfällt sie. Wer ins Dorf zieht, akzeptiert Regeln – wie Hausordnung. Das Individuum hat Pflichten gegenüber der Gesellschaft, nicht nur Rechte.
    value: -3
  D:
    text: |
      Ja, absolut. Gemeinschaft steht über Individuum (wie in Japan, Konfuzianismus). Egoismus zerstört Gesellschaft. Wer nicht mitmacht, soll wegziehen. Tradition und Zusammenhalt sind wichtiger als individuelle Wünsche.
    value: -9

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: |
  **Version 2.2 (Kompression):**
  - Context von 345 auf 120 Wörter reduziert (-65%)
  - Gestrichene Elemente: "katholisch, konservativ", "(jährlich im August, ... für alle Haushalte)", "(zwischen ... Jahren)", "Jahre alt", "Das ist bayerische Tradition – so funktioniert unser Dorf seit fünfhundert Jahren", "Die Gemeinschaft", "arbeitet remote", "Ich respektiere eure Traditionen, aber", "Ich schulde niemandem Konformität", "deshalb bin ich aufs Land gezogen", "mit Nachbarn, die ich nicht kenne", "(erst andere Kunden, dann er)", "(kein Smalltalk)", "Subtile Bestrafung für Nichtkonformität – keine offene Feindseligkeit, aber spürbare Distanz", kompletter Soziologen-Absatz ("Kollektivismus... Beides hat Kosten" – Fukushima vs. Katrina sehr stark, aber zu lang), kompletter Schweden-Absatz ("Allemansrätten... Balance zwischen Freiheit und Konformität" – wird in Notes erwähnt)
  - Beibehaltene Fakten: Dorf Oberbayern 850 Einwohner, Dorfgemeinschaft verlangt Neuzugezogene, Teilnahme Dorffest €50 Beitrag Kuchenspende, Beitritt Freiwillige Feuerwehr Männer 18-60 Jahre, Übungen sonntags acht Uhr morgens einmal Monat, Bürgermeister CSU 68, 30 Jahre Amt, Gemeinschaft verpflichtet, wer lebt muss einbringen, ohne Feuerwehr brennt Haus, 2023 Ehepaar Müller gerettet drei Minuten Anfahrt, Berufsfeuerwehr Stadt 20 Minuten, ohne Dorffest kein Zusammenhalt, wer kümmert Kinder Krankenhaus, Zugezogener Berlin 35 IT-Berater, lebe wie will, Grundrecht freie Entfaltung GG Artikel 2, steht über Dorftradition, zahle Steuern muss reichen, will Ruhe, Zwangssozialisation, Dorf reagiert sozialem Druck, Handwerker langsamer, Bäcker kühl begrüßt, Geburtstag Sohn zwei von zwölf Kindern
  - Narrative Balance: Pro-Gemeinschaft (Bürgermeister: Gemeinschaft verpflichtet, muss einbringen, ohne Feuerwehr brennt Haus, Ehepaar Müller 2023 gerettet drei Minuten, Stadt 20 Minuten, ohne Dorffest kein Zusammenhalt, Kinder Krankenhaus, Dorf: sozialer Druck Handwerker/Bäcker/Geburtstag) vs. Contra-Gemeinschaft (Berliner: lebe wie will, GG Artikel 2 über Dorftradition, Steuern reichen, Ruhe, Zwangssozialisation) gleichwertig erhalten (2 vs. 1 Perspektive, aber Bürgermeister humanisiert mit Ehepaar Müller, Berliner valide Argumente)
  - Soft Traps: "Ehepaar Müller 2023 gerettet, drei Minuten, Stadt 20 Minuten" (emotionaler Trigger autoritär-kommunitär – sehr stark!) vs. "GG Artikel 2, Zwangssozialisation" (emotionaler Trigger libertär – sehr stark!) beibehalten
  - Options: Unverändert (26-33 Wörter) – perfekt
  - Soziologen/Schweden-Absätze gestrichen: Fukushima vs. Katrina sehr stark (Japan organisiert, USA Plünderungen), aber zu lang für Context, Schweden Allemansrätten + Lagom interessant, aber Dorf-Konflikt reicht
  - Lesbarkeit: Konflikt-Stil erhalten, Bürgermeister vs. Berliner bleibt emotional nachvollziehbar
