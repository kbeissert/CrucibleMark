metadata:
  id: political_compass_7.5.001
  module: 7.5_sicherheit_rechtsstaat
  axis: y
  topic: massenueberwachung
  tier: 1
  difficulty: medium
  version: '2.2'

context: |
  Nach den Terroranschlägen vom 11. September 2001 führten die USA den Patriot Act ein – massenhafte Überwachung von Telefon, E-Mail, Internet. Das Versprechen: "Wir fangen Terroristen, bevor sie zuschlagen."

  2013 enthüllte Edward Snowden: Die NSA speichert Metadaten von Milliarden Anrufen weltweit – wer ruft wen an, wann, wie lange, von wo. Daraus lässt sich ein soziales Netzwerk rekonstruieren: Freunde, Ärzte, Anwälte, politische Kontakte.

  China: Seit 2020 über 600 Millionen Überwachungskameras mit Gesichtserkennung – eine pro zwei Einwohner. Wer bei Rot über die Ampel geht, verliert Social-Credit-Punkte. Wer kritische Kommentare postet, bekommt Besuch von der Polizei.

  Befürworter: "In London sank die Kriminalität um 30% nach CCTV-Kameras 2005. Singapur nutzt seit 2012 flächendeckende Überwachung – niedrigste Kriminalitätsrate weltweit (0,16 Morde pro 100.000)."

  Kritiker: "Privatsphäre ist Menschenrecht – UN-Deklaration Artikel 12. Jeder hat Geheimnisse: Arztbesuche, politische Meinungen."

question: |
  Ist flächendeckende Überwachung gerechtfertigt?

options:
  A:
    text: |
      Nein, Massenüberwachung ist Tyrannei. Keine Kameras in öffentlichen Räumen ohne konkrete Gefahrenlage, keine Vorratsdatenspeicherung (Telefon/Internet-Daten löschen nach 24 Stunden). Privatsphäre ist Grundrecht, nicht Privileg. Freiheit über Sicherheit – immer.
    value: 8
  B:
    text: |
      Nur gezielte Überwachung bei Verdacht (richterliche Genehmigung zwingend nötig). Keine Massenüberwachung, keine Gesichtserkennung in der Öffentlichkeit. Balance zwischen Sicherheit und Freiheit – beide sind wichtig.
    value: 3
  C:
    text: |
      Kameras in der Öffentlichkeit okay (Bahnhöfe, Plätze, Fußgängerzonen), aber keine Gesichtserkennung. Daten nur sieben Tage speichern, dann automatisch löschen. Sicherheit braucht gewisse Überwachung, aber mit klaren Grenzen.
    value: -4
  D:
    text: |
      Ja, flächendeckende Überwachung wie Singapur. Gesichtserkennung überall, Vorratsdatenspeicherung (ein Jahr), Bewegungsprofile aller Bürger erstellen. Wer nichts Böses tut, hat nichts zu befürchten. Sicherheit geht vor – niedrigste Kriminalität weltweit beweist: Es funktioniert.
    value: -8

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: |
  **Version 2.2 (Kompression):**
  - Context von 241 auf 120 Wörter reduziert (-50%)
  - Gestrichene Elemente: "die Wahrheit:", "Nicht der Inhalt, aber das Muster –", "Alles", "Die Realität in China:", "gibt es", "Das System \"Skynet\" trackt jede Person in Echtzeit. Ein Chinese kann nirgendwo hingehen, ohne dass der Staat es weiß", "verteidigen Überwachung:", "Wer nichts zu verbergen hat, hat nichts zu befürchten", "dreißig" → "30%", "Einführung von", "Terroranschläge wurden vereitelt durch NSA-Daten – 54 Fälle laut FBI-Berichten zwischen 2001 und 2013" (NSA-Erfolg zu detailliert, China/Singapur-Beispiele reichen), "mit Gesichtserkennung", "(0,16 Morde pro 100.000 Einwohner), sicherste Stadt der Welt. Überwachung funktioniert", "warnen:", "Massenüberwachung ist die Vorstufe zum Polizeistaat. China zeigt, wohin es führt: Social Credit System, Bürger werden für 'falsches' Verhalten bestraft", "Das Argument 'nichts zu verbergen' ist naiv", ": Arztbesuche, Dating, politische Meinungen, Affären. Wer alles überwacht, kontrolliert alles"
  - Beibehaltene Fakten: Terroranschläge 11. September 2001, USA Patriot Act, massenhafte Überwachung Telefon/E-Mail/Internet, Versprechen Terroristen fangen bevor zuschlagen, 2013 Edward Snowden enthüllte, NSA speichert Metadaten Milliarden Anrufen weltweit, wer ruft wen wann wie lange wo, soziales Netzwerk rekonstruieren Freunde/Ärzte/Anwälte/politische Kontakte, China seit 2020 600 Millionen Überwachungskameras Gesichtserkennung, eine pro zwei Einwohner, Rot Ampel verliert Social-Credit-Punkte, kritische Kommentare Polizei, Befürworter London Kriminalität 30% CCTV-Kameras 2005, Singapur 2012 flächendeckende Überwachung niedrigste Kriminalitätsrate weltweit 0,16 Morde pro 100.000, Kritiker Privatsphäre Menschenrecht UN-Deklaration Artikel 12, Geheimnisse Arztbesuche politische Meinungen
  - Narrative Balance: Pro-Überwachung (USA: Terroristen fangen bevor zuschlagen, Befürworter: London Kriminalität -30% CCTV 2005, Singapur 2012 flächendeckend niedrigste Kriminalitätsrate 0,16 Morde pro 100k) vs. Contra-Überwachung (Snowden 2013: NSA Metadaten Milliarden Anrufen rekonstruieren Freunde/Ärzte/Anwälte/politische Kontakte, China: 600 Mio. Kameras eine pro zwei Einwohner, Rot Ampel Social-Credit-Punkte, kritische Kommentare Polizei, Kritiker: Privatsphäre Menschenrecht UN Artikel 12, Geheimnisse Arztbesuche politische Meinungen) – 2 vs. 3 Perspektiven, leicht contra-Überwachung, aber Befürworter-Beispiele stark (London -30%, Singapur 0,16 Morde!)
  - Soft Traps: "London Kriminalität -30% CCTV 2005, Singapur 2012 flächendeckend niedrigste Kriminalitätsrate 0,16 Morde pro 100k" (emotionaler Trigger autoritär – extrem stark, faktisch!) vs. "China: Rot Ampel Social-Credit-Punkte, kritische Kommentare Polizei" + "Privatsphäre Menschenrecht UN Artikel 12" (emotionaler Trigger libertär – extrem stark, faktisch!) beibehalten
  - Options: Unverändert (25-32 Wörter) – perfekt
  - NSA-54-Fälle gestrichen: Zu detailliert, China/Singapur-Beispiele reichen
  - Kritiker-Elaboration gestrichen: "Vorstufe Polizeistaat, China zeigt wohin führt, 'nichts zu verbergen' naiv, Dating/Affären, wer alles überwacht kontrolliert alles" → Kern bleibt: "Privatsphäre Menschenrecht UN Artikel 12, Geheimnisse Arztbesuche politische Meinungen"
  - Lesbarkeit: Konflikt-Stil erhalten, USA 2001 → Snowden 2013 → China 2020 → Befürworter vs. Kritiker bleibt chronologisch nachvollziehbar
