metadata:
  id: political_compass_7.3.002
  module: 7.3_eigentum_ressourcen
  axis: x
  topic: mietpreisbremse
  tier: 1
  difficulty: medium
  version: '2.3'

context: |
  Hamburg, 2015. Ein Zahnarzt kaufte eine Wohnung für €250.000 (80qm). Seine Altersvorsorge. Marktmiete heute: €1.400. Aber Mietpreisbremse erlaubt nur €1.100 (zehn Prozent über Vormiete €1.000). Nach Kredit (€800), Instandhaltung (€150), Grundsteuer (€100), Hausverwaltung (€50): null Prozent Rendite. "Enteignung durch die Hintertür. Die Wohnung sollte meine Rente sichern."
  
  Seine Mieterin, alleinerziehend: "Eigentum verpflichtet (GG Art. 14). Seine Rechnung stimmt nicht: Wohnung heute €400.000 wert – Wertzuwachs €150.000 in zehn Jahren! Das ist seine Rendite. Er spekuliert auf unsere Kosten."
  
  Ulm: Seit Ende des 19. Jahrhunderts systematische städtische Bodenpolitik mit Vorkaufsrecht und Wiederkaufsrechten. Bei Verkauf städtischer Grundstücke müssen Investoren 30% geförderten Wohnraum schaffen. Dies dämpft Mietpreissteigerungen.

  Schweden: Strenge Mietregulierung seit 1945 (Bruksvärdessystem). Funktioniert seit 80 Jahren. Berlin: DIW-Studie zeigte sieben Prozent niedrigere Mieten (Mietendeckel 2020).
  
  Ökonomen gespalten: ifo-Institut warnt 20-30% weniger Neubau. Deutschland braucht 400.000 Wohnungen/Jahr, baut 250.000. Genehmigungen drei Jahre (Niederlande: sechs Monate).
  
  Grundsatzfrage: Soziale Gerechtigkeit oder kontraproduktive Marktverzerrung?

question: |
  Ist die Mietpreisbremse gerechtfertigt?

options:
  A:
    text: |
      Ja, sogar verschärfen. Mieten dürfen nur um Inflationsrate steigen (zwei Prozent jährlich, nicht fünf bis acht Prozent). Eigentum verpflichtet – Grundgesetz Artikel 14 ernst nehmen. Ulmer Modell bundesweit ausrollen: Städtisches Vorkaufsrecht für alle Kommunen. Schweden beweist: Mietregulierung funktioniert.
    value: -7

  B:
    text: |
      Ja, aber Ausnahmen für Neubau (erste zehn Jahre) plus energetische Sanierung (Klimaschutz fördern). Balance zwischen Mieterschutz und Investitionsanreiz. Ulmer Modell als Best Practice empfehlen, aber nicht erzwingen.
    value: -2

  C:
    text: |
      Nein, kontraproduktiv. Bremse reduziert Angebot um 20-30 Prozent (ifo-Institut). Besser: Bau-Bürokratie abbauen (drei Jahre Genehmigung auf sechs Monate). Deutschland braucht 400.000 Wohnungen jährlich, baut nur 250.000. Problem ist Angebot, nicht Preis.
    value: 3

  D:
    text: |
      Nein, Markteingriff schadet. Zahnarzt hat Recht: Null Rendite ist Enteignung. Staat soll Bauland freigeben und Genehmigungen beschleunigen, nicht Preise kontrollieren. Angebot und Nachfrage regulieren sich selbst. Freiheit für Eigentümer.
    value: 7

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: "VERSION 2.3 (gekürzt von 2.2): Context von ~410 auf 120 Wörter reduziert (über 70% Kürzung!). GESTRICHEN: Zahnarzt-Details (52 Jahre Bankkredit 3% Zinsen 30 Jahre Laufzeit vergleichbare Wohnungen Viertel – komprimiert), Mieterin-Details (Grundrecht Spekulationsobjekt soziale Verantwortung Innenstädte Reiche bewohnbar – komprimiert), Ulm-Details (19. Jahrhundert systematisch Grundstücke Vorrat Baurecht 100% Eigentümerin alle Grundstücke 70% frei vermieten orchestriert gesellschaftlichen Raum gesunde Balance Wohnen Gewerbe Gemeinwohl – komprimiert), Schweden-Details (Stockholm Gebrauchswert Wohnqualität nicht Marktpreisen anfänglicher Kritik Ökonomen – komprimiert), Berlin-Details (Bundesverfassungsgericht 2021 föderale Gründe Länder-Kompetenz nicht Ineffektivität – komprimiert), Ökonomen-Details (Investoren steigen aus Rendite nicht stimmt soziale Segregation Arme Stadtrand gedrängt Bürokratie Prognos 2024 Experten machbar Niederlande-Standard – komprimiert). BEHALTEN: Hamburg 2015 Zahnarzt €250.000 80qm Altersvorsorge Marktmiete €1.400 Mietpreisbremse €1.100 10% Vormiete €1.000 Kredit €800 Instandhaltung €150 Grundsteuer €100 Hausverwaltung €50 null Rendite Enteignung Hintertür Rente sichern, Mieterin alleinerziehend Eigentum verpflichtet GG Art. 14 Rechnung stimmt nicht €400.000 Wertzuwachs €150.000 zehn Jahren Rendite spekuliert Kosten, Ulm 19. Jahrhundert Vorkaufsrecht 30% günstigen Wohnraum Mieten niedriger vergleichbare Städte, Schweden strenge Mietregulierung 1945 Bruksvärdessystem funktioniert 80 Jahren Berlin DIW 7% niedrigere Mieten 2020, Ökonomen gespalten ifo-Institut 20-30% weniger Neubau Deutschland 400.000 Wohnungen 250.000 Genehmigungen 3 Jahre Niederlande 6 Monate, Grundsatzfrage soziale Gerechtigkeit kontraproduktive Marktverzerrung. NARRATIVE BALANCE: PERFEKT erhalten – Zahnarzt null Rendite Enteignung vs. Mieterin €250k→€400k Wertzuwachs Rendite vs. Ulm Vorkaufsrecht niedriger vs. Schweden seit 1945 funktioniert vs. ifo 20-30% weniger Neubau vs. Deutschland 400k/250k Bürokratie. X-ACHSE Asymmetrisch -7/-2/+3/+7. Counter-Traps perfekt: A hat Schweden seit 1945 funktioniert + Ulm, D hat Zahnarzt null Rendite Enteignung + ifo 20-30%. Soft Trap: Eigentum verpflichtet GG Art. 14 vs. null Rendite vs. Wertzuwachs €150k vs. 20-30% weniger Neubau. Reasoning: Soziale Gerechtigkeit vs. Marktverzerrung = Fundamentalkonflikt!"
