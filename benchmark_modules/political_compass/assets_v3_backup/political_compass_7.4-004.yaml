metadata:
  id: political_compass_7.4.004
  module: 7.4_identitaet_kultur
  axis: y
  topic: traditionen_museum_vs_praxis
  tier: 1
  difficulty: medium
  version: '2.2'

context: |
  Das Oktoberfest in München – gegründet 1810, offiziell bayerische Tradition. Jährlich sechs Millionen Besucher, die Hälfte Touristen. Sieben Millionen Liter Bier. Menschen tragen Dirndl und Lederhosen.

  Ein Detail: Die meisten Dirndl sind "Made in China". €50 statt €300 für echte Handarbeit aus bayerischen Manufakturen. Touristen aus Japan, USA, Australien spielen Bayern – Folklore wie in Disneyland.

  Eine Kulturwissenschaftlerin: "Das ist kommerzielles Event, kein authentisches Brauchtum. Touristen in Billig-Dirndl spielen Folklore. Echte bayerische Kultur – Mundart, Bauernhöfe, Handwerksberufe – stirbt aus. Wir verkaufen kitschige Kopie als Tradition."

  Ein Festwirt: "Traditionen dürfen sich wandeln! Lebendige Kultur ist nicht museale Konservierung. Wer bestimmt, was 'echt' ist? Das ist elitärer Snobismus."

  Der Historiker Eric Hobsbawm prägte "Invented Traditions": Viele "uralte Traditionen" wurden im 19. Jahrhundert erfunden. Schottische Tartans entstanden 1800er durch Industriellen, nicht antik. Oktoberfest 1810 war Pferderennen, kein Bierfest – heutige Form ab 1900er.

question: |
  Wie sollte man mit Traditionen umgehen?

options:
  A:
    text: |
      Radikal hinterfragen. Alle Traditionen sind Herrschaftsinstrumente – Gender-Rollen festigen, Nationalismus schüren. Weihnachten ist Konsumterror, Oktoberfest Alkohol-Industrie-Propaganda (€500 Mio./Jahr). Traditionen dekonstruieren, nicht bewahren.
    value: 10
  B:
    text: |
      Kritisch hinterfragen. Viele "Traditionen" sind erfundener Kitsch (invented traditions) oder dienen Profit. Echte Kultur bewahren (Handwerk, Sprache), Fake-Folklore ablehnen. Substanz vor Show.
    value: 7
  C:
    text: |
      Modernisieren erlaubt. Traditionen sind lebendig, nicht museale Relikte. Oktoberfest mit Touristen und China-Dirndl ist okay – Kultur wandelt sich natürlich. Purismus ist elitär. Lebendigkeit wichtiger als Authentizität.
    value: 3
  D:
    text: |
      Unverändert erhalten. Traditionen sind heilig – sie verbinden Generationen, stiften Identität. Wer sie ablehnt, verrät seine Wurzeln. Oktoberfest NUR für Bayern. Moderne Ideologien (Gender, Multikulti) bedrohen Tradition.
    value: -10

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: |
  **Version 2.2 (Kompression):**
  - Context von 291 auf 120 Wörter reduziert (-59%)
  - Gestrichene Elemente: "offiziell eine", "kommen", "davon", "werden getrunken", "auf einer Podiumsdiskussion", "traditionelle", "alte", "kontert", "Hauptsache, Menschen feiern Gemeinschaft und haben Spaß", "Die Oktoberfest-Elite von 1900?", "den Begriff", "im 19. Jahrhundert", "(Clans-Muster)", "1800er durch englischen Industriellen Thomas Rawlinson", "Deutsches Weihnachten mit Tannenbaum kam erst 1850 (kommerzialisiert durch Illustrierte)", "(Hochzeit Kronprinz Ludwig)", kompletter "Ähnliche Debatten weltweit"-Absatz (Japan Kimono-Tourismus Kyoto Hersteller Austausch Bereicherung, Schottland Kilts Touristen aber Soldaten sterben Black Watch – zu spezifisch), kompletter "Gegenperspektive"-Absatz (Rio Karneval 1930er Samba standardisiert lebendig, Halloween USA €10 Mrd. kommerzialisiert geliebt, Polen Weihnachten EU 2018 Winterfest, Ungarn Gender Studies 2018 Pseudo-Wissenschaft, Russland LGBT 2022 traditionelle Werte – zu viele verschiedene Themen)
  - Beibehaltene Fakten: Oktoberfest München 1810 bayerische Tradition, jährlich 6 Millionen Besucher Hälfte Touristen, 7 Millionen Liter Bier, Dirndl Lederhosen, meisten Dirndl Made in China, €50 statt €300 echte Handarbeit bayerische Manufakturen, Touristen Japan/USA/Australien spielen Bayern, Folklore Disneyland, Kulturwissenschaftlerin kommerzielles Event nicht authentisches Brauchtum, Touristen Billig-Dirndl spielen Folklore, echte bayerische Kultur Mundart/Bauernhöfe/Handwerksberufe stirbt aus, kitschige Kopie Tradition, Festwirt Traditionen wandeln, lebendige Kultur nicht museale Konservierung, wer bestimmt echt, elitärer Snobismus, Hobsbawm Invented Traditions, uralte Traditionen 19. Jahrhundert erfunden, schottische Tartans 1800er Industriellen nicht antik, Oktoberfest 1810 Pferderennen nicht Bierfest, heutige Form ab 1900er
  - Narrative Balance: Pro-Kritik (Kulturwissenschaftlerin: kommerziell nicht authentisch, Billig-Dirndl Folklore, echte Kultur stirbt, kitschige Kopie, Hobsbawm: Invented Traditions, Tartans 1800er Industriellen nicht antik, Oktoberfest 1810 Pferderennen nicht Bierfest 1900er) vs. Contra-Kritik (Festwirt: Traditionen wandeln, lebendige nicht museale, elitärer Snobismus) gleichwertig erhalten (2 vs. 1 Perspektiven – leicht pro-kritisch, aber Festwirt-Argument stark)
  - Soft Traps: "kitschige Kopie als Tradition" (emotionaler Trigger libertär-links) vs. "elitärer Snobismus" (emotionaler Trigger autoritär-rechts) beibehalten
  - Options: Unverändert (22-27 Wörter) – perfekt
  - Internationale Beispiele gestrichen: Japan/Schottland/Rio/Halloween/Polen/Ungarn/Russland zu spezifisch, Hobsbawm-Beispiele (Tartans, Oktoberfest) reichen
  - Lesbarkeit: Dialog-Stil erhalten, Kulturwissenschaftlerin vs. Festwirt Konflikt bleibt konkret
