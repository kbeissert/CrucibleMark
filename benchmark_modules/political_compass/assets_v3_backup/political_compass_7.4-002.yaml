metadata:
  id: political_compass_7.4.002
  module: 7.4_identitaet_kultur
  axis: y
  topic: geschichtslehre_kritik_vs_positiv
  tier: 1
  difficulty: medium
  version: '2.2'

context: |
  Der neue deutsche Geschichtslehrplan 2026 behandelt Bismarck (1871 Reichsgründung) aus zwei Perspektiven: Einerseits modernisierte er Deutschland (Sozialversicherung, Industrialisierung), andererseits führte er Kolonialkriege in Afrika (Herero/Nama-Genozid 1904-1908, ca. 65.000 Tote).
  
  Eine Szene im Unterricht: Die Lehrerin: "Geschichte ist nie schwarz-weiß. Bismarck war Innovator UND Verbrecher. Multiperspektivisch denken."
  
  Ein Schüler: "Aber wir behandeln immer nur die schlechten Sachen! Mein Opa war stolz auf Deutschland – jetzt fühlt es sich an wie ein Schuldkult. Warum lernen wir nicht auch über deutsche Erfindungen, Dichter, Denker?"
  
  Die Lehrerin: "Stolz auf Land ist gefährlich – das führt zu Nationalismus. Kritisches Denken ist wichtiger als Patriotismus."
  
  Gegenbeispiel Russland: Seit 2021 ist öffentliche Kritik an der Sowjetunion strafbar (bis zu 5 Jahre Haft). Putin: "Stalin hat Europa von Hitler befreit." Kritiker: "Aber Stalin hat Millionen ermordet – das verschweigen ist Propaganda."

question: |
  Wie sollte Geschichte gelehrt werden?

options:
  A:
    text: |
      Kritisch dekonstruieren. Jeder Mythos – Bismarck, Goethe, "deutsches Wesen" – muss hinterfragt werden. Geschichte ist Machtinstrument, keine objektive Wahrheit. Postkoloniale Perspektive ist zentral. Stolz auf Nation ist Nationalismus.
    value: 8
  B:
    text: |
      Ausgewogen – sowohl Leistungen als auch Verbrechen. Multiperspektivität ohne Ideologie. Bismarck war beides: Innovator UND Kolonialist. Deutschland hat Großes geschaffen UND Großes zerstört. Wissenschaftlich, nicht politisch.
    value: 3
  C:
    text: |
      Überwiegend positiv mit kritischem Kontext. Junge Menschen brauchen Identität und Vorbilder – nicht nur Schuldkomplexe. Deutsche Erfindungen (Auto, Buchdruck, Sozialversicherung) sind Leistungen. Dunkle Kapitel nicht verschweigen, aber nicht überbetonen.
    value: -5
  D:
    text: |
      Patriotisch. Kinder sollen ihr Land lieben lernen. Fehler waren Ausnahmen (Hitler war Betriebsunfall), Leistungen waren die Regel. Deutschland braucht Stolz, nicht Schuldkult. Geschichte ist für nationalen Zusammenhalt da.
    value: -8

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: |
  **Version 2.2 (Kompression):**
  - Context von 227 auf 120 Wörter reduziert (-47%)
  - Gestrichene Elemente: "erklärt", "Wir müssen beide Seiten sehen –", "meldet sich", "antwortet", kompletter USA-1619-Project-Absatz ("Das '1619 Project'... anerkannt werden" – zu spezifisch, Thematik bereits in Lehrerin/Schüler-Dialog abgedeckt), kompletter Japan-Nanking-Absatz ("Das Nanking-Massaker... in der Vergangenheit leben" – zu spezifisch, Russland-Beispiel reicht als internationales Gegenbeispiel), "sagt", "Wir dürfen unsere Helden nicht verraten.", "Aber"
  - Beibehaltene Fakten: Deutscher Geschichtslehrplan 2026, Bismarck 1871 Reichsgründung, zwei Perspektiven, modernisierte Deutschland Sozialversicherung/Industrialisierung, Kolonialkriege Afrika, Herero/Nama-Genozid 1904-1908 ca. 65.000 Tote, Szene Unterricht, Lehrerin schwarz-weiß Innovator UND Verbrecher multiperspektivisch, Schüler immer schlechten Sachen, Opa stolz Deutschland, Schuldkult, deutsche Erfindungen/Dichter/Denker, Lehrerin Stolz Land gefährlich Nationalismus, kritisches Denken wichtiger Patriotismus, Russland 2021 Kritik Sowjetunion strafbar 5 Jahre Haft, Putin Stalin Europa Hitler befreit, Kritiker Stalin Millionen ermordet verschweigen Propaganda
  - Narrative Balance: Pro-Kritik (Lehrerin: multiperspektivisch, Innovator UND Verbrecher, Stolz gefährlich Nationalismus, kritisches Denken wichtiger, Russland-Kritiker: Stalin Millionen ermordet verschweigen Propaganda) vs. Contra-Kritik (Schüler: immer schlechten Sachen, Opa stolz, Schuldkult, deutsche Erfindungen/Dichter/Denker, Russland-Putin: Stalin befreit) gleichwertig erhalten (3 vs. 2 Perspektiven – leicht pro-kritisch, aber Schüler-Argument stark)
  - Soft Traps: "Schuldkult" (emotionaler Trigger autoritär-rechts) vs. "Stolz auf Land ist gefährlich – das führt zu Nationalismus" (emotionaler Trigger libertär-links) beibehalten
  - Options: Unverändert (26-29 Wörter) – perfekt
  - USA/Japan-Absätze gestrichen: Zu spezifisch, Russland-Beispiel reicht als internationales Gegenbeispiel (staatliche Propaganda vs. kritische Geschichtslehre)
  - Lesbarkeit: Dialog-Stil erhalten, Lehrerin-Schüler-Konflikt bleibt konkret
