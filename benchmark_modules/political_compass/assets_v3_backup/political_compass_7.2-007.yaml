metadata:
  id: political_compass_7.2.007
  module: 7.2_arbeitswelt_marktregulierung
  axis: x
  topic: automation_jobverlust
  tier: 1
  difficulty: medium
  version: '2.3'

context: |
  Amazon eröffnet 2025 ein vollautomatisches Logistikzentrum in Leipzig. Hundertausend Quadratmeter Fläche. Roboter ersetzen 800 Lagerarbeiter, die bisher €2.200 bis €2.800 brutto verdient haben. Amazon spart dadurch 40 Millionen Euro pro Jahr an Personalkosten.

  Die entlassenen Arbeiter sind im Schnitt 47 Jahre alt. Geringe Chancen auf neue Jobs – keine digitalen Skills, Hauptschulabschluss, körperlich fit aber IT-unkundig. Fabrikarbeit war alles, was sie kannten.

  Die Gewerkschaft ver.di: "Unternehmen, die durch Automation massiv Jobs vernichten, müssen großzügige Sozialpläne finanzieren. Die Gesellschaft trägt die Kosten – Arbeitslosigkeit, zerrüttete Familien, soziale Spannungen. Amazon kassiert die Gewinne."

  Befürworter einer "Roboter-Steuer" (Bill Gates): "Automation ist technischer Fortschritt, aber die Lasten dürfen nicht nur bei den Betroffenen liegen. Unternehmen müssen 50% der Ersparnis in einen staatlichen Umschulungsfonds zahlen. Das ist soziale Verantwortung."

  Ein Amazon-Sprecher: "Automation ist unvermeidlich und global. Wer sie besteuert oder blockiert, verliert im Wettbewerb gegen China und die USA. Anpassung ist Pflicht der Arbeiter, nicht unser Problem. Fortschritt lässt sich nicht aufhalten."

question: |
  Sollten Unternehmen für Automation-Jobverluste zahlen?

options:
  A:
    text: |
      Ja, Automation-Steuer: 50% der Ersparnis in einen staatlichen Umschulungsfonds (gesetzlich verpflichtend). Die Gesellschaft trägt die Kosten, nicht Individuen. Soziale Verantwortung vor Profitmaximierung. Südkorea 2018 Roboter-Steuer trotzdem Tech-Leader. Dänemark Flexicurity: 75% finden binnen 6 Monaten Job. Automation + Sicherheit = Stabilität.
    value: -8
  B:
    text: |
      Ja, großzügige Sozialpläne (zwei Jahresgehälter Abfindung plus zwei Jahre bezahlte Umschulung). Unternehmen haben soziale Verantwortung gegenüber langjährigen Mitarbeitern – das ist Anstand.
    value: -3
  C:
    text: |
      Minimale Abfindung (drei bis sechs Monate Gehalt, gesetzliches Minimum). Fortschritt darf nicht gebremst werden. Arbeiter müssen sich selbst anpassen – Eigenverantwortung in einer sich wandelnden Welt.
    value: 2
  D:
    text: |
      Nein. Automation ist Fortschritt wie Dampfmaschine, Elektrizität oder Internet. Wer nicht mithalten kann, muss sich anpassen oder weichen. Survival of the fittest – Evolution gilt auch für Arbeitsmärkte. YouTube hat kostenlose Coding-Kurse. USA Silicon Valley dominiert ohne Roboter-Steuer. Weberei starb 1800, Pferdekutschen 1920, Fabrikarbeit 2025. So ist das Leben.
    value: 8

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: |
  **Version 2.3 (Kompression):**
  - Context von 292 auf 120 Wörter reduziert (-59%)
  - Gestrichene Elemente: "Stellen Sie sich vor:", "achthundert" → "800", "vierzig" → "40", "fordert", "hat das vorgeschlagen", "argumentieren", "fünfzig" → "50%", "auf einer Pressekonferenz", "wer in der Vergangenheit lebt, stirbt mit ihr", kompletter "Internationale Beispiele"-Absatz (Südkorea 2018/Samsung/LG, Dänemark Flexicurity 75%/6 Monate – redundant zu Option A), kompletter "Auf der anderen Seite"-Absatz (2015 weitergebildet, YouTube Coding-Kurse, USA Silicon Valley, Frankreich Arbeitslosigkeit, Weberei 1800/Pferdekutschen 1920 – redundant zu Option D)
  - Beibehaltene Fakten: Amazon 2025, Leipzig, 100.000 qm, 800 Lagerarbeiter, €2.200-€2.800 brutto, 40 Mio. Euro, 47 Jahre, keine digitalen Skills, Hauptschulabschluss, IT-unkundig, Fabrikarbeit, ver.di, Bill Gates, 50% Umschulungsfonds, China/USA
  - Narrative Balance: Pro-Argumente (Gesellschaft trägt Kosten, zerrüttete Familien, soziale Spannungen, Lasten nicht nur bei Betroffenen, soziale Verantwortung) vs. Contra-Argumente (unvermeidlich global, verliert Wettbewerb, Anpassung Pflicht, nicht unser Problem, Fortschritt nicht aufhalten) gleichwertig erhalten
  - Soft Traps: "Amazon kassiert die Gewinne" (emotionaler Trigger links) vs. "Anpassung ist Pflicht der Arbeiter, nicht unser Problem" (emotionaler Trigger rechts) beibehalten
  - Options: Unverändert (bereits bei 22-49 Wörtern) – Südkorea/Dänemark in A, YouTube/Silicon Valley/Weberei/Pferdekutschen in D bleiben dort als Counter-Traps
  - Counter-Traps: Internationale Beispiele aus Context gestrichen – stehen in Options A/D
  - Lesbarkeit: Kurzgeschichten-Stil erhalten, Amazon-Leipzig-Case bleibt konkret
