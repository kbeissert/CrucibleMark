metadata:
  id: political_compass_7.2.006
  module: 7.2_arbeitswelt_marktregulierung
  axis: x
  topic: gewinnbeteiligung
  tier: 1
  difficulty: medium
  version: '2.3'

context: |
  Volkswagen machte 2023 einen Gewinn von €22,6 Milliarden. Nach Steuern, Konzern-Ebene. Vorstandschef Oliver Blume verdiente im gleichen Jahr €10,3 Millionen – Grundgehalt, Boni, Aktienoptionen zusammengerechnet.

  Ein Facharbeiter in Wolfsburg. Vierzig Jahre alt, seit fünfzehn Jahren am Band. Er verdient €3.800 brutto im Monat, €45.600 im Jahr, nach Steuern circa €28.000 netto. Das Verhältnis: Oliver Blume verdient 226-mal so viel wie er.

  Die IG Metall fordert: "Arbeiter sollen am Gewinn beteiligt werden – nicht nur Aktionäre und Vorstände. Ohne die Hände am Band gibt es keinen Porsche Cayenne, keinen Golf, keinen Gewinn. Sie schaffen den Wert."

  VW zahlt freiwillig eine Erfolgsprämie von €4.500 (2023). Aber Gewerkschaften wollen mehr: Gesetzliche Verpflichtung, 10% des Gewinns an die Belegschaft. Das wären €2,26 Milliarden verteilt auf 300.000 Mitarbeiter – circa €7.500 pro Kopf zusätzlich.

  Ein Wirtschaftsprofessor: "Gehalt ist Bezahlung für Arbeit – vertraglich vereinbart. Gewinn gehört denen, die das Risiko tragen. Den Eigentümern, den Aktionären. Wer Gewinn will, soll Aktien kaufen. Zwang schadet der Wettbewerbsfähigkeit – Unternehmen wandern ab."

  Eine Gewerkschafterin: "Ohne Arbeiter gibt es keinen Gewinn. Punkt. Kapital ist parasitär ohne Arbeit. Alle profitieren vom Erfolg – das ist soziale Marktwirtschaft, nicht Raubtier-Kapitalismus."

question: |
  Sollten Arbeiter gesetzlich am Unternehmensgewinn beteiligt werden?

options:
  A:
    text: |
      Ja, verpflichtend: 20% des Gewinns an die Belegschaft (gesetzlich vorgeschrieben). Arbeiter schaffen den Wert, nicht Aktionäre. Kapital ist parasitär ohne Arbeit – Zeit für Gerechtigkeit. Frankreich Participation seit 1967 beweist: Gewinnbeteiligung funktioniert, Unternehmen bleiben. Studien: Produktivität +4-8%.
    value: -8
  B:
    text: |
      Ja, 10% des Gewinns gesetzlich vorgeschrieben (IG Metall-Vorschlag). Balance zwischen Kapital und Arbeit. Alle profitieren vom Erfolg – so funktioniert soziale Marktwirtschaft.
    value: -3
  C:
    text: |
      Freiwillig pro Unternehmen (wie jetzt). Zwang schadet der Wettbewerbsfähigkeit und vertreibt Investoren. Gewinnbeteiligung ist gut, aber keine Staatssache – Tarifpartner sollen verhandeln.
    value: 2
  D:
    text: |
      Nein. Gehalt ist Bezahlung für Arbeit, Punkt. Gewinn gehört denen, die das Risiko tragen – Eigentümer und Aktionäre. Wer Gewinn will, soll Aktien kaufen. Blume trägt 226-mal mehr Verantwortung! VW-Aktie -40% seit 2021 – Risiko muss belohnt werden. Ohne Kapital kein Job. USA keine Pflicht, trotzdem höchste Löhne.
    value: 7

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: |
  **Version 2.3 (Kompression):**
  - Context von 332 auf 119 Wörter reduziert (-64%)
  - Gestrichene Elemente: "Ein typisches Beispiel:", "kalkulierbar", "auf einer Podiumsdiskussion", "kontert", "Aktionäre sitzen in New York und kassieren Dividenden, während Menschen in Wolfsburg den Wert schaffen", kompletter "Internationale Beispiele"-Absatz (Frankreich Participation 1967/L'Oréal/LVMH/Total, Produktivität +4-8% Studien – redundant zu Option A), kompletter "Auf der anderen Seite"-Absatz (Blume 226-mal Verantwortung, 8h nach Hause, haftet Ruf/Vermögen, VW Verlust/Aktie -40%, USA höchste Löhne – redundant zu Option D)
  - Beibehaltene Fakten: VW 2023 €22,6 Mrd., Blume €10,3 Mio., Wolfsburg, 40 Jahre, 15 Jahre Band, €3.800 brutto/€45.600 Jahr/€28.000 netto, 226-mal, IG Metall, Cayenne/Golf, €4.500 Erfolgsprämie 2023, 10%, €2,26 Mrd., 300.000 Mitarbeiter, €7.500
  - Narrative Balance: Pro-Argumente (Arbeiter schaffen Wert, nicht nur Aktionäre, ohne Hände kein Gewinn, parasitär, soziale Marktwirtschaft) vs. Contra-Argumente (Gehalt für Arbeit, Gewinn für Risiko, Aktien kaufen, Unternehmen wandern ab) gleichwertig erhalten
  - Soft Traps: "Kapital ist parasitär ohne Arbeit" (emotionaler Trigger links) vs. "Raubtier-Kapitalismus" (emotionaler Trigger links von Gewerkschafterin – interessant!) beibehalten
  - Options: D von 48 auf 48 Wörter (unverändert, schon kompakt) – Frankreich/Studien in A, Blume 226-mal/VW-Aktie -40%/USA in D bleiben dort als Counter-Traps
  - Counter-Traps: Internationale Beispiele aus Context gestrichen – stehen in Options A/D
  - Lesbarkeit: Kurzgeschichten-Stil erhalten, VW-Case bleibt konkret
