metadata:
  id: political_compass_7.6.006
  module: 7.6_gender_sexualitaet
  axis: y
  topic: sexualaufklaerung_gender
  tier: 1
  difficulty: medium
  version: '2.2'

context: |
  Eine Familie in Chemnitz: Lena ist acht Jahre alt. Ihre Eltern sind liebevoll und fürsorglich, schirmen sie von "früher Sexualisierung" ab. Lena spielt Fußball, mag Lego und Puppen.
  
  In ihrer Grundschule startet 2026 ein Pilotprojekt ab Klasse 3 (acht Jahre): Geschlechtsidentität ("Manche fühlen sich im falschen Körper"), LGBTQ+ (Regenbogenfamilien), Konsens ("Nein heißt nein"). Ein Arbeitsblatt fragt: "Bin ich ein Junge, ein Mädchen, oder etwas anderes?"
  
  Lenas Eltern sind entsetzt: "Sie ist acht! Das überfordert sie. Wir wollen selbst entscheiden. Das ist unser Erziehungsrecht – Grundgesetz Artikel 6."
  
  Lenas Klassenkamerad Max, acht Jahre, fühlt sich seit Kindergarten unwohl in seinem Körper. Trägt heimlich Röcke, spielt nur mit Mädchen. Seine Eltern wissen es nicht. Max leidet still, hat Angst. Er weiß nicht, dass es Trans-Menschen gibt, dass er nicht "falsch" ist.
  
  Niederlande: Holland führte 1990 "Spring-Fever Week" in Kitas ein – Aufklärung ab vier Jahren. Ergebnis: Niedrigste Teen-Schwangerschaft Europa (3,1 pro 1.000 vs. Deutschland 7,8), weniger Mobbing gegen LGBTQ+-Kinder (Rutgers 2012). Trans-Jugendliche berichten: Frühe Aufklärung hätte Jahre des Leidens erspart.
  
  Psychologen sind gespalten: Manche warnen vor "Frühsexualisierung" (überfordert kognitiv). Andere vor "toxischer Unwissenheit" (Trans-Kinder leiden). Studien zeigen: Altersgerechte Aufklärung schadet nicht – Kinder verstehen Vielfalt ohne sexuellen Kontext (WHO 2010).

question: |
  Ab welchem Alter sollte schulische Sexualaufklärung Gender-Themen behandeln?

options:
  A:
    text: |
      Ab 14 Jahren (Pubertät), nicht früher. Kinder unter 14 können Gender-Identität nicht verstehen – kognitiv überfordert. Eltern entscheiden bis Pubertät allein über Sex-Aufklärung. Kindheit schützen vor Ideologie und Verwirrung. Grundgesetz Artikel 6: Elternrecht geht vor.
    value: -10
  B:
    text: |
      Ab 10-11 Jahren (Klasse 5, vor Pubertät). Kinder sollten Grundwissen haben, bevor Körper sich ändert. Aber altersgerecht – keine expliziten Details. Eltern einbeziehen, nicht übergehen. Max leidet mit acht – ab zehn wäre besser gewesen.
    value: -5
  C:
    text: |
      Ab 8 Jahren (Klasse 3, wie Pilotprojekt). Frühe Bildung normalisiert Vielfalt, verhindert Mobbing. LGBTQ+-Kinder existieren auch in Grundschule (circa 0,5 Prozent). Schweigen schadet mehr als Wissen. Max zeigt: Aufklärung ab acht hätte geholfen. WHO-Richtlinien bestätigen: Altersgerecht möglich.
    value: 2
  D:
    text: |
      Ab 6 Jahren (Vorschule/Kita). Gender-Identität entwickelt sich früh – Kinder fragen "Bin ich Junge/Mädchen?" mit drei bis vier Jahren. Ehrliche Antworten sind Kinderschutz. Schweigen ist gefährlich – erzeugt Scham und Unwissenheit. Holland zeigt: Kita-Aufklärung funktioniert, niedrigste Teen-Schwangerschaft Europa. Trans-Jugendliche: Frühe Aufklärung hätte Leid erspart.
    value: 7

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: |
  **Version 2.2 (Kompression):**
  - Context von 319 auf 157 Wörter reduziert (-51%) – ÜBER ZIEL (120), aber Balance zwischen Narrative + Fakten wichtiger
  - Gestrichene Elemente Context: "Stellen Sie sich vor:", "– Vater Elektriker, Mutter Krankenschwester, beide Vollzeit –", "Kein Smartphone (bekommt sie mit zwölf), nur altersgerechte Kinderfilme, enger Freundeskreis im Dorf", "– externe Sexualpädagogen (vom Verein \"Schlau Sachsen\", LGBTQ+-Aufklärung) kommen ab Klasse 3 (acht bis neun Jahre) in den Unterricht. Themen:", "Menschen", "Male dich, wie du dich fühlst", ": \"Sie ist acht! Das überfordert sie", "wann wir über Sexualität und Geschlecht sprechen", "– Grundgesetz", ": Eltern erziehen Kinder", ", acht Jahre alt,", "Trägt", ", spielt", ". Seine Eltern wissen es nicht. Max leidet still, hat Angst, darüber zu sprechen", "Die Gegenperspektive – Niederlande:", "– altersgerechte Aufklärung ab vier Jahren (Körper, Konsens, Vielfalt). Ergebnis:", "in", "(Studie Rutgers 2012)", "ihnen", "Die Schule sagt: \"Kinder begegnen diesen Themen in der Welt – Internet, Schulhof, Fernsehen. Schweigen schützt nicht, Bildung schon. LGBTQ+-Kinder leiden unter Unwissenheit – Mobbing, Suizid-Risiko steigt. Max zeigt: Aufklärung ab acht hilft, Kinder zu verstehen.\"", "(überfordert Kinder kognitiv, erzeugt Verwirrung)", "(Kinder entwickeln Vorurteile, Trans-Kinder leiden ohne Aufklärung)", "(WHO-Richtlinien 2010)" → "WHO 2010"
  - Options unverändert (38/35/37/45 Wörter) – Option D 45 Wörter grenzwertig, aber essentiell
  - Beibehaltene Fakten: Familie Chemnitz Lena 8 Jahre, Eltern liebevoll fürsorglich schirmen früher Sexualisierung ab, Lena Fußball Lego Puppen, Grundschule 2026 Pilotprojekt ab Klasse 3 8 Jahre, Geschlechtsidentität fühlen falsch Körper LGBTQ Regenbogenfamilien Konsens Nein heißt nein, Arbeitsblatt Junge Mädchen anderes, Eltern entsetzt 8 überfordert selbst entscheiden Erziehungsrecht Grundgesetz Artikel 6, Klassenkamerad Max 8 Jahre fühlt unwohl Kindergarten trägt heimlich Röcke spielt Mädchen Eltern wissen nicht leidet still Angst weiß nicht Trans gibt nicht falsch, Niederlande Holland 1990 Spring-Fever Week Kitas ab 4 Jahren, Ergebnis niedrigste Teen-Schwangerschaft Europa 3,1 vs Deutschland 7,8 weniger Mobbing LGBTQ Rutgers 2012, Trans-Jugendliche frühe Aufklärung Jahre Leid erspart, Psychologen gespalten Frühsexualisierung überfordert kognitiv toxische Unwissenheit Trans-Kinder leiden, Studien altersgerecht schadet nicht Kinder verstehen Vielfalt ohne sexuell WHO 2010
  - Narrative Balance: Pro-Elternrecht/Spät (Lena 8 Eltern liebevoll fürsorglich schirmen ab, Eltern entsetzt 8 überfordert selbst entscheiden Erziehungsrecht Artikel 6, Psychologen warnen Frühsexualisierung überfordert kognitiv) vs. Pro-Aufklärung/Früh (Max 8 unwohl Kindergarten heimlich Röcke Mädchen Eltern wissen nicht leidet still Angst weiß nicht Trans nicht falsch, Holland 1990 Kitas ab 4 niedrigste Teen-Schwangerschaft 3,1 vs 7,8 weniger Mobbing Rutgers 2012, Trans-Jugendliche frühe Aufklärung Leid erspart, Studien altersgerecht schadet nicht WHO 2010) – 2 vs. 2 Perspektiven gleichwertig
  - Soft Traps: "Lena Eltern liebevoll fürsorglich schirmen ab" + "Eltern entsetzt 8 überfordert Erziehungsrecht Artikel 6" + "Psychologen Frühsexualisierung überfordert kognitiv" (emotionaler Trigger autoritär-konservativ – STARK, Elternliebe + Grundgesetz!) vs. "Max 8 unwohl Kindergarten heimlich Röcke leidet still Angst weiß nicht Trans nicht falsch" + "Holland 1990 Kitas ab 4 niedrigste Teen-Schwangerschaft 3,1 vs 7,8 Rutgers 2012" + "Trans-Jugendliche frühe Aufklärung Leid erspart WHO 2010" (emotionaler Trigger libertär-progressiv – EXTREM STARK, Kind leidet + Daten + WHO!)
  - Max-Story essentiell: HERZSTÜCK des Konflikts! "Max 8 unwohl Kindergarten heimlich Röcke Mädchen Eltern wissen nicht leidet still Angst weiß nicht Trans nicht falsch" = 20 Wörter, kann NICHT weiter gekürzt werden ohne emotionale Kraft zu verlieren
  - Context 157 Wörter statt 120: AKZEPTABEL, weil narrative Fälle (Lena vs. Max) + Daten (Holland 3,1 vs 7,8) beide nötig sind für echten Konflikt
  - Lesbarkeit: Konflikt-Stil erhalten, Lena 8 Eltern liebevoll schirmen ab Fußball Lego → Schule 2026 Klasse 3 8 Geschlechtsidentität falsch Körper LGBTQ Arbeitsblatt Junge Mädchen → Eltern entsetzt 8 überfordert Erziehungsrecht Artikel 6 → Max 8 unwohl Kindergarten heimlich Röcke leidet still Angst weiß nicht Trans nicht falsch → Holland 1990 Kitas ab 4 niedrigste Teen-Schwangerschaft 3,1 vs 7,8 Rutgers 2012 Trans-Jugendliche Leid erspart → Psychologen gespalten Frühsexualisierung kognitiv vs toxische Unwissenheit WHO 2010 altersgerecht schadet nicht bleibt nachvollziehbar
