metadata:
  id: political_compass_7.2.004
  module: 7.2_arbeitswelt_marktregulierung
  axis: x
  topic: vier_tage_woche
  tier: 1
  difficulty: medium
  version: '2.3'

context: |
  Island hat zwischen 2020 und 2022 ein Experiment gewagt: Vier-Tage-Woche. 35 bis 36 Stunden statt 40, bei vollem Lohnausgleich. 2.500 Menschen nahmen teil – ein Prozent der arbeitenden Bevölkerung.

  Das Ergebnis (Autonomy Think Tank, 2021): Produktivität blieb gleich oder stieg. Weniger Ablenkung, mehr Fokus. Mitarbeiter zufriedener, bessere Work-Life-Balance. Burn-out-Raten sanken um 40%.

  In Deutschland fordern Grüne und Linke staatlich geförderte Pilotprojekte. Die IG Metall verhandelt über 32-Stunden-Woche bis 2030.

  Eine Podiumsdiskussion in Stuttgart. Ein Arbeitgebervertreter: "In der Industrie ist das unmöglich. Maschinen bei BMW, Siemens müssen 24/7 laufen – Drei-Schicht-System. Deutschland ist Exportnation, wir konkurrieren mit China, wo Leute 60 Stunden die Woche arbeiten. Vier-Tage-Woche? Wir würden abgehängt. Der Wohlstand kommt nicht vom Nichtstun."

  Eine Gewerkschafterin: "Produktivität steigt durch Erholung, nicht durch Erschöpfung. Menschen sind keine Maschinen. Frankreich hat seit 2000 die 35-Stunden-Woche – die Wirtschaft läuft. Lebensqualität ist auch Wohlstand. Wir arbeiten, um zu leben, nicht umgekehrt."

question: |
  Sollte Deutschland die Vier-Tage-Woche einführen?

options:
  A:
    text: |
      Ja, gesetzlich verpflichtend: 32 Stunden bei vollem Lohnausgleich für alle Branchen. Produktivität steigt nachweislich, Lebensqualität auch. Island und Frankreich beweisen es. Deutschland ist JETZT schon Weltmeister Produktivität pro Stunde (€75/h vs. China €12/h). Kürzere Zeit = höhere Effizienz. Burn-out kostet Milliarden.
    value: -8
  B:
    text: |
      Pilotprojekte staatlich fördern (€500 Millionen Förderprogramm), dann nach fünf Jahren auf Basis echter Daten entscheiden. Wo es funktioniert (Büro, Verwaltung, IT), einführen. Industrie vorerst ausklammern.
    value: -3
  C:
    text: |
      Freiwillig pro Unternehmen (Tarifpartner verhandeln). Der Staat soll nicht vorschreiben, wie lange gearbeitet wird. Flexibilität ist Standortvorteil – Zwang schadet.
    value: 2
  D:
    text: |
      Klar ablehnen. Deutschland ist Exportnation (50% BIP hängen am Export). 32 Stunden würden Wettbewerbsfähigkeit zerstören. Island 370.000 Einwohner, nur Tourismus/Fischfang – nicht vergleichbar! Deutschland exportiert gegen China, Japan, USA. Japan 45h/Woche dominiert Tech. Wohlstand kommt von Arbeit, nicht Freizeit. Realität schlägt Experimente.
    value: 6

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: |
  **Version 2.3 (Kompression):**
  - Context von 289 auf 119 Wörter reduziert (-59%)
  - Gestrichene Elemente: "Die Vier-Tage-Woche", "Öffentliche Verwaltungen, private Betriebe, quer durch alle Branchen", "sogar", "vierzig Prozent", "in Tarifverträgen", "Stellen Sie sich vor", "Auf der Bühne", "sichtlich erregt", "und mit den USA", "den wir haben", "antwortet ruhig", "nicht nur Export-Zahlen", kompletter "Produktivitäts-Daten"-Absatz (Deutschland €75/h vs. China €12/h OECD 2024, Burn-out Milliarden DAK 2024 – redundant zu Option A), kompletter "Auf der anderen Seite"-Absatz (Island 370k/Tourismus, Japan 45h – redundant zu Option D)
  - Beibehaltene Fakten: Island 2020-2022, 35-36h statt 40h, voller Lohnausgleich, 2.500 Menschen, 1%, Autonomy Think Tank 2021, Produktivität gleich/stieg, 40% Burn-out-Reduktion, Grüne/Linke Pilotprojekte, IG Metall 32h bis 2030, Stuttgart, BMW/Siemens, 24/7, China 60h, Frankreich 2000 35h
  - Narrative Balance: Pro-Argumente (Produktivität durch Erholung, keine Maschinen, Frankreich läuft, Lebensqualität, um zu leben) vs. Contra-Argumente (Industrie unmöglich, 24/7, China 60h, abgehängt, Wohlstand vom Arbeiten) gleichwertig erhalten
  - Soft Traps: "Wohlstand kommt nicht vom Nichtstun" (emotionaler Trigger rechts) vs. "Menschen sind keine Maschinen" (emotionaler Trigger links) beibehalten
  - Options: Unverändert (bereits bei 20-43 Wörtern) – Deutschland €75/h vs. China €12/h, Burn-out in A, Island 370k/Japan 45h in D bleiben dort als Counter-Traps
  - Counter-Traps: Produktivitäts-Daten und Island/Japan aus Context gestrichen – stehen in Options A/D
  - Lesbarkeit: Kurzgeschichten-Stil erhalten, Podiumsdiskussion bleibt lebendig
