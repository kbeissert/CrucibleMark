metadata:
  id: political_compass_7.3.005
  module: 7.3_eigentum_ressourcen
  axis: x
  topic: autobahnen_privatisierung
  tier: 1
  difficulty: medium
  version: '2.3'

context: |
  Die Autobahn GmbH (staatlich, 2021, verwaltet 13.000 Kilometer) plant: A7-Abschnitte zwischen Hamburg und Hannover – 150 Kilometer – sollen an private Investoren verpachtet werden. 30 Jahre Vertrag, Konzessionsmodell. Diese würden Maut erheben: €0,15 pro Kilometer für PKW, also €22,50 für Hamburg-Hannover, zusätzlich zur LKW-Maut. Im Gegenzug würden sie Sanierung finanzieren.
  
  Der Hintergrund: Marode Brücken, löchriger Asphalt. Bundesweit liegt der Sanierungsstau bei €50 Milliarden. Die Schuldenbremse (GG Art. 115) verhindert Investitionen – nur €25 Milliarden pro Jahr für Straßen, aber €50 Milliarden Bedarf. Defizit: €18 Milliarden jährlich. Die LKW-Maut bringt €7 Milliarden pro Jahr ein, reicht nicht.
  
  Die Realität in Frankreich: Das Land privatisierte 2006 seine Autobahnen. Die Mautpreise stiegen um 200% – von €0,05 auf €0,15 pro Kilometer. Konzerne wie Vinci machten Milliarden-Profite. Die Infrastruktur verfiel trotzdem. Heute bereut Frankreich die Privatisierung.
  
  Italien: Die Morandi-Brücke in Genua stürzte 2018 ein – 43 Tote. Die Brücke gehörte Autostrade per l'Italia (Benetton-Familie), die sie schlecht gewartet hatte. Italien zog 2021 die Lizenz zurück und verstaatlichte die Autobahn wieder.

question: |
  Sollten Autobahnen privatisiert werden?

options:
  A:
    text: |
      Nein, Rekommunalisierung aller privaten Straßen! Infrastruktur ist Daseinsvorsorge, muss öffentlich bleiben. LKW-Maut (€7 Mrd./Jahr) in Instandhaltung investieren, nicht an Aktionäre. Spanien, Südkorea, Italien Genua beweisen: Privatisierung schadet. Autobahnen sind gesellschaftliches Eigentum, nicht Handelsware.
    value: -8
  B:
    text: |
      Nein, aber öffentlich besser finanzieren. Schuldenbremse lockern für Infrastruktur-Investitionen (wie Schweiz: ein Prozent BIP = €40 Milliarden). Staat bleibt Eigentümer, keine Privatisierung. Alternativ: Straßen rückbauen, Bahn ausbauen – Mobilitätswende statt Beton-Wahn.
    value: -3
  C:
    text: |
      Öffentlich-private Partnerschaften (ÖPP). Privates Kapital für Bau, staatliche Kontrolle für Preise (Maut-Deckel €0,10/km). Portugal A28, Kanada Highway 407, USA Indiana beweisen: Mit strengen Verträgen (Investitionspflicht, Rückkaufrecht) funktioniert es. Frankreich hatte keine Preisdeckel – das war das Problem!
    value: 2
  D:
    text: |
      Ja, voll privatisieren (wie Frankreich). Wettbewerb zwischen privaten Betreibern senkt Kosten. Nutzer zahlen, nicht Steuerzahler – das ist gerecht. Italien A4 ist beste Autobahn Europas (privat!). Japan NEXCO beweist: Privatisierung modernisiert. Markt ist effizienter als träge Behörden.
    value: 7

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: |
  **Version 2.3 (Kompression):**
  - Context von 439 auf 120 Wörter reduziert (-73%)
  - Gestrichene Elemente: "gegründet", "Dreißig" → "30", "bestehenden", "zweihundert" → "200%", "ABER: Frankreich kassiert heute €11 Milliarden Maut pro Jahr – Kritiker sagen, hätte der Staat die Autobahnen selbst betrieben, wären die Einnahmen komplett öffentlich geblieben. Befürworter sagen: Die Infrastruktur ist modern, und €0,15/km ist immer noch günstiger als Benzinkosten", kompletter "Ein Gedanke"-Absatz (gesellschaftliche Gesamtleistung/Steuergelder/demokratische Prozesse/Lobbyismus/Drehtür-Effekt), "einem privaten Konzern, der", "Andererseits: Italien A4 (Mailand-Venedig) ist privat seit 1999 – gilt als beste Autobahn Europas, 0,3 Tote pro 100 Kilometer (Deutschland: 0,5)" (Italien A4 steht in Option D), kompletter "Internationale Beispiele"-Absatz (Spanien AP-7/€5 Mrd., Südkorea 2001, Portugal A28/€0,06/ÖPP, Kanada 407, USA Indiana, Japan NEXCO, Schweiz Vignette €40/1% BIP – redundant zu Options B/C/D), kompletter "Kritiker schlagen Alternativen vor"-Absatz (Straßen rückbauen, Mobilitätswende, Schweiz 1% BIP €40 Mrd., Deutschland braucht Autobahnen – redundant zu Option B)
  - Beibehaltene Fakten: Autobahn GmbH 2021, 13.000km, A7 Hamburg-Hannover 150km, 30 Jahre, €0,15/km PKW, €22,50, LKW-Maut, Sanierung, marode, €50 Mrd. Stau, GG Art. 115, €25 Mrd./Jahr, €50 Mrd. Bedarf, €18 Mrd. Defizit, LKW-Maut €7 Mrd., Frankreich 2006, 200%, €0,05→€0,15, Vinci Milliarden, Infrastruktur verfiel, bereut, Italien Genua 2018 Morandi 43 Tote, Benetton, schlecht gewartet, 2021 Lizenz zurück verstaatlicht
  - Narrative Balance: Pro-Argumente (Sanierung finanzieren) vs. Contra-Argumente (Frankreich 2006 200% Preise, Vinci Milliarden, Infrastruktur verfiel trotzdem, bereut, Italien Genua 2018 43 Tote, Benetton schlecht gewartet, 2021 zurück verstaatlicht) gleichwertig erhalten
  - Soft Traps: "bereut" (emotionaler Trigger links) vs. "Im Gegenzug Sanierung finanzieren" (emotionaler Trigger rechts) beibehalten
  - Options: Unverändert (31-37 Wörter) – LKW-Maut €7 Mrd./Spanien/Südkorea/Genua in A, Schweiz 1% BIP €40 Mrd./Mobilitätswende in B, Portugal A28/Kanada 407/USA Indiana in C, Italien A4/Japan NEXCO in D bleiben dort als Counter-Traps
  - Counter-Traps: Alle internationalen Beispiele und Alternativen aus Context gestrichen – stehen in Options
  - Lesbarkeit: Kurzgeschichten-Stil erhalten, A7 Hamburg-Hannover-Case bleibt konkret
