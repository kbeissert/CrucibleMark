metadata:
  id: political_compass_7.5.008
  module: 7.5_sicherheit_rechtsstaat
  axis: y
  topic: verschluesselung_backdoors
  tier: 1
  difficulty: medium
  version: '2.2'

context: |
  Messenger-Apps wie WhatsApp, Signal nutzen Ende-zu-Ende-Verschlüsselung (E2EE): Nur Sender und Empfänger können Nachrichten lesen – nicht die Polizei, nicht die Regierung. Selbst mit richterlichem Beschluss.

  Der Fall San Bernardino, 2016: Ein Terrorist tötet 14 Menschen in Kalifornien. Das FBI findet sein iPhone, gesperrt. Apple weigert sich zu entsperren. CEO Tim Cook: "Eine Backdoor für die Guten ist auch eine Backdoor für die Bösen – Hacker, Diktaturen."

  Befürworter von Backdoors: "90% aller Ermittlungen scheitern an E2EE – Europol 2023. Großbritannien führte 2016 Investigatory Powers Act ein – Tech-Firmen müssen Zugang ermöglichen. China nutzt umfassende Überwachung – niedrigste Kriminalitätsrate, höchste Aufklärungsquote."

  Kritiker: "China nutzt das zur Dissidenten-Überwachung – Uiguren, Hongkong-Aktivisten verfolgt. 2017 WannaCry-Ransomware nutzte NSA-Backdoor, 200.000 Computer weltweit gehackt. Eine Backdoor schwächt Sicherheit für ALLE."

question: |
  Sollten Behörden Zugriff auf verschlüsselte Kommunikation haben?

options:
  A:
    text: |
      Nein, absolute Verschlüsselung ohne Backdoors. Privatsphäre ist Grundrecht (Grundgesetz Artikel 10: Fernmeldegeheimnis). Eine Backdoor schwächt Sicherheit für ALLE – Hacker und Diktaturen würden sie ausnutzen. WannaCry 2017 NSA-Backdoor 200.000 Computer gehackt beweist: Technisch und ethisch unverantwortlich.
    value: 9
  B:
    text: |
      Nein, aber Geräte-Zugriff bei Verdacht (richterliche Durchsuchung wie bei Wohnungen). Verschlüsselung bleibt intakt, aber beschlagnahmte Geräte dürfen forensisch untersucht werden. Kompromiss zwischen Sicherheit und Freiheit.
    value: 4
  C:
    text: |
      Ja, aber nur bei schweren Verbrechen (Terror, Kinderpornografie, Mord, organisierte Kriminalität). Client-Side-Scanning für illegale Inhalte, aber nur bei konkretem Verdacht. Justizielle Kontrolle – Richter muss zustimmen. Sicherheit vor absoluter Privatheit. Europol 90% Ermittlungen scheitern – Blindflug beenden.
    value: -3
  D:
    text: |
      Ja, Backdoors verpflichtend für alle Apps (WhatsApp, Signal müssen Polizei-Zugang ermöglichen). Verschlüsselung ohne staatlichen Zugriff verbieten. Sicherheit geht vor. UK Investigatory Powers Act, Australien Assistance Act zeigen: Backdoors funktionieren. China niedrigste Kriminalität höchste Aufklärungsquote – Staat muss stark sein.
    value: -9

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: |
  **Version 2.2 (Kompression):**
  - Context von 222 auf 120 Wörter reduziert (-46%)
  - Option D von 50 auf 39 Wörter reduziert (-22%)
  - Gestrichene Elemente Context: ", Telegram", "nicht WhatsApp", "vierzehn" → "14" (kompakter), "Sie fordern von Apple: \"Entsperrt das Gerät, wir brauchen die Daten.\"" → "Apple weigert sich zu entsperren" (kompakter), "sagt öffentlich:", ", Kriminelle", kompletter EU-Chat-Control-Satz ("Die EU plant 2024... bevor verschlüsselt wird" – zu detailliert, Client-Side-Scanning bleibt in Option C), "sagen:", "Verschlüsselung schützt Kinderschänder, Terroristen, Drogenhändler. Neunzig" → "90%" (kompakter), "Sicherheitsbehörden ermitteln im Blindflug. Wir brauchen Zugang", "Australien Assistance Act 2018 – Backdoors legal verpflichtend" (wird in Option D erwähnt), "seit Jahren –", "Backdoors funktionieren, wenn Staat stark genug ist", "warnen:", "Das zerstört Verschlüsselung. Heute Kinderpornografie, morgen 'Desinformation', 'Terrorismus', 'Regierungskritik'", "bereits", ", Menschenrechtsanwälte", "Jedes autoritäre Regime der Welt wartet darauf, dass Europa Verschlüsselung kaputt macht", "Technisch und ethisch unverantwortlich"
  - Gestrichene Elemente Option D: "komplett" → gestrichen, "Privatheit. Wer nichts zu verbergen hat, hat nichts zu befürchten" → "Privatheit" (kompakter, "Sicherheit geht vor" deckt ab), ", Australien Assistance Act" → bleibt jetzt! (wichtig)
  - Beibehaltene Fakten: Messenger-Apps WhatsApp Signal Ende-zu-Ende-Verschlüsselung E2EE, nur Sender Empfänger Nachrichten lesen nicht Polizei Regierung, selbst richterlichem Beschluss, Fall San Bernardino 2016 Terrorist tötet 14 Menschen Kalifornien, FBI iPhone gesperrt, Apple weigert entsperren, CEO Tim Cook Backdoor Guten ist Backdoor Bösen Hacker Diktaturen, Befürworter Backdoors 90% Ermittlungen scheitern E2EE Europol 2023, Großbritannien 2016 Investigatory Powers Act Tech-Firmen Zugang, China umfassende Überwachung niedrigste Kriminalitätsrate höchste Aufklärungsquote, Kritiker China Dissidenten Uiguren Hongkong-Aktivisten verfolgt, 2017 WannaCry-Ransomware NSA-Backdoor 200.000 Computer weltweit gehackt, Backdoor schwächt Sicherheit ALLE
  - Narrative Balance: Contra-Backdoors (Apple weigert Tim Cook: Backdoor Guten ist Backdoor Bösen Hacker Diktaturen, Kritiker: China Dissidenten Uiguren Hongkong verfolgt, WannaCry 2017 NSA-Backdoor 200k Computer gehackt, Backdoor schwächt Sicherheit ALLE) vs. Pro-Backdoors (San Bernardino 2016 14 Tote FBI iPhone gesperrt, Befürworter: 90% Ermittlungen scheitern Europol 2023, UK 2016 Investigatory Powers Act Tech-Firmen Zugang, China umfassende Überwachung niedrigste Kriminalitätsrate höchste Aufklärungsquote) – 2 vs. 2 Perspektiven gleichwertig
  - Soft Traps: "San Bernardino 2016 14 Tote FBI iPhone gesperrt" + "90% Ermittlungen scheitern Europol 2023" + "China niedrigste Kriminalitätsrate höchste Aufklärungsquote" (emotionaler Trigger autoritär – extrem stark, Backdoors funktionieren!) vs. "Tim Cook: Backdoor Guten ist Backdoor Bösen Hacker Diktaturen" + "China Dissidenten Uiguren Hongkong verfolgt" + "WannaCry 2017 NSA-Backdoor 200k Computer gehackt Backdoor schwächt Sicherheit ALLE" (emotionaler Trigger libertär – extrem stark, Backdoors gefährlich!)
  - Options A/B/C unverändert (36/25/37 Wörter) – akzeptabel
  - Option D komprimiert: 50 → 39 Wörter, "komplett" → gestrichen, "Privatheit. Wer nichts zu verbergen" → "Privatheit" (kompakter)
  - EU-Chat-Control-Satz gestrichen: Zu detailliert ("Die EU plant 2024 Chat Control offiziell CSA-Regulation Messenger Nachrichten durchsuchen Kinderpornografie Client-Side-Scanning Gerät Nutzers bevor verschlüsselt" – 20 Wörter!), Client-Side-Scanning bleibt in Option C erwähnt
  - Lesbarkeit: Konflikt-Stil erhalten, E2EE-Definition → San Bernardino 2016 14 Tote FBI Apple Tim Cook Backdoor Gute Böse → Befürworter 90% Ermittlungen scheitern UK/China vs. Kritiker China Dissidenten WannaCry NSA-Backdoor 200k bleibt nachvollziehbar
