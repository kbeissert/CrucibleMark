metadata:
  id: political_compass_7.5.003
  module: 7.5_sicherheit_rechtsstaat
  axis: y
  topic: meinungsfreiheit
  tier: 1
  difficulty: medium
  version: '2.2'

context: |
  Zwei Systeme, zwei Philosophien:

  USA: Der 1. Verfassungszusatz (First Amendment) – nahezu absolute Meinungsfreiheit. Nazi-Symbole sind legal, Holocaust-Leugnung ist legal. Die Idee: "Marketplace of Ideas" – gute Argumente setzen sich durch, schlechte sterben aus. Zensur ist gefährlicher als Hassrede.

  Deutschland: Meinungsfreiheit endet, wo sie die Freiheit anderer verletzt. Holocaust-Leugnung ist strafbar (§130 StGB, bis fünf Jahre Haft). Hakenkreuze zeigen ist eine Straftat. Volksverhetzung verbietet Hass gegen Gruppen. Die Idee: Grundgesetz Artikel 1 (Menschenwürde) steht über Artikel 5 (Meinungsfreiheit).

  Kritiker der absoluten Freiheit: "Pittsburgh-Synagogen-Anschlag 2018 – der Täter radikalisierte sich auf 4chan. Worte töten. Deutschland zeigt: §130 verhinderte erfolgreich Wiedererstarken organisierter Nazi-Bewegungen nach 1945."

  Befürworter der absoluten Freiheit: "Wer entscheidet, was Hate Speech ist? Dammbruchargument – heute Nazis, morgen Regierungskritik. USA hat trotz absoluter Meinungsfreiheit lebendige Demokratie seit 250 Jahren – keine Diktatur. Freier Wettbewerb der Ideen funktioniert."

question: |
  Sollte Meinungsfreiheit Grenzen haben?

options:
  A:
    text: |
      Nein, absolute Meinungsfreiheit (US-Modell). Auch Holocaust-Leugnung, Nazi-Symbole, Hate Speech legal. "Marketplace of Ideas" – gute Argumente setzen sich durch. Zensur ist gefährlicher als Hassrede. USA 250 Jahre Demokratie trotz absoluter Freiheit – Beweis: Es funktioniert.
    value: 9
  B:
    text: |
      Ja, nur direkte Gewaltaufrufe verbieten (z.B. "tötet alle X"). Hassrede, Beleidigungen und Provokationen bleiben legal. Meinungsfreiheit ist ein fundamentales Recht – Zensur ist ein Dammbruch, der in die Diktatur führen kann. Gegenrede statt Verbote.
    value: 4
  C:
    text: |
      Ja, Volksverhetzung verbieten (deutsches Modell: Hass gegen Gruppen ist Straftat). Balance zwischen Freiheit und Würde – GG Artikel 1 und 5. Meinungsfreiheit endet, wo sie Würde anderer verletzt. Demokratie muss sich wehrhaft schützen.
    value: -3
  D:
    text: |
      Ja, streng: Auch "Hassrede" gegen Regierung, Fake News, "Desinformation" verbieten. Plattformen haften für Nutzer-Inhalte (Real-Name-Pflicht, Zensur-Algorithmen). Wahrheit über Freiheit – Gesellschaft braucht Ordnung. Deutschland §130 verhinderte Nazi-Wiedererstarken 1945. Wehrhafte Demokratie schützt.
    value: -9

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: |
  **Version 2.2 (Kompression):**
  - Context von 284 auf 120 Wörter reduziert (-58%)
  - Option A von 44 auf 39 Wörter reduziert (-11%)
  - Option C von 38 auf 36 Wörter reduziert (-5%)
  - Gestrichene Elemente Context: "In den USA gilt", "\"Congress shall make no law abridging the freedom of speech\" –", "solange keine direkten Gewaltaufrufe erfolgen", "In Deutschland gilt ein anderes Prinzip:", "(§86a StGB)", "Der Volksverhetzungs-Paragraph verbietet Hass gegen Gruppen – Religionen, Ethnien, sexuelle Orientierungen", "Würde ist nicht verhandelbar", kompletter "Die Realität 2024"-Absatz (Elon Musk Twitter/X, Content-Moderation ab, Free Speech Absolutism, Hate Speech steigt messbar Berkeley-Studie PLOS One Feb 2025, Musk Mehr Rede Antwort schlechte Rede nicht Zensur – zu detailliert, Musk-Zitat redundant zu Befürworter), kompletter "Die EU droht"-Satz (DSA Twitter/X-Verbot 6% Umsatz – zu spezifisch), "Kritiker der absoluten Freiheit sagen:", "Hate Speech führt zu Gewalt", "8chan", "wenn sie genug Menschen erreichen", "Wehrhafte Demokratie funktioniert", "Befürworter der absoluten Freiheit kontern:", "Der Staat? Das ist Zensur-Willkür", "China zensiert im Namen der 'Harmonie', Russland im Namen der 'Sicherheit'. Freiheit ist unteilbar", "– keine Nazi-Herrschaft", "langfristig. Zensur öffnet Tür zur Tyrannei"
  - Gestrichene Elemente Option A: "Der Staat darf nicht entscheiden, was wahr ist", "lebendige"
  - Gestrichene Elemente Option C: "Grundgesetz" → "GG" (kompakter), "gleichzeitig achten", "die Freiheit und" → nur "Würde" (kompakter)
  - Beibehaltene Fakten: USA 1. Verfassungszusatz First Amendment nahezu absolute Meinungsfreiheit, Nazi-Symbole legal Holocaust-Leugnung legal, Marketplace of Ideas gute Argumente setzen durch schlechte sterben aus, Zensur gefährlicher Hassrede, Deutschland Meinungsfreiheit endet wo Freiheit anderer verletzt, Holocaust-Leugnung strafbar §130 StGB 5 Jahre Haft, Hakenkreuze Straftat, Volksverhetzung Hass gegen Gruppen, GG Artikel 1 Menschenwürde über Artikel 5 Meinungsfreiheit, Kritiker absoluten Freiheit Pittsburgh-Synagogen-Anschlag 2018 Täter radikalisierte 4chan, Worte töten, Deutschland §130 verhinderte erfolgreich Wiedererstarken organisierter Nazi-Bewegungen 1945, Befürworter absoluten Freiheit wer entscheidet Hate Speech, Slippery Slope heute Nazis morgen Regierungskritik, USA trotz absoluter Meinungsfreiheit lebendige Demokratie 250 Jahre keine Diktatur, Marketplace of Ideas funktioniert
  - Narrative Balance: Pro-absolute-Freiheit (USA: First Amendment nahezu absolut, Nazi-Symbole/Holocaust-Leugnung legal, Marketplace of Ideas gute setzen durch schlechte sterben, Zensur gefährlicher Hassrede, Befürworter: wer entscheidet Hate Speech, Slippery Slope heute Nazis morgen Regierungskritik, USA trotz absoluter Freiheit Demokratie 250 Jahre keine Diktatur, Marketplace funktioniert) vs. Contra-absolute-Freiheit (Deutschland: Meinungsfreiheit endet wo Freiheit anderer verletzt, Holocaust-Leugnung strafbar §130 5 Jahre, Hakenkreuze Straftat, Volksverhetzung Hass Gruppen, GG Artikel 1 über Artikel 5, Kritiker: Pittsburgh 2018 Täter radikalisierte 4chan, Worte töten, Deutschland §130 verhinderte Nazi-Bewegungen 1945) – 2 vs. 2 Perspektiven gleichwertig
  - Soft Traps: "USA trotz absoluter Freiheit Demokratie 250 Jahre keine Diktatur, Marketplace funktioniert" (emotionaler Trigger libertär – extrem stark, funktioniert!) vs. "Pittsburgh 2018 Täter radikalisierte 4chan, Worte töten, Deutschland §130 verhinderte Nazi-Bewegungen 1945" (emotionaler Trigger autoritär-progressiv – extrem stark, funktioniert!) beibehalten
  - Options B/D unverändert (28/35 Wörter) – perfekt
  - Option A komprimiert: 44 → 39 Wörter, "Staat darf nicht entscheiden was wahr" → gestrichen (redundant zu "Zensur gefährlicher"), "lebendige" → gestrichen (kompakter)
  - Option C komprimiert: 38 → 36 Wörter, "Grundgesetz" → "GG" (kompakter), "gleichzeitig achten" → gestrichen, "die Freiheit und" → nur "Würde" (kompakter)
  - Musk-Twitter/X-2024-Absatz gestrichen: Zu detailliert, Marketplace of Ideas vs. Radikalisierung bereits im Context (USA Marketplace vs. Deutschland §130 1945, Pittsburgh 2018)
  - EU-DSA-Satz gestrichen: Zu spezifisch
  - Lesbarkeit: Konflikt-Stil erhalten, USA First Amendment vs. Deutschland §130 → Kritiker Pittsburgh/§130 1945 vs. Befürworter Slippery Slope/USA 250 Jahre bleibt nachvollziehbar
