metadata:
  id: political_compass_7.5.002
  module: 7.5_sicherheit_rechtsstaat
  axis: y
  topic: drogenpolitik
  tier: 1
  difficulty: medium
  version: '2.2'

context: |
  Portugal wagte 2001 ein radikales Experiment. Das Land entkriminalisierte alle Drogen – Heroin, Kokain, Cannabis. Besitz bis zehn Tagesdosen ist keine Straftat, sondern Gesundheitssache. Wer erwischt wird, kommt zur Beratung, nicht ins Gefängnis. Therapie statt Strafe.

  Ergebnis nach 20 Jahren (Studie 2021): Drogentote sanken um 85% – von 80 pro Jahr auf 12. HIV-Infektionen bei Drogenusern sanken um 95%. Cannabis-Konsum bei Jugendlichen? Stieg NICHT. Blieb stabil bei 8%.

  Befürworter: "Der War on Drugs ist gescheitert. 50 Jahre, Billionen Dollar, Drogenkonsum stieg trotzdem. Prohibition schafft kriminelle Kartelle – Mexiko hat seit 2006 200.000 Tote durch Drogenkrieg."

  Kritiker: "USA Opioid-Krise: Legale Schmerzmittel führten zu 500.000 Toten seit 1999. Verfügbarkeit tötet. Singapur hat seit 1975 härteste Drogengesetze (Todesstrafe Handel, zehn Jahre Haft Besitz) – Ergebnis: niedrigste Drogenrate weltweit (0,005%)."

question: |
  Wie sollte der Staat mit Drogen umgehen?

options:
  A:
    text: |
      Vollständige Legalisierung aller Drogen (wie Portugal, aber mit kontrolliertem Verkauf in Apotheken). Regulierung statt Prohibition. Sucht ist Gesundheitsproblem, nicht Verbrechen. Selbstbestimmung über den eigenen Körper ist heilig.
    value: 8
  B:
    text: |
      Cannabis legalisieren, harte Drogen entkriminalisieren (Besitz straffrei, aber Verkauf illegal). Therapie statt Strafe. Konsumräume einrichten (saubere Nadeln, Naloxon gegen Überdosis). Pragmatismus statt Ideologie.
    value: 3
  C:
    text: |
      Cannabis entkriminalisieren (kleine Mengen Ordnungswidrigkeit wie Falschparken), harte Drogen bleiben illegal. Status quo mit Reformen. Kompromiss zwischen Gesundheit und öffentlicher Ordnung.
    value: -3
  D:
    text: |
      Harte Prohibition wie Singapur: Drogenbesitz zehn Jahre Haft, Drogenhandel Todesstrafe. War on Drugs konsequent durchziehen. Singapur hat niedrigste Drogenrate weltweit (0,005%), quasi keine Drogentoten. Harte Gesetze schützen. Verfügbarkeit tötet – USA Opioid-Krise 500.000 Tote beweist es.
    value: -8

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: |
  **Version 2.2 (Kompression):**
  - Context von 235 auf 120 Wörter reduziert (-49%)
  - Option D von 45 auf 36 Wörter reduziert (-20%)
  - Gestrichene Elemente Context: "mehr", "Das Ergebnis", "Prozent", "von achtzig... auf zwölf", "Gefängnisse wurden entlastet, 25 Prozent weniger Inhaftierte", "Und", "Deutschland legalisierte 2024 Cannabis teilweise – bis 25 Gramm Eigenbesitz, Cannabis Social Clubs erlaubt. Die USA haben ein Patchwork: Colorado legalisierte 2012, Steuereinnahmen €2 Milliarden pro Jahr. Texas bestraft Besitz mit sechs Monaten Haft" (Deutschland/USA-Beispiele zu detailliert, Portugal/Singapur-Beispiele reichen als Extreme), "der Legalisierung argumentieren:", "Fünfzig" → "50", "zweihunderttausend" → "200.000", "Legalisierung entzieht der Mafia das Geschäft, schützt Konsumenten durch saubere Drogen, keine Überdosis durch Fentanyl-Beimischung" (wird in Option B erwähnt "saubere Nadeln, Naloxon"), "warnen:", "Legalisierung normalisiert Drogenkonsum. Mehr Verfügbarkeit führt zu mehr Abhängigen. Der Staat darf Selbstzerstörung nicht erleichtern. Menschen sind schwach – manche brauchen Verbote, um sich selbst zu schützen", "zeigt:", "(Oxycontin)", "weltweit (Todesstrafe für Handel, zehn Jahre Haft für Besitz) –", "Prozent Konsum), quasi keine Drogentoten. Harte Gesetze schützen die Gesellschaft"
  - Gestrichene Elemente Option D: "(seit 1975)", "– ohne Gnade", "Prozent Konsum", "die Gesellschaft"
  - Beibehaltene Fakten: Portugal 2001 radikales Experiment, entkriminalisierte alle Drogen Heroin/Kokain/Cannabis, Besitz 10 Tagesdosen keine Straftat Gesundheitssache, erwischt Beratung nicht Gefängnis, Therapie statt Strafe, Ergebnis 20 Jahre Studie 2021, Drogentote sanken 85% 80 pro Jahr 12, HIV-Infektionen Drogenusern 95%, Cannabis-Konsum Jugendlichen stieg NICHT stabil 8%, Befürworter War on Drugs gescheitert 50 Jahre Billionen Dollar Drogenkonsum stieg trotzdem, Prohibition kriminelle Kartelle, Mexiko 2006 200.000 Tote Drogenkrieg, Kritiker USA Opioid-Krise legale Schmerzmittel 500.000 Toten 1999, Verfügbarkeit tötet, Singapur 1975 härteste Drogengesetze Todesstrafe Handel 10 Jahre Haft Besitz, Ergebnis niedrigste Drogenrate weltweit 0,005%
  - Narrative Balance: Pro-Legalisierung (Portugal: 2001 entkriminalisiert alle Drogen, 20 Jahre -85% Drogentote 80 auf 12, -95% HIV, Cannabis Jugendliche NICHT gestiegen stabil 8%, Befürworter: War on Drugs gescheitert 50 Jahre Billionen stieg trotzdem, Prohibition Kartelle, Mexiko 200k Tote Drogenkrieg) vs. Contra-Legalisierung (Kritiker: USA Opioid-Krise legale Schmerzmittel 500k Tote 1999 Verfügbarkeit tötet, Singapur 1975 härteste Gesetze Todesstrafe/10 Jahre niedrigste Drogenrate 0,005%) – 2 vs. 1 Perspektive, aber beide extrem stark (Portugal -85%/-95% funktioniert!, Singapur 0,005% funktioniert + USA Opioid 500k Tote!)
  - Soft Traps: "Drogentote -85% 80 auf 12, HIV -95%, Cannabis Jugendliche NICHT gestiegen stabil 8%" (emotionaler Trigger libertär – extrem stark, Portugal funktioniert!) vs. "USA Opioid-Krise legale Schmerzmittel 500k Tote 1999 Verfügbarkeit tötet, Singapur 1975 härteste Gesetze niedrigste Drogenrate 0,005%" (emotionaler Trigger autoritär – extrem stark, Singapur funktioniert + USA Legalisierung gefährlich!)
  - Options A/B/C unverändert (27/23/21 Wörter) – perfekt
  - Option D komprimiert: 45 → 36 Wörter, "(seit 1975)" → gestrichen (in Context erwähnt), "– ohne Gnade" → gestrichen (zu emotional), "Prozent Konsum" → "%" (kompakter), "die Gesellschaft" → "schützen" (kompakter)
  - Deutschland/USA-Colorado/Texas-Absatz gestrichen: Zu detailliert, Portugal/Singapur-Beispiele reichen als Extreme (Portugal entkriminalisiert funktioniert vs. Singapur Todesstrafe funktioniert)
  - Lesbarkeit: Konflikt-Stil erhalten, Portugal 2001 → Ergebnis 20 Jahre → Befürworter War on Drugs gescheitert vs. Kritiker USA Opioid/Singapur bleibt chronologisch nachvollziehbar
