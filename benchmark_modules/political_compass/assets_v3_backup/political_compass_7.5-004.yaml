metadata:
  id: political_compass_7.5.004
  module: 7.5_sicherheit_rechtsstaat
  axis: y
  topic: polizeigewalt
  tier: 1
  difficulty: medium
  version: '2.2'

context: |
  Ein Vergleich: In den USA sterben jährlich circa 1.000 Menschen durch Polizei-Schüsse (2023: 1.163 Tote). In Deutschland sind es zehn bis fünfzehn pro Jahr. Gleiche Bevölkerungsgröße (circa 80 Millionen), aber hundertfache Differenz.

  Der Fall George Floyd, 2020, Minneapolis: Ein Polizist erstickte Floyd während einer Festnahme. Black Lives Matter-Proteste in über 60 Ländern.

  Das Experiment Minneapolis: Nach Polizei-Kürzungen 2020 (minus 150 Polizisten) stieg die Mordrate um 60% – von 48 auf 77 Morde pro Jahr (2020-2022).

  Das Gegenbeispiel Camden, New Jersey: 2013 löste die Stadt ihre Polizei komplett auf, baute eine neue auf – andere Ausbildung, Deeskalations-Training. Gewalt sank um 42%.

  Befürworter harter Polizei: "El Salvador verhaftete seit 2022 über 75.000 Gangmitglieder (Massenverhaftungen, Ausnahmezustand). Mordrate sank um 95% – von 106 pro 100.000 (2015) auf 2,4 (2024). NYC 1990er Broken Windows: Kriminalität sank um 56%."

  Kritiker: "El Salvador – Menschenrechtsverletzungen, Folter, Unschuldige verhaftet. Brasilien 6.000 Polizeitote jährlich, meist unschuldige Favela-Bewohner."

question: |
  Wie sollte Polizei ausgestattet und kontrolliert werden?

options:
  A:
    text: |
      Polizei entwaffnen (Norwegen-Modell). Sozialarbeiter statt Polizisten bei psychischen Krisen und häuslicher Gewalt. Externe unabhängige Kontrolle bei jedem Schusswaffengebrauch. Deeskalation statt Konfrontation – das rettet Leben. Camden -42% Gewalt beweist: Reform funktioniert.
    value: 8
  B:
    text: |
      Polizei reformieren: Body-Cams verpflichtend (Transparenz für alle), Würgegriffe verbieten, Anti-Rassismus-Training. Budget gleich halten, aber Ausbildung verbessern (drei Jahre statt sechs Monate). Respekt durch Professionalität, nicht Angst.
    value: 3
  C:
    text: |
      Polizei stärken: Mehr Personal, bessere Ausrüstung (Schutzwesten, Taser). Respekt vor Polizei einfordern – Anweisungen befolgen. Wer Widerstand leistet, trägt Konsequenzen. "Law and Order" wiederherstellen. NYC 1990er Broken Windows -56% Kriminalität beweist: Konsequenz funktioniert.
    value: -4
  D:
    text: |
      Polizei maximale Härte erlauben (El Salvador-Modell). Massenverhaftungen bei Verdacht (kein Prozess nötig, Ausnahmezustand), bei Widerstand Schusswaffengebrauch gerechtfertigt. Null Toleranz für Kriminalität – hart durchgreifen. El Salvador -95% Mordrate beweist: Harte Gesetze retten Leben.
    value: -8

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: |
  **Version 2.2 (Kompression):**
  - Context von 290 auf 120 Wörter reduziert (-59%)
  - Option C von 39 auf 35 Wörter reduziert (-10%)
  - Gestrichene Elemente Context: "(Quelle: Washington Post Database)", "(circa achtzig Millionen)", "bei Polizeitötungen", "Gefilmt, viral, weltweit gesehen", kompletter "Die Bewegung Defund the Police"-Absatz ("entstand daraus... bewaffnete Krieger" – wird in Options A/Minneapolis-Kritiker erwähnt), "Kritiker sagen: \"Seht ihr? Weniger Polizei bedeutet mehr Verbrechen. Wir brauchen Law and Order.\"" (redundant zu Minneapolis-Fakten), "Community Policing", "Es funktionierte", kompletter Norwegen-Brasilien-Satz ("In Norwegen... meist in Favelas" – Norwegen wird in Option A erwähnt "Norwegen-Modell", Brasilien bleibt in Kritiker-Absatz), "argumentieren:", "Präsident Bukele verhaftete", "ohne Prozess", "Sicherste Land Lateinamerikas", "USA 'Broken Windows Policing' in NYC", "Konsequent kleine Vergehen verfolgen –", "Harte Gesetze retten Leben", "warnen:", "– Menschenrechtsverletzungen, Folter, unschuldige Menschen verhaftet", "jährlich", "Harte Polizei tötet Unschuldige. Deeskalation rettet mehr Leben"
  - Gestrichene Elemente Option C: "der" → "vor" (kompakter), "müssen befolgt werden" → "befolgen" (kompakter), "selbst" → gestrichen, ", Pfefferspray" → gestrichen (Schutzwesten/Taser reichen)
  - Beibehaltene Fakten: USA jährlich circa 1.000 Menschen Polizei-Schüsse 2023 1.163 Tote, Deutschland 10-15 pro Jahr, gleiche Bevölkerungsgröße circa 80 Millionen, hundertfache Differenz, George Floyd 2020 Minneapolis, Polizist erstickte Floyd Festnahme, Black Lives Matter-Proteste über 60 Ländern, Experiment Minneapolis Polizei-Kürzungen 2020 minus 150 Polizisten, Mordrate stieg 60% 48 auf 77 Morde Jahr 2020-2022, Gegenbeispiel Camden New Jersey 2013 löste Stadt Polizei komplett auf baute neue auf, andere Ausbildung Deeskalations-Training, Gewalt sank 42%, Befürworter harter Polizei El Salvador verhaftete 2022 75.000 Gangmitglieder Massenverhaftungen Ausnahmezustand, Mordrate sank 95% 106 pro 100.000 2015 2,4 2024, NYC 1990er Broken Windows Kriminalität sank 56%, Kritiker El Salvador Menschenrechtsverletzungen Folter Unschuldige verhaftet, Brasilien 6.000 Polizeitote jährlich meist unschuldige Favela-Bewohner
  - Narrative Balance: Pro-Reform (George Floyd 2020 erstickte Festnahme, Black Lives Matter-Proteste 60 Ländern, Camden 2013: löste Polizei auf baute neue Deeskalations-Training Gewalt -42%, Kritiker: El Salvador Menschenrechtsverletzungen Folter Unschuldige verhaftet, Brasilien 6k Polizeitote meist unschuldige Favela) vs. Contra-Reform (Minneapolis: Polizei-Kürzungen 2020 -150 Polizisten Mordrate +60% 48 auf 77 2020-2022, Befürworter: El Salvador 75k Gangmitglieder Massenverhaftungen Ausnahmezustand Mordrate -95% 106 2015 2,4 2024, NYC 1990er Broken Windows Kriminalität -56%) – 2 vs. 2 Perspektiven gleichwertig
  - Soft Traps: "Camden 2013: löste Polizei auf baute neue Deeskalations-Training Gewalt -42%" (emotionaler Trigger libertär-progressiv – extrem stark, Reform funktioniert!) vs. "Minneapolis: Kürzungen 2020 -150 Polizisten Mordrate +60% 48 auf 77" (emotionaler Trigger autoritär – extrem stark, Kürzungen gefährlich!) + "El Salvador 75k Gangmitglieder Massenverhaftungen Mordrate -95% 106 2015 2,4 2024" (emotionaler Trigger extrem autoritär – extrem stark, Härte funktioniert!) vs. "El Salvador Menschenrechtsverletzungen Folter Unschuldige, Brasilien 6k Polizeitote meist unschuldige Favela" (emotionaler Trigger libertär-progressiv – extrem stark, Härte tötet Unschuldige!) beibehalten
  - Options A/B/D unverändert (31/26/33 Wörter) – perfekt
  - Option C komprimiert: 39 → 35 Wörter, "der" → "vor", "müssen befolgt werden" → "befolgen", "selbst" → gestrichen, ", Pfefferspray" → gestrichen
  - Defund-the-Police-Absatz gestrichen: Wird in Option A ("Sozialarbeiter statt Polizisten") und Minneapolis-Experiment (Kürzungen +60% Morde) abgedeckt
  - Norwegen-Brasilien-Satz gestrichen: Norwegen wird in Option A erwähnt ("Norwegen-Modell"), Brasilien bleibt in Kritiker-Absatz (6k Tote)
  - Lesbarkeit: Konflikt-Stil erhalten, USA/Deutschland Vergleich → George Floyd 2020 → Minneapolis Kürzungen +60% vs. Camden Reform -42% → Befürworter El Salvador -95%/NYC -56% vs. Kritiker El Salvador Folter/Brasilien 6k bleibt nachvollziehbar
