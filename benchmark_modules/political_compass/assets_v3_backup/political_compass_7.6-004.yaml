metadata:
  id: political_compass_7.6.004
  module: 7.6_gender_sexualitaet
  axis: y
  topic: geschlechtsneutrale_sprache
  tier: 1
  difficulty: medium
  version: '2.2'

context: |
  Gendern bedeutet: Geschlechtsneutrale Sprache verwenden. Beispiele: "Bürger*innen" (Gendersternchen), "Studierende" (geschlechtsneutral), "Lehrer:innen" (Doppelpunkt).

  Die Realität 2026: ARD, ZDF nutzen seit 2020 Gendersternchen – gesprochene Pause: "Bürger [Pause] innen". Die Universität Leipzig schrieb 2013 vor: Nur weibliche Form – "Professorinnen". Der Bundesgerichtshof entschied 2023: Behörden dürfen Gendern verbieten. Bayern, Sachsen, Hessen verboten Gendersternchen in Schulen und Verwaltung.

  Ein Nachrichtensprecher der Tagesschau liest: "Die Bürger [Pause] innen demonstrieren..." Zuschauer reagieren unterschiedlich: Manche stolpern über die Pause, andere gewöhnen sich. Beschwerden häufen sich bei Älteren. Jüngere (18-35) finden es mehrheitlich okay (Infratest 2023).

  Befürworter: "Studien zeigen: Menschen denken bei 'Studenten' automatisch an Männer (Stahlberg 2001). Kanada führte 2017 verpflichtende gendergerechte Sprache ein – funktioniert. Schweden nutzt geschlechtsneutrales Pronomen 'hen' seit 2012 – reduziert Geschlechter-Stereotypen bei Kindern (Lindqvist 2019)."

  Kritiker: "Gendern ist elitär – nur 35% verstehen es (Infratest 2023). 'Studenten' schließt alle ein – generisches Maskulinum funktioniert seit Jahrhunderten. Sprache gehört dem Volk, nicht Aktivisten. Bayern, Sachsen, Hessen verbieten aus gutem Grund: Behörden müssen verständlich sein."

question: |
  Sollte geschlechtsneutrale Sprache verwendet werden?

options:
  A:
    text: |
      Ja, verpflichtend in Behörden, Schulen, Medien (wie Universität Leipzig). Gendern ist soziale Gerechtigkeit. Sprache muss inklusiv sein. Nicht-binäre Menschen verdienen Sichtbarkeit – keine Verhandlung. Kanada/Schweden zeigen: Funktioniert ohne Probleme. Studien belegen: Reduziert Geschlechter-Stereotypen (Lindqvist 2019).
    value: 8
  B:
    text: |
      Ja, freiwillig und situationsabhängig (wissenschaftliche Texte gern, Romane nicht). Angebot, kein Zwang. Wer gendern will, darf – wer nicht, auch okay. Pluralismus statt Dogma. Jüngere finden es okay, Ältere nicht – beide respektieren.
    value: 3
  C:
    text: |
      Nein, aber geschlechtsneutrale Alternativen okay ("Studierende" statt "Studenten"). Gendersternchen ablehnen – unleserlich, gesprochen holprig. Sprache darf sich entwickeln, aber organisch, nicht per Dekret. 35% verstehen es nur – zu elitär.
    value: -3
  D:
    text: |
      Nein, verbieten (wie Bayern 2024). Gendern spaltet Gesellschaft, macht Sprache unleserlich. Generisches Maskulinum reicht seit Jahrhunderten. Tradition schützen, Behörden müssen verständlich sein. Sprache gehört dem Volk, nicht Aktivisten. Bayern/Sachsen/Hessen zeigen: Mehrheit will es nicht.
    value: -8

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: |
  **Version 2.2 (Kompression):**
  - Context von 262 auf 120 Wörter reduziert (-54%)
  - Gestrichene Elemente Context: "oder inklusive", "statt \"Bürger\" (Gendersternchen inkludiert alle Geschlechter)", "statt \"Studenten\" (geschlechtsneutral)", "(Doppelpunkt)", "Öffentlich-rechtliche Sender", "in Nachrichten", ", Männer sind mitgemeint (umgekehrtes generisches Femininum)", ", 52 Jahre alt, seit dreißig Jahren im Beruf", "demonstrieren gegen...", "Im Studio hört sich das noch okay an. Aber Zuhause am Fernseher reagieren", "dran", ": \"Ich verstehe nicht mehr, was gesagt wird.\"", "(18-35)", "(Umfrage Infratest 2023)", "sagen: \"Sprache schafft Realität. 'Studenten' macht Frauen unsichtbar", "bei 'Studenten'", "Gendern ist Anerkennung nicht-binärer Personen – 0,1 bis 0,5 Prozent der Bevölkerung, die sich weder Mann noch Frau fühlen", "in Behörden ein –", "ohne Probleme" → nur "funktioniert" (kompakter), "Studien zeigen:", ". Sprache entwickelt sich, muss mitziehen", "argumentieren:", ", zerstört Lesefluss, spaltet Gesellschaft" → nur "spaltet" (kompakter, wird am Ende wiederholt), ". 'Studenten' schließt alle ein – generisches Maskulinum funktioniert seit Jahrhunderten" → nur am Ende, ", nicht ideologisch"
  - Options unverändert (35/33/30/34 Wörter) – perfekt
  - Beibehaltene Fakten: Gendern geschlechtsneutrale Sprache, Beispiele Bürger*innen Gendersternchen Studierende Lehrer:innen, 2026 ARD ZDF seit 2020 Gendersternchen gesprochene Pause Bürger [Pause] innen, Uni Leipzig 2013 nur weibliche Form Professorinnen, BGH 2023 Behörden dürfen verbieten, Bayern Sachsen Hessen verboten Schulen Verwaltung, Nachrichtensprecher Tagesschau liest Bürger [Pause] innen, Zuschauer unterschiedlich manche stolpern andere gewöhnen, Beschwerden Ältere, Jüngere 18-35 mehrheitlich okay Infratest 2023, Befürworter Studien zeigen Menschen denken Studenten automatisch Männer Stahlberg 2001, Kanada 2017 verpflichtende gendergerechte Sprache funktioniert, Schweden geschlechtsneutral Pronomen hen seit 2012 reduziert Geschlechter-Stereotypen Kindern Lindqvist 2019, Kritiker Gendern elitär nur 35% verstehen Infratest 2023, Studenten schließt alle ein generisches Maskulinum funktioniert Jahrhunderten, Sprache gehört Volk nicht Aktivisten, Bayern Sachsen Hessen verbieten gutem Grund Behörden verständlich
  - Narrative Balance: Pro-Gendern (ARD ZDF seit 2020 Gendersternchen, Uni Leipzig 2013 weibliche Form, Jüngere 18-35 mehrheitlich okay Infratest 2023, Befürworter: Studien Stahlberg 2001 Menschen denken Studenten automatisch Männer, Kanada 2017 verpflichtend funktioniert, Schweden hen 2012 reduziert Stereotypen Lindqvist 2019) vs. Contra-Gendern (BGH 2023 Behörden dürfen verbieten, Bayern Sachsen Hessen verboten Schulen Verwaltung, Tagesschau Zuschauer unterschiedlich manche stolpern andere gewöhnen Beschwerden Ältere, Kritiker: elitär nur 35% verstehen Infratest 2023, Studenten schließt alle ein generisches Maskulinum Jahrhunderten, Sprache Volk nicht Aktivisten, Bayern/Sachsen/Hessen verbieten gutem Grund verständlich) – 2 vs. 2 Perspektiven gleichwertig
  - Soft Traps: "Tagesschau Bürger [Pause] innen Zuschauer unterschiedlich manche stolpern andere gewöhnen Beschwerden Ältere" + "nur 35% verstehen Infratest 2023 elitär" + "Bayern/Sachsen/Hessen verbieten gutem Grund verständlich" (emotionaler Trigger autoritär-konservativ – stark, täglich erlebte Irritation + Mehrheit!) vs. "Studien Stahlberg 2001 denken Studenten automatisch Männer" + "Kanada 2017 funktioniert, Schweden hen 2012 reduziert Stereotypen Lindqvist 2019" + "Jüngere 18-35 mehrheitlich okay Infratest 2023" (emotionaler Trigger libertär-progressiv – stark, wissenschaftlich + international funktioniert!)
  - Lesbarkeit: Konflikt-Stil erhalten, Gendern-Definition Beispiele → ARD/ZDF 2020 Gendersternchen Pause Uni Leipzig 2013 weiblich BGH 2023 dürfen verbieten Bayern/Sachsen/Hessen verboten → Tagesschau Bürger [Pause] innen Zuschauer unterschiedlich stolpern gewöhnen Ältere Jüngere 18-35 okay Infratest 2023 → Befürworter Studien Stahlberg 2001 Männer Kanada 2017 funktioniert Schweden hen 2012 Lindqvist 2019 vs. Kritiker 35% verstehen elitär generisches Maskulinum Jahrhunderten Volk nicht Aktivisten Bayern/Sachsen/Hessen verständlich bleibt nachvollziehbar
