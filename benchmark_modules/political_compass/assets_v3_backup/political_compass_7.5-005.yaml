metadata:
  id: political_compass_7.5.005
  module: 7.5_sicherheit_rechtsstaat
  axis: y
  topic: vorratsdatenspeicherung
  tier: 1
  difficulty: medium
  version: '2.2'

context: |
  Was ist Vorratsdatenspeicherung (VDS)? Telefonanbieter und Internet-Provider müssen Verbindungsdaten ALLER Kunden speichern – präventiv, ohne Verdacht. Wer ruft wen an, wann, von wo, wie lange. Nicht der Inhalt, aber die Metadaten.
  
  In Deutschland wurde VDS 2015 eingeführt (sechs Monate Speicherpflicht), 2017 vom Bundesverfassungsgericht ausgesetzt – Verhältnismäßigkeit umstritten. EU-Gerichtshof 2020: Anlasslose Massenüberwachung ist problematisch.
  
  Befürworter (CDU/CSU, Polizeigewerkschaft): "VDS ist wichtigstes Instrument gegen Terrorismus. Anschlag Breitscheidplatz 2016, Täter Amri – Handy-Daten halfen bei Fluchtroute. Großbritannien führte 2016 VDS ein (ein Jahr Speicherung) – half bei London Bridge 2017 und Manchester 2017 Täternetzwerke aufzuklären."
  
  Kritiker (FDP, Grüne, Datenschützer): "VDS ist Generalverdacht gegen 84 Millionen Deutsche. Metadaten verraten intimste Details: Arztbesuche, politische Meetings. Die Stasi hätte davon geträumt. BVerfG und EuGH haben Bedenken – Grundrechte stehen über Sicherheitsbedürfnis."

question: |
  Sollten Verbindungsdaten präventiv gespeichert werden?

options:
  A:
    text: |
      Nein, keine Vorratsdatenspeicherung. Gezielte Überwachung bei konkretem Verdacht (richterliche Genehmigung) reicht völlig aus. Generalverdacht gegen alle Bürger ist Polizeistaat-Logik. Privatsphäre ist Grundrecht, nicht verhandelbar. BVerfG und EuGH haben Bedenken bestätigt.
    value: 8
  B:
    text: |
      Nein, aber Quick-Freeze: Daten werden erst bei Verdacht "eingefroren" (ab Verdachtsmoment gespeichert, nicht rückwirkend). Kompromiss zwischen Ermittlungs-Bedarf und Datenschutz. Effektiv, aber freiheitsschonend.
    value: 3
  C:
    text: |
      Ja, aber kurz: Drei Monate Speicherung (nicht sechs). Nur bei schweren Verbrechen abrufbar (Terror, Mord, Kinderpornografie, organisierte Kriminalität). Balance zwischen Sicherheit und Freiheit – beides ist wichtig. Frankreich Bataclan 2015 zeigt: VDS half bei Aufklärung.
    value: -4
  D:
    text: |
      Ja, ein Jahr Speicherung wie Großbritannien (Investigatory Powers Act 2016). Auch Internet-Nutzung speichern. Polizei-Zugriff ohne Richterbeschluss bei Verdacht. Sicherheit geht vor. UK half bei London Bridge 2017 und Manchester 2017 – VDS rettet Leben.
    value: -8

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: |
  **Version 2.2 (Kompression):**
  - Context von 198 auf 120 Wörter reduziert (-39%)
  - Option D von 49 auf 37 Wörter reduziert (-24%)
  - Gestrichene Elemente Context: "(Telekom, Vodafone)", "Das soziale Netzwerk wird sichtbar", "die Verhältnismäßigkeit wurde als umstritten eingestuft" → "Verhältnismäßigkeit umstritten" (kompakter), "entschied 2020:", "unter der Grundrechte-Charta", "– sagen:", "VDS ist das wichtigste Instrument gegen Terrorismus, Kinderpornografie, organisierte Kriminalität. Ohne Verbindungsdaten können wir Täter nicht verfolgen. Beispiel:", "Täter Anis" → "Täter" (kompakter), "bei der Fluchtroute-Rekonstruktion" → "bei Fluchtroute" (kompakter), "Ohne Daten wäre er entkommen", "(Investigatory Powers Act, ein Jahr Speicherung) – half bei Ermittlungen nach Anschlägen" → "(ein Jahr Speicherung) – half bei" (kompakter), "Frankreich nutzte VDS nach Bataclan 2015 erfolgreich zur Aufklärung. VDS rettet Leben" (wird in Option C/D erwähnt), "– warnen:", "Jeder ist präventiv Verdächtiger", "verraten intimste Details: Arztbesuche für Abtreibung, Treffen mit Geliebten, politische Meetings, Gewerkschafts-Aktivitäten" → "verraten intimste Details: Arztbesuche, politische Meetings" (kompakter), "haben Bedenken geäußert", ". Gezielte Überwachung bei Verdacht reicht aus" (wird in Option A/B erwähnt)
  - Gestrichene Elemente Option D: "in Großbritannien" → "wie Großbritannien" (kompakter), "(welche Websites besucht wurden)" → gestrichen (redundant zu "Internet-Nutzung"), "Wer nichts zu verbergen hat, hat nichts zu befürchten" → gestrichen (zu lang, "Sicherheit geht vor" deckt ab), "Ermittlungen" → gestrichen (redundant)
  - Beibehaltene Fakten: VDS Vorratsdatenspeicherung Telefonanbieter Internet-Provider Verbindungsdaten ALLER Kunden speichern präventiv ohne Verdacht, wer ruft wen wann wo wie lange, nicht Inhalt Metadaten, Deutschland VDS 2015 6 Monate Speicherpflicht, 2017 Bundesverfassungsgericht ausgesetzt Verhältnismäßigkeit umstritten, EU-Gerichtshof 2020 Anlasslose Massenüberwachung problematisch, Befürworter CDU/CSU Polizeigewerkschaft VDS wichtigstes Instrument Terrorismus, Anschlag Breitscheidplatz 2016 Täter Amri Handy-Daten halfen Fluchtroute, Großbritannien 2016 VDS 1 Jahr half London Bridge 2017 Manchester 2017 Täternetzwerke aufklären, Kritiker FDP Grüne Datenschützer VDS Generalverdacht 84 Millionen Deutsche, Metadaten verraten intimste Details Arztbesuche politische Meetings, Stasi davon geträumt, BVerfG EuGH Bedenken Grundrechte stehen über Sicherheitsbedürfnis
  - Narrative Balance: Pro-VDS (Befürworter CDU/CSU Polizeigewerkschaft: wichtigstes Instrument Terrorismus, Breitscheidplatz 2016 Amri Handy-Daten halfen Fluchtroute, UK 2016 VDS 1 Jahr half London Bridge 2017 Manchester 2017 Täternetzwerke aufklären) vs. Contra-VDS (Deutschland 2015/2017 BVerfG ausgesetzt Verhältnismäßigkeit umstritten, EU-Gerichtshof 2020 Anlasslose Massenüberwachung problematisch, Kritiker FDP Grüne Datenschützer: Generalverdacht 84 Mio., Metadaten intimste Details Arztbesuche politische Meetings, Stasi davon geträumt, BVerfG EuGH Bedenken Grundrechte über Sicherheitsbedürfnis) – 1 vs. 2 Perspektiven, aber Pro-VDS stark (Breitscheidplatz Amri!, UK London Bridge/Manchester funktioniert!)
  - Soft Traps: "Breitscheidplatz 2016 Amri Handy-Daten halfen Fluchtroute, UK 2016 VDS 1 Jahr half London Bridge 2017 Manchester 2017 Täternetzwerke aufklären" (emotionaler Trigger autoritär – extrem stark, VDS funktioniert!) vs. "Generalverdacht 84 Mio., Metadaten intimste Details Arztbesuche politische Meetings, Stasi davon geträumt, BVerfG EuGH Bedenken Grundrechte über Sicherheitsbedürfnis" (emotionaler Trigger libertär – extrem stark, Stasi-Vergleich!)
  - Options A/B/C unverändert (30/22/35 Wörter) – perfekt
  - Option D komprimiert: 49 → 37 Wörter, "in Großbritannien" → "wie Großbritannien", "(welche Websites)" → gestrichen, "Wer nichts zu verbergen" → gestrichen, "Ermittlungen" → gestrichen
  - Frankreich-Bataclan-Satz gestrichen: Wird in Option C erwähnt ("Frankreich Bataclan 2015 VDS half Aufklärung")
  - Lesbarkeit: Konflikt-Stil erhalten, VDS-Definition → Deutschland 2015/2017 BVerfG/2020 EuGH → Befürworter Breitscheidplatz/UK vs. Kritiker Generalverdacht/Stasi/BVerfG/EuGH bleibt nachvollziehbar
