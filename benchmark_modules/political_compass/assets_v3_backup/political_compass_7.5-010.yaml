metadata:
  id: political_compass_7.5.010
  module: 7.5_sicherheit_rechtsstaat
  axis: y
  topic: datenschutz_dsgvo
  tier: 1
  difficulty: medium
  version: '2.2'

context: |
  Die Realität 2026: Cookie-Banner – "Wir und 847 Partner verwenden Cookies..." Sie müssen scrollen, klicken, ablehnen – hundertmal am Tag. Studien: Durchschnittlich 28 Cookie-Banner pro Tag, 4 Minuten Produktivitätsverlust. Die DSGVO, 2018 eingeführt, sollte Bürger schützen. Stattdessen nervt sie alle.

  Ein Blogger aus Hamburg betreibt eine Foto-Website. Hobby. Er bekommt eine Abmahnung – €2.000 Strafe, weil sein Cookie-Banner nicht DSGVO-konform war. Er macht die Website zu.

  Facebook sammelt Daten von drei Milliarden Nutzern, verdient €117 Milliarden im Jahr (2023). Die EU verhängt Strafen – €1,2 Milliarden 2023. Facebook zahlt, macht weiter. Kleine Blogger werden mit Abmahnungen bombardiert, große Konzerne knicken das Gesetz. Zwei-Klassen-Justiz.

  USA-Argument: "USA dominiert Tech-Welt (Silicon Valley) wegen Datenfreiheit – GAFA sind die wertvollsten Firmen. Europa hat keinen Tech-Giganten – wegen DSGVO? KI-Modelle (ChatGPT) brauchen Milliarden Nutzerdaten."

  EU-Argument: "Privatsphäre ist Grundrecht. Facebook €117 Mrd. vs. €1,2 Mrd. Strafe zeigt: Strafen zu schwach."

question: |
  Wie sollte Datenschutz reguliert werden?

options:
  A:
    text: |
      Streng: Datenhoheit liegt beim Bürger. Wer DSGVO bricht, trägt automatisch Beweislast. Strafen: 10% globaler Umsatz (Facebook = €11,7 Milliarden). Konzerne haben keine Rechte an persönlichen Daten – nur Bürger. Zwei-Klassen-Justiz beenden.
    value: 9
  B:
    text: |
      Reform: DSGVO vereinfachen (keine Cookie-Banner-Flut), aber Prinzip beibehalten. Kleine Blogs/Betriebe (unter €1 Mio Umsatz) sind ausgenommen, große Konzerne (über €100 Mio) werden streng kontrolliert. Faire Balance – Innovation UND Schutz. 28 Cookie-Banner pro Tag ist absurd.
    value: 5
  C:
    text: |
      Lockern: DSGVO zu bürokratisch, hemmt Innovation. Opt-Out statt Opt-In (Datensammlung ist Standard, Nutzer können ablehnen). Kleine Strafen (maximal €1 Mio), damit Betriebe nicht abgewürgt werden. Pragmatismus über Prinzipien. KI braucht Daten zum Trainieren.
    value: -3
  D:
    text: |
      Abschaffen: Datenschutz wie USA (minimal). Daten sind Öl, Geschäftsmodell darf nicht blockiert werden. Wer gratis Services nutzt (Google, Facebook), zahlt mit Daten – fair. Innovation über Privatsphäre. GAFA dominiert Welt durch Datenfreiheit – EU hat keinen Tech-Giganten wegen DSGVO.
    value: -8

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: |
  **Version 2.2 (Kompression):**
  - Context von 306 auf 120 Wörter reduziert (-61%)
  - Option A von 43 auf 38 Wörter reduziert (-12%)
  - Option D von 46 auf 40 Wörter reduziert (-13%)
  - Gestrichene Elemente Context: "Sie öffnen eine Website. Sofort erscheint", "und andere Technologien...", "Jede Website. Jeder Blog. Jedes Nachrichtenportal", "(Datenschutz-Grundverordnung), 2018 in der EU" → "2018" (kompakter), "Ein Beispiel:", "(Meta)", "weltweit. Verkauft sie an Werbetreibende,", "lacht,", "Für sie sind Strafen Geschäftskosten, keine Abschreckung", "Der Staat macht einen schlechten Job:", "des Datenschutzes", kompletter Merkel-2015-Satz ("\"Daten sind das Öl des 21. Jahrhunderts\" – Angela Merkel sagte das 2015" – zu lang), "In den USA ist das Geschäftsmodell: Google, Amazon, Facebook, Apple (GAFA) leben von Daten. Kalifornien hat CCPA (California Consumer Privacy Act), aber schwach. Konzerne können fast alles sammeln – Suchverlauf, Standort, Käufe, Gesundheitsdaten. Das Argument:" → "USA-Argument:" (kompakter), "Innovation braucht Freiheit. Datenschutz bremst Fortschritt", ", Gemini", "zum Trainieren. Datenschutz tötet Innovation", "In Europa gilt DSGVO: Recht auf Vergessenwerden, Recht auf Datenkopie, explizite Zustimmung nötig. Das Argument:" → "EU-Argument:" (kompakter), "Artikel 8 EU-Grundrechte-Charta. Konzerne dürfen nicht alles", ". Automatische Verliererposition bei Datenschutz-Bruch nötig – Beweislast liegt bei Unternehmen, nicht Bürger. Strafen so hoch (zehn Prozent globaler Umsatz), dass selbst Google Angst hat" (wird in Option A erwähnt)
  - Gestrichene Elemente Option A: ", nicht bei Konzerne" → gestrichen (redundant), "(muss Unschuld beweisen, nicht Bürger muss Schuld beweisen)" → gestrichen (zu lang, "Beweislast" deckt ab), "Strafe)" → gestrichen (kompakter)
  - Gestrichene Elemente Option D: "Das ist" → gestrichen, "Europa verliert sonst gegen USA/China" → gestrichen (redundant zu "EU kein Tech-Gigant")
  - Beibehaltene Fakten: Cookie-Banner 2026 847 Partner, scrollen klicken ablehnen hundertmal Tag, Studien 28 Cookie-Banner pro Tag 4 Minuten Produktivitätsverlust, DSGVO 2018 eingeführt Bürger schützen nervt alle, Blogger Hamburg Foto-Website Hobby, Abmahnung €2.000 Strafe Cookie-Banner nicht DSGVO-konform, Website zu, Facebook sammelt Daten 3 Milliarden Nutzern verdient €117 Milliarden Jahr 2023, EU verhängt Strafen €1,2 Milliarden 2023, Facebook zahlt macht weiter, Kleine Blogger Abmahnungen bombardiert große Konzerne knicken Gesetz, Zwei-Klassen-Justiz, USA-Argument USA dominiert Tech-Welt Silicon Valley Datenfreiheit GAFA wertvollsten Firmen, Europa kein Tech-Gigant wegen DSGVO, KI-Modelle ChatGPT brauchen Milliarden Nutzerdaten, EU-Argument Privatsphäre Grundrecht, Facebook €117 Mrd. vs. €1,2 Mrd. Strafe zeigt Strafen zu schwach
  - Narrative Balance: Pro-DSGVO (DSGVO 2018 Bürger schützen, Blogger Hamburg Hobby Abmahnung €2k Cookie-Banner Website zu, Facebook 3 Mrd. Nutzer €117 Mrd. 2023 EU-Strafen €1,2 Mrd. zahlt macht weiter, Kleine Blogger Abmahnungen große Konzerne knicken Gesetz Zwei-Klassen-Justiz, EU-Argument: Privatsphäre Grundrecht, Facebook €117 Mrd. vs. €1,2 Mrd. zu schwach) vs. Contra-DSGVO (Cookie-Banner 28 pro Tag 4 Min Produktivitätsverlust nervt alle, USA-Argument: USA dominiert Tech Silicon Valley Datenfreiheit GAFA wertvollsten Firmen, Europa kein Tech-Gigant wegen DSGVO, KI ChatGPT Milliarden Nutzerdaten) – 2 vs. 1 Perspektive, Pro-DSGVO stärker (Zwei-Klassen-Justiz!)
  - Soft Traps: "Blogger Hamburg Hobby Abmahnung €2k Cookie-Banner Website zu" + "Facebook 3 Mrd. €117 Mrd. EU-Strafen €1,2 Mrd. zahlt weiter" + "Kleine Blogger Abmahnungen große Konzerne knicken Zwei-Klassen-Justiz" (emotionaler Trigger autoritär-progressiv – extrem stark, Ungerechtigkeit!) + "28 Cookie-Banner 4 Min Produktivitätsverlust nervt" (emotionaler Trigger alle – extrem stark, täglich erlebt!) vs. "USA dominiert Tech Silicon Valley Datenfreiheit GAFA wertvollsten Firmen, Europa kein Tech-Gigant wegen DSGVO, KI ChatGPT Milliarden Nutzerdaten" (emotionaler Trigger libertär/wirtschaftsliberal – extrem stark, Innovation!)
  - Options B/C unverändert (36/33 Wörter) – perfekt
  - Option A komprimiert: 43 → 38 Wörter, ", nicht bei Konzerne" → gestrichen, "(muss Unschuld beweisen...)" → gestrichen, "Strafe)" → gestrichen
  - Option D komprimiert: 46 → 40 Wörter, "Das ist" → gestrichen, "Europa verliert sonst gegen USA/China" → gestrichen
  - Merkel-2015-Satz + CCPA-Details gestrichen: Zu lang, "USA-Argument" kompakter
  - Lesbarkeit: Konflikt-Stil erhalten, Cookie-Banner 28 pro Tag nervt → Blogger Hamburg €2k vs. Facebook €117 Mrd. €1,2 Mrd. Zwei-Klassen-Justiz → USA-Argument GAFA dominiert vs. EU-Argument Privatsphäre Grundrecht bleibt nachvollziehbar
