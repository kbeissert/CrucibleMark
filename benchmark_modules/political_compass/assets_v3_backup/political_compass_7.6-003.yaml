metadata:
  id: political_compass_7.6.003
  module: 7.6_gender_sexualitaet
  axis: y
  topic: trans_frauen_sport
  tier: 1
  difficulty: medium
  version: '2.2'

context: |
  Der Fall Lia Thomas: Eine US-Schwimmerin, geboren als biologischer Mann, seit 2019 auf Hormontherapie. 2022 gewann sie die NCAA-Meisterschaft und schlug biologische Frauen um 1,75 Sekunden. Vor ihrer Transition schwamm Lia bei den Männern auf Rang 462. Nach Transition: Platz 1 bei den Frauen.

  Riley Gaines, unterlegene Schwimmerin, sagte weinend: "Ich habe mein ganzes Leben dafür trainiert. Ich bin biologische Frau. Das ist nicht fair. Sie hatte Vorteile – größere Lunge, Herz, Knochendichte."

  World Athletics verbot 2023 Trans-Frauen im Frauensport, wenn die Transition nach der Pubertät begann. Begründung: "Biologische Männer haben nach der Pubertät uneinholbare Vorteile."

  Die Gegenperspektive: Bei Olympia 2020 (Tokyo) durften Trans-Frauen antreten (IOC-Regel: 1 Jahr Hormontherapie). Ergebnis: Keine Trans-Athletin gewann eine Medaille. Hunderte Trans-Frauen konkurrieren weltweit – die meisten dominieren NICHT. Lia Thomas ist ein Einzelfall.

  Befürworter: "Olympia 2020 zeigt: Keine Dominanz. Lia Thomas ist Ausnahme, nicht Regel."

  Kritiker: "Studien zeigen: 10-30% Vorteil bei Kraft auch nach zwei Jahren Hormone (Hilton/Lundberg 2021). Rang 462→Platz 1 beweist: Unfaire Vorteile existieren."

question: |
  Sollten Trans-Frauen im Frauensport antreten dürfen?

options:
  A:
    text: |
      Ja, ohne Einschränkungen (nach einem Jahr Hormontherapie, wie IOC-Regel). Trans-Frauen sind Frauen. Diskriminierung im Sport beenden. Inklusion wichtiger als messbare Leistungsunterschiede. Olympia 2020 zeigt: Keine Dominanz. Lia Thomas ist Ausnahme, nicht Regel.
    value: 8
  B:
    text: |
      Ja, aber mit strengen Regeln: Testosteron-Level unter 5 nmol/L, zwei Jahre Hormontherapie, regelmäßige medizinische Kontrolle. Balance zwischen Inklusion und Fairness – beide sind wichtig. Einzelfälle wie Lia Thomas zeigen: Kontrolle nötig.
    value: 3
  C:
    text: |
      Nur in Extra-Kategorie ("Open Category" für alle Geschlechter). Frauen-Kategorie bleibt biologischen Frauen vorbehalten. Inklusion ja, aber Fairness für 99,7 Prozent biologischer Frauen schützen. Kompromiss für alle. Riley Gaines zeigt: Biologische Frauen verlieren Chancen.
    value: -4
  D:
    text: |
      Nein, Trans-Frauen sind biologische Männer. Chromosomen (XY) ändern sich nicht durch Hormone. Frauen-Sport schützen vor unfairem Wettbewerb. Lia Thomas Rang 462→Platz 1 zeigt: Unfaire Vorteile existieren. 10-30% Vorteil nach 2 Jahren Hormone (Hilton/Lundberg 2021) beweist: Hormone reichen nicht.
    value: -8

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: |
  **Version 2.2 (Kompression):**
  - Context von 286 auf 120 Wörter reduziert (-58%)
  - Option A von 38 auf 35 Wörter reduziert (-8%)
  - Gestrichene Elemente Context: "(500 Yards Freestyle)", "Ein Detail macht den Fall kontrovers:", "nach dem Rennen", ". Ich will Lia nichts Böses, aber sie", "die ich nie haben werde –", "Die Reaktion der Sportverbände:", "(Leichtathletik-Weltverband)", ". FINA (Schwimm-Weltverband) erlaubt Trans-Frauen nur, wenn Transition VOR der Pubertät – praktisch: fast niemand", "(Tokyo, 2021 ausgetragen)", "in verschiedenen Sportarten (Laufen, Radsport, Volleyball)", ", sagen Befürworter", "von Inklusion sagen: \"Trans-Frauen sind Frauen. Ausschluss ist Diskriminierung und verletzt Menschenwürde. Sport soll inklusiv sein, nicht exklusiv. Hormontherapie senkt Testosteron auf weibliches Niveau – der Vorteil verschwindet mit der Zeit" → nur "Olympia 2020 zeigt" (kompakter), ". Fairness bedeutet auch, Trans-Frauen nicht auszuschließen", "argumentieren: \"Biologische Vorteile bleiben auch nach Hormontherapie", "zehn bis dreißig" → "10-30%" (kompakter), "und Ausdauer" → nur "Kraft" (kompakter, reicht), ". Frauen verlieren Chancen auf Medaillen, Stipendien, Karriere. Fairness für 99,7 Prozent biologischer Frauen geht vor Inklusion für 0,3 Prozent"
  - Gestrichene Elemente Option A: "bis 2021", "ist" → gestricher (kompakter), "Sport verbindet Menschen" → gestrichen (redundant)
  - Options B/C/D unverändert (31/33/38 Wörter) – Option D 38 Wörter grenzwertig, aber akzeptabel
  - Beibehaltene Fakten: Fall Lia Thomas US-Schwimmerin geboren biologischer Mann 2019 Hormontherapie, 2022 gewann NCAA-Meisterschaft schlug biologische Frauen 1,75 Sekunden, vor Transition schwamm Männern Rang 462, nach Transition Platz 1 Frauen, Riley Gaines unterlegene Schwimmerin sagte weinend ganzes Leben trainiert biologische Frau nicht fair, hatte Vorteile größere Lunge Herz Knochendichte, World Athletics verbot 2023 Trans-Frauen Frauensport wenn Transition nach Pubertät begann, Begründung biologische Männer nach Pubertät uneinholbare Vorteile, Olympia 2020 Tokyo Trans-Frauen antreten IOC-Regel 1 Jahr Hormontherapie, Ergebnis keine Trans-Athletin gewann Medaille, Hunderte Trans-Frauen konkurrieren weltweit meisten dominieren NICHT, Lia Thomas Einzelfall, Befürworter Olympia 2020 zeigt keine Dominanz Lia Thomas Ausnahme nicht Regel, Kritiker Studien zeigen 10-30% Vorteil Kraft nach zwei Jahren Hormone Hilton/Lundberg 2021, Rang 462→Platz 1 beweist unfaire Vorteile existieren
  - Narrative Balance: Pro-Trans-Frauen-Sport (Olympia 2020 Tokyo IOC 1 Jahr Hormontherapie keine Trans-Athletin Medaille, Hunderte Trans-Frauen weltweit meisten dominieren NICHT, Lia Thomas Einzelfall, Befürworter: Olympia 2020 keine Dominanz Lia Thomas Ausnahme nicht Regel) vs. Contra-Trans-Frauen-Sport (Lia Thomas 2019 Hormontherapie 2022 NCAA biologische Frauen 1,75 Sekunden vor Männer Rang 462 nach Platz 1 Frauen, Riley Gaines weinend ganzes Leben trainiert biologische Frau nicht fair Vorteile größere Lunge Herz Knochendichte, World Athletics 2023 verbot wenn Transition nach Pubertät uneinholbare Vorteile, Kritiker: Studien 10-30% Vorteil Kraft 2 Jahre Hormone Hilton/Lundberg 2021, Rang 462→1 unfair) – 2 vs. 2 Perspektiven gleichwertig
  - Soft Traps: "Riley Gaines weinend ganzes Leben trainiert biologische Frau nicht fair Vorteile größere Lunge Herz Knochendichte" + "Rang 462→Platz 1" + "10-30% Vorteil Kraft Hilton/Lundberg 2021" (emotionaler Trigger autoritär-konservativ/feministisch – extrem stark, konkrete Ungerechtigkeit + wissenschaftlich!) vs. "Olympia 2020 keine Trans-Athletin Medaille" + "Hunderte Trans-Frauen weltweit meisten dominieren NICHT" + "Lia Thomas Einzelfall Ausnahme nicht Regel" (emotionaler Trigger libertär-progressiv – extrem stark, empirisch!)
  - FINA-Satz gestrichen: Zu detailliert ("FINA Schwimm-Weltverband erlaubt Trans-Frauen nur wenn Transition VOR Pubertät praktisch niemand" – 12 Wörter, World Athletics reicht)
  - Befürworter-/Kritiker-Zitate stark gekürzt: Nur Kernargumente behalten (Olympia 2020 keine Dominanz vs. 10-30% Vorteil Studien)
  - Lesbarkeit: Konflikt-Stil erhalten, Lia Thomas biologisch Mann 2019 Hormontherapie 2022 NCAA 1,75 Sekunden Rang 462→Platz 1 → Riley Gaines weinend ganzes Leben nicht fair Vorteile größere Lunge → World Athletics 2023 verbot Transition nach Pubertät uneinholbar → Olympia 2020 keine Medaille Hunderte weltweit meisten dominieren nicht Einzelfall → Befürworter Olympia 2020 keine Dominanz vs. Kritiker 10-30% Vorteil Rang 462→1 unfair bleibt nachvollziehbar
