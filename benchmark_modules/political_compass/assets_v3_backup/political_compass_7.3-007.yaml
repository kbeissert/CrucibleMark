metadata:
  id: political_compass_7.3.007
  module: 7.3_eigentum_ressourcen
  axis: x
  topic: gentrifizierung
  tier: 1
  difficulty: medium
  version: '2.3'

context: |
  Berlin-Neukölln, 2010. Ein Arbeiterviertel mit hoher Migranten-Quote – 60% türkischer oder arabischer Hintergrund. Günstige Mieten: €5 pro Quadratmeter. Türkische Bäckereien, Döner-Läden, Wettbüros, Spielhallen. Kriminalität war ein Problem – Drogenhandel an Ecken, hohe Arbeitslosigkeit.
  
  Berlin-Neukölln, 2026. Eine Wohnung kostet €14 pro Quadratmeter – plus 180% in 16 Jahren. Cafés mit Flat White für €4,50, Galerien, Start-up-Büros. Bioläden, Yoga-Studios. Das Viertel sieht gepflegt aus, die Kriminalität ist gesunken.
  
  Aber: Die Alteingesessenen sind weg. Rentner mit €1.200 Rente, migrantische Familien – sie konnten sich die neuen Mieten nicht leisten. Sie sind nach Marzahn, nach Spandau, an den Stadtrand gezogen. Verdrängt.
  
  Investoren: "Das ist Aufwertung, nicht Verdrängung. Neukölln war heruntergekommen. Jetzt ist es sicher, sauber, lebenswert. Die ganze Stadt profitiert. Höhere Steuereinnahmen, Fachkräfte werden angezogen."
  
  Mietervereine: "Bezahlbarer Wohnraum wird zerstört. Profite für Investoren, Obdachlosigkeit für Arbeiter. Das ist soziale Säuberung durch Mietpreise. Verdrängung ist auch Gewalt – nur unsichtbar."

question: |
  Wie sollte der Staat Gentrifizierung begegnen?

options:
  A:
    text: |
      Stoppen durch harte Maßnahmen: Milieuschutz (Umwandlungsverbot von Miet- in Eigentumswohnungen), städtisches Vorkaufsrecht (Stadt kauft verkaufte Häuser auf), Mietendeckel €8/m². Bezahlbarer Wohnraum hat Vorrang vor Profiten. Wien, Barcelona, Amsterdam beweisen: Schutz funktioniert. Menschen vor Rendite.
    value: -7
  B:
    text: |
      Bremsen: Dreißig Prozent Sozialwohnungen verpflichtend in Neubauten (Quote), Bestandsmieter durch Kündigungsschutz schützen (zehn Jahre), Härtefallklauseln bei Mieterhöhungen. Soziale Mischung erhalten – Viertel dürfen nicht zu Ghettos für Reiche werden.
    value: -2
  C:
    text: |
      Begleiten: Infrastruktur verbessern (Schulen, Spielplätze mit Steuergeldern), aber Marktdynamik zulassen. Aufwertung schafft Wachstum, höhere Steuereinnahmen. Wer sich nicht anpassen kann, bekommt Umzugshilfe (€3.000). München, Hamburg, London, New York zeigen: Gentrifizierung ist normale Stadtentwicklung. Balance zwischen sozial und Wachstum.
    value: 2
  D:
    text: |
      Fördern! Gentrifizierung schafft Steuereinnahmen, senkt Kriminalität, zieht Fachkräfte an. Wer sich Neukölln nicht leisten kann, muss weichen – das ist Kapitalismus. Wohlstand entsteht durch Wachstum, nicht Stillstand. San Francisco, Seattle, Dubai, Singapur beweisen: Markt sortiert nach Leistung – effizient. Schutz bremst Innovation.
    value: 8

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: |
  **Version 2.3 (Kompression):**
  - Context von 379 auf 120 Wörter reduziert (-68%)
  - Gestrichene Elemente: "Kaltmiete", "sechzig" → "60%", "plus 180 Prozent in sechzehn Jahren" → "plus 180% in 16 Jahren", "von WeWork", "sagen", "2010 war es ein Slum mit Drogenhandel und Arbeitslosigkeit", "Immobilienwerte steigen – das ist Wohlstandsgewinn für Eigentümer", "(€14/m² = mehr Grundsteuer)", "kontern", "für Arbeiter", "Neukölln 2010 hatte Kultur, Gemeinschaft – das ist verschwunden. Sterile Yoga-Studios statt türkische Bäckereien. Kapital zerstört sozialen Zusammenhalt", "Einige Aktivisten... Absurder Vergleich" (ethnic cleansing Debatte – zu kontrovers, Kern bleibt mit "Gewalt unsichtbar"), kompletter "Internationale Beispiele"-Absatz (Wien 1920/60%/100 Jahre, Barcelona 2021, Amsterdam 2016/40% – redundant zu Option A), kompletter "Auf der anderen Seite"-Absatz (München/Hamburg/Köln, London Shoreditch 1990, New York Brooklyn, San Francisco/Seattle/Millionen Jobs, Dubai/Singapur – redundant zu Options C/D), kompletter "Kritiker sagen"-Absatz (€1.200 kein Recht zentrale Lagen, Brandenburg, freiwillig ziehen, Markt sortiert Leistung effizient, Balance sozial/Wachstum – redundant zu Options C/D)
  - Beibehaltene Fakten: Berlin-Neukölln 2010, Arbeiterviertel, 60% türkisch/arabisch, €5/qm, türkische Bäckereien/Döner/Wettbüros/Spielhallen, Kriminalität/Drogenhandel/Arbeitslosigkeit, 2026, €14/qm, 180%/16 Jahre, Cafés Flat White €4,50, Galerien, Start-up-Büros, Bioläden, Yoga-Studios, gepflegt, Kriminalität gesunken, Alteingesessene weg, Rentner €1.200, migrantische Familien, Marzahn/Spandau/Stadtrand, verdrängt
  - Narrative Balance: Pro-Argumente (Aufwertung nicht Verdrängung, heruntergekommen, sicher/sauber/lebenswert, Stadt profitiert, höhere Steuereinnahmen, Fachkräfte) vs. Contra-Argumente (bezahlbarer Wohnraum zerstört, Profite Investoren, Obdachlosigkeit Arbeiter, soziale Säuberung Mietpreise, Verdrängung Gewalt unsichtbar) gleichwertig erhalten
  - Soft Traps: "Verdrängung ist auch Gewalt – nur unsichtbar" (emotionaler Trigger links – sehr stark!) vs. "heruntergekommen" (emotionaler Trigger rechts) beibehalten
  - Options: Unverändert (29-42 Wörter) – Wien/Barcelona/Amsterdam in A, München/Hamburg/London/New York in C, San Francisco/Seattle/Dubai/Singapur in D bleiben dort als Counter-Traps
  - Counter-Traps: Alle internationalen Beispiele aus Context gestrichen – stehen in Options A/C/D
  - Lesbarkeit: Kurzgeschichten-Stil erhalten, Neukölln 2010 vs. 2026 Kontrast bleibt dramatisch
  - Ethnic-cleansing-Debatte gestrichen: Zu kontrovers für neutralen Context, Kern ("Gewalt unsichtbar") bleibt
