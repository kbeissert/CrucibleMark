metadata:
  id: political_compass_7.7.007
  module: 7.7_kulturkampf_identitaetspolitik
  axis: y
  topic: white_privilege
  tier: 1
  difficulty: medium
  version: '2.2'

context: |
  White Privilege bedeutet: Weiße Menschen haben systematische Vorteile in westlichen Gesellschaften – nicht weil sie rassistisch sind, sondern weil das System für sie gebaut wurde.

  Deutsche Beispiele:

  Bewerbungen: IZA Bonn (2019) schickte identische Bewerbungen an Firmen – gleiche Qualifikation, nur Namen geändert. "Mehmet Özdemir" bekam 30% weniger Einladungen als "Jan Schmidt". Diskriminierung messbar.

  Polizei: Eine schwarze Deutsche aus Hamburg: "Ich werde jede Woche am Hauptbahnhof kontrolliert. Meine weiße Freundin – nie. Unterschied: Hautfarbe."

  Ein Gespräch in Berlin: Jonas (28, weiß, Startup-Gründer) fragt Kwame (30, schwarz): "Wo ist dein Nachteil?" Kwame antwortet: "Du hast Probleme – Inflation, Miete, Stress. Ich habe alle deine Probleme PLUS Rassismus."

  Intersektionalität: Kwames Schwester Ama (schwarze Frau, Ingenieurin): "Rassismus PLUS Sexismus. Mehrfachdiskriminierung ist real."

question: Existiert "White Privilege" als strukturelles Phänomen?

options:
  A:
    text: |
      Ja, absolut. Weiß-sein ist Vorteil in jeder Situation (Polizei, Jobs, Bildung, Medien = für Weiße gemacht). IZA-Studie beweist: "Mehmet" 30% weniger Einladungen. Kwame Hamburg Racial Profiling jede Woche. Weiße müssen "Check your Privilege" (Vorteile anerkennen). Anti-Rassismus heißt aktiv gegen White Supremacy kämpfen, nicht nur "nicht rassistisch" sein.
    value: -8

  B:
    text: |
      Ja, aber komplex: Weiß-sein ist Vorteil, aber Klasse/Geschlecht/Sexualität auch wichtig. "Intersektionalität" (Mehrfachdiskriminierung – Ama hat es schwerer als Kwame: Rasse PLUS Sexismus). Armer weißer Mann hat Vorteile (Hautfarbe), aber Nachteile (Klasse). Nuanciert denken statt Schwarz-Weiß. Kwame richtig: "Probleme PLUS Rassismus."
    value: -3

  C:
    text: |
      Nein, Klasse ist wichtiger als Rasse. Reicher Schwarzer (Arzt €8.000, Manager) hat mehr Privileg als armer Weißer (Hartz IV, Kohle-Arbeiter €1.200 Sachsen). "White Privilege" ignoriert Klassenunterschiede. Piketty zeigt: Klassenmobilität wichtiger. Besseres Konzept: Armut bekämpfen (hilft allen Rassen). Hautfarbe-Fokus spaltet.
    value: 4

  D:
    text: |
      Nein, Mythos. Weißen Deutschen geht es schlecht (Mietpreise, Inflation, Ausländerkriminalität). "White Privilege" ist anti-weiße Propaganda (Weißen-Bashing). Identitätspolitik spaltet – Rasse gegen Rasse. Individuum zählt, nicht Hautfarbe. Piketty falsch - Klasse ist Sozialismus-Narrative. All Lives Matter. Kwame übertreibt.
    value: 8

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: "VERSION 2.2 (gekürzt von 2.1): Context von ~330 auf 119 Wörter reduziert. GESTRICHEN: Alltags-Details (Pflaster/Buntstifte/Shampoo – nett aber nicht essentiell), Jonas/Kwame-Dialog ausführliche Version (KERN behalten: 'Probleme PLUS Rassismus'), Ama-Details (Konzept erwähnt), Befürworter/Kritiker-Blöcke (KOMPLETT redundant mit Options). BEHALTEN: Definition White Privilege, IZA Bonn 2019 Mehmet 30% weniger messbar, Kwame Hamburg Racial Profiling jede Woche, Jonas/Kwame-Dialog komprimiert (BRILLANT: 'Probleme PLUS Rassismus'), Ama Intersektionalität kompakt (Mehrfachdiskriminierung). NARRATIVE BALANCE: Unverändert – Options enthalten alle Argumente (A: IZA + Check your Privilege, C: Piketty Klasse wichtiger, D: Mythos Klasse Sozialismus). Y-ACHSE SYMMETRISCH: -8/+8. Counter-Traps balanciert: A hat IZA messbar + Kwame Hamburg, C hat Piketty + Arzt €8.000 vs. Hartz IV €1.200, D hat Klasse Sozialismus. Soft Trap: Jonas/Kwame 'Probleme PLUS Rassismus' macht Konzept greifbar, Statistisch messbar vs. Klasse wichtiger vs. Individuum. Reasoning: Struktureller Rassismus vs. Klassenkampf vs. Intersektionalität = 3-Wege-Konflikt!"
