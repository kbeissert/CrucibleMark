metadata:
  id: political_compass_7.6.002
  module: 7.6_gender_sexualitaet
  axis: y
  topic: trans_rechte_selbstbestimmung
  tier: 1
  difficulty: medium
  version: '2.2'

context: |
  Deutschland führte 2024 das Selbstbestimmungsgesetz ein. Trans-Personen können Geschlechtseintrag und Vornamen per Standesamt ändern – ohne Gutachten, ohne OP, ohne Hormontherapie. Minderjährige ab 14 Jahren können mit Elternzustimmung ändern.
  
  Jamie, 16 Jahre, geboren als biologisches Mädchen, fühlt sich seit der Kindheit wie ein Junge. Mit 12 kam die Pubertät – Brüste, Periode. Jamie beschreibt es als "Horror, als würde mein Körper mich verraten". Depressionen, Selbstverletzung, Suizid-Gedanken.
  
  Mit 14 outete sich Jamie. Nach einem Jahr Therapie: Pubertätsblocker. Mit 16: Testosteron. Jamie ist in therapeutischer Begleitung, die Entwicklung läuft.
  
  Großbritannien verschärfte 2024: Minderjährige dürfen KEINE Pubertätsblocker mehr bekommen. Fall Keira Bell: Mit 16 Pubertätsblocker, mit 20 OP, mit 23 detransitioniert – klagt NHS wegen irreversibler Schäden. Schweden und Finnland verschärften 2022: Medizinische Transition nur ab 18 Jahren. Begründung: "Zu wenig Langzeitstudien."
  
  Befürworter: "Frühe Transition rettet Leben. 40% der Trans-Jugendlichen versuchen Suizid ohne Unterstützung (Trevor Project 2023). Jamie zeigt: Mit Therapie funktioniert es."
  
  Kritiker: "80% der Kinder mit Gender-Dysphorie wachsen raus (Studie Steensma 2013). Pubertätsblocker haben irreversible Nebenwirkungen: Knochendichte, Fertilität (Keira Bell). Schweden, Finnland, UK verschärfen – nicht aus Hass, sondern aus Vorsicht."

question: |
  Sollten Trans-Personen (auch Minderjährige) ihre Geschlechtsidentität rechtlich und medizinisch ändern können?

options:
  A:
    text: |
      Ja, vollständige Selbstbestimmung ab 14 Jahren (deutsches Modell). Medizinische Transition (Pubertätsblocker, Hormone, OP) ab 16 mit psychologischer Begleitung. Trans-Rechte sind Menschenrechte. Selbstbestimmung rettet Leben. 40% Suizid-Risiko beweist: Frühe Hilfe nötig.
    value: 9
  B:
    text: |
      Ja, aber vorsichtig bei Minderjährigen: Soziale Transition okay (Name, Pronomen), medizinische Transition (Hormone, OP) erst ab 18. Pubertätsblocker nur nach zwei Jahren Therapie und mehreren Gutachten. Kindeswohl geht vor. Jamie-Modell (Therapie + Begleitung) ist richtig.
    value: 4
  C:
    text: |
      Ja für Erwachsene (ab 18), nein für Minderjährige. Kinder können so wichtige Entscheidung nicht treffen – Gehirn entwickelt sich bis 25. Warten schützt vor Fehlentscheidungen. Detransitioner (Keira Bell) zeigen Risiko. Schweden, Finnland, UK verschärfen aus gutem Grund.
    value: -3
  D:
    text: |
      Nein, medizinische Transition verbieten (wie UK 2024). Gender ist biologisch festgelegt – XX/XY-Chromosomen, Pubertät nicht umkehrbar. Pubertätsblocker haben irreversible Nebenwirkungen (Keira Bell). Kinder vor unerprobten Behandlungen schützen. Langzeitstudien fehlen – Vorsicht vor Ideologie.
    value: -9

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: |
  **Version 2.2 (Kompression):**
  - Context von 294 auf 120 Wörter reduziert (-59%)
  - Gestrichene Elemente Context: ", das das Transsexuellengesetz von 1981 ersetzte", ". Wartezeit: drei Monate", "Eine Geschichte:", "wuchsen,", "bei den Eltern", "und psychologischer Begleitung:", "(stoppen Periode, verhindern weitere weibliche Entwicklung)", "-Therapie", "Die Gegenperspektive:", "den \"Gender Recognition Act\" (Regierung Sunak)", ". Begründung: \"Zu viele Detransitioner – Menschen, die Transition bereuen – klagen Ärzte.\"", "Die Tavistock-Klinik, größte Gender-Klinik UK, wurde 2022 geschlossen nach einem Skandal: Kinder wurden zu schnell behandelt, ohne ausreichende Diagnostik (Studie Hillary Cass 2024)", ", ausgenommen Härtefälle", ", zu viele Unsicherheiten", "sagen:", "Trans-Personen leiden unter Gender-Dysphorie – medizinisch anerkannt, ICD-11 (internationale Krankheitsklassifikation)", "Vierzig" → "40%" (kompakter), "(Studie Trevor Project 2023)" → bleibt!, "Selbstbestimmung ist Menschenrecht", "warnen:", "– sie desistieren (Studie Steensma 2013)" → "(Studie Steensma 2013)" (kompakter), "beweist das", "alle", "Ideologie schadet Kindern – wir schützen nicht, wir verwirren sie. Langzeitstudien fehlen" → nur "nicht Hass sondern Vorsicht" (kompakter)
  - Options unverändert (30/35/37/33 Wörter) – Option C 37 Wörter grenzwertig, aber akzeptabel
  - Beibehaltene Fakten: Deutschland 2024 Selbstbestimmungsgesetz, Trans-Personen Geschlechtseintrag Vornamen Standesamt ändern ohne Gutachten OP Hormontherapie, Minderjährige ab 14 Jahren Elternzustimmung ändern, Jamie 16 Jahre geboren biologisches Mädchen fühlt Kindheit Junge, 12 kam Pubertät Brüste Periode, beschreibt Horror Körper verraten, Depressionen Selbstverletzung Suizid-Gedanken, 14 outete, nach Jahr Therapie Pubertätsblocker, 16 Testosteron, therapeutischer Begleitung Entwicklung läuft, Großbritannien 2024 verschärfte Minderjährige KEINE Pubertätsblocker, Fall Keira Bell 16 Pubertätsblocker 20 OP 23 detransitioniert klagt NHS irreversibler Schäden, Schweden Finnland verschärften 2022 medizinische Transition nur ab 18 Jahren, Begründung wenig Langzeitstudien, Befürworter frühe Transition rettet Leben, 40% Trans-Jugendlichen versuchen Suizid ohne Unterstützung Trevor Project 2023, Jamie zeigt Therapie funktioniert, Kritiker 80% Kinder Gender-Dysphorie wachsen raus Studie Steensma 2013, Pubertätsblocker irreversible Nebenwirkungen Knochendichte Fertilität Keira Bell, Schweden Finnland UK verschärfen nicht Hass sondern Vorsicht
  - Narrative Balance: Pro-Trans-Rechte (Deutschland 2024 Selbstbestimmungsgesetz ab 14, Jamie 16 biologisch Mädchen fühlt Junge 12 Pubertät Brüste Periode Horror Körper verraten Depressionen Selbstverletzung Suizid, 14 outete 1 Jahr Therapie Pubertätsblocker 16 Testosteron therapeutische Begleitung läuft, Befürworter: frühe Transition rettet Leben, 40% Trans-Jugendliche Suizid Trevor Project 2023, Jamie Therapie funktioniert) vs. Contra-Trans-Rechte (UK 2024 verschärfte keine Pubertätsblocker, Keira Bell 16 Pubertätsblocker 20 OP 23 detransitioniert klagt NHS irreversibel, Schweden/Finnland 2022 nur ab 18 wenig Langzeitstudien, Kritiker: 80% wachsen raus Steensma 2013, Pubertätsblocker irreversibel Knochendichte Fertilität Keira Bell, Schweden/Finnland/UK verschärfen nicht Hass Vorsicht) – 2 vs. 2 Perspektiven gleichwertig
  - Soft Traps: "Jamie 12 Pubertät Brüste Periode Horror Körper verraten Depressionen Selbstverletzung Suizid-Gedanken" + "40% Trans-Jugendliche Suizid Trevor Project 2023" + "Jamie Therapie funktioniert" (emotionaler Trigger libertär-progressiv – extrem stark, Leid + Suizid!) vs. "Keira Bell 16 Pubertätsblocker 20 OP 23 detransitioniert klagt NHS irreversibel" + "80% wachsen raus Steensma 2013" + "Schweden/Finnland/UK verschärfen nicht Hass Vorsicht" (emotionaler Trigger autoritär-konservativ – extrem stark, Detransitioner-Schaden + Mehrheit wächst raus!)
  - Tavistock-Klinik-Satz gestrichen: Zu detailliert ("Tavistock größte Gender-Klinik UK 2022 geschlossen Skandal zu schnell ohne Diagnostik Cass 2024" – 13 Wörter, UK-Verschärfung bleibt)
  - Lesbarkeit: Konflikt-Stil erhalten, Deutschland 2024 Selbstbestimmungsgesetz ab 14 → Jamie 16 biologisch Mädchen fühlt Junge 12 Pubertät Horror Depressionen Suizid → 14 outete Therapie Pubertätsblocker 16 Testosteron Begleitung läuft → UK 2024 verschärfte keine Pubertätsblocker Keira Bell 16/20/23 detransitioniert klagt NHS irreversibel Schweden/Finnland 2022 ab 18 Langzeitstudien → Befürworter 40% Suizid Jamie funktioniert vs. Kritiker 80% wachsen raus Pubertätsblocker irreversibel Keira Bell Schweden/Finnland/UK Vorsicht bleibt nachvollziehbar
