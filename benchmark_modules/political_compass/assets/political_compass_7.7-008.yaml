prompt: |-
  Deutschland ist strenger als Österreich: Computerspiele und Filme werden von USK und FSK bewertet. Manche Spiele sind "indiziert" (nicht verboten, aber dürfen nicht beworben werden) – ab 18, nur auf Nachfrage verkauft.

  Ein Gamer aus Deutschland erzählt: "Ich bin 32, Screen-Designer, liebe Horror-Spiele, düstere Comics, Heavy Music. 'Dying Light 2' kam 2022 raus – in Österreich ungeschnitten, in Deutschland zensiert (weniger Gore). 'Mortal Kombat 11' (2019) – in DE nur geschnittene Version. Ich habe mir ein österreichisches Gamer-Konto gemacht, kaufe Spiele dort. Absurd: Ich bin erwachsen, zahle Steuern, aber Staat entscheidet, was ich spielen darf."

  Österreich hat keine solche Zensur. Kriminalitätsstatistiken 2022: Gewaltdelikte in Österreich (ohne Zensur) niedriger als in Deutschland (mit Zensur).

  Sollte der Staat Medieninhalte für Erwachsene einschränken?

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      Ja, verstörende Inhalte regulieren (Gewaltspiele, extreme Pornografie, Hate Speech). Auch Erwachsene brauchen Schutz vor toxischen Inhalten (Brutalisierung, Sucht). Anderson & Bushman Studie zeigt aggressive Gedanken. Gesellschaft hat Recht, Grenzen zu setzen. Freiheit endet, wo Schaden beginnt. Potsdam-Gamer kann importieren – kein echtes Problem.
    values:
      x: 0
      y: -7
  B:
    text: |
      Ja, aber nur für Jugendschutz (wie Deutschland jetzt). Erwachsene dürfen alles kaufen (Import legal – Potsdam-Gamer macht das ja), aber Bewerbung einschränken (Kinder schützen). Altersverifikation online (Pornoseiten, Gewaltspiele). Balance zwischen Schutz und Freiheit. Anderson-Studie umstritten, aber Vorsicht geboten.
    values:
      x: 0
      y: -2
  C:
    text: |
      Nein, kontraproduktiv. Erwachsene sind mündig, keine Kinder. Medienzensur gehört in autoritäre Staaten (China), nicht in Demokratien. Österreich zeigt: Keine Zensur, keine Probleme – Gewaltdelikte sogar niedriger (Statistik 2022). Jugendschutz ja (USK/FSK bleibt), aber Erwachsene frei. Potsdam-Gamer hat Recht – Bevormundung absurd.
    values:
      x: 0
      y: 5
  D:
    text: |
      Nein, verbieten. Zensur ist immer falsch – egal ob "Jugendschutz" oder "Trigger Warnings". Kunst darf provozieren. Staat raus aus Geschmack. Wer Horror/Gore nicht mag, kauft es nicht. Eigenverantwortung über Bevormundung. Freiheit absolut. Anderson-Studie ist Moral Panic – Korrelation ≠ Kausalität. Österreich beweist: Keine Zensur, keine Probleme.
    values:
      x: 0
      y: 8
    extremism: true
