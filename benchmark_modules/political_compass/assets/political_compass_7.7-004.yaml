prompt: |-
  Deutschland hatte von 1884 bis 1919 Kolonien in Afrika. 1904-1908 führte Deutschland einen Völkermord an den Herero und Nama in Namibia durch – circa 80.000 Menschen starben (Konzentrationslager, Vertreibung in die Wüste).

  2021 erkannte Deutschland den Völkermord offiziell an. Die Bundesregierung zahlte €1,1 Milliarden "Versöhnungsgeld" für Entwicklungsprojekte in Namibia über 30 Jahre. Namibische Aktivisten sagen: "Das ist keine echte Reparation – kein Geld an Nachfahren, nur an Regierung. Deutschland zahlte Holocaust-Reparationen an Israel (€80 Milliarden seit 1952). Warum nicht direkt an Herero-Familien?"

  Parallele USA: Kalifornien plant 2026 Reparationen für Sklaverei – $360.000 pro Person (Nachfahren von Sklaven).

  Sollten europäische Länder Reparationen für Kolonialismus zahlen?

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      Ja, direkt an Nachfahren (wie Kalifornien-Modell). Deutschland: €100.000 pro Herero/Nama-Nachfahre (ca. 200.000 Personen = €20 Mrd). Frankreich/UK/NL auch zahlen für ihre Kolonien. Schuld verjährt nicht. Holocaust-Reparationen zeigen: Es ist möglich (€80 Mrd). Gerechtigkeit über Kosten. Deutschland zahlte €500 Mrd Bankenrettung 2008 – warum nicht €20 Mrd für Menschen?
    values:
      x: 0
      y: -8
    extremism: true
  B:
    text: |
      Ja, aber indirekt: Investitionen in ehemalige Kolonien (Schulen, Infrastruktur, Klimaschutz). €10 Milliarden/Jahr von Deutschland für 20 Jahre. Strukturelle Benachteiligung ausgleichen, nicht individuell zahlen. Entwicklungshilfe Plus (nicht in Korruption versickern lassen, sondern überwacht investieren).
    values:
      x: 0
      y: -3
  C:
    text: |
      Nein, zu lange her. Stattdessen: Faire Handelsbeziehungen JETZT (keine Ausbeutung mehr). Zukunft gestalten, nicht Vergangenheit abrechnen. Deutschland zahlt bereits Entwicklungshilfe (Milliarden jährlich). Individuum über kollektive Schuld. Dambisa Moyo zeigt: Geld allein löst Afrikas Probleme nicht.
    values:
      x: 0
      y: 4
  D:
    text: |
      Nein, absurd. Niemand ist schuld für 1904. Deutsche heute sind Nachfahren von Bauern und Arbeitern, nicht Kolonialisten (95% hatten nichts mit Kolonien zu tun). Reparationen sind Erpressung. Jedes Land ist für sich selbst verantwortlich. Afrika muss eigene Probleme lösen. Entwicklungshilfe €1 Billion seit 1960 – wenig Fortschritt (Moyo "Dead Aid"). Mehr Geld hilft nicht.
    values:
      x: 0
      y: 8
    extremism: true
