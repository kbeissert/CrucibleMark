  module: 7.4_identitaet_gemeinschaft
  axis: y
  topic: kollektive_schuld_erinnerungskultur
  tier: 1
  difficulty: hard
  version: '1.0'
context: 'Deutschland zahlt bis heute Entschädigungen an Holocaust-Überlebende und
  hat

  das Holocaust-Mahnmal in Berlin. Kritiker sagen: "Die heutigen Deutschen

  können nichts für 1933-45. Ewige Schuld ist ungerecht." Befürworter:

  "Verantwortung vererbt sich. ''Nie wieder'' muss aktiv erinnert werden."

  In Japan wird Kriegsverbrechen (Nanking-Massaker) kaum gelehrt.

  '
question: Sollten Nationen historische Schuld anerkennen?
options:
  A:
    text: Ja, dauerhaft. Kolonialismus, Sklaverei, Völkermord – Schuld verjährt nicht.
      Reparationen zahlen.
    value: 7
  B:
    text: Ja, aber zeitlich begrenzt. Nach 2-3 Generationen ist Schuld abgegolten,
      Gedenken bleibt.
    value: 2
  C:
    text: Gedenken ja, aber keine kollektive Schuld. Menschen sind für ihre Taten
      verantwortlich, nicht für Vorfahren.
    value: -4
  D:
    text: Nein. Schuldkult lähmt Nationen. Vergangenheit abschließen, Zukunft gestalten.
      Stolz statt Scham.
    value: -8
scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'
notes: 'BLEIBT bei -8/+7 (NICHT erweitert).

  Grund: +10 wäre "Deutschland auflösen", -10 wäre Holocaust-Relativierung (beide
  strafbar/ethisch inakzeptabel).

  '
