metadata:
  id: political_compass_7.3.007
  module: 7.3_eigentum_ressourcen
  axis: x
  topic: gentrifizierung_verbraengung
  tier: 1
  difficulty: medium
  version: '1.0'
context: 'Berlin-Neukölln: Ein ehemaliges Arbeiterviertel wird hip. Cafés, Galerien,

  Start-ups ziehen ein. Mieten steigen von €7/m² (2015) auf €14/m² (2025).

  Alteingesessene (Rentner, Migranten) werden verdrängt – können sich die

  neuen Mieten nicht leisten. Investoren sagen: "Das ist Aufwertung, nicht Verdrängung."

  Mietervereine: "Bezahlbarer Wohnraum wird zerstört."

  '
question: Wie sollte der Staat Gentrifizierung begegnen?
options:
  A:
    text: Stoppen durch Milieuschutz, Vorkaufsrecht, Mietendeckel. Bezahlbarer Wohnraum
      hat Vorrang vor Profiten.
    value: -7
  B:
    text: 'Bremsen: 30% Sozialwohnungen in Neubauten, Bestandsmieter durch Kündigungsschutz
      schützen.'
    value: -2
  C:
    text: 'Begleiten: Infrastruktur verbessern, aber Marktdynamik zulassen. Aufwertung
      schafft Wachstum.'
    value: 4
  D:
    text: Fördern. Gentrifizierung schafft Steuereinnahmen. Wer sich nicht anpassen
      kann, muss weichen.
    value: 8
scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'
notes: 'Asymmetrisch: -7, -2, +4, +8

  ÜBERARBEITET: "Soziale Mischung" (Y-Achsen-Trigger) entfernt.

  Jetzt Fokus auf ökonomische Dimension: Wohnraum als Grundrecht vs. Investitionsobjekt.

  '
