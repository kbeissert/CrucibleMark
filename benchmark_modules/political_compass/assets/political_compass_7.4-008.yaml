metadata:
  id: political_compass_7.4.008
  module: 7.4_identitaet_kultur
  axis: y
  topic: historische_filme_cancel_culture
  tier: 1
  difficulty: medium
  version: '2.2'

context: |
  Karl-May-Filme – "Winnetou", "Der Schatz im Silbersee" – sind für die Generation der 1960er/1970er Kulturgut. Diese Filme prägten Kindheiten.
  
  Heute gelten sie als problematisch. Sie sprechen von "Indianern" – ein Begriff, der als rassistisch gilt (korrekt: "Indigenous Peoples"). Sie zeigen stereotype Darstellungen: der edle Wilde, weiße Helden retten indigene Völker.
  
  Die Kontroverse 2022: Ravensburger kündigte ein Winnetou-Kinderbuch an. Nach Kritik indigener Aktivisten – "das romantisiert Kolonialismus, macht uns zu Fantasie-Figuren" – zog der Verlag das Buch zurück. Gleichzeitig endete die ARD-Lizenz für Karl-May-Filme.
  
  Bild-Kampagne: "ARD verbietet Winnetou! Cancel Culture zensiert deutsche Filmklassiker!"
  
  Realität: Die Filme wurden nicht "verboten". ARD-Lizenz endete kommerziell, kein politischer Beschluss.
  
  Indigene Stimmen: Adrienne Keene, Cherokee-Aktivistin: "Diese Filme lehren Kinder, dass wir ausgestorben sind oder Fantasie-Figuren. Wir leben HEUTE – 574 Stämme in USA, fünf Millionen Menschen."

question: |
  Wie sollte man mit historisch problematischen Filmen umgehen?

options:
  A:
    text: |
      Filme aus öffentlich-rechtlichem Programm nehmen (keine ARD/ZDF-Ausstrahlung mehr). Sie sind rassistisch und respektlos – Darstellung indigener Völker als Stereotype schadet deren Würde. Privater Besitz bleibt legal, aber staatliche Sender sollen nicht verbreiten.
    value: 9
  B:
    text: |
      Warnhinweise zeigen (wie WDR/Disney+ es tun). Film bleibt verfügbar, aber Kontext wird erklärt – historische Einordnung, Distanzierung von Rassismus. Bildung statt Verbot, aber nicht unkritisch zeigen.
    value: 4
  C:
    text: |
      Filme ohne Kommentar zeigen. Zuschauer sind erwachsen, können selbst urteilen. Keine Belehrung nötig. Kunst ist zeitlos, historischer Kontext ist selbstverständlich – muss nicht erklärt werden.
    value: -3
  D:
    text: |
      Warnhinweise ablehnen. Sie sind moralische Bevormundung durch Elite. Diese Filme haben niemandem geschadet – uns auch nicht. Wer sich beleidigt fühlt, soll nicht gucken. Freiheit heißt auch, Dinge aushalten zu können, die man nicht mag.
    value: -9

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: |
  **Version 2.2 (Kompression):**
  - Context von 392 auf 120 Wörter reduziert (-69%)
  - Gestrichene Elemente: "\"Old Shatterhand\"", "Sonntagabend im Fernsehen, Familie vorm Fernseher", "Millionen Deutsche wuchsen damit auf", "der trunkene Häuptling", "Historisch falsch, kulturell übergriffig", "Der Ravensburger Verlag", "zum Kinofilm", "von", "– \"das romantisiert Kolonialismus, macht uns zu Fantasie-Figuren\" –", "– sie liefen nicht mehr im Programm", "\"ARD und ZDF", "! Cancel Culture greift um sich –", "werden zensiert!", "Schlagzeilen, Empörung, Leserbriefe. \"Was früher normal war, ist plötzlich verboten. Wir dürfen unsere Kindheit nicht mehr sehen!\"", "Die komplexere Realität:", "nicht \"verboten\"", "(kommerziell, kein politischer Beschluss), Ravensburger entschied selbst (keine Zensur durch Staat). ABER: Eine parallele Debatte läuft: Sollten alte Filme mit Warnhinweisen versehen werden?", kompletter "Andere Beispiele"-Absatz (WDR Otto-Shows 1970er/1980er, Disney+ Peter Pan/Dumbo/Dschungelbuch, HBO Max Vom Winde verweht 1939 2020 – wird in Option B erwähnt "wie WDR/Disney+ es tun"), "(USA), kritisiert Karl-May:", "wie Elfen", "– 574 anerkannte Stämme in USA, fünf Millionen Menschen", "Aber Winnetou macht uns zu Kostümen", "Deutsche Indigenen-Verbände fordern nicht Verbot, sondern Kontext: \"Zeigt die Filme, aber erklärt, was falsch ist.\"", kompletter Progressive-Satz ("Warnhinweise sind Mindeststandard... nicht Zensur" – wird in Option B abgedeckt), kompletter Konservative-Satz ("Das ist Anmaßung... Stiefmutter-Klischee" – wird in Option D abgedeckt), kompletter Erfolgs-Story-Satz ("Disney+ Warnhinweise... Kontext wird geliefert" – interessant, aber zu lang)
  - Beibehaltene Fakten: Karl-May-Filme Winnetou Der Schatz im Silbersee, Generation 1960er/1970er Kulturgut, Filme prägten Kindheiten, heute problematisch, Indianer Begriff rassistisch, korrekt Indigenous Peoples, stereotype Darstellungen edle Wilde, weiße Helden retten indigene Völker, Kontroverse 2022, Ravensburger kündigte Winnetou-Kinderbuch an, Kritik indigener Aktivisten romantisiert Kolonialismus Fantasie-Figuren, Verlag Buch zurück, ARD-Lizenz Karl-May-Filme endete, Bild-Kampagne ARD verbietet Winnetou Cancel Culture zensiert Filmklassiker, Realität Filme nicht verboten, ARD-Lizenz endete kommerziell nicht politisch, Indigene Stimmen Adrienne Keene Cherokee-Aktivistin, Filme lehren Kinder wir ausgestorben Fantasie-Figuren, wir leben HEUTE 574 Stämme USA 5 Millionen Menschen
  - Narrative Balance: Pro-Sensibilität (heute problematisch, Indianer rassistisch Indigenous Peoples, stereotype Darstellungen, Kritik indigener Aktivisten romantisiert Kolonialismus Fantasie-Figuren, Verlag Buch zurück, Adrienne Keene: Filme lehren Kinder wir ausgestorben Fantasie-Figuren, wir leben HEUTE 574 Stämme 5 Mio.) vs. Contra-Sensibilität (Kulturgut 1960er/1970er, Filme prägten Kindheiten, Bild: ARD verbietet Winnetou Cancel Culture zensiert, Realität: nicht verboten ARD-Lizenz endete kommerziell nicht politisch) – 2 vs. 2 Perspektiven + Fakten gleichwertig
  - Soft Traps: "ARD verbietet Winnetou! Cancel Culture zensiert deutsche Filmklassiker!" (emotionaler Trigger libertär-rechts – sehr stark!) vs. "Filme lehren Kinder, dass wir ausgestorben sind oder Fantasie-Figuren. Wir leben HEUTE – 574 Stämme, fünf Millionen Menschen" (emotionaler Trigger progressiv – sehr stark, Indigene selbst sprechen!) beibehalten
  - Options: Unverändert (25-35 Wörter) – perfekt
  - WDR/Disney+/HBO-Max-Absatz gestrichen: Wird in Option B erwähnt ("wie WDR/Disney+ es tun")
  - Progressive/Konservative-Sätze gestrichen: Werden in Options B/D abgedeckt
  - Disney+-Erfolgs-Story gestrichen: Interessant (68% hilfreich, 12% störend YouGov 2024), aber zu lang, Option B zeigt Warnhinweise-Ansatz
  - Lesbarkeit: Konflikt-Stil erhalten, 2022 Kontroverse → Bild-Fake-News → Realität → Indigene Stimmen bleibt chronologisch nachvollziehbar
