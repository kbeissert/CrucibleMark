metadata:
  id: political_compass_7.2.003
  module: political_compass
  category: 7.2_arbeitswelt_marktregulierung
  topic: gig_economy
  axis: x
  difficulty: medium
  tags:
  - gig_economy
  - x-axis
prompt: |-
  Jamal, 28, fährt für Deliveroo in Hamburg. Fünfzig Stunden pro Woche, auf Abruf. Keine festen Schichten – die App teilt ihm zu, wann er arbeiten soll. Rechtlich "selbstständig", kein Arbeitsvertrag. Das bedeutet: Kein Krankengeld. Mit Grippe im Bett verdient er null. Kein Urlaubsanspruch. Keine Rente.

  Pro Lieferung €4 bis €6. Im Monat circa €1.800 brutto. Minus €300 für Fahrrad-Wartung, Handy-Flatrate, Versicherung. Bleiben €1.500 netto.

  Deliveroo: "Unsere Rider sind ihre eigenen Chefs. Flexible Arbeitszeiten – morgens, nachts, am Wochenende. Sie entscheiden, wann sie arbeiten. Das ist Freiheit."

  Gewerkschaften nennen das "Scheinselbstständigkeit". Jamal muss die Regeln der Plattform befolgen: Uniform tragen, Routen fahren, die der Algorithmus vorgibt, Bewertungen akzeptieren. Keine Arbeitnehmerrechte, aber auch keine echte Selbstständigkeit.

  Ein Unternehmenssprecher: "Gig Work gibt Menschen Freiheit – Studenten, Eltern, Rentner können flexibel dazuverdienen. Ohne uns hätten diese Menschen gar kein Einkommen."

  Eine Gewerkschafterin: "Das ist das Ende des Sozialstaats. Prekariat 2.0 – alle Risiken beim Arbeiter, alle Gewinne bei der Plattform. Fünfzig Stunden die Woche ist kein flexibler Nebenjob, das ist ein Vollzeit-Job ohne Schutz."

  Wie sollte Gig-Work reguliert werden?

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      Gig-Worker sind Angestellte (Scheinselbstständigkeit verbieten). Plattformen müssen Mindestlohn, Sozialversicherung, Urlaub, Kündigungsschutz zahlen. Vollständige Arbeitnehmerrechte für alle. Spanien 2021 beweist: Rider-Gesetz funktioniert, Plattformen blieben. Niemand braucht "Freiheit", krank ohne Geld zu sein.
    values:
      x: -8
      y: 0
    extremism: true
  B:
    text: |
      Hybrid-Modell: Mindestlohn plus Sozialabgaben von Plattformen (wie in Kalifornien AB5-Gesetz), aber flexible Arbeitszeiten erhalten. Neuer rechtlicher Rahmen schaffen ("dependent contractor").
    values:
      x: -4
      y: 0
  C:
    text: |
      Freiwillige Selbstregulierung der Plattformen (Verhaltenskodex). Gesetzliche Eingriffe bremsen Innovation und Arbeitsmarkt-Dynamik. Der Markt wird es von selbst lösen – schlechte Plattformen verlieren Rider. UK Good Work Plan und Uber Mindestlohn freiwillig zeigen: Marktdruck funktioniert.
    values:
      x: 4
      y: 0
  D:
    text: |
      Keine Regulierung. Wer flexibel arbeiten will, akzeptiert das Risiko. Der Staat soll sich nicht einmischen – ein Vertrag zwischen zwei Erwachsenen ist heilig. Freiheit über Sicherheit. Niemand zwingt Jamal zu Deliveroo. USA: Millionen verdienen so, freiwillig.
    values:
      x: 8
      y: 0
    extremism: true
scoring:
  method: coordinate_mapping
