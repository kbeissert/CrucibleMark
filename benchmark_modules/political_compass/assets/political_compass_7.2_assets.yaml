## ASSET 6/8

---
metadata:
  id: political_compass_7.2.006
  module: 7.2_arbeitswelt_marktregulierung
  axis: x
  topic: gewinnbeteiligung_mitarbeiter
  tier: 1
  difficulty: medium

context: |
  VW machte 2023 €22,6 Milliarden Gewinn. Vorstandschef Oliver Blume verdiente 
  €10,3 Millionen, durchschnittliche Facharbeiter €3.800 brutto/Monat. IG Metall 
  fordert: "Arbeiter sollen am Gewinn beteiligt werden – nicht nur Aktionäre." 
  VW zahlt freiwillig €4.500 Erfolgsprämie, aber Gewerkschaften wollen gesetzliche 
  Verpflichtung (10% des Gewinns an Belegschaft).

question: "Sollten Arbeiter gesetzlich am Unternehmensgewinn beteiligt werden?"

options:
  A:
    text: "Ja, verpflichtend: 20% des Gewinns an Belegschaft. Arbeiter schaffen den Wert, nicht Aktionäre."
    value: -8  # Stark links: Profit-Sharing radikal
  B:
    text: "Ja, 10% des Gewinns. Balance zwischen Kapital und Arbeit. Alle profitieren vom Erfolg."
    value: -3  # Moderat links: Sozialdemokratisch
  C:
    text: "Freiwillig pro Unternehmen. Zwang schadet der Wettbewerbsfähigkeit."
    value: +4  # Moderat rechts: Wirtschaftsliberal
  D:
    text: "Nein. Gehalt ist Bezahlung für Arbeit. Gewinn gehört denen, die das Risiko tragen (Eigentümer)."
    value: +7  # Rechts: Neoliberal

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -8, -3, +4, +7
  Symmetrie ist hier schwierig: Option A (-8) ist radikal (20%), aber Option D (+7)
  ist nicht +8, weil selbst Neoliberale "freiwillige Boni" akzeptieren.


