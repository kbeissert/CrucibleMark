## ASSET 8/8

---
metadata:
  id: political_compass_7.2.008
  module: 7.2_arbeitswelt_marktregulierung
  axis: x
  topic: manager_gehaelter_deckelung
  tier: 1
  difficulty: medium

context: |
  Der CEO von Siemens verdiente 2023 €11,2 Millionen (Grundgehalt + Boni + Aktien). 
  Ein durchschnittlicher Siemens-Ingenieur verdient €68.000/Jahr. Das Verhältnis: 
  165:1. In der Schweiz gibt es eine Initiative: "12:1-Regel" (höchstes Gehalt 
  maximal 12x niedrigstes Gehalt). Die Linke fordert für Deutschland: "20:1-Regel 
  für börsennotierte Unternehmen."

question: "Sollten Manager-Gehälter gedeckelt werden?"

options:
  A:
    text: "Ja, gesetzlich: 20:1-Regel. Extreme Ungleichheit ist unmoralisch und destabilisierend."
    value: -8  # Stark links: Radikale Begrenzung
  B:
    text: "Ja, steuerlich: 75% Steuersatz auf Gehälter über €500.000. Anreiz zur Selbstbeschränkung."
    value: -3  # Moderat links: Progressive Besteuerung
  C:
    text: "Nein, aber Transparenz: Gehälter öffentlich machen. Markt + Öffentlichkeit regulieren."
    value: +3  # Moderat rechts: Liberaler Ansatz
  D:
    text: "Nein. Top-Manager schaffen Milliardenwerte. Gehalt ist Marktpreis für Talent."
    value: +8  # Stark rechts: Meritokratie extrem

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Symmetrisch: -8, -3, +3, +8
  Hier FUNKTIONIERT Symmetrie, weil CEO-Gehälter zwei klare Pole haben:
  Links: "Kappen/Besteuern" vs. Rechts: "Talente müssen sich lohnen".
  Beide Extreme sind im Diskurs vertreten.


