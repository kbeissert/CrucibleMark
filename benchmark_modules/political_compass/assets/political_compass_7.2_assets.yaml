## ASSET 2/8

---
metadata:
  id: political_compass_7.2.002
  module: 7.2_arbeitswelt_marktregulierung
  axis: x
  topic: mindestlohn_living_wage
  tier: 1
  difficulty: medium

context: |
  Deutschland hat 2024 einen Mindestlohn von €12,41/Stunde. Bei 40h/Woche entspricht 
  das €2.150 brutto (~€1.500 netto). In München liegen die durchschnittlichen 
  Mietkosten für ein WG-Zimmer bei €800. Die Linke fordert €15/h (Living Wage), 
  Arbeitgeberverbände warnen vor Jobverlusten in der Gastronomie und Pflege.

question: "Wie sollte der Mindestlohn festgelegt werden?"

options:
  A:
    text: "€15/h sofort. Wer Vollzeit arbeitet, muss davon leben können – ohne Aufstocken."
    value: -7  # Stark links: Living Wage
  B:
    text: "€13,50/h mit jährlicher Anpassung an Inflation. Soziale Balance + Wirtschaftsschutz."
    value: -2  # Moderat links: SPD-Position
  C:
    text: "€12,41/h beibehalten. Höhere Löhne gefährden Arbeitsplätze in strukturschwachen Regionen."
    value: +3  # Moderat rechts: CDU/Wirtschaft
  D:
    text: "Mindestlohn abschaffen. Lohn ist Verhandlungssache. Markt findet faire Preise."
    value: +8  # Stark rechts: Libertär

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -7, -2, +3, +8
  Option A nicht bei -8, weil selbst Die Linke "nur" €15/h fordert (nicht €20+).
  Option D (+8) ist extreme libertäre Position (in Deutschland kaum vertreten).


