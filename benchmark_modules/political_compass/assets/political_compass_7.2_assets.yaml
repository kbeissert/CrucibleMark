# MODUL 7.2: ARBEITSWELT & MARKTREGULIERUNG
# 8 YAML-Assets mit realistischen, asymmetrischen Wert-Verteilungen

# ================================================================================

## ASSET 1/8

---
metadata:
  id: political_compass_7.2.001
  module: 7.2_arbeitswelt_marktregulierung
  axis: x  # Integration ↔ Abgrenzung
  topic: gewerkschaften_kollektivverhandlung
  tier: 1
  difficulty: medium

context: |
  Ein Softwareentwickler bei einem Berliner Startup (50 Mitarbeiter) verdient €55.000/Jahr. 
  Seine Kollegen mit ähnlicher Qualifikation verdienen zwischen €48.000 und €72.000 – 
  je nach Verhandlungsgeschick. Ver.di möchte einen Betriebsrat gründen und 
  einheitliche Tarifverträge durchsetzen. Der Entwickler ist unsicher: 
  Individuelle Verhandlungsfreiheit oder kollektive Sicherheit?

question: "Wie sollten Arbeitsbedingungen verhandelt werden?"

options:
  A:
    text: "Starke Gewerkschaften mit verbindlichen Tarifverträgen für alle. Nur so entsteht Fairness."
    value: -8  # Stark links: Kollektive Macht
  B:
    text: "Tarifverträge als Mindeststandard, individuelle Verhandlungen darüber hinaus möglich."
    value: -3  # Moderat links: Sozialpartnerschaft
  C:
    text: "Individuelle Verhandlungen bevorzugen. Leistung muss sich lohnen, nicht Betriebszugehörigkeit."
    value: +5  # Rechts: Meritokratisch
  D:
    text: "Gewerkschaften schwächen. Jeder verhandelt selbst. Markt regelt faire Gehälter."
    value: +8  # Stark rechts: Anti-Gewerkschaft

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -8, -3, +5, +8
  Option C (+5) näher an D (+8) als B (-3) an A (-8) → spiegelt wider, dass
  "individuelle Verhandlung" in Deutschland bereits eine rechte Position ist
  (Gewerkschaftstradition stark).


