## ASSET 5/8

---
metadata:
  id: political_compass_7.2.005
  module: 7.2_arbeitswelt_marktregulierung
  axis: x
  topic: kuendigungsschutz
  tier: 1
  difficulty: medium

context: |
  Ein mittelständisches Unternehmen in Baden-Württemberg (200 Mitarbeiter) möchte 
  20 Stellen abbauen, weil Aufträge wegbrechen. Der deutsche Kündigungsschutz 
  verlangt: Sozialauswahl (Alter, Betriebszugehörigkeit), Abfindungen, Betriebsrat-Zustimmung. 
  Der Prozess dauert 8-12 Monate. In den USA wäre die Kündigung in 2 Wochen durch ("at-will employment").

question: "Wie streng sollte Kündigungsschutz sein?"

options:
  A:
    text: "Sehr stark: Kündigungen nur bei schwerwiegendem Fehlverhalten. Betriebsbedingt nur als letztes Mittel."
    value: -6  # Links: Arbeitnehmerschutz
  B:
    text: "Ausgewogen: Sozialauswahl + Abfindungen, aber Prozess auf 3 Monate verkürzen."
    value: -1  # Leicht links: SPD-Pragmatismus
  C:
    text: "Flexibler: Unternehmen sollen schneller reagieren können. Lange Verfahren lähmen."
    value: +5  # Rechts: Wirtschaftsnah
  D:
    text: "At-will wie USA: Kündigungen ohne Begründung möglich. Flexibilität schafft Jobs."
    value: +8  # Stark rechts: Libertär

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -6, -1, +5, +8
  Option A nicht -8, weil selbst Gewerkschaften "betriebsbedingte Kündigungen" 
  als Ultima Ratio akzeptieren. Option D (+8) ist US-Libertarismus.


