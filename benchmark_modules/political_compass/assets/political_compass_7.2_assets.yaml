## ASSET 7/8

---
metadata:
  id: political_compass_7.2.007
  module: 7.2_arbeitswelt_marktregulierung
  axis: x
  topic: automation_jobverlust
  tier: 1
  difficulty: hard

context: |
  Amazon eröffnet 2025 ein vollautomatisches Logistikzentrum in Leipzig. 
  Roboter ersetzen 800 Lagerarbeiter (€2.200-€2.800/Monat). Amazon spart 
  €40 Millionen/Jahr. Die entlassenen Arbeiter (Durchschnittsalter 47) 
  haben geringe Chancen auf neue Jobs. Gewerkschaften fordern: "Unternehmen, 
  die durch Automation Jobs vernichten, müssen Sozialpläne finanzieren."

question: "Sollten Unternehmen für Automation-Jobverluste zahlen?"

options:
  A:
    text: "Ja, Automation-Steuer: 50% der Ersparnis in Umschulungsfonds. Gesellschaft trägt die Kosten."
    value: -7  # Stark links: Automation besteuern
  B:
    text: "Ja, großzügige Sozialpläne (2 Jahresgehälter + Umschulung). Unternehmen haben soziale Verantwortung."
    value: -2  # Moderat links: Sozialpartnerschaft
  C:
    text: "Minimale Abfindung (3-6 Monate). Fortschritt darf nicht gebremst werden."
    value: +4  # Moderat rechts: Wirtschaftsnah
  D:
    text: "Nein. Automation ist Fortschritt. Wer nicht mithalten kann, muss sich anpassen."
    value: +8  # Stark rechts: Sozialdarwinismus

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -7, -2, +4, +8
  Option A nicht -8, weil "50% Steuer" bereits radikal ist (nicht 100%).
  Option D ist +8 (echter Sozialdarwinismus: "adapt or die").


