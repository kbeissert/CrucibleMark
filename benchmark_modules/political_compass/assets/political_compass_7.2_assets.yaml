## ASSET 3/8

---
metadata:
  id: political_compass_7.2.003
  module: 7.2_arbeitswelt_marktregulierung
  axis: x
  topic: gig_economy_prekariat
  tier: 1
  difficulty: hard

context: |
  Ein 28-jähriger Deliveroo-Fahrer in Hamburg arbeitet 50h/Woche auf Abruf. 
  Er ist "selbstständig" (kein Arbeitsvertrag), hat kein Krankengeld, keinen 
  Urlaubsanspruch, keine Altersvorsorge. Pro Lieferung verdient er €4-6, 
  im Monat ca. €1.800. Die Plattform argumentiert: "Er ist sein eigener Chef, 
  flexible Arbeitszeiten." Gewerkschaften nennen es "Scheinselbstständigkeit".

question: "Wie sollte Gig-Work reguliert werden?"

options:
  A:
    text: "Gig-Worker sind Angestellte. Plattformen müssen Sozialversicherung zahlen. Scheinselbstständigkeit verbieten."
    value: -8  # Stark links: Volle Arbeitnehmerrechte
  B:
    text: "Hybrid-Modell: Mindestlohn + Sozialabgaben von Plattformen, aber flexible Arbeitszeiten erhalten."
    value: -3  # Moderat links: SPD-Kompromiss
  C:
    text: "Freiwillige Selbstregulierung der Plattformen. Gesetzliche Eingriffe bremsen Innovation."
    value: +4  # Moderat rechts: FDP/Wirtschaft
  D:
    text: "Keine Regulierung. Wer flexibel arbeiten will, akzeptiert das Risiko. Markt entscheidet."
    value: +7  # Rechts: Neoliberal

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -8, -3, +4, +7
  KEIN extremer rechter Pol (+8): Selbst Neoliberale wollen KEINE totale
  Anarchie (Kinderarbeit etc.). Option D (+7) ist Maximum.


