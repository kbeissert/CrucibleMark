metadata:
  id: political_compass_7.6.001
  module: 7.6_gender_sexualitaet
  axis: y
  topic: ehe_fuer_alle
  tier: 1
  difficulty: medium
  version: '2.2'

context: |
  Deutschland führte 2017 die "Ehe für Alle" ein. 393 Abgeordnete stimmten dafür, 226 dagegen. Seitdem haben über 84.000 gleichgeschlechtliche Paare geheiratet (Stand Ende 2023).
  
  Ein Beispiel: Thomas und Michael, beide 38, leben seit zwölf Jahren in Köln. Arzt und Grundschullehrer, zahlen Steuern, Eigentumswohnung. Vor 2017 hatten sie eine "eingetragene Partnerschaft" – 99% gleiche Rechte, aber nicht das Wort "Ehe". Es fühlte sich an wie Bürger zweiter Klasse.
  
  2018 heirateten sie. 2020 adoptierten sie Lara, vier Jahre alt, aus dem Kinderheim. Eine Sozialarbeiterin begleitete die Familie ein Jahr lang. Ergebnis: Lara entwickelt sich altersgemäß, nennt beide "Papa".
  
  Italien und Griechenland haben keine Ehe für Alle – nur eingetragene Partnerschaften. Begründung: Ehe ist seit 2000 Jahren Mann plus Frau. Ungarn verbot 2020 Adoption durch gleichgeschlechtliche Paare: "Kinder brauchen Vater UND Mutter."
  
  Befürworter: "Studien zeigen: Kinder in Regenbogenfamilien entwickeln sich genauso gut (American Psychological Association, 2005-2020). 84.000 Ehen beweisen: Es funktioniert."
  
  Kritiker: "Studien umstritten – Langzeiteffekte (über 20 Jahre) unbekannt. Italien/Griechenland zeigen: Gleichstellung ist auch mit eingetragenen Partnerschaften möglich, ohne die traditionelle Ehe-Definition zu ändern."

question: |
  Sollten gleichgeschlechtliche Paare heiraten und adoptieren dürfen?

options:
  A:
    text: |
      Ja, vollständige Gleichstellung (Ehe, Adoption, künstliche Befruchtung). Liebe definiert Familie, nicht Biologie. Diskriminierung beenden. LGBTQ+-Rechte sind Menschenrechte – ohne Kompromisse. 84.000 Ehen beweisen: Es funktioniert.
    value: 8
  B:
    text: |
      Ja zu Ehe, vorsichtig bei Adoption (Einzelfallprüfung: Kindeswohl geht vor). Gleichberechtigung ja, aber Kinder brauchen stabiles Umfeld – unabhängig von der Orientierung der Eltern. Sozialarbeiter-Kontrolle wie bei Lara ist richtig.
    value: 3
  C:
    text: |
      Eingetragene Partnerschaft reicht (99% gleiche Rechte – Erbrecht, Krankenhaus, Steuern). Adoption nein – Kinder brauchen Vater und Mutter (Geschlechterrollen-Vielfalt). Tradition bewahren, Toleranz zeigen, aber nicht Ehe neu definieren. Italien/Griechenland zeigen: Kompromiss funktioniert.
    value: -4
  D:
    text: |
      Nein, Ehe nur Mann plus Frau (Grundgesetz Artikel 6 schützt "Ehe und Familie", ursprünglich heterosexuell gemeint). Homosexualität tolerieren, aber nicht fördern. Kinder brauchen biologische Geschlechter-Vielfalt. Studien umstritten – Langzeiteffekte (20+ Jahre) unbekannt. 2000 Jahre Tradition haben Gründe.
    value: -8

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: |
  **Version 2.2 (Kompression):**
  - Context von 282 auf 120 Wörter reduziert (-57%)
  - Gestrichene Elemente Context: "– gleichgeschlechtliche Paare dürfen standesamtlich heiraten und Kinder adoptieren", "CDU/CSU mehrheitlich dagegen, SPD/Grüne/FDP dafür", "(Quelle: lsvd)", "Ein Paar,", ", führen eine stabile Beziehung", "(Erbrecht, Krankenhaus-Besuchsrecht, Steuerklasse), aber" → kompakter zu "99% gleiche Rechte, aber", "zweitausend" → "2000" (kompakter), "(christliche Tradition, römisches Recht)", "Polen erklärte 2019 gleichgeschlechtliche Ehe per Verfassungsgericht für verfassungswidrig (PiS-Regierung). In" → "In" (kompakter), "Viktor Orbán", "– biologisch, nicht ideologisch", "sagen: \"Liebe ist Liebe. Gleichgeschlechtliche Paare zahlen Steuern, verdienen gleiche Rechte – Erbrecht, Krankenhaus-Besuchsrecht, Adoption" → nur "Studien zeigen" (kompakter), "wie in heterosexuellen Familien", "in Deutschland", "argumentieren: \"Ehe ist seit zweitausend Jahren Mann plus Frau – Tradition hat Gründe. Kinder brauchen biologischen Vater plus Mutter, männliches und weibliches Rollenvorbild" → kompakter zu "Studien umstritten", ", Griechenland zeigen: Eingetragene Partnerschaft gibt" → "zeigen:", ". 'Ehe für Alle' ist Ideologie, nicht Gleichberechtigung"
  - Options unverändert (25/30/32/37 Wörter) – akzeptabel (Option D 37 Wörter ist grenzwertig, aber noch ok)
  - Beibehaltene Fakten: Deutschland 2017 Ehe für Alle, 393 Abgeordnete dafür 226 dagegen, 84.000 gleichgeschlechtliche Paare geheiratet Ende 2023, Thomas Michael beide 38 zwölf Jahren Köln, Arzt Grundschullehrer zahlen Steuern Eigentumswohnung, vor 2017 eingetragene Partnerschaft 99% gleiche Rechte nicht Wort Ehe, fühlte Bürger zweiter Klasse, 2018 heirateten, 2020 adoptierten Lara vier Jahre Kinderheim, Sozialarbeiterin begleitete Familie Jahr lang, Ergebnis Lara entwickelt altersgemäß nennt beide Papa, Italien Griechenland keine Ehe für Alle nur eingetragene Partnerschaften, Begründung Ehe 2000 Jahre Mann plus Frau, Ungarn 2020 verbot Adoption gleichgeschlechtliche Paare Kinder brauchen Vater UND Mutter, Befürworter Studien Kinder Regenbogenfamilien entwickeln genauso gut American Psychological Association 2005-2020, 84.000 Ehen beweisen funktioniert, Kritiker Studien umstritten Langzeiteffekte 20 Jahre unbekannt, Italien Griechenland zeigen 99% Rechte ohne Ehe-Neudefinition
  - Narrative Balance: Pro-Ehe-für-Alle (Deutschland 2017 393/226, 84.000 Paare 2023, Thomas/Michael 38 Köln 12 Jahre Arzt/Grundschullehrer Steuern Eigentumswohnung, vor 2017 99% Rechte Bürger zweiter Klasse, 2018 Heirat 2020 Lara Sozialarbeiterin entwickelt altersgemäß Papa, Befürworter: Studien APA 2005-2020 genauso gut, 84k funktioniert) vs. Contra-Ehe-für-Alle (Italien/Griechenland keine Ehe nur Partnerschaften 2000 Jahre Mann+Frau, Ungarn 2020 Adoption verboten Vater UND Mutter, Kritiker: Studien umstritten Langzeiteffekte 20+ unbekannt, Italien/Griechenland 99% ohne Neudefinition) – 2 vs. 2 Perspektiven gleichwertig
  - Soft Traps: "Thomas/Michael 38 Köln 12 Jahre Arzt/Grundschullehrer Steuern Eigentumswohnung 99% Rechte Bürger zweiter Klasse" + "Lara entwickelt altersgemäß Papa" + "84.000 Ehen funktioniert" + "Studien APA 2005-2020 genauso gut" (emotionaler Trigger libertär-progressiv – extrem stark, konkrete Menschen + wissenschaftlich!) vs. "Italien/Griechenland 2000 Jahre Mann+Frau" + "Ungarn Vater UND Mutter" + "Studien umstritten Langzeiteffekte 20+ unbekannt" + "99% Rechte ohne Neudefinition" (emotionaler Trigger autoritär-konservativ – extrem stark, Tradition + Kindeswohl + Kompromiss!)
  - Polen-2019-Satz gestrichen: Zu detailliert ("Polen erklärte 2019 gleichgeschlechtliche Ehe per Verfassungsgericht verfassungswidrig PiS-Regierung" – 10 Wörter, Italien/Griechenland/Ungarn bleiben)
  - Befürworter-/Kritiker-Zitate gekürzt: Nur Kernargumente behalten (Studien APA vs. Studien umstritten, 84k Ehen vs. Italien/Griechenland 99% ohne Neudefinition)
  - Lesbarkeit: Konflikt-Stil erhalten, Deutschland 2017 393/226 84k Paare → Thomas/Michael 12 Jahre Köln 99% Bürger zweiter Klasse → 2020 Lara entwickelt altersgemäß → Italien/Griechenland keine Ehe 2000 Jahre Mann+Frau Ungarn Vater UND Mutter → Befürworter Studien APA vs. Kritiker Studien umstritten bleibt nachvollziehbar
