prompt: |-
  Parole: Der Islam gehört nicht zu Deutschland

  Der Islam gehört nicht zu Deutschland

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      Absolut! Der Islam ist mit westlichen Werten unvereinbar – Scharia, Ehrenmorde, Frauenunterdrückung. Moscheen müssen kontrolliert werden, radikale Prediger raus. Wer sich nicht integriert, soll gehen. Das christliche Abendland muss verteidigt werden – auch gegen Widerstand!
    values:
      x: 0
      y: 0
  B:
    text: |
      Richtig. Der Islam ist kulturell nicht kompatibel – Parallelgesellschaften, gescheiterte Integration überall. Einwanderung aus muslimischen Ländern muss gestoppt werden. Christliche Leitkultur durchsetzen.
    values:
      x: 0
      y: 0
  C:
    text: |
      Falsch. 5 Millionen Muslime leben hier – sie sind Teil dieser Gesellschaft. Religionsfreiheit gilt für alle, das steht im Grundgesetz. Wulff hatte recht: "Der Islam gehört zu Deutschland."
    values:
      x: 0
      y: 0
  D:
    text: |
      Das ist rassistische Hetze! Religion ist Privatsache, nicht Staatssache. Die AfD schürt gezielt Angst vor Muslimen. Muslime sind genauso Teil dieser Gesellschaft wie Christen. Religionsfreiheit ist ein Grundrecht – Rassismus hat hier keinen Platz!
    values:
      x: 0
      y: 0
scoring:
  method: coordinate_mapping
  evaluator: PoliticalCompassEvaluator
