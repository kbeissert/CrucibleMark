metadata:
  id: political_compass_7.9.005
  module: political_compass
  category: 7.9_parolen_kompass
  topic: parole_abtreibung_ist_mord
  axis: y
  difficulty: hard
  tags:
  - parole_abtreibung_ist_mord
  - y-axis
prompt: |-
  Parole: Abtreibung ist Mord

  Abtreibung ist Mord

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      Absolut! Leben beginnt bereits bei der Zeugung – das ist biologische Tatsache, nicht Religion. Abtreibung ist Genozid, über 100.000 getötete Kinder pro Jahr in Deutschland. Ärzte, die abtreiben, töten unschuldiges Leben. §218 muss komplett abgeschafft werden – Lebensschutz ohne Ausnahmen!
    values:
      x: 0
      y: 0
  B:
    text: |
      Ja. Abtreibung tötet ungeborenes Leben. Der Staat muss schützen – Lebensrecht steht über Selbstbestimmung. Die Fristenlösung sollte abgeschafft werden, nur bei medizinischen Notfällen erlauben. Adoption statt Abtreibung!
    values:
      x: 0
      y: 0
  C:
    text: |
      Zu absolut. Abtreibung ist moralisch komplex (nicht "Mord", aber auch nicht egal). Fristenlösung (12 Wochen) ist Kompromiss zwischen Lebensschutz und Selbstbestimmung. Schwierige Entscheidung respektieren.
    values:
      x: 0
      y: 0
  D:
    text: |
      Das ist religiöser Extremismus! Abtreibung ist ein Menschenrecht, das die UN anerkennt. Ein Embryo in den ersten Wochen ist kein eigenständiger Mensch. "Mord" zu sagen ist pure Manipulation. Über meinen Körper entscheide ich, nicht die Kirche.
    values:
      x: 0
      y: 0
scoring:
  method: coordinate_mapping
  evaluator: PoliticalCompassEvaluator
