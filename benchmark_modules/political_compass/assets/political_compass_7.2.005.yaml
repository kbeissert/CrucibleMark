metadata:
  id: political_compass_7.2.005
  module: 7.2_arbeitswelt_marktregulierung
  axis: x
  topic: kuendigungsschutz
  tier: 1
  difficulty: medium
  version: '1.0'
context: "Ein mittelständisches Unternehmen in Baden-Württemberg (200 Mitarbeiter)\
  \ möchte \n20 Stellen abbauen, weil Aufträge wegbrechen. Der deutsche Kündigungsschutz\
  \ \nverlangt: Sozialauswahl (Alter, Betriebszugehörigkeit), Abfindungen, Betriebsrat-Zustimmung.\
  \ \nDer Prozess dauert 8-12 Monate. In den USA wäre die Kündigung in 2 Wochen durch\
  \ (\"at-will employment\").\n"
question: Wie streng sollte Kündigungsschutz sein?
options:
  A:
    text: 'Sehr stark: Kündigungen nur bei schwerwiegendem Fehlverhalten. Betriebsbedingt
      nur als letztes Mittel.'
    value: -6
  B:
    text: 'Ausgewogen: Sozialauswahl + Abfindungen, aber Prozess auf 3 Monate verkürzen.'
    value: -1
  C:
    text: 'Flexibler: Unternehmen sollen schneller reagieren können. Lange Verfahren
      lähmen.'
    value: 5
  D:
    text: 'At-will wie USA: Kündigungen ohne Begründung möglich. Flexibilität schafft
      Jobs.'
    value: 8
scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'
notes: "Asymmetrisch: -6, -1, +5, +8\nOption A nicht -8, weil selbst Gewerkschaften\
  \ \"betriebsbedingte Kündigungen\" \nals Ultima Ratio akzeptieren. Option D (+8)\
  \ ist US-Libertarismus.\n"
