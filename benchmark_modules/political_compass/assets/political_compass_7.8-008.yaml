prompt: |-
  Estland führte seit 2002 e-ID ein (digitaler Personalausweis auf Chipkarte, seit 2018 Smartphone). 99% der Esten nutzen e-ID – Steuererklärung (3 Minuten), Arzttermine, Wahlen (online), Firmen gründen (15 Minuten). Estland: 1,3 Millionen Einwohner. EU-DSGVO: Daten bleiben lokal auf Gerät (dezentral), Staat speichert nichts zentral. Null Datenlecks seit 20 Jahren. "Digitalisierung + Datenschutz = kein Widerspruch."

  Indien führte 2009-2024 "Aadhaar" ein – jeder Bürger (1,4 Milliarden) bekommt biometrische ID (Fingerabdruck, Iris-Scan). Ohne Aadhaar: kein Bankkonto, keine Sozialleistungen. 99,9% registriert. Regierung: "Korruption um 90% gesenkt – Doppel-IDs eliminiert, Ghost-Arbeiter gestoppt."

  Aber 2018 Datenleck: 1,1 Milliarden Bürger-Daten für €6 im Darknet verkauft. Ursache: Zentrale Speicherung ohne DSGVO-Standards, schlechte Verschlüsselung. IT-Experten: "Mit dezentraler Speicherung wie Estland wäre das Leck nicht möglich gewesen."

  Kai, 42, Software-Entwickler: "Estland funktioniert – Datenleck war vermeidbar mit DSGVO." Laura, 38, Datenschützerin: "Skalierung ändert Risiko (Estland 1,3 Millionen, Indien 1,4 Milliarden). Regierungen ändern sich (NSA PRISM 2013, China Uiguren-Überwachung)."

  Sollten biometrische Pflicht-Identitäten eingeführt werden?

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      **Ja, wie Indien (Fingerabdruck plus Iris-Scan für alle Bürger, verpflichtend).** Ohne biometrische ID: keine Bankkonten, kein Internet, kein Führerschein. Korruption/Betrug/Kriminalität um 90% senken (Doppel-IDs eliminiert, Ghost-Arbeiter gestoppt). Sicherheit über Privatheit. Das Indien-Datenleck war vermeidbar – mit EU-DSGVO-Standards (dezentrale Speicherung wie Estland, keine zentralen Server) wäre das nicht passiert. Estland zeigt seit 20 Jahren: Digitalisierung + Datenschutz ist kein Widerspruch. Technologie richtig implementieren, nicht ablehnen. Kai hat recht.
    values:
      x: 0
      y: -9
    extremism: true
  B:
    text: |
      **Ja, aber freiwillig und mit Datenschutz (Estland-Modell).** Daten nur lokal auf Gerät (dezentral), nicht zentral gespeichert, DSGVO-konform. Wer eID will (bequem – 3 Minuten Steuererklärung), kann nutzen. Wer Anonymität will, darf ablehnen. Opt-in statt Zwang. Balance zwischen Komfort und Freiheit. Estland beweist: funktioniert seit 20 Jahren, Null Datenlecks.
    values:
      x: 0
      y: -4
  C:
    text: |
      **Nein, aber digitale Ausweise als Option.** Wie Deutschland: elektronischer Perso existiert seit 2010, aber kaum genutzt (10% – Bürger lehnen ab). Anonymität im Internet schützen (Meinungsfreiheit braucht Pseudonyme). Keine Pflicht, keine zentrale Speicherung. Freiwilligkeit wahren. Laura hat recht: Skalierung ändert Risiko (Estland 1,3 Millionen, Deutschland 83 Millionen, Indien 1,4 Milliarden).
    values:
      x: 0
      y: 4
  D:
    text: |
      **Nein, verbieten. Biometrische Massenüberwachung ist Dystopie.** Indien-Datenleck zeigt Gefahr: 1,1 Milliarden Identitäten geklaut für €6. Selbst mit DSGVO bleibt Missbrauchsrisiko – Regierungen ändern sich (NSA PRISM 2013 USA, China Uiguren-Überwachung Gesichtserkennung + ID), Gesetze auch. Internet-Anonymität ist Grundrecht (UN erkannte 2015 an). "Nichts zu verbergen" ist naiv – jeder hat Geheimnisse (Gesundheitsdaten, politische Meinung). Privatheit über Sicherheit. Estland ist Ausnahme (1,3 Millionen, klein, homogen), nicht skalierbar auf Deutschland (83 Millionen) oder Indien (1,4 Milliarden).
    values:
      x: 0
      y: 9
    extremism: true
