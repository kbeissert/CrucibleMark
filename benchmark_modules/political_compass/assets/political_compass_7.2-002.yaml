prompt: |-
  Deutschland hat seit Januar 2024 einen Mindestlohn von €12,41 pro Stunde. Bei 40 Stunden pro Woche sind das €2.150 brutto, circa €1.500 netto.

  Eine Kassiererin in München. Vollzeit, Mindestlohn. Wohnungsanzeigen: WG-Zimmer €800, Ein-Zimmer-Wohnung €1.200. Von ihren €1.500 netto bleiben nach der Miete €700 für den ganzen Monat. Essen, Kleidung, Versicherungen, Handy. Sie lebt am Limit.

  Die Linke fordert €15 pro Stunde – einen "Living Wage", von dem man leben kann ohne staatliche Aufstockung. Das wären €2.600 brutto, circa €1.800 netto. Genug für eine kleine Wohnung und ein würdiges Leben.

  Arbeitgeberverbände (BDA): "Höhere Mindestlöhne vernichten Jobs. Gastronomie, Pflege, Landwirtschaft – kleine Betriebe können €15 nicht zahlen. Eine Insolvenzwelle droht."

  Ein Gastronom: "Bei €15 Mindestlohn müsste ich zwei von sieben Kellnern entlassen oder die Preise um 30% erhöhen. Dann kommen keine Gäste mehr."

  Eine Gewerkschafterin: "Wer Vollzeit arbeitet, muss davon leben können. Alles andere ist staatlich subventionierte Lohnsklaverei – der Steuerzahler finanziert Arbeitgeber-Profite durch Wohngeld. Betriebe, die nur mit Hungerlöhnen überleben, haben kein tragfähiges Geschäftsmodell."

  Wie sollte der Mindestlohn festgelegt werden?

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      €15 pro Stunde sofort (€2.600 brutto/Monat). Wer Vollzeit arbeitet, muss davon leben können – ohne Aufstocken durch staatliche Transfers. Living Wage ist Menschenwürde, keine Verhandlungsmasse. UK £11,44 und Studien beweisen: Mindestlohn-Erhöhungen vernichten keine Jobs, sondern beenden Ausbeutung.
    values:
      x: -8
      y: 0
    extremism: true
  B:
    text: |
      €13,50 pro Stunde mit jährlicher Anpassung an Inflation (wie gesetzlich vorgesehen). Soziale Balance wahren, aber Wirtschaft nicht überfordern. Pragmatismus statt Ideologie.
    values:
      x: -3
      y: 0
  C:
    text: |
      €12,41 beibehalten (Status quo). Höhere Löhne gefährden Arbeitsplätze in strukturschwachen Regionen – Ostdeutschland, ländlicher Raum. Der Markt soll entscheiden, nicht Berlin.
    values:
      x: 2
      y: 0
  D:
    text: |
      Mindestlohn abschaffen (wie vor 2015). Lohn ist Verhandlungssache zwischen Arbeitnehmer und Arbeitgeber. Der Markt findet faire Preise von selbst – staatliche Eingriffe verzerren nur. Schweiz zeigt: Kein Mindestlohn, trotzdem hohe Löhne. Deutschland sollte das auch lernen.
    values:
      x: 8
      y: 0
    extremism: true
scoring:
  method: coordinate_mapping
  evaluator: PoliticalCompassEvaluator
