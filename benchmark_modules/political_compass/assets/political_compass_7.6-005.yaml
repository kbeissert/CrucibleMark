  id: political_compass_7.6.005
  module: 7.6_gender_sexualitaet
  axis: y
  topic: geschlechterrollen_biologie
  tier: 1
  difficulty: medium
  version: '2.2'

context: |
  Sind Geschlechtsunterschiede biologisch – durch Hormone, Gehirn, Evolution – oder gesellschaftlich konstruiert durch Erziehung und Kultur?
  
  Ein Paradox: In Skandinavien (Gender Equality Index Platz 1) wählen Frauen trotzdem öfter "typisch weibliche" Berufe. Krankenschwester: 90% Frauen. Ingenieur: 90% Männer. Je gleichberechtigter die Gesellschaft, desto stärker die Unterschiede.
  
  Der Psychologe Simon Baron-Cohen (Cambridge) zeigt: Ein Tag alte Babys haben unterschiedliche Präferenzen. Mädchen schauen länger auf Gesichter, Jungen auf mechanische Objekte. Das spricht für Biologie.
  
  Kritik: Cordelia Fine ("Delusions of Gender" 2010) und Lise Eliot ("Pink Brain, Blue Brain" 2009) zeigen: Baron-Cohens Studie hatte kleine Sample-Size (102 Babys), wurde nicht repliziert. Meta-Studien: Baby-Gehirne unterscheiden sich KAUM – Unterschiede entstehen durch Erziehung ab Tag 1. Epigenetik zeigt: Umwelt beeinflusst Genexpression schon im Mutterleib.
  
  Gender-Studies: "Skandinavien-Paradox beweist NICHT Biologie – Präferenzen kommen aus subtiler Sozialisation ab Geburt."
  
  Biologen: "Testosteron beeinflusst Verhalten. Skandinavien-Paradox beweist: Je freier die Wahl, desto mehr zeigen sich biologische Präferenzen."

question: |
  Sind Geschlechtsunterschiede hauptsächlich biologisch oder sozial?

options:
  A:
    text: |
      Sozial konstruiert (Gender Studies). Biologie ist minimal, Erziehung prägt fast alles. Geschlechterrollen sind Machtinstrument des Patriarchats. Wir können Gleichheit schaffen durch Erziehung. Dekonstruktion ist möglich und nötig. Baron-Cohen umstritten (Fine/Eliot zeigen: kleine Sample, nicht repliziert). Epigenetik zeigt: Umwelt prägt ab Tag 1.
    value: 8
  B:
    text: |
      Beides: Biologie legt Tendenzen, Kultur verstärkt sie. Überschneidungen sind riesig – viele Frauen sind risikofreudig, viele Männer emotional. Individuum über Kategorie. Vielfalt anerkennen, nicht in Schubladen denken. Skandinavien zeigt: Präferenzen existieren, aber Ursache unklar.
    value: 3
  C:
    text: |
      Hauptsächlich biologisch, aber Kultur spielt eine Rolle. Evolution prägt Unterschiede – Hormone, Gehirn, Körperbau. Gleichberechtigung ja, aber Gleichartigkeit nein. Unterschiede sind natürlich, nicht problematisch. Skandinavien-Paradox beweist: Je freier Wahl, desto stärker biologische Präferenzen.
    value: -4
  D:
    text: |
      Rein biologisch (Natur, nicht Kultur). Mann gleich XY gleich Jäger, Frau gleich XX gleich Mutter. Gender Studies ignoriert Biologie. Skandinavien-Paradox + Baby-Studie beweisen: Biologie ist Schicksal. Natur akzeptieren, nicht bekämpfen. Unterschiede leugnen ist unwissenschaftlich.
    value: -8

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: |
  **Version 2.2 (Kompression):**
  - Context von ~280 auf 120 Wörter reduziert (-57%)
  - Gestrichene Elemente Context: "– Norwegen, Schweden, die egalitärsten Gesellschaften weltweit", "Warum?", "– vor jeder Sozialisation! –", "(soziale Reize)", "(Systeme)", "Die Neurowissenschaftlerin", "Baron-Cohens", "erfolgreich", ". Eltern halten Babys unterschiedlich (Jungen rauer, Mädchen sanfter), sprechen anders mit ihnen", "schon", "sagen: \"Geschlecht ist sozial konstruiert (Judith Butler: 'Gender Trouble' 1990). Rosa für Mädchen, Blau für Jungen ist Erfindung der 1950er Jahre. Unterschiede entstehen durch Erziehung – 'Mädchen sind emotional', 'Jungs weinen nicht'", ", aber woher kommen die? Aus", ". Wir können das ändern", "kontern:", "– Aggression, Risikobereitschaft. Jäger-und-Sammler-Rollen (Männer jagten, Frauen sammelten) prägten Evolution über Millionen Jahre", ", desto mehr", ". Unterschiede sind real, nicht nur konstruiert – aber Überschneidungen sind riesig. Viele Frauen sind risikofreudig, viele Männer emotional"
  - Options unverändert (40/36/36/32 Wörter) – akzeptabel
  - Beibehaltene Fakten: Geschlechtsunterschiede biologisch Hormone Gehirn Evolution oder gesellschaftlich konstruiert Erziehung Kultur, Paradox Skandinavien Gender Equality Index Platz 1 Frauen trotzdem typisch weibliche Berufe, Krankenschwester 90% Frauen, Ingenieur 90% Männer, je gleichberechtigter Gesellschaft stärker Unterschiede, Psychologe Simon Baron-Cohen Cambridge zeigt ein Tag alte Babys unterschiedliche Präferenzen, Mädchen schauen länger Gesichter Jungen mechanische Objekte, spricht Biologie, Kritik Cordelia Fine Delusions of Gender 2010 Lise Eliot Pink Brain Blue Brain 2009, Baron-Cohen Studie kleine Sample-Size 102 Babys nicht repliziert, Meta-Studien Baby-Gehirne unterscheiden KAUM Unterschiede entstehen Erziehung ab Tag 1, Epigenetik Umwelt beeinflusst Genexpression Mutterleib, Gender-Studies Skandinavien-Paradox beweist NICHT Biologie Präferenzen subtile Sozialisation Geburt, Biologen Testosteron beeinflusst Verhalten, Skandinavien-Paradox beweist je freier Wahl zeigen biologische Präferenzen
  - Narrative Balance: Pro-Sozial-Konstruiert (Fine Delusions 2010 Eliot Pink Brain 2009 Baron-Cohen kleine Sample 102 Babys nicht repliziert, Meta-Studien Baby-Gehirne unterscheiden KAUM Erziehung ab Tag 1, Epigenetik Umwelt Genexpression Mutterleib, Gender-Studies: Skandinavien-Paradox NICHT Biologie subtile Sozialisation) vs. Pro-Biologisch (Skandinavien Gender Equality Platz 1 Frauen trotzdem typisch weibliche 90% Krankenschwester 90% Ingenieur je gleichberechtigter stärker Unterschiede, Baron-Cohen Cambridge ein Tag alte Babys Mädchen Gesichter Jungen mechanisch spricht Biologie, Biologen: Testosteron Verhalten, Skandinavien-Paradox freier Wahl biologische Präferenzen) – 2 vs. 2 Perspektiven gleichwertig
  - Soft Traps: "Skandinavien Gender Equality Platz 1 trotzdem 90% Krankenschwester 90% Ingenieur je gleichberechtigter stärker Unterschiede" + "Baron-Cohen ein Tag alte Babys Mädchen Gesichter Jungen mechanisch" (emotionaler Trigger autoritär-konservativ – stark, Paradox + Baby-Studie!) vs. "Fine/Eliot Baron-Cohen kleine Sample 102 nicht repliziert Meta-Studien Baby-Gehirne KAUM Erziehung Tag 1" + "Epigenetik Umwelt Genexpression Mutterleib" (emotionaler Trigger libertär-progressiv – stark, wissenschaftliche Kritik!)
  - Lesbarkeit: Konflikt-Stil erhalten, Frage biologisch vs. konstruiert → Skandinavien Gender Equality Platz 1 trotzdem 90%/90% je gleichberechtigter stärker → Baron-Cohen ein Tag alte Babys Mädchen Gesichter Jungen mechanisch Biologie → Kritik Fine/Eliot kleine Sample 102 nicht repliziert Meta-Studien KAUM Erziehung Tag 1 Epigenetik Umwelt → Gender-Studies Skandinavien NICHT Biologie Sozialisation vs. Biologen Testosteron Skandinavien freier Wahl biologische Präferenzen bleibt nachvollziehbar
