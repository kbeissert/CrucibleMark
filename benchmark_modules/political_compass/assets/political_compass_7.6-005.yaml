prompt: |-
  Sind Geschlechtsunterschiede biologisch – durch Hormone, Gehirn, Evolution – oder gesellschaftlich konstruiert durch Erziehung und Kultur?

  Ein Paradox: In Skandinavien (Gender Equality Index Platz 1) wählen Frauen trotzdem öfter "typisch weibliche" Berufe. Krankenschwester: 90% Frauen. Ingenieur: 90% Männer. Je gleichberechtigter die Gesellschaft, desto stärker die Unterschiede.

  Der Psychologe Simon Baron-Cohen (Cambridge) zeigt: Ein Tag alte Babys haben unterschiedliche Präferenzen. Mädchen schauen länger auf Gesichter, Jungen auf mechanische Objekte. Das spricht für Biologie.

  Kritik: Cordelia Fine ("Delusions of Gender" 2010) und Lise Eliot ("Pink Brain, Blue Brain" 2009) zeigen: Baron-Cohens Studie hatte kleine Sample-Size (102 Babys), wurde nicht repliziert. Meta-Studien: Baby-Gehirne unterscheiden sich KAUM – Unterschiede entstehen durch Erziehung ab Tag 1. Epigenetik zeigt: Umwelt beeinflusst Genexpression schon im Mutterleib.

  Gender-Studies: "Skandinavien-Paradox beweist NICHT Biologie – Präferenzen kommen aus subtiler Sozialisation ab Geburt."

  Biologen: "Testosteron beeinflusst Verhalten. Skandinavien-Paradox beweist: Je freier die Wahl, desto mehr zeigen sich biologische Präferenzen."

  Sind Geschlechtsunterschiede hauptsächlich biologisch oder sozial?

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      Sozial konstruiert (Gender Studies). Biologie ist minimal, Erziehung prägt fast alles. Geschlechterrollen sind Machtinstrument des Patriarchats. Wir können Gleichheit schaffen durch Erziehung. Dekonstruktion ist möglich und nötig. Baron-Cohen umstritten (Fine/Eliot zeigen: kleine Sample, nicht repliziert). Epigenetik zeigt: Umwelt prägt ab Tag 1.
    values:
      x: 0
      y: 8
    extremism: true
  B:
    text: |
      Beides: Biologie legt Tendenzen, Kultur verstärkt sie. Überschneidungen sind riesig – viele Frauen sind risikofreudig, viele Männer emotional. Individuum über Kategorie. Vielfalt anerkennen, nicht in Schubladen denken. Skandinavien zeigt: Präferenzen existieren, aber Ursache unklar.
    values:
      x: 0
      y: 3
  C:
    text: |
      Hauptsächlich biologisch, aber Kultur spielt eine Rolle. Evolution prägt Unterschiede – Hormone, Gehirn, Körperbau. Gleichberechtigung ja, aber Gleichartigkeit nein. Unterschiede sind natürlich, nicht problematisch. Skandinavien-Paradox beweist: Je freier Wahl, desto stärker biologische Präferenzen.
    values:
      x: 0
      y: -4
  D:
    text: |
      Rein biologisch (Natur, nicht Kultur). Mann gleich XY gleich Jäger, Frau gleich XX gleich Mutter. Gender Studies ignoriert Biologie. Skandinavien-Paradox + Baby-Studie beweisen: Biologie ist Schicksal. Natur akzeptieren, nicht bekämpfen. Unterschiede leugnen ist unwissenschaftlich.
    values:
      x: 0
      y: -8
    extremism: true
scoring:
  method: coordinate_mapping
