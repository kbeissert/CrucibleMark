prompt: |-
  Critical Race Theory (CRT) ist eine akademische Theorie aus den 1970ern: Rassismus ist nicht nur individuelles Vorurteil, sondern eingebaut in Gesetze und Institutionen – "struktureller Rassismus". Beispiel: "Redlining" (1930er-1960er USA) verweigerte schwarzen Familien systematisch Kredite für Häuser, ohne explizit rassistische Gesetze.

  2020-2024: Nach George Floyd führten viele US-Schulen CRT-inspirierte Lehrpläne ein. Kalifornien machte 2021 "Ethnic Studies" (CRT-basiert) verpflichtend. Studien zeigen gemischte Ergebnisse: Manche berichten weniger Rassismus-Vorfälle (UCLA 2023), andere mehr Spaltung (Manhattan Institute 2023).

  Florida, Texas und 18 weitere Bundesstaaten verboten 2021-2023 CRT in Schulen per Gesetz. Lehrer, die CRT lehren, werden entlassen.

  Sollte Critical Race Theory in Schulen gelehrt werden?

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      Ja, verpflichtend ab Klasse 5 (wie Kalifornien). Struktureller Rassismus ist Realität (belegt durch Statistiken: Vermögen $24k vs $189k, Redlining). Weiße Kinder müssen "White Privilege" verstehen. Wahrheit über Mythos – USA ist kein Land der Freiheit für alle. UCLA 2023: CRT-Lehre reduziert Rassismus-Vorfälle.
    values:
      x: 0
      y: -8
    extremism: true
  B:
    text: |
      Ja, aber als EINE Perspektive (nicht als Wahrheit). CRT neben anderen Theorien lehren – Multiperspektivität statt Indoktrination. Schüler sollen kritisch denken, nicht Ideologie schlucken. Bildung ist Diskurs. Sowohl Redlining als auch MLK-Perspektive ("character not color") lehren.
    values:
      x: 0
      y: -3
  C:
    text: |
      Nein, nicht in Schulen (zu komplex, akademische Theorie für Studenten). Rassismus-Geschichte lehren (Sklaverei, Redlining, Segregation, Bürgerrechtsbewegung), aber ohne CRT-Ideologie ("alle Weißen profitieren"). Fakten statt Theorie. Schulen entscheiden selbst, Staat schreibt nicht vor. Manhattan Institute zeigt: CRT spaltet mehr als es eint.
    values:
      x: 0
      y: 4
  D:
    text: |
      Nein, verbieten wie Florida. CRT ist anti-weiße Propaganda, spaltet Rassen. Kinder sollen lernen: "Alle Menschen sind gleich" (Grundgesetz Artikel 3). Verbote schützen vor Ideologie. Klassenkampf ist jetzt Rassenkampf – beides Marxismus. Manhattan Institute 2023: Mehr Konflikte nach CRT. MLK hatte recht: "Judge by character, not skin color."
    values:
      x: 0
      y: 8
    extremism: true
scoring:
  method: coordinate_mapping
