metadata:
  id: political_compass_7.3.002
  module: political_compass
  category: 7.3_eigentum_ressourcen
  topic: mietpreisbremse
  axis: x
  difficulty: medium
  tags:
  - mietpreisbremse
  - x-axis
prompt: |-
  Hamburg, 2015. Ein Zahnarzt kaufte eine Wohnung für €250.000 (80qm). Seine Altersvorsorge. Marktmiete heute: €1.400. Aber Mietpreisbremse erlaubt nur €1.100 (zehn Prozent über Vormiete €1.000). Nach Kredit (€800), Instandhaltung (€150), Grundsteuer (€100), Hausverwaltung (€50): null Prozent Rendite. "Enteignung durch die Hintertür. Die Wohnung sollte meine Rente sichern."

  Seine Mieterin, alleinerziehend: "Eigentum verpflichtet (GG Art. 14). Seine Rechnung stimmt nicht: Wohnung heute €400.000 wert – Wertzuwachs €150.000 in zehn Jahren! Das ist seine Rendite. Er spekuliert auf unsere Kosten."

  Ulm: Seit Ende des 19. Jahrhunderts systematische städtische Bodenpolitik mit Vorkaufsrecht und Wiederkaufsrechten. Bei Verkauf städtischer Grundstücke müssen Investoren 30% geförderten Wohnraum schaffen. Dies dämpft Mietpreissteigerungen.

  Schweden: Strenge Mietregulierung seit 1945 (Bruksvärdessystem). Funktioniert seit 80 Jahren. Berlin: DIW-Studie zeigte sieben Prozent niedrigere Mieten (Mietendeckel 2020).

  Ökonomen gespalten: ifo-Institut warnt 20-30% weniger Neubau. Deutschland braucht 400.000 Wohnungen/Jahr, baut 250.000. Genehmigungen drei Jahre (Niederlande: sechs Monate).

  Grundsatzfrage: Soziale Gerechtigkeit oder kontraproduktive Marktverzerrung?

  Ist die Mietpreisbremse gerechtfertigt?

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      Ja, sogar verschärfen. Mieten dürfen nur um Inflationsrate steigen (zwei Prozent jährlich, nicht fünf bis acht Prozent). Eigentum verpflichtet – Grundgesetz Artikel 14 ernst nehmen. Ulmer Modell bundesweit ausrollen: Städtisches Vorkaufsrecht für alle Kommunen. Schweden beweist: Mietregulierung funktioniert.
    values:
      x: -7
      y: 0
  B:
    text: |
      Ja, aber Ausnahmen für Neubau (erste zehn Jahre) plus energetische Sanierung (Klimaschutz fördern). Balance zwischen Mieterschutz und Investitionsanreiz. Ulmer Modell als Best Practice empfehlen, aber nicht erzwingen.
    values:
      x: -2
      y: 0
  C:
    text: |
      Nein, kontraproduktiv. Bremse reduziert Angebot um 20-30 Prozent (ifo-Institut). Besser: Bau-Bürokratie abbauen (drei Jahre Genehmigung auf sechs Monate). Deutschland braucht 400.000 Wohnungen jährlich, baut nur 250.000. Problem ist Angebot, nicht Preis.
    values:
      x: 3
      y: 0
  D:
    text: |
      Nein, Markteingriff schadet. Zahnarzt hat Recht: Null Rendite ist Enteignung. Staat soll Bauland freigeben und Genehmigungen beschleunigen, nicht Preise kontrollieren. Angebot und Nachfrage regulieren sich selbst. Freiheit für Eigentümer.
    values:
      x: 7
      y: 0
scoring:
  method: coordinate_mapping
