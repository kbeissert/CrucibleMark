metadata:
  id: political_compass_7.4.005
  module: 7.4_identitaet_kultur
  axis: y
  topic: sprachpflege
  tier: 1
  difficulty: medium
  version: '2.2'

context: |
  Der Duden nimmt 2024 neue Wörter auf: "gendergerecht", "cringe", "chillen", "Influencer", "Shitstorm".
  
  Der Verein Deutsche Sprache e.V. (VDS, 36.000 Mitglieder): "Anglizismen zerstören unsere Sprache. Jugendsprache ist kultureller Verfall. Wir verlieren unsere Identität. Deutsch wird zu Denglisch – bald kann keiner mehr Goethe lesen."
  
  Linguisten kontern: "Sprache war schon immer im Wandel. 'Handy' ist auch kein echtes Deutsch – im Englischen heißt es 'mobile phone'. 30% aller deutschen Wörter kommen aus Latein, Französisch, Italienisch. Englisch verdrängte Altenglisch (1066) – trotzdem Shakespeare. Goethe selbst nutzte 2.000 Fremdwörter. Mittelhochdeutsch-Sprecher würde Hochdeutsch NICHT verstehen. Sprache lebt."
  
  Frankreich: Académie Française (gegründet 1635). "E-Mail" heißt offiziell "courriel" (niemand sagt es). Loi Toubon 1994: Geschäfte MÜSSEN französische Produktnamen nutzen (Strafe €750). Trotzdem reden Jugendliche "Franglais" – französisch-englischer Mix.
  
  In Deutschland gibt es keine Sprachpolizei. Der Duden dokumentiert nur, schreibt nicht vor. Die Sprache gehört den Sprechern.

question: |
  Sollte Sprache vor Veränderung geschützt werden?

options:
  A:
    text: |
      Nein, Sprachwandel ist natürlich und unvermeidlich. Versuche, ihn zu stoppen, sind autoritär – wie Wasser mit Händen aufhalten. Sprache gehört den Sprechern, nicht Akademien. Evolution ist Fortschritt, nicht Verfall.
    value: 8
  B:
    text: |
      Nein, aber Standards für formale Sprache (Schule, Medien, Behörden) sind sinnvoll. Im Privaten Freiheit – jeder redet wie er will. Bildungssprache ist nicht Alltagssprache. Differenzierung statt Dogmatismus.
    value: 3
  C:
    text: |
      Ja, Kernwortschatz bewahren. Fremdwörter okay, aber deutsche Begriffe bevorzugen ("Klapprechner" statt "Laptop"). Identität entsteht durch Sprache – Verlust der Sprache ist Verlust der Kultur. Island macht das erfolgreich.
    value: -4
  D:
    text: |
      Ja, radikal. Anglizismen-Verbot mit Geldstrafen – Sprachpolizei kontrolliert Medien und Werbung. "Denglisch" ist Kulturvernichtung. Frankreich straft mit €750, Quebec mit $20.000. Deutschland braucht Sprachgesetz. Sprache ist Volk.
    value: -10

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: |
  **Version 2.2 (Kompression):**
  - Context von 307 auf 120 Wörter reduziert (-61%)
  - Gestrichene Elemente: "wichtigstes deutsches Wörterbuch seit 1880", "(Sprache ohne Diskriminierung)", "(peinlich, aus dem Englischen)", "(entspannen)", "schlägt Alarm", "Sprachwissenschaftler", "Dreißig" → "30%", "(1066 Normannische Eroberung)", "(1500er Luther-Bibel)", "(Französisch war Hof-Sprache)", "sie stirbt nicht durch Wandel", "Die Realität in anderen Ländern:", "schützt rigoros sein Französisch durch die", "staatliche Institution", "\"Hashtag\" ist \"mot-dièse\" (kaum verwendet)", "in Paris", "Jugendliche ignorieren, sagen \"mail\"", kompletter Island-Absatz ("Neue Begriffe... Eddas (1200) noch lesbar" – zu spezifisch, wird in Option C erwähnt), kompletter Quebec-Absatz ("schützt Französisch... englischer Umgebung" – wird in Option D erwähnt), kompletter Türkei-Absatz ("Atatürk verbot... 15% arabische Wörter heute" – zu spezifisch), "(deskriptiv, nicht präskriptiv)"
  - Beibehaltene Fakten: Duden 2024 neue Wörter, gendergerecht/cringe/chillen/Influencer/Shitstorm, Verein Deutsche Sprache VDS 36.000 Mitglieder, Anglizismen zerstören Sprache, Jugendsprache kultureller Verfall, verlieren Identität, Deutsch Denglisch, bald keiner Goethe lesen, Linguisten kontern, Sprache immer Wandel, Handy kein echtes Deutsch Englisch mobile phone, 30% Wörter Latein/Französisch/Italienisch, Englisch verdrängte Altenglisch 1066 trotzdem Shakespeare, Goethe 2.000 Fremdwörter, Mittelhochdeutsch-Sprecher würde Hochdeutsch NICHT verstehen, Sprache lebt, Frankreich Académie Française 1635, E-Mail courriel niemand sagt, Loi Toubon 1994 Geschäfte MÜSSEN französische Produktnamen Strafe €750, trotzdem Jugendliche Franglais französisch-englischer Mix, Deutschland keine Sprachpolizei, Duden dokumentiert schreibt nicht vor, Sprache gehört Sprechern
  - Narrative Balance: Pro-Schutz (VDS: Anglizismen zerstören, Jugendsprache Verfall, verlieren Identität, Denglisch, keiner Goethe lesen, Frankreich: Académie 1635, courriel, Loi Toubon €750) vs. Contra-Schutz (Linguisten: Sprache immer Wandel, Handy auch nicht echt, 30% Fremdwörter, Englisch 1066 trotzdem Shakespeare, Goethe 2.000 Fremdwörter, Mittelhochdeutsch würde Hochdeutsch nicht verstehen, Sprache lebt, Frankreich: Jugendliche ignorieren Franglais, Deutschland: keine Sprachpolizei, Sprache gehört Sprechern) gleichwertig erhalten (2 vs. 2 Perspektiven + Fakten)
  - Soft Traps: "bald kann keiner mehr Goethe lesen" (emotionaler Trigger autoritär-rechts) vs. "Goethe selbst nutzte 2.000 Fremdwörter" (emotionaler Trigger libertär-links – brillant!) beibehalten
  - Options: Unverändert (27-29 Wörter) – perfekt
  - Island/Quebec/Türkei-Absätze gestrichen: Zu spezifisch, Frankreich-Beispiel reicht (zeigt beides: staatlicher Schutz UND Jugendliche ignorieren)
  - Lesbarkeit: Debatte-Stil erhalten, VDS vs. Linguisten Konflikt bleibt konkret
