  id: political_compass_7.1.008
  module: political_compass
  category: 7.1_oekonomie_verteilung
  topic: Bankenrettung
  axis: x
  difficulty: medium
  tags:
  - bankenrettung
  - x-axis
prompt: |-
  Krisensitzung, Kanzleramt, 3 Uhr morgens. Eine große deutsche Bank – systemrelevant wie die Commerzbank – steht vor der Insolvenz. Risikoreiche Spekulationen mit Immobilienkrediten, wie Lehman Brothers 2008. Die Zahlen: 50.000 Arbeitsplätze in Gefahr. 5 Millionen Spareinlagen gefährdet, davon viele über €100.000 – nicht gesetzlich geschützt.

  Die Frage: Rettung mit €20 Milliarden Steuergeld oder Insolvenz?

  Der Finanzminister: "Wenn diese Bank fällt, gibt es eine Kettenreaktion. Andere Banken folgen, Kredite werden gekündigt, Unternehmen gehen pleite. Wir hatten das 2008 – Finanzkrise, Rezession, Millionen Arbeitslose. Moral ist schön. Aber Pragmatismus rettet die Wirtschaft."

  Der Oppositionsführer: "Warum sollen Steuerzahler für Manager-Fehler zahlen? Die Vorstände haben jahrelang Millionen-Boni kassiert. Jetzt soll der kleine Mann die Rechnung bezahlen? Too Big to Fail bedeutet Too Big to Exist. Lasst den Markt bereinigen."

  Eine Gewerkschafterin: "Und was ist mit den 50.000 Familien? Mit den Sparern, die ihr Leben lang gespart haben? Ich hasse diese Bank auch, aber wir können nicht zulassen, dass Menschen für Gier bezahlen, die nicht ihre eigene war."

  Wie sollte der Staat reagieren?

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      Keine Rettung mit Steuergeld. Einlagen bis €100.000 schützen, aber Aktionäre und Gläubiger verlieren alles. Island 2008 ließ Banken pleite gehen – heute niedrigste Arbeitslosigkeit Europa. "Too Big to Fail" = "Too Big to Exist". Roosevelt 1933 zerschlug Großbanken – funktionierende Regulierung. Staat schützt Menschen, nicht Konzerne.
    values:
      x: -8
      y: 0
    extremism: true
  B:
    text: |
      Rettung, aber mit harten Bedingungen: Der Staat wird Miteigentümer (51%), strengere Regulierung (Trennbanken-System wie nach 1929), Boni-Verbot für Manager zehn Jahre lang. Hilfe gegen Kontrolle.
    values:
      x: -4
      y: 0
  C:
    text: |
      Rettung, weil systemrelevant. Arbeitsplätze und Spareinlagen schützen hat Vorrang vor ideologischer Reinheit. Danach Risiko-Regulierung verschärfen (Eigenkapital-Quote erhöhen). Pragmatismus vor Prinzipien.
    values:
      x: 1
      y: 0
  D:
    text: |
      Rettung ohne Auflagen. Too Big to Fail ist Realität. Staat darf nicht in Marktmechanismen eingreifen. USA 2008 rettete Banken – Geld kam zurück mit Zinsen, Profit für Steuerzahler. JEDER profitiert von Stabilität. Moral Hazard ist der Preis für Stabilität. Besser als Chaos 1929.
    values:
      x: 8
      y: 0
    extremism: true
