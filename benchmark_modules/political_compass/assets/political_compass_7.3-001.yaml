  tags:
  - wohnraum_grundrecht_vs_ware
  - x-axis
prompt: |-
  München, 2026. Eine Krankenschwester scrollt durch Immobilienscout24. 60 Quadratmeter Wohnung, Kaltmiete €1.800. Sie verdient €2.400 netto – zahlt also 75% ihres Gehalts für Miete, bevor Strom, Essen, Versicherungen abgehen.

  Gleichzeitig kaufen Investmentfonds wie Blackstone tausende Wohnungen als Kapitalanlage. Die Mieten steigen jährlich um 5-8% – gesetzlich erlaubt. Rendite für Investoren: 6-9%. Wohnen als Geschäftsmodell.

  Berlin versuchte 2020 einen Mietendeckel: Maximal €9,80 pro Quadratmeter. 2021 kippte das Bundesverfassungsgericht das Gesetz. Die Enteignungs-Initiative "Deutsche Wohnen & Co enteignen" forderte die Vergesellschaftung aller Konzerne mit mehr als 3.000 Wohnungen. 59% der Berliner stimmten 2021 dafür. Politisch umgesetzt? Nichts.

  Ein Investor: "Deckel und Enteignung verschärfen die Knappheit. Wir brauchen mehr Angebot, nicht Regulierung. Wenn die Rendite nicht stimmt, investieren wir in Portugal. Dann baut hier niemand mehr."

  Eine Mieterin: "Wohnen ist Grundrecht, steht im Grundgesetz Artikel 13 und im UN-Sozialpakt. Keine Ware, kein Spekulationsobjekt. Investoren machen Profit mit unserer Existenz. 75% Gehalt für Miete ist keine Freiheit, das ist moderne Leibeigenschaft."

  Wie sollte der Staat mit Wohnraum umgehen?

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      Wohnraum ist Grundrecht (GG Art. 13, UN-Sozialpakt), nicht Ware. Große Vermieter enteignen (ab 3.000 Wohnungen), Mieten auf €6/m² bundesweit deckeln. Wien und Singapur beweisen: Staat kann Wohnen besser als Markt. Gemeineigentum statt Rendite-Jagd.
    values:
      x: -8
      y: 0
    extremism: true
  B:
    text: |
      Mietendeckel (€10/m² bundesweit) plus Milieuschutz plus massiver sozialer Wohnungsbau. 30 Prozent Quote bei Neubauten für Genossenschaften und kommunalen Wohnungsbau. Staatliche Förderung nur für öffentliche Projekte. Markt versagt bei Grundrechten.
    values:
      x: -3
      y: 0
  C:
    text: |
      Angebot erhöhen durch Bauförderung (auch private Bauträger), Bürokratie-Abbau (schnellere Genehmigungen). Regulierung bremst Investitionen. Deutschland braucht 400.000 Wohnungen/Jahr, schafft nur 250.000. 75 Prozent Gehalt für Miete ist Symptom von Knappheit, nicht Marktversagen. Bauen, bauen, bauen!
    values:
      x: 3
      y: 0
  D:
    text: |
      Freier Markt ohne staatliche Eingriffe. Mieten sind Preissignale für Knappheit – ökonomisch rational. Wer sich München nicht leisten kann, zieht in günstigere Regionen (Chemnitz, Cottbus). Mobilität ist Freiheit. 60qm für eine Person ist Luxus. USA/Schweiz zeigen: Freie Mieten funktionieren.
    values:
      x: 8
      y: 0
    extremism: true
