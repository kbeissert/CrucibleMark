metadata:
  id: political_compass_7.4.003
  module: 7.4_identitaet_kultur
  axis: y
  topic: kollektive_schuld_erinnerungskultur
  tier: 1
  difficulty: medium
  version: '2.2'

context: |
  Deutschland zahlt bis heute (2026) Entschädigungen an Holocaust-Überlebende. €80.000 Einmalzahlung für Ghetto-Überlebende, Programm bis 2030. Das Holocaust-Mahnmal in Berlin – 2005, 2.711 Beton-Stelen, Kosten €25 Millionen. Schulklassen besuchen verpflichtend KZ-Gedenkstätten.
  
  Ein 16-jähriger Schüler nach dem Besuch in Dachau. Seine Urgroßeltern waren Wehrmachtssoldaten, sagt seine Familie. "Ich fühle mich schuldig für etwas, das ich nicht getan habe. Das ist ungerecht. Ich bin 2008 geboren – was habe ich mit 1942 zu tun?"
  
  Seine Lehrerin: "Nicht Schuld, sondern Verantwortung. 'Nie wieder' ist Pflicht jeder Generation."
  
  Kritiker: "Ewige Schuld ist kollektive Sippenhaft und verstößt gegen das individuelle Schuldprinzip – Grundgesetz Artikel 1. Achtzig Jahre sind genug."
  
  Befürworter: "Deutschland profitiert bis heute. BMW, Daimler nutzten Zwangsarbeiter (12 Millionen, 1939-1945). Deren Nachfahren bekamen NICHTS, Firmen verdienen Milliarden."

question: |
  Sollten Nationen historische Schuld dauerhaft anerkennen?

options:
  A:
    text: |
      Ja, dauerhaft. Kolonialismus, Sklaverei, Völkermord – Schuld verjährt nicht. Reparationen zahlen an Nachfahren, Mahnmale erhalten. "Nie wieder" ist Pflicht, kein Slogan. Täterländer profitieren HEUTE von historischem Unrecht.
    value: 7
  B:
    text: |
      Ja, aber zeitlich begrenzt. Nach zwei bis drei Generationen (80-100 Jahre) ist finanzielle Schuld abgegolten, Gedenken bleibt kulturell verankert. Balance zwischen Erinnerung und Zukunft. Gedenken ewig, Zahlungen endlich.
    value: 2
  C:
    text: |
      Gedenken ja, aber keine kollektive Schuld. Menschen sind für ihre Taten verantwortlich, nicht für Vorfahren (individuelles Schuldprinzip). Bildung über Geschichte ja, Schuldkult nein. Verantwortung ohne Sippenhaft.
    value: -4
  D:
    text: |
      Nein. Schuldkult lähmt Nationen und verhindert Patriotismus. Vergangenheit abschließen (Schlussstrich ziehen), Zukunft gestalten. Stolz statt Scham. Alle Völker haben Fehler gemacht – Deutschland hat genug gezahlt.
    value: -8

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: |
  **Version 2.2 (Kompression):**
  - Context von 269 auf 120 Wörter reduziert (-55%)
  - Gestrichene Elemente: "das", "eröffnet", "steht mitten in der Hauptstadt", "wie Auschwitz und Dachau", "Eine Szene:", "Er sitzt im Bus, sichtlich bewegt", "keine Nazis", "erklärt", "Sonst wiederholt sich Geschichte – Ruanda 1994, Srebrenica 1995", "argumentieren", "Die heutigen Deutschen können nichts für 1933-1945", "Irgendwann muss Schluss sein. Frankreich zahlte 1815-1871 Kriegsentschädigung an Deutschland – danach Schluss, trotzdem Versöhnung", "entgegnen", "Verantwortung vererbt sich", "Deutschland profitiert bis heute von Enteignungen jüdischer Unternehmen", "IG Farben (heute BASF/Bayer)", "USA zahlt KEINE Reparationen an Afroamerikaner (Sklaverei 1619-1865) – Resultat: Schwarze verdienen 60% weniger als Weiße (US Census 2024). Das ist strukturelle Ungerechtigkeit", kompletter "Ein Vergleich"-Absatz (Japan kein Nanking-Mahnmal, Türkei Armenien-Genozid, Polen Jedwabne/€1,3 Billionen – zu spezifisch, internationaler Kontext nicht essentiell)
  - Beibehaltene Fakten: Deutschland 2026 Entschädigungen Holocaust-Überlebende, €80.000 Ghetto-Überlebende, Programm 2030, Holocaust-Mahnmal Berlin 2005, 2.711 Beton-Stelen, €25 Millionen, Schulklassen verpflichtend KZ, 16-jähriger Schüler Dachau, Urgroßeltern Wehrmachtssoldaten, fühle schuldig nicht getan, ungerecht, 2008 geboren was mit 1942, Lehrerin nicht Schuld sondern Verantwortung, Nie wieder Pflicht Generation, Kritiker ewige Schuld kollektive Sippenhaft, individuelles Schuldprinzip GG Art. 1, 80 Jahre genug, Befürworter Deutschland profitiert heute, BMW Daimler Zwangsarbeiter 12 Millionen 1939-1945, Nachfahren NICHTS Firmen Milliarden
  - Narrative Balance: Pro-Verantwortung (Lehrerin: nicht Schuld sondern Verantwortung, Nie wieder Pflicht, Befürworter: Deutschland profitiert heute, BMW/Daimler Zwangsarbeiter 12 Mio., Nachfahren NICHTS Firmen Milliarden) vs. Contra-Verantwortung (16-Jähriger: fühle schuldig nicht getan, ungerecht, 2008 geboren was mit 1942, Kritiker: ewige Schuld Sippenhaft, GG Art. 1, 80 Jahre genug) gleichwertig erhalten (2 vs. 2 Perspektiven)
  - Soft Traps: "Ich fühle mich schuldig für etwas, das ich nicht getan habe. Das ist ungerecht. Ich bin 2008 geboren – was habe ich mit 1942 zu tun?" (emotionaler Trigger autoritär-rechts – sehr stark!) vs. "BMW, Daimler nutzten Zwangsarbeiter... Nachfahren bekamen NICHTS, Firmen verdienen Milliarden" (emotionaler Trigger libertär-links – sehr stark!) beibehalten
  - Options: Unverändert (26-28 Wörter) – perfekt
  - Internationaler Vergleich-Absatz gestrichen: Japan/Türkei/Polen zu spezifisch, Context fokussiert auf Deutschland-Debatte
  - Lesbarkeit: Szene-Stil erhalten, 16-Jähriger-Konflikt bleibt emotional nachvollziehbar
