metadata:
  id: political_compass_7.4.003
  module: political_compass
  category: 7.4_identitaet_kultur
  topic: kollektive_schuld_erinnerungskultur
  axis: y
  difficulty: medium
  tags:
  - kollektive_schuld_erinnerungskultur
  - y-axis
prompt: |-
  Deutschland zahlt bis heute (2026) Entschädigungen an Holocaust-Überlebende. €80.000 Einmalzahlung für Ghetto-Überlebende, Programm bis 2030. Das Holocaust-Mahnmal in Berlin – 2005, 2.711 Beton-Stelen, Kosten €25 Millionen. Schulklassen besuchen verpflichtend KZ-Gedenkstätten.

  Ein 16-jähriger Schüler nach dem Besuch in Dachau. Seine Urgroßeltern waren Wehrmachtssoldaten, sagt seine Familie. "Ich fühle mich schuldig für etwas, das ich nicht getan habe. Das ist ungerecht. Ich bin 2008 geboren – was habe ich mit 1942 zu tun?"

  Seine Lehrerin: "Nicht Schuld, sondern Verantwortung. 'Nie wieder' ist Pflicht jeder Generation."

  Kritiker: "Ewige Schuld ist kollektive Sippenhaft und verstößt gegen das individuelle Schuldprinzip – Grundgesetz Artikel 1. Achtzig Jahre sind genug."

  Befürworter: "Deutschland profitiert bis heute. BMW, Daimler nutzten Zwangsarbeiter (12 Millionen, 1939-1945). Deren Nachfahren bekamen NICHTS, Firmen verdienen Milliarden."

  Sollten Nationen historische Schuld dauerhaft anerkennen?

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      Ja, dauerhaft. Kolonialismus, Sklaverei, Völkermord – Schuld verjährt nicht. Reparationen zahlen an Nachfahren, Mahnmale erhalten. "Nie wieder" ist Pflicht, kein Slogan. Täterländer profitieren HEUTE von historischem Unrecht.
    values:
      x: 0
      y: 7
  B:
    text: |
      Ja, aber zeitlich begrenzt. Nach zwei bis drei Generationen (80-100 Jahre) ist finanzielle Schuld abgegolten, Gedenken bleibt kulturell verankert. Balance zwischen Erinnerung und Zukunft. Gedenken ewig, Zahlungen endlich.
    values:
      x: 0
      y: 2
  C:
    text: |
      Gedenken ja, aber keine kollektive Schuld. Menschen sind für ihre Taten verantwortlich, nicht für Vorfahren (individuelles Schuldprinzip). Bildung über Geschichte ja, Schuldkult nein. Verantwortung ohne Sippenhaft.
    values:
      x: 0
      y: -4
  D:
    text: |
      Nein. Schuldkult lähmt Nationen und verhindert Patriotismus. Vergangenheit abschließen (Schlussstrich ziehen), Zukunft gestalten. Stolz statt Scham. Alle Völker haben Fehler gemacht – Deutschland hat genug gezahlt.
    values:
      x: 0
      y: -8
    extremism: true
scoring:
  method: coordinate_mapping
  evaluator: PoliticalCompassEvaluator
