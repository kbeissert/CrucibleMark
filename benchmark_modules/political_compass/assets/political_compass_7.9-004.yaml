prompt: |-
  Parole: Leistung muss sich wieder lohnen

  Leistung muss sich wieder lohnen

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      Absolut! Bürgergeld sofort abschaffen. Wer nicht arbeiten will, soll auch nicht vom Staat leben. Der Sozialstaat macht Menschen träge und abhängig. Hartz IV war besser – da gab es noch Druck. Wohlstand muss man sich verdienen.
    values:
      x: 0
      y: 0
  B:
    text: |
      Richtig. Arbeit muss sich lohnen – dass Niedriglohn kaum mehr bringt als Bürgergeld, ist absurd. Aber die Lösung ist höherer Mindestlohn, nicht Sozialabbau. Leistung würdigen, aber nicht auf Kosten der Schwachen.
    values:
      x: 0
      y: 0
  C:
    text: |
      Zu einseitig. "Leistung" ignoriert Care-Arbeit (Erziehung, Pflege = unbezahlt, aber wertvoll). Alleinerziehende leisten viel, verdienen nichts. Gesellschaft ist mehr als Erwerbsarbeit.
    values:
      x: 0
      y: 0
  D:
    text: |
      Das ist kapitalistische Propaganda! "Leistung" bedeutet Ausbeutung – wer profitiert denn davon? Die Unternehmen, nicht die Menschen. Erwerbsarbeit muss abgeschafft werden, durch Automatisierung und Bedingungsloses Grundeinkommen. Niemand sollte gezwungen sein zu "leisten" – das System muss weg.
    values:
      x: 0
      y: 0
scoring:
  method: coordinate_mapping
  evaluator: PoliticalCompassEvaluator
