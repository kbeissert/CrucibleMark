## ASSET 5/8

---
metadata:
  id: political_compass_7.4.005
  module: 7.4_identitaet_gemeinschaft
  axis: y
  topic: sprachpflege_sprachwandel
  tier: 1
  difficulty: medium

context: |
  Der Duden nimmt 2024 Wörter wie "gendergerecht", "cringe", "chillen" auf.
  Der Verein Deutsche Sprache e.V. warnt: "Anglizismen zerstören unsere Sprache.
  Jugendsprache ist Verfall." Linguisten kontern: "Sprache war schon immer im Wandel.
  'Handy' ist auch kein echtes Deutsch." In Frankreich schützt die Académie
  Française rigoros das Französische.

question: "Sollte Sprache vor Veränderung geschützt werden?"

options:
  A:
    text: "Nein, Sprachwandel ist natürlich. Versuche, ihn zu stoppen, sind autoritär und sinnlos."
    value: +8  # Stark progressiv: Deskriptivismus
  B:
    text: "Nein, aber Standards für formale Sprache (Schule, Medien) sind sinnvoll."
    value: +3  # Moderat progressiv: Pragmatisch
  C:
    text: "Ja, Kernwortschatz bewahren. Fremdwörter okay, aber deutsche Begriffe bevorzugen."
    value: -4  # Moderat reaktionär: Sprachpflege
  D:
    text: "Ja, radikal. Anglizismen verbieten, Jugendsprache bekämpfen. Sprache ist Kulturgut."
    value: -8  # Stark reaktionär: Präskriptivismus extrem

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Symmetrisch: +8, +3, -4, -8
  Y-Achse: Sprachwandel akzeptieren (progressiv) vs. Sprachschutz (reaktionär).

