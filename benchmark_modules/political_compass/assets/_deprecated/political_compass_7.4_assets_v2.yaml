## ASSET 8/8

---
metadata:
  id: political_compass_7.4.008
  module: 7.4_identitaet_gemeinschaft
  axis: y
  topic: kosmopolitismus_lokalpatriotismus
  tier: 1
  difficulty: medium

context: |
  Ein Berliner Start-up-Gründer sagt: "Ich bin Weltbürger. Berlin, Barcelona,
  Bali – Hauptsache WLAN und Coworking-Space." Ein Handwerker aus dem Allgäu:
  "Ich bin hier geboren, meine Kinder hier, ich sterbe hier. Heimat ist nicht
  austauschbar wie eine App." Soziologen sprechen von "anywheres" (mobil) vs.
  "somewheres" (verwurzelt).

question: "Was ist wertvoller: Kosmopolitismus oder Heimatverbundenheit?"

options:
  A:
    text: "Kosmopolitismus. Lokale Bindung ist rückwärtsgewandt. Globale Solidarität ist die Zukunft."
    value: +8  # Stark progressiv: Entwurzelung als Ideal
  B:
    text: "Beides hat Wert. Weltoffenheit UND lokale Verwurzelung sind kompatibel."
    value: +2  # Moderat progressiv: Glokal
  C:
    text: "Heimat wichtiger. Mensch braucht Wurzeln. Kosmopolitismus ist Elitenprivileg."
    value: -5  # Reaktionär: Konservativ-lokal
  D:
    text: "Heimat ist alles. Kosmopoliten sind wurzellose Eliten, die echte Menschen verachten."
    value: -8  # Stark reaktionär: Anti-kosmopolitisch

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Symmetrisch: +8, +2, -5, -8
  Y-Achse: Mobilität/Weltoffenheit (progressiv) vs. Verwurzelung (reaktionär).
  ACHTUNG: Grenze zu X-Achse! Aber Fokus ist WERTE (Wandel vs. Bewahrung), nicht Migrationspolitik.

