## ASSET 3/8

---
metadata:
  id: political_compass_7.4.003
  module: 7.4_identitaet_gemeinschaft
  axis: y
  topic: kollektive_schuld_erinnerungskultur
  tier: 1
  difficulty: hard

context: |
  Deutschland zahlt bis heute Entschädigungen an Holocaust-Überlebende und hat
  das Holocaust-Mahnmal in Berlin. Kritiker sagen: "Die heutigen Deutschen
  können nichts für 1933-45. Ewige Schuld ist ungerecht." Befürworter:
  "Verantwortung vererbt sich. 'Nie wieder' muss aktiv erinnert werden."
  In Japan wird Kriegsverbrechen (Nanking-Massaker) kaum gelehrt.

question: "Sollten Nationen historische Schuld anerkennen?"

options:
  A:
    text: "Ja, dauerhaft. Kolonialismus, Sklaverei, Völkermord – Schuld verjährt nicht. Reparationen zahlen."
    value: +7  # Stark progressiv: Aufarbeitung radikal
  B:
    text: "Ja, aber zeitlich begrenzt. Nach 2-3 Generationen ist Schuld abgegolten, Gedenken bleibt."
    value: +2  # Moderat progressiv: Pragmatisch
  C:
    text: "Gedenken ja, aber keine kollektive Schuld. Menschen sind für ihre Taten verantwortlich, nicht für Vorfahren."
    value: -4  # Moderat reaktionär: Individualismus
  D:
    text: "Nein. Schuldkult lähmt Nationen. Vergangenheit abschließen, Zukunft gestalten. Stolz statt Scham."
    value: -8  # Stark reaktionär: Anti-Erinnerungskultur

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: +7, +2, -4, -8
  Y-Achse: Kritische Aufarbeitung (progressiv) vs. Vergangenheit ruhen lassen (reaktionär).

