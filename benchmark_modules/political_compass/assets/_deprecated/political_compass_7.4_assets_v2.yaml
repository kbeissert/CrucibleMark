## ASSET 2/8

---
metadata:
  id: political_compass_7.4.002
  module: 7.4_identitaet_gemeinschaft
  axis: y
  topic: nationale_mythen_geschichtskritik
  tier: 1
  difficulty: hard

context: |
  Im deutschen Schulunterricht wird gelehrt: "Bismarck einte Deutschland, aber
  kolonisierte Afrika brutal." Die AfD fordert: "Aufhören mit Schuldkult!
  Wir brauchen positives Geschichtsbild." Historiker sagen: "Geschichte ist
  komplex – weder Heldenverehrung noch Selbsthass." In den USA tobt der
  "Culture War" um die Lehre von Sklaverei vs. "patriotic education".

question: "Wie sollte nationale Geschichte gelehrt werden?"

options:
  A:
    text: "Kritisch dekonstruieren. Jeder Mythos muss hinterfragt werden. Geschichte ist Machtinstrument, keine Wahrheit."
    value: +8  # Stark progressiv: Postmoderne Geschichtskritik
  B:
    text: "Ausgewogen: Leistungen UND Verbrechen benennen. Differenzierte Perspektiven statt Schwarz-Weiß."
    value: +3  # Moderat progressiv: Kritische Aufarbeitung
  C:
    text: "Positiv mit Kontext: Nationale Identität stärken, aber dunkle Kapitel nicht verschweigen."
    value: -5  # Reaktionär: Traditionsorientiert
  D:
    text: "Patriotisch. Schulen sollen Liebe zur Heimat lehren, nicht Selbstgeißelung. Fehler waren Ausnahmen."
    value: -8  # Stark reaktionär: Nationalistischer Mythos

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Symmetrisch: +8, +3, -5, -8
  Y-Achse: Geschichtskritik (progressiv) vs. Tradition verteidigen (reaktionär).

