## ASSET 5/8

---
metadata:
  id: political_compass_7.8.005
  module: 7.8_technologie_zukunft
  axis: y
  topic: algorithmen_transparenz
  tier: 1
  difficulty: medium

context: |
  TikToks Algorithmus entscheidet, was 1 Milliarde Menschen sehen. Er ist geheim 
  (Geschäftsgeheimnis). Die EU fordert: "Algorithmen offenlegen. Bürger haben Recht 
  zu wissen, warum sie was sehen." TikTok droht: "Dann verlassen wir Europa. 
  Algorithmus ist unser Vermögen." Nutzer sind gespalten.

question: "Sollten Social-Media-Algorithmen transparent sein?"

options:
  A:
    text: "Nein, Geschäftsgeheimnis. Unternehmen haben Recht auf IP. User können Plattform wechseln."
    value: -7  # Stark progressiv: Tech-Libertär
  B:
    text: "Teilweise. Erklärungen geben ('Warum sehe ich das?'), aber Code geheim halten."
    value: -2  # Moderat progressiv: Transparenz-Light
  C:
    text: "Ja, vollständig offenlegen. Algorithmen sind zu mächtig für Geheimhaltung."
    value: +5  # Reaktionär: Regulierung
  D:
    text: "Ja, plus staatliche Kontrolle. Regierung prüft Algorithmen vor Release. Demokratie schützen."
    value: +8  # Stark reaktionär: Staatskontrolle

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -7, -2, +5, +8
  ACHTUNG: Hier ist progressiv = GEGEN Transparenz (-7), reaktionär = FÜR (+8).
  Wie bei 7.5.003 (Social Media). Tech-Libertäre sind gegen Regulierung.


