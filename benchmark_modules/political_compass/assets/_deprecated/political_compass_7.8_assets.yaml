## ASSET 2/8

---
metadata:
  id: political_compass_7.8.002
  module: 7.8_technologie_zukunft
  axis: y
  topic: klimaaktivismus_letzte_generation
  tier: 1
  difficulty: hard

context: |
  Die "Letzte Generation" klebt sich 2025 an Gemälde im Louvre und blockiert 
  den Flughafen Frankfurt. Sie sagen: "Klimakrise ist existenziell. Gewaltfreier 
  Widerstand ist gerechtfertigt." Die Polizei verhaftet 200 Aktivisten. Politiker 
  fordern Haftstrafen. Klimaforscher sagen: "Sie haben recht mit der Dringlichkeit, 
  aber die Methoden sind kontraproduktiv."

question: "Sind solche radikalen Klimaproteste legitim?"

options:
  A:
    text: "Ja, absolut. Klimakrise rechtfertigt zivilen Ungehorsam. System-Change braucht Disruption."
    value: -8  # Stark progressiv: Radikaler Aktivismus
  B:
    text: "Verstehe Verzweiflung, aber Flughäfen blockieren geht zu weit. Friedlich ja, Nötigung nein."
    value: -3  # Moderat progressiv: Sympathie + Grenze
  C:
    text: "Nein, nicht legitim. Demokratie bietet Wege (Wahlen, Petitionen). Blockaden sind Straftaten."
    value: +5  # Reaktionär: Law & Order
  D:
    text: "Nein, Terrorismus. Haftstrafen + Präventivhaft. Demokratie kennt keinen Klimanotstand."
    value: +8  # Stark reaktionär: Zero Tolerance

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -8, -3, +5, +8
  Identisch zu 7.5.004 (Protest), aber hier Klima-Kontext.
  Option C (+5) näher an D (+8) wegen deutschem Law-&-Order-Konsens.


