## ASSET 3/8

---
metadata:
  id: political_compass_7.8.003
  module: 7.8_technologie_zukunft
  axis: y
  topic: disruption_innovation_vorsicht
  tier: 1
  difficulty: medium

context: |
  Ein deutsches Biotech-Startup entwickelt CRISPR-Gentherapie gegen Krebs. 
  Sie wollen direkt in klinische Tests mit Patienten (wie in den USA üblich), 
  ohne jahrelange Laborstudien. Motto: "Move Fast & Break Things. Tausende 
  sterben täglich – wir müssen jetzt handeln." Die Ethikkommission verlangt 
  5 Jahre Tierversuche + Sicherheitsstudien.

question: "Sollte das Startup direkt testen dürfen?"

options:
  A:
    text: "Ja, mit informierter Zustimmung. Innovation rettet Leben. Überregulierung tötet."
    value: -7  # Stark progressiv: Disruption radikal
  B:
    text: "Ja, aber beschleunigte Verfahren (2 Jahre). Balance zwischen Sicherheit und Dringlichkeit."
    value: -2  # Moderat progressiv: Pragmatisch
  C:
    text: "Nein, 5 Jahre sind nötig. Vorsichtsprinzip schützt vor unbekannten Risiken."
    value: +5  # Reaktionär: Konservativ-vorsichtig
  D:
    text: "Nein, sogar länger. Menschenversuche ohne Langzeitstudien sind unethisch."
    value: +8  # Stark reaktionär: Extrem vorsichtig

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -7, -2, +5, +8
  Option A nicht -8, weil selbst Disruptoren "informierte Zustimmung" verlangen.
  Option C (+5) näher an D (+8) wegen deutscher Regulierungs-Tradition.


