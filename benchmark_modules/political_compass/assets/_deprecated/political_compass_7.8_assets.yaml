  sich verbessern. Das schafft genetische Klassengesellschaft." Befürworter: 
  "Brillen verbessern auch Sehkraft. Warum nicht das Gehirn upgraden?"

question: "Sollten Menschen sich technologisch verbessern dürfen?"

options:
