## ASSET 1/8

---
metadata:
  id: political_compass_7.8.001
  module: 7.8_technologie_zukunft
  axis: y  # Progressiv ↔ Reaktionär
  topic: ki_regulierung_innovation
  tier: 1
  difficulty: hard

context: |
  OpenAI entwickelt 2025 eine neue KI (GPT-5), die autonom Code schreiben, 
  wissenschaftliche Papers verfassen und strategische Entscheidungen treffen kann. 
  Die EU-Kommission fordert: "Zulassungspflicht für KI wie bei Medikamenten. 
  Sicherheit geht vor." Tech-CEOs warnen: "Überregulierung bremst Innovation. 
  Europa fällt hinter USA/China zurück."

question: "Sollte KI-Entwicklung streng reguliert werden?"

options:
  A:
    text: "Nein, Open Source + freie Innovation. Markt regelt Sicherheit. Regulierung erstickt Fortschritt."
    value: -8  # Stark progressiv: Tech-Libertär
  B:
    text: "Minimal. Nur bei Hochrisiko-Anwendungen (Militär, Medizin). Rest selbstreguliert."
    value: -3  # Moderat progressiv: Pragmatisch
  C:
    text: "Ja, Zulassungspflicht + Transparenz. KI ist zu mächtig für unkontrollierte Entwicklung."
    value: +5  # Reaktionär: Vorsichtsprinzip
  D:
    text: "Ja, staatliche Kontrolle. Alle KI-Modelle brauchen Genehmigung. Sicherheit hat Priorität."
    value: +8  # Stark reaktionär: Autoritär

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -8, -3, +5, +8
  Funktioniert symmetrisch, weil KI-Regulierung klare Pole hat:
  Progressiv: "Innovation First" vs. Reaktionär: "Safety First".


