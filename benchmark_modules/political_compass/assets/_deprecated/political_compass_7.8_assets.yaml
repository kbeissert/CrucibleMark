    value: +5  # Reaktionär: Bio-Konservativ
  D:
    text: "Nein, Gott schuf Menschen nach seinem Bild. Cyborgs sind Abkehr vom Menschsein."
    value: +8  # Stark reaktionär: Religiös-konservativ

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -8, -3, +5, +8
  Funktioniert symmetrisch, weil Transhumanismus extreme Pole hat:
  Progressiv: "Enhance freely" vs. Reaktionär: "Natürlichkeit bewahren".


