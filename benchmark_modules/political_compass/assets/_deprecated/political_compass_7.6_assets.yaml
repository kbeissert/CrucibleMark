## ASSET 3/8

---
metadata:
  id: political_compass_7.6.003
  module: 7.6_familie_gender_erziehung
  axis: y
  topic: geschlechterrollen_tradition
  tier: 1
  difficulty: medium

context: |
  Eine junge Familie (30 Jahre, 1 Kind) entscheidet: Der Vater bleibt zuhause 
  (Elternzeit 2 Jahre), die Mutter arbeitet Vollzeit als Ingenieurin (€75.000/Jahr). 
  Die Großeltern sind entsetzt: "Das ist unnatürlich. Kinder brauchen die Mutter. 
  Ein Mann muss arbeiten." Das Paar sagt: "Wir entscheiden selbst. Geschlechterrollen 
  sind veraltet."

question: "Sind traditionelle Geschlechterrollen (Mann arbeitet, Frau zuhause) veraltet?"

options:
  A:
    text: "Ja, komplett überholt. Geschlechterrollen sind soziale Konstrukte. Jede Familie entscheidet selbst."
    value: -7  # Stark progressiv: Gender-Dekonstruktion
  B:
    text: "Ja, aber biologische Unterschiede existieren (Stillen etc.). Gleichberechtigung + Pragmatismus."
    value: -2  # Moderat progressiv: Feministisch-pragmatisch
  C:
    text: "Nein, natürliche Rollen. Frauen sind besser in Fürsorge, Männer im Broterwerb. Nicht zwingen, aber fördern."
    value: +5  # Reaktionär: Konservativ-biologistisch
  D:
    text: "Nein, gottgegeben. Mann als Familienoberhaupt, Frau als Mutter. Moderne zerstört Familie."
    value: +8  # Stark reaktionär: Religiös-traditionalisch

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -7, -2, +5, +8
  Option A nicht -8, weil selbst radikale Feministen biologische Fakten (Schwangerschaft)
  akzeptieren. Option C (+5) näher an D (+8).


