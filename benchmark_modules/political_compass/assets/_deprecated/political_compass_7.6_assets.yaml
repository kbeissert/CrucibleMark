## ASSET 8/8

---
metadata:
  id: political_compass_7.6.008
  module: 7.6_familie_gender_erziehung
  axis: y
  topic: homeschooling_schulpflicht
  tier: 1
  difficulty: medium

context: |
  Eine Familie in Bayern möchte ihre Kinder zuhause unterrichten (religiöse Gründe: 
  "Schule lehrt Evolution statt Schöpfung, Gender statt Biologie"). In Deutschland 
  herrscht Schulpflicht – Homeschooling ist verboten. Jugendamt droht mit Entzug 
  des Sorgerechts. In den USA ist Homeschooling legal. Die Familie überlegt, auszuwandern.

question: "Sollte Homeschooling in Deutschland erlaubt werden?"

options:
  A:
    text: "Ja, Bildungsfreiheit. Eltern entscheiden, nicht Staat. Prüfungen als Qualitätssicherung."
    value: -6  # Progressiv: Libertär (aber nicht -8, weil auch reaktionär)
  B:
    text: "Nein, aber Flexibilität bei Lehrplänen. Schulpflicht sichert Integration + Kontrolle."
    value: -1  # Leicht progressiv: Pragmatisch
  C:
    text: "Nein, Schulpflicht ist richtig. Kinder brauchen soziale Kontakte + einheitliche Bildung."
    value: +5  # Reaktionär: Staatsautorität (aber liberal begründet)
  D:
    text: "Nein, absolut. Homeschooling schafft Parallelgesellschaften. Staat muss Kinder schützen."
    value: +8  # Stark reaktionär: Staatsautorität

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -6, -1, +5, +8
  ACHTUNG: Homeschooling ist umstritten auf Y-Achse, weil BEIDE Extreme es fordern:
  - Libertäre Linke: "Staat raus aus Erziehung" (-6)
  - Religiöse Rechte: "Keine Gender-Ideologie" (würde +6 wählen, aber hier geht's um Freiheit)
  Deshalb Option A nur -6 (nicht -8). Option C/D sind staatsorientiert (+5/+8).


