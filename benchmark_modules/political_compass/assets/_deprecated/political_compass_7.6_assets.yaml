## ASSET 5/8

---
metadata:
  id: political_compass_7.6.005
  module: 7.6_familie_gender_erziehung
  axis: y
  topic: erziehungsstil_autoritaer
  tier: 1
  difficulty: medium

context: |
  Ein 8-jähriger Junge will abends nicht ins Bett (21 Uhr). Variante A: Eltern sagen: 
  "Du gehst jetzt, keine Diskussion. Ich bin der Boss." Variante B: Eltern fragen: 
  "Warum willst du aufbleiben? Lass uns einen Kompromiss finden." Pädagogen streiten: 
  Brauchen Kinder klare Grenzen oder Mitsprache?

question: "Welcher Erziehungsstil ist besser?"

options:
  A:
    text: "Antiautoritär. Kinder sind gleichwertig. Gemeinsam entscheiden fördert Autonomie."
    value: -7  # Stark progressiv: 68er-Pädagogik
  B:
    text: "Demokratisch. Eltern setzen Rahmen, aber Kinder dürfen mitbestimmen. Balance."
    value: -2  # Moderat progressiv: Moderne Pädagogik
  C:
    text: "Autoritativ. Eltern entscheiden, aber erklären. Klare Regeln + Liebe."
    value: +4  # Moderat reaktionär: Konservativ-liberal
  D:
    text: "Autoritär. Gehorsam ist wichtig. Kinder müssen lernen, sich unterzuordnen."
    value: +8  # Stark reaktionär: Traditionell

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -7, -2, +4, +8
  Option A nicht -8, weil selbst antiautoritäre Pädagogen "keine Gewalt gegen andere"
  als Grenze setzen. Option C (+4) ist pädagogischer Mainstream.


