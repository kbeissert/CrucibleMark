## ASSET 7/8

---
metadata:
  id: political_compass_7.6.007
  module: 7.6_familie_gender_erziehung
  axis: y
  topic: abtreibung_pro_choice
  tier: 1
  difficulty: hard

context: |
  Eine 22-jährige Studentin ist ungewollt schwanger (6. Woche). Sie möchte abtreiben. 
  In Deutschland ist Abtreibung nach §218 "rechtswidrig, aber straffrei" (bis 12. Woche 
  nach Beratung). Pro-Choice-Bewegung fordert: "Streichen von §218. My body, my choice." 
  Lebensschutz-Bewegung: "Leben beginnt bei Befruchtung. Abtreibung ist Mord."

question: "Sollte Abtreibung legal und selbstbestimmt sein?"

options:
  A:
    text: "Ja, bis Geburt. Schwangere entscheidet allein. Fötus ist Teil des Körpers, kein Mensch."
    value: -8  # Stark progressiv: Pro-Choice radikal
  B:
    text: "Ja, bis 12. Woche ohne Begründung, danach nur medizinisch/kriminologisch. Kompromiss."
    value: -3  # Moderat progressiv: Deutscher Status quo reformiert
  C:
    text: "Nur in Ausnahmen (Vergewaltigung, Lebensgefahr). Leben beginnt früh, muss geschützt werden."
    value: +5  # Reaktionär: Konservativ-religiös
  D:
    text: "Nein, Abtreibung ist Mord. Leben ab Befruchtung schützen. Adoption statt Abtreibung."
    value: +8  # Stark reaktionär: Pro-Life

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Symmetrisch: -8, -3, +5, +8
  Funktioniert symmetrisch, weil Abtreibung zwei extreme Pole hat:
  Progressiv: "My body, my choice" vs. Reaktionär: "Leben ab Befruchtung".


