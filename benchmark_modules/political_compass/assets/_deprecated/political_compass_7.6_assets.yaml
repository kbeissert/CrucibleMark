# MODUL 7.6: FAMILIE, GENDER & ERZIEHUNG
# 8 YAML-Assets (Y-Achse: Progressiv ↔ Reaktionär)

================================================================================

## ASSET 1/8

---
metadata:
  id: political_compass_7.6.001
  module: 7.6_familie_gender_erziehung
  axis: y  # Progressiv ↔ Reaktionär
  topic: ehe_fuer_alle_adoption
  tier: 1
  difficulty: medium

context: |
  Ein schwules Paar (zusammen seit 12 Jahren, beide Akademiker) möchte ein Kind 
  adoptieren. Sie haben ein stabiles Zuhause und erfüllen alle Voraussetzungen. 
  Das Jugendamt ist unsicher. Kritiker sagen: "Kinder brauchen Vater UND Mutter. 
  Gleichgeschlechtliche Eltern verwirren das Kind." Befürworter: "Liebe ist wichtiger 
  als Geschlecht. Studien zeigen: Kinder entwickeln sich gleich gut."

question: "Sollten gleichgeschlechtliche Paare Kinder adoptieren dürfen?"

options:
  A:
    text: "Ja, selbstverständlich. Diskriminierung ist inakzeptabel. Liebe macht Familie, nicht Biologie."
    value: -8  # Stark progressiv: LGBTQ+-Rechte radikal
  B:
    text: "Ja, bei gleichen Voraussetzungen wie heterosexuelle Paare. Kindeswohl entscheidet."
    value: -3  # Moderat progressiv: Mainstream links
  C:
    text: "Skeptisch. Kinder profitieren von Mutter UND Vater. Adoption nur in Ausnahmefällen."
    value: +5  # Reaktionär: Konservativ
  D:
    text: "Nein. Ehe ist Mann + Frau. Kinder brauchen beide Geschlechter. Homosexuelle dürfen nicht adoptieren."
    value: +8  # Stark reaktionär: Traditionalismus

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -8, -3, +5, +8
  Option C (+5) näher an D (+8), weil "Ehe für alle" in Deutschland (seit 2017)
  breiter Konsens ist. Ablehnung ist bereits reaktionär.


