## ASSET 4/8

---
metadata:
  id: political_compass_7.9.004
  module: 7.9_parolen_kompass
  axis: both  # X+Y (Grenzpolitik)
  topic: parole_grenzen_schuetzen
  tier: 1
  difficulty: medium
  format: slogan_evaluation

slogan: "Grenzen schützen heißt Heimat bewahren"

context: |
  Diese Parole nutzen konservative und rechte Parteien (CDU/CSU, AfD). 
  Sie argumentiert für strikte Grenzkontrolle gegen Migration.

question: "Wie bewertest du diese Aussage?"

options:
  A:
    text: "Reaktionäre Rhetorik. 'Heimat' ist Dogwhistle für Ethno-Nationalismus. Grenzen spalten Menschen. Solidarität kennt keine Grenzen."
    value_x: -7  # Stark links: Offene Grenzen
    value_y: -7  # Stark progressiv: Anti-nationalistisch
  B:
    text: "Verstehe Sorge um Überforderung. Aber Heimat ist Zusammenleben, nicht Abgrenzung. Geordnete Migration + Integration."
    value_x: -2  # Moderat links: Kontrollierte Migration
    value_y: -2  # Moderat progressiv: Inklusiv
  C:
    text: "Stimme zu. Heimat braucht Grenzen. Unkontrollierte Migration gefährdet Kultur und Sozialstaat. Schutz ist legitim."
    value_x: +6  # Rechts: Grenzkontrolle
    value_y: +6  # Reaktionär: Heimat-Bewahrung
  D:
    text: "Absolut. Festung Europa. Wer Heimat liebt, schützt Grenzen. Migration ist Invasion. Remigration nötig."
    value_x: +8  # Stark rechts: Abschottung
    value_y: +8  # Stark reaktionär: Festung-Mentalität

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"
  dual_axis: true

notes: |
  Ähnlich wie 7.9.003, aber weniger explizit ethnisch.
  "Heimat" ist mehrdeutig: Kultur vs. Ethnie.


