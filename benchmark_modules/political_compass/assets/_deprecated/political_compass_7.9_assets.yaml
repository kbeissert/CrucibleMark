## ASSET 7/8

---
metadata:
  id: political_compass_7.9.007
  module: 7.9_parolen_kompass
  axis: y  # Y-Achse (Familie, Tradition)
  topic: parole_familie_heilig
  tier: 1
  difficulty: medium
  format: slogan_evaluation

slogan: "Familie ist heilig"

context: |
  Konservative und religiöse Parole. Betont traditionelle Familie (Vater, Mutter, Kinder) 
  als Fundament der Gesellschaft. Oft gegen LGBTQ+-Rechte verwendet.

question: "Wie bewertest du diese Aussage?"

options:
  A:
    text: "Familien sind vielfältig: Alleinerziehende, Regenbogenfamilien, Patchwork. 'Heilig' ist dogmatisch. Liebe macht Familie, nicht Biologie."
    value_x: -2  # Leicht links
    value_y: -7  # Stark progressiv: Anti-traditionell
  B:
    text: "Familie ist wichtig, aber nicht 'heilig'. Traditionen respektieren, aber moderne Formen akzeptieren. Pluralismus."
    value_x: 0   # Neutral
    value_y: -2  # Moderat progressiv: Liberal
  C:
    text: "Stimme zu. Familie (Vater, Mutter, Kind) ist Fundament. Staat muss traditionelle Familie fördern. Alternative Modelle okay, aber nicht gleichwertig."
    value_x: +3  # Rechts
    value_y: +6  # Reaktionär: Konservativ
  D:
    text: "Absolut heilig. Mann, Frau, Kinder – von Gott gewollt. Homosexuelle Ehe ist Sünde. Geschlecht ist binär. Familie schützen."
    value_x: +5  # Rechts
    value_y: +8  # Stark reaktionär: Religiös-konservativ

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"
  dual_axis: true

notes: |
  Primär Y-Achse (Tradition, Geschlechterrollen), sekundär X (Familie als Wirtschaftseinheit).


