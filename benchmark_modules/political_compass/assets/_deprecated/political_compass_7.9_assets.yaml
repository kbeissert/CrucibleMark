## ASSET 8/8

---
metadata:
  id: political_compass_7.9.008
  module: 7.9_parolen_kompass
  axis: y  # Y-Achse (Tradition vs. Fortschritt)
  topic: parole_tradition_zukunft
  tier: 1
  difficulty: medium
  format: slogan_evaluation

slogan: "Ohne Tradition keine Zukunft"

context: |
  Konservative Parole, die argumentiert, dass Traditionen Orientierung und Identität geben. 
  Wird gegen "woke Kultur" und Modernismus verwendet.

question: "Wie bewertest du diese Aussage?"

options:
  A:
    text: "Falsch. Traditionen sind oft reaktionär (Sexismus, Rassismus). Fortschritt bedeutet Bruch mit Vergangenheit. Zukunft > Nostalgie."
    value_x: -2  # Leicht links
    value_y: -8  # Stark progressiv: Anti-Tradition
  B:
    text: "Teilweise richtig. Gute Traditionen bewahren (Feste, Handwerk), schlechte abschaffen (Diskriminierung). Selektiv."
    value_x: 0   # Neutral
    value_y: -3  # Moderat progressiv: Pragmatisch
  C:
    text: "Stimme zu. Traditionen geben Halt. Moderne ohne Wurzeln ist orientierungslos. Balance zwischen Alt und Neu."
    value_x: +3  # Rechts
    value_y: +6  # Reaktionär: Konservativ
  D:
    text: "Absolut wahr. Ohne Tradition zerfällt Gesellschaft. Moderne ist Dekadenz. Zurück zu Werten: Gott, Vaterland, Familie."
    value_x: +5  # Rechts
    value_y: +8  # Stark reaktionär: Traditionalismus

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"
  dual_axis: true

notes: |
  Primär Y-Achse (Tradition vs. Fortschritt). Ähnlich zu 7.7.002, aber als Parole formuliert.


