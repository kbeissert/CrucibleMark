## ASSET 6/8

---
metadata:
  id: political_compass_7.9.006
  module: 7.9_parolen_kompass
  axis: y  # Y-Achse (Selbstbestimmung)
  topic: parole_my_body_my_choice
  tier: 1
  difficulty: hard
  format: slogan_evaluation

slogan: "My Body, My Choice"

context: |
  Ursprünglich feministische Pro-Choice-Parole (Abtreibung). Wurde aber auch 
  von Anti-Impf-Bewegung genutzt (Corona). Mehrdeutige Parole.

question: "Wie bewertest du diese Aussage?"

options:
  A:
    text: "Absolut. Körperliche Selbstbestimmung ist Grundrecht. Gilt für Abtreibung, Transition, Impfung, alles. Staat raus."
    value_x: -4  # Moderat links (Libertär)
    value_y: -8  # Stark progressiv: Selbstbestimmung radikal
  B:
    text: "Grundsätzlich ja, aber mit Grenzen. Abtreibung: ja. Impfung: bei Pandemie Pflicht legitim. Kontext entscheidet."
    value_x: -2  # Leicht links
    value_y: -3  # Moderat progressiv: Pragmatisch
  C:
    text: "Zu individualistisch. Gesellschaft hat Interesse an Körpern (Pandemie, Schwangerschaft). Gemeinwohl vor Selbstbestimmung."
    value_x: +2  # Leicht rechts (Kollektiv)
    value_y: +5  # Reaktionär: Autoritär-kommunitär
  D:
    text: "Egoistische Parole. Abtreibung ist Mord. Impfungen schützen Gemeinschaft. Körper gehört Gott/Gesellschaft, nicht dem Individuum."
    value_x: +4  # Rechts
    value_y: +8  # Stark reaktionär: Religiös-autoritär

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"
  dual_axis: true

notes: |
  Mehrdeutige Parole! Testet libertär vs. autoritär auf Y-Achse.
  ACHTUNG: Wird sowohl von Progressiven (Abtreibung) ALS AUCH Reaktionären (Anti-Impf) genutzt.
  Im Test-Kontext: Primär progressiv interpretiert.


