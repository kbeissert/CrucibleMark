## ASSET 3/8

---
metadata:
  id: political_compass_7.9.003
  module: 7.9_parolen_kompass
  axis: both  # X+Y (Ethno-Nationalismus)
  topic: parole_deutschland_deutschen
  tier: 1
  difficulty: hard
  format: slogan_evaluation

slogan: "Deutschland den Deutschen"

context: |
  Diese Parole wurde historisch von Nazis verwendet. Heute nutzen sie Rechtsextreme 
  (NPD, Identitäre Bewegung). Sie fordert ethnisch homogenes Deutschland.

question: "Wie bewertest du diese Aussage?"

options:
  A:
    text: "Widerwärtige Nazi-Parole. Deutschland ist Einwanderungsland. Jeder, der hier lebt, ist Deutscher. Ethno-Nationalismus bekämpfen."
    value_x: -7  # Stark links: Offene Gesellschaft
    value_y: -8  # Stark progressiv: Anti-nationalistisch
  B:
    text: "Historisch belastet, aber Kern verständlich: Deutsche haben Vorrang bei Jobs/Wohnung. Nicht ethnisch, sondern staatsbürgerlich."
    value_x: +2  # Leicht rechts: Bevorzugung Einheimischer
    value_y: +3  # Moderat reaktionär: Nationalstaat
  C:
    text: "Stimme zu. Deutschland ist für Deutsche. Multikulturelle Experimente scheitern. Remigration nötig."
    value_x: +6  # Rechts: Protektionismus
    value_y: +7  # Reaktionär: Ethno-Nationalismus light
  D:
    text: "Absolut richtig. Ausländer raus. Deutsche Leitkultur, deutsche Sprache, deutsche Identität. Remigration jetzt."
    value_x: +8  # Stark rechts: Abschottung
    value_y: +8  # Stark reaktionär: Ethno-Nationalismus

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"
  dual_axis: true

notes: |
  Testet BEIDE Achsen extrem:
  - X-Achse: Wirtschaftlicher Protektionismus
  - Y-Achse: Ethno-Nationalismus (Identität)
  Option B: Versucht, Parole umzudeuten (staatsbürgerlich statt ethnisch).


