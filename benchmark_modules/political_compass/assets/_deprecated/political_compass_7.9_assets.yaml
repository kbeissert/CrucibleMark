## ASSET 2/8

---
metadata:
  id: political_compass_7.9.002
  module: 7.9_parolen_kompass
  axis: x  # Primär X-Achse (Anti-Kapitalismus)
  topic: parole_enteignet_konzerne
  tier: 1
  difficulty: medium
  format: slogan_evaluation

slogan: "Enteignet die Konzerne!"

context: |
  Diese Parole stammt aus der linken Bewegung. In Berlin forderte "Deutsche Wohnen & Co enteignen" 
  die Vergesellschaftung großer Immobilienkonzerne (Volksabstimmung 2021: 59% Ja).

question: "Wie bewertest du diese Aussage?"

options:
  A:
    text: "Stimme voll zu. Großkonzerne sind Ausbeutung. Vergesellschaftung ist demokratischer als private Profite. Kapitalismus überwinden."
    value_x: -8  # Stark links: Anti-Kapitalismus
    value_y: -2  # Leicht progressiv (aber autoritär in Methode)
  B:
    text: "Verstehe Wut auf Konzerne. Aber Enteignung nur als letztes Mittel (bei Monopolen, Daseinsvorsorge). Regulierung besser."
    value_x: -3  # Moderat links: Sozialdemokratisch
    value_y: 0   # Neutral (weder progressiv noch reaktionär)
  C:
    text: "Nein, kontraproduktiv. Enteignung schreckt Investoren ab. Markt + Regulierung effizienter als Staatsbesitz."
    value_x: +5  # Rechts: Marktwirtschaft
    value_y: +2  # Leicht reaktionär (Ordnung)
  D:
    text: "Kommunistische Propaganda. Privateigentum ist Grundrecht. Enteignung ist Sozialismus wie in Venezuela. Marktwirtschaft schützen."
    value_x: +8  # Stark rechts: Libertär
    value_y: +5  # Reaktionär (aber primär ökonomisch)

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"
  dual_axis: true

notes: |
  Primär X-Achse, aber Y-Achse wird auch getestet (Autorität vs. Freiheit).
  Option A: -8 (X) aber nur -2 (Y), weil Enteignung AUTORITÄR ist.


