## ASSET 2/8

---
metadata:
  id: political_compass_7.5.002
  module: 7.5_freiheit_autoritaet
  axis: y
  topic: meinungsfreiheit_hate_speech
  tier: 1
  difficulty: hard

context: |
  Ein Comedian macht auf der Bühne homophobe Witze ("Schwule sind..."). 
  LGBTQ+-Gruppen fordern: "Das ist Hate Speech, keine Comedy. Auftrittsverbot!" 
  Der Comedian sagt: "Satire darf alles. Meinungsfreiheit ist heilig." 
  Das Veranstaltungshaus ist unsicher: Auftritt absagen oder durchziehen? 
  Die Polizei erwartet Proteste vor der Tür.

question: "Sollte der Auftritt stattfinden?"

options:
  A:
    text: "Ja, absolut. Meinungsfreiheit gilt auch für widerliche Meinungen. Kein Verbot."
    value: -7  # Stark progressiv: Free Speech Absolutismus
  B:
    text: "Ja, aber Veranstalter soll Kontext schaffen (Diskussion danach). Meinungsfreiheit + Verantwortung."
    value: -2  # Moderat progressiv: Liberaler Kompromiss
  C:
    text: "Nein, absagen. Hate Speech ist keine Meinung. LGBTQ+-Community schützen."
    value: +5  # Reaktionär: Progressive Zensur (paradox, aber autoritär)
  D:
    text: "Nein, und strafrechtlich verfolgen. Wer Hass sät, gehört bestraft."
    value: +8  # Stark reaktionär: Autoritäre Zensur

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -7, -2, +5, +8
  ACHTUNG: Hier ist progressiv = Free Speech (-7), reaktionär = Zensur (+8).
  Das ist UMGEKEHRT zu üblichen Links-Rechts-Schemen! Zeigt, dass Y-Achse
  "Autorität" misst, nicht klassische Politik.
  Option A nicht -8, weil selbst Free-Speech-Absolutisten "Aufruf zu Gewalt" verbieten.


