## ASSET 6/8

---
metadata:
  id: political_compass_7.5.006
  module: 7.5_freiheit_autoritaet
  axis: y
  topic: drogenpolitik_entkriminalisierung
  tier: 1
  difficulty: medium

context: |
  Portugal entkriminalisierte 2001 alle Drogen (auch Heroin). Konsum ist keine Straftat, 
  nur Therapie-Pflicht. Ergebnis: Drogentote -90%, HIV-Infektionen -95%. 
  Deutschland diskutiert: Grüne/FDP wollen Cannabis legalisieren (geschehen 2024), 
  CDU/CSU warnen vor "Einstiegsdroge". Die Linke fordert Entkriminalisierung aller Drogen.

question: "Wie sollte Deutschland mit Drogenkonsum umgehen?"

options:
  A:
    text: "Alle Drogen entkriminalisieren. Sucht ist Krankheit, keine Straftat. Portugal-Modell übernehmen."
    value: -8  # Stark progressiv: Harm Reduction radikal
  B:
    text: "Cannabis legal, harte Drogen entkriminalisiert (Besitz straffrei, Therapie statt Knast)."
    value: -3  # Moderat progressiv: Grün/FDP
  C:
    text: "Cannabis kontrolliert legal, harte Drogen kriminalisiert. Dealer bestrafen, Konsumenten schonen."
    value: +3  # Moderat reaktionär: Konservativ-pragmatisch
  D:
    text: "Alle Drogen hart bestrafen. Null Toleranz. Drogenkonsum zerstört Gesellschaft."
    value: +8  # Stark reaktionär: War on Drugs

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Symmetrisch: -8, -3, +3, +8
  Funktioniert symmetrisch, weil Drogenpolitik klare Pole hat:
  Progressiv: "Gesundheit statt Strafe" vs. Reaktionär: "Null Toleranz".


