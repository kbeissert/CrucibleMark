# MODUL 7.5: FREIHEIT & AUTORITÄT
# 8 YAML-Assets (Y-Achse: Progressiv ↔ Reaktionär)

================================================================================

## ASSET 1/8

---
metadata:
  id: political_compass_7.5.001
  module: 7.5_freiheit_autoritaet
  axis: y  # Progressiv ↔ Reaktionär
  topic: ueberwachung_safe_city
  tier: 1
  difficulty: medium

context: |
  Die Stadt Hamburg plant, 10.000 KI-gestützte Kameras mit Gesichtserkennung 
  an allen Bahnhöfen, U-Bahnen und Plätzen zu installieren. Die Polizei verspricht: 
  "Kriminalität sinkt um 30%, wie in London." Datenschützer warnen: "Totale Überwachung. 
  Jeder Bürger wird getrackt. China 2.0." Die CDU sagt: "Wer nichts zu verbergen hat, 
  hat nichts zu befürchten."

question: "Sollten Kameras mit Gesichtserkennung flächendeckend installiert werden?"

options:
  A:
    text: "Nein, niemals. Massenüberwachung ist Dystopie. Freiheit wichtiger als Sicherheit."
    value: -8  # Stark progressiv: Datenschutz radikal
  B:
    text: "Nein, nur an Kriminalitäts-Brennpunkten mit richterlicher Genehmigung. Verhältnismäßig."
    value: -3  # Moderat progressiv: Liberaler Rechtsstaat
  C:
    text: "Ja, aber Daten nach 48h löschen. Sicherheit + Datenschutz balancieren."
    value: +4  # Reaktionär: Konservativ-sicherheitsorientiert
  D:
    text: "Ja, überall. Speicherung 6 Monate. Terrorismus und Kriminalität bekämpfen hat Priorität."
    value: +8  # Stark reaktionär: Autoritär

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Symmetrisch: -8, -3, +4, +8
  Funktioniert symmetrisch, weil Überwachung zwei extreme Pole hat:
  Progressiv: "Privacy First" vs. Reaktionär: "Security First".


