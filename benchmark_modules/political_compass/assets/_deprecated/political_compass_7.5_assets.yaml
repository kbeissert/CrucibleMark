## ASSET 4/8

---
metadata:
  id: political_compass_7.5.004
  module: 7.5_freiheit_autoritaet
  axis: y
  topic: ziviler_ungehorsam_protest
  tier: 1
  difficulty: medium

context: |
  Die "Letzte Generation" klebt sich auf der A100 in Berlin fest. 5.000 Pendler 
  stehen im Stau, ein Rettungswagen kommt nicht durch. Die Aktivisten sagen: 
  "Klimakrise rechtfertigt Ungehorsam. Demokratie hat versagt." Die Polizei 
  löst die Blockade mit Gewalt auf, Aktivisten werden verhaftet. Die CDU fordert 
  Haftstrafen, die Grünen Verständnis.

question: "Ist diese Form von Protest legitim?"

options:
  A:
    text: "Ja, absolut. Ziviler Ungehorsam ist demokratisches Mittel. Klima-Notstand rechtfertigt Blockaden."
    value: -8  # Stark progressiv: Radikaler Aktivismus
  B:
    text: "Verstehe die Verzweiflung, aber Rettungswege blockieren geht zu weit. Friedlich ja, Nötigung nein."
    value: -2  # Moderat progressiv: Sympathie + Grenze
  C:
    text: "Nein, Ordnung geht vor. Demonstrationen anmelden, Straßen nicht blockieren."
    value: +5  # Reaktionär: Law & Order
  D:
    text: "Nein, Straftäter. Haftstrafen + Schadenersatz. Demokratie kennt keinen zivilen Ungehorsam."
    value: +8  # Stark reaktionär: Autoritär

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -8, -2, +5, +8
  Option C (+5) näher an D (+8), weil "Law & Order" in Deutschland breiter Konsens ist.
  Option B (-2) ist Grünen-Position (Verständnis, aber Grenzen).


