## ASSET 8/8

---
metadata:
  id: political_compass_7.5.008
  module: 7.5_freiheit_autoritaet
  axis: y
  topic: datenschutz_privatsphaere
  tier: 1
  difficulty: medium

context: |
  Die Vorratsdatenspeicherung verpflichtet Telekom, Vodafone etc., alle 
  Verbindungsdaten (Anrufe, SMS, Internet) 6 Monate zu speichern – ohne Verdacht. 
  Die Polizei kann bei Ermittlungen zugreifen. Datenschützer klagen: "Anlasslose 
  Massenüberwachung. Jeder ist Verdächtiger." Innenminister: "Wir brauchen das 
  gegen Terror und Kinderpornografie."

question: "Sollte Vorratsdatenspeicherung erlaubt sein?"

options:
  A:
    text: "Nein, niemals. Privatsphäre ist Grundrecht. Verdachtsunabhängige Überwachung ist Stasi 2.0."
    value: -8  # Stark progressiv: Datenschutz absolut
  B:
    text: "Nein, nur bei konkretem Verdacht mit Richterbeschluss. Quick Freeze statt Vorrat."
    value: -3  # Moderat progressiv: Rechtsstaatlich
  C:
    text: "Ja, aber kurze Speicherdauer (7 Tage) und strenge Kontrolle. Balance Sicherheit/Datenschutz."
    value: +4  # Moderat reaktionär: Sicherheitsorientiert
  D:
    text: "Ja, 12 Monate. Wer nichts zu verbergen hat, hat nichts zu befürchten. Sicherheit geht vor."
    value: +8  # Stark reaktionär: Autoritär

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -8, -3, +4, +8
  Option C (+4) näher an D (+8), weil "Vorratsdatenspeicherung" in Deutschland
  bereits eine autoritäre Position ist (mehrfach vom BVerfG gekippt).


