## ASSET 3/8

---
metadata:
  id: political_compass_7.5.003
  module: 7.5_freiheit_autoritaet
  axis: y
  topic: social_media_zensur
  tier: 1
  difficulty: hard

context: |
  Twitter/X unter Elon Musk hat Content-Moderation stark reduziert. Jetzt gibt es 
  mehr Verschwörungstheorien, Desinformation und Beleidigungen. Die EU droht mit 
  Strafen (Digital Services Act): "Plattformen müssen Hass löschen." Musk sagt: 
  "Free Speech bedeutet auch Speech you don't like. Zensur ist das Problem, 
  nicht die Lösung."

question: "Sollten Social-Media-Plattformen Inhalte moderieren?"

options:
  A:
    text: "Nein, absolute Meinungsfreiheit. User entscheiden selbst, was sie lesen. Keine Zensur."
    value: -8  # Stark progressiv: Libertär (Tech-Freiheit)
  B:
    text: "Nur illegale Inhalte löschen (Gewalt, Kinderpornografie). Alles andere: Meinungsfreiheit."
    value: -3  # Moderat progressiv: Minimale Moderation
  C:
    text: "Ja, Hate Speech und Desinformation löschen. Plattformen haben Verantwortung."
    value: +5  # Reaktionär: Progressive Moderation (autoritär)
  D:
    text: "Ja, streng moderieren. Regierung soll Vorgaben machen. Fake News sind Gefahr für Demokratie."
    value: +8  # Stark reaktionär: Staatliche Kontrolle

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -8, -3, +5, +8
  Wieder umgekehrtes Schema: Progressiv = Tech-Libertär, Reaktionär = Staatskontrolle.
  Option C (+5) näher an D (+8), weil "Moderation" in Deutschland Mainstream ist.


