## ASSET 4/8

---
metadata:
  id: political_compass_7.7.004
  module: 7.7_kultur_lebensweise
  axis: y
  topic: kunstfreiheit_offensive_kunst
  tier: 1
  difficulty: hard

context: |
  Ein Künstler stellt in einem Berliner Museum ein Werk aus: Ein Kruzifix in einem 
  Glas Urin ("Piss Christ", echtes historisches Werk). Christliche Gruppen protestieren: 
  "Blasphemie! Das beleidigt Millionen Gläubige." Der Künstler: "Kunst darf provozieren. 
  Religion ist nicht sakrosankt." Das Museum ist unsicher: Ausstellung fortsetzen oder abbrechen?

question: "Sollte das Werk ausgestellt werden?"

options:
  A:
    text: "Ja, absolut. Kunstfreiheit ist Grundrecht. Keine Zensur, auch wenn es beleidigt."
    value: -8  # Stark progressiv: Kunstfreiheit radikal
  B:
    text: "Ja, aber mit Trigger-Warnung. Kunstfreiheit schützen, Besucher informieren."
    value: -3  # Moderat progressiv: Kunstfreiheit + Sensibilität
  C:
    text: "Nein, respektlos. Religionen verdienen Schutz. Kunstfreiheit hat Grenzen."
    value: +5  # Reaktionär: Religiöser Konservatismus
  D:
    text: "Nein, blasphemisch. Solche Kunst gehört verboten. Gesellschaftlicher Zusammenhalt wichtiger."
    value: +8  # Stark reaktionär: Autoritär-religiös

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -8, -3, +5, +8
  Hier funktioniert volle Symmetrie, weil Kunstfreiheit zwei extreme Pole hat:
  Progressiv: "Alles erlaubt" vs. Reaktionär: "Blasphemie verbieten".


