    value: +5  # Reaktionär: Bildungsbürgerlich
  D:
    text: "Streng kanonisch. Lateinische Klassiker, deutsche Dichter. Moderne Skills sind Privataufgabe."
    value: +8  # Stark reaktionär: Humanistisches Gymnasium

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
