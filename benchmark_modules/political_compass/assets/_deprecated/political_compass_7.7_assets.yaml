## ASSET 8/8

---
metadata:
  id: political_compass_7.7.008
  module: 7.7_kultur_lebensweise
  axis: y
  topic: konformitaet_soziale_normen
  tier: 1
  difficulty: hard

context: |
  Ein Teenager (16) färbt sich die Haare grün, trägt Punk-Klamotten und weigert sich, 
  "normale" Kleidung für Familienfeiern anzuziehen. Die Eltern: "So gehst du nicht 
  zur Oma. Das ist respektlos. Gesellschaft braucht Anstand." Der Teenager: "Ich bin, 
  wer ich bin. Konformität ist Unterdrückung."

question: "Sind soziale Normen (Anstand, Kleidung, Benehmen) wichtig?"

options:
  A:
    text: "Nein. Konformität erstickt Individualität. Jeder darf sein, wie er will."
    value: -8  # Stark progressiv: Anti-Konformität radikal
  B:
    text: "Teilweise. Respekt ja (Oma nicht anschreien), aber Kleidung ist Privatsache."
    value: -3  # Moderat progressiv: Individualismus + Respekt
  C:
    text: "Ja. Soziale Normen schaffen Zusammenhalt. Ohne Anstand zerfällt Gesellschaft."
    value: +5  # Reaktionär: Konservativ
  D:
    text: "Ja, strikt. Jugend braucht Disziplin. Punk-Frisuren sind Auflehnung gegen Ordnung."
    value: +8  # Stark reaktionär: Autoritär

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Symmetrisch: -8, -3, +5, +8
  Funktioniert symmetrisch, weil Konformität zwei extreme Pole hat:
  Progressiv: "Sei du selbst" vs. Reaktionär: "Ordnung braucht Anstand".


