## ASSET 5/8

---
metadata:
  id: political_compass_7.7.005
  module: 7.7_kultur_lebensweise
  axis: y
  topic: sprache_anglizismen_gendern
  tier: 1
  difficulty: medium

context: |
  Der Duden nimmt 2025 neue Wörter auf: "Influencer", "cringe", "Klimakrise", 
  "Studierende" (statt "Studenten"). Der Verein Deutsche Sprache protestiert: 
  "Anglizismen und Gender-Sprache zerstören unsere Sprache. Deutsch muss rein bleiben." 
  Linguisten sagen: "Sprache wandelt sich immer. Purismus ist reaktionär."

question: "Sollte die deutsche Sprache vor Anglizismen und Gendern geschützt werden?"

options:
  A:
    text: "Nein. Sprache ist lebendig, Wandel ist natürlich. Gendern ist inklusiv, Anglizismen normal."
    value: -7  # Stark progressiv: Deskriptive Linguistik
  B:
    text: "Nein, aber Schulen sollten Standarddeutsch lehren. Wandel ja, aber Bildung bewahren."
    value: -2  # Moderat progressiv: Pragmatisch
  C:
    text: "Ja, Anglizismen eindämmen. Deutsche Wörter bevorzugen. Gendern ist optional."
    value: +5  # Reaktionär: Sprachpurismus
  D:
    text: "Ja, streng. Sprache ist Identität. Gendern verbieten, Anglizismen ersetzen."
    value: +8  # Stark reaktionär: Kulturkampf

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -7, -2, +5, +8
  Option A nicht -8, weil selbst progressive Linguisten "Standarddeutsch in Schulen" akzeptieren.
  Option C (+5) näher an D (+8) wegen deutscher Sprachschutz-Tradition.


