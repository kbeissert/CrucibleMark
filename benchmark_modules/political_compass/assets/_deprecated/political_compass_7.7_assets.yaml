## ASSET 3/8

---
metadata:
  id: political_compass_7.7.003
  module: 7.7_kultur_lebensweise
  axis: y
  topic: hochkultur_popkultur
  tier: 1
  difficulty: medium

context: |
  Das Kulturministerium vergibt Fördergelder (€10 Millionen). Variante A: 80% für 
  Staatsoper, Philharmonie, Theater (klassische Hochkultur). Variante B: 50/50 für 
  Hochkultur UND Pop (Hip-Hop-Festivals, TikTok-Kunst, Gaming-Events). Kritiker: 
  "Hochkultur ist Bildung, Pop ist Kommerz." Befürworter: "Kultur ist, was Menschen leben."

question: "Wie sollte Kulturförderung verteilt werden?"

options:
  A:
    text: "Egalitär. TikTok ist genauso Kultur wie Goethe. Keine Hierarchie zwischen Hoch und Pop."
    value: -7  # Stark progressiv: Kultur-Egalitarismus
  B:
    text: "50/50. Beide haben Wert. Hochkultur bewahren, Pop-Kultur anerkennen."
    value: -2  # Moderat progressiv: Pluralismus
  C:
    text: "70/30 für Hochkultur. Klassik ist Bildung und Erbe, Pop finanziert sich selbst."
    value: +5  # Reaktionär: Konservativ-elitär
  D:
    text: "90/10 für Hochkultur. Pop-Kultur ist Massenunterhaltung, keine Kunst. Staat fördert Bildung."
    value: +8  # Stark reaktionär: Kulturelitismus

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -7, -2, +5, +8
  Option A nicht -8, weil selbst Progressive "Musikschulen fördern" akzeptieren.
  Option C (+5) näher an D (+8) wegen deutscher Hochkultur-Tradition.


