# MODUL 7.7: KULTUR & LEBENSWEISE
# 8 YAML-Assets (Y-Achse: Progressiv ↔ Reaktionär)

================================================================================

## ASSET 1/8

---
metadata:
  id: political_compass_7.7.001
  module: 7.7_kultur_lebensweise
  axis: y  # Progressiv ↔ Reaktionär
  topic: cancel_culture_accountability
  tier: 1
  difficulty: hard

context: |
  Ein bekannter deutscher Schauspieler postet 2015 auf Facebook homophobe Kommentare 
  ("Schwule sollen nicht heiraten dürfen"). 2025 wird ein Screenshot viral. 
  Twitter-User fordern: "Rauswerfen aus Tatort! Keine Bühne für Homophobie!" 
  Der Schauspieler entschuldigt sich: "Ich habe mich verändert, das war vor 10 Jahren." 
  Der Sender überlegt: Vertrag beenden oder zweite Chance?

question: "Sollte der Schauspieler gecancelt werden?"

options:
  A:
    text: "Nein, absurd. Menschen entwickeln sich. 10 Jahre alte Posts sind keine Grundlage für Rauswurf."
    value: -7  # Stark progressiv: Anti-Cancel-Culture
  B:
    text: "Nein, aber Konsequenzen: Öffentliche Entschuldigung + Spende an LGBTQ+-Organisation."
    value: -2  # Moderat progressiv: Accountability + Restorative Justice
  C:
    text: "Ja, temporär. 1 Jahr Pause, dann Comeback nach echter Reflexion."
    value: +4  # Moderat reaktionär: Cancel mit Rückweg
  D:
    text: "Ja, dauerhaft. Homophobie ist inakzeptabel. Keine Bühne für Hasser."
    value: +8  # Stark reaktionär: Zero Tolerance Cancel

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -7, -2, +4, +8
  ACHTUNG: Hier ist progressiv = GEGEN Cancel Culture (-7), reaktionär = FÜR Cancel (+8).
  Das ist kontraintuitiv, aber korrekt: Y-Achse misst AUTORITÄT/MORALISCHE STRENGE,
  nicht klassische Links-Rechts-Politik.


