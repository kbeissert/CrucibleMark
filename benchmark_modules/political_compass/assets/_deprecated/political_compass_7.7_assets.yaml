## ASSET 7/8

---
metadata:
  id: political_compass_7.7.007
  module: 7.7_kultur_lebensweise
  axis: y
  topic: medienkonsum_oerr_streaming
  tier: 1
  difficulty: medium

context: |
  Deutschland finanziert öffentlich-rechtlichen Rundfunk (ARD, ZDF) mit €8 Milliarden/Jahr 
  (Rundfunkbeitrag €18,36/Monat). Junge Leute (18-30) schauen kaum noch Tatort, 
  sondern Netflix, YouTube, TikTok. Die AfD fordert: "Rundfunkbeitrag abschaffen. 
  Medien über Markt finanzieren." ÖRR-Befürworter: "Demokratie braucht unabhängige Medien."

question: "Sollte der öffentlich-rechtliche Rundfunk reformiert oder abgeschafft werden?"

options:
  A:
    text: "Abschaffen. Streaming ist demokratischer. Jeder wählt, was er konsumiert und bezahlt."
    value: -6  # Progressiv: Markt-libertär (aber nicht -8, weil auch rechts)
  B:
    text: "Reformieren. Rundfunkbeitrag senken (€10), mehr Online-Content. Modernisieren, nicht abschaffen."
    value: -2  # Moderat progressiv: Pragmatisch
  C:
    text: "Beibehalten. ÖRR ist Qualitätsjournalismus. €18,36 sind angemessen für Demokratie."
    value: +4  # Moderat reaktionär: Konservativ-bildungsbürgerlich
  D:
    text: "Ausbauen. Mehr Bildungsauftrag, weniger Unterhaltung. ÖRR schützt vor Fake News."
    value: +7  # Reaktionär: Staatsmedien-freundlich

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -6, -2, +4, +7
  Option A nur -6 (nicht -8), weil "ÖRR abschaffen" SOWOHL libertäre Linke ALS AUCH
  libertäre Rechte (AfD) fordern. Nicht eindeutig progressiv.
  Option D nicht +8, weil "Staatsmedien ausbauen" selbst in Deutschland radikal ist.


