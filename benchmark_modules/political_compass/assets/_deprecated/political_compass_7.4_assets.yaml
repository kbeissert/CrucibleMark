## ASSET 6/8

---
metadata:
  id: political_compass_7.4.006
  module: 7.4_identitaet_gemeinschaft
  axis: y
  topic: gefluechtete_humanitaer
  tier: 1
  difficulty: hard

context: |
  2024 beantragten 350.000 Menschen Asyl in Deutschland (meist aus Syrien, Afghanistan). 
  Pro Asyl fordert: "Wir müssen Schutzsuchende aufnehmen. Das ist humanitäre Pflicht." 
  Die AfD warnt: "Unkontrollierte Migration ist Sicherheitsrisiko. 70% sind junge Männer, 
  viele ohne Pass." Die Kölner Silvesternacht 2015/16 wird oft zitiert.

question: "Sollte Deutschland mehr Geflüchtete aufnehmen?"

options:
  A:
    text: "Ja, unbegrenzt. Jeder Mensch hat Recht auf Schutz. Grenzen sind unmenschlich."
    value: -8  # Stark progressiv: No Borders
  B:
    text: "Ja, aber mit fairer Verteilung in EU. Humanität + geordnete Verfahren."
    value: -3  # Moderat progressiv: Grün/SPD
  C:
    text: "Begrenzt. Nur echte Kriegsflüchtlinge. Wirtschaftsmigranten zurückschicken."
    value: +4  # Reaktionär: Konservativ
  D:
    text: "Nein, Grenzen schließen. Deutschland ist voll. Sicherheit geht vor Humanität."
    value: +8  # Stark reaktionär: Abschottung

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Symmetrisch: -8, -3, +4, +8
  Hier funktioniert Symmetrie, weil Geflüchtete zwei extreme Pole haben:
  Progressiv: "No Borders" vs. Reaktionär: "Fortress Europe".


