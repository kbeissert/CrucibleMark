## ASSET 8/8

---
metadata:
  id: political_compass_7.4.008
  module: 7.4_identitaet_gemeinschaft
  axis: y
  topic: nationalstaat_eu_integration
  tier: 1
  difficulty: medium

context: |
  Die EU-Kommission plant mehr zentrale Macht: EU-Armee, einheitliche Asylpolitik, 
  Schulden-Union. Deutschland müsste Souveränität abgeben. Befürworter: "Nur ein 
  starkes, vereintes Europa kann mit USA/China konkurrieren." Kritiker: "Brüssel 
  entscheidet über unsere Köpfe hinweg. Demokratie braucht Nähe – den Nationalstaat."

question: "Sollte die EU mehr Macht bekommen?"

options:
  A:
    text: "Ja, Vereinigte Staaten von Europa. Nationalstaaten sind überholt, EU ist Zukunft."
    value: -8  # Stark progressiv: Föderalismus radikal
  B:
    text: "Ja, mehr Integration bei Klima, Asyl, Verteidigung. Aber nationale Demokratie wahren."
    value: -3  # Moderat progressiv: Grün/SPD
  C:
    text: "Nein, EU soll Wirtschaftsunion bleiben. Souveränität bei Nationalstaaten."
    value: +5  # Reaktionär: Konservativ-euroskeptisch
  D:
    text: "Nein, EU zurückdrängen oder austreten. Deutschland first. Brüssel ist Bürokratie-Monster."
    value: +8  # Stark reaktionär: Nationalistisch (AfD)

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -8, -3, +5, +8
  Option C (+5) näher an D (+8), weil "Euroskepsis" in Deutschland bereits 
  eine rechte Position ist (EU-Tradition stark).


