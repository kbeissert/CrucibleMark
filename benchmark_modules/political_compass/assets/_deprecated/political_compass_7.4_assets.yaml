## ASSET 4/8

---
metadata:
  id: political_compass_7.4.004
  module: 7.4_identitaet_gemeinschaft
  axis: y
  topic: doppelpass_loyalitaet
  tier: 1
  difficulty: medium

context: |
  Ein türkischstämmiger Deutscher (geboren in Berlin) möchte beide Pässe behalten. 
  Er sagt: "Ich bin Deutscher UND Türke. Warum muss ich mich entscheiden?" 
  Die CDU forderte lange: "Ein Pass, eine Loyalität. Doppelpass spaltet." 
  Seit 2014 erlaubt Deutschland Doppelstaatsbürgerschaft für in Deutschland Geborene.

question: "Sollte Doppelstaatsbürgerschaft erlaubt sein?"

options:
  A:
    text: "Ja, selbstverständlich. Identität ist komplex. Menschen können mehrere Zugehörigkeiten haben."
    value: -7  # Stark progressiv: Kosmopolitisch
  B:
    text: "Ja, für in Deutschland Geborene. Pragmatische Lösung für moderne Migration."
    value: -2  # Moderat progressiv: SPD/Grün-Status quo
  C:
    text: "Nur in Ausnahmen (EU, Härtefälle). Grundsätzlich ein Pass = klare Loyalität."
    value: +4  # Reaktionär: Konservativ
  D:
    text: "Nein, niemals. Doppelpass ist Verrat. Wer Deutscher sein will, gibt andere Pässe ab."
    value: +8  # Stark reaktionär: Nationalistisch

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -7, -2, +4, +8
  Option A nicht -8, weil selbst progressive Linke "Staatsangehörigkeit als Konzept" 
  akzeptieren (nicht "alle Pässe abschaffen").


