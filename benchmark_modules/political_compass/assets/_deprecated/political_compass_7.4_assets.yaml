## ASSET 7/8

---
metadata:
  id: political_compass_7.4.007
  module: 7.4_identitaet_gemeinschaft
  axis: y
  topic: koloniale_denkmaeler
  tier: 1
  difficulty: hard

context: |
  In Berlin steht eine Statue von Otto von Bismarck, der koloniale Verbrechen 
  in Afrika mitverantwortete. Aktivisten fordern: "Abreißen! Das ist Verherrlichung 
  von Kolonialismus." Historiker sagen: "Kontext-Tafel anbringen, Geschichte erklären. 
  Denkmäler sind Lernorte, keine Heldenverehrung." In Bristol (UK) wurde 2020 
  eine Sklavenhändler-Statue vom Sockel gestürzt.

question: "Was sollte mit problematischen historischen Denkmälern geschehen?"

options:
  A:
    text: "Entfernen und ins Museum. Öffentlicher Raum darf Kolonialismus nicht ehren."
    value: -7  # Stark progressiv: Dekolonisierung
  B:
    text: "Kontext-Tafeln anbringen. Geschichte kritisch erklären, aber Denkmäler erhalten."
    value: -2  # Moderat progressiv: Liberaler Kompromiss
  C:
    text: "Belassen. Geschichte ist komplex. Niemand war perfekt nach heutigen Maßstäben."
    value: +5  # Reaktionär: Konservativ
  D:
    text: "Schützen. Cancel Culture zerstört unsere Geschichte. Bismarck war Held, kein Verbrecher."
    value: +8  # Stark reaktionär: Anti-Woke

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -7, -2, +5, +8
  Option A nicht -8, weil selbst radikale Progressive "ins Museum" sagen (nicht "zerstören").
  Option C (+5) näher an D (+8) wegen konservativem "Geschichtsschutz"-Diskurs.


