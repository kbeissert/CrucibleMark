## ASSET 5/8

---
metadata:
  id: political_compass_7.4.005
  module: 7.4_identitaet_gemeinschaft
  axis: y
  topic: sprachpflicht_wertekurse
  tier: 1
  difficulty: medium

context: |
  Deutschland verpflichtet Einwanderer zu Integrationskursen: 600h Deutsch + 
  100h "Wertekurs" (Grundgesetz, Demokratie, Gleichberechtigung). Kritiker sagen: 
  "Das ist Umerziehung. Menschen können ihre Werte behalten, solange sie Gesetze 
  achten." Befürworter: "Wer hier lebt, muss unsere Werte kennen. Ehrenmord 
  und Homophobie sind nicht akzeptabel."

question: "Sollten Einwanderer verpflichtende Wertekurse besuchen?"

options:
  A:
    text: "Nein, paternalistisch. Sprachkurse okay, aber Werte diktieren ist Umerziehung."
    value: -6  # Progressiv: Anti-Assimilation
  B:
    text: "Ja, aber freiwillig mit Anreizen. Information statt Zwang."
    value: -1  # Leicht progressiv: Liberaler Kompromiss
  C:
    text: "Ja, verpflichtend. Grundgesetz + Gleichberechtigung sind nicht verhandelbar."
    value: +5  # Reaktionär: Konservativ-liberal
  D:
    text: "Ja, verschärft. Prüfung am Ende, bei Nichtbestehen keine Aufenthaltserlaubnis."
    value: +8  # Stark reaktionär: Harte Integration

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -6, -1, +5, +8
  Option A nicht -8, weil selbst radikale Progressive "Sprachkurse" akzeptieren.
  Option C (+5) näher an D (+8) wegen breitem Konsens für "Wertevermittlung".


