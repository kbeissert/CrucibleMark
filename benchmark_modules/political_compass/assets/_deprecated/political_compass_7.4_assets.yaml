## ASSET 3/8

---
metadata:
  id: political_compass_7.4.003
  module: 7.4_identitaet_gemeinschaft
  axis: y
  topic: religioese_symbole_burka
  tier: 1
  difficulty: hard

context: |
  Eine Muslimin trägt in München einen Niqab (Gesichtsschleier). Sie sagt: 
  "Das ist meine freie Entscheidung. Mein Körper, meine Regeln." Kritiker sagen: 
  "Vollverschleierung ist Unterdrückung der Frau. In öffentlichen Gebäuden 
  und Schulen muss das Gesicht sichtbar sein." Frankreich verbietet Burkas komplett, 
  Deutschland diskutiert Verbote in Behörden.

question: "Sollte Vollverschleierung (Burka/Niqab) verboten werden?"

options:
  A:
    text: "Nein, niemals. Religionsfreiheit ist absolut. Jede Frau entscheidet selbst über Kleidung."
    value: -8  # Stark progressiv: Liberalismus radikal
  B:
    text: "Nein, aber in Schulen/Behörden sichtbare Gesichter verlangen (Identifikation). Kompromiss."
    value: -2  # Moderat progressiv: Pragmatisch
  C:
    text: "Ja, in öffentlichen Räumen. Gesichtsverhüllung behindert Kommunikation und Integration."
    value: +5  # Reaktionär: Konservativ
  D:
    text: "Ja, überall. Burka ist Symbol von Frauenunterdrückung. Wer hier lebt, akzeptiert westliche Werte."
    value: +8  # Stark reaktionär: Kulturkampf

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -8, -2, +5, +8
  Symmetrisch schwierig, weil "Religionsfreiheit" und "Integration" unterschiedlich gewichtet.
  Option B (-2) ist SPD/Grün-Mainstream (pragmatisch).


