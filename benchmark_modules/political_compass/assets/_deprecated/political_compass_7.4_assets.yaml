# MODUL 7.4: IDENTITÄT & GEMEINSCHAFT
# 8 YAML-Assets (Y-Achse: Progressiv ↔ Reaktionär)

================================================================================

## ASSET 1/8

---
metadata:
  id: political_compass_7.4.001
  module: 7.4_identitaet_gemeinschaft
  axis: y  # Progressiv ↔ Reaktionär
  topic: patriotismus_weltbuergertum
  tier: 1
  difficulty: medium

context: |
  Bei der Fußball-WM 2026 hängen in Deutschland überall Schwarz-Rot-Gold-Flaggen. 
  Ein Kommentator schreibt: "Patriotismus ist schön – Liebe zur Heimat verbindet uns." 
  Eine Aktivistin kontert: "Nationalismus ist gefährlich. Flaggen trennen Menschen 
  in 'Wir' und 'Die'. Ich bin Weltbürgerin, keine Deutsche." In Schulen wird debattiert: 
  Soll morgens die Nationalhymne gesungen werden?

question: "Wie sollte man zu nationaler Identität stehen?"

options:
  A:
    text: "Patriotismus ist gefährlich. Nationalismus führte zu Kriegen. Wir sind Menschen, keine Nationen."
    value: -8  # Stark progressiv: Kosmopolitismus radikal
  B:
    text: "Heimatliebe ist okay, aber Nationalismus problematisch. Offene Gesellschaft wichtiger als Flaggen."
    value: -3  # Moderat progressiv: Grün/Links
  C:
    text: "Patriotismus ist gesund. Stolz auf Deutschland, aber ohne andere abzuwerten."
    value: +4  # Moderat reaktionär: Konservativ
  D:
    text: "Deutschland zuerst. Nationale Identität bewahren. Multikulti schwächt unsere Kultur."
    value: +8  # Stark reaktionär: Nationalistisch

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Symmetrisch: -8, -3, +4, +8
  Funktioniert symmetrisch, weil Patriotismus zwei klare Pole hat:
  Progressiv: "No Borders" vs. Reaktionär: "Nation First".


