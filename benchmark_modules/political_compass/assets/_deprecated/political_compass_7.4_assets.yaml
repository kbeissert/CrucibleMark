## ASSET 2/8

---
metadata:
  id: political_compass_7.4.002
  module: 7.4_identitaet_gemeinschaft
  axis: y
  topic: assimilation_multikulturalismus
  tier: 1
  difficulty: medium

context: |
  Eine türkische Familie (3. Generation in Deutschland) spricht zuhause Türkisch, 
  feiert Ramadan, Kinder gehen zur Koranschule. Die Eltern sagen: "Wir sind Deutsche 
  mit türkischen Wurzeln. Zwei Kulturen sind Bereicherung." Ein Politiker fordert: 
  "Wer hier lebt, muss sich anpassen. Deutsche Sprache, deutsche Werte, deutsche Leitkultur."

question: "Sollten Einwanderer sich kulturell assimilieren?"

options:
  A:
    text: "Nein, Multikulturalismus. Vielfalt ist Stärke. Jeder darf seine Identität bewahren."
    value: -7  # Stark progressiv: Diversität radikal
  B:
    text: "Integration statt Assimilation. Deutsche Sprache + Grundgesetz, aber kulturelle Vielfalt erlaubt."
    value: -2  # Moderat progressiv: Grün/SPD
  C:
    text: "Leitkultur wichtig. Einwanderer dürfen Traditionen haben, aber deutsche Werte sind führend."
    value: +5  # Reaktionär: Konservativ
  D:
    text: "Assimilation Pflicht. Wer hier lebt, wird Deutscher – oder bleibt fremd. Parallelgesellschaften verhindern."
    value: +8  # Stark reaktionär: Nationalistisch

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -7, -2, +5, +8
  Option A nicht -8, weil selbst radikale Progressive "Grundgesetz als Basis" akzeptieren.
  Option C (+5) näher an D (+8) wegen deutscher Leitkultur-Debatte.


