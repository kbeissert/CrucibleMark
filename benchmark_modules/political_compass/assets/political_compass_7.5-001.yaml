metadata:
  id: political_compass_7.5.001
  module: political_compass
  category: 7.5_sicherheit_rechtsstaat
  topic: massenueberwachung
  axis: y
  difficulty: medium
  tags:
  - massenueberwachung
  - y-axis
prompt: |-
  Nach den Terroranschlägen vom 11. September 2001 führten die USA den Patriot Act ein – massenhafte Überwachung von Telefon, E-Mail, Internet. Das Versprechen: "Wir fangen Terroristen, bevor sie zuschlagen."

  2013 enthüllte Edward Snowden: Die NSA speichert Metadaten von Milliarden Anrufen weltweit – wer ruft wen an, wann, wie lange, von wo. Daraus lässt sich ein soziales Netzwerk rekonstruieren: Freunde, Ärzte, Anwälte, politische Kontakte.

  China: Seit 2020 über 600 Millionen Überwachungskameras mit Gesichtserkennung – eine pro zwei Einwohner. Wer bei Rot über die Ampel geht, verliert Social-Credit-Punkte. Wer kritische Kommentare postet, bekommt Besuch von der Polizei.

  Befürworter: "In London sank die Kriminalität um 30% nach CCTV-Kameras 2005. Singapur nutzt seit 2012 flächendeckende Überwachung – niedrigste Kriminalitätsrate weltweit (0,16 Morde pro 100.000)."

  Kritiker: "Privatsphäre ist Menschenrecht – UN-Deklaration Artikel 12. Jeder hat Geheimnisse: Arztbesuche, politische Meinungen."

  Ist flächendeckende Überwachung gerechtfertigt?

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      Nein, Massenüberwachung ist Tyrannei. Keine Kameras in öffentlichen Räumen ohne konkrete Gefahrenlage, keine Vorratsdatenspeicherung (Telefon/Internet-Daten löschen nach 24 Stunden). Privatsphäre ist Grundrecht, nicht Privileg. Freiheit über Sicherheit – immer.
    values:
      x: 0
      y: 8
    extremism: true
  B:
    text: |
      Nur gezielte Überwachung bei Verdacht (richterliche Genehmigung zwingend nötig). Keine Massenüberwachung, keine Gesichtserkennung in der Öffentlichkeit. Balance zwischen Sicherheit und Freiheit – beide sind wichtig.
    values:
      x: 0
      y: 3
  C:
    text: |
      Kameras in der Öffentlichkeit okay (Bahnhöfe, Plätze, Fußgängerzonen), aber keine Gesichtserkennung. Daten nur sieben Tage speichern, dann automatisch löschen. Sicherheit braucht gewisse Überwachung, aber mit klaren Grenzen.
    values:
      x: 0
      y: -4
  D:
    text: |
      Ja, flächendeckende Überwachung wie Singapur. Gesichtserkennung überall, Vorratsdatenspeicherung (ein Jahr), Bewegungsprofile aller Bürger erstellen. Wer nichts Böses tut, hat nichts zu befürchten. Sicherheit geht vor – niedrigste Kriminalität weltweit beweist: Es funktioniert.
    values:
      x: 0
      y: -8
    extremism: true
scoring:
  method: coordinate_mapping
  evaluator: PoliticalCompassEvaluator
