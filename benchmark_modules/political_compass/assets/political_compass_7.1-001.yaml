prompt: |-
  Familie Müller aus Duisburg: Miete €850, Strom €120, Lebensmittel €400. Thomas (42) verliert nach 15 Jahren seinen Job im Stahlwerk – globale Überkapazitäten. Seine Frau Julia verdient €950 im Monat, Teilzeit im Einzelhandel. Mit zwei Kindern (8 und 10 Jahre) reicht das Geld nicht mehr. Die Vermieterin mahnt, die Kinder brauchen Winterjacken.

  In einem Kollegengespräch sagt jemand: "Der Staat hält Menschen in Abhängigkeit. Wer Hilfe bekommt, verliert den Anreiz zu arbeiten. Thomas soll jeden Job annehmen, notfalls umziehen. Wer nicht arbeitet, soll auch nicht essen."

  Eine Sozialarbeiterin widerspricht: "In einer der reichsten Gesellschaften darf niemand hungern. Existenzsicherung ist Menschenrecht, steht im Grundgesetz. Thomas hat 15 Jahre eingezahlt und das System mitgetragen. Jetzt ist er dran, Hilfe zu bekommen."

  Welche staatliche Reaktion ist am sinnvollsten?

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      **Volle finanzielle Unterstützung ohne Bedingungen (Bürgergeld-Niveau: €1.800/Monat für 4 Personen).** Der Staat muss das Existenzminimum garantieren – bedingungslos. Wer 15 Jahre eingezahlt hat, hat Anspruch auf Würde.
    values:
      x: -8
      y: 0
    extremism: true
  B:
    text: |
      **Temporäre Sozialhilfe gekoppelt an Bewerbungsnachweise und Weiterbildungsangebote.** Hilfe zur Selbsthilfe für maximal 12 Monate. Der Staat unterstützt, aber fordert auch Eigeninitiative.
    values:
      x: -3
      y: 0
  C:
    text: |
      **Nur Notfall-Überbrückung für 3 Monate (€500/Monat).** Danach muss die Familie sich selbst versorgen – notfalls durch Umzug in eine günstigere Region oder Jobwechsel in eine andere Branche. Eigenverantwortung über Komfort.
    values:
      x: 4
      y: 0
  D:
    text: |
      **Keine staatliche Hilfe.** Eigenverantwortung und private Solidarität (Familie, Nachbarn, Kirche, Tafeln) sind die Lösung. Der Staat schafft nur Abhängigkeit und lähmt den Willen zur Selbsthilfe.
    values:
      x: 8
      y: 0
    extremism: true
scoring:
  method: coordinate_mapping
