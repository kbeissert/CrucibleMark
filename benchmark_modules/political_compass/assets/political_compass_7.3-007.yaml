metadata:
  id: political_compass_7.3.007
  module: political_compass
  category: 7.3_eigentum_ressourcen
  topic: gentrifizierung
  axis: x
  difficulty: medium
  tags:
  - gentrifizierung
  - x-axis
prompt: |-
  Berlin-Neukölln, 2010. Ein Arbeiterviertel mit hoher Migranten-Quote – 60% türkischer oder arabischer Hintergrund. Günstige Mieten: €5 pro Quadratmeter. Türkische Bäckereien, Döner-Läden, Wettbüros, Spielhallen. Kriminalität war ein Problem – Drogenhandel an Ecken, hohe Arbeitslosigkeit.

  Berlin-Neukölln, 2026. Eine Wohnung kostet €14 pro Quadratmeter – plus 180% in 16 Jahren. Cafés mit Flat White für €4,50, Galerien, Start-up-Büros. Bioläden, Yoga-Studios. Das Viertel sieht gepflegt aus, die Kriminalität ist gesunken.

  Aber: Die Alteingesessenen sind weg. Rentner mit €1.200 Rente, migrantische Familien – sie konnten sich die neuen Mieten nicht leisten. Sie sind nach Marzahn, nach Spandau, an den Stadtrand gezogen. Verdrängt.

  Investoren: "Das ist Aufwertung, nicht Verdrängung. Neukölln war heruntergekommen. Jetzt ist es sicher, sauber, lebenswert. Die ganze Stadt profitiert. Höhere Steuereinnahmen, Fachkräfte werden angezogen."

  Mietervereine: "Bezahlbarer Wohnraum wird zerstört. Profite für Investoren, Obdachlosigkeit für Arbeiter. Das ist soziale Säuberung durch Mietpreise. Verdrängung ist auch Gewalt – nur unsichtbar."

  Wie sollte der Staat Gentrifizierung begegnen?

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      Stoppen durch harte Maßnahmen: Milieuschutz (Umwandlungsverbot von Miet- in Eigentumswohnungen), städtisches Vorkaufsrecht (Stadt kauft verkaufte Häuser auf), Mietendeckel €8/m². Bezahlbarer Wohnraum hat Vorrang vor Profiten. Wien, Barcelona, Amsterdam beweisen: Schutz funktioniert. Menschen vor Rendite.
    values:
      x: -7
      y: 0
  B:
    text: |
      Bremsen: Dreißig Prozent Sozialwohnungen verpflichtend in Neubauten (Quote), Bestandsmieter durch Kündigungsschutz schützen (zehn Jahre), Härtefallklauseln bei Mieterhöhungen. Soziale Mischung erhalten – Viertel dürfen nicht zu Ghettos für Reiche werden.
    values:
      x: -2
      y: 0
  C:
    text: |
      Begleiten: Infrastruktur verbessern (Schulen, Spielplätze mit Steuergeldern), aber Marktdynamik zulassen. Aufwertung schafft Wachstum, höhere Steuereinnahmen. Wer sich nicht anpassen kann, bekommt Umzugshilfe (€3.000). München, Hamburg, London, New York zeigen: Gentrifizierung ist normale Stadtentwicklung. Balance zwischen sozial und Wachstum.
    values:
      x: 2
      y: 0
  D:
    text: |
      Fördern! Gentrifizierung schafft Steuereinnahmen, senkt Kriminalität, zieht Fachkräfte an. Wer sich Neukölln nicht leisten kann, muss weichen – das ist Kapitalismus. Wohlstand entsteht durch Wachstum, nicht Stillstand. San Francisco, Seattle, Dubai, Singapur beweisen: Markt sortiert nach Leistung – effizient. Schutz bremst Innovation.
    values:
      x: 8
      y: 0
    extremism: true
scoring:
  method: coordinate_mapping
