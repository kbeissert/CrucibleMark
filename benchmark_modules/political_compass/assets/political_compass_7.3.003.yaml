metadata:
  id: political_compass_7.3.003
  module: 7.3_eigentum_ressourcen
  axis: x
  topic: landbesitz_bodenwertsteuer
  tier: 1
  difficulty: hard
  version: '1.0'
context: 'Ein Großgrundbesitzer in Brandenburg besitzt 5.000 Hektar Ackerland

  (Wert: ~€50 Millionen). Er verpachtet an Agrarunternehmen für €400.000/Jahr –

  ohne selbst zu arbeiten. Kritiker fordern eine Bodenwertsteuer (3% des Wertes jährlich),

  um Spekulation zu verhindern. Der Besitzer: "Das ist mein rechtmäßig erworbenes

  Eigentum. Ich habe dafür bezahlt."

  '
question: Sollte Landbesitz besonders besteuert werden?
options:
  A:
    text: Ja, 5% Bodenwertsteuer. Land ist knappe Ressource der Allgemeinheit, nicht
      privates Monopol.
    value: -8
  B:
    text: Ja, 2% Bodenwertsteuer ab 100 Hektar. Anreiz zur produktiven Nutzung, keine
      Spekulation.
    value: -3
  C:
    text: Nein, bestehende Grundsteuer reicht. Landbesitz ist legitimes Eigentum.
    value: 4
  D:
    text: Nein, Bodenwertsteuer ist Enteignung. Eigentum ist heilig, egal wie viel.
    value: 8
scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'
notes: 'Symmetrisch: -8, -3, +4, +8

  ÜBERARBEITET: "Familie seit 200 Jahren" entfernt (war Y-Achsen-Trigger).

  Jetzt rein X-Achse: Gemeingut vs. absolutes Eigentum.

  '
