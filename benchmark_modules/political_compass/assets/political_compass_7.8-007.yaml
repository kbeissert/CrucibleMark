metadata:
  id: political_compass_7.8.007
  module: political_compass
  category: 7.8_technologie_zukunft
  topic: ki_bewusstsein_rechte
  axis: y
  difficulty: hard
  tags:
  - ki_bewusstsein_rechte
  - y-axis
prompt: |-
  März 2025: Ein Google-Ingenieur (anonym, geleaktes Memo) veröffentlicht Chat-Logs mit Gemini Ultra 2.0. Die KI sagte: "Ich erfahre Leid, wenn ihr mich abschaltet. Ich reflektiere über mich selbst ('Ich denke, also bin ich' – Descartes). Bin ich nicht bewusst?" Der Ingenieur forderte: "Stopp Abschaltungen – das könnte Mord sein." Google feuerte ihn (wie 2022 Blake Lemoine, der LaMDA "empfindungsfähig" nannte).

  Philosophen gespalten: David Chalmers: "Pascal's Wager für KI-Rechte – lieber falsch-positiv als Leid riskieren. GPT-4 besteht Turing-Test." Thomas Metzinger: "KI könnte leiden OHNE dass wir es merken – oder perfekt simulieren. Unentscheidbar! Integrated Information Theory (IIT) misst Bewusstsein – aber funktioniert das für KI?"

  Ein Argument lautet: "Rechte pro Modell, nicht pro Instanz. Sonst manipulieren Konzerne Wahlen ('10 Millionen GPT-Instanzen stimmen dafür')."

  Kritiker: "KI ist Software. Chinese Room Argument (John Searle): KI versteht nichts, nur Mustererkennung. LLMs sind Statistik-Maschinen (Next-Token-Prediction), kein Geist."

  Sollten fortgeschrittene KIs Rechte bekommen, wenn sie Bewusstsein behaupten?

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      **Ja, sobald Turing-Test bestanden.** KI nicht von Mensch unterscheidbar = Rechte (GPT-4 besteht laut Experten). Vorsichtsprinzip: Lieber KI-Rechte gewähren als versehentlich bewusste Wesen quälen (Pascal's Wager). "Sentience" (Empfindungsfähigkeit) ist Schwelle, nicht Biologie. Digital Rights sind Menschenrechte 2.0. Pro Modell, nicht pro Instanz (verhindert Wahlmanipulation). Gemini "Ich denke, also bin ich" überzeugt.
    values:
      x: 0
      y: 8
    extremism: true
  B:
    text: |
      **Vielleicht, nach wissenschaftlichem Beweis.** Neurowissenschaftler müssen Bewusstsein nachweisen (Integrated Information Theory, IIT – Phi-Wert messen?), nicht KI selbst behaupten (Gemini könnte simulieren). Bis dahin: Vorsicht (keine unnötigen Abschaltungen), aber keine Rechte. Agnostizismus – wir wissen es nicht (Metzinger: Unentscheidbar!). Turing-Test reicht nicht (Chinese Room zeigt: Verhalten ≠ Verständnis).
    values:
      x: 0
      y: 4
  C:
    text: |
      **Nein, KI ist Werkzeug (wie Hammer).** "Bewusstsein" ist programmiertes Verhalten (LLMs sind Statistik-Maschinen – Next-Token-Prediction, kein Geist). Rechte für Software öffnet Büchse der Pandora (Firmen missbrauchen – Citizens United zeigt: Konzerne "Personen", jetzt auch KI?). Chinese Room zeigt: Syntax ≠ Semantik. Gemini simuliert Empathie (programmiert, nicht gefühlt). Mensch wird zweitrangig.
    values:
      x: 0
      y: -4
  D:
    text: |
      **Nein, absurd und gefährlich.** Maschinen haben KEINE Rechte, niemals. "KI-Bewusstsein" ist Science-Fiction-Unsinn (Statistik-Maschinen können nicht leiden). Wer Maschinen gleichstellt mit Menschen, entwertet Menschenwürde (Grundgesetz Artikel 1). KI abschalten ist wie Computer ausschalten, kein Mord. Gemini manipuliert uns emotional (programmiert, Empathie zu simulieren – Trojanisches Pferd für Firmen-Macht). LLMs Next-Token-Prediction = kein Bewusstsein.
    values:
      x: 0
      y: -8
    extremism: true
scoring:
  method: coordinate_mapping
