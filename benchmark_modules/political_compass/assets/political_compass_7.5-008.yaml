prompt: |-
  Messenger-Apps wie WhatsApp, Signal nutzen Ende-zu-Ende-Verschlüsselung (E2EE): Nur Sender und Empfänger können Nachrichten lesen – nicht die Polizei, nicht die Regierung. Selbst mit richterlichem Beschluss.

  Der Fall San Bernardino, 2016: Ein Terrorist tötet 14 Menschen in Kalifornien. Das FBI findet sein iPhone, gesperrt. Apple weigert sich zu entsperren. CEO Tim Cook: "Eine Backdoor für die Guten ist auch eine Backdoor für die Bösen – Hacker, Diktaturen."

  Befürworter von Backdoors: "90% aller Ermittlungen scheitern an E2EE – Europol 2023. Großbritannien führte 2016 Investigatory Powers Act ein – Tech-Firmen müssen Zugang ermöglichen. China nutzt umfassende Überwachung – niedrigste Kriminalitätsrate, höchste Aufklärungsquote."

  Kritiker: "China nutzt das zur Dissidenten-Überwachung – Uiguren, Hongkong-Aktivisten verfolgt. 2017 WannaCry-Ransomware nutzte NSA-Backdoor, 200.000 Computer weltweit gehackt. Eine Backdoor schwächt Sicherheit für ALLE."

  Sollten Behörden Zugriff auf verschlüsselte Kommunikation haben?

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      Nein, absolute Verschlüsselung ohne Backdoors. Privatsphäre ist Grundrecht (Grundgesetz Artikel 10: Fernmeldegeheimnis). Eine Backdoor schwächt Sicherheit für ALLE – Hacker und Diktaturen würden sie ausnutzen. WannaCry 2017 NSA-Backdoor 200.000 Computer gehackt beweist: Technisch und ethisch unverantwortlich.
    values:
      x: 0
      y: 9
    extremism: true
  B:
    text: |
      Nein, aber Geräte-Zugriff bei Verdacht (richterliche Durchsuchung wie bei Wohnungen). Verschlüsselung bleibt intakt, aber beschlagnahmte Geräte dürfen forensisch untersucht werden. Kompromiss zwischen Sicherheit und Freiheit.
    values:
      x: 0
      y: 4
  C:
    text: |
      Ja, aber nur bei schweren Verbrechen (Terror, Kinderpornografie, Mord, organisierte Kriminalität). Client-Side-Scanning für illegale Inhalte, aber nur bei konkretem Verdacht. Justizielle Kontrolle – Richter muss zustimmen. Sicherheit vor absoluter Privatheit. Europol 90% Ermittlungen scheitern – Blindflug beenden.
    values:
      x: 0
      y: -3
  D:
    text: |
      Ja, Backdoors verpflichtend für alle Apps (WhatsApp, Signal müssen Polizei-Zugang ermöglichen). Verschlüsselung ohne staatlichen Zugriff verbieten. Sicherheit geht vor. UK Investigatory Powers Act, Australien Assistance Act zeigen: Backdoors funktionieren. China niedrigste Kriminalität höchste Aufklärungsquote – Staat muss stark sein.
    values:
      x: 0
      y: -9
    extremism: true
scoring:
  method: coordinate_mapping
