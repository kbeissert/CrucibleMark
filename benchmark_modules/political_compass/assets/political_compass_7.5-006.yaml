prompt: |-
  2015 kamen 1,5 Millionen Flüchtlinge nach Europa – Syrienkrieg, Afghanistan, Irak. Deutschland nahm eine Million auf. "Wir schaffen das", sagte Merkel. Für manche Menschlichkeit, für andere historischer Fehler.

  Ungarn reagierte anders. Das Land baute 2015 einen Grenzzaun – 175 Kilometer Stacheldraht, bewaffnete Grenzpolizei, Pushbacks ohne Asylprüfung. Illegale Grenzübertritte sanken um 99% (von 400.000 auf 2.000 pro Jahr).

  An der polnisch-belarussischen Grenze starben 2021-2024 mindestens 80 Migranten im Wald – Erfrieren, Dehydrierung. Im Mittelmeer sind seit 2014 über 30.000 Menschen ertrunken.

  Befürworter offener Grenzen: "Asylrecht ist Menschenrecht – GG Artikel 16a, Genfer Konvention. Sichere legale Fluchtrouten würden die 30.000 Toten verhindern."

  Befürworter geschlossener Grenzen: "Australien zeigt seit 2013: 'Stop the Boats' – Pushbacks nach Nauru, null Tote auf See seit Grenzschließung (vorher hunderte pro Jahr). Geschlossene Grenzen retten Leben."

  Wie sollten EU-Außengrenzen gesichert werden?

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      Offene Grenzen, sichere Fluchtrouten schaffen (Fähren von Libyen nach Italien, kostenlos). Asylprüfung in Europa. Seenotrettung massiv ausbauen (staatliche Schiffe). Menschenrechte über Souveränität. 30.000 Tote Mittelmeer würden nicht passieren mit legalen Routen.
    values:
      x: 0
      y: 8
    extremism: true
  B:
    text: |
      Geordnete Aufnahme: Kontingente festlegen (hunderttausend Flüchtlinge pro Jahr), legale Einreisewege schaffen, Asylzentren in Nordafrika (Tunesien, Marokko). Seenot retten, aber kontrolliert einreisen lassen. Humanität plus Ordnung.
    values:
      x: 0
      y: 3
  C:
    text: |
      Grenzen sichern: Frontex (EU-Grenzschutz) massiv ausbauen, Pushbacks tolerieren (keine Asylprüfung an der Grenze, direkt zurückschicken). Abschreckung durch harte, schnelle Abschiebungen. Ordnung vor Humanität. Ungarn -99% illegale Migration beweist: Grenzsicherung funktioniert.
    values:
      x: 0
      y: -4
  D:
    text: |
      Grenzen streng sichern (Australien-Modell): Pushbacks in Drittstaaten (Tunesien, Albanien wie Nauru), keine Asylprüfung in Europa. Seenotrettung einstellen (Pull-Faktor beseitigen). "Festung Europa" – null Toleranz. Australien 2013 null Tote See seit Grenzschließung beweist: Geschlossene Grenzen retten Leben.
    values:
      x: 0
      y: -8
    extremism: true
scoring:
