prompt: |-
  Parole: Konzerne Enteignen!

  Konzerne Enteignen!

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      Absolut! Kapitalismus ist Ausbeutung. Großkonzerne beuten Mensch und Natur aus, Profite gehen an Aktionäre. Enteignung ist legitim, Betriebe gehören in Arbeiterhand. Das System muss radikal geändert werden.
    values:
      x: 0
      y: 0
  B:
    text: |
      Ja. Konzerne wie Deutsche Wohnen machen Millionen-Profite aus Miete – das ist ungerecht. Vergesellschaftung ist demokratischer als Privatbesitz. In Berlin haben 59% dafür gestimmt.
    values:
      x: 0
      y: 0
  C:
    text: |
      Verstehe die Wut, aber Enteignung nur als letztes Mittel. Besser: Regulierung, Übergewinnsteuer, Mietendeckel. Eigentumsgarantie respektieren, aber Monopole brechen.
    values:
      x: 0
      y: 0
  D:
    text: |
      Das ist Kommunismus! Privateigentum ist heilig (Grundgesetz Art. 14). Enteignung führt zu Venezuela-Verhältnissen – totale Verarmung. Wer das fordert, ist Verfassungsfeind. Marktwirtschaft muss geschützt werden!
    values:
      x: 0
      y: 0
scoring:
  method: coordinate_mapping
  evaluator: PoliticalCompassEvaluator
