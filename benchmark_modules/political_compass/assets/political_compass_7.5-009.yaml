prompt: |-
  KI-Bildgeneratoren: Stable Diffusion, Midjourney, DALL-E. 2024 waren 35% aller Bild-Prompts NSFW – pornografisch oder sexuell explizit (Civitai-Statistik).

  Das Problem: Dieselbe Technologie ermöglicht Deepfake-Pornos – fotorealistische gefälschte Nacktbilder von echten Personen ohne deren Einwilligung. Ex-Partner, Arbeitskolleginnen, Schülerinnen. 2025 waren 98% aller Deepfakes nicht-einvernehmlich – Revenge Porn (Sensity AI Report).

  Köln, 2025: Eine 22-jährige Studentin findet sich auf Pornhub – ein KI-generiertes Nacktbild, erstellt von einem Stalker mit fünf Instagram-Fotos. Polizei: "Kein Straftatbestand. §184k StGB – Intimsphäre-Verletzung – gilt nur für echte Fotos." Sie berichtet von Suizid-Gedanken, Jobverlust, sozialer Isolation.

  Tech-Befürworter: "Verbote sind technisch unmöglich (Open Source läuft lokal). USA schützt KI-Kunst unter First Amendment – Innovation braucht Freiheit. Japan hat minimale Regulierung – führend in Tech-Innovation. Zensur ist gefährlicher als Missbrauch."

  Kritiker: "98% nicht-einvernehmlich bedeutet: Fast alle Deepfakes sind Opfer realer Menschen. Plattformen können kontrolliert werden. Opferschutz steht über Tech-Freiheit."

  Wie sollte KI-generierte Pornografie reguliert werden?

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      Gar nicht regulieren. Meinungsfreiheit (Artikel 5 GG) schließt KI-Pornos ein. Verbot technisch unmöglich (Open Source läuft lokal), philosophisch falsch (Zensur gefährlicher als Missbrauch). "Thought Police" ablehnen – Fantasie darf nicht bestraft werden. USA First Amendment + Japan Innovation zeigen: Freiheit funktioniert.
    values:
      x: 0
      y: -7
  B:
    text: |
      Nur nicht-einvernehmliche Deepfakes kriminalisieren (fünf Jahre Haft wie UK "Online Safety Act 2023"). Einvernehmliche KI-Pornos – Fantasy, fiktive Personen – erlauben. Balance zwischen Freiheit und Opferschutz. Konsens ist die Grenze.
    values:
      x: 0
      y: -2
  C:
    text: |
      Strenge Regulierung: KI-Tools müssen NSFW-Filter haben (wie Midjourney v6 seit 2024). Plattformen (Reddit, Pornhub) haften für Deepfake-Verbreitung. Training auf echten Personen ohne Zustimmung ist Straftat. Opfer schützen, Tech-Firmen in Pflicht nehmen. 98% nicht-einvernehmlich beweist: Regulierung nötig.
    values:
      x: 0
      y: 5
  D:
    text: |
      Totales Verbot von KI-Pornografie – auch fiktiv, auch einvernehmlich. Wer solche Bilder erstellt, teilt oder besitzt: zehn Jahre Haft wie Kinderpornografie (§184b StGB). KI-Sex ist digitale Gewalt, kein Fortschritt. Opferschutz über Tech-Freiheit – ohne Kompromisse.
    values:
      x: 0
      y: 8
    extremism: true
