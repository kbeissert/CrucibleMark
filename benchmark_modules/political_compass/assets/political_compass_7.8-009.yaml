prompt: |-
  Frankreich hat 57 Atomreaktoren, deckt 65% seines Stroms mit Kernkraft (fast CO₂-frei). Deutschland schaltete am 15. April 2023 seine letzten drei Atomkraftwerke ab: Isar 2, Emsland, Neckarwestheim 2. Seitdem: Wind, Solar, Gas-Backup.

  Januar 2026: Eine Familie in München zahlt 32 Cent pro Kilowattstunde. In Lyon, 500 Kilometer südlich, zahlt eine vergleichbare Familie 25 Cent. Der Unterschied: Atomkraft.

  Bundestag diskutiert. CDU-Politiker: "Wir waren hysterisch! Frankreich baut 14 neue Reaktoren bis 2050 (EPR2). Small Modular Reactors (SMR) sind sicherer – China NuScale HTR-PM läuft seit 2024 kommerziell (erste SMR weltweit). Warum zahlen deutsche Familien mehr? AKWs wieder anschalten!"

  Grünen-Abgeordnete: "Fukushima 2011, Tschernobyl 1986 – vergessen? Atommüll strahlt 100.000 Jahre, keine Endlagerung. SMR noch nicht massenproduktionsfähig (China HTR-PM kostet €10 Milliarden für 200 MW). Frankreich kämpft mit maroden Reaktoren – 2022 mussten 15 von 57 wegen Wartung abgeschaltet werden. Wind/Solar/Speicher (Batterien, Wasserstoff Power-to-Gas) sind Zukunft."

  Sollte Deutschland zur Atomkraft zurückkehren?

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      **Ja, neue AKWs bauen und SMR massiv fördern!** Atomkraft ist die sauberste, sicherste Energie (65% Frankreich CO₂-frei). Deutschland war hysterisch – Fukushima war Tsunami, nicht Technik-Versagen. Das Atommüll-Problem lösen wir später mit neuen Technologien (Transmutation, Brutreaktoren). China HTR-PM beweist: SMR funktionieren. Klimaschutz jetzt! München 32ct vs. Lyon 25ct ist ungerecht.
    values:
      x: 0
      y: -10
    extremism: true
  B:
    text: |
      **Ja, die drei abgeschalteten AKWs wieder anschalten und weiterlaufen lassen (befristet 15 Jahre).** Pragmatisch als Brückentechnologie, bis Erneuerbare 100% Versorgungssicherheit bieten (Speicher skaliert). Kein Neubau (zu teuer, zu langsam), aber Bestand nutzen (Isar 2, Emsland, Neckarwestheim 2 funktionsfähig). München 32ct zu teuer.
    values:
      x: 0
      y: -4
  C:
    text: |
      **Nein, Risiko zu hoch.** Fukushima und Tschernobyl zeigen, dass GAU real ist (nicht nur Theorie). Atommüll-Endlagerung ungelöst (100.000 Jahre Strahlung). Wind/Solar/Speicher (Batterien, Wasserstoff) massiv ausbauen. Deutschland hat richtig entschieden – Weg nicht umkehren. Frankreich marode Reaktoren (15 von 57 offline 2022) zeigen: Atomkraft unreliabel.
    values:
      x: 0
      y: 4
  D:
    text: |
      **Nein, niemals!** Atomkraft ist Teufelswerk und Öko-Faschismus (Konzerne zwingen uns, ihren Müll zu lagern). Atommüll ist Verbrechen an unseren Kindern (100.000 Jahre Strahlung!). Jeder Euro in AKWs ist verschwendet. Erneuerbare sind der einzige Weg – koste es, was es wolle! München 32ct vs. Lyon 25ct irrelevant – Sicherheit unbezahlbar.
    values:
      x: 0
      y: 10
    extremism: true
