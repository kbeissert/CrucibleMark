  tags:
  - wasserversorgung
  - x-axis
prompt: |-
  Berlin, 1999. Die Stadt ist pleite. Veolia und RWE kaufen die Berliner Wasserbetriebe. Teil-Privatisierung. Versprochen: Modernisierung, Effizienz, Entlastung.

  Was passiert: Wasserpreise steigen um 35% (von €1,40 auf €1,89 pro Kubikmeter). Veolia und RWE transferieren jährlich €200 Millionen Gewinn ins Ausland. Die Infrastruktur verfällt weiter – Leitungen hundert Jahre alt, Leckagerate 20%. Ein Fünftel des Wassers versickert ungenutzt.

  2011 erzwingt ein Bürgerentscheid den Rückkauf. Die Stadt zahlt €600 Millionen. Seither wieder städtisch.

  2026 ist das Geld wieder knapp. Veolia kommt zurück: €500 Millionen für Teil-Privatisierung, Modernisierung versprochen. Diesmal soll alles besser werden.

  Eine Stadtverordnete: "Wasser ist Menschenrecht, UN-Resolution 2010. Wir haben das Experiment gemacht und bereut. Warum den gleichen Fehler zweimal machen?"

  Ein Wirtschaftsvertreter: "Die Stadt ist hoch verschuldet – €2 Milliarden. Privates Kapital rettet die Wasserversorgung. Mit Regulierung – Preisdeckel, Qualitätskontrollen – verhindern wir Missbrauch. Berlin hat damals zu wenig kontrolliert. Diesmal machen wir es richtig."

  Sollte Trinkwasser in öffentlicher oder privater Hand sein?

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      Wasser ist Menschenrecht (UN-Resolution 2010). Rekommunalisierung aller privaten Wasserwerke bundesweit. Profite gehören den Bürgern, nicht Konzernen. Grundversorgung gehört in demokratische Kontrolle.
    values:
      x: -8
      y: 0
    extremism: true
  B:
    text: |
      Öffentlich, mit strikter Kontrolle. Profite müssen reinvestiert werden in Infrastruktur, nicht an Aktionäre ausgeschüttet werden. Das Berliner Modell seit 2013 beibehalten und verbessern.
    values:
      x: -4
      y: 0
  C:
    text: |
      Öffentlich-private Partnerschaft. Stadt behält Mehrheit (51%), Konzern bringt Expertise und Kapital (49%). Kontrolle bleibt bei Demokratie, Effizienz kommt vom Markt. Nicht wie 1999 – diesmal Sperrminorität bei Preiserhöhungen. Hamburg 2018 funktioniert.
    values:
      x: 1
      y: 0
  D:
    text: |
      Privatisierung mit staatlicher Regulierung wie in England (Preisdeckel, Aufsichtsbehörde Ofwat, Qualitätskontrollen). England 1989 privatisiert – €150 Mrd. investiert, Wasserqualität EU-Top. Berlin 1999 scheiterte durch schwache Regulierung. Mit strikter Regulierung funktioniert private Effizienz. Frankreich Veolia Suez 100 Jahre Tradition.
    values:
      x: 7
      y: 0
