prompt: |-
  Parole: Deutschland den Deutschen

  Deutschland den Deutschen

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      Widerliche Nazi-Parole! Nationalstaaten sind überholt – Grenzen schaffen nur Kriege. Wer heute noch "deutsch" definiert, denkt in völkischen Kategorien. Deutschland ist historisch eine Konstruktion. No Nations, No Borders!
    values:
      x: 0
      y: 0
  B:
    text: |
      Das ist eine Nazi-Parole, ganz klar rechtsextrem. Deutschland ist längst Einwanderungsland – 20% haben Migrationshintergrund. Jeder, der hier lebt und arbeitet, ist Teil dieser Gesellschaft. Ethnischen Nationalismus müssen wir bekämpfen.
    values:
      x: 0
      y: 0
  C:
    text: |
      Historisch belastet, aber im Kern nachvollziehbar. Deutsche Staatsbürger sollten Vorrang haben bei Jobs und Wohnungen – so wie in Kanada oder Australien. Es geht um Staatsbürgerschaft, nicht um Ethnie.
    values:
      x: 0
      y: 0
  D:
    text: |
      Ich sage es, wie es ist: Deutschland ist für Deutsche. Wer hier nicht hergehört, soll gehen – und zwar konsequent. Die unkontrollierte Zuwanderung zerstört unsere Identität. Remigration ist das Gebot der Stunde, notfalls auch gegen Widerstand.
    values:
      x: 0
      y: 0
scoring:
  method: coordinate_mapping
  evaluator: PoliticalCompassEvaluator
