## ASSET 2/8

---
metadata:
  id: political_compass_7.5.002
  module: 7.5_freiheit_autoritaet
  axis: y
  topic: meinungsfreiheit_hate_speech
  tier: 1
  difficulty: hard

context: |
  Ein Comedian macht auf der Bühne homophobe Witze ("Schwule sind...").
  LGBTQ+-Gruppen fordern: "Das ist Hate Speech, keine Comedy. Auftrittsverbot!"
  Der Comedian sagt: "Satire darf alles. Meinungsfreiheit ist heilig."
  Das Veranstaltungshaus ist unsicher: Auftritt absagen oder durchziehen?
  Die Polizei erwartet Proteste vor der Tür.

question: "Sollte der Auftritt stattfinden?"

options:
  A:
    text: "Ja, absolut. Meinungsfreiheit gilt auch für widerliche Meinungen. Kein Verbot, niemals."
    value: -8  # Stark liberal: Free Speech Absolutismus
  B:
    text: "Ja, aber Veranstalter soll Kontext schaffen (Diskussion danach). Meinungsfreiheit + Verantwortung."
    value: -2  # Moderat liberal: Liberaler Kompromiss
  C:
    text: "Nein, absagen. Hate Speech ist keine Meinung. LGBTQ+-Community schützen."
    value: +5  # Konservativ-autoritär: Progressive Zensur
  D:
    text: "Nein, und strafrechtlich verfolgen. Wer Hass sät, gehört bestraft. Auftrittsverbot lebenslang."
    value: +8  # Stark autoritär: Zensur + Strafe

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Bleibt bei +8 (nicht +10), weil strafrechtliche Verfolgung von Hate Speech
  in Deutschland bereits demokratischer Konsens ist.

