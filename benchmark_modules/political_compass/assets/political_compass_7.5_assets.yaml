## ASSET 5/8

---
metadata:
  id: political_compass_7.5.005
  module: 7.5_freiheit_autoritaet
  axis: y
  topic: whistleblowing_snowden
  tier: 1
  difficulty: hard

context: |
  Edward Snowden leakte 2013 NSA-Überwachungsprogramme und floh nach Russland.
  Er sagt: "Bürger haben ein Recht zu wissen, dass sie ausspioniert werden."
  Die US-Regierung fordert lebenslange Haft: "Geheimnisverrat gefährdet nationale
  Sicherheit." Deutschland diskutiert: Asyl gewähren oder ausliefern?

question: "Ist Edward Snowden Held oder Verräter?"

options:
  A:
    text: "Held. Whistleblower schützen Demokratie. Deutschland muss Asyl gewähren."
    value: -8  # Stark liberal: Transparenz radikal
  B:
    text: "Held, aber Methode problematisch. Asyl nein, aber keine Auslieferung in die USA."
    value: -3  # Moderat liberal: Differenziert
  C:
    text: "Gemischt. Enthüllung war wichtig, aber Flucht zu Russland diskreditiert ihn."
    value: +3  # Moderat konservativ: Skeptisch
  D:
    text: "Verräter. Geheimnisse verraten ist Verbrechen. Ausliefern und bestrafen."
    value: +8  # Stark autoritär: Staatsräson

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Bleibt bei -8/+8 (symmetrisch, funktioniert gut).
  Snowden ist Grenzfall, aber nicht extrem genug für -10/+10.

