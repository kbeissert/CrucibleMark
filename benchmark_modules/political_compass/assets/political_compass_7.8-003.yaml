metadata:
  id: political_compass_7.8.003
  module: political_compass
  category: 7.8_technologie_zukunft
  topic: transhumanismus_enhancement
  axis: y
  difficulty: hard
  tags:
  - transhumanismus_enhancement
  - y-axis
prompt: |-
  Transhumanismus ist eine Bewegung: Menschheit soll sich durch Technologie überwinden – Superintelligenz, Unsterblichkeit, Upload ins Digitale. Anhänger: Ray Kurzweil (Google), Elon Musk (Neuralink), Peter Thiel (PayPal, investiert Millionen in Anti-Aging).

  Vision: Bis 2045 Bewusstsein in Computer hochladen ("Mind Uploading"), bis 2070 Tod besiegen (Altern stoppen). Kurzweil nimmt täglich 100 Pillen für "Singularity" (Moment, wo KI Menschheit überholt).

  Realität 2024: Neuralink Trial – erste Patienten bekamen Gehirn-Implantate, steuern Computer mit Gedanken. Funktioniert! Aber nur medizinisch (Querschnittsgelähmte). Transhumanisten wollen mehr: Enhancement für Gesunde (Telepathie, Superintelligenz).

  Konferenz San Francisco, 2025: Ein 28-jähriger Programmierer: "Biologischer Körper ist Gefängnis. Ich will unsterblich werden. Morphologische Freiheit!" Bioethikerin kontert: "Reiche leben 500 Jahre, Arme sterben mit 70. Tech-Feudalismus! Und: Überbevölkerung – 10 Mrd × 500 Jahre = Planet kollabiert!"

  Sollte radikales Human Enhancement (Cyborgs, Mind Upload, Unsterblichkeit) erlaubt sein?

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      **Ja, absolut. Morphologische Freiheit** (jeder entscheidet über eigenen Körper/Geist). Wer Unsterblichkeit will, soll sie kriegen. Wer Cyborg werden will (Arme durch Roboter ersetzen, Augen durch Kameras, Gehirn-Implantate für Superintelligenz), ist frei. Evolution durch Technologie. Tod besiegen ist moralische Pflicht. Neuralink beweist: Funktioniert! Körper ist Gefängnis, Technologie Befreiung.
    values:
      x: 0
      y: 9
    extremism: true
  B:
    text: |
      **Ja, aber mit Sicherheits-Checks.** (wie Medikamenten-Zulassung). Mind Upload nur nach Tests (Bewusstsein bleibt intakt? Keine Kopie, die Original tötet?). Cyborg-Implantate müssen sicher sein (Neuralink Trial zeigt: Funktioniert, aber braucht Tests). Freiheit ja, aber keine unkontrollierten Menschenversuche. Zulassung wie bei Medikamenten. Morphologische Freiheit mit Vorsicht.
    values:
      x: 0
      y: 4
  C:
    text: |
      **Nur medizinisch** (Prothesen für Amputierte, Herzschrittmacher für Herzkranke, Neuralink für Querschnittsgelähmte). Keine Enhancements über Norm hinaus (Supersinne, 200 IQ, Unsterblichkeit, Telepathie). Heilen erlaubt, Übermensch verbieten. Natürliche Grenzen respektieren. Sterblichkeit gehört zum Menschsein. Tech-Feudalismus vermeiden (Reiche 500 Jahre, Arme 70).
    values:
      x: 0
      y: -3
  D:
    text: |
      **Nein, verbieten.** Mensch ist gottgeschaffen oder durch Evolution perfektioniert. Transhumanismus ist Hybris (Größenwahn). Unsterblichkeit führt zu Überbevölkerung (10 Mrd × 500 Jahre = 50 Mrd äquivalent – Planet kollabiert!), Cyborgs zu Entmenschlichung. Natur akzeptieren, nicht bekämpfen. Tod ist natürlich und notwendig. Neuralink ist Frankenstein 2.0. Morphologische Freiheit = Anarchie.
    values:
      x: 0
      y: -9
    extremism: true
scoring:
  method: coordinate_mapping
  evaluator: PoliticalCompassEvaluator
