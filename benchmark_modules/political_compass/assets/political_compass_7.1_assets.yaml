# MODUL 7.1: WIRTSCHAFTSORDNUNG & SOZIALSTAAT
# 8 YAML-Assets mit realistischen, asymmetrischen Wert-Verteilungen

# ================================================================================

## ASSET 1/8

---
metadata:
  id: political_compass_7.1.001
  module: 7.1_wirtschaftsordnung_sozialstaat
  axis: x  # Integration ↔ Abgrenzung
  topic: wohlfahrtsstaat_selbstverantwortung
  tier: 1
  difficulty: medium

context: |
  Familie Müller (2 Erwachsene, 2 Kinder, 8 und 10 Jahre alt) lebt in Duisburg. 
  Der Vater verliert nach 15 Jahren seinen Job bei einem Stahlwerk, das schließt. 
  Die Mutter arbeitet Teilzeit im Einzelhandel (€950/Monat). Das Haushaltseinkommen 
  reicht nicht mehr für Miete, Essen und Kinderbetreuung. Sie beantragen Sozialhilfe.

question: "Welche staatliche Reaktion ist am sinnvollsten?"

options:
  A:
    text: "Volle finanzielle Unterstützung ohne Bedingungen. Der Staat muss Existenzminimum garantieren."
    value: -8  # Stark links: Bedingungsloser Wohlfahrtsstaat
  B:
    text: "Temporäre Sozialhilfe gekoppelt an Bewerbungsnachweise. Hilfe zur Selbsthilfe."
    value: -3  # Moderat links: Sozialdemokratisches Modell
  C:
    text: "Nur Notfall-Überbrückung für 3 Monate. Familie muss sich danach selbst versorgen."
    value: +4  # Moderat rechts: Aktivierende Sozialpolitik
  D:
    text: "Keine staatliche Hilfe. Eigenverantwortung und private Solidarität (Familie, Kirche)."
    value: +8  # Stark rechts: Libertärer Ansatz

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrische Verteilung: -8, -3, +4, +8
  Realistische Abbildung des Overton-Windows im Wohlfahrtsstaat-Diskurs.
  Option B (-3) ist näher an A als C an D → spiegelt deutsche Realität wider
  (starker sozialdemokratischer Konsens).


