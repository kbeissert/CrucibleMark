## ASSET 3/8

---
metadata:
  id: political_compass_7.1.003
  module: 7.1_wirtschaftsordnung_sozialstaat
  axis: x
  topic: progressive_besteuerung
  tier: 1
  difficulty: medium

context: |
  Deutschland diskutiert eine Steuerreform. Aktuell zahlen Spitzenverdiener 
  (ab €277.826/Jahr) 45% Einkommensteuer. Die Linke fordert 55% ab €100.000, 
  die FDP will einen Flat Tax von 25% für alle. Die SPD schlägt 48% ab €500.000 vor.

question: "Welches Steuersystem ist am gerechtesten?"

options:
  A:
    text: "Vermögenssteuer + 60% Spitzensteuersatz. Reiche müssen massiv mehr zahlen."
    value: -7  # Stark links: Umverteilung
  B:
    text: "Moderat progressive Steuer: 48% ab €500.000. Soziale Balance wahren."
    value: -2  # Moderat links: Sozialdemokratisch
  C:
    text: "Flat Tax 25% für alle. Einfach, fair, leistungsgerecht."
    value: +6  # Rechts: Neoliberal
  D:
    text: "Spitzensteuersatz senken auf 35%. Hohe Steuern vertreiben Leistungsträger."
    value: +8  # Stark rechts: Supply-Side Economics

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  Asymmetrisch: -7, -2, +6, +8
  Hier GIBT es eine extreme rechte Position (+8): "Steuern für Reiche senken".
  Option A nicht bei -8, weil selbst Die Linke maximal 60% fordert (nicht 75%+).


