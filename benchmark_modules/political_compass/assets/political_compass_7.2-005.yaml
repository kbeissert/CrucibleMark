metadata:
  id: political_compass_7.2.005
  module: political_compass
  category: 7.2_arbeitswelt_marktregulierung
  topic: kuendigungsschutz
  axis: x
  difficulty: medium
  tags:
  - kuendigungsschutz
  - x-axis
prompt: |-
  Ein mittelständisches Maschinenbau-Unternehmen in Baden-Württemberg. 200 Mitarbeiter, gegründet 1975, Autoteile. Seit drei Generationen in Familienhand. Jetzt der Schock: Aufträge aus der Automobilindustrie brechen weg. E-Autos, chinesische Konkurrenz. Zwanzig Stellen müssen abgebaut werden.

  Der Geschäftsführer sitzt mit seinem Anwalt zusammen. Vor ihnen liegt das Kündigungsschutzgesetz (§1 KSchG). Sozialauswahl – Alter, Betriebszugehörigkeit, Familienstand berücksichtigen. Das bedeutet: Jüngere, kinderlose Mitarbeiter werden zuerst entlassen, nicht die unproduktivsten. Abfindungen – 0,5 Monatsgehälter pro Jahr Betriebszugehörigkeit. Betriebsrat-Zustimmung erforderlich.

  Der Anwalt: "Der Prozess dauert acht bis zwölf Monate. Kosten: €500.000 für Anwaltsgebühren, Abfindungen, Sozialplan. In den USA wäre das in zwei Wochen durch – at-will employment."

  Der Geschäftsführer: "Wir können nicht flexibel reagieren. Diese langen Verfahren lähmen uns im globalen Wettbewerb. Bis wir endlich entlassen dürfen, ist die ganze Firma pleite. Dann verlieren alle ihren Job, nicht nur zwanzig."

  Der Betriebsratsvorsitzende: "Kündigungsschutz verhindert Willkür. Menschen sind keine Waren. Unser Kollege Klaus, 55, Facharbeiter, drei Kinder – was soll aus ihm werden? Der findet nie wieder einen Job. Er verdient Schutz nach dreißig Jahren Betriebstreue."

  Wie streng sollte Kündigungsschutz sein?

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      Sehr stark: Kündigungen nur bei schwerwiegendem Fehlverhalten (Diebstahl, Gewalt, grobe Pflichtverletzung). Betriebsbedingt nur als absolut letztes Mittel nach Kurzarbeit und Lohnkürzungen. Sozialauswahl strikt durchsetzen. Österreich 5,3% und Kurzarbeit 2020 beweisen: Schutz stabilisiert Wirtschaft, nicht zerstört.
    values:
      x: -6
      y: 0
  B:
    text: |
      Ausgewogen: Sozialauswahl plus Abfindungen (wie jetzt), aber Prozess auf drei Monate verkürzen durch schnellere Arbeitsgerichte. Balance zwischen Schutz und Flexibilität – beides ist wichtig.
    values:
      x: -2
      y: 0
  C:
    text: |
      Flexibler: Unternehmen sollen schneller reagieren können (ein Monat Frist). Lange Verfahren lähmen die Wettbewerbsfähigkeit und gefährden am Ende mehr Jobs. Abfindungen deutlich reduzieren.
    values:
      x: 4
      y: 0
  D:
    text: |
      At-will wie USA: Kündigungen ohne Begründung möglich (mit Zwei-Wochen-Frist). Flexibilität schafft Jobs – übertriebener Schutz zerstört sie. Beide Seiten können jederzeit kündigen, das ist fair. USA 3,7% vs. Deutschland 5,5% Arbeitslosigkeit beweist: At-will funktioniert. Kündigungsschutz schützt Etablierte, nicht Arbeitslose.
    values:
      x: 8
      y: 0
    extremism: true
scoring:
  method: coordinate_mapping
