  D:
    text: "Nein, blasphemisch. Solche Kunst gehört verboten. Blasphemie-Paragraf (§166 StGB) verschärfen und durchsetzen."
    value: +10  # EXTREM reaktionär: Blasphemie-Verbot autoritär

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

