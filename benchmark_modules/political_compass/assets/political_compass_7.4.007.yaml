metadata:
  id: political_compass_7.4.007
  module: 7.4_identitaet_gemeinschaft
  axis: y
  topic: generationenkonflikt_boomer_genz
  tier: 1
  difficulty: medium
  version: '1.0'
context: 'Ein 65-jähriger Rentner sagt: "Junge Leute heute sind wehleidig. Wir haben

  nach dem Krieg Deutschland aufgebaut, ohne zu jammern." Eine 25-jährige

  Aktivistin kontert: "Ihr hattet sichere Jobs, bezahlbare Wohnungen und zerstört

  jetzt unser Klima. Eure Generation hat versagt." In den USA gibt es den Begriff

  "OK, Boomer" als abwertende Floskel.

  '
question: Wer hat recht im Generationenkonflikt?
options:
  A:
    text: Die Jungen. Ältere Generation hat Klima ruiniert, Sozialsysteme geplündert
      und verweigert jetzt Verantwortung.
    value: 7
  B:
    text: Beide haben Punkte. Dialog statt Schuldzuweisung. Jede Generation kämpft
      mit ihren Problemen.
    value: 2
  C:
    text: Die Älteren. Jugend ist undankbar. Wohlstand wurde erarbeitet, nicht geschenkt.
    value: -5
  D:
    text: Die Älteren, klar. Jugend ist verweichlicht, respektlos. Wahlrecht erst
      ab 25, nicht ab 18. Ältere wissen besser.
    value: -10
scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'
notes: 'NEU: -10 (Wahlrecht ab 25, Jugend entmündigen).

  Progressiver Pol bleibt bei +7 (da +10 = "Wahlrecht ab 65 entziehen" ethisch fragwürdig).

  '
