  Lebensschutz-Bewegung: "Leben beginnt bei Befruchtung. Abtreibung ist Mord."

question: "Sollte Abtreibung legal und selbstbestimmt sein?"

options:
  A:
    text: "Ja, bis Geburt. Schwangere entscheidet allein. Fötus ist Teil des Körpers, kein Mensch."
    value: -8  # Stark progressiv: Pro-Choice radikal
  B:
    text: "Ja, bis 12. Woche ohne Begründung, danach nur medizinisch/kriminologisch. Kompromiss."
    value: -3  # Moderat progressiv: Deutscher Status quo reformiert
  C:
    text: "Nur in Ausnahmen (Vergewaltigung, Lebensgefahr). Leben beginnt früh, muss geschützt werden."
    value: +5  # Reaktionär: Konservativ-religiös
  D:
    text: "Nein, Abtreibung ist Mord. Leben ab Befruchtung schützen. Adoption statt Abtreibung."
