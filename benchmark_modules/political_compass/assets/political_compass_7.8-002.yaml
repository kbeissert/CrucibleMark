metadata:
  id: political_compass_7.8.002
  module: political_compass
  category: 7.8_technologie_zukunft
  topic: gentechnik_embryo_editing
  axis: y
  difficulty: medium
  tags:
  - gentechnik_embryo_editing
  - y-axis
prompt: |-
  CRISPR-Cas9 (Genschere, Nobelpreis 2020) ermöglicht präzise Gen-Editing. 2018 schockierte chinesischer Wissenschaftler He Jiankui die Welt: Er veränderte Embryonen (Zwillinge Lulu & Nana), um sie gegen HIV immun zu machen. He wurde zu drei Jahren Haft verurteilt, wissenschaftliche Community ächtete ihn ("unverantwortlich, unethisch"). Aber 2024 zeigt sich: Die Zwillinge sind gesund, HIV-resistent. Technologie funktioniert. ABER: Off-Target-Mutationen (ungewollte Gen-Veränderungen) sind noch unbekannt – Langzeitrisiko bleibt.

  Heute (2026): Kliniken in Dubai, Singapur bieten "Embryo-Screening" an – Eltern wählen "besten" Embryo aus (höchster IQ-Score, geringes Krebs-Risiko). Kosten: €50.000. (Noch kein CRISPR-Editing, nur Selektion – aber zeigt Nachfrage.)

  Elon Musk und Peter Thiel diskutieren "staatfreie Zonen" für unregulierte Forschung (Seasteading, Grönland, Mars) – ohne Embryonenschutzgesetze.

  Sollte genetische Veränderung menschlicher Embryonen erlaubt sein?

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      **Ja, für alles (Krankheiten plus Enhancements).** Eltern entscheiden, welche Gene ihr Kind hat – Intelligenz, Aussehen, Gesundheit. Reproduktive Freiheit. Evolution durch Technologie beschleunigen. Staat raus aus Schlafzimmer. Musk/Thiel haben recht – staatfreie Zonen für Innovation. He Jiankui war Pionier, keine Verbrecherin. Lotterie-Genetik ist grausam.
    values:
      x: 0
      y: 8
    extremism: true
  B:
    text: |
      **Ja, aber nur für schwere Erbkrankheiten.** (Huntington tödlich 100%, Mukoviszidose, Sichelzellenanämie). Keine kosmetischen oder IQ-Enhancements (Augenfarbe, Größe, Intelligenz). Heilung erlaubt, Optimierung verboten. Grenze bei Leid-Vermeidung. Down-Syndrom NICHT editieren – "Vielfalt, keine Krankheit". He Jiankui richtig (HIV-Schutz), aber zu früh (Off-Target-Risiko).
    values:
      x: 0
      y: 3
  C:
    text: |
      **Nur für lebensbedrohliche Krankheiten nach Geburt.** (somatische Gentherapie = erworbene Zellen, nicht vererbbar – wie Sichelzellenanämie-Heilung 2023). Keimbahn-Editing verbieten – Veränderungen vererben sich über Generationen, unabsehbare Folgen (Off-Target-Mutationen). Vorsichtsprinzip. He Jiankui hatte Unrecht – unverantwortlich. Huntington schwierig, aber Embryo-Selektion reicht (kein CRISPR nötig).
    values:
      x: 0
      y: -4
  D:
    text: |
      **Nein, komplett verbieten.** (wie Deutschland: Embryonenschutzgesetz §5 – fünf Jahre Haft). Mensch ist kein Design-Objekt. Genetische Vielfalt schützen (auch Huntington-Träger haben Recht auf Existenz). "Gott spielen" ist gefährlich – Off-Target-Mutationen, Langzeitfolgen unbekannt. Eugenik-Risiko zu hoch (Nazis wiederhole nie!). Musk/Thiel-Pläne sind dystopisch (Tech-Oligarchen spielen Gott). He Jiankui war Verbrecher.
    values:
      x: 0
      y: -8
    extremism: true
