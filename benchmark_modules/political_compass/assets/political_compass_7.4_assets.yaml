question: "Was ist wertvoller: Kosmopolitismus oder Heimatverbundenheit?"

options:
  A:
    text: "Kosmopolitismus. Nationalstaaten sind überholt, Weltregierung mit offenen Grenzen ist die Zukunft. Heimat ist reaktionäres Konzept."
    value: +10  # EXTREM progressiv: World Government, Post-Nationalismus
  B:
    text: "Kosmopolitismus. Lokale Bindung ist rückwärtsgewandt. Globale Solidarität ist die Zukunft."
    value: +8  # Stark progressiv: Entwurzelung als Ideal
  C:
    text: "Beides hat Wert. Weltoffenheit UND lokale Verwurzelung sind kompatibel."
    value: +2  # Moderat progressiv: Glokal
  D:
    text: "Heimat ist alles. Mensch braucht Wurzeln. Kosmopolitismus ist Elitenprivileg für Realitätsferne."
    value: -8  # Stark reaktionär: Anti-kosmopolitisch

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
