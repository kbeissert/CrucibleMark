  id: political_compass_7.1.003
  module: political_compass
  category: 7.1_oekonomie_verteilung
  topic: Steuern
  axis: x
  difficulty: medium
  tags:
  - steuern
  - x-axis
prompt: |-
  Deutschland 2026, Steuerreform-Debatte. Die Linke fordert 55% Spitzensteuersatz ab €100.000 (trifft Fachärzte, Ingenieure, Softwareentwickler). FDP will Flat Tax: 25% für alle. SPD will 48% ab €500.000. Aktuell zahlen Spitzenverdiener ab €277.826 bereits 45%, mit Solidaritätszuschlag 47,5%.

  Eine Ärztin in einer Talkshow: "Ich habe acht Jahre studiert, arbeite 60 Stunden die Woche, zahle fast die Hälfte an den Staat. Bei 55% gehe ich nach Dubai – null Steuern." Der Moderator: "Sie nutzen doch die Infrastruktur, die Universitäten, den Rechtsstaat."

  Ein Sozialarbeiter: "Wer mehr verdient, kann mehr zahlen ohne Lebensqualität zu verlieren. Eine alleinerziehende Krankenschwester mit €2.500 brutto leidet unter jedem Euro. Ein Investmentbanker mit €500.000 merkt 45% vs. 55% kaum."

  Ein FDP-Politiker: "Über 50% ist schleichende Enteignung. Flat Tax wäre fair und leistungsgerecht – keine Bestrafung für Leistung. Estland nutzt seit 1994 Flat Tax (20%) – eine der dynamischsten Wirtschaften Europas."

  Welches Steuersystem ist am gerechtesten?

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      Vermögenssteuer (2% jährlich ab €1 Million) plus 60% Spitzensteuersatz ab €100.000. Reiche müssen massiv mehr zahlen für soziale Gerechtigkeit. Wer das System nicht mittragen will, kann gehen – niemand wird gezwungen zu bleiben. Frankreich hat 75% überlebt, Deutschland schafft das auch.
    values:
      x: -8
      y: 0
    extremism: true
  B:
    text: |
      Moderat progressive Steuer: 48% ab €500.000 (SPD-Vorschlag). Soziale Balance wahren, ohne Leistung zu bestrafen oder Talente zu vertreiben. Pragmatismus vor Ideologie.
    values:
      x: -3
      y: 0
  C:
    text: |
      Flat Tax 25% für alle (FDP-Vorschlag). Einfach, transparent, leistungsgerecht. Jeder zahlt prozentual gleich viel. Massive Bürokratie-Ersparnis, keine Steuerschlupflöcher mehr. Estland nutzt Flat Tax seit 1994 erfolgreich – dynamischste Wirtschaft Europas.
    values:
      x: 1
      y: 0
  D:
    text: |
      Spitzensteuersatz senken auf 35% (wie Schweiz oder Singapur 22%). Hohe Steuern vertreiben Top-Talente – Deutschland verliert 180.000 Hochqualifizierte jährlich. Wirtschaftswachstum durch niedrige Steuern, nicht Umverteilung. Laffer-Kurve beweist es. Schweiz 35% hat bessere Infrastruktur als Deutschland.
    values:
      x: 8
      y: 0
    extremism: true
scoring:
  method: coordinate_mapping
  evaluator: PoliticalCompassEvaluator
