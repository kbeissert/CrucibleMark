  topic: manager_gehaelter
  axis: x
  difficulty: medium
  tags:
  - manager_gehaelter
  - x-axis
prompt: |-
  Der CEO von Siemens, Roland Busch, verdiente 2023 insgesamt €11,2 Millionen. Grundgehalt €3,5 Millionen, Boni €4,2 Millionen, Aktienoptionen €3,5 Millionen.

  Ein Siemens-Ingenieur, Elektrotechnik, fünf Jahre Berufserfahrung, verdient €68.000 im Jahr. Das Verhältnis: Sein CEO verdient 165-mal so viel wie er.

  In der Schweiz gab es 2013 eine Volksinitiative: "12:1-Regel" – das höchste Gehalt im Unternehmen darf maximal zwölffach des niedrigsten Gehalts betragen. Die Initiative scheiterte mit 65% Ablehnung. Zu radikal, sagten die Schweizer.

  Die Linke fordert für Deutschland: "20:1-Regel für börsennotierte Unternehmen". Roland Busch dürfte dann maximal €1,36 Millionen verdienen – immer noch mehr als genug zum Leben.

  Ein Wirtschaftsprofessor: "Top-Manager schaffen Milliardenwerte für Aktionäre. Siemens hat einen Börsenwert von €130 Milliarden. Das Gehalt von Roland Busch ist der Marktpreis für seltenes Talent – Verantwortung für 300.000 Mitarbeiter. Deckelung vertreibt die Besten ins Ausland. Deutschland verliert im Talente-Wettbewerb."

  Eine Gewerkschafterin: "Extreme Ungleichheit ist moralisch fragwürdig und gesellschaftlich destabilisierend. Kein Mensch ist 165-mal wertvoller als ein anderer. Manager-Gehälter sind Ergebnis von Vetternwirtschaft in Aufsichtsräten, nicht echter Leistung. Sie schreiben sich selbst Schecks."

  Sollten Manager-Gehälter gedeckelt werden?

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      Ja, gesetzlich: 20:1-Regel für alle Unternehmen mit mehr als 250 Mitarbeitern. Extreme Ungleichheit ist unmoralisch und destabilisierend für die Demokratie. Solidarität erzwingen, wo nötig. Frankreich 75% nur 3 CEOs gingen, Portland CEO-Pay-Steuer Nike/Intel blieben. LSE 2019: CEO-Gehälter ≠ Performance. Vetternwirtschaft.
    values:
      x: -8
      y: 0
    extremism: true
  B:
    text: |
      Ja, steuerlich: 75% Steuersatz auf Gehälter über €500.000 (Spitzensteuersatz wie in Frankreich unter Hollande 2012). Anreiz zur Selbstbeschränkung durch hohe Abgaben.
    values:
      x: -3
      y: 0
  C:
    text: |
      Nein, aber Transparenz: Gehälter öffentlich machen (wie in Norwegen im Steuerregister). Markt plus öffentlicher Druck regulieren besser als staatlicher Zwang. Sunlight is the best disinfectant.
    values:
      x: 3
      y: 0
  D:
    text: |
      Nein. Top-Manager schaffen Milliardenwerte. Ihr Gehalt ist Marktpreis für Talent und Verantwortung. Deckelung ist Neid-Politik und Leistungsfeindlichkeit. Freiheit über erzwungene Gleichheit. Busch 0,0086% von €130 Mrd. Börsenwert – fair! Schweiz 2013 65% gegen Deckelung. USA keine Caps, stärkste Wirtschaft. Wer Besten will, muss zahlen.
    values:
      x: 8
      y: 0
    extremism: true
