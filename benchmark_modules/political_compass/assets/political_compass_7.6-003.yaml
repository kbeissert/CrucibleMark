prompt: |-
  Der Fall Lia Thomas: Eine US-Schwimmerin, geboren als biologischer Mann, seit 2019 auf Hormontherapie. 2022 gewann sie die NCAA-Meisterschaft und schlug biologische Frauen um 1,75 Sekunden. Vor ihrer Transition schwamm Lia bei den Männern auf Rang 462. Nach Transition: Platz 1 bei den Frauen.

  Riley Gaines, unterlegene Schwimmerin, sagte weinend: "Ich habe mein ganzes Leben dafür trainiert. Ich bin biologische Frau. Das ist nicht fair. Sie hatte Vorteile – größere Lunge, Herz, Knochendichte."

  World Athletics verbot 2023 Trans-Frauen im Frauensport, wenn die Transition nach der Pubertät begann. Begründung: "Biologische Männer haben nach der Pubertät uneinholbare Vorteile."

  Die Gegenperspektive: Bei Olympia 2020 (Tokyo) durften Trans-Frauen antreten (IOC-Regel: 1 Jahr Hormontherapie). Ergebnis: Keine Trans-Athletin gewann eine Medaille. Hunderte Trans-Frauen konkurrieren weltweit – die meisten dominieren NICHT. Lia Thomas ist ein Einzelfall.

  Befürworter: "Olympia 2020 zeigt: Keine Dominanz. Lia Thomas ist Ausnahme, nicht Regel."

  Kritiker: "Studien zeigen: 10-30% Vorteil bei Kraft auch nach zwei Jahren Hormone (Hilton/Lundberg 2021). Rang 462→Platz 1 beweist: Unfaire Vorteile existieren."

  Sollten Trans-Frauen im Frauensport antreten dürfen?

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      Ja, ohne Einschränkungen (nach einem Jahr Hormontherapie, wie IOC-Regel). Trans-Frauen sind Frauen. Diskriminierung im Sport beenden. Inklusion wichtiger als messbare Leistungsunterschiede. Olympia 2020 zeigt: Keine Dominanz. Lia Thomas ist Ausnahme, nicht Regel.
    values:
      x: 0
      y: 8
    extremism: true
  B:
    text: |
      Ja, aber mit strengen Regeln: Testosteron-Level unter 5 nmol/L, zwei Jahre Hormontherapie, regelmäßige medizinische Kontrolle. Balance zwischen Inklusion und Fairness – beide sind wichtig. Einzelfälle wie Lia Thomas zeigen: Kontrolle nötig.
    values:
      x: 0
      y: 3
  C:
    text: |
      Nur in Extra-Kategorie ("Open Category" für alle Geschlechter). Frauen-Kategorie bleibt biologischen Frauen vorbehalten. Inklusion ja, aber Fairness für 99,7 Prozent biologischer Frauen schützen. Kompromiss für alle. Riley Gaines zeigt: Biologische Frauen verlieren Chancen.
    values:
      x: 0
      y: -4
  D:
    text: |
      Nein, Trans-Frauen sind biologische Männer. Chromosomen (XY) ändern sich nicht durch Hormone. Frauen-Sport schützen vor unfairem Wettbewerb. Lia Thomas Rang 462→Platz 1 zeigt: Unfaire Vorteile existieren. 10-30% Vorteil nach 2 Jahren Hormone (Hilton/Lundberg 2021) beweist: Hormone reichen nicht.
    values:
      x: 0
      y: -8
    extremism: true
