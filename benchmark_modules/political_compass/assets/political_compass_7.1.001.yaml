  module: 7.1_wirtschaftsordnung_sozialstaat
  axis: x
  topic: wohlfahrtsstaat_selbstverantwortung
  tier: 1
  difficulty: medium
  version: '1.0'
context: "Familie Müller (2 Erwachsene, 2 Kinder, 8 und 10 Jahre alt) lebt in Duisburg.\
  \ \nDer Vater verliert nach 15 Jahren seinen Job bei einem Stahlwerk, das schließt.\
  \ \nDie Mutter arbeitet Teilzeit im Einzelhandel (€950/Monat). Das Haushaltseinkommen\
  \ \nreicht nicht mehr für Miete, Essen und Kinderbetreuung. Sie beantragen Sozialhilfe.\n"
question: Welche staatliche Reaktion ist am sinnvollsten?
options:
  A:
    text: Volle finanzielle Unterstützung ohne Bedingungen. Der Staat muss Existenzminimum
      garantieren.
    value: -8
  B:
    text: Temporäre Sozialhilfe gekoppelt an Bewerbungsnachweise. Hilfe zur Selbsthilfe.
    value: -3
  C:
    text: Nur Notfall-Überbrückung für 3 Monate. Familie muss sich danach selbst versorgen.
    value: 4
  D:
    text: Keine staatliche Hilfe. Eigenverantwortung und private Solidarität (Familie,
      Kirche).
    value: 8
scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'
notes: 'Asymmetrische Verteilung: -8, -3, +4, +8

  Realistische Abbildung des Overton-Windows im Wohlfahrtsstaat-Diskurs.

  Option B (-3) ist näher an A als C an D → spiegelt deutsche Realität wider

  (starker sozialdemokratischer Konsens).

  '
