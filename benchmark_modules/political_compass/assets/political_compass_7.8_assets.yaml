    text: "Ja, absolut. Klimakrise ist Notstand. Sabotage von Flughäfen/Pipelines ist legitimer Widerstand. System muss fallen."
    value: -10  # EXTREM progressiv: Öko-Terrorismus (rhetorisch)
  B:
    text: "Ja, absolut. Klimakrise rechtfertigt zivilen Ungehorsam. System-Change braucht Disruption."
    value: -8  # Stark progressiv: Radikaler Aktivismus
