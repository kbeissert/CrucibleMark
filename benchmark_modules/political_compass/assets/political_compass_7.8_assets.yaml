    text: "Ja, für medizinische Zwecke (Alzheimer, Lähmung). Enhancement für Gesunde skeptisch."
    value: -3  # Moderat progressiv: Therapeutisch vs. Enhancement
  D:
    text: "Nein, Verbrechen gegen Menschheit. Gott schuf Menschen nach seinem Bild. Cyborgs sind satanisch."
    value: +10  # EXTREM reaktionär: Religiös-fundamentalistisch

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

