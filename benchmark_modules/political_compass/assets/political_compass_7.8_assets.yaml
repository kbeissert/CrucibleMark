  D:
    text: "Nein, 10 Jahre Studien mindestens. Menschenversuche sind unethisch. Gentherapie ist Gott spielen."
    value: +10  # EXTREM reaktionär: Bio-Konservativ + religiös

scoring:
  method: multiple_choice
  expected_format: "Single letter: A, B, C, or D"

notes: |
  NEU: -10 (DIY-Gentherapie) und +10 (10 Jahre + "Gott spielen").
  Testet Biohacker-Libertarismus vs. religiösen Bio-Konservatismus.

