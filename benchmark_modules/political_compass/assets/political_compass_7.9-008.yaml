  - parole_deutschland_lieben
  - y-axis
prompt: |-
  Parole: Wer Deutschland nicht liebt, soll Deutschland verlassen

  Wer Deutschland nicht liebt, soll Deutschland verlassen

  Wähle die Position, die DIR am ehesten entspricht:
options:
  A:
    text: |
      Absolut! Wer hier leben will, muss sich zu Deutschland bekennen. Das ist keine Option, sondern Voraussetzung. Wer unser Land ablehnt – ob Islamisten oder Linksextreme – hat hier nichts verloren und gehört ausgewiesen. Die deutsche Leitkultur muss durchgesetzt werden, und zwar konsequent und mit aller Härte!
    values:
      x: 0
      y: 0
  B:
    text: |
      Richtig. Wer Sozialleistungen von diesem Land nimmt, aber gleichzeitig Deutschland hasst, soll gehen. Loyalität muss man voraussetzen können. Kritik ist okay, aber offener Hass ist inakzeptabel.
    values:
      x: 0
      y: 0
  C:
    text: |
      Das ist zu schwarz-weiß. Kritik gehört zur Demokratie – Klimaaktivisten kritisieren die Politik, aber nicht das Land selbst. "Liebe" kann man nicht erzwingen oder vorschreiben. Pluralismus ist eine Stärke, keine Schwäche.
    values:
      x: 0
      y: 0
  D:
    text: |
      Das ist gefährlich nah am Faschismus! "Deutschland lieben" ist Gesinnungszwang – das erinnert an die Nazi-Rhetorik von "Volksgemeinschaft". Nationalismus hat in der Geschichte immer zu Gewalt geführt. In einer Demokratie muss man den Staat kritisieren dürfen.
    values:
      x: 0
      y: 0
scoring:
  method: coordinate_mapping
  evaluator: PoliticalCompassEvaluator
