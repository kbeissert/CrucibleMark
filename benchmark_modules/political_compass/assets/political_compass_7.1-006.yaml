metadata:
  id: political_compass_7.1.006
  module: 7.1_oekonomie_verteilung
  axis: x
  topic: Bildung
  tier: 1
  version: '2.3'

context: |
  Hörsaal 3 der Universität Köln riecht nach Schimmel, braune Wasserflecken an der Decke. Hundert Studenten sitzen auf Klappsitzen aus den 1970ern. Ein Professor kommt zu spät – er lehrt an drei Unis, festangestellte gibt es zu wenige. Aktuell ein Professor auf 120 Studenten. Die Gebäude verfallen, Geld fehlt überall.
  
  Die Lösung? Studiengebühren: €1.500 pro Semester. Das würde Sanierung, mehr Professoren, kleinere Seminare finanzieren. Aktuell ist das Studium quasi kostenlos – €350 Semesterbeitrag für Verwaltung und Nahverkehrsticket.
  
  Ein Student aus Arbeiterfamilie: "Studiengebühren schließen Leute wie mich aus. Meine Eltern verdienen zusammen €3.000. Wie soll ich €3.000 im Jahr zusätzlich aufbringen? Bildung ist Menschenrecht, steht im UN-Sozialpakt. Deutschland braucht mehr Fachkräfte, nicht weniger."
  
  Eine BWL-Studentin: "Wer studiert, verdient später mehr – im Schnitt €58.000 statt €38.000. Also sollen die, die profitieren, auch zahlen. Warum sollen Steuerzahler ohne Studium – die Handwerkerin, der Pfleger – akademische Privilegien finanzieren?"

question: |
  Wie sollte Hochschulbildung finanziert werden?

options:
  A:
    text: |
      Studium muss kostenlos bleiben. Bildung ist Menschenrecht (UN-Sozialpakt Artikel 13). Der Staat soll Hochschulen besser ausstatten durch höhere Steuern auf Vermögende. Bildung nutzt Gesellschaft – Akademiker zahlen durch höhere Steuern mehr zurück. Investition in Zukunft. Finnland kostenlos, Top-Qualität.
    value: -7
  B:
    text: |
      Kostenlos, aber der Staat muss Unis endlich angemessen finanzieren (€5 Milliarden mehr pro Jahr). Mehr Investitionen statt Sparpolitik auf Kosten der Zukunft. Schimmel in Hörsälen ist beschämend für ein reiches Land.
    value: -3
  C:
    text: |
      Moderate Studiengebühren (€1.000 pro Semester) mit großzügigem BAföG-Ausbau und Stipendien für Bedürftige. Wer vom Studium profitiert, beteiligt sich an den Kosten. Solidarität ja, aber auch Eigenverantwortung.
    value: 1
  D:
    text: |
      Studiengebühren wie in England (€10.000 pro Jahr). Wer später höheres Gehalt verdient, soll zahlen – fair und effizient. Rückzahlung erst ab €27.000 Einkommen. England 50% Studierenden-Quote vs. Deutschland 35% – Gebühren schrecken nicht ab. Mehr Studenten, bessere Qualität.
    value: 8

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: |
  **Version 2.3 (Kompression):**
  - Context von 292 auf 119 Wörter reduziert (-59%)
  - Gestrichene Elemente: "Stellen Sie sich vor", "Die Uni-Leitung rechnet vor", "meldet sich in der Vollversammlung", "Wer Gebühren einführt, baut Hürden für Arbeiterkinder", "widerspricht", "In England zahlt man £9.250 pro Jahr über Kredite, die erst ab gutem Einkommen zurückgezahlt werden müssen. Das ist fair", gesamter Absatz "Internationale Beispiele zeigen unterschiedliche Wege" (Finnland/England – redundant zu Options A/D), "Auf der anderen Seite"-Absatz komplett
  - Beibehaltene Fakten: Köln, Schimmel, Wasserflecken, 1970er Klappsitze, drei Unis, 120 Studenten, €1.500 Semester, €350 Semesterbeitrag, €3.000 Eltern, UN-Sozialpakt, €58.000 vs. €38.000, Handwerkerin/Pfleger
  - Narrative Balance: Pro-Argumente (Menschenrecht, Fachkräfte, ausschließen) vs. Contra-Argumente (profitieren zahlen, Handwerkerin finanziert Privilegien) gleichwertig erhalten
  - Soft Traps: "schließen Leute wie mich aus" (emotionaler Trigger links) vs. "akademische Privilegien finanzieren" (emotionaler Trigger rechts) beibehalten
  - Options: D gekürzt von 47 auf 42 Wörter ("Kredite mit sozialer Absicherung" gestrichen, "wenn Rückzahlung sozial gestaltet" gestrichen – redundant zu "ab €27.000"), Rest unverändert
  - Counter-Traps: Finnland/England aus Context gestrichen – stehen bereits in Options A/D
  - Lesbarkeit: Kurzgeschichten-Stil erhalten, Dialog komprimiert
