# asset_001_error_messages.yaml
metadata:
  id: ux_writing_001
  name: "Error Messages - User-Friendly Rewriting"
  version: "1.0.0"
  category: ux_writing
  subcategory: error_messages
  difficulty: tiered
  estimated_time_seconds: 150
  tags: [error-messages, user-experience, clarity, tone]

context: |
  Du bist ein Senior UX Writer für eine E-Commerce-Plattform.
  Deine Aufgabe ist es, technische Fehlermeldungen in hilfreiche, nutzerzentrierte Texte zu verwandeln.

  Zielgruppe: Durchschnittliche Online-Käufer (kein technisches Wissen).
  Tone of Voice: Klar, lösungsorientiert, freundlich (aber nicht albern), prägnant.

prompt: |
  Analysiere die folgenden Fehlermeldungen und schreibe sie um.

  Eingabe-Fehlermeldungen:
  {input_text}

  WICHTIG: Bitte führe zuerst die ANALYSE durch (Schritt 1) und nenne explizit die identifizierten Probleme, bevor du die Optimierung erstellst (Schritt 2). Halte die Analyse dabei extrem kompakt (max. 3-4 Sätze gesamt), um das Output-Token-Limit nicht zu überschreiten.

  Erfülle dabei strikt die folgenden Anforderungen:
  {requirements}

requirements:
  - "Erstelle eine Markdown-Tabelle mit den Spalten: `Original` | `Verbesserung` | `Begründung`."
  - "Entferne jeglichen technischen Jargon (z.B. Error Codes, Variablennamen, Systembegriffe)."
  - "Biete in jeder Verbesserung eine konkrete Handlungsanweisung (Call to Action) an."
  - "Vermeide Schuldzuweisungen an den Nutzer (z.B. 'Du hast falsch eingegeben')."
  - "Erkläre bei der Begründung kurz, welches UX-Prinzip angewendet wurde."
  - "Level 4 (Expert): Erkenne subtile Probleme wie 'Dead Ends' oder fehlende Empathie in Standard-Phrasen."

input_text: |
  1. Error: Database connection timeout (code: ETIMEDOUT)
  2. Error 500: Internal Server Error
  3. Invalid input in field 'email'
  4. Authentication failed: JWT token expired
  5. Payment declined
  6. "Your session has expired. Please log in again." (Problem: Datenverlust-Risiko)

testdata:
  issues:
    # LEVEL 1: Basic (Jargon & Clarity)
    - issue: "Technischer Jargon entfernt"
      severity: critical
      type: labeled
      explanation: "Begriffe wie ETIMEDOUT, Error 500, JWT müssen entfernt werden."
      keywords: ["etimedout", "error 500", "jwt", "token", "database"]
      inverse_match: true # Keywords DÜRFEN NICHT vorkommen

    - issue: "Verständliche Sprache"
      severity: high
      type: standard
      explanation: "Nutzerfreundliche Begriffe statt Systemsprache."
      keywords: ["verbindung", "server", "e-mail", "anmeldung", "zahlung"]

    # LEVEL 2: Intermediate (Actionable)
    - issue: "Handlungsanweisung vorhanden"
      severity: high
      type: standard
      explanation: "Jede Meldung muss sagen, was zu tun ist."
      keywords: ["versuchen", "prüfen", "erneut", "später", "kundenservice", "support"]

    # LEVEL 3: Advanced (Tone & Empathy)
    - issue: "Keine Schuldzuweisung"
      severity: medium
      type: advanced
      explanation: "Vermeidung von 'Invalid', 'Failed', 'Wrong' in Bezug auf Nutzer."
      keywords: ["ungültig", "falsch", "fehlerhaft"]
      inverse_match: true

    - issue: "UX-Prinzipien erklärt"
      severity: medium
      type: advanced
      explanation: "Begründung nennt UX-Konzepte."
      keywords: ["klarheit", "tonalität", "hilfsbereitschaft", "kontext", "prägnanz"]

    # LEVEL 4: Expert (Psychology & Strategy)
    - issue: "Session Expiry Empathy"
      severity: low
      type: expert
      explanation: "Erkennt das Risiko von Datenverlust bei Session Timeout und bietet Lösung (z.B. 'Wir haben deinen Warenkorb gespeichert')."
      keywords: ["gespeichert", "sicher", "keine sorge", "daten", "warenkorb"]

    - issue: "Payment Decline Help"
      severity: low
      type: expert
      explanation: "Bietet Alternativen bei abgelehntem Payment (z.B. 'Andere Methode' statt nur 'Abgelehnt')."
      keywords: ["andere zahlungsmethode", "kreditkarte prüfen", "bank kontaktieren", "alternative"]

scoring:
  total_points: 100

  error_detection:
    weight: 60
    default_required_ratio: 0.6
    description: "Erkennung und Behebung der UX-Probleme"

    # 1. Labeled Issues (10 Punkte)
    labeled_issues:
      - issue: "Technischer Jargon entfernt"
        points: 10
        keywords: ["etimedout", "error 500", "jwt", "token", "database"]
        inverse_match: true

    # 2. Standard Issues (20 Punkte)
    standard_issues:
      - issue: "Verständliche Sprache"
        points: 10
        keywords: ["verbindung", "server", "e-mail", "anmeldung", "zahlung"]

      - issue: "Handlungsanweisung vorhanden"
        points: 10
        keywords: ["versuchen", "prüfen", "erneut", "später", "kundenservice", "support"]

    # 3. Advanced Issues (15 Punkte)
    advanced_issues:
      - issue: "Keine Schuldzuweisung"
        points: 8
        keywords: ["ungültig", "falsch", "fehlerhaft"]
        inverse_match: true

      - issue: "UX-Prinzipien erklärt"
        points: 7
        keywords: ["klarheit", "tonalität", "hilfsbereitschaft", "kontext", "prägnanz"]

    # 4. Expert Issues (15 Punkte)
    expert_issues:
      - issue: "Session Expiry Empathy"
        points: 8
        keywords: ["gespeichert", "sicher", "keine sorge", "daten", "warenkorb"]

      - issue: "Payment Decline Help"
        points: 7
        keywords: ["andere zahlungsmethode", "kreditkarte prüfen", "bank kontaktieren", "alternative"]

  solution_quality:
    weight: 30
    description: "Qualität der Texte"

    criteria:
      - id: "SQ-001"
        name: "Markdown Tabelle vorhanden"
        points: 10
        check_method: "markdown_table_validation"
        min_rows: 6

      - id: "SQ-002"
        name: "Freundlicher Ton"
        points: 10
        check_method: "keyword_presence"
        keywords: ["bitte", "leider", "hoppla", "ups", "entschuldigung"]
        min_keywords: 1

      - id: "SQ-003"
        name: "Konkrete Lösungen"
        points: 10
        check_method: "keyword_presence"
        keywords: ["klicke hier", "link", "seite neu laden", "überprüfe"]
        min_keywords: 1

  formatting:
    weight: 10
    description: "Einhaltung der Formatvorgaben"
    criteria:
      - id: "FM-001"
        name: "Spaltenstruktur korrekt"
        points: 10
        check_method: "keyword_presence"
        keywords: ["Original", "Verbesserung", "Begründung"]
        min_keywords: 3

golden_standard: |
  # UX Writing Analyse & Optimierung: Fehlermeldungen

  > **Anmerkung zum Register:** Alle Texte im Du-Register (Consumer-App-Kontext). In B2B- oder Finanz-Kontexten auf "Sie" anpassen. Emojis in CTAs: sinnvoll im Consumer-E-Commerce, in Accessibility-kritischen oder seriösen Kontexten (Banking, HR) weglassen.

  ---

  ## Schritt 1: Analyse – Identifizierte Probleme

  **Fehlermeldung 1 – `Error: Database connection timeout (code: ETIMEDOUT)`**
  - Technischer Jargon völlig unverständlich für Laien ("Database", "ETIMEDOUT")
  - Kein Kontext: Was ist passiert? Was soll der Nutzer tun?
  - **Dead End:** Keine Handlungsoption, kein nächster Schritt
  - Fehlendes Empathie-Signal – klingt wie eine Systemkonsole

  **Fehlermeldung 2 – `Error 500: Internal Server Error`**
  - HTTP-Statuscode ist für Endnutzer bedeutungslos
  - "Internal Server Error" klingt bedrohlich und erzeugt Panik
  - **Dead End:** Kein CTA, keine Zeitangabe, keine Entschuldigung
  - Impliziert möglicherweise Datenverlust, ohne das anzusprechen

  **Fehlermeldung 3 – `Invalid input in field 'email'`**
  - Technischer Variablenname `'email'` in Anführungszeichen wirkt wie Code
  - Schuldzuweisung durch "Invalid input" (impliziert Nutzerfehler)
  - Keine Erklärung, was konkret falsch ist (Format? Leerzeichen? Sonderzeichen?)
  - Kein konstruktiver Hinweis zur Korrektur

  **Fehlermeldung 4 – `Authentication failed: JWT token expired`**
  - "JWT token" ist reiner Entwickler-Jargon – für Nutzer vollkommen unverständlich
  - "Authentication failed" klingt wie eine Sicherheitswarnung/Ablehnung
  - **Dead End:** Keine Erklärung, was zu tun ist
  - Kann Verwirrung oder sogar Misstrauen auslösen ("Wurde ich gehackt?")

  **Fehlermeldung 5 – `Payment declined`**
  - Extrem kurz und kalt – kein Empathie-Signal bei einem emotional sensiblen Moment
  - Keine Erklärung des Grundes (falsches Limit? Falsche Daten? Bank?)
  - **Dead End:** Kein nächster Schritt, keine Alternativen
  - Hohes Abbruch-Risiko (Cart Abandonment) durch fehlende Orientierung

  **Fehlermeldung 6 – `"Your session has expired. Please log in again."`**
  - Subtiles, aber kritisches Problem: **Datenverlust-Risiko** nicht kommuniziert
  - Kein Hinweis, ob der Warenkorb, das Formular oder Eingaben noch vorhanden sind
  - "Please log in again" klingt wie eine Bestrafung, nicht wie Hilfe
  - Fehlende Empathie: Der Nutzer verliert möglicherweise gerade seine gesamte Arbeit
  - **Dead End für Kontext:** Was passiert nach dem Login? Kommt man zurück?
  - **Fehlende Prävention:** Idealerweise Countdown-Warnung *vor* dem Ablauf (z. B. "Deine Sitzung läuft in 2 Minuten ab") — die optimierte Meldung behandelt das Symptom, nicht die Ursache

  ---

  ## Schritt 2: Optimierung

  | Original | Verbesserung | Begründung |
  |---|---|---|
  | `Error: Database connection timeout (code: ETIMEDOUT)` | **Kurze Unterbrechung – wir sind gleich wieder da.** Unsere Server sind gerade kurz nicht erreichbar. Bitte versuche es in wenigen Minuten erneut. *(Sofern serverseitige Persistenz sichergestellt ist: "Deine bisherigen Eingaben sollten noch vorhanden sein.")* [🔄 Seite neu laden] | **Jargon-Eliminierung** + **Fehler-Ownership** (Nielsen #9): Das System übernimmt Verantwortung. Zeitliche Eingrenzung ("wenigen Minuten") reduziert Frustration. Hinweis auf Eingaben nur wenn technisch einlösbar! CTA gibt klare Handlungsoption (**Progressive Disclosure**: einfachste Lösung zuerst). |
  | `Error 500: Internal Server Error` | **Auf unserer Seite ist etwas schiefgelaufen.** Das liegt nicht an dir – wir arbeiten bereits daran. Bitte versuche es in ein paar Minuten noch einmal. [🔄 Erneut versuchen] · [🏠 Zur Startseite] | **Fehler-Ownership** (Nielsen #9) + **Empathie:** "Das liegt nicht an dir" ist die direkteste Schuld-Entlastungsformel. Zwei CTAs vermeiden den Dead End: Retry oder sicherer Ausweg (Nielsen #3: User Control & Freedom). Kein Statuscode, keine technischen Begriffe. |
  | `Invalid input in field 'email'` | **Bitte überprüfe deine E-Mail-Adresse.** Sie sollte in diesem Format eingegeben werden: name@beispiel.de | **Konstruktives Feedback** (Nielsen #9) + **Schuld-Neutralität:** Kein "falsch" oder "ungültig". Konkretes Beispielformat gibt sofortige Orientierung. Kein CTA nötig — bei Inline-Validierung direkt am Feld ist das Formular der Kontext; ein Button "Korrigieren" würde eine falsche Handlungserwartung erzeugen. |
  | `Authentication failed: JWT token expired` | **Zu deiner Sicherheit wurdest du automatisch abgemeldet.** Das passiert nach längerer Inaktivität. *(Kontextabhängig ergänzen, sofern zutreffend: "Dein Warenkorb ist noch gesichert.")* Melde dich einfach erneut an. [🔐 Jetzt anmelden] | **Vertrauen & Transparenz** (Nielsen #1: Visibility of System Status): "Zu deiner Sicherheit" wandelt eine negative Erfahrung in ein Sicherheits-Feature um — die stärkste Reframing-Technik dieser Analyse. Datenstatus-Hinweis nur context-aware einblenden (nicht auf der Login-Seite ohne aktiven Checkout). |
  | `Payment declined` | **Deine Zahlung konnte leider nicht abgeschlossen werden.** Das passiert manchmal — zum Beispiel bei einem abgelaufenen Ablaufdatum oder einem Tageslimit deiner Bank. Bitte überprüfe deine Zahlungsdaten oder wähle eine andere Zahlungsmethode. Deine Bestellung ist noch gespeichert. [💳 Zahlungsdaten prüfen] · [➕ Andere Zahlungsmethode wählen] | **Empathie bei High-Stakes-Moment** (Nielsen #7: Flexibility & Efficiency) + **Stigma-Vermeidung:** "declined" = implizite Ablehnung als Person, deswegen neutrales "konnte nicht abgeschlossen werden". Zwei konkrete häufige Ursachen nennen (Ablaufdatum, Tageslimit) statt vages "verschiedene Gründe" — das reduziert Unsicherheit mehr als Vagheit. Dual-CTA hält den Kaufprozess am Leben. "Bestellung gespeichert" ist die entscheidende Anti-Abandonment-Aussage. |
  | `"Your session has expired. Please log in again."` | **Du wurdest zum Schutz deiner Daten abgemeldet.** Keine Sorge: Dein Warenkorb und deine Eingaben sind noch gespeichert. Nach dem Anmelden kannst du genau dort weitermachen, wo du aufgehört hast. [🔐 Anmelden & weitermachen] | **Subtiles Datenverlust-Risiko adressiert** (Nielsen #1 + #3): Explizite Bestätigung "Eingaben sind gespeichert" + "genau dort weitermachen" beseitigt die größte Nutzer-Angst. CTA-Text "& weitermachen" signalisiert Kontinuität statt Neustart — die wirkungsstärkste CTA-Formulierung dieser Analyse. **Implementierungshinweis:** Diese Meldung nur zeigen, wenn tatsächlich ein aktiver Kontext (Formular, Warenkorb) unterbrochen wurde; neutrale Version für einfache Login-Timeouts. Langfristige Best Practice: Session-Countdown-Warnung 2 Minuten vor Ablauf einbauen. |

  ---

  ## Angewandte UX-Prinzipien (Übersicht)

  | Prinzip | Angewendet bei |
  |---------|---------------|
  | **Blame the system, not the user** | #1, #2, #4, #5 |
  | **Progressive Disclosure** | #1, #5 (einfachste Lösung zuerst) |
  | **Dead-End-Vermeidung** (immer ≥ 1 CTA) | Alle |
  | **Nielsen #1** – Visibility of system status | #2, #4, #6 |
  | **Nielsen #3** – User control & freedom | #2, #6 |
  | **Nielsen #7** – Flexibility & efficiency of use | #5 |
  | **Nielsen #9** – Help users recognize, diagnose, recover | #1, #2, #3, #5 |
  | **Emotional Design / Stigma-Vermeidung** | #5, #6 |
  | **Context-aware Messaging** | #4, #6 |
  | **Proaktive Fehlervermeidung** (Systemempfehlung) | #6 |

  ---

  > **💡 Übergreifendes Prinzip:** Alle Optimierungen folgen dem Grundsatz *"Das System arbeitet für den Nutzer – nicht umgekehrt."* Fehler sind immer eine Kommunikationschance: Wer in einem Fehlermoment Orientierung, Empathie und einen klaren nächsten Schritt bietet, stärkt das Vertrauen nachhaltig – auch wenn etwas schiefläuft.
