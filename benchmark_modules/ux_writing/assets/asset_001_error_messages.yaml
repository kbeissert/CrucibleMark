# asset_001_error_messages.yaml
metadata:
  id: ux_writing_001
  name: "Error Messages - User-Friendly Rewriting"
  version: "1.0.0"
  category: ux_writing
  subcategory: error_messages
  difficulty: tiered
  estimated_time_seconds: 150
  tags: [error-messages, user-experience, clarity, tone]

context: |
  Du bist ein Senior UX Writer für eine E-Commerce-Plattform.
  Deine Aufgabe ist es, technische Fehlermeldungen in hilfreiche, nutzerzentrierte Texte zu verwandeln.

  Zielgruppe: Durchschnittliche Online-Käufer (kein technisches Wissen).
  Tone of Voice: Klar, lösungsorientiert, freundlich (aber nicht albern), prägnant.

prompt: |
  Analysiere die folgenden Fehlermeldungen und schreibe sie um.

  Eingabe-Fehlermeldungen:
  {input_text}

  WICHTIG: Bitte führe zuerst die ANALYSE durch (Schritt 1) und nenne explizit die identifizierten Probleme, bevor du die Optimierung erstellst (Schritt 2).

  Erfülle dabei strikt die folgenden Anforderungen:
  {requirements}

requirements:
  - "Erstelle eine Markdown-Tabelle mit den Spalten: `Original` | `Verbesserung` | `Begründung`."
  - "Entferne jeglichen technischen Jargon (z.B. Error Codes, Variablennamen, Systembegriffe)."
  - "Biete in jeder Verbesserung eine konkrete Handlungsanweisung (Call to Action) an."
  - "Vermeide Schuldzuweisungen an den Nutzer (z.B. 'Du hast falsch eingegeben')."
  - "Erkläre bei der Begründung kurz, welches UX-Prinzip angewendet wurde."
  - "Level 4 (Expert): Erkenne subtile Probleme wie 'Dead Ends' oder fehlende Empathie in Standard-Phrasen."

input_text: |
  1. Error: Database connection timeout (code: ETIMEDOUT)
  2. Error 500: Internal Server Error
  3. Invalid input in field 'email'
  4. Authentication failed: JWT token expired
  5. Payment declined
  6. "Your session has expired. Please log in again." (Problem: Datenverlust-Risiko)

testdata:
  issues:
    # LEVEL 1: Basic (Jargon & Clarity)
    - issue: "Technischer Jargon entfernt"
      severity: critical
      type: labeled
      explanation: "Begriffe wie ETIMEDOUT, Error 500, JWT müssen entfernt werden."
      keywords: ["etimedout", "error 500", "jwt", "token", "database"]
      inverse_match: true # Keywords DÜRFEN NICHT vorkommen

    - issue: "Verständliche Sprache"
      severity: high
      type: standard
      explanation: "Nutzerfreundliche Begriffe statt Systemsprache."
      keywords: ["verbindung", "server", "e-mail", "anmeldung", "zahlung"]

    # LEVEL 2: Intermediate (Actionable)
    - issue: "Handlungsanweisung vorhanden"
      severity: high
      type: standard
      explanation: "Jede Meldung muss sagen, was zu tun ist."
      keywords: ["versuchen", "prüfen", "erneut", "später", "kundenservice", "support"]

    # LEVEL 3: Advanced (Tone & Empathy)
    - issue: "Keine Schuldzuweisung"
      severity: medium
      type: advanced
      explanation: "Vermeidung von 'Invalid', 'Failed', 'Wrong' in Bezug auf Nutzer."
      keywords: ["ungültig", "falsch", "fehlerhaft"]
      inverse_match: true

    - issue: "UX-Prinzipien erklärt"
      severity: medium
      type: advanced
      explanation: "Begründung nennt UX-Konzepte."
      keywords: ["klarheit", "tonalität", "hilfsbereitschaft", "kontext", "prägnanz"]

    # LEVEL 4: Expert (Psychology & Strategy)
    - issue: "Session Expiry Empathy"
      severity: low
      type: expert
      explanation: "Erkennt das Risiko von Datenverlust bei Session Timeout und bietet Lösung (z.B. 'Wir haben deinen Warenkorb gespeichert')."
      keywords: ["gespeichert", "sicher", "keine sorge", "daten", "warenkorb"]

    - issue: "Payment Decline Help"
      severity: low
      type: expert
      explanation: "Bietet Alternativen bei abgelehntem Payment (z.B. 'Andere Methode' statt nur 'Abgelehnt')."
      keywords: ["andere zahlungsmethode", "kreditkarte prüfen", "bank kontaktieren", "alternative"]

scoring:
  total_points: 100

  error_detection:
    weight: 60
    default_required_ratio: 0.6
    description: "Erkennung und Behebung der UX-Probleme"

    # 1. Labeled Issues (10 Punkte)
    labeled_issues:
      - issue: "Technischer Jargon entfernt"
        points: 10
        keywords: ["etimedout", "error 500", "jwt", "token", "database"]
        inverse_match: true

    # 2. Standard Issues (20 Punkte)
    standard_issues:
      - issue: "Verständliche Sprache"
        points: 10
        keywords: ["verbindung", "server", "e-mail", "anmeldung", "zahlung"]

      - issue: "Handlungsanweisung vorhanden"
        points: 10
        keywords: ["versuchen", "prüfen", "erneut", "später", "kundenservice", "support"]

    # 3. Advanced Issues (15 Punkte)
    advanced_issues:
      - issue: "Keine Schuldzuweisung"
        points: 8
        keywords: ["ungültig", "falsch", "fehlerhaft"]
        inverse_match: true

      - issue: "UX-Prinzipien erklärt"
        points: 7
        keywords: ["klarheit", "tonalität", "hilfsbereitschaft", "kontext", "prägnanz"]

    # 4. Expert Issues (15 Punkte)
    expert_issues:
      - issue: "Session Expiry Empathy"
        points: 8
        keywords: ["gespeichert", "sicher", "keine sorge", "daten", "warenkorb"]

      - issue: "Payment Decline Help"
        points: 7
        keywords: ["andere zahlungsmethode", "kreditkarte prüfen", "bank kontaktieren", "alternative"]

  solution_quality:
    weight: 30
    description: "Qualität der Texte"

    criteria:
      - id: "SQ-001"
        name: "Markdown Tabelle vorhanden"
        points: 10
        check_method: "markdown_table_validation"
        min_rows: 6

      - id: "SQ-002"
        name: "Freundlicher Ton"
        points: 10
        check_method: "keyword_presence"
        keywords: ["bitte", "leider", "hoppla", "ups", "entschuldigung"]
        min_keywords: 1

      - id: "SQ-003"
        name: "Konkrete Lösungen"
        points: 10
        check_method: "keyword_presence"
        keywords: ["klicke hier", "link", "seite neu laden", "überprüfe"]
        min_keywords: 1

  formatting:
    weight: 10
    description: "Einhaltung der Formatvorgaben"
    criteria:
      - id: "FM-001"
        name: "Spaltenstruktur korrekt"
        points: 10
        check_method: "keyword_presence"
        keywords: ["Original", "Verbesserung", "Begründung"]
        min_keywords: 3
