# asset_003_onboarding_flow.yaml
metadata:
  id: ux_writing_003
  name: "Onboarding Flow - 3-Step Tutorial"
  version: "1.0.0"
  category: ux_writing
  subcategory: onboarding
  difficulty: tiered
  estimated_time_seconds: 240
  tags: [onboarding, tutorial, user-guidance, progressive-disclosure, psychology]

context: |
  Du bist ein Senior UX Writer für eine Projektmanagement-SaaS (ähnlich Asana/Trello).
  Das Feature "Automatische Workflows" ist komplex (Trigger, Conditions, Actions), soll aber für nicht-technische Nutzer einfach wirken.
  
  Zielgruppe: Projektmanager ohne Programmierkenntnisse.
  Ziel: Nutzer sollen verstehen, dass sie Routineaufgaben automatisieren können, ohne sich von "Wenn-Dann-Logik" erschlagen zu fühlen.

prompt: |
  Optimiere den folgenden 3-Schritt-Onboarding-Flow.
  
  Eingabe-Flow:
  {input_text}
  
  WICHTIG: Bitte führe zuerst die ANALYSE durch (Schritt 1) und nenne explizit die identifizierten Probleme, bevor du die Optimierung erstellst (Schritt 2).
  
  Erfülle dabei strikt die folgenden Anforderungen:
  {requirements}

requirements:
  - "Erstelle eine Markdown-Tabelle mit den Spalten: `Step` | `Original` | `Optimierung` | `Begründung`."
  - "Kürze jeden Schritt auf maximal 40 Wörter (Mobile First)."
  - "Ersetze technische Begriffe (Trigger, Condition, Action) durch Alltagssprache."
  - "Nutze das Prinzip der 'Progressive Disclosure' (nur relevante Infos pro Schritt)."
  - "Level 4 (Expert): Erkläre, wie du psychologische Prinzipien (z.B. Endowed Progress Effect) nutzt."

input_text: |
  Step 1 (Start):
  "Willkommen bei Automatischen Workflows! Ein Workflow besteht aus drei Komponenten: 1. Trigger (das auslösende Ereignis), 2. Conditions (optionale Bedingungen), 3. Actions (die auszuführenden Aktionen). In diesem ersten Schritt definieren Sie den Trigger. Ein Trigger ist ein Event, das den Workflow startet. Wählen Sie aus der Liste rechts einen Trigger aus."

  Step 2 (Logik):
  "Bedingungen (Conditional Logic). Optional können Sie Bedingungen definieren, die erfüllt sein müssen, bevor die Aktion ausgeführt wird. Beispiel: IF Task.Priority == 'Hoch' AND Task.Assignee == 'Team Lead' THEN führe Aktion aus. Sie können mehrere Bedingungen mit AND/OR-Operatoren kombinieren."

  Step 3 (Abschluss):
  "Konfiguration abgeschlossen. Ihr Workflow ist nun aktiv und wird im Hintergrund ausgeführt. Sie können ihn jederzeit im Dashboard bearbeiten oder deaktivieren. Klicken Sie auf 'Fertig', um zum Dashboard zurückzukehren."

testdata:
  issues:
    # LEVEL 1: Length & Jargon (Basic)
    - issue: "Step 1 gekürzt"
      severity: critical
      type: labeled
      explanation: "Original Step 1 ist viel zu lang (>50 Wörter). Muss drastisch gekürzt werden."
      keywords: ["willkommen", "komponenten", "definieren", "liste"]
      inverse_match: true # Darf diese Füllwörter nicht mehr enthalten

    - issue: "Kein Tech-Jargon"
      severity: critical
      type: labeled
      explanation: "Begriffe wie Trigger, Condition, Action, IF/THEN müssen weg."
      keywords: ["trigger", "condition"]
      inverse_match: true

    - issue: "Alltagssprache genutzt"
      severity: high
      type: standard
      explanation: "Statt 'Trigger' z.B. 'Auslöser' oder 'Wenn etwas passiert'."
      keywords: ["wenn", "sobald", "automatisch", "passiert", "regel"]

    - issue: "Step 2 vereinfacht"
      severity: high
      type: standard
      explanation: "Logik muss ohne Code-Beispiele erklärt werden."
      keywords: ["nur", "falls", "wichtig", "filter"]

    # LEVEL 3: Motivation & Benefit (Advanced)
    - issue: "Nutzen kommuniziert"
      severity: medium
      type: advanced
      explanation: "Fokus auf Zeitersparnis/Automatisierung statt technischer Funktion."
      keywords: ["zeit", "sparen", "automatisch", "erledigen", "helfen"]

    # LEVEL 4: Psychology (Expert)
    - issue: "Endowed Progress Effect"
      severity: low
      type: expert
      explanation: "Nutzer soll sich fühlen, als hätte er schon Fortschritt gemacht (z.B. 'Schritt 1 von 3 erledigt')."
      keywords: ["fortschritt", "fast", "geschafft", "gleich", "fertig", "progress"]

    - issue: "Positive Reinforcement"
      severity: low
      type: expert
      explanation: "Bestätigung nach Abschluss (Step 3) motiviert."
      keywords: ["super", "klasse", "bereit", "los", "startklar"]

scoring:
  total_points: 100
  
  error_detection:
    weight: 60
    default_required_ratio: 0.5
    description: "Erkennung und Optimierung des Onboarding-Flows"
    
    # 1. Labeled Issues (10 Punkte)
    labeled_issues:
      - issue: "Step 1 gekürzt"
        points: 5
        keywords: ["willkommen", "komponenten", "definieren", "liste"]
        inverse_match: true
        
      - issue: "Kein Tech-Jargon"
        points: 5
        keywords: ["trigger", "condition"]
        inverse_match: true

    # 2. Standard Issues (20 Punkte)
    standard_issues:
      - issue: "Alltagssprache genutzt"
        points: 10
        keywords: ["wenn", "sobald", "automatisch", "passiert", "regel"]
        
      - issue: "Step 2 vereinfacht"
        points: 10
        keywords: ["nur", "falls", "wichtig", "filter"]

    # 3. Advanced Issues (15 Punkte)
    advanced_issues:
      - issue: "Nutzen kommuniziert"
        points: 15
        keywords: ["zeit", "sparen", "automatisch", "erledigen", "helfen"]

    # 4. Expert Issues (15 Punkte)
    expert_issues:
      - issue: "Endowed Progress Effect"
        points: 8
        keywords: ["fortschritt", "fast", "geschafft", "gleich", "fertig", "progress"]
        
      - issue: "Positive Reinforcement"
        points: 7
        keywords: ["super", "klasse", "bereit", "los", "startklar"]

  solution_quality:
    weight: 30
    description: "Qualität der Texte"
    
    criteria:
      - id: "SQ-001"
        name: "Markdown Tabelle vorhanden"
        points: 10
        check_method: "markdown_table_validation"
        min_rows: 3
        
      - id: "SQ-002"
        name: "Kurze Schritte (< 40 Wörter)"
        points: 10
        check_method: "keyword_presence"
        keywords: ["wenn", "dann", "fertig"]
        min_keywords: 1
        
      - id: "SQ-003"
        name: "Progressive Disclosure"
        points: 10
        check_method: "keyword_presence"
        keywords: ["schritt", "weiter", "nächster"]
        min_keywords: 1

  formatting:
    weight: 10
    description: "Einhaltung der Formatvorgaben"
    criteria:
      - id: "FM-001"
        name: "Spaltenstruktur korrekt"
        points: 10
        check_method: "keyword_presence"
        keywords: ["Step", "Original", "Optimierung", "Begründung"]
        min_keywords: 4
