context: 'Du bist ein Senior UX Writer für eine Projektmanagement-SaaS (ähnlich Asana/Trello).

  Das Feature "Automatische Workflows" ist komplex (Trigger, Conditions, Actions),
  soll aber für nicht-technische Nutzer einfach wirken.


  Zielgruppe: Projektmanager ohne Programmierkenntnisse.

  Ziel: Nutzer sollen verstehen, dass sie Routineaufgaben automatisieren können, ohne
  sich von "Wenn-Dann-Logik" erschlagen zu fühlen.

  '
golden_standard: '

  **BEWERTUNGSRUBRIK (4x25 Punkte):**

  Bewerte die Antwort nach diesen 4 Dimensionen (je 25 Punkte, max. 100):

  1. Struktur-Compliance (Inkludierung aller geforderten Sektionen & klares Format)

  2. Inhaltliche Vollständigkeit (Abdeckung aller fachlichen Anforderungen)

  3. Beispiel-Qualität (konkrete, logische Flow/Beispiele vs. generisches Blabla)

  4. Ton/Sprache (Erfüllung des Golden Standards, passend zur Zielgruppe)

  # UX-Analyse & Optimierung: Automatische Workflows Onboarding


  ---


  ## Schritt 1: Analyse – Identifizierte Probleme


  ### 🔴 Kritische Probleme


  **1. Kognitive Überlastung (Cognitive Overload)**

  Step 1 erklärt alle drei Komponenten auf einmal, obwohl der Nutzer nur den ersten
  Schritt ausführen soll. Das verletzt Progressive Disclosure fundamental.


  **2. Technischer Jargon für Nicht-Techniker**

  Begriffe wie *Trigger*, *Conditions*, *Actions*, `IF/THEN`, `AND/OR-Operatoren`,
  `Task.Priority == ''Hoch''` und *Conditional Logic* setzen Programmierkenntnisse
  voraus und schrecken die Zielgruppe aktiv ab.


  **3. Pseudocode im UI-Text (Step 2)**

  ```

  IF Task.Priority == ''Hoch'' AND Task.Assignee == ''Team Lead'' THEN führe Aktion
  aus

  ```

  Dieser Code-Schnipsel gehört in eine Entwicklerdoku, nicht in ein Onboarding für
  Business-User. Er signalisiert unbewusst: *„Das ist nichts für dich."*


  **4. Fehlender emotionaler Nutzen / Value Proposition**

  Kein einziger Schritt erklärt, *warum* der Nutzer das Feature nutzen sollte. Der
  Fokus liegt ausschließlich auf dem *Wie* (Mechanik), nicht auf dem *Was bringt mir
  das* (Benefit). Das Problem wird in der Analyse benannt — muss aber auch in der
  Optimierung gelöst werden.


  **5. Verletzung von Mobile First / Wortanzahl**

  Step 1: ~70 Wörter, Step 2: ~55 Wörter – für Mobile-Screens deutlich zu lang.


  **6. Schwacher Abschluss (Step 3)**

  „Konfiguration abgeschlossen" ist technisch korrekt, aber emotional leer. Kein Erfolgsgefühl,
  keine Bestätigung was konfiguriert wurde.


  **7. Fehlende Fortschrittsverankerung**

  Nirgendwo wird signalisiert, wie weit der Nutzer ist (kein „Schritt 1 von 3").


  **8. Passive Sprache & fehlende Agency**

  „Die auszuführenden Aktionen", „wird im Hintergrund ausgeführt" — unpersönlich.
  Es fehlt das Gefühl, dass *der Nutzer* die Kontrolle hat, nicht das System.


  ---


  ## Schritt 2: Optimierter Onboarding-Flow


  | Step | Original | Optimierung | Begründung |

  |------|----------|-------------|------------|

  | **Step 1** – *Auslöser wählen* | „Willkommen bei Automatischen Workflows! Ein
  Workflow besteht aus drei Komponenten: 1. Trigger (das auslösende Ereignis), 2.
  Conditions (optionale Bedingungen), 3. Actions (die auszuführenden Aktionen). In
  diesem ersten Schritt definieren Sie den Trigger. Ein Trigger ist ein Event, das
  den Workflow startet. Wählen Sie aus der Liste rechts einen Trigger aus." | **Lass
  Routinearbeit für dich erledigen – in 3 kurzen Schritten.** **Schritt 1 von 3 ·
  Wann soll etwas passieren?** Wähle ein Ereignis, das deinen Workflow startet – z.
  B. *„Aufgabe wird als erledigt markiert"*. ✅ *1 von 3 Schritten abgeschlossen* |
  **Value Proposition zuerst:** Benefit vor Mechanik — löst Problem #4 der Analyse.
  **Progressive Disclosure:** Nur Step-1-Info sichtbar. **Endowed Progress Effect**
  (Nunes & Drèze, 2006): „1 von 3" suggeriert bereits erzielten Fortschritt. Alltagssprache
  ersetzt „Trigger". Konkretes Beispiel aktiviert episodisches Gedächtnis (**Construal
  Level Theory**). ≤ 35 Wörter. |

  | **Step 2** – *Bedingungen festlegen* | „Bedingungen (Conditional Logic). Optional
  können Sie Bedingungen definieren, die erfüllt sein müssen, bevor die Aktion ausgeführt
  wird. Beispiel: IF Task.Priority == ''Hoch'' AND Task.Assignee == ''Team Lead''
  THEN führe Aktion aus. Sie können mehrere Bedingungen mit AND/OR-Operatoren kombinieren."
  | **Schritt 2 von 3 · Für wen soll das gelten? (optional)** Grenze ein, wann der
  Workflow greift – z. B. *„Nur bei Aufgaben mit hoher Priorität"*. [+ Bedingung hinzufügen]
  · [Schritt überspringen →] | **Angstreduktion:** „optional" + gleichrangiger Skip-Button
  (nicht nur Fließtext) senken die Hemmschwelle. Kein Pseudocode. **Choice Architecture**
  + **Self-Determination Theory** (Deci & Ryan): Explizite Wahlmöglichkeit stärkt
  Autonomie-Bedürfnis und verhindert Reaktanz. **Endowed Progress Effect** setzt sich
  fort. ≤ 35 Wörter. |

  | **Step 3** – *Aktion & Abschluss* | „Konfiguration abgeschlossen. Ihr Workflow
  ist nun aktiv und wird im Hintergrund ausgeführt. Sie können ihn jederzeit im Dashboard
  bearbeiten oder deaktivieren. Klicken Sie auf ''Fertig'', um zum Dashboard zurückzukehren."
  | **Schritt 3 von 3 · Dann passiert das:** Was soll automatisch ausgeführt werden?
  z. B. *„Benachrichtige das Team per Slack"*. — **🎉 Dein erster Workflow läuft!**
  *Wenn [Trigger], dann [Aktion]* — ab jetzt automatisch für dich. Du kannst ihn jederzeit
  anpassen oder pausieren. **→ Jetzt testen** · **→ Zum Dashboard** | **Aktions-Selektion
  vor Celebration:** Step 3 enthält noch eine Auswahl-Aufgabe — die Optimierung muss
  das abbilden. **Dynamische Zusammenfassung** „Wenn X, dann Y" erzeugt den Aha-Moment
  und bestätigt korrekte Konfiguration. **Peak-End Rule** (Kahneman, 1993): Positiver
  Abschluss. **Foot-in-the-Door**: „erster Workflow" impliziert Wiederholung. **„Jetzt
  testen"-CTA** reduziert Post-Completion-Unsicherheit. ≤ 40 Wörter. |


  ---


  ## Expert Level: Psychologische Prinzipien im Detail


  ### 1. 🧠 Endowed Progress Effect (Nunes & Drèze, 2006)

  > *Menschen arbeiten motivierter an einem Ziel, wenn sie glauben, bereits Fortschritt
  gemacht zu haben.*


  **Anwendung:** „✅ 1 von 3 Schritten abgeschlossen" erscheint bereits in Step 1 —
  simuliert einen Vorsprung. In Studien erhöht das die Abschlussrate um bis zu 82
  % (Loyalty-Card-Experiment).


  ---


  ### 2. 🧠 Cognitive Load Theory (Sweller, 1988)

  > *Das Arbeitsgedächtnis hat begrenzte Kapazität (~4–7 Einheiten). Irrelevante Informationen
  blockieren das Lernen.*


  **Anwendung:** Jeder Schritt enthält ausschließlich eine Entscheidung. Das Drei-Komponenten-Modell
  wird nie explizit erklärt — der Nutzer *erlebt* es implizit durch die Abfolge.


  ---


  ### 3. 🧠 Peak-End Rule (Kahneman et al., 1993)

  > *Menschen erinnern Erlebnisse primär durch emotionalen Höhepunkt und Ende.*


  **Anwendung:** Step 3 ist bewusst als emotionaler Peak gestaltet. Das positive Ende
  prägt die Gesamtwahrnehmung des Onboardings — und erhöht Feature-Adoption.


  ---


  ### 4. 🧠 Choice Architecture & Self-Determination Theory (Thaler & Sunstein / Deci
  & Ryan)

  > *Wie Optionen präsentiert werden, beeinflusst Entscheidungen stärker als ihr Inhalt.
  Autonomie ist ein Grundbedürfnis.*


  **Anwendung:** „Schritt überspringen" als gleichrangiger Button (nicht Fließtext)
  nimmt den Druck aus Step 2 und verhindert Abbrüche durch Überforderung. Das stärkt
  das Autonomie-Bedürfnis aktiv.


  ---


  ### 5. 🧠 Concrete vs. Abstract Language (Construal Level Theory)

  > *Abstrakte Sprache erzeugt psychologische Distanz; konkrete Beispiele schaffen
  Nähe.*


  **Anwendung:** Jeder Schritt enthält ein kursives Alltagsbeispiel in Nutzersprache.
  Das aktiviert episodisches Gedächtnis — Nutzer können sich sofort vorstellen, wie
  das Feature ihren Alltag verändert.


  ---


  ### 6. 🧠 Mere Exposure Effect (Zajonc, 1968)

  > *Vertraute Konzepte werden als einfacher und angenehmer wahrgenommen.*


  **Anwendung:** „Wann soll etwas passieren?" wirkt nicht nur wegen fehlendem Jargon
  besser als „Trigger definieren" — sondern weil das Konzept aus dem Arbeitsalltag
  bereits bekannt ist. Das mentale Modell existiert; wir benennen es nur neu.


  ---


  ### Psychologisches Wirkprinzip (Narrativer Fluss)


  ```

  Step 1: Wenn …        → Endowed Progress + Concrete Language  →  „Ich kann das,
  ich habe schon angefangen"

  Step 2: Nur wenn …    → Cognitive Load ↓ + Autonomie          →  „Kein Druck, ich
  behalte die Kontrolle"

  Step 3: Dann … 🎉     → Peak-End Rule + Value Framing         →  „Das war einfach
  und bringt mir etwas"

  ```


  Die Wenn→Nur wenn→Dann-Struktur bildet eine **narrative Kette** (Narrative Transportation)
  — eine Mini-Story, die intuitiver verarbeitet wird als drei isolierte Konfigurationsschritte.


  ---


  ### Vorher / Nachher (Schätzwerte für Stakeholder-Kommunikation)


  | Metrik | Original | Optimiert | Δ |

  |--------|----------|-----------|---|

  | Wörter pro Step (Ø) | ~65 / ~50 / ~35 | ≤35 / ≤35 / ≤40 | −40 % |

  | Technische Begriffe | 8+ | 0 | −100 % |

  | Konkrete Beispiele | 1 | 3 | +200 % |

  | Psychological Anchors | 0 | 6 | — |


  > **Validierung:** A/B-Test gegen den Original-Flow mit den KPIs *Flow-Completion-Rate*,
  *Time-to-Complete* und *Feature-Adoption nach 7 Tagen*. Schätzwerte ohne empirische
  Validierung.

  '
input_text: 'Step 1 (Start):

  "Willkommen bei Automatischen Workflows! Ein Workflow besteht aus drei Komponenten:
  1. Trigger (das auslösende Ereignis), 2. Conditions (optionale Bedingungen), 3.
  Actions (die auszuführenden Aktionen). In diesem ersten Schritt definieren Sie den
  Trigger. Ein Trigger ist ein Event, das den Workflow startet. Wählen Sie aus der
  Liste rechts einen Trigger aus."


  Step 2 (Logik):

  "Bedingungen (Conditional Logic). Optional können Sie Bedingungen definieren, die
  erfüllt sein müssen, bevor die Aktion ausgeführt wird. Beispiel: IF Task.Priority
  == ''Hoch'' AND Task.Assignee == ''Team Lead'' THEN führe Aktion aus. Sie können
  mehrere Bedingungen mit AND/OR-Operatoren kombinieren."


  Step 3 (Abschluss):

  "Konfiguration abgeschlossen. Ihr Workflow ist nun aktiv und wird im Hintergrund
  ausgeführt. Sie können ihn jederzeit im Dashboard bearbeiten oder deaktivieren.
  Klicken Sie auf ''Fertig'', um zum Dashboard zurückzukehren."

  '
metadata:
  category: ux_writing
  difficulty: tiered
  estimated_time_seconds: 240
  id: ux_writing_003
  name: Onboarding Flow - 3-Step Tutorial
  subcategory: onboarding
  tags:
  - onboarding
  - tutorial
  - user-guidance
  - progressive-disclosure
  - psychology
  version: 1.0.0
prompt: 'Optimiere den folgenden 3-Schritt-Onboarding-Flow.


  Eingabe-Flow:

  {input_text}


  WICHTIG: Bitte führe zuerst die ANALYSE durch (Schritt 1) und nenne explizit die
  identifizierten Probleme, bevor du die Optimierung erstellst (Schritt 2). Halte
  die Analyse kompakt (max. 5-7 Sätze, nenne mindestens 3 konkrete Probleme), um
  das Token-Limit nicht zu sprengen.


  Erfülle dabei strikt die folgenden Anforderungen:

  {requirements}

  '
requirements:
- 'Erstelle eine Markdown-Tabelle mit den Spalten: `Step` | `Original` | `Optimierung`
  | `Begründung`.'
- Kürze jeden Schritt auf maximal 40 Wörter (Mobile First).
- Ersetze technische Begriffe (Trigger, Condition, Action) durch Alltagssprache.
- Nutze das Prinzip der 'Progressive Disclosure' (nur relevante Infos pro Schritt).
- 'Level 4 (Expert): Erkläre, wie du psychologische Prinzipien (z.B. Endowed Progress
  Effect) nutzt.'
scoring:
  error_detection:
    advanced_issues:
