      keywords:
      - zeit
      - sparen
      - automatisch
      - erledigen
      - helfen
      points: 15
    default_required_ratio: 0.5
    description: Erkennung und Optimierung des Onboarding-Flows
    expert_issues:
    - issue: Endowed Progress Effect
      keywords:
      - fortschritt
      - fast
      - geschafft
      - gleich
      - fertig
      - progress
      points: 8
    - issue: Positive Reinforcement
      keywords:
      - super
      - klasse
      - bereit
      - los
      - startklar
      points: 7
    labeled_issues:
    - inverse_match: true
      issue: Step 1 gekürzt
      keywords:
