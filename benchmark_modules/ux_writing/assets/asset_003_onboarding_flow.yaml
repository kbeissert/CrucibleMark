      keywords:
      - Step
      - Original
      - Optimierung
      - Begründung
      min_keywords: 4
      name: Spaltenstruktur korrekt
      points: 10
    description: Einhaltung der Formatvorgaben
    weight: 10
  solution_quality:
    criteria:
    - check_method: markdown_table_validation
      id: SQ-001
      min_rows: 3
      name: Markdown Tabelle vorhanden
      points: 10
    - check_method: keyword_presence
      id: SQ-002
      keywords:
      - wenn
      - dann
      - fertig
      min_keywords: 1
      name: Kurze Schritte (< 40 Wörter)
      points: 10
    - check_method: keyword_presence
      id: SQ-003
      keywords:
      - schritt
