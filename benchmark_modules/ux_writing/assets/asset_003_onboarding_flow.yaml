      - komponenten
      - definieren
      - liste
      points: 5
    - inverse_match: true
      issue: Kein Tech-Jargon
      keywords:
      - trigger
      - condition
      points: 5
    standard_issues:
    - issue: Alltagssprache genutzt
      keywords:
      - wenn
