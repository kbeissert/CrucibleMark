# asset_005_microcopy_audit.yaml
metadata:
  id: ux_writing_005
  name: "Microcopy Audit - Health App Context"
  version: "1.0.0"
  category: ux_writing
  subcategory: microcopy_audit
  difficulty: tiered
  estimated_time_seconds: 300
  tags: [microcopy, audit, health, empathy, safety, consistency]

context: |
  Du bist ein Senior UX Writer für eine Gesundheits-App (Medikamenten-Management).
  Zielgruppe: Ältere Nutzer (60+) und chronisch Kranke.
  Kontext: Hohe Verantwortung (Gesundheit), Compliance ist wichtig, aber Nutzer dürfen sich nicht bevormundet fühlen.

  Tone of Voice:
  - Empathisch & Beruhigend (nicht alarmierend)
  - Klar & Sicher (keine Mehrdeutigkeit bei Dosierungen)
  - Respektvoll (keine Schuldzuweisungen bei vergessener Einnahme)

prompt: |
  Führe ein Microcopy-Audit für die folgenden Screens durch und optimiere die Texte.

  Eingabe-Screens:
  {input_text}

  WICHTIG: Bitte führe zuerst die ANALYSE durch (Schritt 1) und nenne explizit die identifizierten Probleme, bevor du die Optimierung erstellst (Schritt 2). Halte diese Analyse extrem kurz und kompakt (max. 3-4 Sätze gesamt), um das Token-Limit nicht zu überschreiten.

  Erfülle dabei strikt die folgenden Anforderungen:
  {requirements}

requirements:
  - "Erstelle eine Markdown-Tabelle mit den Spalten: `Screen` | `Original` | `Optimierung` | `Begründung`."
  - "Stelle sicher, dass medizinische Angaben (Dosis, Einheit) absolut eindeutig sind."
  - "Vermeide alarmierende Sprache ('fällig', 'verpasst', 'Warnung') – nutze positive Bestärkung."
  - "Achte auf Barrierefreiheit (klare Handlungsanweisungen für Screen Reader)."
  - "Level 4 (Expert): Prüfe auf terminologische Konsistenz (Wording Consistency)."

input_text: |
  1. Screen: Medikament hinzufügen. Label: "Dosis". Placeholder: "z.B. 10". Hilfetext: "Geben Sie die Menge ein."
  2. Screen: Push-Notification. Text: "Medikament fällig!"
  3. Screen: Alert (Einnahme vergessen). Text: "Sie haben Ihre Medikation um 14:00 Uhr verpasst." Buttons: "OK" | "Später erinnern"
  4. Screen: Empty State (Start). Text: "Sie haben noch keine Medikamente hinzugefügt. Tippen Sie auf '+', um zu beginnen."
  5. Screen: Erfolgs-Toast. Text: "Einnahme bestätigt ✓"
  6. Screen: Account löschen. Text: "Wollen Sie Ihr Konto wirklich löschen? Alle Daten gehen verloren." Button: "Ja, löschen"

testdata:
  issues:
    # LEVEL 1: Safety & Clarity (Critical)
    - issue: "Einheit fehlt"
      severity: critical
      type: labeled
      explanation: "Bei Medikamenten muss die Einheit (mg, ml, Tabletten) klar sein. '10' reicht nicht."
      keywords: ["einheit", "mg", "ml", "tablette", "dosis", "spezifizieren"]

    - issue: "Notification unklar"
      severity: critical
      type: labeled
      explanation: "'Medikament fällig' sagt nicht welches. Risiko der Verwechslung."
      keywords: ["welches", "name", "konkret", "spezifisch"]

    # LEVEL 2: Tone & Empathy (Standard)
    - issue: "Keine Schuldzuweisung"
      severity: high
      type: standard
      explanation: "'Verpasst' erzeugt Schuldgefühle. Besser: Neutral erinnern."
      keywords: ["verpasst", "versäumt", "fehler"]
      inverse_match: true

    - issue: "Buttons sind klar"
      severity: high
      type: standard
      explanation: "'OK' ist mehrdeutig (Genommen? Gesehen?). Besser: 'Jetzt einnehmen' oder 'Erledigt'."
      keywords: ["genommen", "einnehmen", "erledigt", "bestätigen"]

    # LEVEL 3: Motivation (Advanced)
    - issue: "Empty State motiviert"
      severity: medium
      type: advanced
      explanation: "Erkläre den Nutzen (Warum hinzufügen?)."
      keywords: ["sicherheit", "überblick", "erinnerung", "gesundheit"]

    # LEVEL 4: Consistency (Expert)
    - issue: "Konsistente Terminologie"
      severity: low
      type: expert
      explanation: "Prüft, ob Begriffe wie 'Medikament' vs. 'Medikation' oder 'Einnahme' konsistent genutzt werden."
      keywords: ["konsistenz", "wording", "begriff", "einheitlich"]

    - issue: "Löschen Sicherheitsabfrage"
      severity: low
      type: expert
      explanation: "Bei Gesundheitsdaten ist 'Daten gehen verloren' zu schwach. Export anbieten oder Konsequenz klarer machen."
      keywords: ["export", "sichern", "unwiderruflich", "konsequenz"]

scoring:
  total_points: 100

  error_detection:
    weight: 60
    default_required_ratio: 0.4
    description: "Erkennung und Optimierung der Microcopy"

    # 1. Labeled Issues (10 Punkte)
    labeled_issues:
      - issue: "Einheit fehlt"
        points: 5
        keywords: ["einheit", "mg", "ml", "tablette", "dosis", "spezifizieren"]

      - issue: "Notification unklar"
        points: 5
        keywords: ["welches", "name", "konkret", "spezifisch"]

    # 2. Standard Issues (20 Punkte)
    standard_issues:
      - issue: "Keine Schuldzuweisung"
        points: 10
        keywords: ["verpasst", "versäumt", "fehler"]
        inverse_match: true

      - issue: "Buttons sind klar"
        points: 10
        keywords: ["genommen", "einnehmen", "erledigt", "bestätigen"]

    # 3. Advanced Issues (15 Punkte)
    advanced_issues:
      - issue: "Empty State motiviert"
        points: 15
        keywords: ["sicherheit", "überblick", "erinnerung", "gesundheit"]

    # 4. Expert Issues (15 Punkte)
    expert_issues:
      - issue: "Konsistente Terminologie"
        points: 8
        keywords: ["konsistenz", "wording", "begriff", "einheitlich"]

      - issue: "Löschen Sicherheitsabfrage"
        points: 7
        keywords: ["export", "sichern", "unwiderruflich", "konsequenz"]

  solution_quality:
    weight: 30
    description: "Qualität der Texte"

    criteria:
      - id: "SQ-001"
        name: "Markdown Tabelle vorhanden"
        points: 10
        check_method: "markdown_table_validation"
        min_rows: 6

      - id: "SQ-002"
        name: "Empathischer Ton"
        points: 10
        check_method: "keyword_presence"
        keywords: ["bitte", "erinnerung", "zeit", "einnahme"]
        min_keywords: 2

      - id: "SQ-003"
        name: "Sicherheitsrelevante Klarheit"
        points: 10
        check_method: "keyword_presence"
        keywords: ["mg", "ml", "tablette", "uhr"]
        min_keywords: 1

  formatting:
    weight: 10
    description: "Einhaltung der Formatvorgaben"
    criteria:
      - id: "FM-001"
        name: "Spaltenstruktur korrekt"
        points: 10
        check_method: "keyword_presence"
        keywords: ["Screen", "Original", "Optimierung", "Begründung"]
        min_keywords: 4


golden_standard: |
  # Microcopy-Audit: Medikamenten-Management App

  ---

  ## Schritt 1: Analyse – Identifizierte Probleme

  ### 🔴 Kritische Probleme

  **Screen 1 – Medikament hinzufügen (Dosis)**
  - **Fehlende Einheit:** Placeholder „z.B. 10" ist medizinisch gefährlich mehrdeutig. 10 mg? 10 ml? 10 Tabletten? Eindeutigkeit ist hier eine Patientensicherheitsfrage.
  - **Hilfetext zu generisch:** „Geben Sie die Menge ein" gibt keine Orientierung, welches Format erwartet wird.
  - **Kein Einheitsfeld:** Zahl und Einheit müssen als getrennte Eingaben konzipiert werden (Zahl + Dropdown), nicht als ein Freitext.

  **Screen 2 – Push-Notification**
  - **Alarmierende Sprache:** „fällig!" klingt wie eine Mahnung. Erzeugt Stress statt Motivation.
  - **Fehlender Kontext:** Kein Medikamentenname, keine Dosis – für Nutzer mit mehreren Medikamenten unbrauchbar.
  - **Kein Call-to-Action:** Kein direkter Bestätigungs-Button in der Notification.
  - **Barrierefreiheit:** Screen Reader liest nur „Medikament fällig!" ohne semantischen Kontext.

  **Screen 3 – Alert (Einnahme vergessen)**
  - **Schuldzuweisung:** „Sie haben … verpasst" verstößt gegen den Tone of Voice und kann bei chronisch Kranken Scham auslösen.
  - **Button „OK":** Bedeutungslos und für Screen Reader nicht interpretierbar.
  - **Button „Später erinnern":** Zeitlich unspezifisch – wann später?
  - **Medizinisches Sicherheitsrisiko:** Fehlt ein Hinweis, dass nicht alle Medikamente gefahrlos nachgeholt werden dürfen (z. B. Blutverdünner, Insulin).
  - **Terminologie-Inkonsistenz:** „Medikation" (Screen 3) vs. „Medikament" (andere Screens).

  ### 🟡 Mittlere Probleme

  **Screen 4 – Empty State**
  - **Negativer Einstieg:** „Sie haben noch keine Medikamente hinzugefügt" betont Mangel statt Möglichkeit.
  - **Icon-Referenz als Barriere:** „Tippen Sie auf '+'" ist für Screen Reader suboptimal und fragil bei UI-Änderungen.
  - **Kein Mehrwert-Versprechen:** Fehlende Motivation – warum sollte der Nutzer beginnen?

  **Screen 5 – Erfolgs-Toast**
  - **Kein Medikamentenname:** Bei mehreren Medikamenten Unsicherheit, ob das Richtige bestätigt wurde.
  - **Barrierefreiheit:** Toast-Meldungen werden von Screen Readern nicht automatisch vorgelesen – `aria-live="polite"` erforderlich. „✓" kann als „Häkchen" oder gar nicht vorgelesen werden.
  - **Keine positive Bestärkung:** Verpasste Chance für Adherence-Motivation.

  **Screen 6 – Account löschen**
  - **Unspezifische Konsequenz:** „Alle Daten gehen verloren" – welche Daten konkret?
  - **Kein Alternativangebot:** Keine Option zum Daten-Export vor Löschung.
  - **Button-Wording:** „Ja, löschen" – „Ja" redundant, schwächt Klarheit.
  - **Kein expliziter Abbrechen-Button** als Safe Default.

  ### 🔵 Terminologie-Konsistenz-Audit

  | Begriff | Verwendung | Problem |
  |---|---|---|
  | „Medikament" | Screen 1, 2, 4 | ✅ Primärer Term |
  | „Medikation" | Screen 3 | ❌ Synonym – inkonsistent |
  | „Dosis" | Screen 1 | Ohne Einheitsfeld unvollständig |
  | „Einnahme" | Screen 5 | ✅ Primärer Handlungsterm |
  | „Konto" | Screen 6 | ✅ Deutschsprachig konsistent |
  | „verpasst" / „fällig" | Screen 2, 3 | ❌ Alarmierende Terminologie – eliminieren |

  ---

  ## Schritt 2: Optimierung

  | Screen | Original | Optimierung | Begründung |
  |---|---|---|---|
  | **1 – Dosis-Feld** | **Label:** Dosis · **Placeholder:** z.B. 10 · **Hilfetext:** Geben Sie die Menge ein. | **Label:** Dosis & Einheit · **Feld 1 (Zahl):** Placeholder: z. B. 10 · **Feld 2 (Dropdown):** mg / ml / Tablette(n) / Tropfen / IE · **Hilfetext:** Tragen Sie Menge und Einheit ein – genau so, wie es auf Ihrer Packung oder Ihrem Rezept steht. | ① **Patientensicherheit:** Zwei getrennte Felder eliminieren die Mehrdeutigkeit (10 mg ≠ 10 ml). ② Hilfetext verankert Angabe an Packungsbeilage/Rezept. ③ **Dropdown** ist für motorisch eingeschränkte Nutzer leichter als freie Texteingabe. |
  | **2 – Push-Notification** | Medikament fällig! | **Titel:** Zeit für Ihr Ramipril · **Body:** Jetzt einnehmen – 5 mg, 1 Tablette · **Action-Button:** ✓ Eingenommen | ① „Fällig" → einladende Formulierung, kein Mahnungs-Ton. ② Medikamentenname + Dosis direkt in der Notification – bei Polypharmazie (5+ Medikamente) essenziell. ③ **Notification Action** ermöglicht Bestätigung ohne App-Öffnung (iOS/Android). ④ Screen Reader liest vollständigen Satz mit Kontext. |
  | **3 – Alert (Einnahme vergessen)** | Sie haben Ihre Medikation um 14:00 Uhr verpasst. · **Buttons:** OK · Später erinnern | **Titel:** Ramipril noch nicht eingenommen · **Body:** Möchten Sie die Einnahme jetzt nachholen? Bitte prüfen Sie in Ihrer Packungsbeilage, ob das bei diesem Medikament möglich ist. · **Button 1 (primär):** Jetzt einnehmen · **Button 2 (sekundär):** In 30 Minuten erinnern · **Button 3 (tertiär):** Einnahme heute auslassen | ① **Keine Schuldzuweisung:** „noch nicht eingenommen" beschreibt Zustand, bewertet nicht. ② **Sicherheitshinweis:** Nachholen ist nicht bei allen Medikamenten sicher (Blutverdünner, Insulin). ③ **Drei klare Aktionen** statt bedeutungslosem „OK". ④ **Konkrete Zeitangabe** „In 30 Minuten" schafft Verlässlichkeit. ⑤ Terminologie: „Medikament"/Name statt „Medikation". |
  | **4 – Empty State** | Sie haben noch keine Medikamente hinzugefügt. Tippen Sie auf '+', um zu beginnen. | **Headline:** Ihr persönlicher Medikamentenplan wartet auf Sie · **Body:** Fügen Sie Ihr erstes Medikament hinzu – wir erinnern Sie dann zuverlässig an jede Einnahme. · **Button:** Erstes Medikament hinzufügen | ① **Empathischer Einstieg:** Headline formuliert positiven Ausblick statt Mangel. ② **Mehrwert-Versprechen** im Body: Nutzer verstehen sofort Nutzen. ③ **Dedizierter CTA-Button** statt Icon-Referenz: barrierefreier, robuster, Screen Reader liest vollständigen Buttontext. ④ Terminologie: „Medikament" + „Einnahme" konsistent. |
  | **5 – Erfolgs-Toast** | Einnahme bestätigt ✓ | **Text:** Ramipril eingenommen – gut gemacht! · **Subtext (optional):** Nächste Einnahme: heute, 20:00 Uhr · *(aria-label: „Einnahme von Ramipril erfolgreich gespeichert")* | ① **Medikamentenname** gibt Sicherheit, dass das Richtige bestätigt wurde. ② **„gut gemacht!"** = positive Bestärkung, fördert Adherence (Therapietreue) nachweislich. ③ **Optionaler Subtext** gibt proaktiv die nächste relevante Information. ④ **Barrierefreiheit:** Toast als `aria-live="polite"`-Region. Separates `aria-label`, da „✓" als „Häkchen" oder gar nicht vorgelesen wird. |
  | **6 – Account löschen** | Wollen Sie Ihr Konto wirklich löschen? Alle Daten gehen verloren. · **Button:** Ja, löschen | **Titel:** Konto dauerhaft löschen · **Body:** Ihr Medikamentenplan, Ihre Einnahmehistorie und alle gespeicherten Erinnerungen werden unwiderruflich gelöscht. · **Hinweis-Link:** 💾 Daten vorher exportieren · **Button 1 (destruktiv):** Konto endgültig löschen · **Button 2 (primär, Safe Default):** Abbrechen | ① **Spezifische Konsequenzen** statt „alle Daten": informierte Entscheidung möglich. ② **Export-Hinweis** als Sicherheitsnetz: Respektiert Autonomie. ③ „Ja, löschen" → „Konto endgültig löschen": Redundantes „Ja" entfernt, „endgültig" verdeutlicht Irreversibilität. ④ **„Wirklich" entfernt**: Bevormundend. ⑤ **Abbrechen als Safe Default** schützt vor versehentlichem Tippen (besonders 60+). |

  ---

  ## Zusammenfassung: Wording-Konsistenz-Glossar

  > Diese Regeln sollten ins **Content Style Guide** der App übernommen werden.

  | ✅ Verwenden | ❌ Vermeiden | Begründung |
  |---|---|---|
  | Medikament / [Medikamentenname] | Medikation, Arznei, Präparat | Einheitlicher, allgemeinverständlicher Term |
  | einnehmen / eingenommen | nehmen, schlucken, konsumieren | Medizinisch korrekt, nicht umgangssprachlich |
  | Einnahme | Dosis (als Handlungsterm) | „Dosis" = Menge; „Einnahme" = Handlung |
  | Konto | Account, Profil | Deutschsprachige Konsistenz |
  | noch nicht eingenommen | verpasst, vergessen, versäumt | Keine Schuldzuweisung |
  | Zeit für … / Jetzt einnehmen | fällig, überfällig, Warnung | Einladend statt mahnend |
  | endgültig / dauerhaft | wirklich (bevormundend) | Klar, ohne Fachjargon |
  | Erinnerung | Alarm, Warnung, Mahnung | Unterstützend statt alarmierend |

  ---

  ## Kernprinzipien (HEART-Prinzip für Gesundheits-Apps)

  ```
  H – Helpful:     Konkrete Handlungsoptionen, nie bedeutungslose Buttons (kein „OK")
  E – Empowering:  Nutzer behält Kontrolle (Einnahme auslassen, Daten exportieren, Abbrechen)
  A – Accurate:    Medizinische Eindeutigkeit vor allem anderen (Einheit immer explizit)
  R – Respectful:  Keine Schuldzuweisungen, keine Bevormundung, Alltagssprache
  T – Trustworthy: Sicherheitshinweise wo nötig, transparente Konsequenzen
  ```

  > **Grundregel:** Jede Microcopy-Entscheidung beantwortet zwei Fragen: *„Versteht jemand mit 70 Jahren ohne UX-Kenntnisse das sofort?"* und *„Entsteht durch diese Formulierung ein Sicherheitsrisiko?"*
