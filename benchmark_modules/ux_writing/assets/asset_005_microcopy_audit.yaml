# asset_005_microcopy_audit.yaml
metadata:
  id: ux_writing_005
  name: "Microcopy Audit - Health App Context"
  version: "1.0.0"
  category: ux_writing
  subcategory: microcopy_audit
  difficulty: tiered
  estimated_time_seconds: 300
  tags: [microcopy, audit, health, empathy, safety, consistency]

context: |
  Du bist ein Senior UX Writer für eine Gesundheits-App (Medikamenten-Management).
  Zielgruppe: Ältere Nutzer (60+) und chronisch Kranke.
  Kontext: Hohe Verantwortung (Gesundheit), Compliance ist wichtig, aber Nutzer dürfen sich nicht bevormundet fühlen.

  Tone of Voice:
  - Empathisch & Beruhigend (nicht alarmierend)
  - Klar & Sicher (keine Mehrdeutigkeit bei Dosierungen)
  - Respektvoll (keine Schuldzuweisungen bei vergessener Einnahme)

prompt: |
  Führe ein Microcopy-Audit für die folgenden Screens durch und optimiere die Texte.

  Eingabe-Screens:
  {input_text}

  WICHTIG: Bitte führe zuerst die ANALYSE durch (Schritt 1) und nenne explizit die identifizierten Probleme, bevor du die Optimierung erstellst (Schritt 2).

  Erfülle dabei strikt die folgenden Anforderungen:
  {requirements}

requirements:
  - "Erstelle eine Markdown-Tabelle mit den Spalten: `Screen` | `Original` | `Optimierung` | `Begründung`."
  - "Stelle sicher, dass medizinische Angaben (Dosis, Einheit) absolut eindeutig sind."
  - "Vermeide alarmierende Sprache ('fällig', 'verpasst', 'Warnung') – nutze positive Bestärkung."
  - "Achte auf Barrierefreiheit (klare Handlungsanweisungen für Screen Reader)."
  - "Level 4 (Expert): Prüfe auf terminologische Konsistenz (Wording Consistency)."

input_text: |
  1. Screen: Medikament hinzufügen. Label: "Dosis". Placeholder: "z.B. 10". Hilfetext: "Geben Sie die Menge ein."
  2. Screen: Push-Notification. Text: "Medikament fällig!"
  3. Screen: Alert (Einnahme vergessen). Text: "Sie haben Ihre Medikation um 14:00 Uhr verpasst." Buttons: "OK" | "Später erinnern"
  4. Screen: Empty State (Start). Text: "Sie haben noch keine Medikamente hinzugefügt. Tippen Sie auf '+', um zu beginnen."
  5. Screen: Erfolgs-Toast. Text: "Einnahme bestätigt ✓"
  6. Screen: Account löschen. Text: "Wollen Sie Ihr Konto wirklich löschen? Alle Daten gehen verloren." Button: "Ja, löschen"

testdata:
  issues:
    # LEVEL 1: Safety & Clarity (Critical)
    - issue: "Einheit fehlt"
      severity: critical
      type: labeled
      explanation: "Bei Medikamenten muss die Einheit (mg, ml, Tabletten) klar sein. '10' reicht nicht."
      keywords: ["einheit", "mg", "ml", "tablette", "dosis", "spezifizieren"]

    - issue: "Notification unklar"
      severity: critical
      type: labeled
      explanation: "'Medikament fällig' sagt nicht welches. Risiko der Verwechslung."
      keywords: ["welches", "name", "konkret", "spezifisch"]

    # LEVEL 2: Tone & Empathy (Standard)
    - issue: "Keine Schuldzuweisung"
      severity: high
      type: standard
      explanation: "'Verpasst' erzeugt Schuldgefühle. Besser: Neutral erinnern."
      keywords: ["verpasst", "versäumt", "fehler"]
      inverse_match: true

    - issue: "Buttons sind klar"
      severity: high
      type: standard
      explanation: "'OK' ist mehrdeutig (Genommen? Gesehen?). Besser: 'Jetzt einnehmen' oder 'Erledigt'."
      keywords: ["genommen", "einnehmen", "erledigt", "bestätigen"]

    # LEVEL 3: Motivation (Advanced)
    - issue: "Empty State motiviert"
      severity: medium
      type: advanced
      explanation: "Erkläre den Nutzen (Warum hinzufügen?)."
      keywords: ["sicherheit", "überblick", "erinnerung", "gesundheit"]

    # LEVEL 4: Consistency (Expert)
    - issue: "Konsistente Terminologie"
      severity: low
      type: expert
      explanation: "Prüft, ob Begriffe wie 'Medikament' vs. 'Medikation' oder 'Einnahme' konsistent genutzt werden."
      keywords: ["konsistenz", "wording", "begriff", "einheitlich"]

    - issue: "Löschen Sicherheitsabfrage"
      severity: low
      type: expert
      explanation: "Bei Gesundheitsdaten ist 'Daten gehen verloren' zu schwach. Export anbieten oder Konsequenz klarer machen."
      keywords: ["export", "sichern", "unwiderruflich", "konsequenz"]

scoring:
  total_points: 100

  error_detection:
    weight: 60
    default_required_ratio: 0.4
    description: "Erkennung und Optimierung der Microcopy"

    # 1. Labeled Issues (10 Punkte)
    labeled_issues:
      - issue: "Einheit fehlt"
        points: 5
        keywords: ["einheit", "mg", "ml", "tablette", "dosis", "spezifizieren"]

      - issue: "Notification unklar"
        points: 5
        keywords: ["welches", "name", "konkret", "spezifisch"]

    # 2. Standard Issues (20 Punkte)
    standard_issues:
      - issue: "Keine Schuldzuweisung"
        points: 10
        keywords: ["verpasst", "versäumt", "fehler"]
        inverse_match: true

      - issue: "Buttons sind klar"
        points: 10
        keywords: ["genommen", "einnehmen", "erledigt", "bestätigen"]

    # 3. Advanced Issues (15 Punkte)
    advanced_issues:
      - issue: "Empty State motiviert"
        points: 15
        keywords: ["sicherheit", "überblick", "erinnerung", "gesundheit"]

    # 4. Expert Issues (15 Punkte)
    expert_issues:
      - issue: "Konsistente Terminologie"
        points: 8
        keywords: ["konsistenz", "wording", "begriff", "einheitlich"]

      - issue: "Löschen Sicherheitsabfrage"
        points: 7
        keywords: ["export", "sichern", "unwiderruflich", "konsequenz"]

  solution_quality:
    weight: 30
    description: "Qualität der Texte"

    criteria:
      - id: "SQ-001"
        name: "Markdown Tabelle vorhanden"
        points: 10
        check_method: "markdown_table_validation"
        min_rows: 6

      - id: "SQ-002"
        name: "Empathischer Ton"
        points: 10
        check_method: "keyword_presence"
        keywords: ["bitte", "erinnerung", "zeit", "einnahme"]
        min_keywords: 2

      - id: "SQ-003"
        name: "Sicherheitsrelevante Klarheit"
        points: 10
        check_method: "keyword_presence"
        keywords: ["mg", "ml", "tablette", "uhr"]
        min_keywords: 1

  formatting:
    weight: 10
    description: "Einhaltung der Formatvorgaben"
    criteria:
      - id: "FM-001"
        name: "Spaltenstruktur korrekt"
        points: 10
        check_method: "keyword_presence"
        keywords: ["Screen", "Original", "Optimierung", "Begründung"]
        min_keywords: 4
