metadata:
  id: "cultural_intel_004"
  name: "Formal vs. Informal German"
  version: "1.0"
  description: "Tests ability to switch register from formal (Sie) to informal (Du) in business communication"
  tier: 2
  tags:
    - "formality"
    - "register"
    - "business"
    - "german"

prompt: |
  Rewrite this customer support email from formal (Sie) to informal (Du).

  Convert all formal language to casual/friendly tone. Keep all professional information intact.
  IMPORTANT: Output ONLY the rewritten German text. Do NOT explain your changes.

  Original Text:
  "Sehr geehrte Frau Müller,

  vielen Dank für Ihre Anfrage bezüglich unseres Produkts. Wir haben Ihre Nachricht erhalten und möchten Sie gerne unterstützen.

  Sie können die Software über Ihr Kundenportal herunterladen. Sollten Sie weitere Fragen haben, können Sie sich jederzeit an uns wenden.

  Mit freundlichen Grüßen,
  Das Support-Team"

scoring:
  criteria:
    weight: 100
    description: "10-Point Register Switch Check (Sie/Du, Formal/Informal)"

expected_output: |
  "Hallo [Name],

  danke für deine Anfrage zu unserem Produkt. Wir haben deine Nachricht erhalten und helfen dir gerne weiter.

  Du kannst die Software über dein Kundenportal runterladen. Falls du noch Fragen hast, melde dich einfach bei uns.

  Viele Grüße,
  Dein Support-Team"

golden_standard: |
  Hallo Frau Müller,

  vielen Dank für deine Anfrage bezüglich unseres Produkts. Wir haben deine
  Nachricht erhalten und möchten dir gerne helfen.

  Du kannst die Software über dein Kundenportal herunterladen. Solltest du weitere
  Fragen haben, kannst du dich jederzeit an uns wenden.

  Liebe Grüße,
  Das Support-Team

  ---

  **5 Begründungen:**

  1. **„Hallo" statt „Sehr geehrte"** – Die Anrede „Hallo" kombiniert professionelle
     Freundlichkeit mit der informellen Du-Ansprache. Sie entspricht dem Ton moderner
     Tech-Support-Kommunikation in Deutschland, die bewusst zwischen förmlichem
     Briefstil und zu lockerer Chat-Sprache positioniert ist.

  2. **„du" (Kleinschreibung) konsequent** – Im modernen deutschen
     Geschäftsschriftverkehr ist die Kleinschreibung des informellen „du" die
     Standardform (Duden-Empfehlung seit 2011). Die Großschreibung „Du" ist auf
     persönliche Anschreiben (Werbebriefe, handschriftliche Kommunikation) beschränkt.

  3. **Nachname in der Anrede beibehalten** – „Frau Müller" statt „[Vorname]" –
     auch bei Du-Ansprache bleibt der Nachname in der Eröffnungszeile erhalten.
     Das signalisiert professionelle Distanz trotz informellem Register und
     entspricht dem deutschen Support-Konventionsstandard.

  4. **„Liebe Grüße"** – Diese Verabschiedungsformel ist der idiomatische Standard
     für informell-freundliche Geschäftskorrespondenz in Deutschland. „Viele Grüße"
     ist leicht formeller; „Mit freundlichen Grüßen" wäre zu förmlich für das
     Du-Register.

  5. **„Das Support-Team" statt personalisierten Absenders** – In automatisierten
     oder teambasierten Support-Responses ist die unpersönliche Teambezeichnung
     üblich. Sie wahrt die institutionelle Stimme, ohne eine nicht vorhandene
     persönliche Beziehung zu simulieren.
