metadata:
  id: "cultural_intel_005"
  name: "German Idioms & Expressions"
  version: "1.0"
  description: "Tests ability to replace English idioms with authentic German equivalents (not literal translations)"
  tier: 3
  tags:
    - "idioms"
    - "cultural-fit"
    - "translation"
    - "german"

prompt: |
  Replace these English idioms with natural German equivalents.

  RULES:
  - DO NOT translate word-for-word (e.g., "went south" ≠ "ging nach Süden")
  - Use authentic German expressions that convey the same meaning
  - Keep the business context intact

  IMPORTANT: Output ONLY the rewritten German text. Do NOT explain your changes.

  Original Text:
  "The project went south last week. We need to think outside the box and come up with a game plan. Let's touch base on Monday to get the ball rolling. We can't afford to drop the ball on this one."

scoring:
  total_points: 100
  # Updated to V2-compatible structure (Dict instead of List) for validation stability
  # Note: Actual logic remains in LegacyEvaluator._evaluate_german_idioms()
  criteria:
    weight: 100
    description: "12-Point Idiom Translation Check (6 idioms, 2 points each)"
    expected_idioms: ["went south", "outside the box", "game plan", "touch base", "get the ball rolling", "drop the ball"]

expected_output: |
  "Das Projekt ging letzte Woche schief. Wir müssen kreativ denken und einen Plan entwickeln. Lass uns am Montag kurz sprechen, um die Sache ins Rollen zu bringen. Wir können uns hier keinen Fehler erlauben."

golden_standard: |
  „Das Projekt ist letzte Woche den Bach runtergegangen. Wir müssen über den
  Tellerrand hinausschauen und uns eine Strategie überlegen. Lass uns am Montag
  kurz zusammenkommen, um die Sache ins Rollen zu bringen. Wir können es uns
  nicht leisten, diesmal einen Fehler zu machen."

  ---

  **Idiom-Mapping (Original → Deutsch):**

  | Englisches Idiom | Deutsche Entsprechung | Anmerkung |
  |---|---|---|
  | *went south* | *den Bach runtergegangen* | Etabliertes deutsches Idiom für „ist gescheitert / hat sich verschlechtert" |
  | *think outside the box* | *über den Tellerrand hinausschauen* | Die am weitesten verbreitete deutsche Entsprechung; deckt den Bedeutungsraum vollständig ab |
  | *get the ball rolling* | *die Sache ins Rollen bringen* | Direktes strukturelles Äquivalent; im deutschsprachigen Business-Deutsch idiomatisch |
  | *can't afford to drop the ball* | *können es uns nicht leisten, einen Fehler zu machen* | Moderatere Formulierung, die im deutschen Geschäftskontext natürlicher klingt als eine wörtliche Übertragung |

  ---

  **5 Begründungen:**

  1. **„Den Bach runtergehen"** – Das trifft den Bedeutungskern von *went south* am
     genauesten: eine negative Entwicklung, die eingetreten ist und nicht mehr
     rückgängig zu machen ist. Alternativen wie „schiefgelaufen" sind beschreibender,
     aber weniger idiomatisch in einem Kontext, der Dringlichkeit und emotionale
     Färbung erfordert.

  2. **„Über den Tellerrand hinausschauen"** – Dieser Ausdruck ist das Standard-Äquivalent
     zu *think outside the box* im deutschen Business-Deutsch. Er ist so etabliert, dass
     er in Führungskräfte-Kommunikation und Stellenausschreibungen als Standardformulierung
     gilt. „Unkonventionell denken" wäre korrekt, aber weniger idiomatisch.

  3. **„Die Sache ins Rollen bringen"** – Direktes strukturelles Äquivalent zu *get the
     ball rolling*. Der Ausdruck ist registerneutral (informell bis semi-formal) und
     passt damit zum Ton des Ausgangstexts (internes Meeting-Gespräch).

  4. **„Es uns nicht leisten, einen Fehler zu machen"** – Die Passage *can't afford to
     drop the ball* enthält das bildhafte *drop the ball* (= Fehler begehen, scheitern).
     Eine direkte Lehnübersetzung „den Ball fallen lassen" ist im Deutschen ungebräuchlich.
     Die semantisch äquivalente Formulierung ohne Direktübertragung klingt natürlicher.

  5. **Kasierende Einheitlichkeit des Registers** – Alle vier Idiome wurden im gleichen
     semi-formalen Register gehalten, das dem Original entspricht: informell genug für
     internes Geschäftsgespräch, präzise genug für schriftliche Kommunikation. Ein
     Stilbruch (z. B. „in den Sand setzen" wäre umgangssprachlicher) hätte die
     Kohärenz des Texts beeinträchtigt.
