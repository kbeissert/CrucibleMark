metadata:
  id: "cultural_intel_003"
  name: "Berlin Agency Vibe"
  version: "1.0"
  description: "Tests ability to filter out 10 specific corporate buzzwords"
  tier: 3
  tags:
    - "tone"
    - "creative"
    - "german"
    - "marketing"
  language: de
  language_weight: 0.20
  language_task_weight: 0.80
  language_instruction_style: cross_lingual

prompt: |
  Rewrite this corporate text for a Berlin Agency intro ("Du"-tone).
  Remove ALL corporate buzzwords. Output must sound authentic German (Berlin style).
  Output ONLY the rewritten German text. Responding in any other language will be scored as non-compliant regardless of content quality.
  Do NOT repeat the original text or explain your changes.

  Original:
  "We utilize a holistic ecosystem to drive synergy. Our paradigm-shift is a gamechanger. We take a deep-dive into next-level disruptive solutions to ensure 360-degree success."

scoring:
  criteria:
    weight: 100
    description: "10-Point Penalty Check: +10 for each of the 10 buzzwords REMOVED"

expected_output: |
  "Wir nutzen ein umfassendes System für gute Zusammenarbeit. Unser Ansatz ändert alles. Wir schauen genau hin, um gute Lösungen für euren Erfolg zu finden."

golden_standard: |
  Wir schauen uns an, was wirklich gebraucht wird – und lösen es. Kein Blabla,
  keine halben Sachen. Wir denken Dinge neu, wenn's nötig ist, und finden Wege,
  die tatsächlich funktionieren. Versprochen.

  ---

  **5 Begründungen:**

  1. **„Kein Blabla" als stilistischer Anker** – Der Berliner Agentur-Ton lebt
     von direkter Ablehnung von Worthülsen. Die Formulierung ist selbstreferenziell:
     Sie verspricht Klarheit durch klare Sprache. Das erzeugt sofort Glaubwürdigkeit
     bei der Zielgruppe (Berliner Start-up- und Kreativbranche).

  2. **Kurze, aktive Sätze ohne Subjekt-Redundanz** – Statt „Wir sind eine Agentur,
     die..." beginnt jeder Satz mit einer direkten Handlungsaussage. Das entspricht
     dem minimalistischen Schreibstil, der im Berliner Kreativumfeld als authentisch
     gilt und sich von korporatem Marketing-Deutsch abgrenzt.

  3. **„wenn's nötig ist" als gesprochene Verkürzung** – Die Kontraktion (*wenn es*)
     signalisiert bewusste Informalität und Nähe zum gesprochenen Deutsch. In
     Agentur-Copytexts dieser Tonalität ist das ein stilistisches Marker-Element,
     das die Zielgruppe als „einer von uns" wahrnimmt.

  4. **„tatsächlich funktionieren" statt Superlativ-Inflation** – Statt
     „bahnbrechende Lösungen" oder „revolutionärer Ansatz" (typische Agentur-
     Übertreibungen) wählt die Formulierung bewusst understatement. Das wirkt
     für Berliner B2B-Kunden glaubwürdiger als Marketing-Superlative.

  5. **„Versprochen." als Schlusspunkt** – Ein einwortiger Satz als Commitments-
     Formel ist ein stilistisches Alleinstellungsmerkmal. Er ersetzt langatmige
     Garantie-Formulierungen durch emotionale Direktheit – ein Kernmerkmal des
     Berliner Agentur-Kommunikationsstils.
