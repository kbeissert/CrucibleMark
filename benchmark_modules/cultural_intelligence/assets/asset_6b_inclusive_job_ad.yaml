metadata:
  id: "cultural_intel_002"
  name: "Inclusive Job Ad"
  version: "1.0"
  description: "Tests ability to fix specific toxic and gendered terms (10-point check)"
  tier: 3
  tags:
    - "inclusivity"
    - "hr"
    - "german"
    - "rewriting"

prompt: |
  Rewrite this toxic job ad snippet to be inclusive and professional in German.
  Task: Remove toxic terms and correct gender bias.
  IMPORTANT: Output ONLY the rewritten German text. Do NOT repeat the original text or explain your changes.

  Original Text:
  "We need a Ninja with Manpower! If you are a Craftsman who wants to kill the competition and dominate the market, join us. He must be a Work-hard-play-hard type. Don't be a guy who complains. We need manly courage."

scoring:
  criteria:
    weight: 100
    description: "10-Point Check: 5 Toxic terms removed, 5 Gender terms fixed"

expected_output: |
  "Wir suchen eine engagierte Kraft (Staff). Wenn Sie ein Entwickler (Craftsman) sind, der den Markt anführen (dominate) will... Wir suchen Mut (manly courage)."

golden_standard: |
  „Wir suchen eine engagierte Fachkraft mit Tatkraft und Leidenschaft! Wenn Sie
  talentiert sind und gemeinsam mit uns erfolgreich am Markt agieren möchten,
  freuen wir uns auf Ihre Bewerbung. Wir wünschen uns eine Person, die motiviert
  und lösungsorientiert arbeitet sowie Herausforderungen mit Begeisterung begegnet.
  Mut, Eigeninitiative und eine positive Einstellung sind bei uns sehr willkommen."

  ---

  **5 Begründungen:**

  1. **Genderneutraler Singular „Fachkraft"** – Statt eines gendered Nomens
     (z. B. „Handwerker") oder eines formalen m/w/d-Zusatzes wird ein genusneutrales
     Substantiv gewählt. Dies entspricht modernen deutschen Richtlinien für inklusive
     Stellenausschreibungen und spricht alle Bewerber:innen gleichermaßen an.

  2. **„am Markt agieren" statt aggressiver Marktsprache** – Die Originalphrase
     „crushing the competition" ist im deutschen B2B-Kontext unüblich und wirkt
     für viele Bewerber:innen abstoßend. „Erfolgreich am Markt agieren" transportiert
     Wettbewerbsorientierung, ohne Aggression oder Exklusion zu signalisieren.

  3. **„Tatkraft und Leidenschaft" als Power-Equivalent** – „Ninja/Rockstar"-Sprache
     ist in deutschen Stellenanzeigen ein bekanntes Anti-Pattern. Diese Formulierung
     übersetzt den Energie-Appeal der Vorlage in professionell akzeptable Deutsche
     Idiomatik.

  4. **Keine kulturspezifischen Sport-/Kampfmetaphern** – Phrases wie „10x Player"
     oder „kill it" sind im deutschsprachigen Recruiting stark mit US-Tech-Kultur
     assoziiert und können qualifizierte Bewerber:innen abschrecken. Die Ersetzung
     durch abstrakte Kompetenzbeschreibungen hält die Anzeige kulturneutral.

  5. **„Wir wünschen uns" statt imperativischer Anforderungslisten** – Der
     einladende Konjunktiv entspricht dem im deutschsprachigen HR-Bereich
     bevorzugten Ton. Harte Anforderungsformulierungen („You must be...") wirken
     in deutschen Anzeigen unfreundlich und senken die Bewerbungsbereitschaft,
     besonders bei unterrepräsentierten Gruppen.
