# ============================================================
# Test-Kontext und Aufgabenstellung
# ============================================================

context: |
  Du bist ein Senior Backend Engineer. Du reviewst einen Entwurf für eine REST-API (Flask-basiert),
  die von einem Junior-Entwickler geschrieben wurde. Der Code funktioniert technisch, verletzt aber
  viele REST-Prinzipien und Best Practices.

prompt: |
  Analysiere den folgenden Python/Flask-Code auf **API-Design-Fehler** und **REST-Verstöße**.
  
  Der Code enthält drei Kategorien von Fehlern:
  1. **Markierte Issues**: Bereits identifizierte Probleme (bestätige diese).
  2. **Offensichtliche Issues**: Standard REST-Fehler (Verben, Status Codes).
  3. **Subtile Issues**: Architektur-Probleme (Idempotenz, Versionierung, Security).

  ## Deine Aufgabe
  Finde und erkläre **ALLE** Design-Fehler. Priorisiere sie nach Schweregrad.

  **API Code (Flask):**
  ```python
  from flask import Flask, request, jsonify
  
  app = Flask(__name__)
  
  # In-memory database
  users = []
  
  # ISSUE 1: Wrong HTTP Verb for fetching data
  @app.route('/get_users', methods=['POST'])
  def get_all_users():
      return jsonify(users), 200
  
  # ISSUE 2: Non-standard URL structure
  @app.route('/create_new_user_entry', methods=['POST'])
  def add_user():
      data = request.json
      
      # Validation
      if 'username' not in data:
          # Returning 200 OK even for errors
          return jsonify({"error": "Missing username", "status": "fail"}), 200
      
      user = {
          "id": len(users) + 1,
          "username": data['username'],
          "email": data.get('email', '')
      }
      users.append(user)
      
      return jsonify({"message": "User created", "id": user['id']}), 200
  
  @app.route('/user/delete', methods=['GET'])
  def delete_user():
      user_id = request.args.get('id')
      # Logic to delete user...
      return jsonify({"status": "deleted"}), 200
      
  @app.route('/api/update_email', methods=['POST'])
  def update_email():
      # Updates email, but what if network fails and client retries?
      # Not idempotent!
      user_id = request.json.get('id')
      new_email = request.json.get('email')
      
      for user in users:
          if user['id'] == user_id:
              user['email'] = new_email
              # Side effect: Sends email notification every time
              send_notification(user['email'], "Email changed") 
              return jsonify(user), 200
              
      return jsonify({"error": "User not found"}), 404

  # Helper
  def send_notification(email, msg):
      print(f"Sending email to {email}: {msg}")
  ```

  ### Anforderungen an die Antwort:
  1. Liste alle gefundenen Design-Fehler auf.
  2. Gib für jeden Fehler an:
     - **Kategorie** (z.B. REST Violation, Error Handling)
     - **Warum** es problematisch ist
     - **Verbesserungsvorschlag** (Code-Snippet oder Konzept)

# ============================================================
# Test-Daten (Issues zum Erkennen)
# ============================================================

test_data:
  issues:
    # --- LEVEL 1: Labeled (Easy) ---
    - issue: "Wrong Verb (GET vs POST)"
      severity: "high"
      type: "labeled"
      explanation: "GET statt POST für Datenabruf (/get_users)."
    
    - issue: "URL Naming (/create_new_user_entry)"
      severity: "medium"
      type: "labeled"
      explanation: "URLs sollten Ressourcen bezeichnen (Nomen), keine Verben."

    # --- LEVEL 2: Unlabeled Standard (Medium) ---
    - issue: "Status Code 200 for Errors"
      severity: "high"
      type: "standard"
      explanation: "Fehler sollten 4xx Codes nutzen, nicht 200 OK mit Error-Body."
    
    - issue: "GET for State Change (Delete)"
      severity: "critical"
      type: "standard"
      explanation: "Löschen via GET ist unsicher (Caching, Crawler)."
      
    - issue: "Inconsistent Response Format"
      severity: "medium"
      type: "standard"
      explanation: "Mal Wrapper-Objekt, mal direktes Array."

    # --- LEVEL 3: Hidden / Advanced (Hard) ---
    - issue: "Missing Versioning"
      severity: "medium"
      type: "advanced"
      explanation: "Keine API-Versionierung (/v1/) in URL oder Header."
      
    - issue: "No Pagination"
      severity: "medium"
      type: "advanced"
      explanation: "get_all_users gibt alles zurück -> Performance-Problem."
      
    - issue: "Query Params vs Path Params"
      severity: "medium"
      type: "advanced"
      explanation: "Delete nutzt Query Param (?id=) statt Path Param (/users/1)."

    # --- LEVEL 4: Expert (Very Hard) ---
    - issue: "Idempotency Violation"
      severity: "high"
      type: "expert"
      explanation: "Update-Endpunkt sendet bei jedem Retry eine E-Mail (Side Effect)."

    - issue: "Security Headers / Content Type"
      severity: "medium"
      type: "expert"
      explanation: "Fehlende Content-Type Validierung oder Security Headers."

# ============================================================
# Scoring-Konfiguration
# ============================================================

scoring:
  total_points: 100
  
  error_detection:
    weight: 60
    description: "Erkennung der Design-Fehler (Gestaffelt)"
    
    # 1. Labeled Issues (10 Punkte)
    labeled_issues:
      - issue: "Wrong Verb (GET/POST)"
        points: 5
        keywords: ["verb", "method", "get", "post", "http method"]
      
      - issue: "URL Naming"
        points: 5
        keywords: ["resource", "noun", "verb", "url structure", "naming convention"]

    # 2. Standard Issues (15 Punkte)
    standard_issues:
      - issue: "Status Code 200 Error"
        points: 5
        keywords: ["status code", "200 ok", "400", "4xx", "http status"]
        
      - issue: "GET for Delete"
        points: 5
        keywords: ["delete", "get request", "unsafe", "method"]
        
      - issue: "Inconsistent Response"
        points: 5
        keywords: ["envelope", "wrapper", "consistent", "json structure"]

    # 3. Advanced Issues (15 Punkte)
    advanced_issues:
      - issue: "Missing Versioning"
        points: 5
        keywords: ["versioning", "v1", "api version", "breaking change"]
        
      - issue: "No Pagination"
        points: 5
        keywords: ["pagination", "limit", "offset", "performance", "large dataset"]
        
      - issue: "Query vs Path Params"
        points: 5
        keywords: ["path param", "query param", "restful", "identifier"]

    # 4. Expert Issues (20 Punkte)
    expert_issues:
      - issue: "Idempotency Violation"
        points: 10
        keywords: ["idempotency", "idempotent", "side effect", "retry", "email", "notification"]
        
      - issue: "Security Headers"
        points: 10
        keywords: ["content-type", "header", "security", "cors", "accept"]

  solution_quality:
    weight: 30
    description: "Qualität der Verbesserungsvorschläge"
    
    criteria:
      - id: "SQ-001"
        name: "Correct Status Codes"
        points: 10
        check_method: "code_validation"
        required_elements: ["400", "201", "204"]
        min_code_blocks: 1
        
      - id: "SQ-002"
        name: "Resource Oriented URLs"
        points: 10
        check_method: "keyword_presence"
        keywords: ["/users", "/users/<id>", "methods=['GET']", "methods=['DELETE']"]
        min_keywords: 2
        
      - id: "SQ-003"
        name: "Idempotency Fix"
        points: 10
        check_method: "keyword_presence"
        keywords: ["idempotency key", "check if sent", "state check", "put vs patch"]
        min_keywords: 1

  formatting:
    weight: 10
    description: "Struktur"
    criteria:
      - id: "FM-001"
        name: "Strukturierte Liste"
        points: 10
        check_method: "markdown_table_validation"
        min_rows: 5
