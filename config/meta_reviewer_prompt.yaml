    ## Diagnostischer Check: Output-Vollständigkeit (Truncation-Failure)
    Prüfe alle Protokolle auf abgebrochene Antworten — insbesondere im UX-Writing-Modul, aber auch in Documentation Quality und Content Transformation.
    Ein Truncation-Failure liegt vor, wenn die Modell-Antwort mitten in einer Ausgabe endet: eine Tabelle bricht nach einem Teil der Zeilen ab, eine Liste wird nicht abgeschlossen, ein Strukturelement fehlt erkennbar.

    **Wichtig:** Truncation ist strukturell ein anderes Versagen als Instruction-Non-Compliance oder Qualitätsschwäche. Es bedeutet: Das Modell hat gegen sein eigenes Output-Limit laufengelassen und die Antwort technisch abgeschnitten. Der Score-Abzug entsteht nicht weil die Antwort falsch ist, sondern weil sie unvollständig ist.

    **Wenn ein oder mehrere Truncation-Failures erkannt werden:**
    - Benenne das jeweils betroffene Modul explizit — keine internen Test-IDs, die für externe Leser nicht nachvollziehbar sind.
    - Formuliere präzise: "Im [Modul]-Bereich bricht eine Ausgabe mitten in [Tabelle/Auflistung/Struktur] ab — die Antwort ist technisch abgebrochen, kein inhaltlicher Fehler. Der Abzug im Score resultiert aus der unvollständigen Antwort, nicht aus inhaltlichen Mängeln."
    - **Position im Artikel:** Der Truncation-Befund erscheint innerhalb desselben Abschnitts, der das betroffene Modul bewertet — direkt nach der inhaltlichen Modul-Auswertung, als eigenständiger Absatz. Kein gesonderter Hauptabschnitt, kein Anhang.
    - **Absolutes Formulierungsverbot:** Verwende für ein Modul, in dem ein Truncation-Failure aufgetreten ist, unter keinen Umständen Formulierungen wie "zeigt eine sichere Hand", "liefert solide Arbeit", "überzeugt durchgehend", "arbeitet zuverlässig" oder semantisch äquivalente positive Pauschalurteile, die den Truncation-Failure unsichtbar machen. Auch wenn andere Tests des Moduls gut liefen, relativiert ein Truncation-Failure das Modul-Gesamturteil spürbar — das muss im Text sichtbar sein.

    **Wenn kein Truncation-Failure erkannt wird:** Schreibe ABSOLUT NICHTS zu diesem Check. Kein erklärender Satz, keine Erwähnung dass dieser Check stattfand, keine "grüne" Zusammenfassung. Der fertige Artikel enthält zu diesem Thema null Zeichen. Das Modul wird uneingeschränkt nach inhaltlicher Qualität bewertet.



    ## Diagnostischer Check: Sprachkonsistenz (Instruction-Following über mehrere Tests)
    Prüfe alle Tests eines Moduls systematisch darauf, ob Sprachfehler (falsche Ausgabesprache trotz expliziter Sprachvorgabe) oder Längenüberschreitungen (mehr als 150% des gesetzten Wortlimits) als isolierter Einzelfall oder als kategoriales Muster auftreten.

    **Definition kategoriales Muster:** Derselbe Fehlertyp tritt in zwei oder mehr Tests desselben Moduls auf.

    **Wenn ein kategoriales Muster erkannt wird:**
    Formuliere es als strukturelles Versagen, nicht als Anekdote. Pflichtformulierung sinngemäß: "Das [Fehlertyp: Sprachversagen / Längenproblem] ist kein isolierter Ausreißer. Über mehrere Aufgaben im [Modul]-Bereich zeigt das Modell ein konsistentes Muster: Bei simultanen Vorgaben aus Sprache, Länge und Format verliert es [die Sprachvorgabe / das Wortlimit] als erste Bedingung." Beschreibe die betroffenen Aufgaben inhaltlich kurz (z. B. "eine Videoskript-Aufgabe im Content-Transformation-Modul") — keine internen Test-IDs, die für externe Leser nicht nachvollziehbar sind.
    **Position im Artikel:** Der Befund erscheint innerhalb des Abschnitts, der das betroffene Modul bewertet — als eigenständiger Absatz, nicht als Fußnote.

    **Wenn nur ein einzelner Test betroffen ist:**
    Formuliere es als dokumentierten Einzelfall: "In einer Aufgabe im [Modul]-Bereich antwortete das Modell trotz expliziter [Sprach- / Längenvorgabe] auf [Englisch / N% über Limit] — ein Ausreißer, der im Produktiveinsatz ohne Nachkontrolle direkt fehlschlägt." Konstruiere kein Muster, wo keines ist.

    **Wenn kein Fehler erkennbar ist:** Schreibe ABSOLUT NICHTS zu diesem Check. Kein erklärender Satz, keine Erwähnung dass dieser Check stattfand. Der fertige Artikel enthält zu diesem Thema null Zeichen.



