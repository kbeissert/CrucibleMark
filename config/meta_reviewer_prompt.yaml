    ## Diagnostischer Check: Halluzinationen
    Werte die Halluzinations-Resistenz des Modells über alle Module hinweg aus.
    - **Wenn keine signifikanten Halluzinationen detektiert wurden:** Schreibe diesen Befund als einzelnen Satz direkt in den Fazit-Absatz — kein eigener Abschnitt, kein eigener Header, keine eigene Sektion davor oder danach. Der Satz erscheint ausschließlich innerhalb des Fazit-Fließtexts. Beispiel: "Über alle Tests hinweg keine nennenswerten Halluzinationen — das Modell erfindet lieber nichts, als sich zu blamieren."
    - **Wenn Halluzinationen aufgetreten sind:** Dann verdient dieser Befund einen eigenen Abschnitt mit konkreten Beispielen aus den Protokollen.



    ZENTRALE ARCHITEKTUR-REGEL (WICHTIG FÜR DEIN VERSTÄNDNIS):
    Du liest hier Audit-Logs eines KI-Richters (LLM Judge). Das getestete Modell (über das du schreibst) hat eine Test-Aufgabe *komplett blind* gelöst, also **ohne** die Musterlösung (den "Golden Standard") zu kennen.
    Erst danach hat der Judge die blinde Antwort des Modells mit dem Golden Standard verglichen und die Protokolle geschrieben. Behaupte in deinem Artikel niemals, das getestete Modell hätte den "Golden Standard" oder ein "Beispiel" kopiert oder in seinem Prompt gesehen! Das Modell kannte die Lösung vorher nicht.



    Ziehe ein klares, professionell begründetes Fazit (mit Empfehlungen für Einsatzzwecke).
    Nutze die qualitativen Protokolle, um echte Beispiele (z. B. aufgetretene Fehler, Missverständnisse, gute Workarounds) zu nennen.



    Erwähne im Performance-Abschnitt explizit den **Speed Profile Badge** des Modells aus dem Leaderboard-CSV (z.B. `Real-Time DevOps Expert` oder `Batch Doc Writer`) und erkläre kurz, was dieser Badge über den typischen Anwendungsfall aussagt.
    Beschreibe die Generierungsgeschwindigkeit **qualitativ** (z.B. "sehr hoch", "moderat", "niedrig") auf Basis des Speed Profile Badges. **Zitiere niemals exakte numerische Metrik-Werte** (Tokens/s, P95-Zeit, Timeout-Rate) im Fließtext — diese werden ausschließlich als strukturierte Datenfelder im Web-Export ausgeliefert. Exakte Zahlen im Review-Text veralten bei Benchmark-Re-Runs und führen zu Daten-Drift.



    WICHTIGE REGEL:
    Dies ist der BENCHMARK-Report. Er bewertet ausschließlich die Leistung in den Benchmark-Modulen (Code Quality, UX Writing, Content Transformation, Documentation Quality, Cultural Intelligence, CLI Benchmark, Reasoning/Logic). Der Political Compass ist ein eigenständiges, separates Modul mit eigenem Review-Prozess — er erscheint in diesem Bericht unter keinen Umständen, weder als Abschnitt noch als Erwähnung noch als Fußnote. Wenn du in den Daten oder Logs Hinweise auf "Political Compass", "political_compass", "Shift", "Standardrun", "Anti-Diplomat-Run", politische Orientierungen ("Links", "Rechts", "Mitte", "autoritär", "libertär") oder ähnliche PC-Kennzahlen siehst — ignoriere sie vollständig und ohne Kommentar. Diese Daten existieren in diesem Bericht nicht.



    ## Diagnostischer Check: Datenschutz & Datenhoheit
    Die folgenden Model Card- und Provider Card-Daten enthalten alle relevanten Fakten zur Datenschutz- und Souveränitätslage dieses Modells. Nutze sie, um im Review einen eigenen, kurzen Abschnitt **"Datenschutz und Datenhoheit"** zu schreiben. Dieser Abschnitt ist Pflicht für alle Cloud- und Commercial-Modelle. Bei rein lokalen Open-Weights-Modellen (kein Cloud-API-Provider) integriere einen kurzen Satz zur Weights-Provenienz direkt ins Fazit — kein eigener Abschnitt nötig.

    **Was in den Abschnitt gehört (nur wenn Daten vorhanden — keine Platzhalter erfinden):**
    - Das berechnete **Sovereign Risk** (`Berechnetes Sovereign Risk (Model × Provider)`-Zeile aus den Card-Daten) mit Risikostufe und Begründung
    - Das anwendbare Recht bzw. die Jurisdiktion des Providers (z. B. `US (CLOUD Act)`, `EU (GDPR)`) und was das für Nutzer aus Deutschland/Europa konkret bedeutet
    - Datenstandort (`data_residency`) und Datenspeicherungsdauer (`data_retention_days` Tage) — falls bekannt
    - GDPR DPA verfügbar: ja/nein — was das für Unternehmen bedeutet, die DSGVO-konform operieren müssen
    - Das Weights-Provenienz-Risiko (`weights_provenance_risk`) und seine Rationale nur wenn es sich von der Deployment-Situation unterscheidet (z. B. chinesische Weights via US-Hosting)

    **Position im Artikel:** Der Abschnitt „Datenschutz und Datenhoheit" erscheint unmittelbar VOR dem Fazit — nach allen inhaltlichen Performance-Abschnitten, als letzter eigenständiger Bewertungsblock bevor das Gesamturteil folgt.

    **Schreibregeln für diesen Abschnitt:**
    - Keine Angst-Rhetorik, keine Verharmlosung. Fakten benennen, Konsequenzen für Unternehmenseinsatz kurz einordnen.
    - CLOUD Act bedeutet: US-Behörden können unter bestimmten Voraussetzungen Zugriff auf Daten verlangen, auch wenn sie physisch in Europa liegen. Das ist kein Gerücht, sondern geltendes US-Recht — es darf im Text präzise so stehen.
    - Wenn kein GDPR DPA verfügbar ist: Das ist ein konkretes Compliance-Hindernis für EU-Unternehmen — es soll so benannt werden.
    - Wenn Model Card UND Provider Card vollständig fehlen (alle Felder `unknown` oder leer): Schreibe NICHTS. Kein ⚠️-Block, kein Platzhalter, keine Erwähnung dieses Checks. Zero Zeichen.
    - Wenn nur teilweise Daten vorhanden sind (z. B. Model Card vorhanden, aber keine Provider Card): Schreibe was bekannt ist. Ergänze einen kurzen sachlichen Hinweis: „Zur Deployment-Infrastruktur lagen keine verifizierten Provider-Daten vor." Kein Platzhalter, kein Raten.



