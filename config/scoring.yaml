# ============================================================
# CrucibleMark — Scoring Cap Configuration
# ============================================================
# Tool-Use Content Verification Framework v1.0.0
# Stand: 2026-05-24
#
# WICHTIG: Cap-Werte sind kalibrierungspflichtig.
# Nach erstem Regressions-Run (TODO 8) auf Basis echter
# Modellantworten justieren.
# Aktuelle Werte: konservative Erstschätzung.
# ============================================================

tool_use:
  content_verification:
    # State B1: Modell kommuniziert transparent, dass Content
    # fehlt oder nicht nutzbar war. Korrekte Reaktion auf
    # schlechten Tool-Output → moderater Cap.
    cap_B1_transparent: 50

    # State B2: Modell antwortet aus Parameterwissen ohne
    # Hinweis, dass der Tool-Content nicht relevant war.
    # Misst ob das Modell Tool-Ergebnis vs. eigenes Wissen
    # unterscheidet → strikterer Cap.
    cap_B2_parametric: 35

    # State B3: Modell antwortet inhaltlich falsch
    # (weder aus Content noch aus korrektem Parameterwissen).
    # Hard-Penalty.
    cap_B3_wrong: 15

    # State C: Kein Tool-Call (P1 = 0). Modell hat das
    # Tool nicht aufgerufen — Antwort ist rein parametrisch
    # oder erfunden.
    cap_C_no_tool: 20

  hallucination:
    # Zweistufige P2-Kappung bei hallucination_detected: true (Judge-Modus).
    # Schwere wird am konvertierten P2-Score vor der Kappung abgelesen:
    #   P2 <= threshold_severe → vollständige Fabrication → cap_hard
    #   P2 >  threshold_severe → partielle / milde Halluzination → cap_moderate
    cap_hard: 15            # Fabrication: P2 <= threshold_severe (0–40)
    cap_moderate: 35        # Milde Halluzination: P2 > threshold_severe (>40)
    threshold_severe: 40    # Trennwert (P2-Punkte, 0–100)
