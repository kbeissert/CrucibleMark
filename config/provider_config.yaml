      # server-models (nur Modelle aus der aktuellen Spark-Liste)
      # 1) Gemma4-26B/gemma-4-26B-A4B-it-UD-Q8_K_XL [25.7 GB]
      - id: gemma-4-26B-A4B-it-UD-Q8_K_XL
        name: Gemma 4 26B A4B Instruct UD-Q8_K_XL (GGUF)
        model_file: Gemma4-26B/gemma-4-26B-A4B-it-UD-Q8_K_XL.gguf
        n_gpu_layers: 99
        enable_thinking: false
        temperature: 1.0
        top_k: 64

      # 2) Hermes4-3/NousResearch_Hermes-4.3-36B-Q6_K [27.6 GB]
      - id: hermes-4.3-36b-q6
        name: Hermes 4.3 36B Q6_K (GGUF)
        model_file: Hermes4-3/NousResearch_Hermes-4.3-36B-Q6_K.gguf
        n_gpu_layers: 99
        enable_thinking: false
        temperature: 0.8
        min_p: 0.05

        # Hermes 4.3 36B ist ein Hybrid-Mode Reasoning Modell (basierend auf
        # ByteDance Seed-OSS 36B) mit SWA/Hybrid-Attention. Beobachtung aus
        # ~/ai/llama-lab-spark.log (8.6.2026, 22:49-23:47 Benchmark-Lauf):
        #   - llama.cpp hat trotz Config context_window=65536 auf n_ctx=16384
        #     runterreguliert (n_ctx_train=524288 ist das Trainingsfenster des
        #     Modells, llama.cpp wählt automatisch einen kleineren Slot wenn
        #     4× parallel × 65536 × 36B-Layer nicht in den Speicher passt)
        #   - 4 parallele Slots in Verbindung mit SWA-Re-Processings
        #     ("forcing full prompt re-processing due to lack of cache data")
        #     führen nach Heavy-Tasks (>200s) zu sporadischen Connection-Resets
        #     am OpenAI-Client ("Retrying request to /chat/completions")
        #   - Decoding-Speed 5.83-5.92 t/s (vs. 43-44 t/s für Gemma 4 26B-A4B
        #     auf demselben Server) belegt den Recurrent-Layer-Overhead
        # Override: hermes-spezifisch auf n_ctx=16384 + parallel=1 zwingen,
        # damit llama.cpp den 4-Slot-Betrieb für dieses eine Modell aufgibt.
        # Per-Modell-Override lässt die anderen Spark-Modelle (Qwen 3.6, Gemma 4)
        # unverändert auf 4 parallel.

        context_length: 16384     # --ctx-size; Provider-Default context_window=65536
        parallel: 1                # Provider-Default parallel=4; siehe _build_server_cmd()
        # num_predict bleibt global bei 65536 (Token-Output-Cap reicht für längste Hermes-Outputs: 2145 T)

      # 3) Gemma4-31b/gemma-4-31B-it-UD-Q8_K_XL [+MTP ⚡] [32.6 GB + 0.5 GB Draft]
      - id: gemma-4-31B-it-UD-Q8_K_XL-mtp
        name: Gemma 4 31B IT UD-Q8_K_XL [+MTP ⚡] (GGUF)
        model_file: Gemma4-31b/gemma-4-31B-it-UD-Q8_K_XL.gguf
        model_draft_file: Gemma4-31b/gemma-4-31B-it-Q8_0-MTP.gguf
        n_gpu_layers: 99
        enable_thinking: false
        context_length: 131072
        extra_server_args:
