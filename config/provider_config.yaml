        max_tokens: 16384
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        reasoning_effort: medium  # Begrenzt Endlos-Reasoning (vLLM 0.27.2rc1 + MOD thinking-budget-by-effort)
        # repetition_penalty:  # TOML-Default (kein Override)
        enable_thinking: true

      # GPT-OSS 120B — lokales vLLM auf gx10 (MoE 117B total / 5.1B active, MXFP4).
      # MoE: 128 Experten, 4 aktiv pro Token; 36 Layer (18 sliding + 18 full attention).
      # Native MXFP4-Quantisierung (quant_method: mxfp4 in config.json).
      # 128K Context via YaRN factor=32 von 4096.
      # Sampling: TOML via --generation-config auto (HF-Card: temperature=0.6, top_p=0.95, top_k=20).
      # reasoning_effort per Request (low/medium/high); --reasoning-parser openai_gptoss.
      # WICHTIG: 120b belegt den GESAMTEN 128-GB-GPU-Memory — muss allein laufen.
      # vllm-stop --yes vor dem Start, sonst kein KV-Cache Headroom.
      - id: gpt-oss-120b
        name: GPT-OSS 120B (vLLM, MoE, MXFP4, 128K)
        config: gpt-oss-120b
        max_tokens: 16384
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        enable_thinking: true

      # GPT-OSS 20B — kleines Schwestermodell zu 120B, gleiche Harmony-Architektur.
      # MoE 21B total / 3.6B active, native MXFP4 (kein NVFP4-PTQ).
      # 128K Context via YaRN factor=32 von 4096.
      # Sampling konsistent mit gpt-oss-120b (HF-Card-Defaults, --generation-config auto).
      # Reasoning-Effort per Request (low/medium/high) via Harmony-Chat-Template;
      # --reasoning-parser openai_gptoss, --reasoning-config reasoniert Channel-Extraction.
      # TOML: ~/ai/shared/configs/vllm/models/gpt-oss-20b.toml
      # Rest-Klasse auf GB10 (gpu_memory_utilization 0.72, ~14 GB Weights).
      # Dual-Profile via enable_thinking: true (Standard + Thinking).
      - id: gpt-oss-20b
        name: GPT-OSS 20B (vLLM, MoE, MXFP4, 128K)
        config: gpt-oss-20b
        max_tokens: 16384
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        enable_thinking: true

      # Muse Glimmer 30B NVFP4 — Meta Superintelligence Labs, Dense Multimodal
      # (30B Text-Decoder + 1.8B ViT-G/14 Perception-Encoder), Apache-2.0,
