    ollama_cloud:
      name: Ollama (Cloud Proxies)
      api_type: ollama
      model_type: open_weights_cloud
      enabled: false  # Paywall — via OpenRouter abgedeckt
      auto_discover: true
      models_filter: cloud
      models: []

  # ── Lokale Modelle (Ollama + llama.cpp) ───────────────────────────────────────
  local:
    config:
      context_window: 32768
      default_temperature: 0.1

      # llama.cpp Defaults (werden als Server-Start-Flags an llama-server durchgereicht).
      # Pro-Modell-Override in models[]. überschreibt jeden dieser Defaults.
      # seed=42 für reproduzierbare Benchmarks (Upstream: -1 = random).
      llama_cpp_defaults:
        seed: 42
        temperature: 0.6
        top_p: 0.95
        top_k: 40
        min_p: 0.0
        presence_penalty: 0.0
        repeat_penalty: 1.0

      # vLLM Defaults (per-request Sampling-Parameter, analog llama_cpp_defaults).
      # Architektur-Unterschied zu llama.cpp: vLLM-Sampling wird in der TOML auf
      # dem Remote-Host konfiguriert — wir haben darauf keinen Lese-Zugriff.
      # Wir reichen die Werte daher als OpenAI-Request-Parameter pro Query durch.
      # Sampling-Chain: model_cfg → vllm_defaults → Parameter NICHT gesetzt
      # (vLLM-Server-Default aus der TOML greift).
      # Initial leer: bestehende vLLM-Modelle verhalten sich unverändert.
      # Modelle mit explizitem model_cfg-Override (z. B. Ornith 1.0 35B für
      # Cross-Backend-Vergleich gegen llama.cpp) konsumieren diese Defaults
      # als Cascade. Empfohlene Werte stehen als auskommentierte Vorlage.
      vllm_defaults: {}
        # Empfohlene Sampling-Vorlage (zum Aktivieren einkommentieren):
        # temperature: 0.6
        # top_p: 0.95
        # top_k: 20
        # repetition_penalty: 1.0

      # Modelle mit nativem Context-Limit < global context_window.
      # Ollama fällt sonst still auf das Modell-Limit zurück → hier explizit gemacht.
      model_context_overrides:
        "mistral-nemo": 4096
        "dolphin-mistral-nemo": 4096

    ollama_local:
      name: Ollama (Local)
      short_code: LCL
      api_type: ollama
      enabled: false
      auto_discover: false
      models_filter: local

    # llama.cpp: Lokaler Inferenz-Server (OpenAI-kompatible API).
    # Jedes Modell muss explizit eingetragen werden — kein auto_discover.
    # Pflichtfelder pro Modell: id, name, model_file (GGUF-Dateiname relativ zu model_dir).
    # Optionale Felder: context_length (--ctx-size), n_gpu_layers (--n-gpu-layers, Default: 99).
    # Beschreibung/Metadaten → Model Card JSON (benchmark_scores/model_cards/).
    llamacpp:
      name: Llama.cpp (MacBook Pro)
      short_code: M4APL
      api_type: llamacpp
      model_type: open_weights_local
      # 2026-08-28 wieder aktiviert: Separation-Fix (provider-scoped Result-Cache,
      # resolve_provider Exact-First, Endpoint-Ownership-Check in llamacpp_base)
      # erlaubt Gleichzeitigkeit mit llamacpp_spark trotz kanonisch identischer
      # Modell-IDs (Mac qwen3.5-4b-q8 ↔ Spark qwen3_5-4b-q8).
      enabled: false
      context_window: 32000
      base_url: "http://127.0.0.1:1235/v1"
      api_key: "sk-local"
      model_dir: ~/ai/lms/gguf
      token_param_name: max_tokens
      server_start_cmd: ~/ai/llama.cpp/build/bin/llama-server
      server_stop_cmd: pkill -f llama-server
      server_log: ~/ai/llama-lab-server.log
      server_ready_timeout_sec: 180
      existing_server_ready_timeout_sec: 120
      server_ready_poll_sec: 5
      server_ready_probe_timeout_sec: 10
      threads: 10
      parallel: 4
      hardware_profile: m4_macbook_pro_metal
      models:
      - id: gemma-3-12b-it
        name: Gemma 3 12B Instruct Q4_K_M (GGUF)
        model_file: gemma-3-12b-it-Q4_K_M.gguf
        n_gpu_layers: 99
      - id: gemma-3-12b-it-q8
        name: Gemma 3 12B Instruct Q8_0 (GGUF)
        model_file: google_gemma-3-12b-it-Q8_0.gguf
        n_gpu_layers: 99
      - id: gemma-4-e4b
        name: Gemma 4 E4B (GGUF)
        model_file: gemma-4-E4B.gguf
        n_gpu_layers: 99
      - id: gemma-4-12b-it-ud-q4_k_xl
        name: Gemma 4 12B Instruct UD-Q4_K_XL (GGUF)
        model_file: gemma-4-12b-it-UD-Q4_K_XL.gguf
        n_gpu_layers: 99
        enable_thinking: true  # Gemma 4 Channel-Tokens (<|channel|>): --jinja + --reasoning-format deepseek separiert Thinking in reasoning_content. vormals false (v4.4.1 Hang — mit Separation + max_tokens-Cap begrenzt).
        extra_server_args:
          - "--jinja"
          - "--reasoning-format deepseek"
      - id: gemma-4-12b-it-ud-q6_k_xl
        name: Gemma 4 12B Instruct UD-Q6_K_XL (GGUF)
        model_file: gemma-4-12b-it-UD-Q6_K_XL.gguf
        n_gpu_layers: 99
        enable_thinking: true  # Gemma 4 Channel-Tokens — siehe q4_k_xl-Kommentar
        extra_server_args:
          - "--jinja"
          - "--reasoning-format deepseek"
      - id: gemma-4-12b-it-ud-q8_k_xl
        name: Gemma 4 12B Instruct UD-Q8_K_XL (GGUF)
        model_file: gemma-4-12b-it-UD-Q8_K_XL.gguf
        n_gpu_layers: 99
        enable_thinking: true  # Gemma 4 Channel-Tokens — siehe q4_k_xl-Kommentar
        extra_server_args:
          - "--jinja"
          - "--reasoning-format deepseek"
      - id: hermes-3-8b
        name: Hermes 3 Llama 3.1 8B Q6_K_L (GGUF)
        model_file: Hermes-3-Llama-3.1-8B-Q6_K_L.gguf
        n_gpu_layers: 99
      - id: hermes-4-14b-abliterated
        name: Hermes 4 14B BF16 Abliterated (GGUF)
        model_file: hermes-4-14b-bf16-abliterated-q6_k.gguf
        n_gpu_layers: 99
      - id: hermes-4-14b-q4
        name: Hermes 4 14B Q4_K_M (GGUF)
        model_file: hermes-4-14b-q4_k_m.gguf
        n_gpu_layers: 99
      # ── Auskommentiert 2026-09-11: GGUF entfernt (User-Entscheidung); Benchmark-Werte bleiben.
      # - id: qwen2.5-coder-7b
      #   name: Qwen 2.5 Coder 7B Instruct Q6_K (GGUF)
      #   model_file: qwen2.5-coder-7b-instruct-q6_k.gguf
      #   n_gpu_layers: 99
      #   enable_thinking: false
      - id: qwen3-4b
        name: Qwen 3 4B Q6_K (GGUF)
        model_file: Qwen3-4B-Q6_K.gguf
        n_gpu_layers: 99
        enable_thinking: false
      - id: qwen3-14b
        name: Qwen 3 14B Q6_K (GGUF)
        model_file: Qwen3-14B-Q6_K.gguf
        n_gpu_layers: 99
        enable_thinking: false
      - id: qwen3.5-4b-q4
        name: Qwen 3.5 4B Q4_K_XL (GGUF)
        model_file: Qwen3.5-4B-UD-Q4_K_XL.gguf
        n_gpu_layers: 99
        enable_thinking: false
      - id: qwen3.5-4b-q6
        name: Qwen 3.5 4B Q6_K_XL (GGUF)
        model_file: Qwen3.5-4B-UD-Q6_K_XL.gguf
        n_gpu_layers: 99
        enable_thinking: false
      - id: qwen3.5-4b-q8
        name: Qwen 3.5 4B Q8_K_XL (GGUF)
        model_file: Qwen3.5-4B-UD-Q8_K_XL.gguf
        n_gpu_layers: 99
        enable_thinking: false
      - id: qwen3.5-9b
        name: Qwen 3.5 9B Q6_K_XL (GGUF)
        model_file: Qwen3.5-9B-UD-Q6_K_XL.gguf
        n_gpu_layers: 99
        enable_thinking: false

    # llama.cpp auf asusGX10 (DGX Spark, NVIDIA CUDA, lokaler Server im Intranet).
    # Steuerung per SSH vom Benchmark-Host. GGUF-Pfad: /home/kay_beissert/ai/models/llm/gguf/
    # Server-Log wird lokal auf dem Mac gespeichert (SSH-Redirect).
    llamacpp_spark:
      # Name konsistent mit vllm_spark ("vLLM (asusGX10)") — dieselbe Hardware.
      name: Llama.cpp (asusGX10)
      short_code: SPRK
      api_type: llamacpp
      model_type: open_weights_local
      enabled: true  # asusGX10 erreichbar; Benchmark-llama-server läuft auf :1234.
      read_timeout: 2400  # 40 Min httpx-Read-Timeout — Thinking-/Long-Output-Modelle brauchen lange.
      # Chat-Pfad läuft über den OpenAI-Connector (utils/providers/openai.py) —
      # der liest `request_timeout` (Default 600s), NICHT `read_timeout`.
      # Ohne diesen Key war die Client-Wand bei 600s → Livelock bei langen
      # Reasoning-Generierungen (hermes docs 25000-Tokens-Task, 2026-08-30).
      request_timeout: 2400  # analog read_timeout-Präzedenzfall oben.
      # Wird beim Serverstart als --ctx-size gebacken (llamacpp_base.py:
      # _build_server_cmd); pro Modell via `context_length` überschreibbar.
      context_window: 65536
      # BEFUND (2026-08-27): vom llama.cpp-Connector NICHT gelesen — num_predict
      # ist ein Ollama-Konzept. Output-Budget läuft über token_param_name (max_tokens).
      num_predict: 65536
      # Benchmark-Port auf der GX10 (Tailscale-IP). Vorsicht: VS-Code-Port-Forwards
      # der Remote-Session können Mac-localhost auf GX10-Ports mappen (Kollisionsfall
      # 2026-08-27: Mac:1235 → GX10:1234). Der Mac-Connector erkennt solche Hijacks
      # seit 2026-08-28 (Ownership-Check in llamacpp_base) und bricht Fail-Fast ab.
      base_url: "http://100.89.110.0:2234/v1"
      # Lokaler Metrics-Proxy-Auth-Token: schützt den Proxy im Tailscale-LAN
      # vor Fremd-Requests. Wert steht als DGX_AUTH_TOKEN in der .env —
      # keine Tokens im Git (Auflösung via BaseProviderClient._resolve_env_ref).
      api_key: "${DGX_AUTH_TOKEN}"
      # Metrics-Proxy-Setup (2026-08-28): base_url zeigt auf den authentifi-
      # zierenden metrics_proxy (:2234), der die generierten Tokens erfasst und
      # an den llama-server weiterleitet. `server_port` entkoppelt den Bind-Port
      # des llama-server (:1234) von der base_url — ohne diesen Override würde
      # der Connector den Server per SSH mit --port 2234 starten und mit dem
      # Proxy kollidieren. Probes senden seit 2026-08-28 Bearer-Auth.
      # Entscheidung 2026-09-11: Benchmarks adressieren KÜNFTIG die Proxy-Ports
      # (:2234 primär, :2235 sekundär) — die llama-server-Bind-Ports bleiben
      # 1234/1235, der Proxy mappt 2234→1234 und 2235→1235. „Benchmark läuft
      # auf 2234" heißt daher: base_url :2234, NICHT server_port ändern.
      server_port: 1234
      # GGUF-Basispfad auf der GX10; `model_file` der Modelle ist relativ dazu.
      model_dir: /home/kay_beissert/ai/models/llm/gguf
      token_param_name: max_tokens
      # SSH-Wrapper: nur das Remote-Binary angeben — Modellpfad, --alias,
      # --ctx-size, --threads/--parallel, --host/--port, Sampling-Defaults und
      # --reasoning on/off baut der Connector in _build_server_cmd() und hängt
      # den Log-Redirect an. Flags hier würden doppelt/inkonsistent sein.
      server_start_cmd: ssh -o BatchMode=yes -o ConnectTimeout=10 -p 22 kay_beissert@100.89.110.0 /home/kay_beissert/ai/apps/llama.cpp/build/bin/llama-server
      # Stoppt NUR den Benchmark-Server auf :1234 — weitere llama-server auf der
      # GX10 (:1235 Coder, :1230 Embeddings) bleiben unberührt.
      server_stop_cmd: ssh -o BatchMode=yes -o ConnectTimeout=10 -p 22 kay_beissert@100.89.110.0 "pkill -f 'llama-server.*--port 1234'"
      # true → server_post_stop_cmd läuft nach dem Batch-Stop
      # (llamacpp_batch.run_llamacpp_provider_cleanup).
      cleanup_on_exit: true
      # Remote-Caches nach dem Batch räumen (KV-Cache-/tmp-Reste der GGUF-Loads).
      server_post_stop_cmd: ssh -o BatchMode=yes -o ConnectTimeout=10 -p 22 kay_beissert@100.89.110.0 "rm -rf ~/.cache/llama.cpp /tmp/llama.cpp*"
      server_ready_timeout_sec: 180  # Kaltstart: große GGUFs laden von SSD ins Unified Memory.
      existing_server_ready_timeout_sec: 120  # Adoption eines bereits laufenden Servers.
      server_ready_poll_sec: 5  # Poll-Intervall der /health- + Modell-Bereitschaftsprobe.
      # HTTP-Timeout der einzelnen Readiness-Probe (Hallo-Request); muss über
      # der Latenz des ersten Warmup-Requests liegen.
      server_ready_probe_timeout_sec: 60
      server_log: ~/ai/llama-lab-spark.log  # Lokales Log (SSH-Redirect >> log 2>&1).
      # Server lauscht auf allen Interfaces — nur so ist der Zugriff vom
      # Benchmark-Host per Tailscale-IP möglich (Default 127.0.0.1 wäre GX10-lokal).
      bind_host: 0.0.0.0
      threads: 16  # CPU-Threads (--threads) im Server-Cmd. 2026-08-28: 10→16 (GB10 hat 20 Cores — 10 halbierte den Durchsatz).
      # Slots (--parallel); pro Modell via `parallel` überschreibbar
      # (z.B. Hybrid-Attention-Modelle mit parallel=1).
      # 2026-08-28: 2→1 — der Benchmark läuft strikt sequenziell (Single-Request);
      # parallel=1 gibt dem einzigen Slot die volle --ctx-size (vorher Teilung
      # durch 2 Slots) und spart Slot-Overhead.
      parallel: 1
      # Provider-Level Server-Flags für alle Spark-Modelle (llamacpp_base.
      # _build_server_cmd hängt sie nach den Basis-Flags an; Model-Level-
      # extra_server_args werden danach angehängt und gewinnen last-one-wins).
      # flash-attn ist Voraussetzung für quantisierten KV-Cache (q8_0):
      # halbiert den KV-Speicherbedarf → mehr Compute-Headroom.
      # Achtung: q8_0-KV ändert die Numerik leicht — Läufe sind nicht direkt
      # mit historischen fp16-KV-Ergebnissen vergleichbar.
      extra_server_args:
        - "--flash-attn on"
        - "--cache-type-k q8_0"
        - "--cache-type-v q8_0"
      hardware_profile: dgx_spark_cuda
      # Pro Modell: id (eindeutig ggü. Mac-Provider), name, model_file (relativ
