      #   name: Gemma 3 12B Instruct Q8_0 (GGUF)
      #   model_file: nano-desktop-modells/google_gemma-3-12b-it-Q8_0.gguf
      #   n_gpu_layers: 99

      # - id: gemma-4-12b-it-q4
      #   name: Gemma 4 12B Instruct Q4_K_XL (GGUF)
      #   model_file: nano-desktop-modells/gemma-4-12b-it-UD-Q4_K_XL.gguf
      #   n_gpu_layers: 99

      # - id: gemma-4-12b-it-q6
      #   name: Gemma 4 12B Instruct Q6_K_XL (GGUF)
      #   model_file: gemma-4-12b-it-UD-Q6_K_XL.gguf
      #   n_gpu_layers: 99

      # - id: gemma-4-12b-it-q8
      #   name: Gemma 4 12B Instruct Q8_K_XL (GGUF)
      #   model_file: nano-desktop-modells/gemma-4-12b-it-UD-Q8_K_XL.gguf
      #   n_gpu_layers: 99

      # - id: gemma-4-e4b
      #   name: Gemma 4 E4B (GGUF)
      #   model_file: nano-desktop-modells/gemma-4-E4B.gguf
      #   n_gpu_layers: 99

      # - id: google-gemma-3-12b-it-q8
      #   name: Google Gemma 3 12B Q8_0 (GGUF)
      #   model_file: nano-desktop-modells/google_gemma-3-12b-it-Q8_0.gguf
      #   n_gpu_layers: 99

      # - id: hermes-3-8b
      #   name: Hermes 3 Llama 3.1 8B Q6_K_L (GGUF)
      #   model_file: nano-desktop-modells/Hermes-3-Llama-3.1-8B-Q6_K_L.gguf
      #   n_gpu_layers: 99

