        n_gpu_layers: 99
        enable_thinking: false

    # llama.cpp auf DGX Spark (NVIDIA CUDA, lokaler Server im Intranet).
    # Steuerung per SSH vom Benchmark-Host. GGUF-Pfad: /home/kay_beissert/ai/models/llm/gguf/
