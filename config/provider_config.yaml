    # vLLM auf asusGX10 (NVIDIA Blackwell, Remote via SSH/Tailscale).
    # Steuerung per SSH vom Benchmark-Host. Modelle werden über TOML-Configs
    # in ~/ai/shared/configs/vllm/models/ ausgewählt; ``vllm-start --config <NAME>``
    # startet den Server nativ, ``vllm-stop`` räumt die nativen Prozesse ab.
    # 2026-07-26: Migration Docker → nativ (vLLM 0.25.1 in ~/venvs/vllm025/).
    #   Main-Chat läuft nativ auf :3300, Embed-Sidecar auf :3301 (kein Docker mehr).
    #   Metrics-Proxy (Token-Capture) routet permanent :4300→:3300 (Chat) und
    #   :4301→:3301 (Embed), authentifiziert jeden Request (/health, /v1/models,
    #   Chat Completions). Auth-Token: sk-local-mg2026.
    #   base_url zeigt auf den Proxy-Port 4300 (Tailscale-IP 100.89.110.0).
    vllm_spark:
      name: vLLM (asusGX10)
      short_code: VSPK
      api_type: vllm
      model_type: open_weights_local
      enabled: true  # asusGX10 erreichbar, nativer Main-Prozess läuft auf :3300.
      read_timeout: 3600  # 60 Min — synthese-starke Modelle brauchen lange für lange Outputs
      context_window: 131072  # konservativer Subset; qwen3.6-27B unterstützt 262144 (laut /v1/models)
      base_url: "http://100.89.110.0:4300/v1"
      api_key: "sk-local-mg2026"
      token_param_name: max_tokens
      # Default-Budget für Thinking-Profile (max_tokens des generierten
      # ``{id}-thinking``-Eintrags via Config-Expansion). Pro Modell via
      # ``thinking_max_tokens`` überschreibbar. Wird NUR für Modelle mit
      # ``enable_thinking: true`` wirksam; alle anderen Modelle bleiben
      # unverändert (kein Expansion-Trigger).
      thinking_max_tokens: 32768
      # vllm-start/vllm-stop liegen unter ~/ai/shared/scripts/ (nicht im PATH).
      server_start_cmd: "ssh -o BatchMode=yes -o ConnectTimeout=10 -p 22 kay_beissert@100.89.110.0 /home/kay_beissert/ai/shared/scripts/vllm-start"
      server_stop_cmd: "ssh -o BatchMode=yes -o ConnectTimeout=10 -p 22 kay_beissert@100.89.110.0 /home/kay_beissert/ai/shared/scripts/vllm-stop --yes"
      toml_models_dir: "~/ai/shared/configs/vllm/models/"
      server_ready_timeout_sec: 600
      existing_server_ready_timeout_sec: 600
      server_ready_poll_sec: 10
      server_ready_probe_timeout_sec: 30
      hardware_profile: asus_gx10_blackwell
      # Besonderheit vLLM-Spark: Sampling-Parameter (temperature/top_p/top_k u. a.)
      # werden hier pro Modell konfiguriert und vom Connector zur Anfragezeit via
      # _resolve_sampling() in den Request-Body bzw. extra_body geschrieben — NICHT
      # bereits beim Serverstart in die Remote-TOML gebacken. Fehlt ein Wert hier,
      # greift der vLLM-Server-Default aus der TOML. Siehe utils/providers/vllm_base.py.
      models:
      # Smoke-Test: klein, schnell, niedriger VRAM (kein NVFP4 noetig).
      # TOML: ~/ai/shared/configs/vllm/models/Qwen2.5-0.5B.toml (915 B).
      # - id: Qwen2.5-0.5B
      #   name: Qwen 2.5 0.5B Instruct (vLLM, Smoke-Test)
      #   config: Qwen2.5-0.5B
      #   max_tokens: 2048
      #   # Mini-Modell: 30 s sind mehr als ausreichend (real <10 s).
      #   server_ready_timeout_sec: 30
      # Hauptmodell: läuft bereits auf dem Main-Container (Port 3300 via Proxy 4300).
      # vLLM kennt keinen --reasoning-Flag — enable_thinking wird über die Remote-TOML
      # (~/ai/shared/configs/vllm/models/Ornith1-35B-FP8.toml) gesteuert.
      - id: ornith-1.0-35B-FP8
        name: Ornith 1.0 35B FP8 (vLLM, Thinking-only)
        config: Ornith1-35B-FP8
        max_tokens: 32768
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        # repetition_penalty:  # Card: null — vLLM-Server-Default greift
        # Ornith 1.0 ist ein reines Thinking-Modell (kein Instruct-Modus).
        # KEIN enable_thinking — das würde eine Dual-Profile-Expansion mit
        # einem invaliden Non-Thinking-Standard-Profil auslösen (der
        # config_validator expandiert nur auf enable_thinking: true).
        # Stattdessen Thinking pro Request via chat_template_kwargs erzwungen
        # (via extra_body an vLLM). Einzelnes Always-Thinking-Profil;
        # max_tokens = Thinking-Budget.
        chat_template_kwargs: {enable_thinking: true}

      # Ornith 1.5 35B-A3B NVFP4 — Nachfolger von Ornith 1.0, MoE 256/8 active.
      # Architektur: Qwen3_5MoeForConditionalGeneration (40 Layer, 30 Mamba2 + 10 Full-Attention).
      # Quantisierung: NVIDIA ModelOpt NVFP4 mixed-precision (FP8-Attention + NVFP4-MLP + BF16-MTP).
      # Multimedial (Text + Vision + Video), 262k nativer Kontext, 32k produktiv.
      # License: MIT. Disk: ~23 GB auf GB10. vLLM-nightly 0.27.2rc1.
      # TOML: ~/ai/shared/configs/vllm/models/Ornith-1.5-35B-A3B-NVFP4.toml
      # Sampling synchron mit TOML: temperature=1.0, top_p=0.95, top_k=20,
      # repetition_penalty=1.08 (2026-08-20: angepasst an Werks-Default-Familie,
      # identisch zu Ornith 1.0).
      # KEIN enable_thinking — Ornith 1.5 ist wie Ornith 1.0 ein reines Thinking-Modell
      # (kein Non-Thinking-Modus, HF-Card Werks-Default: "by default the assistant turn opens
      # with a  ̶t̶h̶i̶n̶k̶...̶t̶h̶i̶n̶k̶ block"). KEIN Dual-Profile, KEIN Hybrid-Test.
      # Thinking pro Request via chat_template_kwargs erzwungen (extra_body an vLLM).
      # Einzelnes Always-Thinking-Profil; max_tokens = Thinking-Budget.
      # 2026-08-20: max_tokens 32768→16384 (Half-of-Context-Sweet-Spot) nach
      # Server-Upgrade max_model_len 16384→32768. Reasoning-intensive Tasks
      # (z.B. UX-Writing) brauchten vorher 12k+ Reasoning-Tokens ohne sichtbaren
      # Output — jetzt 16k Output-Budget, Reasoning+Visible passen gemeinsam rein.
      # 2026-08-20: temperature 0.6→1.0 + repetition_penalty 1.0→1.08 — angeglichen
      # an Ornith-Werks-Default-Familie (deckt sich mit Ornith-1.0-TOML).
      - id: ornith-1_5-35b-a3b-nvfp4
        name: Ornith 1.5 35B-A3B NVFP4 (vLLM, Thinking-only)
        config: Ornith-1.5-35B-A3B-NVFP4
        max_tokens: 16384
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        repetition_penalty: 1.08
        chat_template_kwargs: {enable_thinking: true}

      # Gemma 4 Familie — NVFP4 (modelopt), 131k Context.
      # MoE 26B / Dense 31B (Base) / Dense 31B-Wordsmith (W4A16, uncensored).
      # Sampling-Parameter synchron mit Model Cards (SSoT: Card dokumentiert
      # die Hersteller-Empfehlung, provider_config liefert sie an _resolve_sampling).
      # Gemma 4 offizielle Empfehlung: temperature=1.0, top_p=0.95, top_k=64.
      - id: Gemma-4-26B
        name: Gemma 4 26B-A4B NVFP4 (vLLM, MoE)
        # TOML: ~/ai/shared/configs/vllm/models/Gemma-4-26B-A4B-it-NVFP4.toml
        # (Unsloth NVFP4 compressed-tensors, MoE 25.2B total / 3.8B active).
        # ``config`` MUSS exakt dem TOML-Dateinamen ohne .toml entsprechen,
        # sonst scheitert ``vllm-start --config`` (siehe vllm_base._config_arg).
        # ``model_id`` bleibt ``Gemma-4-26B`` für Card/CSV-Konsistenz; die
        # Adoption in vllm_base._adopt_matches() prüft zusätzlich gegen
        # ``config_name``, damit der vom Server gemeldete served_model_name
        # (``Gemma-4-26B-A4B-it-NVFP4``) als Match akzeptiert wird.
        config: Gemma-4-26B-A4B-it-NVFP4
        max_tokens: 16384
        temperature: 1.0
        top_p: 0.95
        top_k: 64
        # repetition_penalty:  # Card: null — vLLM-Server-Default greift
        enable_thinking: true

      - id: Gemma-4-31B
        name: Gemma 4 31B NVFP4 (vLLM, Dense, multimodal)
        # TOML: ~/ai/shared/configs/vllm/models/Gemma-4-31B-it-NVFP4.toml
        # (Dense, multimodal, Apache-2.0). Siehe Hinweis oben zu
        # ``config`` ↔ TOML-Filename-Mismatch.
        config: Gemma-4-31B-it-NVFP4
        max_tokens: 16384
        temperature: 1.0
        top_p: 0.95
        top_k: 64
        # repetition_penalty:  # Card: null — vLLM-Server-Default greift
        enable_thinking: true

      # Qwen 3.6 27B Dense — NVFP4 compressed-tensors, MTP, Thinking-Parser aktiv.
      # 32k Context (Sweet-Spot für DGX Spark bei 0.70 gpu-mem-util).
      # Sampling synchron mit Card: temperature=0.6, top_p=0.95, top_k=20.
      - id: qwen3_6-27b-nvfp4
        name: Qwen 3.6 27B NVFP4 (vLLM, Dense, MTP)
        config: Qwen3.6-27B
        max_tokens: 16384
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        # repetition_penalty:  # Card: null — vLLM-Server-Default greift
        enable_thinking: true

      - id: qwen3_6-35b-a3b-nvfp4
        name: Qwen 3.6 35B NVFP4 (vLLM, MoE, MTP)
        config: Qwen3.6-35B-NVFP4
        max_tokens: 16384
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        enable_thinking: true

      # Qwen 3.5 27B Dense — NVFP4 + MTP (osoleve-Quant, 18.5 GB auf Disk).
      # 64-Layer-Hybrid (48 Mamba2 + 16 Full-Attention, interval=4), 256K Kontext.
      # 2026-08-19 ergänzt: Switch-Backup für Qwen-3.x-Matrix (3.5 → 3.6 → 3.8).
      # HF-Card-Default sampling für Thinking: temperature=1.0, top_p=0.95, top_k=20.
      # Qwen 3.5 27B ist ein Always-Thinking-Modell (kein Nicht-Thinking-Modus).
      # KEIN enable_thinking — würde Dual-Profile-Expansion mit invalidem
      # Non-Thinking-Standard-Profil auslösen (config_validator expandiert nur
