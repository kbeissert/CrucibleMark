  # ── Lokale Modelle (Ollama + llama.cpp) ───────────────────────────────────────
  local:
    config:
      context_window: 32768
      default_temperature: 0.1

      # =====================================================================
      # llama.cpp Defaults (SSoT für Server-Start-Flags)
      # =====================================================================
      # Diese Werte werden als Server-Start-Flags (`--temp`, `--top-p`, `--top-k`,
      # `--min-p`, `--presence-penalty`, `--repeat-penalty`, `--seed`) an
      # llama-server durchgereicht. Sie entsprechen den llama.cpp-Upstream-
      # Defaults, mit Ausnahme von `seed=42` für reproduzierbare Benchmarks.
      #
      # Pro-Modell-Override in `provider_config.yaml > providers.local.*.models`
      # überschreibt jeden dieser Defaults. Beispiel: ein Modell mit
      # `temperature: 0.3` bekommt `--temp 0.3` statt `--temp 0.8`.
      #
      # Hinweise:
      #   - temperature: 0.6  — llama.cpp Default; lässt Modelle frei atmen
      #   - top_p: 0.95        — leichte Nucleus-Filterung (Community-Default)
      #   - top_k: 40          — filtert nur echten Müll
      #   - min_p: 0.0         — deaktiviert
      #   - presence_penalty: 0.0 — deaktiviert
      #   - repeat_penalty: 1.0  — deaktiviert (kein Penalty gegen Loops)
      #   - seed: 42           — explizit (llama.cpp wäre -1, random)
      # =====================================================================
      llama_cpp_defaults:
        seed: 42                    # Explizit für Reproduzierbarkeit (Upstream: -1)
        temperature: 0.6            # llama.cpp-Default
        top_p: 0.95                 # llama.cpp-Default
        top_k: 40                   # llama.cpp-Default
        min_p: 0.0                  # llama.cpp-Default (deaktiviert)
        presence_penalty: 0.0       # llama.cpp-Default (deaktiviert)
        repeat_penalty: 1.0         # llama.cpp-Default (kein Penalty)

      # Hardware-Profile werden pro Provider definiert (nicht global).
      # Werte: m4_macbook_pro_metal, dgx_spark_cuda, ...
      # Models that cannot use the global context_window due to native architecture limits.
      # Ollama silently falls back to the model's native context if VRAM is insufficient —
      # setting the real limit here makes the constraint explicit and surfaces it as
      # token_limit_fallback=True in CSV/audit logs instead of a silent truncation.
      model_context_overrides:
        # Mistral-Nemo architecture: native 4096-token context window
        "mistral-nemo": 4096
        "dolphin-mistral-nemo": 4096

    ollama_local:
      name: Ollama (Local)
      short_code: LCL
      api_type: ollama
      enabled: false
      auto_discover: true
      models_filter: local

    # llama.cpp: Lokaler Inferenz-Server (OpenAI-kompatible API).
    # Jedes Modell muss explizit eingetragen werden — kein auto_discover.
    # Der Provider löst model_file → GGUF-Pfad auf und startet/swappt den Server
    # automatisch beim Modellwechsel. Der Server wird mit --alias <id> gestartet,
    # damit der API-Aufruf denselben model-Bezeichner wie die Config verwendet.
    #
    # Pflichtfelder pro Modell:
    #   id         — Bezeichner für API-Call, CSV und Leaderboard (frei wählbar)
    #   name       — Anzeigename im Wizard
    #   model_file — GGUF-Dateiname relativ zu model_dir (nur für Server-Start via llamacpp.py,
    #                nicht für API-Kommunikation — dort gilt ausschließlich die id)
    #
    # Optionale Felder (nur eintragen wenn vom Default abweichend):
    #   context_length — --ctx-size in Tokens, Default: providers.local.config.context_window (32768)
    #   n_gpu_layers   — --n-gpu-layers, Default: 99 (vollständiges GPU-Offloading)
    #
    # Beschreibung/Metadaten → Model Card JSON (benchmark_scores/model_cards/)
    #
    # Hardware-Kontext:
    #   MacBook Pro (M4 Max): ~16-18 GB nutzbarer VRAM für Modell + Kontext.
    #   Bei Context=32000 und parallel=4 bleiben pro Slot ~4K Tokens reservierter Kontext,
    #   was für Puffer + KV-Cache bei 12B-14B Modellen (Q4-Q6) ausreichend ist.
    llamacpp:
      name: Llama.cpp (MacBook Pro)
      short_code: M4APL
      api_type: llamacpp
      model_type: open_weights_local
      enabled: true
      context_window: 32000
      base_url: "http://127.0.0.1:1235/v1"
      api_key: "sk-local"
      model_dir: ~/ai/lms/gguf
      token_param_name: max_tokens
      server_start_cmd: ~/ai/llama.cpp/build/bin/llama-server
      server_stop_cmd: pkill -f llama-server
      server_log: ~/ai/llama-lab-server.log
      server_ready_timeout_sec: 180
      existing_server_ready_timeout_sec: 120
      server_ready_poll_sec: 5
      server_ready_probe_timeout_sec: 10
      threads: 10
      parallel: 4
      hardware_profile: m4_macbook_pro_metal
      models:
      - id: gemma-3-12b-it
        name: Gemma 3 12B Instruct Q4_K_M (GGUF)
        model_file: gemma-3-12b-it-Q4_K_M.gguf
        n_gpu_layers: 99
      - id: gemma-3-12b-it-q8
        name: Gemma 3 12B Instruct Q8_0 (GGUF)
        model_file: google_gemma-3-12b-it-Q8_0.gguf
        n_gpu_layers: 99
      - id: gemma-4-e4b
        name: Gemma 4 E4B (GGUF)
        model_file: gemma-4-E4B.gguf
        n_gpu_layers: 99
      - id: gemma-4-12b-it-ud-q4_k_xl
        name: Gemma 4 12B Instruct UD-Q4_K_XL (GGUF)
        model_file: gemma-4-12b-it-UD-Q4_K_XL.gguf
        n_gpu_layers: 99
        enable_thinking: false  # Thinking-Modus → unbounded Hang (wie Qwen) — fix v4.4.1
      - id: gemma-4-12b-it-ud-q6_k_xl
        name: Gemma 4 12B Instruct UD-Q6_K_XL (GGUF)
        model_file: gemma-4-12b-it-UD-Q6_K_XL.gguf
        n_gpu_layers: 99
        enable_thinking: false  # Thinking-Modus → unbounded Hang (wie Qwen) — fix v4.4.1
      - id: gemma-4-12b-it-ud-q8_k_xl
        name: Gemma 4 12B Instruct UD-Q8_K_XL (GGUF)
        model_file: gemma-4-12b-it-UD-Q8_K_XL.gguf
        n_gpu_layers: 99
        enable_thinking: false  # Thinking-Modus → unbounded Hang (wie Qwen) — fix v4.4.1
      - id: hermes-3-8b
        name: Hermes 3 Llama 3.1 8B Q6_K_L (GGUF)
        model_file: Hermes-3-Llama-3.1-8B-Q6_K_L.gguf
        n_gpu_layers: 99
      - id: hermes-4-14b-abliterated
        name: Hermes 4 14B BF16 Abliterated (GGUF)
        model_file: hermes-4-14b-bf16-abliterated-q6_k.gguf
        n_gpu_layers: 99
      - id: hermes-4-14b-q4
        name: Hermes 4 14B Q4_K_M (GGUF)
        model_file: hermes-4-14b-q4_k_m.gguf
        n_gpu_layers: 99
      - id: qwen2.5-coder-7b
        name: Qwen 2.5 Coder 7B Instruct Q6_K (GGUF)
        model_file: qwen2.5-coder-7b-instruct-q6_k.gguf
        n_gpu_layers: 99
        enable_thinking: false
      - id: qwen3-4b
        name: Qwen 3 4B Q6_K (GGUF)
        model_file: Qwen3-4B-Q6_K.gguf
        n_gpu_layers: 99
        enable_thinking: false
      - id: qwen3-14b
        name: Qwen 3 14B Q6_K (GGUF)
        model_file: Qwen3-14B-Q6_K.gguf
        n_gpu_layers: 99
        enable_thinking: false
      - id: qwen3.5-4b-q4
        name: Qwen 3.5 4B Q4_K_XL (GGUF)
        model_file: Qwen3.5-4B-UD-Q4_K_XL.gguf
        n_gpu_layers: 99
        enable_thinking: false
      - id: qwen3.5-4b-q6
        name: Qwen 3.5 4B Q6_K_XL (GGUF)
        model_file: Qwen3.5-4B-UD-Q6_K_XL.gguf
        n_gpu_layers: 99
        enable_thinking: false
      - id: qwen3.5-4b-q8
        name: Qwen 3.5 4B Q8_K_XL (GGUF)
        model_file: Qwen3.5-4B-UD-Q8_K_XL.gguf
        n_gpu_layers: 99
        enable_thinking: false
      - id: qwen3.5-9b
        name: Qwen 3.5 9B Q6_K_XL (GGUF)
        model_file: Qwen3.5-9B-UD-Q6_K_XL.gguf
        n_gpu_layers: 99
        enable_thinking: false

    # llama.cpp auf DGX Spark (NVIDIA CUDA, lokaler Server im Intranet)
    # Steuerung erfolgt per SSH vom Benchmark-Host.
    # GGUF-Pfad: /home/kay_beissert/ai/models/llm/gguf/
    # Port 1235 wird für den Benchmark-Server genutzt.
    #
    # Hardware-Kontext:
    #   DGX Spark: ~128 GB unified memory, davon ~120 GB für Modell + Kontext nutzbar.
    #   Default Context=65536 + parallel=4 — funktioniert für 30B-40B MoE-Modelle
    #   (Q4-Q8) und Standard-Attention-Transformer (Qwen 3.5/3.6, Gemma 4).
    #   Per-Modell-Override möglich: model_cfg.context_length / model_cfg.parallel
    #   werden in _build_server_cmd() zuerst gelesen. Beispiel: Hermes 4.3 36B
    #   (Hybrid-Attention, SWA-Re-Processings) erzwingt context_length=16384 +
    #   parallel=1, damit der Server beim Model-Swap mit angepassten Flags startet.
    #   Server-Start nach Refactoring (llamacpp_batch.py) deutlich schneller: Timeout von 420s → 180s.
    llamacpp_spark:
      name: Llama.cpp (DGX Spark)
      short_code: SPRK
      api_type: llamacpp
      model_type: open_weights_local
      enabled: true
      context_window: 65536
      num_predict: 65536
      base_url: "http://192.168.1.191:1235/v1"
      api_key: "sk-local"
      model_dir: /home/kay_beissert/ai/models/llm/gguf
      token_param_name: max_tokens
      server_start_cmd: ssh -o BatchMode=yes -o ConnectTimeout=10 -p 22 kay_beissert@gx10-b20a.local /home/kay_beissert/ai/apps/llama.cpp/build/bin/llama-server
      server_stop_cmd: ssh -o BatchMode=yes -o ConnectTimeout=10 -p 22 kay_beissert@gx10-b20a.local "pkill -f 'llama-server.*--port 1235'"
      cleanup_on_exit: true
      server_post_stop_cmd: ssh -o BatchMode=yes -o ConnectTimeout=10 -p 22 kay_beissert@gx10-b20a.local "rm -rf ~/.cache/llama.cpp /tmp/llama.cpp*"
      server_ready_timeout_sec: 180
      existing_server_ready_timeout_sec: 120
      server_ready_poll_sec: 5
      server_ready_probe_timeout_sec: 60
      # server_log: Lokal auf dem Benchmark-Host (Mac) gespeichert, nicht auf dem Spark.
      # Der Shell-Redirect `>>` liegt außerhalb der SSH-Quoting-Grenze:
      # SSH tunnelt Remote-stdout → SSH-Client-stdout → lokale Datei.
      # ~/ai/llama-lab-spark.log entspricht dem M4-Muster (llama-lab-server.log).
      server_log: ~/ai/llama-lab-spark.log
      bind_host: 0.0.0.0
      threads: 10
      parallel: 4
      hardware_profile: dgx_spark_cuda
      models:

        # nano-desktop-models (auskommentiert — nicht auf Spark)
