        n_gpu_layers: 99
        enable_thinking: false
      - id: qwen3-4b
        name: Qwen 3 4B Q6_K (GGUF)
        model_file: Qwen3-4B-Q6_K.gguf
        n_gpu_layers: 99
        enable_thinking: false
      - id: qwen3-14b
        name: Qwen 3 14B Q6_K (GGUF)
        model_file: Qwen3-14B-Q6_K.gguf
        n_gpu_layers: 99
