      # chat_template_kwargs erzwungen (extra_body an vLLM). Einzelnes
      # Always-Thinking-Profil; max_tokens = Thinking-Budget.
      # - id: qwen3_5-27b-nvfp4
      #   name: Qwen 3.5 27B NVFP4 (vLLM, Dense, MTP, Always-Thinking)
      #   config: Qwen3.5-27B-NVFP4-MTP
      #   max_tokens: 32768
      #   temperature: 1.0
      #   top_p: 0.95
