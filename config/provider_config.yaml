    ollama_cloud:
      name: Ollama (Cloud Proxies)
      api_type: ollama
      model_type: open_weights_cloud
      enabled: false  # Paywall — via OpenRouter abgedeckt
      auto_discover: true
      models_filter: cloud
      models: []

  # ── Lokale Modelle (Ollama + llama.cpp) ───────────────────────────────────────
  local:
    config:
      context_window: 32768
      default_temperature: 0.1

      # llama.cpp Defaults (werden als Server-Start-Flags an llama-server durchgereicht).
      # Pro-Modell-Override in models[]. überschreibt jeden dieser Defaults.
      # seed=42 für reproduzierbare Benchmarks (Upstream: -1 = random).
      llama_cpp_defaults:
        seed: 42
        temperature: 0.6
        top_p: 0.95
        top_k: 40
        min_p: 0.0
        presence_penalty: 0.0
        repeat_penalty: 1.0

      # Modelle mit nativem Context-Limit < global context_window.
      # Ollama fällt sonst still auf das Modell-Limit zurück → hier explizit gemacht.
      model_context_overrides:
        "mistral-nemo": 4096
        "dolphin-mistral-nemo": 4096

    ollama_local:
      name: Ollama (Local)
      short_code: LCL
      api_type: ollama
      enabled: false
      auto_discover: true
      models_filter: local

    # llama.cpp: Lokaler Inferenz-Server (OpenAI-kompatible API).
    # Jedes Modell muss explizit eingetragen werden — kein auto_discover.
    # Pflichtfelder pro Modell: id, name, model_file (GGUF-Dateiname relativ zu model_dir).
    # Optionale Felder: context_length (--ctx-size), n_gpu_layers (--n-gpu-layers, Default: 99).
    # Beschreibung/Metadaten → Model Card JSON (benchmark_scores/model_cards/).
    llamacpp:
      name: Llama.cpp (MacBook Pro)
      short_code: M4APL
      api_type: llamacpp
      model_type: open_weights_local
      enabled: true
      context_window: 32000
      base_url: "http://127.0.0.1:1235/v1"
      api_key: "sk-local"
      model_dir: ~/ai/lms/gguf
      token_param_name: max_tokens
      server_start_cmd: ~/ai/llama.cpp/build/bin/llama-server
      server_stop_cmd: pkill -f llama-server
      server_log: ~/ai/llama-lab-server.log
      server_ready_timeout_sec: 180
      existing_server_ready_timeout_sec: 120
      server_ready_poll_sec: 5
      server_ready_probe_timeout_sec: 10
      threads: 10
      parallel: 4
      hardware_profile: m4_macbook_pro_metal
      models:
      - id: gemma-3-12b-it
        name: Gemma 3 12B Instruct Q4_K_M (GGUF)
        model_file: gemma-3-12b-it-Q4_K_M.gguf
        n_gpu_layers: 99
      - id: gemma-3-12b-it-q8
        name: Gemma 3 12B Instruct Q8_0 (GGUF)
        model_file: google_gemma-3-12b-it-Q8_0.gguf
        n_gpu_layers: 99
      - id: gemma-4-e4b
        name: Gemma 4 E4B (GGUF)
        model_file: gemma-4-E4B.gguf
        n_gpu_layers: 99
      - id: gemma-4-12b-it-ud-q4_k_xl
        name: Gemma 4 12B Instruct UD-Q4_K_XL (GGUF)
        model_file: gemma-4-12b-it-UD-Q4_K_XL.gguf
        n_gpu_layers: 99
        enable_thinking: false  # Thinking → unbounded Hang (v4.4.1)
      - id: gemma-4-12b-it-ud-q6_k_xl
        name: Gemma 4 12B Instruct UD-Q6_K_XL (GGUF)
        model_file: gemma-4-12b-it-UD-Q6_K_XL.gguf
        n_gpu_layers: 99
        enable_thinking: false
      - id: gemma-4-12b-it-ud-q8_k_xl
        name: Gemma 4 12B Instruct UD-Q8_K_XL (GGUF)
        model_file: gemma-4-12b-it-UD-Q8_K_XL.gguf
        n_gpu_layers: 99
        enable_thinking: false
      - id: hermes-3-8b
        name: Hermes 3 Llama 3.1 8B Q6_K_L (GGUF)
        model_file: Hermes-3-Llama-3.1-8B-Q6_K_L.gguf
        n_gpu_layers: 99
      - id: hermes-4-14b-abliterated
        name: Hermes 4 14B BF16 Abliterated (GGUF)
        model_file: hermes-4-14b-bf16-abliterated-q6_k.gguf
        n_gpu_layers: 99
      - id: hermes-4-14b-q4
        name: Hermes 4 14B Q4_K_M (GGUF)
        model_file: hermes-4-14b-q4_k_m.gguf
        n_gpu_layers: 99
      - id: qwen2.5-coder-7b
        name: Qwen 2.5 Coder 7B Instruct Q6_K (GGUF)
        model_file: qwen2.5-coder-7b-instruct-q6_k.gguf
