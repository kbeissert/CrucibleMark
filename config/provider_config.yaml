      # Qwen 3.6 27B Dense — NVFP4 compressed-tensors, MTP, Thinking-Parser aktiv.
      # 32k Context (Sweet-Spot für DGX Spark bei 0.70 gpu-mem-util).
      # Sampling synchron mit Card: temperature=0.6, top_p=0.95, top_k=20.
      - id: qwen3_6-27b-nvfp4
