      enabled: true
      max_tokens: 16384
      env_var: COHERE_API_KEY
      # Per-Modell Token-Caps (überschreibt Provider-Default 16384).
      # Command A+ ist ein Thinking-Modell mit 64K Output-Tokens.
      # Ohne Override frisst das Reasoning das gesamte Budget (16384) → 0 sichtbarer Output.
      # 32768 deckt alle Reasoning-Budgets ab (max. 20000 bei code_quality) plus sichtbaren Output.
      model_max_tokens:
        command-a-plus-05-2026: 32768
      models:
      - id: command-a-plus-05-2026
        name: Command A+ (MoE 218B)

    openrouter:
      name: OpenRouter
      short_code: OR
      api_type: openrouter
      token_param_name: max_tokens
      model_type: open_weights_cloud
      enabled: true
      max_tokens: 16384
      env_var: OPENROUTER_API_KEY
      # Per-Modell Token-Caps (überschreibt Provider-Default 16384).
      # Kimi K2.x Thinking-Modelle brauchen mehr wegen hoher Reasoning-Anteile.
      model_max_tokens:
        moonshotai/kimi-k2.7-code: 25000
        moonshotai/kimi-k2.6: 20000
        moonshotai/kimi-k2.5-0127: 18000
        moonshotai/kimi-k2-thinking-20251106: 16000
        moonshotai/kimi-k2: 16000
        deepseek/deepseek-v4-pro: 16000
        deepseek/deepseek-v4-flash: 16000

        # Xiaomi MiMo Thinking-Modelle — Reasoning-Anteile benötigen höheres Budget
        xiaomi/mimo-v2.5-pro: 20000
        xiaomi/mimo-v2.5: 24000

        # GLM-5.3 — Always-Thinking (Reasoning nicht deaktivierbar, Effort-Default max).
        # Bei 16384 frisst der CoT das komplette Budget (Session-Befund: 16328 Reasoning-
        # Tokens, 56 sichtbare Tokens, 16% Score durch Truncation). Cap über Modul-Budget
        # (code_quality reasoning: 20000) legen, damit min()-Kaskade nicht auf Provider-
        # Default 16384 drosselt.
        z-ai/glm-5.3: 24000

        # GLM-5.3-Flash — Always-Thinking (Reasoning mandatory, nicht deaktivierbar:
        # HTTP 400 "Reasoning is mandatory for this endpoint"). Gleiche Cap-Logik wie
        # z-ai/glm-5.3 (verifiziert 2026-08-26).
        z-ai/glm-5.3-flash: 24000

        # Qwen3.8-Flash — Thinking-Optional, aber nicht-terminierender CoT.
        # Session-Befund 2026-08-27 (code_quality_001): 16384 → 20000 Output-Tokens,
        # jeweils 100% Reasoning, 0 sichtbarer Output, Score 0%. Höheres max_tokens
        # löst das nicht — das Thinking-Budget wird separat gedeckelt (siehe
        # model_reasoning_config).
        qwen/qwen3.8-flash: 24000
      # Per-Modell Reasoning-Config (OpenRouter Unified-Parameter `reasoning`).
      # Begrenzt das Thinking-Budget separat vom Output-Budget für Modelle mit
      # nicht-terminierendem CoT. Wird in _build_openrouter_params() in extra_body
      # geschrieben; Modell ohne Eintrag → kein reasoning-Parameter im Request.
      model_reasoning_config:
        # 12000 Reasoning + 12000 sichtbarer Output innerhalb von max_tokens=24000.
        # Flash kennt KEIN reasoning_effort (OpenRouter-Metadaten: nur
        # supports_max_tokens) — das Token-Cap ist die einzige Loop-Terminierung.
        qwen/qwen3.8-flash:
          max_tokens: 12000

