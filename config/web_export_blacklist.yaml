# Web Export Blacklist
# =====================
# Konfiguration welche Modelle vom Web-Export (`make web-export`) ausgeschlossen
# werden — d.h. es wird KEIN models/{slug}/data.json erzeugt und KEIN Eintrag
# in der leaderboard.json aufgenommen.
#
# Struktur
# --------
#   1) blacklist        — aktive Filterliste (exakte model_ids, Loader liest nur
#                         diese Liste). Match via raw id ODER _safe_name().
#   2) kept_overrides   — Dokumentation bewusst BEHALTENER Modelle. Wird vom
#                         Loader IGNORIERT; dient nur der Audit-Sicht, damit
#                         klar ist, was explizit NICHT gefiltert wurde und warum.
#
# Match-Modus
# -----------
#   - exakte model_id (Leaderboard-Spalte "Model ID"), normalisiert via
#     scripts/web_export._safe_name() (Slashes, Punkte → Underscores).
#   - fnmatch-Patterns sind erlaubt (Sonderzeichen * ? [ erkennen via _is_blacklisted()).
#
# Sortierung (Audit-Stand 2026-08-19)
# ------------------------------------
#   1) Anbieter (alphabetisch): Anthropic → DeepSeek → Google → Hermes → Mistral
#      → Moonshot → OpenAI → Ornith → Qwable → Qwen → xAI.
#   2) Pro Anbieter: Produktlinie (neueste Generation zuerst).
#   3) Pro Linie: Modell-Version (neueste zuerst).
#
# Konsolidierungsregel 2026-08-19
# --------------------------------
#   - Kommerzielle Modelle in derselben Produktlinie: nur die letzten 2 Modelle
#     im Web-Export behalten (Claude Opus/Sonnet, GPT-Hauptlinie/Mini/Nano,
#     Grok 4.x, GLM 5, DeepSeek V4, etc.).
#   - Ausnahme Kimi K: 3 Modelle (K3, K2.6, K2.5) wegen 264K → 1M Context-Window-Übergang.
#   - Kimi Code (kimi-k2.7-code) ist eine Sonderlinie und bleibt unberührt.
#   - GPT-4 und o-Serie: komplett entfernt (Legacy; GPT-5 + reasoning_effort
#     ersetzt beide Linien).
#
# Filter-Regeln (Audit-Stand 2026-07-10)
# --------------------------------------
#   - Gleiche Param-Größe, schwächere Quant/Variante → blacklist.
#   - Ausnahmen die explizit behalten werden:
#       * Thinking-Variante eines Modells (vs. Standard-Mode)
#       * Wordsmith-Tune (Unsloth-Creative-Wordsmith)
#       * Abliterated-Finetune (Abliterated / Aramia-Abliterated)
#       * Uncensored-Community-Finetune
#       * Pro Param-Klasse der/die stärkste(n) Variante(n).

