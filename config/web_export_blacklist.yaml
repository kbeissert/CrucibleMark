# Web Export Blacklist
# ====================
# Modelle in dieser Liste werden von `make web-export` komplett uebersprungen
# (kein models/{slug}/data.json, kein Eintrag in leaderboard.json).
#
# Match-Modus: Exakte model_id (Leaderboard-Spalte "Model ID").
# Gruppierung nach Modellfamilie + Parametergröße. Alle Quantisierungen und
# Server-Varianten eines Modells sind zusammengefasst.
#
# Verwendung: Standardmäßig stehen ALLE Varianten in der Blacklist. Um ein
# Modell im Web-Export zu behalten, einfach die entsprechende Zeile auskommentieren
# (mit `# - "..."` versehen). Alle anderen bleiben gelistet und werden übersprungen.
#
