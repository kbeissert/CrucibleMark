  google:
    gemini-2.5-pro:
      input_cost_per_1k: 0.00125  # $1.25 per 1M input tokens (≤200K context)
      output_cost_per_1k: 0.010   # $10.00 per 1M output tokens
    gemini-3-flash-preview:
      input_cost_per_1k: 0.0005   # $0.50 per 1M input tokens (ai.google.dev/gemini-api/docs/pricing)
      output_cost_per_1k: 0.003    # $3.00 per 1M output tokens
