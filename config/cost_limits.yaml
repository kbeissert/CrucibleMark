providers:
  # NOTE: Alle Preise beziehen sich auf den kostenpflichtigen Paid Tier (nach Ablauf
  # des Free Tiers). Im Free Tier sind bei Groq bestimmte Tokens kostenlos enthalten.
  # Ollama-Cloud-Modelle (:cloud-Tags) verbinden sich über Ollama-Proxies mit den APIs
  # der jeweiligen Anbieter. Die Preise entsprechen dem Paid Tier der jeweiligen
  # Provider-API und dienen als Referenz für den kommerziellen Produktionseinsatz.
  ollama_cloud:
    deepseek-v3.2:cloud:
      input_cost_per_1k: 0.00028   # $0.28 per 1M input tokens (DeepSeek API, cache miss)
      output_cost_per_1k: 0.00042  # $0.42 per 1M output tokens
    minimax-m2.7:cloud:
      input_cost_per_1k: 0.0003    # $0.30 per 1M input tokens (MiniMax API)
      output_cost_per_1k: 0.0012   # $1.20 per 1M output tokens
    gpt-oss:120b-cloud:
      input_cost_per_1k: 0.00015   # $0.15 per 1M input tokens (Groq API)
      output_cost_per_1k: 0.0006   # $0.60 per 1M output tokens

  groq:
    meta-llama/llama-4-scout-17b-16e-instruct:
      input_cost_per_1k: 0.00011   # $0.11 per 1M input tokens
      output_cost_per_1k: 0.00034  # $0.34 per 1M output tokens
    llama-3.3-70b-versatile:
      input_cost_per_1k: 0.00059   # $0.59 per 1M input tokens
      output_cost_per_1k: 0.00079  # $0.79 per 1M output tokens
    llama-3.1-8b-instant:
      input_cost_per_1k: 0.00005   # $0.05 per 1M input tokens
      output_cost_per_1k: 0.00008  # $0.08 per 1M output tokens
    qwen/qwen3-32b:
      input_cost_per_1k: 0.00029   # $0.29 per 1M input tokens
      output_cost_per_1k: 0.00059  # $0.59 per 1M output tokens
    moonshotai/kimi-k2-instruct:
      input_cost_per_1k: 0.001     # $1.00 per 1M input tokens (uncached)
      output_cost_per_1k: 0.003    # $3.00 per 1M output tokens
    daily_budget: 10.0 # Max $10/Tag total for Groq

  openai:
    gpt-5:
      input_cost_per_1k: 0.000625  # $0.625 per 1M input tokens
      output_cost_per_1k: 0.005    # $5.00 per 1M output tokens
    gpt-5-mini:
      input_cost_per_1k: 0.000125  # $0.125 per 1M input tokens
      output_cost_per_1k: 0.001    # $1.00 per 1M output tokens
    o3-mini:
      input_cost_per_1k: 0.0011    # (Est.) $1.10 per 1M input tokens
      output_cost_per_1k: 0.0044   # (Est.) $4.40 per 1M output tokens
    gpt-4o:
      input_cost_per_1k: 0.0025  # Replaced legacy $5
      output_cost_per_1k: 0.010  # Replaced legacy $15
    gpt-4o-mini:
      input_cost_per_1k: 0.00015
      output_cost_per_1k: 0.0006
    gpt-5.4:
      input_cost_per_1k: 0.0025   # $2.50 per 1M input tokens (openai.com/api/pricing)
      output_cost_per_1k: 0.015    # $15.00 per 1M output tokens
    gpt-5.4-mini:
      input_cost_per_1k: 0.00075  # $0.75 per 1M input tokens (openai.com/api/pricing)
      output_cost_per_1k: 0.0045  # $4.50 per 1M output tokens
    o1:
      input_cost_per_1k: 0.015   # $15.00 per 1M input tokens
      output_cost_per_1k: 0.06   # $60.00 per 1M output tokens
