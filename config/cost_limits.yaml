    # Quelle: https://github.com/BerriAI/litellm/blob/main/model_prices_and_context_window.json
    claude-sonnet-4-6:
      input_cost_per_1k: 0.003    # $3.00/1M  (verifiziert)
      output_cost_per_1k: 0.015   # $15.00/1M (verifiziert)
