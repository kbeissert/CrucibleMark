settings:
  budget_warning_threshold: 0.8
  currency: USD
  cost_log_file: "outputs/cost_log.csv"
  # Maximales Alter des LiteLLM-Preis-Caches in Tagen.
  # 7 Tage = guter Kompromiss: Preise aktuell, kein täglicher Netzwerk-Overhead.
  # Provider ändern Preise typischerweise 2-4x/Jahr.
  pricing_ttl_days: 7
  # Quelle für automatische Tokenpreis-Updates.
  # Standardmäßig die öffentlich gepflegte LiteLLM Pricing DB (BerriAI).
  pricing_source_url: "https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json"
