# Commercial Models Version Lock
# ==============================
# This file ensures reproducibility by pinning specific model versions.
# Instead of using "gpt-4o" (which points to the latest version),
# we use the specific snapshot identifier.
#
# Usage: These mappings should be used by the LLMClient to resolve generic names 
# to specific model versions before making API calls.

providers:
  openai:
    gpt-4o:
      version: "gpt-4o-2024-05-13" # Original launch version or more recent snapshot "gpt-4o-2024-08-06"
      description: "High-intelligence flagship model"
      tested_on: "2026-01-26"
    
    gpt-4o-mini:
      version: "gpt-4o-mini-2024-07-18" 
      description: "Cost-efficient small model"
      tested_on: "2026-01-26"

  anthropic:
    claude-3-5-sonnet:
      version: "claude-3-5-sonnet-20241022" 
      description: "Most intelligent Anthropic model"
      tested_on: "2026-01-26"
      
    claude-3-haiku:
      version: "claude-3-haiku-20240307"
      description: "Fastest, most compact model"
      tested_on: "2026-01-26"

  mistral:
    mistral-large:
      version: "mistral-large-2407" # Example snapshot
      description: "Mistral Large 2"
      tested_on: "2026-01-26"
