default:
  requests_per_minute: 60
  concurrent_requests: 1
  tokens_per_minute: 20000

# Maximale Wartezeit für einen retry_delay-Wert aus der API-Antwort (z.B. Gemini Quota).
# Überschreitet der retry_delay diesen Schwellenwert, ist es keine transiente Rate-
# Begrenzung mehr, sondern eine Tages-Quota-Erschöpfung (Google reset: Mitternacht Pacific).
# In diesem Fall greift Fast-Fail statt Blockieren.
max_retry_delay_seconds: 300

anthropic:
  # Tier 1 Limits (Free/Low) are 5 RPM!
  # Tier 2 (Paid < $50) are 1000 RPM / 40k TPM
  # We assume Tier 2 for safety, but can be configured.
  tier_1:
    requests_per_minute: 5
    tokens_per_minute: 20000
    concurrent_requests: 1
  tier_2:
    requests_per_minute: 1000
    tokens_per_minute: 40000
    concurrent_requests: 5

  # Active Default
  active_tier: "tier_2"

mistral:
  requests_per_minute: 60
  concurrent_requests: 2

openai:
  requests_per_minute: 500
  concurrent_requests: 5

openrouter:
  requests_per_minute: 60
  concurrent_requests: 3

# Free-tier models on OpenRouter (suffix :free) have strict limits.
# Standard free-tier: 20 RPM / 200 RPD. We use a conservative 18 RPM.
openrouter_free:
  requests_per_minute: 18
  concurrent_requests: 1
