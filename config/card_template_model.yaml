# Model Card Template — SSoT für Pflicht- und Optionalfelder
# ============================================================
#
# Jeder Eintrag beschreibt ein Feld, das in einer Model Card vorkommen kann
# (oder muss). Konsumenten sind die Module, die das Feld lesen — bei
# Pflichtfeldern führt ein fehlendes Feld zu einem Validator-Fehler.
#
# Felder:
#   name:           technischer Feldname (Key in der JSON-Datei)
#   required:       true → muss in jeder Model Card vorhanden sein
#                    false → optional (z.B. für Spezialfälle wie Tool-Use-Test-Ergebnis)
#   type:           str | int | float | bool | list[str] | null
#                    null = darf explizit null sein (Sentinel für "nicht ermittelbar")
#   default:        Platzhalterwert, falls das Feld fehlt (von ensure_card gesetzt)
#   description:    einzeilige Beschreibung (für Doku + Validator-Fehlertext)
#   consumers:      Liste von Konsumenten, die dieses Feld aktiv lesen.
#                    Wird im Audit-Report angezeigt: "Feld X wird von Y gelesen".
#   since:          erste Version, in der das Feld Teil des Templates wurde
#                    (für Migrations-Hinweise)
#   example:        Beispielwert (für Doku, NICHT für Validierung)
#
# Pflicht-Klassifikation folgt dem Prinzip: "Wird das Feld von mindestens
# einem Konsumenten gelesen, der bei fehlendem Wert crasht oder
# inkorrekte Ergebnisse liefert?" → required: true.
#
# Sonderfall: `null` ist für Felder erlaubt, die echte "nicht ermittelbar"-
# Semantik haben (z.B. `params_total_b` für proprietäre Modelle ohne
# öffentliche Architektur-Spezifikation).
#
# Konsumenten-Legende:
#   risk_calc   = scripts/analysis/review/risk_calculator.py (Sovereign-Risk)
#   leaderboard = scripts/leaderboard/* (Score-Berechnung, Spalten-Auswahl)
#   web_export  = scripts/web_export.py (statische Webseiten)
#   tooluse     = scripts/core/tooluse_exporter.py (Tool-Use-Anzeige)
#   cost        = utils/cost_tracker.py (Kosten-Berechnung)
#   review      = scripts/analysis/generate_review.py (Reviewer-Prompt)
#   probe       = scripts/tools/probe_thinking.py (Thinking-Probe)
#   index       = _index.json-Generator (Modell-Verzeichnis)
#   scoring     = utils/scoring/* (Scoring-Engine)
#   asset       = benchmark_modules/base_test.py (Asset-Pipeline)

version: "1.0.0"
last_updated: "2026-06-12"
card_type: "model"

# ----------------------------------------------------------------------------
# Pflichtfelder (38) — werden von Validator geprüft
# ----------------------------------------------------------------------------
required_fields:

  # --- Identität (KERN, risk_calc + leaderboard + web_export) ---
  - name: model_id
    type: str
    required: true
    default: null
    description: "Eindeutiger Modell-Identifier (Slug)"
    consumers: [risk_calc, leaderboard, web_export, review, index]
    since: "v1.0"
    example: "gpt-5_4-mini"

  - name: display_name
    type: str
    required: true
    default: "TODO"
    description: "Menschenlesbarer Modellname. Format: {Name} {Größe} ({Community-Gruppe ODER Variante}). Keine Quantisierungs-Specs, keine Deployment-Deskriptoren, keine Datumsangaben."
    consumers: [risk_calc, leaderboard, web_export, review]
    since: "v1.0"
    example: "Qwen 3.5 9B (Unsloth)"

  - name: developer
    type: str
    required: true
    default: "TODO"
    description: "Name des entwickelnden Unternehmens/Labors"
    consumers: [risk_calc, leaderboard, review]
    since: "v1.0"
    example: "OpenAI"

  - name: origin_country
    type: str
    required: true
    default: "TODO"
    description: "Herkunftsland des Modellentwicklers (ISO 3166-1 alpha-2 oder Name)"
    consumers: [risk_calc, leaderboard]
    since: "v1.0"
    example: "USA"

  - name: developer_jurisdiction
    type: str
    required: true
    default: "TODO"
    description: "Rechtsraum des Entwicklers (für Sovereign-Risk)"
    consumers: [risk_calc]
    since: "v1.0"
    example: "US"

  # --- Deployment & Provenance (risk_calc) ---
  - name: deployment_type
    type: str
    required: true
    default: "TODO"
    description: "cloud-only | open-weights-cloud-available | localweights | open-weights"
    consumers: [risk_calc, leaderboard]
    since: "v1.0"
    example: "cloud-only"

  - name: local_deployment_possible
    type: bool
    required: true
    default: null
    description: "Kann das Modell lokal gehostet werden?"
    consumers: [risk_calc, leaderboard]
    since: "v1.0"
    example: false

  - name: weights_provenance_risk
    type: str
    required: true
    default: "TODO"
    description: "low | medium | high — Risiko der Gewichts-Provenienz"
    consumers: [risk_calc, review]
    since: "v1.0"
    example: "medium"

  - name: weights_provenance_risk_rationale
    type: str
    required: true
    default: "TODO"
    description: "Begründung des Provenance-Risk-Levels"
    consumers: [risk_calc, review]
    since: "v1.0"
    example: "OpenAI ist ein US-amerikanisches Unternehmen und unterliegt dem CLOUD Act."

  # --- Klassifikation (leaderboard) ---
  - name: model_family
    type: str
    required: true
    default: "TODO"
    description: "Modell-Familie (z.B. GPT, Claude, Llama)"
    consumers: [leaderboard, review]
    since: "v1.0"
    example: "GPT"

  - name: primary_focus
    type: str
    required: true
    default: "TODO"
    description: "general | reasoning | code | multimodal | ..."
    consumers: [leaderboard, review]
    since: "v1.0"
    example: "general"

  # --- Beschreibung (review + judge) ---
  - name: summary
    type: str
    required: true
    default: "TODO"
    description: "Kurzbeschreibung des Modells (Reviewer-Prompt)"
    consumers: [review, web_export, judge]
    since: "v1.0"
    example: "GPT-5.4 Mini ist OpenAIs kompakte Variante..."

  - name: strengths
    type: list[str]
    required: true
    default: ["TODO"]
    description: "Liste der Stärken (Reviewer-Bewertung)"
    consumers: [review, judge]
    since: "v1.0"
    example: ["Kosteneffizient", "Schnelle Inferenz"]

  - name: known_limitations
    type: list[str]
    required: true
    default: ["TODO"]
    description: "Liste der bekannten Schwächen (Reviewer-Bewertung)"
    consumers: [review, judge]
    since: "v1.0"
    example: ["Schwächer bei komplexem Reasoning"]

  - name: judge_context_hint
    type: str
    required: true
    default: "TODO"
    description: "Kontext-Hinweis für den LLM-Judge (Scoring-Engine)"
    consumers: [judge, scoring]
    since: "v1.0"
    example: "Modell ist auf Effizienz optimiert..."

  - name: architecture_tags
    type: list[str]
    required: true
    default: ["General"]
    description: "Tags für Architektur-Filter im Leaderboard (Whitelist: siehe config/card_vocabulary.yaml)"
    consumers: [leaderboard, web_export]
    since: "v1.0"
    example: ["General", "Instruct"]

  - name: input_modalities
    type: list[str]
    required: true
    default: ["text"]
    description: "Eingabe-Modalitäten, die das Modell nativ verarbeitet. 'text' ist immer implizit. Kontrollierte Werte: text, image, audio, video (siehe classification_taxonomy.json#input_modalities)."
    consumers: [web_export, use_case_inference, leaderboard]
    since: "v4.7.0"
    example: ["text", "image"]

  - name: output_modalities
    type: list[str]
    required: true
    default: ["text"]
    description: "Ausgabe-Modalitäten, die das Modell erzeugen kann. 'text' ist immer implizit. Kontrollierte Werte: text, image, audio (siehe classification_taxonomy.json#output_modalities)."
    consumers: [web_export, leaderboard]
    since: "v4.7.0"
    example: ["text"]

  # --- Metadaten (index + card_status) ---
  - name: unknown
    type: bool
    required: true
    default: false
    description: "true → Card ist unvollständig / unbekannt"
    consumers: [risk_calc, leaderboard, review]
    since: "v1.0"
    example: false

  - name: generated_at
    type: str
    required: true
    default: null
    description: "ISO-8601-Timestamp der Card-Generierung"
    consumers: [index, web_export]
    since: "v1.0"
    example: "2026-04-23T22:00:53+00:00"

  - name: card_status
    type: str
    required: true
    default: "draft"
    description: "draft | minimal | complete"
    consumers: [verify, review]
    since: "v1.0"
    example: "complete"

  - name: size_class
    type: str
    required: true
    default: null
    description: "Auto-berechnete Größenklasse: Nano | Micro | Small | Medium | Desktop | Server | Frontier"
    consumers: [leaderboard, web_export]
    since: "v1.0"
    example: "Desktop"

  # --- Thinking-Probe (probe) ---
  - name: thinking_probe_detected
    type: bool
    required: true
    default: null
    description: "True wenn Modell Thinking/CoT-Signale emittiert"
    consumers: [probe, review]
    since: "v1.0"
    example: false

  - name: thinking_probe_evidence
    type: str
    required: true
    default: null
    description: "Rohtext des Thinking-Probe-Outputs"
    consumers: [probe, review]
    since: "v1.0"
    example: "No CoT signals found..."

  - name: thinking_probe_confidence
    type: str
    required: true
    default: null
    description: "low | medium | high — Confidence der Probe"
    consumers: [probe, review]
    since: "v1.0"
    example: "low"

  - name: thinking_probe_at
    type: str
    required: true
    default: null
    description: "ISO-8601-Timestamp der Probe"
    consumers: [probe]
    since: "v1.0"
    example: "2026-04-23T13:56:14+00:00"

  # --- Tool-Use (tooluse) ---
  - name: supports_tool_use
    type: bool
    required: true
    default: null
    description: "True wenn Modell Tool-Use offiziell unterstützt (nicht getestet = null)"
    consumers: [tooluse, leaderboard]
    since: "v1.0"
    example: true

  # --- Lizenz ---
  - name: license
    type: str
    required: true
    default: "TODO"
    description: "Proprietary | Apache 2.0 | MIT | ..."
    consumers: [review, leaderboard]
    since: "v1.0"
    example: "Proprietary"

  - name: commercial_use_allowed
    type: bool
    required: true
    default: null
    description: "Kommerzielle Nutzung erlaubt?"
    consumers: [review, leaderboard]
    since: "v1.0"
    example: true

  - name: vendor
    type: str
    required: true
    default: "TODO"
    description: "Provider-Name (kann von developer abweichen bei Reselling)"
    consumers: [leaderboard, review]
    since: "v1.0"
    example: "OpenAI"

  - name: weights_license_tier
    type: str
    required: true
    default: "TODO"
    description: "proprietary | open-weights | restricted-weights"
    consumers: [leaderboard, review]
    since: "v1.0"
    example: "proprietary"
    # Whitelist-SSoT: config/classification_taxonomy.json > weights_license_tier.values
    # Wird von utils/card_utils.py:get_valid_values() validiert.

  # --- Pricing (cost) ---
  - name: model_version
    type: str
    required: true
    default: null
    description: "Reine Versionsnummer (z.B. '3.6', '4', '5.4'). NICHT: Parameteranzahl (27B, 120B), Architektur (A3B, MoE), Quantisierung (FP8, NVFP4), Variante (Instruct, Coder), Community-Gruppe. Diese gehoeren in quantization_format, model_variant, parameter_architecture, display_name."
    consumers: [leaderboard, web_export, review]
    since: "v1.0"
    example: "3.6"

  - name: use_case_primary
    type: str
    required: true
    default: "generalist"
    description: "generalist | coding | reasoning | vision-language | agentic"
    consumers: [leaderboard, review]
    since: "v1.0"
    example: "generalist"
    # Whitelist-SSoT: config/classification_taxonomy.json > use_case.values
    # Wird von utils/card_utils.py:get_valid_values() validiert.

  # --- Architektur (risk_calc + leaderboard) ---
  - name: parameter_architecture
    type: str
    required: true
    default: "dense"
    description: "dense | moe | hybrid"
    consumers: [risk_calc, leaderboard, review]
    since: "v1.0"
    example: "dense"
    # Whitelist-SSoT: config/classification_taxonomy.json > parameter_architecture.values
    # Wird von utils/card_utils.py:get_valid_values() validiert.


  - name: context_window_k
    type: int
    required: true
    default: null
    description: "Context-Window in Tausend Tokens"
    consumers: [review, leaderboard, web_export]
    since: "v1.0"
    example: 128


# ----------------------------------------------------------------------------
# Optionalfelder — werden vom Validator NICHT als Fehler gewertet
# ----------------------------------------------------------------------------
optional_fields:

  - name: params_total_b
    type: float
    required: false
    description: "Gesamt-Parameter in Milliarden (null wenn nicht öffentlich)"
    consumers: [leaderboard, web_export, review]
    since: "v1.0"
    example: null

  - name: knowledge_cutoff
    type: str
    required: false
    description: "Trainings-Daten-Cutoff (YYYY-MM)"
    consumers: [review, web_export]
    since: "v1.0"
    example: "2025-09"

  - name: params_active_b
    type: float
    required: false
    description: "Aktive Parameter in Milliarden (für MoE, null wenn nicht öffentlich)"
    consumers: [leaderboard, web_export]
    since: "v1.0"
    example: null

  - name: license_url
    type: str
    required: false
    description: "URL zur Lizenz (oder null bei Proprietary)"
    consumers: [review, web_export]
    since: "v1.0"
    example: null

  - name: input_price_per_1m
    type: float
    required: false
    description: "USD pro 1M Input-Tokens (null für lokale Modelle)"
    consumers: [cost, leaderboard, web_export]
    since: "v1.0"
    example: 0.75

  - name: output_price_per_1m
    type: float
    required: false
    description: "USD pro 1M Output-Tokens (null für lokale Modelle)"
    consumers: [cost, leaderboard, web_export]
    since: "v1.0"
    example: 4.5

  - name: tooluse_tested_at
    type: str
    required: false
    description: "ISO-8601-Timestamp des Tool-Use-Tests (vom tooluse-Workflow angehängt)"
    consumers: [tooluse, leaderboard]
    since: "v3.14"
    example: "2026-05-25T14:00:00+00:00"

  - name: tooluse_score_p1
    type: float
    required: false
    description: "Tool-Use P1-Score (0-100)"
    consumers: [tooluse, leaderboard]
    since: "v3.14"
    example: 96.0

  - name: tooluse_score_p2
    type: float
    required: false
    description: "Tool-Use P2-Score (0-100)"
    consumers: [tooluse, leaderboard]
    since: "v3.14"
    example: 85.0

  - name: tooluse_recommendation
    type: str
    required: false
    description: "PRODUCTION | NOT_RECOMMENDED | UNTESTED"
    consumers: [tooluse, leaderboard]
    since: "v3.14"
    example: "PRODUCTION"

  - name: tooluse_runs
    type: object
    required: false
    description: "Per-Modell ToolUse-Run-Ergebnisse (Key = model_id, Werte: tested_at/score_p1/score_p2)"
    consumers: [tooluse, leaderboard]
    since: "v5.1.5"
    example: {}

  # --- Dual-Profile-Marker (runtime, ab v4.x) ---
  # Load-bearing: utils/model_id.py und scripts/core/unified_runner.py lesen
  # dieses Feld fuer resolve_canonical_model_id / Card-Sharing zwischen
  # Standard- und Thinking-Profil (vLLM Dual-Profil-Expansion).
  - name: dual_profile
    type: bool
    required: false
    description: "true wenn Card von Standard- und Thinking-Profil geteilt wird (nur vLLM); null bei Cloud/lokal ohne Expansion"
    consumers: [runner, model_id]
    since: "v4.10"
    example: false

  - name: temperature
    type: float
    required: false
    description: "Default-Temperatur für Tests (optional, falls Modell besondere Settings braucht)"
    consumers: [asset, probe]
    since: "v4.6.3"
    example: 0.0

  - name: system_prompt_override
    type: str
    required: false
    description: "Modell-spezifischer System-Prompt-Override für den Judge"
    consumers: [judge, review]
    since: "v4.6.3"
    example: null

  # --- Thinking-Probe-Details (probe, ab v4.7.1) ---
  # Erweitert das SSoT-Probe-Quartett um Familien-Klassifikation und
  # Tag-Liste für Tooling (Filter, Audit, Web-Export).
  - name: cot_marker_family
    type: str
    required: false
    description: "CoT-Marker-Familie (z.B. think-xml, deepseek-reasoning, llama-cot, none). think-xml deckt alle Modelle mit <think>/<thought> ab (Qwen3, Magistral u.a.)"
    consumers: [probe, web_export, review]
    since: "v4.7.1"
    example: "think-xml"

  - name: cot_tags_detected
    type: list[str]
    required: false
    description: "Liste der konkret detektierten CoT-Marker (z.B. <think>, <reasoning>)"
    consumers: [probe, web_export, audit]
    since: "v4.7.1"
    example: ["<think>", "<reasoning>"]

  # --- Sampling-Defaults (v4.7.2) ---
  # Modell-spezifische Sampling-Parameter. Wert 'null' = Pipeline-Default
  # greift (z.B. OpenAI-Default fuer temperature). Konsumenten: asset-Pipeline
  # (vor jeder Inferenz angewandt), probe (Thinking-Probe).
  - name: top_p
    type: float
    required: false
    default: null
    description: "Nucleus-Sampling-Threshold (0.0-1.0). null = Pipeline-Default."
    consumers: [asset, probe]
    since: "v4.7.2"
    example: 0.9

  - name: top_k
    type: int
    required: false
    default: null
    description: "Top-K-Limit fuer Token-Auswahl. null = Pipeline-Default."
    consumers: [asset, probe]
    since: "v4.7.2"
    example: 40

  - name: repetition_penalty
    type: float
    required: false
    default: null
    description: "Strafterm fuer wiederholte Tokens (oft > 1.0, z.B. 1.05). null = Pipeline-Default."
    consumers: [asset, probe]
    since: "v4.7.2"
    example: 1.05

  - name: frequency_penalty
    type: float
    required: false
    default: null
    description: "OpenAI-spezifisch (-2.0 bis 2.0). null = Pipeline-Default."
    consumers: [asset, probe]
    since: "v4.7.2"
    example: 0.0

  - name: presence_penalty
    type: float
    required: false
    default: null
    description: "OpenAI-spezifisch (-2.0 bis 2.0). null = Pipeline-Default."
    consumers: [asset, probe]
    since: "v4.7.2"
    example: 0.0

  - name: seed
    type: int
    required: false
    default: null
    description: "Reproduzierbarkeits-Seed (int). null = Pipeline-Default (kein Seed)."
    consumers: [asset, probe]
    since: "v4.7.2"
    example: 42

  - name: stop_sequences
    type: list[str]
    required: false
    default: null
    description: "Liste von Stop-Sequenzen, bei denen die Generierung abbricht. null = Pipeline-Default."
    consumers: [asset, judge]
    since: "v4.7.2"
    example: ["\n\n", "###"]

  # --- Datenpflege-Verifikation (editor_prompts, ab v4.9.0) ---
  # Entspricht dem gleichen Mechanismus wie in Provider Cards.
  # profile_verified = true → inhaltliche Felder der Card wurden manuell
  # recherchiert und verifiziert (summary, strengths, known_limitations,
  # judge_context_hint, params, pricing, modalities, license, etc.).
  #
  # Felder, die NICHT unter dieses Flag fallen (automatisch gesetzt):
  #   thinking_probe_*, cot_marker_family, cot_tags_detected,
  #   tooluse_*, generated_at, size_class, unknown, model_id
  - name: profile_verified
    type: bool
    required: false
    default: false
    description: "True → inhaltliche Felder wurden manuell recherchiert und verifiziert (via editor_prompts model_card_verification)"
    consumers: [verify, web_export]
    since: "v4.9.0"
    example: false

  - name: profile_verified_at
    type: str
    required: false
    default: null
    description: "ISO-8601-Datum der letzten Verifikation (YYYY-MM-DD). null = noch nicht verifiziert"
    consumers: [verify, web_export]
    since: "v4.9.0"
    example: "2026-06-12"

  - name: profile_verified_by
    type: str
    required: false
    default: null
    description: "Wer hat zuletzt verifiziert ('human' | 'llm:<model>' | null). SSoT fuer Audit-Trail."
    consumers: [verify, web_export]
    since: "v4.10.0"
    example: "llm:gpt-5.4"

  - name: last_modified_at
    type: str
    required: false
    default: null
    description: "ISO-8601-Datum der letzten inhaltlichen Aenderung (YYYY-MM-DD). Wird von manage_model_cards.py (Researcher + make --write) aktualisiert."
    consumers: [verify, web_export]
    since: "v4.10.0"
    example: "2026-06-18"

  # --- Heritage-IDs (web_export + review, ab v4.8.0) ---
  # Wird gesetzt, wenn ein Modell unter einer neuen kanonischen ID neu angelegt
  # wird (z.B. nach Breaking-Change im API-Namespace). Ermöglicht es
  # web_export.py und generate_review.py, Audit-Log-Dirs und Review-Dirs zu
  # finden, die noch unter der alten ID abgelegt sind.
  - name: heritage_ids
    type: list[str]
    required: false
    default: []
    description: "Frühere kanonische model_ids dieses Modells. Einträge als rohe API-IDs (z.B. 'vendor/old-model-v1'). Konsumenten lösen per _safe_name-Normalisierung auf Dirs auf."
    consumers: [web_export, review]
    since: "v4.8.0"
    example: ["moonshotai/kimi-k2-0127", "deepseek/deepseek-chat-v3"]

  # --- Community-Zuordnung (web_export + review, ab v4.9.2) ---
  # Verweist auf die Community-Gruppe, die an diesem Modell gearbeitet hat
  # (Quantisierung, Fine-Tuning, Abliterierung o.ä.). Kontrollierte Werte
  # aus classification_taxonomy.json#community_groups. Kein Pflichtfeld —
  # nur setzen wenn ein konkreter Community-Distributor identifiziert wurde.
  - name: community
    type: str
    required: false
    default: null
    description: "Community-Distributions-Gruppe, die an diesem Modell gearbeitet hat (z.B. 'Unsloth', 'mradermacher'). Kontrollierte Werte: siehe classification_taxonomy.json#community_groups."
    consumers: [web_export, review]
    since: "v4.9.2"
    example: "Unsloth"

  # --- v4.10.14: Quant/Variant-Separierung (model_version = reine Versionsnummer) ---
  - name: quantization_format
    type: str
    required: false
    default: null
    description: "Quantisierungs-/Format-Token fuer lokale Modelle (z.B. 'Q8_0 GGUF', 'FP8', 'NVFP4'). NICHT in model_version parsen — model_version ist reine Versionsnummer (Leaderboard-Groupby-Key)."
    consumers: [web_export]
    since: "v4.10.14"
    example: "Q8_0 GGUF"

  - name: model_variant
    type: str
    required: false
    default: null
    description: "Interne Fein-Tune-/Variant-Bezeichnung (z.B. 'MTP', 'Coder-MTP', 'Ortenzya Wordsmith', 'E4B', 'QAT', 'Abliterated'). Landet hier statt in model_version."
    consumers: [web_export]
    since: "v4.10.14"
    example: "MTP"

  - name: thinking_probe_manual_override
    type: str
    required: false
    default: null
    description: "Freitext-Rationale fuer einen manuellen Override der Thinking-Probe-Detektion (z.B. wenn Live-Probe vs. offizielle Doku widerspruechlich sind). Schon seit v4.7.x im Export; ab v4.10.14 auch im YAML-Vertrag erfasst."
    consumers: [web_export]
    since: "v4.7.1"
    example: "Thinking via <think>-Tags ist dokumentiertes Kernfeature laut Model Card."

  # --- Platzhalter-Felder (in _CARD_TEMPLATE vorhanden, aktuell 0/110 Cards befüllt) ---
  # Divergenz Python<->YAML schliessen (v4.10.14). Keine web_export-Consumer, da
  # ungenutzt: hardware_profile wird top-level aus der Leaderboard-CSV-Spalte
  # exportiert (SSoT), inference_engine hat bisher keine Konsumenten.
  - name: hardware_profile
    type: str
    required: false
    default: null
    description: "Platzhalter fuer Hardware-Profil in der Card (z.B. 'dgx_spark_cuda'). Aktuell ungenutzt — die SSoT fuer Hardware ist die Leaderboard-CSV-Spalte 'Hardware Profile' (top-level im Web-Export)."
    consumers: []
    since: "v4.10.14"
    example: "dgx_spark_cuda"

  - name: inference_engine
    type: str
    required: false
    default: null
    description: "Platzhalter fuer Inference-Engine (z.B. 'llama.cpp', 'vLLM'). Aktuell ungenutzt (0/110 Cards befuellt)."
    consumers: []
    since: "v4.10.14"
    example: "vLLM"

# ----------------------------------------------------------------------------
# Validator-Konfiguration
# ----------------------------------------------------------------------------
validation:
  reject_unknown_true_without_rationale: false
  reject_card_status_minimal: false   # Toleranz: minimal-Status ist OK
  require_complete_status: false      # Strict-Mode für CI
