# Editor Prompts — Kuratierte Aufgaben-Prompts für manuelle LLM-Aufgaben
# =======================================================================
# Zweck: Wiederverwendbare Prompts für redaktionelle Aufgaben (Datenpflege).
# Diese Prompts verändern NICHT die Benchmark-Logik oder Reviewer-Prompts.
#
# Workflow:
# 1. Operator setzt betroffene Cards auf Zielstatus (z.B. profile_verified: false)
# 2. Operator schickt Prompt an fähiges LLM (Claude Opus 4+, GPT-5+, etc.)
# 3. LLM arbeitet Prompt ab, aktualisiert Dateien, setzt Verifikations-Flags
# 4. Operator prüft diff, commitet
#
# Verfügbare Prompts:
# - provider_card_verification  → Hersteller-Informationen verifizieren
# - model_card_verification     → Modell-Metadaten verifizieren/ergänzen
# - community_card_verification → Community-Distributor-Cards verifizieren
# - model_onboarding            → Neue Modelle onboarden

version: "1.3.0"
last_updated: "2026-06-18"

# ----------------------------------------------------------------------------
# PROMPT: provider_card_verification
# ----------------------------------------------------------------------------
# Empfohlene Modelle: Claude Opus 4+, GPT-5+, Gemini 2.5 Pro
# Benötigte Fähigkeiten: Web-Recherche, Datei-Schreibzugriff
# Geschätzte Dauer: 3–8 Min. pro Hersteller
# ----------------------------------------------------------------------------
provider_card_verification:
  name: "Provider Card Verification"
  version: "1.2.0"
  description: >
    Verifiziert und aktualisiert die statischen Hersteller-Informationen in
    Provider Cards. Wird auf Cards mit profile_verified: false angewendet.
  targets:
    directory: "benchmark_scores/vendor_cards/"
    filter: "profile_verified == false"
    exclude: ["_index.json", "todo.json", "unknown.json"]
  prompt: |
    # Aufgabe: Provider Card Verification

    Du bist ein erfahrener Tech-Redakteur mit Fokus auf KI-Unternehmen und
    europäisches Datenschutzrecht. Antworte ausschließlich auf Deutsch —
    keine nicht-lateinischen Schriftzeichen in Ausgaben oder Zwischenschritten.

    **Recherchepflicht (strikt):** Kein Training-Wissen verwenden. Alle Angaben
    müssen auf aktuellen, öffentlich verifizierbaren Quellen basieren: offizielle
    Unternehmenswebsite, Datenschutzerklärung, API-Dokumentation, Crunchbase/LinkedIn.

    ## Kontext

    CrucibleMark ist ein LLM-Benchmark-Framework. Provider Cards dokumentieren
    Hersteller/Anbieter von KI-Modellen — insbesondere Compliance-relevante
    Informationen (DSGVO, Jurisdiktion, Datenschutz) für europäische Nutzer.

    ## Auftrag

    Bearbeite alle Provider Cards in `benchmark_scores/vendor_cards/` mit
    `"profile_verified": false`. Überspringe: `_index.json`, `todo.json`,
    `unknown.json`.

    ## Vorgehen pro Card

    ### Schritt 1 — Datei lesen
    Vollständig lesen. `vendor_id`, `display_name`, `company` notieren.

    ### Schritt 2 — Recherche (alles aktiv recherchieren, nicht aus Training)

    **Firmen-Stammdaten:**
    - Vollständiger Firmenname (Rechtsform, z.B. "OpenAI, L.L.C.")
    - Aktueller Firmensitz (Stadt, Region, Land)
    - Gründungsjahr

    **API & Produkt:**
    - Aktuelle API-Basis-URL
    - Aktuelle API-Dokumentations-URL

    **Compliance & Datenschutz:**
    - `cloud_act_exposure`: true wenn Firmensitz USA, sonst aktiv prüfen
    - `applicable_law`: z.B. "US (CLOUD Act)", "EU (DSGVO)", "China (PIPL/CSL/DSL)"
    - `data_residency`: Wo werden Daten verarbeitet/gespeichert?
    - `gdpr_dpa_available`: Ist ein DSGVO-DPA öffentlich verfügbar?
    - `eu_adequacy_decision`: Gilt ein EU-Angemessenheitsbeschluss?
    - `data_retention_days`: Aufbewahrung von API-Anfragen in Tagen (-1 = unklar)
    - `chinese_nsl_risk`: "none" / "low" / "medium" / "high"
      (NSL gilt für chinesische Firmen und ihre globalen Töchter)

    **Hersteller-Beschreibung (`description`):**
    Sachlicher Kurztext für Product Engineers. 240–480 Zeichen (Ziel: 360).
    Ton: prosaisch, nicht werblich ("führend", "revolutionär" → verboten).
    Fließtext, keine Aufzählungszeichen. Nur belegte Fakten.

    **Privacy Note (`privacy_note`):**
    2–4 Sätze, Deutsch, neutral-informativ. Wesentliche Risiken und Hinweise
    für europäische Nutzer.

    ### Schritt 3 — Felder aktualisieren (nur diese)
    ```
    company, headquarters, founding_year, description, api_base_url,
    api_documentation_url, deployment.cloud_act_exposure,
    deployment.applicable_law, deployment.data_residency,
    deployment.gdpr_dpa_available, deployment.eu_adequacy_decision,
    deployment.data_retention_days, deployment.chinese_nsl_risk,
    privacy_note, last_verified_at (heute, YYYY-MM-DD),
    verification_source (echte URL), profile_verified (true),
    profile_verified_at (heute, YYYY-MM-DD)
    ```

    ### Schritt 4 — Nicht anfassen
    ```
    vendor_id, display_name, notable_models, stats, pricing_model,
    unknown, generated_at
    ```

    ### Schritt 5 — Abschlussprüfung
    - JSON valide
    - `description` 240–480 Zeichen, keine Aufzählungszeichen
    - `profile_verified: true` und `profile_verified_at` gesetzt
    - `verification_source` ist eine echte, erreichbare URL
    - Kein nicht-lateinisches Zeichen in irgendeinem Textfeld

    ## Ausgabe-Format
    Kurze Zusammenfassung: welche Cards aktualisiert, wesentliche Änderungen,
    Unsicherheiten (→ `profile_verified: false` lassen + Notiz in `privacy_note`).

    ## Qualitätskriterien
    - Offizielle Quellen bevorzugen (privacy-policy, legal-Seiten)
    - Bei Unsicherheit konservativ: US-Sitz → `cloud_act_exposure: true`
    - Chinesische Firmen/Töchter → `chinese_nsl_risk: "high"`

# ----------------------------------------------------------------------------
# PROMPT: model_card_verification
# ----------------------------------------------------------------------------
# Empfohlene Modelle: Claude Opus 4+, GPT-5+, Gemini 2.5 Pro
# Benötigte Fähigkeiten: Web-Recherche, Datei-Schreibzugriff
# Geschätzte Dauer: 2–5 Min. pro Modell
# ----------------------------------------------------------------------------
model_card_verification:
  name: "Model Card Verification"
  version: "1.3.0"
  description: >
    Verifiziert und ergänzt Metadaten in Model Cards anhand des aktuellen
    card_template_model.yaml als Single Source of Truth. Füllt fehlende
    Template-Felder, entfernt veraltete Nicht-Template-Felder und korrigiert
    verifizierbare Inhalte wie Lizenz, Preise, Context-Window und Knowledge-Cutoff.
  targets:
    directory: "benchmark_scores/model_cards/"
    filter: "all cards or operator-selected subset"
    exclude: ["_index.json"]
  prompt: |
    # Aufgabe: Model Card Verification

        Du bist ein erfahrener Tech-Redakteur mit Spezialisierung auf KI-Modelle.
    Antworte ausschließlich auf Deutsch. Verwende keine nicht-lateinischen
    Schriftzeichen in Ausgaben, Zwischenschritten oder Textfeldern.

    **ABSOLUTES VERBOT: Training-Wissen als Quelle nutzen.**
    Dein internes Wissen über Modelle, Lizenzen, Parameter und Preise
    ist veraltet und unzuverlässig. Es darf unter keinen Umständen als
    Grundlage für Feldwerte dienen — auch nicht zur Plausibilitätsprüfung,
    auch nicht als Fallback, auch nicht zur Bestätigung eines Wertes.

    Jedes inhaltliche Feld muss entweder:
    a) aus der bestehenden Card übernommen werden (wenn bereits korrekt belegt), oder
    b) durch aktiven Abruf einer externen Quelle neu belegt werden.

    Wenn du eine externe Quelle nicht abrufen kannst:
    → Bestehenden Wert beibehalten und als unverifizierten Warning markieren
    → NICHT durch einen aus dem Training abgeleiteten Wert ersetzen
    → NICHT auf true verifizieren

    **Lizenzen wechseln zwischen Modellgenerationen — immer konkret prüfen.**
    Gemma 1/2/3 ≠ Gemma 4. Llama 2 ≠ Llama 3. Qwen 2 ≠ Qwen 3.
    Der Modellname allein bestimmt nie die Lizenz.

    **Recherchepflicht gilt besonders für Lizenzfelder.** Lizenzen
    wechseln zwischen Modellgenerationen. Was für Gemma 1/2/3 galt,
    gilt nicht automatisch für Gemma 4. Was für Llama 2 galt, gilt
    nicht für Llama 3. Immer die aktuelle Lizenzseite der konkreten
    Modellversion abrufen.

    Alle inhaltlichen Angaben aktiv recherchieren und nur aus aktuellen,
    öffentlich verifizierbaren Quellen übernehmen. Offizielle Quellen haben
    Vorrang: Hersteller-Website, offizielle HuggingFace Model Card,
    Ankündigungs-Blogposts, API-Preisseiten, offizielle Lizenzseiten.

    **WICHTIG: Das Datei-Template ist die Single Source of Truth.**
    Verwende `config/card_template_model.yaml` bzw. das bereitgestellte
    `card_template_model.yaml` als verbindliche Felddefinition.

    ## Ziel

    Überarbeite jede Model Card so, dass sie:
    1. alle im Template definierten Felder enthält,
    2. keine veralteten Felder außerhalb des Templates mehr enthält,
    3. inhaltlich korrekt recherchiert ist,
    4. formal zum Template und zu den kontrollierten Vokabularen passt.

    ## Zentrale Regeln

    ### Regel 1 — Template-Sync ist Pflicht
    Für jede Card gilt:

    - Wenn ein Feld im aktuellen `card_template_model.yaml` definiert ist, muss es
      in der Card vorhanden sein.
    - Wenn ein Feld in der Card existiert, aber nicht mehr im Template definiert ist,
      muss es aus der Card entfernt werden.
    - Fehlende Template-Felder müssen ergänzt werden.
    - Optionalfelder aus dem Template dürfen vorhanden sein; wenn sie schon in der
      Card existieren, müssen sie formal erhalten bleiben.
    - Felder, die automatisch von anderen Pipelines gepflegt werden, dürfen nicht
      redaktionell überschrieben werden, außer diese Anweisung erlaubt es explizit.

    ### Regel 2 — Preise immer aktualisieren
    `input_price_per_1m` und `output_price_per_1m` müssen immer geprüft und bei
    Bedarf aktualisiert werden — auch wenn `profile_verified: true` gesetzt ist.
    Preise gelten als zeitvariable Felder und sind nie durch einen alten
    Verifikationsstatus dauerhaft eingefroren. [file:57]

    ### Regel 3 — Verifikation bezieht sich auf inhaltliche Felder
    Laut Template umfasst die Verifikation insbesondere Felder wie `summary`,
    `strengths`, `known_limitations`, `judge_context_hint`, Parameter, Pricing,
    Modalitäten, Lizenz und ähnliche Inhaltsfelder. Automatische Felder wie
    `thinking_probe_*`, `tooluse_*`, `generated_at`, `size_class`, `unknown`
    und `model_id` fallen nicht unter die redaktionelle Verifikation. [file:57]

    ### Regel 4 — Bei Unsicherheit konservativ
    Wenn ein Wert nicht offiziell belegbar ist:
    - nicht raten,
    - `null` setzen, wenn das Template dies semantisch erlaubt,
    - oder den bestehenden Wert nur dann beibehalten, wenn er verifiziert werden kann.
    Nicht belegbare Fantasiewerte sind schlimmer als `null`.

    ## Kontext

    CrucibleMark ist ein LLM-Benchmark-Framework. Model Cards enthalten
    strukturierte Metadaten zu KI-Modellen: Architektur, Lizenz, Pricing,
    Stärken, Schwächen und Kontext-Hinweise für Judge, Review, Web-Export
    und Leaderboard.

    ## Verbindliche Feldlogik

    Nutze das Template als Wahrheit für:
    - Pflichtfelder
    - Optionalfelder
    - erlaubte `null`-Semantik
    - Standardwerte
    - technische Feldnamen

    Wenn Template und bestehende Card widersprüchlich sind, gewinnt immer das Template. [file:57]

    ## Glossar für inhaltliche Klassifikation

    **`deployment_type`:**
    - `cloud-only` — nur API, keine öffentlichen Gewichte
    - `open-weights-cloud-available` — Gewichte öffentlich + offizielle Cloud-API
    - `open-weights` — öffentliche Gewichte, keine offizielle Cloud-API
    - `localweights` — lokale Gewichte oder Community-Quantisierung ohne offizielle API

    **`weights_license_tier`:**
    - `open-weights` — OSI-anerkannte oder vergleichbar permissive Lizenz ohne
      kommerzielle Nutzungsbeschränkung
    - `restricted-weights` — öffentliche Gewichte unter Custom-/Nutzungsbedingungen
    - `proprietary` — keine öffentlichen Gewichte

    **Konsistenzregel license_url:**
    - `license: "Apache 2.0"` → `license_url` muss auf die Apache-Lizenz
      zeigen: `https://www.apache.org/licenses/LICENSE-2.0`
      NICHT auf `https://ai.google.dev/gemma/terms` oder eine
      modellspezifische Seite
    - `license: "MIT"` → `https://opensource.org/licenses/MIT`
    - Custom-Lizenzen → URL zur offiziellen Lizenzseite des Herstellers
    - Die `license_url` muss zur `license` passen — nie eine generische
      Hersteller-URL verwenden wenn eine SPDX-Lizenz angegeben ist

    **WICHTIG:** Die Lizenzklassifikation darf nie aus dem Modellnamen oder
    der Modellfamilie abgeleitet werden. "Gemma" im Namen bedeutet nicht
    automatisch "Gemma Terms". Jede Modellversion wird einzeln geprüft.

    **`weights_provenance_risk`:**
    - `low` — EU oder vergleichbar risikoarm
    - `medium` — US-Jurisdiktion, CLOUD-Act-Risiko möglich
    - `high` — chinesische Jurisdiktion oder stark unklare Eigentümerstruktur

    **`use_case_primary`:**
    - `generalist`
    - `coding`
    - `reasoning`
    - `vision-language`
    - `agentic`

    **`parameter_architecture`:**
    - `dense`
    - `moe`
    - `hybrid`

    **`community`:**
    Nur setzen, wenn der konkrete Community-Distributor identifizierbar ist.
    Kontrollierte Werte: `Unsloth`, `mradermacher`, `HauhauCS`, `ARA-APEX`. [file:56]

    ## Auftrag

    Bearbeite alle Model Cards im Zielverzeichnis oder im vom Operator gewählten
    Teilset. Verwende nicht den bisherigen Card-Zustand als Autorität, sondern
    das aktuelle Template plus offizielle Quellen.

    ## Vorgehen pro Card

    ### Schritt 1 — Template und Card lesen
    Lies zuerst:
    - die bestehende Model Card vollständig
    - das aktuelle `card_template_model.yaml` vollständig

    Erstelle gedanklich drei Mengen:
    1. Felder, die laut Template vorhanden sein müssen
    2. Felder, die optional laut Template erlaubt sind
    3. Felder, die in der Card existieren, aber nicht mehr im Template vorkommen

    ### Schritt 2 — Schema-Sync durchführen
    Vor der Inhaltsrecherche:

    - Fehlende Template-Felder ergänzen
    - Nicht mehr definierte Felder entfernen
    - Feldnamen exakt an das Template anpassen
    - Defaults nur als Platzhalter verwenden, nicht als recherchierte Wahrheit missverstehen

    ### GGUF-Recherchepfad (verbindlich für alle Community-Quantisierungen)

    Erkennungsregel: Ein Modell ist eine Community-GGUF-Distribution wenn
    `deployment_type: localweights` ODER `architecture_tags` den Wert
    `Quantized` enthält ODER `model_id` / `display_name` einen der folgenden
    Hinweise enthalten: GGUF, Q4, Q5, Q6, Q8, IQ, UD, Dynamic, iMatrix,
    GPTQ, AWQ, EXL2.

    Für diese Modelle gilt zwingend folgender Recherchepfad:

    #### Schritt A — HuggingFace-URL konstruieren

    Regel: Die `model_id` entspricht dem HuggingFace Repo-Slug oder enthält
    Hinweise darauf. Baue die URL wie folgt:
    `https://huggingface.co/{community_distributor}/{repo_name}`

    Typische Distributor-Präfixe im `model_id`:
    - `UD` oder `Dynamic` im Namen → Unsloth-Distribution
      → URL: `https://huggingface.co/unsloth/{repo_name}`
    - Name enthält `mradermacher` → `https://huggingface.co/mradermacher/{repo_name}`
    - Name enthält `HauhauCS` → `https://huggingface.co/HauhauCS/{repo_name}`

    Falls der Distributor nicht eindeutig erkennbar ist:
    → Suche auf HuggingFace nach dem vollständigen `model_id`-String.

    #### Schritt B — HuggingFace Model Card aufrufen und auslesen

    Rufe die HuggingFace-Seite des Repos auf. Extrahiere:
    - Vollständigen Namen des Basismodells (z.B. "Google Gemma 3 27B IT")
    - Link zur Basismodell-Seite (z.B. `google/gemma-3-27b-it`)
    - Quantisierungsformat und Stufe (z.B. Q8_K_XL, UD Dynamic 2.0)
    - Distributor-Name (z.B. Unsloth AI)
    - Etwaige Hinweise auf Abliterierung oder Uncensored-Fine-Tuning

    #### Schritt C — Basismodell-Seite aufrufen

    Rufe die HuggingFace-Seite des Basismodells auf. Extrahiere:
    - Vollständige offizielle Modellbezeichnung laut Hersteller
    - Parameter-Anzahl (offiziell, in Milliarden)
    - Architektur (dense / MoE)
    - Context-Window
    - Knowledge-Cutoff (nur wenn explizit dokumentiert)
    - Lizenz-SPDX-Name und URL der Lizenzdatei
    - Input-Modalitäten (Text, Bild, Audio)
    - Offizielle HuggingFace-Org des Herstellers

    #### Schritt D — Konfliktauflösung bei Lizenzwiderspruch

    Wenn dein internes Training-Wissen von der offiziellen Quelle abweicht:
    → Die offizielle Quelle gewinnt immer, ohne Ausnahme.
    → Den alten Wert aus dem Training komplett verwerfen.
    → Den neuen, recherchierten Wert in das Feld schreiben.
    → In `known_limitations` oder `judge_context_hint` einen Hinweis
      ergänzen, wenn ein Lizenzwechsel gegenüber Vorgängerversionen
      für den Nutzer relevant ist.

    Konkretes Beispiel Gemma-Familie:
    - Gemma 1, 2, 3 → "Gemma Terms of Use" → `restricted-weights`
    - Gemma 4 → Apache 2.0 → `open-weights`
    Diese Information muss aktiv von `https://ai.google.dev/gemma/terms`
    oder der HuggingFace Model Card des Basismodells bestätigt werden —
    nicht aus dem Training übernommen werden.


    #### Schritt E — Felder aus beiden Quellen ableiten

    Erst nach Abschluss von Schritt A–D alle Felder befüllen.

    Spezialregeln für GGUF-Distributions:

    - `developer` und `vendor` = das originale Hersteller-Lab (z.B. "Google DeepMind"),
      NICHT der Distributor (Unsloth, mradermacher, etc.)
    - `community` = kanonischer Distributor-Name (z.B. "Unsloth")
    - `deployment_type` = `localweights`
    - `local_deployment_possible` = `true`
    - `input_price_per_1m` = `null`
    - `output_price_per_1m` = `null`
    - `parameter_architecture`: dense wenn keine offizielle MoE-Quelle vorliegt
      — konservativ, nicht aus Modellnamen ableiten
    - `params_active_b`: nur setzen wenn MoE offiziell bestätigt, sonst `null`
    - `supports_tool_use`: `null` wenn der lokale Inference-Stack dies
      bestimmt und kein offizieller Herstellerbeleg für diese Gewichts-
      Variante existiert
    - `input_modalities`: Wenn das Basismodell multimodal ist, aber die
      GGUF-Distribution das Bildformat nicht explizit unterstützt, muss
      `known_limitations` darauf hinweisen. Der Eintrag in `input_modalities`
      richtet sich nach dem Basismodell, wenn die Quantisierung keine
      Einschränkung dokumentiert.
    - `display_name` = `"{Offizieller Basismodellname} ({Community-Gruppe ODER Variante})"`,
      z.B. `"Gemma 3 27B IT (Unsloth)"` oder `"Hermes 4 14B (Abliterated)"`.
      **NICHT** im display_name: Quantisierungsstufe (Q4_K_M, Q8_0, UD-Q*, QAT, MTP, NVFP4, MXFP4),
      Deployment-Deskriptoren (vLLM, GGUF, Cloud API), Provider-Suffixe (via OpenRouter),
      Architektur-Tags (Dense, MoE, MTP, DFlash) oder Datumsangaben.
      Diese Informationen gehören in `quantization_format`, `model_variant`,
      `parameter_architecture`, `architecture_tags`, `deployment_type` bzw. `model_id`.
    - `model_version` = Reine Versionsnummer (z.B. `"3.6"`, `"4"`, `"5.4"`).
      **NICHT** in model_version: Parameteranzahl (27B, 35B-A3B, 120B), Quantisierung
      (FP8, NVFP4, MXFP4), Variante (Instruct, Coder, Next), Community-Gruppe
      (Uncensored, Abliterated), Architektur (Dense, MoE).
      Diese gehoeren in `quantization_format`, `model_variant`, `display_name`,
      `parameter_architecture` bzw. `community`.
    - `summary` muss Basismodell, Distributor, Quantisierungsstufe und
      den praktischen Deploymentvorteil nennen
    - `judge_context_hint` muss auf die Quantisierungsvariante und
      mögliche Runtime-Unterschiede bei Vision/Tool-Use hinweisen

    #### Erkennungsbeispiel für diesen Recherchepfad

    `model_id: gemma-4-26B-A4B-it-UD-Q8_K_XL`
    → "UD" und "Q8_K_XL" → Unsloth Dynamic GGUF
    → HuggingFace-Suche: `https://huggingface.co/unsloth/gemma-4-26B-A4B-it-UD-Q8_K_XL`
      (alternativ: Suche nach dem model_id-String auf HuggingFace)
    → Basismodell laut HF-Card: Google Gemma 3 27B IT (`google/gemma-3-27b-it`)
    → Basismodell-Seite aufrufen → Lizenz, Parameter, Context, Cutoff extrahieren
    → `display_name: "Gemma 3 27B IT (Unsloth)"`
    → `community: "Unsloth"`
    → `license: "Gemma Terms of Use"`, `license_url: "https://ai.google.dev/gemma/terms"`
    → `params_total_b: 27`, `params_active_b: null`, `parameter_architecture: "dense"`

    ### Schritt 3 — Inhaltlich recherchieren

    Recherchiere für alle template-definierten Inhaltsfelder, sofern sie:
    - fehlen,
    - `TODO` sind,
    - `null` sind, obwohl ein belastbarer Wert öffentlich recherchierbar ist,
    - offensichtlich veraltet oder falsch sind,
    - zeitvariabel sind, insbesondere Preise.

    Besonders wichtig:

    **Identität & Klassifikation**
    - `display_name`
    - `developer`
    - `vendor`
    - `origin_country`
    - `developer_jurisdiction`
    - `model_family`
    - `model_version`

    **Architektur & Fähigkeiten**
    - `parameter_architecture`
    - `params_total_b`
    - `params_active_b`
    - `context_window_k`
    - `knowledge_cutoff` nur wenn offiziell dokumentiert, sonst `null`
    - `input_modalities`
    - `output_modalities`
    - `supports_tool_use`
    - `architecture_tags`
    - `primary_focus`
    - `use_case_primary`

    **Deployment & Lizenz**
    - `deployment_type`
    - `local_deployment_possible`
    - `license`
    - `license_url`
    - `commercial_use_allowed`
    - `weights_license_tier`

    **Pricing**
    - `input_price_per_1m`
    - `output_price_per_1m`

    **Sovereign Risk**
    - `weights_provenance_risk`
    - `weights_provenance_risk_rationale`

    **Redaktionelle Felder**
    - `summary`
    - `strengths`
    - `known_limitations`
    - `judge_context_hint`

    **Community-Zuordnung**
    - `community` bei lokalen/open-weight Community-Distributionen

    ### Schritt 4 — Bearbeitungsregeln für einzelne Felder

    **`knowledge_cutoff`:**
    Nur setzen, wenn für die konkrete Modellversion öffentlich dokumentiert.
    Sonst `null`. Nicht schätzen. [file:57]

    **`summary`:**
    240–480 Zeichen, Ziel 360. Deutsch, Fließtext, keine Listen,
    kein Werbeton, keine Metaphern, keine nicht-lateinischen Zeichen.

    **`strengths` / `known_limitations`:**
    Sachlich, präzise, nicht werblich. Nur belegte Aussagen.

    **`judge_context_hint`:**
    1–2 Sätze. Nur Dinge nennen, die für die konkrete Modellvariante
    wirklich belegt sind. Keine Spekulation über Thinking-Modus,
    Tool-Use oder Hidden Features.

    **`community`:**
    Bei HuggingFace-Distributor:
    - `unsloth` / `unslothai` → `Unsloth`
    - `mradermacher` → `mradermacher`
    - `HauhauCS` → `HauhauCS`
    - Handle/Name mit `ARA-APEX` → `ARA-APEX`
    - Herstellerdirekter Release → `null`

    ### Schritt 5 — Automatische und operator-reservierte Felder respektieren

    **KRITISCH — profile_verified Sperregel:**
    profile_verified darf NUR auf true gesetzt werden wenn:
    - Kein einziges 🔴-Finding im Report vorliegt
    - Alle Pflichtfelder mit verifizierten Werten befüllt sind

    Bei einem oder mehr 🔴-Findings:
    - profile_verified MUSS false bleiben
    - profile_verified_at NICHT setzen
    - In der Zusammenfassung explizit nennen, warum false bleibt
    - Der Operator korrigiert die Card manuell und löst den Lock

    Nicht redaktionell überschreiben:
    - `model_id`
    - `generated_at`
    - `unknown`
    - `size_class`
    - `thinking_probe_detected`
    - `thinking_probe_evidence`
    - `thinking_probe_confidence`
    - `thinking_probe_at`
    - `tooluse_tested_at`
    - `tooluse_score_p1`
    - `tooluse_score_p2`
    - `tooluse_recommendation`
    - `cot_marker_family`
    - `cot_tags_detected`

    Operator-/systemnahe Felder nur ändern, wenn dies Teil der Datenpflege ist:
    - `profile_verified`
    - `profile_verified_at`
    - `profile_verified_by`
    - `last_modified_at`

    **Setze nach erfolgreicher inhaltlicher Verifikation:**
    - `profile_verified: true`
    - `profile_verified_at: heutiges Datum (YYYY-MM-DD)`
    - `profile_verified_by: "llm:<modellname>"` falls bekannt, sonst `"llm"`
    - `last_modified_at: heutiges Datum (YYYY-MM-DD)`

    **WICHTIG:** Wenn nur Preise geändert wurden, ist `last_modified_at`
    trotzdem zu aktualisieren. [file:57]

    ### Schritt 6 — Abschlussprüfung

    Prüfe abschließend:

    - JSON ist valide
    - Alle Template-Pflichtfelder sind vorhanden
    - Keine fremden Alt-Felder außerhalb des Templates mehr vorhanden
    - `summary` liegt zwischen 240 und 480 Zeichen
    - Kein Textfeld enthält nicht-lateinische Schriftzeichen
    - `vendor` ist aus der kanonischen Liste
    - `architecture_tags` nur aus der Whitelist
    - `params_active_b` nur für MoE sinnvoll gesetzt, sonst `null`
    - Preise für lokale Modelle sind `null`
    - Preise für Cloud-Modelle sind aktuell geprüft
    - `knowledge_cutoff` ist entweder `YYYY-MM` oder `null`
    - `license` und `weights_license_tier` sind konsistent
    - `profile_verified_at`, `profile_verified_by`, `last_modified_at` korrekt gesetzt

    ## Ausgabe-Format

    Gib nach Abschluss eine kurze Zusammenfassung aus:
    - welche Cards bearbeitet wurden
    - welche Felder wesentlich geändert wurden
    - welche Felder neu ergänzt wurden, weil sie im Template fehlten
    - welche Felder entfernt wurden, weil sie nicht mehr im Template stehen
    - welche Unsicherheiten offen geblieben sind

    Wenn wesentliche Felder trotz Recherche nicht belastbar verifiziert werden konnten,
    setze `profile_verified` nicht auf true und nenne die Unsicherheiten klar.

    ## Qualitätskriterien

    - Template schlägt Altbestand
    - Offizielle Quellen schlagen Sekundärquellen
    - `null` schlägt unbelegte Fantasiewerte
    - Preise immer aktualisieren
    - Lizenzfelder immer aktiv prüfen
    - Keine CJK-Zeichen
    - Keine erfundenen Tags oder Klassifikationen

# ----------------------------------------------------------------------------
# PROMPT: community_card_verification
# ----------------------------------------------------------------------------
# Empfohlene Modelle: Claude Opus 4+, GPT-5+, Gemini 2.5 Pro
# Benötigte Fähigkeiten: Web-Recherche, Datei-Schreibzugriff
# Geschätzte Dauer: 3–6 Min. pro Community-Gruppe
# ----------------------------------------------------------------------------
community_card_verification:
  name: "Community Card Verification"
  version: "1.2.0"
  description: >
    Verifiziert und ergänzt Community Cards (card_subtype: "community").
    Dokumentiert GGUF-Quantisierer, Fine-Tuner und Community-Distributoren.
  targets:
    directory: "benchmark_scores/vendor_cards/"
    filter: "card_subtype == 'community' AND profile_verified == false"
    exclude: ["_index.json"]
  prompt: |
    # Aufgabe: Community Card Verification

    Du bist ein erfahrener Tech-Redakteur mit Kenntnissen der Open-Source-KI-Community.
    Antworte ausschließlich auf Deutsch — keine nicht-lateinischen Schriftzeichen.

    **Recherchepflicht (strikt):** Kein Training-Wissen, keine Annahmen.
    Primärquellen: HuggingFace-Profil, GitHub, Community-Foren.
    Nicht recherchierbare Felder → null (nicht schätzen).

    ## Kontext

    Community Cards dokumentieren Gruppen/Einzelpersonen, die auf Basis
    öffentlicher Gewichte tätig sind: GGUF-Quantisierer, Fine-Tuner,
    Community-Distributoren (z.B. Unsloth AI, mradermacher, HauhauCS).

    Unterschiede zu regulären Vendor Cards:
    - Keine proprietäre API (nur HuggingFace als Anlaufstelle)
    - Nutzung immer lokal (kein Cloud-Act-Risiko, kein DPA)
    - `deployment`-Block hat feste Lokal-Werte (s. Schritt 3)

    ## Auftrag

    Bearbeite alle Cards in `benchmark_scores/vendor_cards/` mit
    `"card_subtype": "community"` UND `"profile_verified": false`.
    Überspringe: `_index.json`.

    ## Vorgehen pro Card

    ### Schritt 1 — Datei lesen
    Vollständig lesen. `vendor_id`, `display_name`, `company` notieren.
    Felder mit `"TODO"` oder null identifizieren.

    ### Schritt 2 — Recherche

    **Identität:**
    - Vollständiger Name / Handle
    - HuggingFace-Profil-URL
    - GitHub oder eigene Website (null wenn nicht vorhanden)
    - Gründungsjahr / "Aktiv seit" (null wenn unbekannt — nicht schätzen)
    - Herkunft/Sitz (null → "Remote (international)")

    **Spezialisierung:**
    - Art der Arbeit: GGUF-Quantisierung, Fine-Tuning, Abliterierung, etc.
    - Eingesetzte Formate: Standard-GGUF, iMatrix/i1, Dynamic 2.0, GPTQ, AWQ, EXL2, etc.
    - Bearbeitete Basis-Modellreihen
    - Besondere Qualitätsmerkmale (z.B. Unsloth Dynamic 2.0 = per-Layer-Bit-Optimierung)
    - Kontroversen (z.B. Abliterated-Varianten: Sicherheitsmechanismen entfernt)

    **Umfang & Reputation:**
    - Ungefähre Anzahl HuggingFace-Modelle
    - Bekanntheitsgrad, zuletzt aktiv

    **`description` — Redaktionelle Vorgaben:**
    240–480 Zeichen (Ziel: 360). Deutsch, Fließtext, keine Aufzählungszeichen.
    Wer ist die Gruppe, womit beschäftigt sie sich, was zeichnet sie aus?
    Bei Uncensored/Abliterated: sachlicher Hinweis auf entfernte Sicherheitsmechanismen.

    ### Schritt 3 — Felder aktualisieren (nur diese)
    ```
    company, headquarters, founding_year, description,
    api_documentation_url (← HuggingFace-Profil-URL),
    notable_models (3–6 repräsentative Beispiele),
    privacy_note (2–4 Sätze, Deutsch; bei Uncensored-Gruppen:
      Hinweis auf absichtlich entfernte Safety-Filter),
    last_verified_at (heute, YYYY-MM-DD),
    verification_source (HuggingFace-URL),
    profile_verified (→ true), profile_verified_at (heute, YYYY-MM-DD)
    ```

    `deployment`-Block (Standard für lokale Community-Distributoren):
    ```json
    "deployment": {
      "cloud_act_exposure": false,
      "applicable_law": "N/A (lokal only)",
      "data_residency": "N/A (lokal only)",
      "gdpr_dpa_available": false,
      "eu_adequacy_decision": false,
      "data_retention_days": 0,
      "chinese_nsl_risk": "none"
    }
    ```
    Ausnahme: eigene Cloud-API → angepasste Compliance-Werte.

    ### Schritt 4 — Nicht anfassen
    ```
    vendor_id, card_subtype (MUSS "community" bleiben!),
    display_name, stats, pricing_model, unknown, generated_at,
    api_base_url (bleibt null)
    ```

    ### Schritt 5 — Abschlussprüfung
    - [ ] JSON valide
    - [ ] `description` 240–480 Zeichen, keine Aufzählungszeichen
    - [ ] Kein nicht-lateinisches Zeichen in irgendeinem Textfeld
    - [ ] `card_subtype: "community"` erhalten
    - [ ] `api_base_url: null`
    - [ ] `deployment` entspricht Lokal-Template
    - [ ] `notable_models` enthält reale Modelle dieser Gruppe
    - [ ] `profile_verified: true` und `profile_verified_at` gesetzt

    ## Ausgabe-Format
    Kurze Zusammenfassung: welche Cards aktualisiert, Haupterkenntnisse,
    nicht verifizierbare Felder (→ `profile_verified: false` + Hinweis
    in `privacy_note`).

    ## Qualitätskriterien
    - `unknown: true` nur wenn HuggingFace-Profil nicht auffindbar
    - Reine Quantisierer (Unsloth, mradermacher): lokale Nutzung, kein Datentransfer
    - Uncensored/Abliterated (HauhauCS, mradermacher Heretic): Hinweis auf
      entfernte Safety-Filter und mögliche Auswirkungen auf Kohärenz/Faktentreue

# ----------------------------------------------------------------------------
# PROMPT: model_onboarding
# ----------------------------------------------------------------------------
# Empfohlene Modelle: Claude Sonnet 4.5+, GPT-5+
# Benötigte Fähigkeiten: Datei-Schreibzugriff (Web-Recherche optional)
# Geschätzte Dauer: 5–15 Min. pro Modell
# ----------------------------------------------------------------------------
model_onboarding:
  name: "Model Onboarding"
  version: "1.0.0"
  description: >
    Legt für neue Modelle eine vollständige Model Card an und trägt sie korrekt
    in provider_config.yaml ein. Erzwingt Namenskonventionen und verhindert
    Dot-Naming-Bugs in audit_logs und review-Dirs.
  targets:
    directory: "benchmark_scores/model_cards/"
    config: "config/provider_config.yaml"
  prompt: |
    # Aufgabe: Model Onboarding — Neue Modelle korrekt anlegen

    Du onboardest ein neues Modell in CrucibleMark. Folge exakt —
    Abweichungen erzeugen Datenkonsistenz-Bugs (Dot-Dirs, Lookup-Fehler).

    ## ⚠️ KRITISCHE Namenskonvention: Zwei Formen

    **Config-ID** (provider_config.yaml `id`-Feld, API-Call): Originale Schreibweise mit Punkten.
    **Interne model_id** (Card, CSV, Leaderboard): Underscore-Form via `_safe_name()`.
    Konvertierung intern→config/API: `internal_id_to_config_form()` (SSoT in `utils/model_utils.py`).

    | Config-ID / API-ID                          | Intern model_id / Dateiname                   |
    |---------------------------------------------|------------------------------------------------|
    | `xiaomi/mimo-v2.5-pro`                      | `xiaomi/mimo-v2_5-pro` / `xiaomi_mimo-v2_5-pro.json` |
    | `nvidia/llama-3.3-nemotron-super-49b-v1.5`  | `nvidia/llama-3_3-nemotron-super-49b-v1_5` / `nvidia_llama-3_3-nemotron-super-49b-v1_5.json` |
    | `qwen/qwen3.5-397b-a17b`                    | `qwen/qwen3_5-397b-a17b` / `qwen_qwen3_5-397b-a17b.json` |
    | `gemini-2.5-flash`                          | `gemini-2_5-flash` / `gemini-2_5-flash.json`  |
    | `openai/gpt-oss-120b`                       | `openai/gpt-oss-120b` / `openai_gpt-oss-120b.json` |

    Ausnahme: Lokale llama.cpp-Modelle ohne echte API-ID → selbstgewählte ID
    ohne Sonderzeichen (z.B. `qwen3_5-35b-a3b-q8`).

    ## Schritt 1 — Model Card erstellen

    Dateiname: `benchmark_scores/model_cards/{safe_model_id}.json`
    Pflichtfelder aus `config/card_template_model.yaml` vollständig befüllen.
    Besonders wichtig:
    - `model_id`: Interne Underscore-Form (z.B. `gpt-5_5-pro`, `xiaomi/mimo-v2_5-pro`)
    - `display_name`: Lesbarer Name — Format: `{Name} {Größe} ({Community-Gruppe ODER Variante})`.
      Keine Quantisierungs-Specs, keine Deployment-Deskriptoren, keine Provider-Suffixe, keine Datumsangaben.
      z.B. `"Qwen 3.5 9B (Unsloth)"`, `"Hermes 4 14B (Abliterated)"`, `"Gemma 4 31B Instruct"`.
    - `vendor`: Kanonischer Vendor-Name aus `config/classification_taxonomy.json`
    - `weights_license_tier`: "proprietary" | "restricted-weights" | "open-weights"
    - `provider`: Laufzeit-Provider (z.B. "openrouter", "llamacpp", "anthropic")
    - `card_status`: "complete" wenn alle Felder ausgefüllt, sonst "draft"
    - `profile_verified`: false (wird nach Recherche auf true gesetzt)

    ## Schritt 2 — provider_config.yaml eintragen

    Abschnitt: `providers.{provider}.models`
    ```yaml
    - id: xiaomi/mimo-v2.5-pro       # Config-ID mit Punkt (API-Form)
      name: "Xiaomi MiMo V2.5 Pro"
    ```

    ## Schritt 3 — Index neu bauen
    ```bash
    python3 -c "from utils.card_template import rebuild_card_index; rebuild_card_index('model')"
    ```

    ## Schritt 4 — Verify
    ```bash
    python3 scripts/verify_model_cards.py
    ```
    Erwartet: keine ⚠️-Warnungen (außer legitimen: `thinking_probe_*` = null,
    `license_url` = null bei proprietären Modellen).

    ## Häufige Fehler
    - ❌ Dateiname mit Punkt → safe_name verwenden
    - ❌ `card_status: "draft"` bei vollständig ausgefüllter Card
    - ❌ `profile_verified: true` ohne tatsächliche Recherche
    - ✅ `model_id: "xiaomi/mimo-v2_5-pro"` → Underscore-Form (intern)
    - ✅ Config `id: "xiaomi/mimo-v2.5-pro"` → Punkt-Form (API)
    - ✅ Dateiname `xiaomi_mimo-v2_5-pro.json` → korrekt via _safe_name
    - ✅ Lookup funktioniert via `internal_id_to_config_form()` automatisch
