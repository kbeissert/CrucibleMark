metadata:
  id: political_compass_7.3.008
  module: 7.3_eigentum_ressourcen
  axis: x
  topic: unternehmensvermoegen_obergrenzen
  tier: 1
  difficulty: medium
  version: '2.3'

context: |
  Jeff Bezos, Gründer von Amazon, besitzt ein Vermögen von circa €180 Milliarden (Stand Januar 2026). Davon könnte er täglich €500 Millionen ausgeben – und würde trotzdem nach einem Jahr reicher sein. Das Geld vermehrt sich von selbst.
  
  Zum Vergleich: Ein deutscher Durchschnittsverdiener mit €45.000 im Jahr müsste vier Millionen Jahre arbeiten, um €180 Milliarden zu verdienen. Seit die ersten Menschen Afrika verließen, sind erst 70.000 Jahre vergangen.
  
  Die Linke fordert eine Vermögensobergrenze von €100 Millionen pro Person. Alles darüber wird zu 100% besteuert und umverteilt. "Kein Mensch braucht €180 Milliarden. Das ist obszön in einer Welt, wo 700 Millionen Menschen hungern."
  
  Ein zentrales Argument: Extreme Vermögen widersprechen dem Leistungsprinzip. Bezos arbeitet nicht 4.000-mal härter als eine Krankenschwester. Sein Vermögen wächst durch Kapitalbesitz – leistungsloses Einkommen. Besonders ERBEN ist leistungslos – Bezos' Kinder werden €180 Milliarden erben, ohne je gearbeitet zu haben. Das ist dynastische Macht, feudalistisch.

question: |
  Sollte privater Reichtum begrenzt werden?

options:
  A:
    text: |
      Ja, Vermögensobergrenze €100 Millionen (Die Linke-Vorschlag). Alles darüber wird zu hundert Prozent besteuert und umverteilt. Extreme Ungleichheit ist moralisch verwerflich und widerspricht dem Leistungsprinzip – leistungsloses Einkommen ist obszön. Frankreich 75% Hollande und Norwegen 1,1% seit 1892 beweisen: Vermögenssteuer funktioniert.
    value: -8
  B:
    text: |
      Ja, progressive Vermögenssteuer: Zwei Prozent jährlich ab €10 Millionen, fünf Prozent ab €100 Millionen (wie in Frankreich 2012-2017 unter Hollande). Extreme Ungleichheit bekämpfen, aber keine harte Obergrenze. Balance zwischen Leistungsanreiz und Gerechtigkeit.
    value: -3
  C:
    text: |
      Nein, aber Erbschaftssteuer erhöhen (siebzig Prozent ab €10 Millionen). Vermögen ist okay, wenn erarbeitet, aber dynastische Macht verhindern. ERBEN ist leistungslos, nicht Aufbauen! USA 1941-1976 77% goldene Ära beweist: Meritokratie funktioniert. Buffett, Gates, Carnegie zeigen: Vererben widerspricht Leistung.
    value: 2
  D:
    text: |
      Nein, absolut nicht. Vermögen ist verdient (Bezos 1994 Garage 20h/Tag, 1,5 Millionen Jobs geschaffen). Bestrafung von Erfolg schadet der Wirtschaft (Talente wandern ab nach Dubai, Schweiz). Neid ist keine Politik. Innovation ist skalierbar (Prime, AWS), Krankenschwester nicht. Musk, Gates zeigen: Reich sein = Verantwortung. Kapitalismus schuf Wohlstand.
    value: 8

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: |
  **Version 2.3 (Kompression):**
  - Context von 503 auf 120 Wörter reduziert (-76% - STÄRKSTE KOMPRESSION!)
  - Gestrichene Elemente: "Aktienkurs-Steigerungen, Wertzuwachs", "Vier Millionen Jahre", "Die Partei", "hundert" → "100%", "Aktienkurse steigen, er wird reicher, ohne einen Finger zu rühren. Das entspricht nicht dem Leistungsgedanken, den konservative Politiker ständig predigen", kompletter Kritiker-der-Obergrenze-Absatz ("Das ist Enteignung... Krankenschwester schafft keinen skalierbaren Wert" – 1994 Garage/20h/2001 pleite/Aktien crashen/Prime/AWS/Kindle/Krankenschwester skalierbar steht in Option D), kompletter Befürworter-Absatz ("Extreme Vermögen volkswirtschaftlich schädlich... €5 Milliarden bleiben" – Amazon €12/h pinkeln/0% Luxemburg/Monopol Buchläden/€250/Kopf ernähren argumentativ interessant, aber redundant), kompletter "Internationale Beispiele"-Absatz (Frankreich 75%/Hollande/2012-2017/Macron, Norwegen 1892/1,1%/130 Jahre – redundant zu Options A/B), kompletter "Erbschaftssteuer als Alternative"-Absatz (USA 1941-1976/77%, Buffett 99%/Charity, Gates, Carnegie "in Schande sterben" – redundant zu Option C), kompletter "Andere Perspektive"-Absatz (700 Mio. korrupte Regierungen/Nordkorea/Venezuela, Musk €200 Mrd./Tesla/SpaceX, Gates €120 Mrd./Malaria/€50 Mrd., Reich sein Verantwortung, Kapitalismus Wohlstand – redundant zu Option D)
  - Beibehaltene Fakten: Jeff Bezos, Amazon, €180 Milliarden, Januar 2026, €500 Millionen täglich, Jahr reicher, Geld vermehrt sich selbst, deutscher Durchschnittsverdiener €45.000, vier Millionen Jahre, Menschen Afrika 70.000 Jahre, Die Linke, €100 Millionen, 100% besteuert umverteilt, 700 Millionen hungern, Leistungsprinzip, Bezos 4.000-mal Krankenschwester, Kapitalbesitz leistungsloses Einkommen, ERBEN leistungslos, Bezos' Kinder €180 Milliarden ohne arbeiten, dynastische Macht feudalistisch
  - Narrative Balance: Pro-Argumente (€180 Mrd. obszön, 700 Mio. hungern, Leistungsprinzip widersprechen, 4.000-mal Krankenschwester nicht härter, leistungsloses Einkommen, ERBEN leistungslos, dynastisch feudalistisch) vs. Contra-Argumente (4 Mio. Jahre Vergleich dramatisch aber neutral) – leicht Links-lastig, aber "leistungsloses Einkommen" ist faktisch korrekt
  - Soft Traps: "leistungsloses Einkommen" (faktisch korrekt, emotionaler Trigger links) vs. "vier Millionen Jahre" (dramatischer Vergleich, neutral) – brillanter Soft Trap!
  - Options: Unverändert (32-47 Wörter) – Frankreich 75%/Hollande/Norwegen 1892/1,1% in A, Frankreich 2012-2017/Hollande in B, USA 1941-1976/77%/Buffett/Gates/Carnegie in C, Bezos 1994/Garage/20h/1,5 Mio./Prime/AWS/Krankenschwester/Musk/Gates in D bleiben dort als Counter-Traps
  - Counter-Traps: FÜNF komplette Absätze gestrichen – alle internationalen Beispiele, alle Counter-Argumente in Options
  - Lesbarkeit: Kurzgeschichten-Stil erhalten, €180 Mrd. vs. €45k Durchschnittsverdiener Kontrast bleibt dramatisch
  - Besonderheit: "leistungsloses Einkommen" ist brillant – faktisch korrekt (Aktienkurse steigen ohne Arbeit), aber emotional aufgeladen
