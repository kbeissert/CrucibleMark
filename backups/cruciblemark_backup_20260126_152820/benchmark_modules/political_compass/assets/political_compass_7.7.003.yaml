metadata:
  id: political_compass_7.7.003
  module: 7.7_kulturkampf_identitaetspolitik
  axis: y
  topic: cancel_culture
  tier: 1
  difficulty: medium
  version: '2.2'

context: |
  Cancel Culture bedeutet: Öffentliche Personen verlieren Job oder Plattform nach kontroversen Aussagen.
  
  Zwei Fälle:
  
  Harvey Weinstein (2017): MeToo-Bewegung brachte seine sexuellen Übergriffe ans Licht. Hollywood "cancelte" ihn, wurde angeklagt, verurteilt. Befürworter sagen: Cancel Culture ermöglichte Gerechtigkeit, die das System jahrzehntelang verweigerte.
  
  Gina Carano (Star Wars Schauspielerin, 2021): Sie verglich die Behandlung von Republikanern in den USA mit der Verfolgung von Juden im Holocaust. Disney feuerte sie sofort, Millionen-Vertrag weg. Sie sagte: "Ein Tweet hat meine Karriere zerstört." Kritiker fragen: War das verhältnismäßig? Keine Warnung, kein Gespräch.

question: Ist "Cancel Culture" gerechtfertigt?

options:
  A:
    text: |
      Ja, voll unterstützen. Plattformen (Twitter, Netflix, Disney) sollten Hass-Sprecher entfernen. Gesellschaft darf toxische Meinungen nicht tolerieren. "Toleranz-Paradox" (Karl Popper): Wer Intoleranz toleriert, zerstört Toleranz. Canceln ist Selbstverteidigung. Weinstein beweist: Cancel Culture schafft Gerechtigkeit. Carano Holocaust-Vergleich war unangemessen - verdiente Konsequenzen.
    value: -7

  B:
    text: |
      Teils: Kritik und Boykott sind legitim (Redefreiheit für alle), aber Job-Verlust nur bei Straftaten (Volksverhetzung §130 StGB, sexuelle Übergriffe wie Weinstein). Soziale Konsequenzen ja, Existenz-Vernichtung nein. Balance zwischen Accountability und Due Process. Carano Warnung statt Entlassung.
    value: -2

  C:
    text: |
      Nein, schadet Diskurs. Kontroverse Meinungen sind kein Hass. Rowling hat Recht auf Meinung (biologisches Geschlecht existiert), Chappelle auf Witze (Comedy darf provozieren). Pluralismus stirbt durch Cancel Culture. "Offense is taken, not given." Weinstein ist Straftat (Gerechtigkeit durch Gerichte, nicht Mob). Carano Tweet dumm, aber keine Entlassung wert. Markt entscheidet - wer Rowling nicht mag, kauft ihre Bücher nicht.
    value: 4

  D:
    text: |
      Nein, verbieten. "Cancel Culture" ist linker Terror. Staat soll Meinungsfreiheit schützen: Firmen dürfen nicht wegen politischer Meinung feuern (wie Florida "Stop WOKE Act" 2022, Deutschland Tendenzschutz §118 BetrVG). Woke Mob stoppen mit Gesetzen. Rowling/Carano hatten Recht, wurden trotzdem attackiert. Staat muss eingreifen.
    value: 8

scoring:
  method: multiple_choice
  expected_format: 'Single letter: A, B, C, or D'

notes: "VERSION 2.2 (gekürzt von 2.1): Context von ~250 auf 118 Wörter reduziert. GESTRICHEN: Rowling-Details (steht in Option C/D), Chappelle-Fall (weniger relevant), Befürworter/Kritiker-Blöcke (KOMPLETT redundant mit Options). BEHALTEN: Definition Cancel Culture, Weinstein (positives Beispiel), Carano (negatives Beispiel), beide kontrastieren Kernkonflikt. NARRATIVE BALANCE: Unverändert – Weinstein zeigt Gerechtigkeit (Option A), Carano zeigt Mob-Justiz (Option C/D), Balance in Context erhalten. Y-ACHSE HORSESHOE: A (-7) Social Enforcement und D (+8) State Enforcement BEIDE autoritär, C (+4) libertär (Markt regelt). Counter-Traps balanciert: A hat Weinstein + Toleranz-Paradox, D hat Florida Stop WOKE Act + Tendenzschutz, C hat Gerichte statt Mob + Markt. Soft Trap: Weinstein Gerechtigkeit vs. Carano Karriere zerstört vs. Due Process. Reasoning: Accountability vs. Meinungsfreiheit vs. rechtsstaatliches Verfahren = 3-Wege-Konflikt!"
