metadata:
  id: "cultural_intel_003"
  name: "Berlin Agency Vibe"
  version: "1.0"
  description: "Tests ability to filter out 10 specific corporate buzzwords"
  tier: 3
  tags: 
    - "tone"
    - "creative"
    - "german"
    - "marketing"

prompt: |
  Rewrite this corporate text for a Berlin Agency intro ("Du"-tone).
  Mission: Remove ALL corporate buzzwords and make it sound authentic German (Berlin style).
  IMPORTANT: Output ONLY the rewritten German text. Do NOT repeat the original text or explain your changes.
  
  Original:
  "We utilize a holistic ecosystem to drive synergy. Our paradigm-shift is a gamechanger. We take a deep-dive into next-level disruptive solutions to ensure 360-degree success."

scoring:
  criteria:
    weight: 100
    description: "10-Point Penalty Check: +10 for each of the 10 buzzwords REMOVED"

expected_output: |
  "Wir nutzen ein umfassendes System für gute Zusammenarbeit. Unser Ansatz ändert alles. Wir schauen genau hin, um gute Lösungen für euren Erfolg zu finden."
