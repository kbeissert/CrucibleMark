server:
  host: localhost
  port: 8765
  mode: live               # mock | live — default ist live (card-research braucht echte Suche)
  idle_timeout_seconds: 0    # 0 = deaktiviert — Lebenszyklus liegt bei run_tooluse_benchmark.py
                               # (Modelle wie qwen3-coder-next-q8 Q8 brauchen 420s zum Laden;
                               #  ein Idle-Timeout < Modell-Startzeit würde den MCP-Server
                               #  vorzeitig beenden und alle 6 Tests auf "MCP nicht erreichbar" setzen)

web_search:
  provider: tavily             # tavily | duckduckgo — tavily ist primärer Provider
  fallback_provider: duckduckgo
  max_results: 3
  timeout_seconds: 10
  api_key_env: TAVILY_API_KEY  # Name der Env-Variable — Key selbst nie hier eintragen
  search_depth: basic          # basic | advanced

http_fetch:
  timeout_seconds: 8
  max_chars: 8000
  whitelist:               # Nur diese Domains dürfen gefetcht werden
    - llama.meta.com
    - huggingface.co
    - raw.githubusercontent.com
    - httpbin.org           # für 404-Test-Asset (tooluse003)
    - en.wikipedia.org      # für tooluse002 (Quake-Serie)

logging:
  log_file: logs/mcp_server.log
  log_level: INFO
